# nginx.conf - used by Dockerfile.web as /etc/nginx/conf.d/default.conf.
# nginx does two jobs here: it serves the built React files, and it forwards /api requests to the API container,
# so the browser only ever talks to ONE address (one origin: no CORS setup, and the API port is not exposed).
server {
    listen 80;
    server_name _;
    server_tokens off;   # do not announce the nginx version in the Server header and error pages

    root /usr/share/nginx/html;
    index index.html;

    # Anything under /api/ is passed on to the container named "api" (compose's network resolves that name to
    # the container's IP) on its port 8080. The path is forwarded unchanged: /api/accounts -> http://api:8080/api/accounts.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        # The API sees the proxy as its client; these headers say who really asked and over which scheme.
        # (Honouring them inside the API needs the ForwardedHeaders middleware, which this API does not use yet.)
        # $http_host keeps the port the browser used (e.g. localhost:8080); $host would drop it and
        # the API would build links such as Location: http://localhost/api/... without the port.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else is a static file from the React build. If the file does not exist, serve index.html and let
    # the React app decide what to show (needed when a client-side router handles URLs such as /accounts/3).
    location / {
        try_files $uri /index.html;
    }
}
