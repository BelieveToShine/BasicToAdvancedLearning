  <text x="220" y="438" text-anchor="middle" font-size="9.5" fill="#6b8a6b">paused — waiting for topic.Explain() to return</text>
  <rect x="460" y="144" width="320" height="82" rx="10" fill="#f9cb9c" stroke="#e69138" stroke-width="1.5"/>
  <text x="620.0" y="166" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7f4e00">RunningServer — server</text>
