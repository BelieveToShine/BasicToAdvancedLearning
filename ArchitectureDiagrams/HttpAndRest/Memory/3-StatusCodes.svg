  <text x="70" y="223" font-size="10" fill="#1b3d1b">noRedirectClient → pointer  (HttpClient)</text>
  <rect x="62" y="236" width="316" height="26" rx="4" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1"/>
  <text x="70" y="253" font-size="10" fill="#1b3d1b">moved → pointer  (HttpResponseMessage)</text>
  <rect x="62" y="266" width="316" height="26" rx="4" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1"/>
  <text x="70" y="283" font-size="10" fill="#1b3d1b">notFound → pointer  (HttpResponseMessage)</text>
  <rect x="62" y="296" width="316" height="26" rx="4" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1"/>
  <text x="70" y="313" font-size="10" fill="#1b3d1b">ex → pointer  (HttpRequestException)</text>
