  <polyline points="378,189 442,189 442,258 458,258" fill="none" stroke="#555" stroke-width="1.4" marker-end="url(#a)"/>
  <polyline points="378,219 434,219 434,334 458,334" fill="none" stroke="#555" stroke-width="1.4" marker-end="url(#a)"/>
  <polyline points="378,249 426,249 426,440 458,440" fill="none" stroke="#555" stroke-width="1.4" marker-end="url(#a)"/>
  <polyline points="378,279 418,279 418,546 458,546" fill="none" stroke="#555" stroke-width="1.4" marker-end="url(#a)"/>
  <polyline points="378,309 410,309 410,622 458,622" fill="none" stroke="#555" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="1200" y="118" width="90" height="130" rx="10" fill="#d5c9ea" stroke="#674ea7" stroke-width="1.5" stroke-dasharray="6 4" fill-opacity="0.25"/>
  <text x="1245" y="150" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#3d2a6b">Nothing</text>
  <text x="1245" y="166" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#3d2a6b">here yet</text>
  <text x="40" y="706" font-size="10.5" fill="#444"><tspan font-weight="bold">Only the two responses and the exception that the code still needs are locals; </tspan>the other calls (200, 201, 204, 400, 415, 500) were printed and disposed inside the Send helper.</text>
  <text x="40" y="724" font-size="10" font-style="italic" fill="#888">The exception exists because the code asked for it: HttpClient itself does not throw for 4xx or 5xx. Redirects are followed by default; noRedirectClient's handler turns that off so moved shows the 301.</text>
</svg>
