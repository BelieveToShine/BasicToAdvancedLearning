  <text x="480" y="497" font-size="10" fill="#7f4e00">Location: /api/accounts</text>
  <rect x="460" y="524" width="320" height="66" rx="10" fill="#f9cb9c" stroke="#e69138" stroke-width="1.5"/>
  <text x="620.0" y="546" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7f4e00">HttpResponseMessage — notFound</text>
  <rect x="472" y="556" width="296" height="26" rx="4" fill="#fff3e6" stroke="#e69138" stroke-width="1"/>
  <text x="480" y="573" font-size="10" fill="#7f4e00">StatusCode = 404 (NotFound)</text>
  <rect x="460" y="600" width="320" height="82" rx="10" fill="#f9cb9c" stroke="#e69138" stroke-width="1.5"/>
  <text x="620.0" y="622" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7f4e00">HttpRequestException — ex</text>
  <rect x="472" y="632" width="296" height="26" rx="4" fill="#fff3e6" stroke="#e69138" stroke-width="1"/>
  <text x="480" y="649" font-size="10" fill="#7f4e00">StatusCode = 404</text>
  <text x="474" y="673" font-size="8.5" font-style="italic" fill="#a06a1f">(plus a message; its wording is .NET's own, so not quoted)</text>
  <polyline points="780,189 794,189 794,258 782,258" fill="none" stroke="#555" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="860" y="144" width="330" height="250" rx="10" fill="#f1f1f1" stroke="#777777" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="1025.0" y="164" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#444444">OUTSIDE these variables — server side</text>
  <text x="874" y="184" font-size="9.5" font-weight="bold" fill="#333333">Status codes the server sent in this method:</text>
  <text x="874" y="200" font-size="9.5" fill="#333333">  200  OK</text>
  <text x="874" y="216" font-size="9.5" fill="#333333">  201  Created</text>
  <text x="874" y="232" font-size="9.5" fill="#333333">  204  No Content</text>
  <text x="874" y="248" font-size="9.5" fill="#333333">  301  Moved Permanently</text>
  <text x="874" y="264" font-size="9.5" fill="#333333">  400  Bad Request</text>
  <text x="874" y="280" font-size="9.5" fill="#333333">  404  Not Found</text>
  <text x="874" y="296" font-size="9.5" fill="#333333">  415  Unsupported Media Type</text>
  <text x="874" y="312" font-size="9.5" fill="#333333">  500  Internal Server Error</text>
  <text x="874" y="328" font-size="9.5" font-style="italic" fill="#777777">Server's accounts now: 1 Asha Rao, 2 Ben Carter,</text>
  <text x="874" y="344" font-size="9.5" font-style="italic" fill="#777777">4 Dana Ortiz (3 was deleted; the 400 added nothing).</text>
