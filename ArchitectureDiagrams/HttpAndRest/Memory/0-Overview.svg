<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#555"/></marker>
  </defs>
  <rect x="0" y="0" width="1100" height="540" fill="#ffffff"/>
  <text x="550" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a237e">HTTP &amp; REST — Memory: Stack / Heap / Static (high level)</text>
  <text x="550" y="46" text-anchor="middle" font-size="12" fill="#666">The program holds request and response OBJECTS; what travels between client and server is text, outside its memory.</text>
  <g font-size="11" fill="#333"><rect x="150" y="60" width="14" height="14" rx="2" fill="#b6d7a8" stroke="#6aa84f"/><text x="170" y="71">Stack</text></g>
  <g font-size="11" fill="#333"><rect x="330" y="60" width="14" height="14" rx="2" fill="#f9cb9c" stroke="#e69138"/><text x="350" y="71">Heap</text></g>
  <g font-size="11" fill="#333"><rect x="510" y="60" width="14" height="14" rx="2" fill="#d5c9ea" stroke="#674ea7"/><text x="530" y="71">Static</text></g>
  <text x="230" y="98" text-anchor="middle" font-size="12" font-weight="bold" fill="#3f6b3f">STACK — pointers, plus a few plain values</text>
  <text x="640" y="98" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a5a10">HEAP — the .NET objects the lesson holds</text>
  <text x="950" y="98" text-anchor="middle" font-size="12" font-weight="bold" fill="#3d2a6b">STATIC</text>
  <rect x="40" y="112" width="380" height="262" rx="8" fill="#b6d7a8" stroke="#6aa84f" stroke-width="2"/>
  <text x="230" y="132" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#274e13">One slot per local, in each method's own frame</text>
  <rect x="56" y="144" width="348" height="38" rx="4" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1"/>
  <text x="66" y="161" font-size="10" font-weight="bold" fill="#1b3d1b">server, client, request, fullUrl, response …</text>
  <text x="66" y="175" font-size="8.5" fill="#3f6b3f">ExplainRequestAndResponse()  — 7 pointers</text>
  <rect x="56" y="188" width="348" height="38" rx="4" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1"/>
  <text x="66" y="205" font-size="10" font-weight="bold" fill="#1b3d1b">server, client, 2 strings, wrongMethod</text>
  <text x="66" y="219" font-size="8.5" fill="#3f6b3f">ExplainHttpMethods()  — 5 pointers</text>
  <rect x="56" y="232" width="348" height="38" rx="4" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1"/>
  <text x="66" y="249" font-size="10" font-weight="bold" fill="#1b3d1b">server, client, noRedirectClient, moved, …</text>
  <text x="66" y="263" font-size="8.5" fill="#3f6b3f">ExplainStatusCodes()  — 6 pointers</text>
  <rect x="56" y="276" width="348" height="38" rx="4" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1"/>
  <text x="66" y="293" font-size="10" font-weight="bold" fill="#1b3d1b">account, webOptions, camel, created …</text>
  <text x="66" y="307" font-size="8.5" fill="#3f6b3f">ExplainJsonBodies()  — 10 pointers</text>
  <rect x="56" y="320" width="348" height="38" rx="4" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1"/>
  <text x="66" y="337" font-size="10" font-weight="bold" fill="#1b3d1b">server, client, created, location</text>
  <text x="66" y="351" font-size="8.5" fill="#3f6b3f">ExplainRestResources()  — 4 pointers</text>
  <rect x="450" y="112" width="380" height="262" rx="8" fill="#f9cb9c" stroke="#e69138" stroke-width="1.5"/>
  <text x="640" y="132" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7f4e00">The real objects — this is where the data is</text>
  <rect x="466" y="144" width="348" height="62" rx="6" fill="#ffffff" stroke="#f0c07a" stroke-width="1"/>
  <text x="640" y="170" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#7f4e00">RunningServer, HttpClient</text>
  <text x="640" y="188" text-anchor="middle" font-size="8.5" fill="#a06a1f">the HttpClient knows the server's address (Memory/1, 2, 3, 5)</text>
  <rect x="466" y="216" width="348" height="62" rx="6" fill="#ffffff" stroke="#f0c07a" stroke-width="1"/>
  <text x="640" y="242" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#7f4e00">HttpRequestMessage, HttpResponseMessage</text>
  <text x="640" y="260" text-anchor="middle" font-size="8.5" fill="#a06a1f">status code, headers and body of one exchange (Memory/1, 2, 3, 5)</text>
  <rect x="466" y="288" width="348" height="62" rx="6" fill="#ffffff" stroke="#f0c07a" stroke-width="1"/>
  <text x="640" y="314" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#7f4e00">Account objects and JSON strings</text>
  <text x="640" y="332" text-anchor="middle" font-size="8.5" fill="#a06a1f">the same data as C# properties or as JSON text (Memory/4)</text>
  <rect x="860" y="112" width="200" height="262" rx="10" fill="#d5c9ea" stroke="#674ea7" stroke-width="1.5" stroke-dasharray="6 4" fill-opacity="0.25"/>
  <text x="960" y="190" text-anchor="middle" font-size="11" font-weight="bold" fill="#3d2a6b">Nothing here yet</text>
  <text x="960" y="214" text-anchor="middle" font-size="10" fill="#5b4a7a">The lesson declares no</text>
  <text x="960" y="230" text-anchor="middle" font-size="10" fill="#5b4a7a">static fields of its own.</text>
  <rect x="450" y="392" width="610" height="92" rx="10" fill="#f1f1f1" stroke="#777777" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="755" y="414" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#444">OUTSIDE .NET — the network, and the server's side</text>
  <text x="464" y="434" font-size="9.5" fill="#333">On the wire: only text — a request line, header lines, a blank line, an optional body; and the same shape back.</text>
  <text x="464" y="450" font-size="9.5" fill="#333">Server side: the accounts list the server keeps. In a real API that is another program; here it runs in</text>
  <text x="464" y="466" font-size="9.5" font-style="italic" fill="#777">this same process, yet it is still not a local of any lesson method. Every Memory diagram draws this dashed box.</text>
  <text x="40" y="514" font-size="10.5" fill="#444"><tspan font-weight="bold">A response is an object, not the conversation.</tspan> HttpResponseMessage holds the status code and headers the server sent; the body is read from it once.</text>
</svg>
