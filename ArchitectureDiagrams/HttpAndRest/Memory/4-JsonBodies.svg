  <text x="40" y="1110" font-size="10.5" fill="#444"><tspan font-weight="bold">JSON is only text on the Heap until it is deserialized: </tspan>plain and camel are strings; account, wrongCase, fromCamel and created are real Account objects built from (or turned into) such text.</text>
  <text x="40" y="1128" font-size="10" font-style="italic" fill="#888">wrongCase shows the quiet failure: default options read "id" and "owner" as unknown names, so every property keeps its default. The server's own accounts list is not a local of this method.</text>
