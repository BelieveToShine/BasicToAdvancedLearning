<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 850" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#333"/></marker>
  </defs>
  <rect x="0" y="0" width="900" height="850" fill="#ffffff"/>
  <text x="450.0" y="20" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a237e">Request and response — Sub-level Flow: posting a letter and waiting for the reply</text>
  <text x="450.0" y="38" text-anchor="middle" font-size="11" fill="#666">The client writes a request, the server writes back a response. Both are just text with a fixed shape.</text>
  <text x="210" y="50" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#274e13">START</text>
  <line x1="210" y1="54" x2="210" y2="92" stroke="#333" stroke-width="2"/>
  <polygon points="210,54 210,72 240,63" fill="#38761d"/>
  <line x1="210" y1="92" x2="210" y2="100" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="40" y="100" width="340" height="60" rx="8" fill="#e8f4fb" stroke="#3d85c6" stroke-width="1.5"/>
  <text x="210.0" y="118" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a4a73">Write the letter (the request)</text>
  <text x="210.0" y="135" text-anchor="middle" font-size="9" fill="#333">new HttpRequestMessage(Get, "/api/accounts?owner=Asha")</text>
  <text x="210.0" y="150" text-anchor="middle" font-size="9" fill="#333">request.Headers.Add("Accept", …)</text>
  <line x1="210" y1="160" x2="210" y2="200" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="40" y="200" width="340" height="62" rx="8" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1.5"/>
  <text x="210.0" y="218" text-anchor="middle" font-size="10" font-weight="bold" fill="#274e13">Read what is written on it</text>
  <text x="210.0" y="235" text-anchor="middle" font-size="9" fill="#333">Console.WriteLine ×4: method, path, query, Accept</text>
  <text x="210.0" y="250" text-anchor="middle" font-size="9" fill="#333">(path and query come from the Uri fullUrl)</text>
  <line x1="210" y1="262" x2="210" y2="300" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="40" y="300" width="340" height="82" rx="8" fill="#fffbe8" stroke="#f1c232" stroke-width="1.5"/>
  <text x="210.0" y="318" text-anchor="middle" font-size="10" font-weight="bold" fill="#7f6000">Post it, and wait</text>
  <text x="210.0" y="335" text-anchor="middle" font-size="9" fill="#333">using HttpResponseMessage response = client.Send(request);</text>
  <text x="210.0" y="350" text-anchor="middle" font-size="9" fill="#333">blocks until the reply arrives</text>
  <text x="210.0" y="365" text-anchor="middle" font-size="9" fill="#333">(async/await comes later in the course)</text>
  <rect x="540" y="290" width="320" height="102" rx="8" fill="#f1f1f1" stroke="#777777" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="700.0" y="308" text-anchor="middle" font-size="10" font-weight="bold" fill="#444444">THE SERVER (BankApi, a minimal API)</text>
  <text x="700.0" y="325" text-anchor="middle" font-size="9" fill="#333">matches the route  GET /api/accounts</text>
  <text x="700.0" y="340" text-anchor="middle" font-size="9" fill="#333">keeps accounts whose owner contains "Asha"</text>
  <text x="700.0" y="355" text-anchor="middle" font-size="9" fill="#333">builds the reply: status, headers, JSON body</text>
  <text x="700.0" y="370" text-anchor="middle" font-size="9" font-style="italic" fill="#777">a separate program in real life</text>
  <line x1="380" y1="325" x2="540" y2="325" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="460" y="318" text-anchor="middle" font-size="9.5" fill="#555">request text</text>
  <line x1="540" y1="362" x2="382" y2="362" stroke="#333" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="460" y="377" text-anchor="middle" font-size="9.5" fill="#555">response text</text>
  <line x1="210" y1="382" x2="210" y2="420" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="40" y="420" width="340" height="62" rx="8" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1.5"/>
  <text x="210.0" y="438" text-anchor="middle" font-size="10" font-weight="bold" fill="#274e13">Read the reply</text>
  <text x="210.0" y="455" text-anchor="middle" font-size="9" fill="#333">Console.WriteLine ×3: status, Content-Type, body</text>
  <text x="210.0" y="470" text-anchor="middle" font-size="9" fill="#333">(the body can be read from the response only once)</text>
  <line x1="210" y1="482" x2="210" y2="520" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="40" y="520" width="340" height="82" rx="8" fill="#e8f4fb" stroke="#3d85c6" stroke-width="1.5"/>
  <text x="210.0" y="538" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a4a73">Do the same by hand, over plain TCP</text>
  <text x="210.0" y="555" text-anchor="middle" font-size="9" fill="#333">SendRawText(port, rawRequest)</text>
  <text x="210.0" y="570" text-anchor="middle" font-size="9" fill="#333">typed text: "GET /api/accounts/1 HTTP/1.1" …</text>
  <text x="210.0" y="585" text-anchor="middle" font-size="9" fill="#333">(no HttpClient: shows HTTP is text)</text>
  <rect x="540" y="510" width="320" height="102" rx="8" fill="#f1f1f1" stroke="#777777" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="700.0" y="528" text-anchor="middle" font-size="10" font-weight="bold" fill="#444444">THE SERVER again</text>
  <text x="700.0" y="545" text-anchor="middle" font-size="9" fill="#333">reads the typed text exactly as it read HttpClient's</text>
  <text x="700.0" y="560" text-anchor="middle" font-size="9" fill="#333">answers: status line, headers, then the body</text>
  <text x="700.0" y="575" text-anchor="middle" font-size="9" font-style="italic" fill="#777">the body arrives "chunked": its size, then 0</text>
  <line x1="380" y1="548" x2="540" y2="548" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="460" y="541" text-anchor="middle" font-size="9.5" fill="#555">raw request text</text>
  <line x1="540" y1="585" x2="382" y2="585" stroke="#333" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="460" y="600" text-anchor="middle" font-size="9.5" fill="#555">raw reply text</text>
  <line x1="210" y1="602" x2="210" y2="640" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="40" y="640" width="340" height="62" rx="8" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1.5"/>
  <text x="210.0" y="658" text-anchor="middle" font-size="10" font-weight="bold" fill="#274e13">Show both texts</text>
  <text x="210.0" y="675" text-anchor="middle" font-size="9" fill="#333">PrintIndented ×2 → Console.WriteLine once per line</text>
  <text x="210.0" y="690" text-anchor="middle" font-size="9" fill="#333">(the Date line is skipped: it changes every run)</text>
  <line x1="210" y1="702" x2="210" y2="738" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="210" y="744" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#990000">END</text>
  <line x1="210" y1="752" x2="210" y2="792" stroke="#333" stroke-width="2"/>
  <polygon points="210,752 210,770 240,761" fill="#cc0000"/>
  <text x="30" y="800" font-size="10.5" fill="#444"><tspan font-weight="bold">Request = method + path (+ ?query) + headers (+ body).</tspan> Response = status + headers + body. HttpClient writes and reads the text for you.</text>
  <text x="30" y="818" font-size="10" font-style="italic" fill="#888">Console.WriteLine: 4 request lines and 3 response lines, then 2 label lines and one line for each line of raw text printed.</text>
  <text x="30" y="836" font-size="10" font-style="italic" fill="#888">Each method also opens with PrintHeading(): two Console.WriteLine calls (a blank line and the title), not drawn.</text>
</svg>
