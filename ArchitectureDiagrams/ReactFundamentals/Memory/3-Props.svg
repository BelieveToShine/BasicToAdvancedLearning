<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 590" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#555"/></marker>
  </defs>
  <rect x="0" y="0" width="1050" height="590" fill="#ffffff"/>
  <text x="525.0" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a237e">React Fundamentals — 03 Props — Memory: where the data lives</text>
  <text x="525.0" y="46" text-anchor="middle" font-size="12" fill="#666">Snapshot: the user has just clicked "View CUR-2001"; the parent re-rendered and heard the answer.</text>
  <g font-size="11" fill="#333"><rect x="30" y="60" width="14" height="14" rx="2" fill="#b6d7a8" stroke="#6aa84f"/><text x="50" y="71">Props (read-only, owned by the parent)</text></g>
  <g font-size="11" fill="#333"><rect x="284" y="60" width="14" height="14" rx="2" fill="#f9cb9c" stroke="#e69138"/><text x="304" y="71">State (owned by the component)</text></g>
  <g font-size="11" fill="#333"><rect x="494" y="60" width="14" height="14" rx="2" fill="#d5c9ea" stroke="#674ea7"/><text x="514" y="71">Derived / computed during render</text></g>
  <g font-size="11" fill="#333"><rect x="715" y="60" width="14" height="14" rx="2" fill="#cfe2f3" stroke="#3d85c6"/><text x="735" y="71">Module data (file level)</text></g>
  <g font-size="11" fill="#333"><rect x="891" y="60" width="14" height="14" rx="2" fill="#f3f3f3" stroke="#888" stroke-dasharray="3 2"/><text x="911" y="71">DOM / browser</text></g>
  <text x="270.0" y="96" text-anchor="middle" font-size="11" font-weight="bold" fill="#3f6b3f">COMPONENTS — functions React calls, and the data each one holds</text>
  <text x="842.0" y="96" text-anchor="middle" font-size="11" font-weight="bold" fill="#555">DOM — what the browser shows</text>
  <rect x="84" y="110" width="416" height="126" rx="10" fill="#fafafa" stroke="#777" stroke-width="1.5"/>
  <text x="96" y="128" font-size="11" font-weight="bold" fill="#222">Lesson()  — the parent page</text>
  <rect x="94" y="136" width="396" height="38" rx="6" fill="#f9cb9c" stroke="#e69138" stroke-width="1.5"/>
  <text x="102" y="152" font-size="10" font-weight="bold" fill="#7f4e00">state  viewed   (preview, Topic 22; survives re-renders)</text>
  <text x="102" y="166" font-size="10" fill="#7f4e00">'CUR-2001'     (was 'nothing yet' before the click)</text>
  <rect x="94" y="182" width="396" height="38" rx="6" fill="#f9cb9c" stroke="#e69138" stroke-width="1.5"/>
  <text x="102" y="198" font-size="10" font-weight="bold" fill="#7f4e00">setViewed  — the state setter (preview, Topic 22)</text>
  <text x="102" y="212" font-size="10" fill="#7f4e00">a function handed down below as the prop onView</text>
  <rect x="84" y="270" width="416" height="108" rx="10" fill="#fafafa" stroke="#777" stroke-width="1.5"/>
  <text x="96" y="288" font-size="11" font-weight="bold" fill="#222">AccountCard() — Ben Carter</text>
  <rect x="94" y="296" width="396" height="66" rx="6" fill="#b6d7a8" stroke="#6aa84f" stroke-width="1.5"/>
  <text x="102" y="312" font-size="10" font-weight="bold" fill="#274e13">props  (read-only here)</text>
  <text x="102" y="326" font-size="10" fill="#274e13">owner 'Ben Carter' · number 'CUR-2001' · balance 1200</text>
  <text x="102" y="340" font-size="10" fill="#274e13">type 'Current'   (given by the parent)</text>
  <text x="102" y="354" font-size="10" fill="#274e13">onView  ƒ  = the parent’s setViewed</text>
  <rect x="84" y="392" width="416" height="108" rx="10" fill="#fafafa" stroke="#777" stroke-width="1.5"/>
  <text x="96" y="410" font-size="11" font-weight="bold" fill="#222">AccountCard() — Chen Li</text>
  <rect x="94" y="418" width="396" height="66" rx="6" fill="#b6d7a8" stroke="#6aa84f" stroke-width="1.5"/>
  <text x="102" y="434" font-size="10" font-weight="bold" fill="#274e13">props  (read-only here)</text>
  <text x="102" y="448" font-size="10" fill="#274e13">owner 'Chen Li' · number 'SAV-3001' · balance 0</text>
  <text x="102" y="462" font-size="10" fill="#274e13">type 'Savings'   (default used: parent gave none)</text>
  <text x="102" y="476" font-size="10" fill="#274e13">children  &lt;p&gt;Note: no deposits yet.&lt;/p&gt;</text>
  <polyline points="84,218 60,218 60,318 83,318" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
  <polyline points="84,218 60,218 60,440 83,440" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="68" y="250" text-anchor="start" font-size="9.5" font-style="italic" fill="#555">props DOWN: parent → child</text>
  <polyline points="500,364 626,364 626,201.0 501,201.0" fill="none" stroke="#cc0000" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="632" y="324" text-anchor="start" font-size="9.5" font-style="italic" fill="#cc0000">onView(number)</text>
  <text x="632" y="335" text-anchor="start" font-size="9.5" font-style="italic" fill="#cc0000">called UP: the</text>
  <text x="632" y="346" text-anchor="start" font-size="9.5" font-style="italic" fill="#cc0000">child calls the</text>
  <text x="632" y="357" text-anchor="start" font-size="9.5" font-style="italic" fill="#cc0000">parent’s function</text>
  <rect x="754" y="110" width="266" height="160" rx="10" fill="#f3f3f3" stroke="#888" stroke-width="1.8" stroke-dasharray="6 4"/>
  <text x="887.0" y="130" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#555">document</text>
  <text x="764" y="150" font-size="10" fill="#333">&lt;p data-testid="viewed"&gt;</text>
  <text x="764" y="165" font-size="10" fill="#333">  The parent last heard:</text>
  <text x="764" y="180" font-size="10" fill="#333">  &lt;strong&gt;CUR-2001&lt;/strong&gt;</text>
  <text x="764" y="195" font-size="10" fill="#333">&lt;/p&gt;</text>
  <text x="764" y="210" font-size="10" fill="#333"></text>
  <text x="764" y="225" font-size="10" fill="#999">three cards, each with its own</text>
  <text x="764" y="240" font-size="10" fill="#999">&lt;em&gt;(Savings|Current)&lt;/em&gt;; the Asha and</text>
  <text x="764" y="255" font-size="10" fill="#999">Ben cards also have a View button</text>
  <line x1="500" y1="146" x2="753" y2="146" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="582" y="140" text-anchor="middle" font-size="9.5" font-style="italic" fill="#555">React writes</text>
  <text x="292.0" y="516" text-anchor="middle" font-size="9.5" font-style="italic" fill="#777">Asha’s card (not drawn) is the same shape as Ben’s: its own props, type defaulted to 'Savings'.</text>
  <text x="30" y="544" font-size="10.5" fill="#444"><tspan font-weight="bold">Props flow down, never up. </tspan>Ben’s card cannot change viewed; it can only call onView, and the parent then changes its own state.</text>
  <text x="30" y="561" font-size="10" font-style="italic" fill="#888">Test proof: &gt; 03 Props (frozen props throw on assignment; default used for undefined, not null; onView called with SAV-1001).</text>
</svg>
