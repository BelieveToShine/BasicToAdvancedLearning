<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 930" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#333"/></marker>
  </defs>
  <rect x="0" y="0" width="1050" height="930" fill="#ffffff"/>
  <text x="525.0" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a237e">React Fundamentals — Architecture: the five pieces of a React page</text>
  <text x="525.0" y="46" text-anchor="middle" font-size="12" fill="#666">Each piece is one lesson file. Each exists because the previous one hit a limit, so they are drawn as one chain.</text>
  <rect x="30" y="100" width="640" height="126" rx="10" fill="#e8f4fb" stroke="#3d85c6" stroke-width="1.8"/>
  <text x="44" y="120" font-size="12" font-weight="bold" fill="#1a4a73">01  JSX</text>
  <text x="656" y="120" text-anchor="end" font-size="10" font-style="italic" fill="#666">01-Jsx.jsx</text>
  <text x="48" y="146" font-size="10.5" fill="#222">&lt;h3 className="statement-title"&gt;</text>
  <text x="48" y="166" font-size="10.5" fill="#222">  Statement for {customer.name}</text>
  <text x="48" y="186" font-size="10.5" fill="#222">&lt;/h3&gt;</text>
  <text x="48" y="206" font-size="10.5" fill="#222">&lt;&gt; … &lt;/&gt;   &lt;br /&gt;   style={{ … }}</text>
  <line x1="230" y1="226" x2="230" y2="254" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="240" y="243" text-anchor="start" font-size="9.5" font-style="italic" fill="#555">wrap the markup in a named function</text>
  <rect x="30" y="254" width="640" height="126" rx="10" fill="#fffbe8" stroke="#f1c232" stroke-width="1.8"/>
  <text x="44" y="274" font-size="12" font-weight="bold" fill="#7f6000">02  Components</text>
  <text x="656" y="274" text-anchor="end" font-size="10" font-style="italic" fill="#666">02-Components.jsx</text>
  <text x="48" y="300" font-size="10.5" fill="#222">function AccountCard({ … }) { return &lt;div&gt;…&lt;/div&gt;; }</text>
  <text x="48" y="320" font-size="10.5" fill="#222">function AccountList() {</text>
  <text x="48" y="340" font-size="10.5" fill="#222">  return &lt;AccountCard owner="Asha Rao" … /&gt;; }</text>
  <line x1="230" y1="380" x2="230" y2="408" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="240" y="397" text-anchor="start" font-size="9.5" font-style="italic" fill="#555">give each use its own inputs</text>
  <rect x="30" y="408" width="640" height="126" rx="10" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1.8"/>
  <text x="44" y="428" font-size="12" font-weight="bold" fill="#274e13">03  Props</text>
  <text x="656" y="428" text-anchor="end" font-size="10" font-style="italic" fill="#666">03-Props.jsx</text>
  <text x="48" y="454" font-size="10.5" fill="#222">function AccountCard({ owner, balance,</text>
  <text x="48" y="474" font-size="10.5" fill="#222">   type = 'Savings', onView, children })</text>
  <text x="48" y="494" font-size="10.5" fill="#222">&lt;AccountCard type="Current" onView={setViewed} /&gt;</text>
  <line x1="230" y1="534" x2="230" y2="562" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="240" y="551" text-anchor="start" font-size="9.5" font-style="italic" fill="#555">repeat the piece for every item</text>
  <rect x="30" y="562" width="640" height="126" rx="10" fill="#fdebd9" stroke="#e69138" stroke-width="1.8"/>
  <text x="44" y="582" font-size="12" font-weight="bold" fill="#8a5a10">04  Lists and keys</text>
  <text x="656" y="582" text-anchor="end" font-size="10" font-style="italic" fill="#666">04-ListsAndKeys.jsx</text>
  <text x="48" y="608" font-size="10.5" fill="#222">list.map((a, i) =&gt; (</text>
  <text x="48" y="628" font-size="10.5" fill="#222">  &lt;li key={useIndexKey ? i : a.id}&gt; … &lt;/li&gt;</text>
  <text x="48" y="648" font-size="10.5" fill="#222">))</text>
  <line x1="230" y1="688" x2="230" y2="716" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="240" y="705" text-anchor="start" font-size="9.5" font-style="italic" fill="#555">choose what each piece shows</text>
  <rect x="30" y="716" width="640" height="126" rx="10" fill="#f0eaf7" stroke="#8e63ce" stroke-width="1.8"/>
  <text x="44" y="736" font-size="12" font-weight="bold" fill="#4a2e73">05  Conditional rendering</text>
  <text x="656" y="736" text-anchor="end" font-size="10" font-style="italic" fill="#666">05-ConditionalRendering.jsx</text>
  <text x="48" y="762" font-size="10.5" fill="#222">{ transactions.length &gt; 0 ? &lt;ul&gt;…&lt;/ul&gt;</text>
  <text x="48" y="782" font-size="10.5" fill="#222">  : &lt;p&gt;No transactions yet.&lt;/p&gt; }</text>
  <text x="48" y="802" font-size="10.5" fill="#222">{ balance &lt; 0 &amp;&amp; &lt;strong&gt;OVERDRAWN&lt;/strong&gt; }</text>
  <rect x="710" y="100" width="310" height="70" rx="8" fill="#f3f3f3" stroke="#888" stroke-width="1.5"/>
  <text x="865.0" y="123.0" text-anchor="middle" font-size="10" font-weight="bold" fill="#444">src/lessons/ReactFundamentals/</text>
  <text x="865.0" y="137.0" text-anchor="middle" font-size="10" fill="#333">NN-*.jsx  (5 files)</text>
  <text x="865.0" y="151.0" text-anchor="middle" font-size="10" fill="#333">each: export default function Lesson()</text>
  <line x1="865.0" y1="170" x2="865.0" y2="230" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="875.0" y="205" text-anchor="start" font-size="9.5" font-style="italic" fill="#555">import.meta.glob finds files</text>
  <rect x="710" y="230" width="310" height="64" rx="8" fill="#f3f3f3" stroke="#888" stroke-width="1.5"/>
  <text x="865.0" y="250.0" text-anchor="middle" font-size="10" font-weight="bold" fill="#444">App.jsx — the lesson picker</text>
  <text x="865.0" y="264.0" text-anchor="middle" font-size="10" fill="#333">one nav button per file, in name order</text>
  <text x="865.0" y="278.0" text-anchor="middle" font-size="10" fill="#333">title = the exported title string</text>
  <line x1="865.0" y1="294" x2="865.0" y2="354" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="875.0" y="329" text-anchor="start" font-size="9.5" font-style="italic" fill="#555">click: render that Lesson</text>
  <rect x="710" y="354" width="310" height="70" rx="8" fill="#f3f3f3" stroke="#888" stroke-width="1.8" stroke-dasharray="6 4"/>
  <text x="865.0" y="377.0" text-anchor="middle" font-size="10" font-weight="bold" fill="#444">The browser page</text>
  <text x="865.0" y="391.0" text-anchor="middle" font-size="10" fill="#333">Lesson → components → elements</text>
  <text x="865.0" y="405.0" text-anchor="middle" font-size="10" fill="#333">React writes the DOM</text>
  <rect x="710" y="470" width="310" height="112" rx="8" fill="#fffef5" stroke="#c9b458" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="865.0" y="500.0" text-anchor="middle" font-size="10" font-weight="bold" fill="#6b5a00">ReactFundamentals.test.jsx</text>
  <text x="865.0" y="514.0" text-anchor="middle" font-size="10" fill="#333">imports the exports of the five lesson files</text>
  <text x="865.0" y="528.0" text-anchor="middle" font-size="10" fill="#333">vitest + React Testing Library</text>
  <text x="865.0" y="542.0" text-anchor="middle" font-size="10" fill="#333">36 tests, one group per lesson:</text>
  <text x="865.0" y="556.0" text-anchor="middle" font-size="10" fill="#333">every claim in the lesson comments is checked</text>
  <text x="30" y="880" font-size="10.5" fill="#444"><tspan font-weight="bold">Run it: </tspan>npm run dev in frontend/ (pick a lesson in the sidebar); npx vitest run proves the claims.</text>
  <text x="30" y="897" font-size="10" font-style="italic" fill="#888">Plain JavaScript + JSX, React 19, no UI libraries, no CSS framework. Props/state/derived colours are used in the Memory diagrams.</text>
</svg>
