<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 750" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#333"/></marker>
  </defs>
  <rect x="0" y="0" width="900" height="750" fill="#ffffff"/>
  <text x="450.0" y="20" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a237e">React Fundamentals — 01 JSX — Sub-level Flow: blueprint to building</text>
  <text x="450.0" y="38" text-anchor="middle" font-size="11" fill="#666">JSX is a blueprint written in JavaScript. A compiler turns it into plain objects; React builds the DOM from them.</text>
  <text x="330" y="50" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#274e13">START</text>
  <line x1="330" y1="54" x2="330" y2="92" stroke="#333" stroke-width="2"/>
  <polygon points="330,54 330,72 360,63" fill="#38761d"/>
  <line x1="330" y1="92" x2="330" y2="100" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="120" y="100" width="420" height="64" rx="8" fill="#e8f4fb" stroke="#3d85c6" stroke-width="1.5"/>
  <text x="330.0" y="120.25" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#1a4a73">You write JSX  (01-Jsx.jsx)</text>
  <text x="330.0" y="133.75" text-anchor="middle" font-size="9.5" fill="#333">&lt;h3 className="statement-title"&gt;</text>
  <text x="330.0" y="147.25" text-anchor="middle" font-size="9.5" fill="#333">Statement for {customer.name}&lt;/h3&gt;</text>
  <line x1="330" y1="164" x2="330" y2="232" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="340" y="196.0" text-anchor="start" font-size="9.5" font-style="italic" fill="#555">Vite compiles it BEFORE</text>
  <text x="340" y="207.0" text-anchor="start" font-size="9.5" font-style="italic" fill="#555">the browser runs it</text>
  <rect x="120" y="232" width="420" height="64" rx="8" fill="#fffbe8" stroke="#f1c232" stroke-width="1.5"/>
  <text x="330.0" y="252.25" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#7f6000">Compiled output: a plain function call</text>
  <text x="330.0" y="265.75" text-anchor="middle" font-size="9.5" fill="#333">jsxs('h3', { className: 'statement-title',</text>
  <text x="330.0" y="279.25" text-anchor="middle" font-size="9.5" fill="#333">children: [ 'Statement for ', customer.name ] })</text>
  <line x1="330" y1="296" x2="330" y2="364" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="340" y="328.0" text-anchor="start" font-size="9.5" font-style="italic" fill="#555">{ customer.name } is just</text>
  <text x="340" y="339.0" text-anchor="start" font-size="9.5" font-style="italic" fill="#555">JavaScript: it gives 'Asha Rao'</text>
  <rect x="120" y="364" width="420" height="64" rx="8" fill="#f0eaf7" stroke="#8e63ce" stroke-width="1.5"/>
  <text x="330.0" y="384.25" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#4a2e73">React element — a plain object</text>
  <text x="330.0" y="397.75" text-anchor="middle" font-size="9.5" fill="#333">{ type: 'h3', props: { className: 'statement-title',</text>
  <text x="330.0" y="411.25" text-anchor="middle" font-size="9.5" fill="#333">children: [ 'Statement for ', 'Asha Rao' ] } }</text>
  <line x1="330" y1="428" x2="330" y2="496" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="340" y="460.0" text-anchor="start" font-size="9.5" font-style="italic" fill="#555">React reads the description and</text>
  <text x="340" y="471.0" text-anchor="start" font-size="9.5" font-style="italic" fill="#555">writes real DOM from it</text>
  <rect x="120" y="496" width="420" height="64" rx="8" fill="#f3f3f3" stroke="#888" stroke-width="1.8" stroke-dasharray="6 4"/>
  <text x="330.0" y="516.25" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#555">Real DOM  (what the browser draws)</text>
  <text x="330.0" y="529.75" text-anchor="middle" font-size="9.5" fill="#333">&lt;h3 class="statement-title"&gt;Statement for Asha Rao&lt;/h3&gt;</text>
  <text x="330.0" y="543.25" text-anchor="middle" font-size="9.5" fill="#333">className became the class attribute</text>
  <line x1="330" y1="560" x2="330" y2="588" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="330" y="596" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#990000">END</text>
  <line x1="330" y1="604" x2="330" y2="644" stroke="#333" stroke-width="2"/>
  <polygon points="330,604 330,622 360,613" fill="#cc0000"/>
  <rect x="590" y="232" width="290" height="104" rx="6" fill="#fffef5" stroke="#c9b458" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="600" y="248" font-size="10" font-weight="bold" fill="#6b5a00">The five rules on this page</text>
  <text x="600" y="264" font-size="9.5" fill="#444">{ } holds any JavaScript EXPRESSION</text>
  <text x="600" y="278" font-size="9.5" fill="#444">className, not class (a reserved word)</text>
  <text x="600" y="292" font-size="9.5" fill="#444">&lt;br /&gt; and &lt;input /&gt; must be closed</text>
  <text x="600" y="306" font-size="9.5" fill="#444">&lt;&gt; … &lt;/&gt; : one root, adds no DOM element</text>
  <text x="600" y="320" font-size="9.5" fill="#444">style={{ color: … }} : an object in { }</text>
  <text x="30" y="666" font-size="10.5" fill="#444"><tspan font-weight="bold">A JSX tag does not touch the page. </tspan>It describes it; React does the drawing.</text>
  <text x="30" y="683" font-size="10" font-style="italic" fill="#888">(simplified: real elements also carry key/ref/$$typeof; dev builds call jsxDEV)</text>
  <text x="30" y="700" font-size="10" font-style="italic" fill="#888">No Console output here: a React lesson prints into the page itself, and ReactFundamentals.test.jsx checks what it shows.</text>
</svg>
