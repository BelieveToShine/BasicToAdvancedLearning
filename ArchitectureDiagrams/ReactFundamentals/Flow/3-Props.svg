<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 750" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#333"/></marker>
  </defs>
  <rect x="0" y="0" width="900" height="750" fill="#ffffff"/>
  <text x="450.0" y="20" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a237e">React Fundamentals — 03 Props — Sub-level Flow: an order form that goes down, a phone call that goes up</text>
  <text x="450.0" y="38" text-anchor="middle" font-size="11" fill="#666">The parent fills in the form (props). The child only reads it. To answer, the child phones the number the parent gave it.</text>
  <text x="300" y="50" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#274e13">START</text>
  <line x1="300" y1="54" x2="300" y2="92" stroke="#333" stroke-width="2"/>
  <polygon points="300,54 300,72 330,63" fill="#38761d"/>
  <line x1="300" y1="92" x2="300" y2="96" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="50" y="96" width="500" height="66" rx="8" fill="#e8f4fb" stroke="#3d85c6" stroke-width="1.5"/>
  <text x="300.0" y="117.25" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#1a4a73">Parent writes attributes</text>
  <text x="300.0" y="130.75" text-anchor="middle" font-size="9.5" fill="#333">&lt;AccountCard owner="Ben Carter" number="CUR-2001" balance={1200}</text>
  <text x="300.0" y="144.25" text-anchor="middle" font-size="9.5" fill="#333">type="Current" onView={setViewed} /&gt;</text>
  <line x1="300" y1="162" x2="300" y2="200" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="310" y="179.0" text-anchor="start" font-size="9.5" font-style="italic" fill="#555">React collects the attributes</text>
  <rect x="50" y="200" width="500" height="52" rx="8" fill="#fffbe8" stroke="#f1c232" stroke-width="1.5"/>
  <text x="300.0" y="221.0" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#7f6000">React packs them into ONE props object</text>
  <text x="300.0" y="234.5" text-anchor="middle" font-size="9.5" fill="#333">{ owner, number, balance, type, onView }  — frozen in development</text>
  <line x1="300" y1="252" x2="300" y2="290" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="310" y="269.0" text-anchor="start" font-size="9.5" font-style="italic" fill="#555">passed as the function's only argument</text>
  <rect x="50" y="290" width="500" height="52" rx="8" fill="#fffbe8" stroke="#f1c232" stroke-width="1.5"/>
  <text x="300.0" y="311.0" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#7f6000">Child unpacks it (destructuring) and fills defaults</text>
  <text x="300.0" y="324.5" text-anchor="middle" font-size="9.5" fill="#333">{ owner, number, balance, type = 'Savings', onView, children }</text>
  <line x1="300" y1="342" x2="300" y2="380" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="310" y="359.0" text-anchor="start" font-size="9.5" font-style="italic" fill="#555">child reads props, never writes them</text>
  <rect x="50" y="380" width="500" height="52" rx="8" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1.5"/>
  <text x="300.0" y="401.0" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#274e13">Child returns JSX  →  DOM</text>
  <text x="300.0" y="414.5" text-anchor="middle" font-size="9.5" fill="#333">card 'Ben Carter (Current)' and a button 'View CUR-2001'</text>
  <line x1="300" y1="432" x2="300" y2="470" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="310" y="449.0" text-anchor="start" font-size="9.5" font-style="italic" fill="#555">user clicks the button</text>
  <rect x="50" y="470" width="500" height="52" rx="8" fill="#fdebd9" stroke="#e69138" stroke-width="1.5"/>
  <text x="300.0" y="491.0" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#8a5a10">Child calls the function it was given</text>
  <text x="300.0" y="504.5" text-anchor="middle" font-size="9.5" fill="#333">onView('CUR-2001')   — that function is the parent's setViewed</text>
  <line x1="300" y1="522" x2="300" y2="560" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="310" y="539.0" text-anchor="start" font-size="9.5" font-style="italic" fill="#555">setViewed('CUR-2001') = state update</text>
  <rect x="50" y="560" width="500" height="60" rx="8" fill="#f0eaf7" stroke="#8e63ce" stroke-width="1.5"/>
  <text x="300.0" y="585.0" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#4a2e73">Parent state changed (preview, Topic 22) → React re-renders it</text>
  <text x="300.0" y="598.5" text-anchor="middle" font-size="9.5" fill="#333">page now says: The parent last heard: CUR-2001</text>
  <polyline points="550,590 600,590 600,129 551,129" fill="none" stroke="#cc0000" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="612" y="330" text-anchor="start" font-size="9.5" font-style="italic" fill="#cc0000">the parent runs again</text>
  <text x="612" y="341" text-anchor="start" font-size="9.5" font-style="italic" fill="#cc0000">and passes props again:</text>
  <text x="612" y="352" text-anchor="start" font-size="9.5" font-style="italic" fill="#cc0000">the loop repeats on</text>
  <text x="612" y="363" text-anchor="start" font-size="9.5" font-style="italic" fill="#cc0000">every click</text>
  <rect x="612" y="420" width="270" height="104" rx="6" fill="#fffef5" stroke="#c9b458" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="622" y="436" font-size="10" font-weight="bold" fill="#6b5a00">Also on this page</text>
  <text x="622" y="452" font-size="9.5" fill="#444">Default: type is 'Savings' if left out</text>
  <text x="622" y="466" font-size="9.5" fill="#444">(undefined), but null stays null</text>
  <text x="622" y="480" font-size="9.5" fill="#444">children = text between the tags</text>
  <text x="622" y="494" font-size="9.5" fill="#444">Data flows DOWN as props;</text>
  <text x="622" y="508" font-size="9.5" fill="#444">answers go UP by calling a function</text>
  <text x="30" y="700" font-size="10.5" fill="#444"><tspan font-weight="bold">Read-only inputs: </tspan>a child that wants something different makes a new value or asks the parent (through a function prop) to change its own state.</text>
  <text x="30" y="717" font-size="10" font-style="italic" fill="#888">useState in the lesson is only a preview: state is Topic 22. Nothing is printed to a console.</text>
</svg>
