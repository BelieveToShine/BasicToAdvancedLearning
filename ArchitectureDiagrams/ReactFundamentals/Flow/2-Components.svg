<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#333"/></marker>
  </defs>
  <rect x="0" y="0" width="900" height="660" fill="#ffffff"/>
  <text x="450.0" y="20" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a237e">React Fundamentals — 02 Components — Sub-level Flow: one stamp, three prints</text>
  <text x="450.0" y="38" text-anchor="middle" font-size="11" fill="#666">A component is a stamp (a function). React presses it once per tag you write, each time with its own ink (props).</text>
  <text x="450" y="50" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#274e13">START</text>
  <line x1="450" y1="54" x2="450" y2="92" stroke="#333" stroke-width="2"/>
  <polygon points="450,54 450,72 480,63" fill="#38761d"/>
  <line x1="450" y1="92" x2="450" y2="100" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="250" y="100" width="400" height="50" rx="8" fill="#e8f4fb" stroke="#3d85c6" stroke-width="1.5"/>
  <text x="450.0" y="120.0" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#1a4a73">Lesson shows  &lt;AccountList /&gt;</text>
  <text x="450.0" y="133.5" text-anchor="middle" font-size="9.5" fill="#333">capitalised tag = your function</text>
  <line x1="450" y1="150" x2="450" y2="200" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="460" y="173.0" text-anchor="start" font-size="9.5" font-style="italic" fill="#555">React calls AccountList()</text>
  <rect x="250" y="200" width="400" height="50" rx="8" fill="#fffbe8" stroke="#f1c232" stroke-width="1.5"/>
  <text x="450.0" y="220.0" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#7f6000">AccountList() returns descriptions</text>
  <text x="450.0" y="233.5" text-anchor="middle" font-size="9.5" fill="#333">&lt;AccountCard … /&gt;  ×3</text>
  <polyline points="450,250 450,282 150,282 150,310" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <polyline points="450,250 450,310" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <polyline points="450,250 450,282 750,282 750,310" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="462" y="270" text-anchor="start" font-size="9.5" font-style="italic" fill="#555">React calls AccountCard(props) once per tag</text>
  <rect x="30" y="310" width="240" height="70" rx="8" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1.5"/>
  <text x="150.0" y="333.25" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#274e13">AccountCard()  call #1</text>
  <text x="150.0" y="346.75" text-anchor="middle" font-size="9.5" fill="#333">props: owner 'Asha Rao'</text>
  <text x="150.0" y="360.25" text-anchor="middle" font-size="9.5" fill="#333">SAV-1001 · 454.5</text>
  <rect x="330" y="310" width="240" height="70" rx="8" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1.5"/>
  <text x="450.0" y="333.25" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#274e13">AccountCard()  call #2</text>
  <text x="450.0" y="346.75" text-anchor="middle" font-size="9.5" fill="#333">props: owner 'Ben Carter'</text>
  <text x="450.0" y="360.25" text-anchor="middle" font-size="9.5" fill="#333">CUR-2001 · 1200</text>
  <rect x="630" y="310" width="240" height="70" rx="8" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1.5"/>
  <text x="750.0" y="333.25" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#274e13">AccountCard()  call #3</text>
  <text x="750.0" y="346.75" text-anchor="middle" font-size="9.5" fill="#333">props: owner 'Chen Li'</text>
  <text x="750.0" y="360.25" text-anchor="middle" font-size="9.5" fill="#333">SAV-3001 · 0</text>
  <polyline points="150,380 150,410 450,410 450,436" fill="none" stroke="#333" stroke-width="1.6"/>
  <polyline points="450,380 450,436" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <polyline points="750,380 750,410 450,410 450,436" fill="none" stroke="#333" stroke-width="1.6"/>
  <text x="462" y="427" text-anchor="start" font-size="9.5" font-style="italic" fill="#555">each call returns a card &lt;div&gt;</text>
  <rect x="250" y="436" width="400" height="64" rx="8" fill="#f3f3f3" stroke="#888" stroke-width="1.8" stroke-dasharray="6 4"/>
  <text x="450.0" y="456.25" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#555">Real DOM</text>
  <text x="450.0" y="469.75" text-anchor="middle" font-size="9.5" fill="#333">three card &lt;div&gt;s inside one &lt;div&gt; from AccountList</text>
  <text x="450.0" y="483.25" text-anchor="middle" font-size="9.5" fill="#333">AccountList decides WHICH cards; AccountCard decides how one looks</text>
  <line x1="450" y1="500" x2="450" y2="528" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="450" y="536" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#990000">END</text>
  <line x1="450" y1="544" x2="450" y2="584" stroke="#333" stroke-width="2"/>
  <polygon points="450,544 450,562 480,553" fill="#cc0000"/>
  <text x="30" y="600" font-size="10.5" fill="#444"><tspan font-weight="bold">Lowercase would not work: </tspan>&lt;accountcard /&gt; is looked up as an HTML tag name (its type is the string), not as your function.</text>
  <text x="30" y="617" font-size="10" font-style="italic" fill="#888">No Console output here: a React lesson prints into the page itself, and ReactFundamentals.test.jsx checks what it shows.</text>
</svg>
