  <text x="575.0" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a237e">TheWholeApp: Memory: where the data lives</text>
  <text x="575.0" y="46" text-anchor="middle" font-size="12" fill="#666">Instant: account 6 (ACC-2002, just opened, 10.00 deposited) and a 50.00 withdrawal refused with 422. Nothing was written for the refusal.</text>
