  <text x="1021.0" y="403.0" font-size="9.5" font-style="italic" fill="#444">renders</text>
  <text x="40" y="534" font-size="10.5" font-style="italic" fill="#777">The 422 is shown from the error held in MoneyForm state; the balance shown above it still comes from the last GET (10.00): it never changed.</text>
  <text x="40" y="552" font-size="10.5" font-style="italic" fill="#777">screen, version, typed text and errors live only in the browser tab and vanish on refresh; accounts and transactions are in SQL Server.</text>
