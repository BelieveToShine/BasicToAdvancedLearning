<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 580" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#333"/></marker>
  </defs>
  <rect x="0" y="0" width="1150" height="580" fill="#ffffff"/>
  <text x="575.0" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a237e">MoneyForm: Memory: where the data lives</text>
  <text x="575.0" y="46" text-anchor="middle" font-size="12" fill="#666">Instant: a 25.50 deposit to account 2 has just been recorded and the account re-fetched. React never added 25.50 to anything.</text>
  <g font-size="11" fill="#333"><rect x="61.0" y="60" width="14" height="14" rx="2" fill="#b6d7a8" stroke="#6aa84f"/><text x="81.0" y="71">props (read-only, from the parent)</text></g>
  <g font-size="11" fill="#333"><rect x="305.0" y="60" width="14" height="14" rx="2" fill="#f9cb9c" stroke="#e69138"/><text x="325.0" y="71">state (owned by a component)</text></g>
  <g font-size="11" fill="#333"><rect x="513.0" y="60" width="14" height="14" rx="2" fill="#d5c9ea" stroke="#674ea7"/><text x="533.0" y="71">derived / formatted</text></g>
  <g font-size="11" fill="#333"><rect x="667.0" y="60" width="14" height="14" rx="2" fill="#f4f4f4" stroke="#999999"/><text x="687.0" y="71">DOM (browser output)</text></g>
  <g font-size="11" fill="#333"><rect x="827.0" y="60" width="14" height="14" rx="2" fill="#e8edf3" stroke="#4a5d70"/><text x="847.0" y="71">SQL Server rows (outside the browser)</text></g>
  <rect x="30" y="84" width="1090" height="118" rx="10" fill="#f4f6f8" stroke="#4a5d70" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text transform="translate(48,143.0) rotate(-90)" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#555">SQL SERVER</text>
  <rect x="30" y="234" width="1090" height="150" rx="10" fill="#fafafa" stroke="#bbbbbb" stroke-width="1" stroke-dasharray="5 4"/>
  <text transform="translate(48,309.0) rotate(-90)" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#555">REACT STATE</text>
  <rect x="30" y="416" width="1090" height="100" rx="10" fill="#f4f4f4" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text transform="translate(48,466.0) rotate(-90)" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#555">DOM</text>
  <rect x="505" y="106" width="160" height="84" rx="8" fill="#e8edf3" stroke="#4a5d70" stroke-width="1.5"/>
  <text x="585.0" y="123" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#222">Accounts row</text>
  <text x="585.0" y="140" text-anchor="middle" font-size="9.5" fill="#333">AccountId 2, ACC-1002</text>
  <text x="585.0" y="155" text-anchor="middle" font-size="9.5" fill="#333">Balance 1226.00</text>
  <text x="585.0" y="170" text-anchor="middle" font-size="9.5" fill="#333">(was 1200.50)</text>
  <rect x="720" y="106" width="160" height="84" rx="8" fill="#e8edf3" stroke="#4a5d70" stroke-width="1.5"/>
  <text x="800.0" y="123" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#222">Transactions rows</text>
  <text x="800.0" y="140" text-anchor="middle" font-size="9.5" fill="#333">#5 Deposit 25.50 (new)</text>
  <text x="800.0" y="155" text-anchor="middle" font-size="9.5" fill="#333">#2 Deposit 1200.50</text>
  <text x="800.0" y="170" text-anchor="middle" font-size="9.5" fill="#333">newest = highest id</text>
  <rect x="75" y="258" width="160" height="100" rx="8" fill="#f9cb9c" stroke="#e69138" stroke-width="1.5"/>
  <text x="155.0" y="275" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#222">MoneyForm state</text>
  <text x="155.0" y="292" text-anchor="middle" font-size="9.5" fill="#333">kind "Deposit", amount ""</text>
  <text x="155.0" y="307" text-anchor="middle" font-size="9.5" fill="#333">busy false, error null</text>
  <text x="155.0" y="322" text-anchor="middle" font-size="9.5" fill="#333">done {transactionId: 5}</text>
  <rect x="290" y="258" width="160" height="100" rx="8" fill="#f9cb9c" stroke="#e69138" stroke-width="1.5"/>
  <text x="370.0" y="275" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#222">AccountScreen state</text>
  <text x="370.0" y="292" text-anchor="middle" font-size="9.5" fill="#333">version = 1</text>
  <text x="370.0" y="307" text-anchor="middle" font-size="9.5" fill="#333">(was 0 before the</text>
  <text x="370.0" y="322" text-anchor="middle" font-size="9.5" fill="#333">deposit)</text>
  <rect x="505" y="258" width="160" height="100" rx="8" fill="#f9cb9c" stroke="#e69138" stroke-width="1.5"/>
  <text x="585.0" y="275" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#222">account (useLoad)</text>
  <text x="585.0" y="292" text-anchor="middle" font-size="9.5" fill="#333">data.balance = 1226</text>
  <text x="585.0" y="307" text-anchor="middle" font-size="9.5" fill="#333">AccountDetail: props</text>
  <text x="585.0" y="322" text-anchor="middle" font-size="9.5" fill="#333">id = 2, version = 1</text>
  <rect x="720" y="258" width="160" height="100" rx="8" fill="#f9cb9c" stroke="#e69138" stroke-width="1.5"/>
  <text x="800.0" y="275" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#222">txns (useLoad)</text>
  <text x="800.0" y="292" text-anchor="middle" font-size="9.5" fill="#333">data[0].transactionId = 5</text>
  <text x="800.0" y="307" text-anchor="middle" font-size="9.5" fill="#333">data[1].transactionId = 2</text>
  <rect x="75" y="440" width="160" height="64" rx="8" fill="#f4f4f4" stroke="#999999" stroke-width="1.5"/>
  <text x="155.0" y="457" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#222">input + status</text>
  <text x="155.0" y="474" text-anchor="middle" font-size="9.5" fill="#333">amount cleared;</text>
  <text x="155.0" y="489" text-anchor="middle" font-size="9.5" fill="#333">"Recorded Deposit #5..."</text>
  <rect x="505" y="440" width="160" height="64" rx="8" fill="#f4f4f4" stroke="#999999" stroke-width="1.5"/>
  <text x="585.0" y="457" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#222">summary line</text>
  <text x="585.0" y="474" text-anchor="middle" font-size="9.5" fill="#333">&lt;strong&gt;1226.00&lt;/strong&gt;</text>
  <rect x="720" y="440" width="160" height="64" rx="8" fill="#f4f4f4" stroke="#999999" stroke-width="1.5"/>
  <text x="800.0" y="457" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#222">first row</text>
  <text x="800.0" y="474" text-anchor="middle" font-size="9.5" fill="#333">&lt;tr&gt; 5 Deposit 25.50</text>
  <polyline points="155.0,258 155.0,226 555.0,226 555.0,190" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="205.0" y="235" font-size="9.5" font-style="italic" fill="#444">POST {kind: "Deposit",</text>
  <text x="205.0" y="246" font-size="9.5" font-style="italic" fill="#444">amount: 25.5}</text>
  <polyline points="615.0,190 615.0,258" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="621.0" y="228.0" font-size="9.5" font-style="italic" fill="#444">GET account</text>
  <polyline points="800.0,190 800.0,258" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="806.0" y="228.0" font-size="9.5" font-style="italic" fill="#444">GET transactions</text>
  <polyline points="235,308 290,308" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="262.5" y="291" text-anchor="middle" font-size="9.5" font-style="italic" fill="#444">onDone</text>
  <text x="262.5" y="302" text-anchor="middle" font-size="9.5" font-style="italic" fill="#444">-&gt; version</text>
  <polyline points="450,340 505,340" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="477.5" y="312" text-anchor="middle" font-size="9.5" font-style="italic" fill="#444">version</text>
  <text x="477.5" y="323" text-anchor="middle" font-size="9.5" font-style="italic" fill="#444">re-runs</text>
  <text x="477.5" y="334" text-anchor="middle" font-size="9.5" font-style="italic" fill="#444">GETs</text>
  <polyline points="155.0,358 155.0,440" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="161.0" y="403.0" font-size="9.5" font-style="italic" fill="#444">renders</text>
  <polyline points="585.0,358 585.0,440" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="591.0" y="403.0" font-size="9.5" font-style="italic" fill="#444">renders</text>
  <polyline points="800.0,358 800.0,440" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="806.0" y="403.0" font-size="9.5" font-style="italic" fill="#444">renders</text>
  <text x="40" y="534" font-size="10.5" font-style="italic" fill="#777">The POST changes TWO rows in one database transaction (the Balance and a new Transactions row). Its 201 answer does not contain the balance.</text>
  <text x="40" y="552" font-size="10.5" font-style="italic" fill="#777">So the new balance (1226.00) reaches the screen only through the second GET: the API stays the single source of truth for money.</text>
</svg>
