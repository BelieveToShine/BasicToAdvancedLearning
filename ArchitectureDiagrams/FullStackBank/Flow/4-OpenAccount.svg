<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 572" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#333"/></marker>
  </defs>
  <rect x="0" y="0" width="1080" height="572" fill="#ffffff"/>
  <text x="540.0" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a237e">OpenAccount: Sub-level Flow: ordering at a restaurant</text>
  <text x="540.0" y="46" text-anchor="middle" font-size="12" fill="#666">A new dish is added to the menu: the kitchen assigns its number. A second dish with the same name is refused.</text>
  <g font-size="11" fill="#333"><rect x="233.0" y="60" width="14" height="14" rx="2" fill="#e8f4fb" stroke="#3d85c6"/><text x="253.0" y="71">React (browser)</text></g>
  <g font-size="11" fill="#333"><rect x="363.0" y="60" width="14" height="14" rx="2" fill="#f9cb9c" stroke="#e69138"/><text x="383.0" y="71">React state</text></g>
  <g font-size="11" fill="#333"><rect x="469.0" y="60" width="14" height="14" rx="2" fill="#fffbe8" stroke="#f1c232"/><text x="489.0" y="71">Vite dev-server proxy</text></g>
  <g font-size="11" fill="#333"><rect x="635.0" y="60" width="14" height="14" rx="2" fill="#d5c9ea" stroke="#674ea7"/><text x="655.0" y="71">Web API (C#)</text></g>
  <g font-size="11" fill="#333"><rect x="747.0" y="60" width="14" height="14" rx="2" fill="#f4f4f4" stroke="#999999"/><text x="767.0" y="71">SQL Server</text></g>
  <rect x="40" y="100" width="190" height="84" rx="8" fill="#e8f4fb" stroke="#3d85c6" stroke-width="1.5"/>
  <text x="135.0" y="117" text-anchor="middle" font-size="11" font-weight="bold" fill="#222">Submit the form</text>
  <text x="135.0" y="134" text-anchor="middle" font-size="10" fill="#333">customer "1", number</text>
  <text x="135.0" y="149" text-anchor="middle" font-size="10" fill="#333">"ACC-2001", type "Savings"</text>
  <rect x="310" y="100" width="190" height="84" rx="8" fill="#f9cb9c" stroke="#e69138" stroke-width="1.5"/>
  <text x="405.0" y="117" text-anchor="middle" font-size="11" font-weight="bold" fill="#222">onSubmit handler</text>
  <text x="405.0" y="134" text-anchor="middle" font-size="10" fill="#333">busy = true, Number("1") = 1</text>
  <text x="405.0" y="149" text-anchor="middle" font-size="10" fill="#333">api.openAccount(1, ...)</text>
  <rect x="580" y="100" width="190" height="84" rx="8" fill="#e8f4fb" stroke="#3d85c6" stroke-width="1.5"/>
  <text x="675.0" y="117" text-anchor="middle" font-size="11" font-weight="bold" fill="#222">POST /api/accounts</text>
  <text x="675.0" y="134" text-anchor="middle" font-size="10" fill="#333">{customerId:1,</text>
  <text x="675.0" y="149" text-anchor="middle" font-size="10" fill="#333">accountNumber:"ACC-2001",...}</text>
  <rect x="850" y="100" width="190" height="84" rx="8" fill="#d5c9ea" stroke="#674ea7" stroke-width="1.5"/>
  <text x="945.0" y="117" text-anchor="middle" font-size="11" font-weight="bold" fill="#222">Controller Create</text>
  <text x="945.0" y="134" text-anchor="middle" font-size="10" fill="#333">body valid? customer 1</text>
  <text x="945.0" y="149" text-anchor="middle" font-size="10" fill="#333">exists? then Accounts.Add</text>
  <rect x="40" y="254" width="190" height="84" rx="8" fill="#f4f4f4" stroke="#999999" stroke-width="1.5"/>
  <text x="135.0" y="271" text-anchor="middle" font-size="11" font-weight="bold" fill="#222">SQL Server INSERT</text>
  <text x="135.0" y="288" text-anchor="middle" font-size="10" fill="#333">new row, AccountId 5</text>
  <text x="135.0" y="303" text-anchor="middle" font-size="10" fill="#333">(IDENTITY), Balance 0.00</text>
  <rect x="310" y="254" width="190" height="84" rx="8" fill="#d5c9ea" stroke="#674ea7" stroke-width="1.5"/>
  <text x="405.0" y="271" text-anchor="middle" font-size="11" font-weight="bold" fill="#222">201 + Location + JSON</text>
  <text x="405.0" y="288" text-anchor="middle" font-size="10" fill="#333">the new account, with</text>
  <text x="405.0" y="303" text-anchor="middle" font-size="10" fill="#333">accountId: 5</text>
  <rect x="580" y="254" width="190" height="84" rx="8" fill="#f9cb9c" stroke="#e69138" stroke-width="1.5"/>
  <text x="675.0" y="271" text-anchor="middle" font-size="11" font-weight="bold" fill="#222">onCreated(account)</text>
  <text x="675.0" y="288" text-anchor="middle" font-size="10" fill="#333">parent keeps it; screen =</text>
  <text x="675.0" y="303" text-anchor="middle" font-size="10" fill="#333">"list": list mounts again</text>
  <rect x="850" y="254" width="190" height="84" rx="8" fill="#e8f4fb" stroke="#3d85c6" stroke-width="1.5"/>
  <text x="945.0" y="271" text-anchor="middle" font-size="11" font-weight="bold" fill="#222">GET /api/accounts</text>
  <text x="945.0" y="288" text-anchor="middle" font-size="10" fill="#333">4 rows, the new one is</text>
  <text x="945.0" y="303" text-anchor="middle" font-size="10" fill="#333">in the table</text>
  <rect x="40" y="408" width="190" height="84" rx="8" fill="#e8f4fb" stroke="#3d85c6" stroke-width="1.5"/>
  <text x="135.0" y="425" text-anchor="middle" font-size="11" font-weight="bold" fill="#222">Submit ACC-1001</text>
  <text x="135.0" y="442" text-anchor="middle" font-size="10" fill="#333">same form; number already</text>
  <text x="135.0" y="457" text-anchor="middle" font-size="10" fill="#333">used by account 1</text>
  <rect x="310" y="408" width="190" height="84" rx="8" fill="#f4f4f4" stroke="#999999" stroke-width="1.5"/>
  <text x="405.0" y="425" text-anchor="middle" font-size="11" font-weight="bold" fill="#222">SQL: UNIQUE index</text>
  <text x="405.0" y="442" text-anchor="middle" font-size="10" fill="#333">the INSERT is refused</text>
  <text x="405.0" y="457" text-anchor="middle" font-size="10" fill="#333">(duplicate AccountNumber)</text>
  <rect x="580" y="408" width="190" height="84" rx="8" fill="#d5c9ea" stroke="#674ea7" stroke-width="1.5"/>
  <text x="675.0" y="425" text-anchor="middle" font-size="11" font-weight="bold" fill="#222">Exception handler</text>
  <text x="675.0" y="442" text-anchor="middle" font-size="10" fill="#333">maps the SQL error to</text>
  <text x="675.0" y="457" text-anchor="middle" font-size="10" fill="#333">409 problem+json</text>
  <rect x="850" y="408" width="190" height="84" rx="8" fill="#f9cb9c" stroke="#e69138" stroke-width="1.5"/>
  <text x="945.0" y="425" text-anchor="middle" font-size="11" font-weight="bold" fill="#222">Form shows the 409</text>
  <text x="945.0" y="442" text-anchor="middle" font-size="10" fill="#333">"409 Duplicate value";</text>
  <text x="945.0" y="457" text-anchor="middle" font-size="10" fill="#333">typed values stay</text>
  <polyline points="230,142.0 310,142.0" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="270.0" y="134.0" text-anchor="middle" font-size="9.5" font-style="italic" fill="#444">handler</text>
  <polyline points="500,142.0 580,142.0" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="540.0" y="134.0" text-anchor="middle" font-size="9.5" font-style="italic" fill="#444">POST</text>
  <polyline points="770,142.0 850,142.0" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="810.0" y="134.0" text-anchor="middle" font-size="9.5" font-style="italic" fill="#444">via proxy</text>
  <polyline points="945.0,184 945.0,219.0 135.0,219.0 135.0,254" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="540.0" y="213.0" text-anchor="middle" font-size="9.5" font-style="italic" fill="#444">INSERT</text>
  <polyline points="230,296.0 310,296.0" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="270.0" y="288.0" text-anchor="middle" font-size="9.5" font-style="italic" fill="#444">ok</text>
  <polyline points="500,296.0 580,296.0" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="540.0" y="288.0" text-anchor="middle" font-size="9.5" font-style="italic" fill="#444">resolves</text>
  <polyline points="770,296.0 850,296.0" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="810.0" y="288.0" text-anchor="middle" font-size="9.5" font-style="italic" fill="#444">list loads</text>
  <polyline points="945.0,338 945.0,373.0 135.0,373.0 135.0,408" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="540.0" y="367.0" text-anchor="middle" font-size="9.5" font-style="italic" fill="#444">second case</text>
  <polyline points="230,450.0 310,450.0" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="270.0" y="442.0" text-anchor="middle" font-size="9.5" font-style="italic" fill="#444">POST</text>
  <polyline points="500,450.0 580,450.0" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="540.0" y="442.0" text-anchor="middle" font-size="9.5" font-style="italic" fill="#444">DB error</text>
  <polyline points="770,450.0 850,450.0" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="810.0" y="442.0" text-anchor="middle" font-size="9.5" font-style="italic" fill="#444">catch</text>
  <text x="40" y="532" font-size="10.5" font-style="italic" fill="#777">Real values from a run against the API: ACC-2001 became accountId 5 (id 4 was used up by the refused duplicate: a refused insert still uses up an IDENTITY value).</text>
  <text x="40" y="550" font-size="10.5" font-style="italic" fill="#777">The API has no customers endpoint, so the customer id is typed (1 Asha Rao, 2 Ben Carter, 3 Chen Li). Unknown id gives 400 with errors.customerId.</text>
</svg>
