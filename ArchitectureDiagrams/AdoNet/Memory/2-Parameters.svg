  <text x="1245" y="166" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#3d2a6b">here yet</text>
  <text x="40" y="692" font-size="10.5" fill="#444"><tspan font-weight="bold">The parameter's Value points at the SAME string as attackerInput, and SQL Server receives it as DATA, not as SQL text. </tspan>storedName is a different string object holding equal text.</text>
  <text x="40" y="710" font-size="10" font-style="italic" fill="#888">unsafeSql was glued together from pieces, so the server read the attacker's text as SQL and ran the DROP TABLE. Both scratch tables are dropped by the last line of the method.</text>
