  <rect x="460" y="355" width="300" height="96" rx="10" fill="#f9cb9c" stroke="#e69138" stroke-width="1.5"/>
  <text x="610.0" y="377" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7f4e00">SqlCommand — command</text>
  <rect x="472" y="387" width="276" height="26" rx="4" fill="#fff3e6" stroke="#e69138" stroke-width="1"/>
  <text x="480" y="404" font-size="10" fill="#7f4e00">Connection → pointer (SqlConnection)</text>
  <rect x="472" y="417" width="276" height="26" rx="4" fill="#fff3e6" stroke="#e69138" stroke-width="1"/>
  <text x="480" y="434" font-size="10" fill="#7f4e00">CommandText → pointer (string)</text>
  <rect x="460" y="471" width="260" height="30" rx="6" fill="#fff3e6" stroke="#e69138" stroke-width="1.5"/>
