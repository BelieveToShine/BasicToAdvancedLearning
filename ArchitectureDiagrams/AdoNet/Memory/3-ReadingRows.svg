  <rect x="460" y="511" width="260" height="30" rx="6" fill="#fff3e6" stroke="#e69138" stroke-width="1.5"/>
  <text x="590.0" y="530.0" text-anchor="middle" font-size="10" fill="#7f4e00">"ACC-2001"</text>
  <rect x="850" y="415" width="300" height="30" rx="6" fill="#fff3e6" stroke="#e69138" stroke-width="1.5"/>
  <text x="1000.0" y="434.0" text-anchor="middle" font-size="10" fill="#7f4e00">"SELECT c.FullName, a.AccountNumber, …"</text>
