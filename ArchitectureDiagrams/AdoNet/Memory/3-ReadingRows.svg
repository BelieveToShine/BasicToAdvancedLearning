  <text x="220" y="558" text-anchor="middle" font-size="9.5" fill="#6b8a6b">paused — waiting for topic.Explain() to return</text>
  <rect x="460" y="137" width="300" height="82" rx="10" fill="#f9cb9c" stroke="#e69138" stroke-width="1.5"/>
