  <polyline points="760,284 785,284 785,198 762,198" fill="none" stroke="#555" stroke-width="1.4" marker-end="url(#a)"/>
  <polyline points="760,400 805,400 805,165 762,165" fill="none" stroke="#555" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="850" y="144" width="340" height="154" rx="10" fill="#f1f1f1" stroke="#777777" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="1020.0" y="164" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#444444">OUTSIDE .NET — SQL Server: the result rows</text>
  <text x="864" y="184" font-size="9.5" font-weight="bold" fill="#333333">FullName   | AccountNumber | Balance</text>
  <text x="864" y="200" font-size="9.5" fill="#333333">Asha Rao   | ACC-1001      | 1000.00</text>
  <text x="864" y="216" font-size="9.5" fill="#333333">Asha Rao   | ACC-1002      | 250.50</text>
  <text x="864" y="232" font-size="9.5" font-weight="bold" fill="#333333">Ben Carter | ACC-2001      | 500.00   ← reader is here</text>
  <text x="864" y="248" font-size="9.5" fill="#333333">Chen Li    | NULL          | NULL</text>
  <text x="864" y="264" font-size="9.5" fill="#333333">Read() pulls the next row; SqlClient may already</text>
  <text x="864" y="280" font-size="9.5" fill="#333333">have received some of them in its buffer.</text>
  <line x1="378" y1="159" x2="458" y2="159" stroke="#555" stroke-width="1.4" marker-end="url(#a)"/>
  <polyline points="378,189 444,189 444,377 458,377" fill="none" stroke="#555" stroke-width="1.4" marker-end="url(#a)"/>
  <polyline points="378,219 436,219 436,261 458,261" fill="none" stroke="#555" stroke-width="1.4" marker-end="url(#a)"/>
  <polyline points="378,339 428,339 428,486.0 458,486.0" fill="none" stroke="#555" stroke-width="1.4" marker-end="url(#a)"/>
  <polyline points="378,369 420,369 420,526.0 458,526.0" fill="none" stroke="#555" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="1200" y="118" width="90" height="130" rx="10" fill="#d5c9ea" stroke="#674ea7" stroke-width="1.5" stroke-dasharray="6 4" fill-opacity="0.25"/>
  <text x="1245" y="150" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#3d2a6b">Nothing</text>
  <text x="1245" y="166" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#3d2a6b">here yet</text>
  <text x="40" y="606" font-size="10.5" fill="#444"><tspan font-weight="bold">The reader is a Heap object that walks the result one row at a time; the rows are SQL Server's, not the program's. </tspan>fullName and accountNumber are new strings copied out of row 3; balance is a decimal, so it sits inline on the Stack.</text>
  <text x="40" y="624" font-size="10" font-style="italic" fill="#888">The three column numbers were looked up once with GetOrdinal. For Chen Li the account columns are NULL, so IsDBNull is true and the loop uses continue.</text>
</svg>
