  <text x="610.0" y="261" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7f4e00">SqlDataReader — reader</text>
  <rect x="472" y="271" width="276" height="26" rx="4" fill="#fff3e6" stroke="#e69138" stroke-width="1"/>
  <text x="480" y="288" font-size="10" fill="#7f4e00">Connection → pointer (SqlConnection)</text>
