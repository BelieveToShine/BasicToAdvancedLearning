<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 800" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#333"/></marker>
  </defs>
  <rect x="0" y="0" width="900" height="800" fill="#ffffff"/>
  <text x="450.0" y="20" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a237e">Parameters — Sub-level Flow: the order form and the sealed envelope</text>
  <text x="450.0" y="38" text-anchor="middle" font-size="11" fill="#666">A parameter sends the VALUE in its own envelope, so the server does not run it as SQL. Gluing text together can. (Parameters protect VALUES, not table or column names.)</text>
  <text x="210" y="50" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#274e13">START</text>
  <line x1="210" y1="54" x2="210" y2="92" stroke="#333" stroke-width="2"/>
  <polygon points="210,54 210,72 240,63" fill="#38761d"/>
  <line x1="210" y1="92" x2="210" y2="104" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="520" y="70" width="300" height="650" rx="10" fill="#f1f1f1" stroke="#777777" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="670" y="88" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#444">SQL Server — OUTSIDE .NET</text>
  <rect x="60" y="104" width="300" height="64" rx="8" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1.5"/>
  <text x="210" y="122" text-anchor="middle" font-size="10" font-weight="bold" fill="#274e13">insert.Parameters.AddWithValue("@name", …)</text>
  <text x="210" y="137" text-anchor="middle" font-size="9.5" fill="#555">Parameters.Add("@email", SqlDbType.NVarChar, 200)</text>
  <text x="210" y="154" text-anchor="middle" font-size="9" font-style="italic" fill="#555">Console: "Inserted a customer … 1 row affected."</text>
  <line x1="360" y1="124" x2="520" y2="124" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="440" y="117" text-anchor="middle" font-size="9" fill="#555">INSERT … @name, @email</text>
  <line x1="520" y1="148" x2="362" y2="148" stroke="#333" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="440" y="161" text-anchor="middle" font-size="9" fill="#555">returns 1</text>
  <rect x="540" y="106" width="260" height="60" rx="8" fill="#ffffff" stroke="#999999" stroke-width="1.2"/>
  <text x="670" y="128" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#333">SQL text and the two</text>
  <text x="670" y="144" text-anchor="middle" font-size="9.5" fill="#333">values arrive separately</text>
  <line x1="210" y1="168" x2="210" y2="190" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="60" y="190" width="300" height="64" rx="8" fill="#e8f4fb" stroke="#3d85c6" stroke-width="1.5"/>
  <text x="210" y="208" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a4a73">Execute(connection, "CREATE TABLE … Scratch…")</text>
  <text x="210" y="223" text-anchor="middle" font-size="9.5" fill="#555">two throw-away scratch tables: nothing real at risk</text>
  <line x1="360" y1="210" x2="520" y2="210" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="440" y="203" text-anchor="middle" font-size="9" fill="#555">CREATE ×2</text>
  <rect x="540" y="192" width="260" height="60" rx="8" fill="#ffffff" stroke="#999999" stroke-width="1.2"/>
  <text x="670" y="214" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#333">ScratchNames and</text>
  <text x="670" y="230" text-anchor="middle" font-size="9.5" fill="#333">ScratchVictim created</text>
  <line x1="210" y1="254" x2="210" y2="276" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="60" y="276" width="300" height="82" rx="8" fill="#fff4f4" stroke="#cc0000" stroke-width="1.5"/>
  <text x="210" y="294" text-anchor="middle" font-size="10" font-weight="bold" fill="#990000">UNSAFE: unsafeSql = "…('" + attackerInput + "')"</text>
  <text x="210" y="309" text-anchor="middle" font-size="9.5" fill="#555">unsafeCommand.ExecuteNonQuery(); — 2 statements</text>
  <text x="210" y="326" text-anchor="middle" font-size="9" font-style="italic" fill="#555">Console: "Glued SQL: …"; victim exists True → False</text>
  <line x1="360" y1="296" x2="520" y2="296" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="440" y="289" text-anchor="middle" font-size="9" fill="#555">the whole glued text</text>
  <rect x="540" y="278" width="260" height="78" rx="8" fill="#fff4f4" stroke="#cc0000" stroke-width="1.2"/>
  <text x="670" y="300" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#333">reads it all as SQL:</text>
  <text x="670" y="316" text-anchor="middle" font-size="9.5" fill="#333">INSERT Ravi; DROP TABLE …</text>
  <text x="670" y="332" text-anchor="middle" font-size="9.5" fill="#333">ScratchVictim is GONE</text>
  <line x1="210" y1="358" x2="210" y2="380" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="60" y="380" width="300" height="64" rx="8" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1.5"/>
  <text x="210" y="398" text-anchor="middle" font-size="10" font-weight="bold" fill="#274e13">SAFE: recreate the table, then "VALUES (@name)"</text>
  <text x="210" y="413" text-anchor="middle" font-size="9.5" fill="#555">safeCommand.Parameters.AddWithValue("@name", …)</text>
  <text x="210" y="430" text-anchor="middle" font-size="9" font-style="italic" fill="#555">Console: victim exists True; "…just text: …"</text>
  <line x1="360" y1="400" x2="520" y2="400" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="440" y="393" text-anchor="middle" font-size="9" fill="#555">INSERT … @name + value</text>
  <line x1="520" y1="424" x2="362" y2="424" stroke="#333" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="440" y="437" text-anchor="middle" font-size="9" fill="#555">returns the text</text>
  <rect x="540" y="382" width="260" height="60" rx="8" fill="#ffffff" stroke="#999999" stroke-width="1.2"/>
  <text x="670" y="404" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#333">the value is only DATA:</text>
  <text x="670" y="420" text-anchor="middle" font-size="9.5" fill="#333">stored as text, table safe</text>
  <line x1="210" y1="444" x2="210" y2="466" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="60" y="466" width="300" height="64" rx="8" fill="#fffbe8" stroke="#f1c232" stroke-width="1.5"/>
  <text x="210" y="484" text-anchor="middle" font-size="10" font-weight="bold" fill="#7f6000">Execute(connection, "DROP TABLE … ×2")</text>
  <text x="210" y="499" text-anchor="middle" font-size="9.5" fill="#555">clean-up: the scratch tables are removed</text>
  <line x1="360" y1="486" x2="520" y2="486" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="440" y="479" text-anchor="middle" font-size="9" fill="#555">DROP ×2</text>
  <rect x="540" y="468" width="260" height="60" rx="8" fill="#ffffff" stroke="#999999" stroke-width="1.2"/>
  <text x="670" y="490" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#333">scratch tables removed</text>
  <text x="670" y="506" text-anchor="middle" font-size="9.5" fill="#333">nothing left behind</text>
  <line x1="210" y1="530" x2="210" y2="566" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="210" y="592" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#990000">END</text>
  <line x1="210" y1="600" x2="210" y2="640" stroke="#333" stroke-width="2"/>
  <polygon points="210,600 210,618 240,609" fill="#cc0000"/>
  <text x="30" y="740" font-size="10.5" fill="#444"><tspan font-weight="bold">The only difference is HOW the text travels:</tspan> glued into the SQL string (the server runs it) or sent as a parameter (the server stores it).</text>
  <text x="30" y="758" font-size="10" font-style="italic" fill="#888">The glued SQL is shown for teaching only and runs on scratch tables. Real code uses parameters for every value that did not come from the program itself.</text>
  <text x="30" y="774" font-size="10" font-style="italic" fill="#888">Each method also opens with PrintHeading(): four more Console.WriteLine calls for the title banner (not drawn).</text>
</svg>
