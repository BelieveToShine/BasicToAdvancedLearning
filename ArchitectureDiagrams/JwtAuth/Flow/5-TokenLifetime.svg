<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 780" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#333"/></marker>
  </defs>
  <rect x="0" y="0" width="900" height="780" fill="#ffffff"/>
  <text x="450.0" y="20" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a237e">Token lifetime — Sub-level Flow: a ticket with a use-by date</text>
  <text x="450.0" y="38" text-anchor="middle" font-size="11" fill="#666">exp is the use-by date. ClockSkew is the grace period the server allows because two clocks are never exactly equal.</text>
  <text x="60" y="62" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#274e13">START</text>
  <line x1="60" y1="66" x2="60" y2="104" stroke="#333" stroke-width="2"/>
  <polygon points="60,66 60,84 90,75" fill="#38761d"/>
  <line x1="60" y1="104" x2="60" y2="112" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="30" y="112" width="520" height="46" rx="8" fill="#e8f4fb" stroke="#3d85c6" stroke-width="1.5"/>
  <text x="290.0" y="130.0" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#1a4a73">now = DateTime.UtcNow;  asha = new DemoUser(...)</text>
  <text x="290.0" y="146.0" text-anchor="middle" font-size="9.5" fill="#444">using (strict = Start(TimeSpan.Zero))  using (lenient = Start(5 minutes))</text>
  <line x1="125" y1="158" x2="125" y2="186" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="30" y="186" width="520" height="56" rx="8" fill="#fffbe8" stroke="#f1c232" stroke-width="1.5"/>
  <text x="290.0" y="202.0" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#7f6000">Issue(user, notBefore, expires)  — tokens made by hand</text>
  <text x="290.0" y="217.0" text-anchor="middle" font-size="9.5" fill="#444">with times in the past, so we do not wait for a real expiry</text>
  <text x="290.0" y="231.0" text-anchor="middle" font-size="9.5" fill="#444">each is signed by the issuer of the server that will check it</text>
  <line x1="125" y1="242" x2="125" y2="274" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="135" y="262" font-size="9" fill="#555">check them on the server's clock</text>
  <rect x="30" y="274" width="850" height="236" rx="8" fill="#fafafa" stroke="#999999" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="40" y="292" font-size="10" font-weight="bold" fill="#333">Where each token sits in time  (minutes from NOW)</text>
  <rect x="320" y="340" width="80" height="160" rx="0" fill="#fff2cc" stroke="#f1c232" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="360.0" y="494" text-anchor="middle" font-size="9" fill="#7f6000">5 min grace</text>
  <line x1="80" y1="334" x2="640" y2="334" stroke="#555" stroke-width="1.2"/>
  <line x1="80" y1="330" x2="80" y2="338" stroke="#555" stroke-width="1"/>
  <text x="80" y="324" text-anchor="middle" font-size="9" fill="#555">-20</text>
  <line x1="160" y1="330" x2="160" y2="338" stroke="#555" stroke-width="1"/>
  <text x="160" y="324" text-anchor="middle" font-size="9" fill="#555">-15</text>
  <line x1="240" y1="330" x2="240" y2="338" stroke="#555" stroke-width="1"/>
  <text x="240" y="324" text-anchor="middle" font-size="9" fill="#555">-10</text>
  <line x1="320" y1="330" x2="320" y2="338" stroke="#555" stroke-width="1"/>
  <text x="320" y="324" text-anchor="middle" font-size="9" fill="#555">-5</text>
  <line x1="400" y1="330" x2="400" y2="338" stroke="#555" stroke-width="1"/>
  <line x1="480" y1="330" x2="480" y2="338" stroke="#555" stroke-width="1"/>
  <text x="480" y="324" text-anchor="middle" font-size="9" fill="#555">5</text>
  <line x1="560" y1="330" x2="560" y2="338" stroke="#555" stroke-width="1"/>
  <text x="560" y="324" text-anchor="middle" font-size="9" fill="#555">10</text>
  <line x1="640" y1="330" x2="640" y2="338" stroke="#555" stroke-width="1"/>
  <text x="640" y="324" text-anchor="middle" font-size="9" fill="#555">15</text>
  <line x1="400" y1="310" x2="400" y2="504" stroke="#cc0000" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text x="406" y="306" font-size="9.5" font-weight="bold" fill="#990000">NOW (the server's clock)</text>
  <text x="727" y="326" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#333">strict (0 min)</text>
  <text x="832" y="326" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#333">lenient (5 min)</text>
  <rect x="400" y="352" width="240" height="40" rx="6" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1.5"/>
  <text x="520.0" y="369" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#274e13">fresh</text>
  <text x="520.0" y="384" text-anchor="middle" font-size="9" fill="#444">expires in 15 min</text>
  <rect x="680" y="356" width="95" height="32" rx="8" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1.5"/>
  <text x="727.5" y="376.0" text-anchor="middle" font-size="10" font-weight="bold" fill="#274e13">200 OK</text>
  <rect x="785" y="356" width="95" height="32" rx="6" fill="#ffffff" stroke="#aaaaaa" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="832" y="376" text-anchor="middle" font-size="9" font-style="italic" fill="#999">not called</text>
  <rect x="240" y="410" width="144" height="40" rx="6" fill="#f4cccc" stroke="#cc0000" stroke-width="1.5"/>
  <text x="312.0" y="427" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#7a0000">expired / expiredOneMinute</text>
  <text x="312.0" y="442" text-anchor="middle" font-size="9" fill="#444">(ended 1 min ago)</text>
  <rect x="680" y="414" width="95" height="32" rx="8" fill="#f4cccc" stroke="#cc0000" stroke-width="1.5"/>
  <text x="727.5" y="434.0" text-anchor="middle" font-size="10" font-weight="bold" fill="#7a0000">401</text>
  <rect x="785" y="414" width="95" height="32" rx="8" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1.5"/>
  <text x="832.5" y="434.0" text-anchor="middle" font-size="10" font-weight="bold" fill="#274e13">200 OK</text>
  <rect x="80" y="460" width="160" height="40" rx="6" fill="#f4cccc" stroke="#cc0000" stroke-width="1.5"/>
  <text x="160.0" y="477" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#7a0000">expiredTenMinutes</text>
  <text x="160.0" y="492" text-anchor="middle" font-size="9" fill="#444">ended 10 min ago</text>
  <rect x="680" y="464" width="95" height="32" rx="6" fill="#ffffff" stroke="#aaaaaa" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="727" y="484" text-anchor="middle" font-size="9" font-style="italic" fill="#999">not called</text>
  <rect x="785" y="464" width="95" height="32" rx="8" fill="#f4cccc" stroke="#cc0000" stroke-width="1.5"/>
  <text x="832.5" y="484.0" text-anchor="middle" font-size="10" font-weight="bold" fill="#7a0000">401</text>
  <line x1="125" y1="510" x2="125" y2="538" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="30" y="538" width="520" height="46" rx="8" fill="#f1f1f1" stroke="#777777" stroke-width="1.5"/>
  <text x="290.0" y="556.0" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#444444">strict: expiredReply.Challenge contains "invalid_token"  →  True</text>
  <text x="290.0" y="572.0" text-anchor="middle" font-size="9.5" fill="#444">the 401 also says WHY (an expired token is "invalid")</text>
  <line x1="125" y1="584" x2="125" y2="608" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="125" y="624" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#990000">END</text>
  <line x1="125" y1="632" x2="125" y2="672" stroke="#333" stroke-width="2"/>
  <polygon points="125,632 125,650 155,641" fill="#cc0000"/>
  <text x="30" y="692" font-size="10.5" fill="#444"><tspan font-weight="bold">A server accepts an expired token only inside the grace period: </tspan>ClockSkew = 0 min refuses 1 minute late; ClockSkew = 5 min accepts 1 minute late but refuses 10.</text>
  <text x="30" y="710" font-size="10" font-style="italic" fill="#888">Console.WriteLine prints 5 lines: the four results above and the invalid_token line. Not setting ClockSkew leaves the library default, which is also 5 minutes.</text>
  <text x="30" y="728" font-size="10" font-style="italic" fill="#888">A signed token cannot be taken back before exp unless the server keeps extra state (e.g. a block list) - so keep lifetimes short.</text>
  <text x="30" y="746" font-size="10" font-style="italic" fill="#888">Each method also opens with PrintHeading(): two Console.WriteLine calls (a blank line, then the title) - not drawn.</text>
</svg>
