  <text x="40" y="689" font-size="10.5" fill="#444"><tspan font-weight="bold">/login checks the name and password against the in-memory users, then signs a token. </tspan>The two failures get the SAME answer (401), so a caller cannot tell a wrong name from a wrong password by the status and body.</text>
  <text x="40" y="707" font-size="10" font-style="italic" fill="#888">token comes from a second login (ApiCall.Login), so it is its own string object, separate from the one inside success; the lesson reads it only to show the claims. lifetimeSeconds is a plain number, entirely on the Stack.</text>
