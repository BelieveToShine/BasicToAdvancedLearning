  <text x="990.0" y="409" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7f4e00">string[] — parts  (3 strings)</text>
  <rect x="852" y="419" width="276" height="26" rx="4" fill="#fff3e6" stroke="#e69138" stroke-width="1"/>
  <text x="860" y="436" font-size="10" fill="#7f4e00">[0] → the header piece</text>
  <rect x="852" y="449" width="276" height="26" rx="4" fill="#fff3e6" stroke="#e69138" stroke-width="1"/>
  <text x="860" y="466" font-size="10" fill="#7f4e00">[1] → the payload piece</text>
  <rect x="852" y="479" width="276" height="26" rx="4" fill="#fff3e6" stroke="#e69138" stroke-width="1"/>
  <text x="860" y="496" font-size="10" fill="#7f4e00">[2] → the signature piece</text>
  <rect x="840" y="527" width="300" height="126" rx="10" fill="#f9cb9c" stroke="#e69138" stroke-width="1.5"/>
  <text x="990.0" y="549" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7f4e00">ApiReply — genuine</text>
  <rect x="852" y="559" width="276" height="26" rx="4" fill="#fff3e6" stroke="#e69138" stroke-width="1"/>
  <text x="860" y="576" font-size="10" fill="#7f4e00">StatusCode = 403 Forbidden</text>
  <rect x="852" y="589" width="276" height="26" rx="4" fill="#fff3e6" stroke="#e69138" stroke-width="1"/>
  <text x="860" y="606" font-size="10" fill="#7f4e00">Body = "" (empty)</text>
  <rect x="852" y="619" width="276" height="26" rx="4" fill="#fff3e6" stroke="#e69138" stroke-width="1"/>
  <text x="860" y="636" font-size="10" fill="#7f4e00">Challenge = "" (empty)</text>
  <rect x="840" y="665" width="300" height="126" rx="10" fill="#f9cb9c" stroke="#e69138" stroke-width="1.5"/>
  <text x="990.0" y="687" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7f4e00">ApiReply — forged</text>
  <rect x="852" y="697" width="276" height="26" rx="4" fill="#fff3e6" stroke="#e69138" stroke-width="1"/>
  <text x="860" y="714" font-size="10" fill="#7f4e00">StatusCode = 401 Unauthorized</text>
  <rect x="852" y="727" width="276" height="26" rx="4" fill="#fff3e6" stroke="#e69138" stroke-width="1"/>
  <text x="860" y="744" font-size="10" fill="#7f4e00">Body = "" (empty)</text>
  <rect x="852" y="757" width="276" height="26" rx="4" fill="#fff3e6" stroke="#e69138" stroke-width="1"/>
  <text x="860" y="774" font-size="10" fill="#7f4e00">Challenge = "Bearer error=invalid_token…"</text>
  <rect x="440" y="520" width="290" height="98" rx="10" fill="#f1f1f1" stroke="#777777" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="585.0" y="540" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#444444">OUTSIDE THIS METHOD — the API server</text>
  <text x="454" y="560" font-size="9.5" fill="#333333">holds the real key; recomputes the signature</text>
  <text x="454" y="576" font-size="9.5" fill="#333333">of every token it receives and compares:</text>
  <text x="454" y="592" font-size="9.5" font-weight="bold" fill="#333333">genuine token: match, but role Customer -&gt; 403</text>
  <text x="454" y="608" font-size="9.5" font-weight="bold" fill="#333333">forged token: NO match -&gt; 401</text>
