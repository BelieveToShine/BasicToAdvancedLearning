  <rect x="50" y="582" width="340" height="50" rx="8" fill="#dcecdc" stroke="#6aa84f" stroke-width="1.5"/>
  <text x="220" y="602" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#4c6b4c">Program.cs (Main)</text>
  <text x="220" y="618" text-anchor="middle" font-size="9.5" fill="#6b8a6b">paused — waiting for topic.Explain() to return</text>
  <rect x="440" y="176" width="290" height="26" rx="6" fill="#fff3e6" stroke="#e69138" stroke-width="1.5"/>
  <text x="585.0" y="193.0" text-anchor="middle" font-size="10" fill="#7f4e00">"&lt;header&gt;.&lt;payload&gt;.&lt;signature&gt;"  (a token)</text>
  <rect x="440" y="236" width="290" height="26" rx="6" fill="#fff3e6" stroke="#e69138" stroke-width="1.5"/>
  <text x="585.0" y="253.0" text-anchor="middle" font-size="10" fill="#7f4e00">JSON text: {"alg":"HS256","typ":"JWT"}</text>
  <rect x="440" y="266" width="290" height="26" rx="6" fill="#fff3e6" stroke="#e69138" stroke-width="1.5"/>
  <text x="585.0" y="283.0" text-anchor="middle" font-size="10" fill="#7f4e00">JSON text, fields: aud exp iat iss name nbf ...</text>
  <rect x="440" y="296" width="290" height="26" rx="6" fill="#fff3e6" stroke="#e69138" stroke-width="1.5"/>
  <text x="585.0" y="313.0" text-anchor="middle" font-size="10" fill="#7f4e00">byte[]  the ASCII bytes of "&lt;header&gt;.&lt;payload&gt;"</text>
  <rect x="440" y="326" width="290" height="26" rx="6" fill="#fff3e6" stroke="#e69138" stroke-width="1.5"/>
  <text x="585.0" y="343.0" text-anchor="middle" font-size="10" fill="#7f4e00">byte[32]  HMAC-SHA256 of those bytes, with the key</text>
  <rect x="440" y="386" width="290" height="26" rx="6" fill="#fff3e6" stroke="#e69138" stroke-width="1.5"/>
  <text x="585.0" y="403.0" text-anchor="middle" font-size="10" fill="#7f4e00">JSON text: payload with role changed to Manager</text>
  <rect x="440" y="416" width="290" height="26" rx="6" fill="#fff3e6" stroke="#e69138" stroke-width="1.5"/>
  <text x="585.0" y="433.0" text-anchor="middle" font-size="10" fill="#7f4e00">"&lt;header&gt;.&lt;forged payload&gt;.&lt;OLD signature&gt;"</text>
  <rect x="840" y="137" width="300" height="112" rx="10" fill="#f9cb9c" stroke="#e69138" stroke-width="1.5"/>
  <text x="990.0" y="159" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7f4e00">DemoAuthServer — server</text>
  <rect x="852" y="169" width="276" height="26" rx="4" fill="#fff3e6" stroke="#e69138" stroke-width="1"/>
  <text x="860" y="186" font-size="10" fill="#7f4e00">_running → RunningServer (holds the HttpClient)</text>
  <rect x="852" y="199" width="276" height="26" rx="4" fill="#fff3e6" stroke="#e69138" stroke-width="1"/>
  <text x="860" y="216" font-size="10" fill="#7f4e00">Issuer → TokenIssuer (holds the random key)</text>
  <text x="854" y="240" font-size="8.5" font-style="italic" fill="#a06a1f">(internals simplified)</text>
  <rect x="840" y="277" width="300" height="96" rx="10" fill="#f9cb9c" stroke="#e69138" stroke-width="1.5"/>
  <text x="990.0" y="299" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7f4e00">TokenIssuer</text>
  <rect x="852" y="309" width="276" height="26" rx="4" fill="#fff3e6" stroke="#e69138" stroke-width="1"/>
  <text x="860" y="326" font-size="10" fill="#7f4e00">SigningKeyBytes → byte[32], random</text>
  <rect x="852" y="339" width="276" height="26" rx="4" fill="#fff3e6" stroke="#e69138" stroke-width="1"/>
  <text x="860" y="356" font-size="10" fill="#7f4e00">Key → SymmetricSecurityKey</text>
  <line x1="990" y1="249" x2="990" y2="275" stroke="#555" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="998" y="266" font-size="9.5" font-style="italic" fill="#a06a1f">Issuer</text>
