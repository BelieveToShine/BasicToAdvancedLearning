  <polyline points="378,489 780,489 780,687 838,687" fill="none" stroke="#555" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="1220" y="118" width="90" height="130" rx="10" fill="#d5c9ea" stroke="#674ea7" stroke-width="1.5" stroke-dasharray="6 4" fill-opacity="0.25"/>
  <text x="1265" y="150" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#3d2a6b">Nothing</text>
  <text x="1265" y="166" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#3d2a6b">here yet</text>
  <text x="40" y="815" font-size="10.5" fill="#444"><tspan font-weight="bold">The token is just text: split on dots it gives 3 strings. </tspan>headerJson and payloadJson were decoded WITHOUT the key — anyone holding the token can do that. Only checking the signature needs the key.</text>
  <text x="40" y="833" font-size="10" font-style="italic" fill="#888">forgedToken reuses the OLD signature (parts[2]) with a changed payload, so the server's recomputed signature differs. The key bytes are shown as "random": they differ every run and are never printed.</text>
</svg>
