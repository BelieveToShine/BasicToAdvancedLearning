  <text x="70" y="403" font-size="10" fill="#1b3d1b">forgedPayload → pointer  (string)</text>
  <rect x="62" y="416" width="316" height="26" rx="4" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1"/>
  <text x="70" y="433" font-size="10" fill="#1b3d1b">forgedToken → pointer  (string)</text>
  <rect x="62" y="446" width="316" height="26" rx="4" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1"/>
  <text x="70" y="463" font-size="10" fill="#1b3d1b">genuine → pointer  (ApiReply)</text>
  <rect x="62" y="476" width="316" height="26" rx="4" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1"/>
  <text x="70" y="493" font-size="10" fill="#1b3d1b">forged → pointer  (ApiReply)</text>
  <rect x="50" y="522" width="340" height="50" rx="8" fill="#dcecdc" stroke="#6aa84f" stroke-width="1.5"/>
