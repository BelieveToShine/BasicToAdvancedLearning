  <text x="454" y="396" font-size="9.5" fill="#333333">holds its OWN copy of the signing key</text>
  <text x="454" y="412" font-size="9.5" font-weight="bold" fill="#333333">GET /api/reports/daily answered three ways:</text>
  <text x="454" y="428" font-size="9.5" fill="#333333">  no token -&gt; 401, asha -&gt; 403, chen -&gt; 200</text>
