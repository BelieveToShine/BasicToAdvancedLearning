  <text x="1265" y="166" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#3d2a6b">here yet</text>
  <text x="40" y="689" font-size="10.5" fill="#444"><tspan font-weight="bold">Each reply is a small object on the Heap holding the answer: </tspan>one status code, one body, one WWW-Authenticate challenge. The 401 carries the challenge; the 403 and the 200 do not.</text>
  <text x="40" y="707" font-size="10" font-style="italic" fill="#888">The request and the answer travel over HTTP to the server, which is outside these variables (same program, its own part). The server is not a variable here: the lesson only holds the HttpClient inside server.</text>
</svg>
