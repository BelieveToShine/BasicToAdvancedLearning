  <text x="860" y="450" font-size="10" fill="#7f4e00">StatusCode = 403 Forbidden</text>
  <rect x="852" y="463" width="276" height="26" rx="4" fill="#fff3e6" stroke="#e69138" stroke-width="1"/>
