  <text x="40" y="1241" font-size="10.5" fill="#444"><tspan font-weight="bold">Seven calls, seven small ApiReply objects. </tspan>The attribute on each endpoint decides the answer: [AllowAnonymous] never asks who you are, [Authorize] needs a valid token, Roles= also needs the right role.</text>
  <text x="40" y="1259" font-size="10" font-style="italic" fill="#888">"Bearer error=invalid_token" is only a fragment of the header text. Customer vs Manager is decided by the role claim INSIDE the token, not by anything the client sends beside it.</text>
