  <text x="40" y="1087" font-size="10.5" fill="#444"><tspan font-weight="bold">exp is checked against the SERVER's clock, plus the ClockSkew slack. </tspan>strict (0 min): a token 1 minute past exp is refused. lenient (5 min): the same lateness is accepted, but 10 minutes late is still refused.</text>
  <text x="40" y="1105" font-size="10" font-style="italic" fill="#888">Tokens are signed by the issuer of the server that will check them, so each server needs its own. The expired tokens were made by hand with times in the past; real ones only expire as time passes.</text>
