<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 800" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#333"/></marker>
  </defs>
  <rect x="0" y="0" width="900" height="800" fill="#ffffff"/>
  <text x="450.0" y="20" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a237e">Read endpoints — Sub-level Flow: client, controller and SQL Server</text>
  <text x="450.0" y="38" text-anchor="middle" font-size="11" fill="#666">Each GET travels demo -&gt; controller -&gt; database and the answer travels back; the 404 is the controller's own decision.</text>
  <text x="125.0" y="62" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a4a73">WebApiCrudDemo (the client)</text>
  <text x="470.0" y="62" text-anchor="middle" font-size="10" font-weight="bold" fill="#274e13">AccountsController (the server)</text>
  <text x="785.0" y="62" text-anchor="middle" font-size="10" font-weight="bold" fill="#444">SQL Server (outside .NET)</text>
  <text x="125.0" y="88" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#274e13">START</text>
  <line x1="125.0" y1="92" x2="125.0" y2="130" stroke="#333" stroke-width="2"/>
  <polygon points="125.0,92 125.0,110 155.0,101" fill="#38761d"/>
  <line x1="125.0" y1="130" x2="125.0" y2="142" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="30" y="142" width="190" height="56" rx="8" fill="#e8f4fb" stroke="#3d85c6" stroke-width="1.5"/>
  <text x="125.0" y="166.0" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#1a4a73">ShowGeneratedSql();</text>
  <text x="125.0" y="182.0" text-anchor="middle" font-size="9.0" fill="#555">ToQueryString() builds SQL text</text>
  <text x="240" y="164" font-size="9" font-style="italic" fill="#555">Console.WriteLine ×2: the intro line and the SQL text.</text>
  <text x="240" y="180" font-size="9" font-style="italic" fill="#555">ToQueryString() only builds the text — nothing is sent to SQL Server.</text>
  <line x1="125.0" y1="198" x2="125.0" y2="230" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="30" y="230" width="190" height="76" rx="8" fill="#e8f4fb" stroke="#3d85c6" stroke-width="1.5"/>
  <text x="125.0" y="264.0" text-anchor="middle" font-size="9" font-weight="bold" fill="#1a4a73">Call(Get, "/api/accounts")</text>
  <text x="125.0" y="280.0" text-anchor="middle" font-size="8.5" fill="#555">-&gt; ApiReply list</text>
  <rect x="360" y="230" width="220" height="76" rx="8" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1.5"/>
  <text x="470.0" y="264.0" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#274e13">GetAll()</text>
  <text x="470.0" y="280.0" text-anchor="middle" font-size="9.0" fill="#555">Project(…OrderBy…).ToList()</text>
  <rect x="700" y="230" width="170" height="76" rx="8" fill="#f1f1f1" stroke="#777777" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="785.0" y="260" text-anchor="middle" font-size="9" font-weight="bold" fill="#333">SELECT … JOIN …</text>
  <text x="785.0" y="276" text-anchor="middle" font-size="9" fill="#333">ORDER BY AccountId</text>
  <line x1="220" y1="250" x2="360" y2="250" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="290.0" y="242" text-anchor="middle" font-size="8.5" fill="#555">GET /api/accounts</text>
  <line x1="580" y1="250" x2="700" y2="250" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="640.0" y="242" text-anchor="middle" font-size="8.5" fill="#555">SELECT</text>
  <line x1="700" y1="286" x2="580" y2="286" stroke="#333" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="640.0" y="300" text-anchor="middle" font-size="8.5" fill="#555">3 rows</text>
  <line x1="360" y1="286" x2="220" y2="286" stroke="#333" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="290.0" y="300" text-anchor="middle" font-size="8.5" fill="#555">200 + JSON array</text>
  <line x1="125.0" y1="306" x2="125.0" y2="360" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="30" y="360" width="190" height="76" rx="8" fill="#e8f4fb" stroke="#3d85c6" stroke-width="1.5"/>
  <text x="125.0" y="394.0" text-anchor="middle" font-size="9" font-weight="bold" fill="#1a4a73">Call(Get, "/api/accounts/1")</text>
  <text x="125.0" y="410.0" text-anchor="middle" font-size="8.5" fill="#555">-&gt; ApiReply one</text>
  <rect x="360" y="360" width="220" height="76" rx="8" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1.5"/>
  <text x="470.0" y="394.0" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#274e13">GetById(1)</text>
  <text x="470.0" y="410.0" text-anchor="middle" font-size="9.0" fill="#555">Project(…Where…).FirstOrDefault()</text>
  <rect x="700" y="360" width="170" height="76" rx="8" fill="#f1f1f1" stroke="#777777" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="785.0" y="390" text-anchor="middle" font-size="9" font-weight="bold" fill="#333">SELECT … JOIN …</text>
  <text x="785.0" y="406" text-anchor="middle" font-size="9" fill="#333">WHERE AccountId = 1</text>
  <line x1="220" y1="380" x2="360" y2="380" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="290.0" y="372" text-anchor="middle" font-size="8.5" fill="#555">GET /api/accounts/1</text>
  <line x1="580" y1="380" x2="700" y2="380" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="640.0" y="372" text-anchor="middle" font-size="8.5" fill="#555">SELECT</text>
  <line x1="700" y1="416" x2="580" y2="416" stroke="#333" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="640.0" y="430" text-anchor="middle" font-size="8.5" fill="#555">1 row</text>
  <line x1="360" y1="416" x2="220" y2="416" stroke="#333" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="290.0" y="430" text-anchor="middle" font-size="8.5" fill="#555">200 + JSON object</text>
  <line x1="125.0" y1="436" x2="125.0" y2="490" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="30" y="490" width="190" height="76" rx="8" fill="#e8f4fb" stroke="#3d85c6" stroke-width="1.5"/>
  <text x="125.0" y="524.0" text-anchor="middle" font-size="9" font-weight="bold" fill="#1a4a73">Call(Get, "/api/accounts/99")</text>
  <text x="125.0" y="540.0" text-anchor="middle" font-size="8.5" fill="#555">-&gt; ApiReply missing</text>
  <rect x="360" y="490" width="220" height="76" rx="8" fill="#fbe5e5" stroke="#cc0000" stroke-width="1.5"/>
  <text x="470.0" y="524.0" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#990000">GetById(99)</text>
  <text x="470.0" y="540.0" text-anchor="middle" font-size="9.0" fill="#555">no row -&gt; null -&gt; NotFound()</text>
  <rect x="700" y="490" width="170" height="76" rx="8" fill="#f1f1f1" stroke="#777777" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="785.0" y="520" text-anchor="middle" font-size="9" font-weight="bold" fill="#333">SELECT … JOIN …</text>
  <text x="785.0" y="536" text-anchor="middle" font-size="9" fill="#333">WHERE AccountId = 99</text>
  <line x1="220" y1="510" x2="360" y2="510" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="290.0" y="502" text-anchor="middle" font-size="8.5" fill="#555">GET /api/accounts/99</text>
  <line x1="580" y1="510" x2="700" y2="510" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="640.0" y="502" text-anchor="middle" font-size="8.5" fill="#555">SELECT</text>
  <line x1="700" y1="546" x2="580" y2="546" stroke="#333" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="640.0" y="560" text-anchor="middle" font-size="8.5" fill="#555">0 rows</text>
  <line x1="360" y1="546" x2="220" y2="546" stroke="#333" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="290.0" y="560" text-anchor="middle" font-size="8.5" fill="#555">404 + ProblemDetails</text>
  <line x1="125.0" y1="566" x2="125.0" y2="596" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="30" y="596" width="190" height="56" rx="8" fill="#e8f4fb" stroke="#3d85c6" stroke-width="1.5"/>
  <text x="125.0" y="620.0" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#1a4a73">Console.WriteLine ×2</text>
  <text x="125.0" y="636.0" text-anchor="middle" font-size="9.0" fill="#555">"Status numbers: …", the 404 note</text>
  <line x1="125.0" y1="652" x2="125.0" y2="676" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="125.0" y="690" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#990000">END</text>
  <line x1="125.0" y1="698" x2="125.0" y2="738" stroke="#333" stroke-width="2"/>
  <polygon points="125.0,698 125.0,716 155.0,707" fill="#cc0000"/>
  <rect x="300" y="596" width="570" height="90" rx="8" fill="#fff8e1" stroke="#f1c232" stroke-width="1.2"/>
  <text x="585" y="616" text-anchor="middle" font-size="10" font-weight="bold" fill="#7f6000">Why the controller returns AccountDto, not the Account entity</text>
  <text x="316" y="636" font-size="9.2" fill="#444">1. The reply holds exactly the fields we chose, so a new table column does not leak out.</text>
  <text x="316" y="652" font-size="9.2" fill="#444">2. Customer and Account point at each other; both loaded -&gt; the JSON serializer throws (a 500).</text>
  <text x="316" y="668" font-size="9.2" fill="#444">3. The data in a reply and the data in a request have different shapes (next method).</text>
  <text x="30" y="750" font-size="10.5" fill="#444"><tspan font-weight="bold">A 404 is not a crash:</tspan> the controller found no row, so it chose NotFound(); [ApiController] turned that into a ProblemDetails body.</text>
  <text x="30" y="768" font-size="10" font-style="italic" fill="#888">Call() prints two Console.WriteLine lines per request: "GET path  -&gt;  status" and then the body (or, for the 404, the problem title).</text>
  <text x="30" y="786" font-size="10" font-style="italic" fill="#888">Each method also opens with PrintHeading(): a blank line and the "=== title ===" banner (two more Console.WriteLine calls, not drawn).</text>
</svg>
