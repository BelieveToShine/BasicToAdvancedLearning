  <text x="805.0" y="620" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#444444">OUTSIDE .NET — the network and SQL Server</text>
  <text x="494" y="640" font-size="9.5" fill="#333333">HTTP: 3 requests went out and 3 answers came back as bytes over a local connection, not as C# objects.</text>
  <text x="494" y="656" font-size="9.5" font-weight="bold" fill="#333333">SQL Server rows the 200 answers were built from (read only, unchanged):</text>
  <text x="494" y="672" font-size="9.5" fill="#333333">Accounts 1-3: ACC-1001 Savings 500.00 (Asha Rao), ACC-1002 Current 1200.50 (Ben Carter),</text>
  <text x="494" y="688" font-size="9.5" fill="#333333">ACC-1003 Savings 75.00 (Chen Li).   Account 99 does not exist: that is why the third answer is 404.</text>
  <polyline points="378,159 462,159 462,166 478,166" fill="none" stroke="#555" stroke-width="1.4" marker-end="url(#a)"/>
  <polyline points="378,189 456,189 456,314 478,314" fill="none" stroke="#555" stroke-width="1.4" marker-end="url(#a)"/>
  <polyline points="378,219 450,219 450,462 478,462" fill="none" stroke="#555" stroke-width="1.4" marker-end="url(#a)"/>
