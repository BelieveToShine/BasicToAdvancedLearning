  <text x="1195" y="150" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#3d2a6b">Nothing</text>
  <text x="1195" y="166" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#3d2a6b">here yet</text>
  <text x="40" y="736" font-size="10.5" fill="#444"><tspan font-weight="bold">Each answer is a small ApiReply object on the Heap: a status number, plus pointers to the body text. </tspan>The status code is what tells list/one (200) from missing (404).</text>
  <text x="40" y="754" font-size="10" font-style="italic" fill="#888">The helper methods ShowGeneratedSql() and Call() each had their own frame while they ran; their locals are gone now, so only list, one and missing remain here.</text>
