  <text x="825.0" y="528" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#444444">OUTSIDE .NET — SQL Server, at this moment</text>
  <text x="494" y="548" font-size="9.5" fill="#333333">Accounts:  1 ACC-1001 Savings 500.00  |  2 ACC-1002 Savings 1500.00 (replaced)  |  4 ACC-1004 Current 20.00</text>
  <text x="494" y="564" font-size="9.5" font-weight="bold" fill="#333333">Account 3 is gone (DELETE -&gt; 204). Account 1 is still there: the 409 delete changed nothing.</text>
  <text x="494" y="580" font-size="9.5" fill="#333333">Transactions:  1 (account 1, Deposit 500.00)  |  2 (account 2, Deposit 1200.50)  — untouched.</text>
  <text x="494" y="596" font-size="9.5" fill="#333333">The foreign key from Transactions to Accounts is why SQL Server refused to delete account 1.</text>
  <polyline points="378,159 462,159 462,166 478,166" fill="none" stroke="#555" stroke-width="1.4" marker-end="url(#a)"/>
  <polyline points="378,189 456,189 456,244 478,244" fill="none" stroke="#555" stroke-width="1.4" marker-end="url(#a)"/>
  <polyline points="378,219 450,219 450,382 478,382" fill="none" stroke="#555" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="1150" y="118" width="90" height="130" rx="10" fill="#d5c9ea" stroke="#674ea7" stroke-width="1.5" stroke-dasharray="6 4" fill-opacity="0.25"/>
  <text x="1195" y="150" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#3d2a6b">Nothing</text>
  <text x="1195" y="166" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#3d2a6b">here yet</text>
  <text x="40" y="660" font-size="10.5" fill="#444"><tspan font-weight="bold">A successful PUT answers 204 No Content: the reply object exists, but its Body is an empty string. </tspan>The 409 reply carries a ProblemDetails body instead.</text>
  <text x="40" y="678" font-size="10" font-style="italic" fill="#888">The rows that changed live OUTSIDE .NET, in SQL Server; these three variables only hold the answers that came back over HTTP.</text>
</svg>
