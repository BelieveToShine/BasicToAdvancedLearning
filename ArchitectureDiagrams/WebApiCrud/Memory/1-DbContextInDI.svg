  <text x="40" y="576" font-size="10.5" fill="#444"><tspan font-weight="bold">first and second point at ONE object (red outline): inside one scope the context is created once and shared. </tspan>other, from scopeB, is a different object.</text>
  <text x="40" y="594" font-size="10" font-style="italic" fill="#888">That is what "Scoped" means; the web server opens one scope per request, so each request gets its own context. _app is a field of the WebApiCrudDemo object, not a local.</text>
  <text x="40" y="612" font-size="10" font-style="italic" fill="#888">Still to come in this method: EnsureDeleted / EnsureCreated / SeedBank (the database is rebuilt), then WebLab.Start() makes the server listen.</text>
