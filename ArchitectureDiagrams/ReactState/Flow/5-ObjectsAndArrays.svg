<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#333"/></marker>
  </defs>
  <rect x="0" y="0" width="900" height="560" fill="#ffffff"/>
  <text x="450.0" y="20" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a237e">Objects and arrays — Flow: photocopy the page, never scribble on the original</text>
  <text x="450.0" y="38" text-anchor="middle" font-size="11" fill="#666">A copy is a new value React notices; editing in place keeps the same array, so React sees no change.</text>
  <g font-size="10.5" fill="#333"><rect x="90" y="50" width="14" height="14" rx="2" fill="#d5c9ea" stroke="#674ea7"/><text x="110" y="61">Render (component function runs)</text></g>
  <g font-size="10.5" fill="#333"><rect x="299.2" y="50" width="14" height="14" rx="2" fill="#fff2cc" stroke="#f1c232"/><text x="319.2" y="61">Event</text></g>
  <g font-size="10.5" fill="#333"><rect x="357.2" y="50" width="14" height="14" rx="2" fill="#f9cb9c" stroke="#e69138"/><text x="377.2" y="61">State change</text></g>
  <g font-size="10.5" fill="#333"><rect x="454.4" y="50" width="14" height="14" rx="2" fill="#f4f4f4" stroke="#888888" stroke-dasharray="6 4"/><text x="474.4" y="61">DOM / screen</text></g>
  <rect x="250" y="80" width="400" height="56" rx="8" fill="#d5c9ea" stroke="#674ea7" stroke-width="1.8"/>
  <text x="450.0" y="98" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#3d2a6b">Render: accounts = array A</text>
  <text x="450.0" y="115" text-anchor="middle" font-size="9.5" fill="#333">Asha Rao 100, Ben Carter 250 (held by the parent, Bank)</text>
  <rect x="40" y="190" width="380" height="58" rx="8" fill="#d9ead3" stroke="#6aa84f" stroke-width="1.8"/>
  <text x="230.0" y="208" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#274e13">Click "Deposit 10 to Asha Rao"</text>
  <text x="230.0" y="225" text-anchor="middle" font-size="9.5" fill="#333">accounts.map(...): a NEW object for Asha (110)</text>
  <text x="230.0" y="240" text-anchor="middle" font-size="9.5" fill="#333">Ben's object is reused</text>
  <rect x="480" y="190" width="380" height="58" rx="8" fill="#f4cccc" stroke="#cc0000" stroke-width="1.8"/>
  <text x="670.0" y="208" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7a0000">Click "Mutate first account (wrong way)"</text>
  <text x="670.0" y="225" text-anchor="middle" font-size="9.5" fill="#333">accounts[0].balance += 10 edits Asha in place</text>
  <text x="670.0" y="240" text-anchor="middle" font-size="9.5" fill="#333">array A is still the same array</text>
  <polyline points="350,136 350,164 230,164 230,188" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="222" y="160" text-anchor="end" font-size="9" font-style="italic" fill="#555">copy way</text>
  <polyline points="550,136 550,164 670,164 670,188" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="678" y="160" font-size="9" font-style="italic" fill="#555">wrong way</text>
  <rect x="40" y="290" width="380" height="52" rx="8" fill="#f9cb9c" stroke="#e69138" stroke-width="1.8"/>
  <text x="230.0" y="308" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7f4e00">setAccounts(new array B)</text>
  <text x="230.0" y="325" text-anchor="middle" font-size="9.5" fill="#333">B is a different value from A</text>
  <rect x="480" y="290" width="380" height="52" rx="8" fill="#f9cb9c" stroke="#e69138" stroke-width="1.8"/>
  <text x="670.0" y="308" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7f4e00">setAccounts(accounts): the same array A</text>
  <text x="670.0" y="325" text-anchor="middle" font-size="9.5" fill="#333">React compares old and new: no difference</text>
  <line x1="230" y1="248" x2="230" y2="290" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="238" y="272.0" font-size="9" font-style="italic" fill="#555">setter called</text>
  <line x1="670" y1="248" x2="670" y2="290" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="678" y="272.0" font-size="9" font-style="italic" fill="#555">setter called</text>
  <rect x="40" y="384" width="380" height="66" rx="8" fill="#d5c9ea" stroke="#674ea7" stroke-width="1.8"/>
  <text x="230.0" y="402" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#3d2a6b">Re-render: AccountList and TotalBalance get B</text>
  <text x="230.0" y="419" text-anchor="middle" font-size="9.5" fill="#333">(siblings share the parent's state as props)</text>
  <text x="230.0" y="434" text-anchor="middle" font-size="9.5" fill="#333">Asha 110, Ben 250, total 360</text>
  <rect x="480" y="384" width="380" height="66" rx="8" fill="#f4f4f4" stroke="#888888" stroke-width="1.8" stroke-dasharray="6 4"/>
  <text x="670.0" y="402" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#444">No re-render: the screen is NOT updated</text>
  <text x="670.0" y="419" text-anchor="middle" font-size="9.5" fill="#333">still shows Asha 100, total 350 while the data</text>
  <text x="670.0" y="434" text-anchor="middle" font-size="9.5" fill="#333">already says 110 (until some later render)</text>
  <line x1="230" y1="342" x2="230" y2="384" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="238" y="366.0" font-size="9" font-style="italic" fill="#555">different: re-render</text>
  <line x1="670" y1="342" x2="670" y2="384" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="678" y="366.0" font-size="9" font-style="italic" fill="#555">same: skip</text>
  <text x="30" y="490" font-size="10.5" fill="#444"><tspan font-weight="bold">Lifting state up: </tspan>the parent owns accounts and passes them (and the functions that change them) down, so both siblings stay in step.</text>
</svg>
