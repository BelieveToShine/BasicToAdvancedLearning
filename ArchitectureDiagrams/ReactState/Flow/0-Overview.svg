<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#333"/></marker>
  </defs>
  <rect x="0" y="0" width="900" height="560" fill="#ffffff"/>
  <text x="450.0" y="20" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a237e">ReactState — Flow overview: the render / event / state loop</text>
  <text x="450.0" y="38" text-anchor="middle" font-size="11" fill="#666">Metaphor: a bank clerk with a notebook (state). Each customer visit is an event; the clerk writes in the notebook, then redraws the board (the screen).</text>
  <g font-size="10.5" fill="#333"><rect x="90" y="50" width="14" height="14" rx="2" fill="#d5c9ea" stroke="#674ea7"/><text x="110" y="61">Render (component function runs)</text></g>
  <g font-size="10.5" fill="#333"><rect x="299.2" y="50" width="14" height="14" rx="2" fill="#fff2cc" stroke="#f1c232"/><text x="319.2" y="61">Event</text></g>
  <g font-size="10.5" fill="#333"><rect x="357.2" y="50" width="14" height="14" rx="2" fill="#f9cb9c" stroke="#e69138"/><text x="377.2" y="61">State change</text></g>
  <g font-size="10.5" fill="#333"><rect x="454.4" y="50" width="14" height="14" rx="2" fill="#f4f4f4" stroke="#888888" stroke-dasharray="6 4"/><text x="474.4" y="61">DOM / screen</text></g>
  <rect x="60" y="100" width="300" height="80" rx="8" fill="#d5c9ea" stroke="#674ea7" stroke-width="1.8"/>
  <text x="210.0" y="118" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#3d2a6b">1. RENDER</text>
  <text x="210.0" y="135" text-anchor="middle" font-size="9.5" fill="#333">React calls your component function</text>
  <text x="210.0" y="150" text-anchor="middle" font-size="9.5" fill="#333">it reads state and returns JSX</text>
  <text x="210.0" y="165" text-anchor="middle" font-size="9.5" fill="#333">(lessons 01, 03)</text>
  <rect x="540" y="100" width="300" height="80" rx="8" fill="#f4f4f4" stroke="#888888" stroke-width="1.8" stroke-dasharray="6 4"/>
  <text x="690.0" y="118" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#444">2. SCREEN UPDATES</text>
  <text x="690.0" y="135" text-anchor="middle" font-size="9.5" fill="#333">React changes the DOM to match</text>
  <text x="690.0" y="150" text-anchor="middle" font-size="9.5" fill="#333">the JSX the render returned</text>
  <rect x="540" y="290" width="300" height="80" rx="8" fill="#fff2cc" stroke="#f1c232" stroke-width="1.8"/>
  <text x="690.0" y="308" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7f6000">3. USER ACTS, HANDLER RUNS</text>
  <text x="690.0" y="325" text-anchor="middle" font-size="9.5" fill="#333">click / typing / submit gives</text>
  <text x="690.0" y="340" text-anchor="middle" font-size="9.5" fill="#333">your onClick / onChange / onSubmit</text>
  <text x="690.0" y="355" text-anchor="middle" font-size="9.5" fill="#333">function an event (lessons 02, 04)</text>
  <rect x="60" y="290" width="300" height="80" rx="8" fill="#f9cb9c" stroke="#e69138" stroke-width="1.8"/>
  <text x="210.0" y="308" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7f4e00">4. SETTER CALLED</text>
  <text x="210.0" y="325" text-anchor="middle" font-size="9.5" fill="#333">setBalance(...), setText(...), setAccounts(...)</text>
  <text x="210.0" y="340" text-anchor="middle" font-size="9.5" fill="#333">React stores the new value and</text>
  <text x="210.0" y="355" text-anchor="middle" font-size="9.5" fill="#333">schedules a re-render (lessons 01, 03, 05)</text>
  <line x1="360" y1="140" x2="538" y2="140" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="449" y="132" text-anchor="middle" font-size="9.5" font-style="italic" fill="#555">returns JSX</text>
  <line x1="690" y1="180" x2="690" y2="288" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="698" y="238" font-size="9.5" font-style="italic" fill="#555">user clicks / types</text>
  <line x1="540" y1="330" x2="362" y2="330" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="451" y="322" text-anchor="middle" font-size="9.5" font-style="italic" fill="#555">handler calls the setter</text>
  <line x1="210" y1="290" x2="210" y2="182" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="218" y="238" font-size="9.5" font-style="italic" fill="#555">next render reads the new value</text>
  <text x="30" y="440" font-size="10.5" fill="#444"><tspan font-weight="bold">Where to where: </tspan>render, screen update, event, handler, setter, then render again with the new state; the loop repeats for every event.</text>
  <text x="30" y="458" font-size="10" font-style="italic" fill="#888">The first render happens when the component first appears. A handler that never calls a setter changes nothing on screen (lesson 05 shows the mutation trap).</text>
  <text x="30" y="476" font-size="10" font-style="italic" fill="#888">Changing an ordinary variable inside a handler does not start this loop: only a setter does.</text>
</svg>
