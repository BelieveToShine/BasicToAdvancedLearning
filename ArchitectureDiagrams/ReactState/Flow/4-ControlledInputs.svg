<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#333"/></marker>
  </defs>
  <rect x="0" y="0" width="900" height="700" fill="#ffffff"/>
  <text x="450.0" y="20" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a237e">Controlled inputs — Flow: the form card is only ever filled in by the clerk</text>
  <text x="450.0" y="38" text-anchor="middle" font-size="11" fill="#666">Every keystroke goes through state, so the input always shows what state holds.</text>
  <g font-size="10.5" fill="#333"><rect x="90" y="50" width="14" height="14" rx="2" fill="#d5c9ea" stroke="#674ea7"/><text x="110" y="61">Render (component function runs)</text></g>
  <g font-size="10.5" fill="#333"><rect x="299.2" y="50" width="14" height="14" rx="2" fill="#fff2cc" stroke="#f1c232"/><text x="319.2" y="61">Event</text></g>
  <g font-size="10.5" fill="#333"><rect x="357.2" y="50" width="14" height="14" rx="2" fill="#f9cb9c" stroke="#e69138"/><text x="377.2" y="61">State change</text></g>
  <g font-size="10.5" fill="#333"><rect x="454.4" y="50" width="14" height="14" rx="2" fill="#f4f4f4" stroke="#888888" stroke-dasharray="6 4"/><text x="474.4" y="61">DOM / screen</text></g>
  <rect x="250" y="80" width="400" height="50" rx="8" fill="#d5c9ea" stroke="#674ea7" stroke-width="1.8"/>
  <text x="450.0" y="98" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#3d2a6b">Render: &lt;input value={text}&gt;</text>
  <text x="450.0" y="115" text-anchor="middle" font-size="9.5" fill="#333">the input shows exactly what state holds</text>
  <rect x="250" y="160" width="400" height="44" rx="8" fill="#fff2cc" stroke="#f1c232" stroke-width="1.8"/>
  <text x="450.0" y="178" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7f6000">User types a key</text>
  <rect x="250" y="234" width="400" height="56" rx="8" fill="#f9cb9c" stroke="#e69138" stroke-width="1.8"/>
  <text x="450.0" y="252" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7f4e00">onChange: setText(event.target.value)</text>
  <text x="450.0" y="269" text-anchor="middle" font-size="9.5" fill="#333">React stores the new text and schedules a re-render</text>
  <line x1="450" y1="130" x2="450" y2="160" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="458" y="148.0" font-size="9" font-style="italic" fill="#555">user focuses and types</text>
  <line x1="450" y1="204" x2="450" y2="232" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="458" y="222" font-size="9" font-style="italic" fill="#555">change event</text>
  <polyline points="250,262 150,262 150,105 248,105" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="142" y="190" text-anchor="end" font-size="9" font-style="italic" fill="#555">re-render with</text>
  <text x="142" y="202" text-anchor="end" font-size="9" font-style="italic" fill="#555">the new text</text>
  <rect x="250" y="330" width="400" height="56" rx="8" fill="#fff2cc" stroke="#f1c232" stroke-width="1.8"/>
  <text x="450.0" y="348" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7f6000">User presses Deposit: onSubmit(event)</text>
  <text x="450.0" y="365" text-anchor="middle" font-size="9.5" fill="#333">event.preventDefault() stops the page reload</text>
  <line x1="450" y1="290" x2="450" y2="330" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="458" y="314" font-size="9" font-style="italic" fill="#555">later: user presses Deposit</text>
  <rect x="250" y="424" width="400" height="56" rx="8" fill="#d5c9ea" stroke="#674ea7" stroke-width="1.8"/>
  <text x="450.0" y="442" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#3d2a6b">message = validateAmount(text)</text>
  <text x="450.0" y="459" text-anchor="middle" font-size="9.5" fill="#333">worked out during render: "" means the amount is fine</text>
  <line x1="450" y1="386" x2="450" y2="424" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="458" y="408.0" font-size="9" font-style="italic" fill="#555">handler reads message</text>
  <rect x="40" y="540" width="330" height="76" rx="8" fill="#d9ead3" stroke="#6aa84f" stroke-width="1.8"/>
  <text x="205.0" y="558" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#274e13">message is "" (valid)</text>
  <text x="205.0" y="575" text-anchor="middle" font-size="9.5" fill="#333">setBalance(current =&gt; current + Number(text))</text>
  <text x="205.0" y="590" text-anchor="middle" font-size="9.5" fill="#333">setText("") and setSubmitted(false)</text>
  <text x="205.0" y="605" text-anchor="middle" font-size="9.5" fill="#333">balance grows, input is cleared</text>
  <rect x="530" y="540" width="330" height="76" rx="8" fill="#f4cccc" stroke="#cc0000" stroke-width="1.8"/>
  <text x="695.0" y="558" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7a0000">message is not "" (invalid)</text>
  <text x="695.0" y="575" text-anchor="middle" font-size="9.5" fill="#333">balance unchanged; text stays</text>
  <text x="695.0" y="590" text-anchor="middle" font-size="9.5" fill="#333">submitted is true, so the alert shows</text>
  <text x="695.0" y="605" text-anchor="middle" font-size="9.5" fill="#333">the message under the form</text>
  <polyline points="350,480 350,510 205,510 205,538" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="198" y="503" text-anchor="end" font-size="9" font-style="italic" fill="#555">valid</text>
  <polyline points="550,480 550,510 695,510 695,538" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="702" y="503" font-size="9" font-style="italic" fill="#555">invalid</text>
  <text x="30" y="656" font-size="10.5" fill="#444"><tspan font-weight="bold">The message is never stored: </tspan>it is recomputed from text on every render.</text>
</svg>
