<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#333"/></marker>
  </defs>
  <rect x="0" y="0" width="900" height="620" fill="#ffffff"/>
  <text x="450.0" y="20" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a237e">State updates — Flow: two ways to add 10 three times: +10 vs +30</text>
  <text x="450.0" y="38" text-anchor="middle" font-size="11" fill="#666">Both clicks start from the same render (balance = 100). The handler finishes first; React renders once afterwards.</text>
  <g font-size="10.5" fill="#333"><rect x="90" y="50" width="14" height="14" rx="2" fill="#d5c9ea" stroke="#674ea7"/><text x="110" y="61">Render (component function runs)</text></g>
  <g font-size="10.5" fill="#333"><rect x="299.2" y="50" width="14" height="14" rx="2" fill="#fff2cc" stroke="#f1c232"/><text x="319.2" y="61">Event</text></g>
  <g font-size="10.5" fill="#333"><rect x="357.2" y="50" width="14" height="14" rx="2" fill="#f9cb9c" stroke="#e69138"/><text x="377.2" y="61">State change</text></g>
  <g font-size="10.5" fill="#333"><rect x="454.4" y="50" width="14" height="14" rx="2" fill="#f4f4f4" stroke="#888888" stroke-dasharray="6 4"/><text x="474.4" y="61">DOM / screen</text></g>
  <rect x="300" y="80" width="300" height="50" rx="8" fill="#d5c9ea" stroke="#674ea7" stroke-width="1.8"/>
  <text x="450.0" y="98" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#3d2a6b">Render: balance = 100</text>
  <text x="450.0" y="115" text-anchor="middle" font-size="9.5" fill="#333">(a fixed snapshot for this render)</text>
  <rect x="40" y="200" width="380" height="100" rx="8" fill="#fff2cc" stroke="#f1c232" stroke-width="1.8"/>
  <text x="230.0" y="218" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7f6000">Click 2a: setBalance(balance + 10) x3</text>
  <text x="230.0" y="235" text-anchor="middle" font-size="9.5" fill="#333">each call reads the snapshot: 100 + 10</text>
  <text x="230.0" y="250" text-anchor="middle" font-size="9.5" fill="#333">queued results: 110, 110, 110</text>
  <text x="230.0" y="265" text-anchor="middle" font-size="9.5" fill="#333">the last one wins: 110</text>
  <rect x="480" y="200" width="380" height="100" rx="8" fill="#fff2cc" stroke="#f1c232" stroke-width="1.8"/>
  <text x="670.0" y="218" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7f6000">Click 2b: setBalance(b =&gt; b + 10) x3</text>
  <text x="670.0" y="235" text-anchor="middle" font-size="9.5" fill="#333">each call gets the previous result</text>
  <text x="670.0" y="250" text-anchor="middle" font-size="9.5" fill="#333">queued: 100 -&gt; 110 -&gt; 120 -&gt; 130</text>
  <text x="670.0" y="265" text-anchor="middle" font-size="9.5" fill="#333">the last one wins: 130</text>
  <polyline points="350,130 350,165 230,165 230,198" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="222" y="158" text-anchor="end" font-size="9" font-style="italic" fill="#555">click 2a</text>
  <polyline points="550,130 550,165 670,165 670,198" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="678" y="158" font-size="9" font-style="italic" fill="#555">click 2b</text>
  <rect x="230" y="360" width="440" height="56" rx="8" fill="#f9cb9c" stroke="#e69138" stroke-width="1.8"/>
  <text x="450.0" y="378" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7f4e00">Handler finishes: React batches the queue</text>
  <text x="450.0" y="395" text-anchor="middle" font-size="9.5" fill="#333">one re-render for all three calls (not three)</text>
  <polyline points="230,300 230,330 350,330 350,358" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="238" y="322" font-size="9" font-style="italic" fill="#555">handler ends</text>
  <polyline points="670,300 670,330 550,330 550,358" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="662" y="322" text-anchor="end" font-size="9" font-style="italic" fill="#555">handler ends</text>
  <rect x="230" y="452" width="440" height="56" rx="8" fill="#d5c9ea" stroke="#674ea7" stroke-width="1.8"/>
  <text x="450.0" y="470" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#3d2a6b">Render: balance = 110 (after 2a) or 130 (after 2b)</text>
  <text x="450.0" y="487" text-anchor="middle" font-size="9.5" fill="#333">a NEW snapshot for the new render</text>
  <line x1="450" y1="416" x2="450" y2="452" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="458" y="437.0" font-size="9" font-style="italic" fill="#555">one re-render</text>
  <line x1="450" y1="508" x2="450" y2="544" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="458" y="529.0" font-size="9" font-style="italic" fill="#555">returns JSX</text>
  <rect x="230" y="544" width="440" height="36" rx="8" fill="#f4f4f4" stroke="#888888" stroke-width="1.8" stroke-dasharray="6 4"/>
  <text x="450.0" y="562" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#444">Screen shows the new balance</text>
  <text x="30" y="604" font-size="10.5" fill="#444"><tspan font-weight="bold">Button 1 shows the snapshot rule: </tspan>right after setBalance(balance + 10) the line below it still reads the old balance.</text>
</svg>
