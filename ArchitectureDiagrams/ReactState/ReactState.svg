<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 660" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#333"/></marker>
  </defs>
  <rect x="0" y="0" width="1050" height="660" fill="#ffffff"/>
  <text x="525.0" y="20" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a237e">ReactState — Architecture: the pieces of state and events, mapped to the lesson files</text>
  <text x="525.0" y="38" text-anchor="middle" font-size="11" fill="#666">A component is a function; state is what it remembers; events are how the user changes it. Numbers 01-05 are the lesson files.</text>
  <g font-size="10.5" fill="#333"><rect x="150" y="50" width="14" height="14" rx="2" fill="#d5c9ea" stroke="#674ea7"/><text x="170" y="61">Component function (render)</text></g>
  <g font-size="10.5" fill="#333"><rect x="336.6" y="50" width="14" height="14" rx="2" fill="#fff2cc" stroke="#f1c232"/><text x="356.6" y="61">Event handler</text></g>
  <g font-size="10.5" fill="#333"><rect x="442.0" y="50" width="14" height="14" rx="2" fill="#f9cb9c" stroke="#e69138"/><text x="462.0" y="61">State</text></g>
  <g font-size="10.5" fill="#333"><rect x="501.0" y="50" width="14" height="14" rx="2" fill="#d9ead3" stroke="#6aa84f"/><text x="521.0" y="61">Props / lifted state (05)</text></g>
  <g font-size="10.5" fill="#333"><rect x="676.0" y="50" width="14" height="14" rx="2" fill="#f4f4f4" stroke="#888888" stroke-dasharray="6 4"/><text x="696.0" y="61">DOM / screen</text></g>
  <rect x="60" y="100" width="330" height="96" rx="8" fill="#d5c9ea" stroke="#674ea7" stroke-width="1.8"/>
  <text x="225.0" y="118" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#3d2a6b">Component function: Bank / BalanceCard</text>
  <text x="225.0" y="135" text-anchor="middle" font-size="9.5" fill="#333">runs again on every render (01, 03)</text>
  <text x="225.0" y="150" text-anchor="middle" font-size="9.5" fill="#333">reads state, returns JSX</text>
  <text x="225.0" y="165" text-anchor="middle" font-size="9.5" fill="#333">ordinary variables are rebuilt each time</text>
  <rect x="660" y="100" width="330" height="96" rx="8" fill="#f4f4f4" stroke="#888888" stroke-width="1.8" stroke-dasharray="6 4"/>
  <text x="825.0" y="118" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#444">DOM: what the user sees</text>
  <text x="825.0" y="135" text-anchor="middle" font-size="9.5" fill="#333">buttons, inputs, balance text</text>
  <text x="825.0" y="150" text-anchor="middle" font-size="9.5" fill="#333">React updates it to match the JSX</text>
  <rect x="660" y="300" width="330" height="96" rx="8" fill="#fff2cc" stroke="#f1c232" stroke-width="1.8"/>
  <text x="825.0" y="318" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7f6000">Event handler (02)</text>
  <text x="825.0" y="335" text-anchor="middle" font-size="9.5" fill="#333">onClick / onChange / onSubmit gets an event</text>
  <text x="825.0" y="350" text-anchor="middle" font-size="9.5" fill="#333">type, target, preventDefault()</text>
  <text x="825.0" y="365" text-anchor="middle" font-size="9.5" fill="#333">pass the function, do not call it</text>
  <rect x="60" y="300" width="330" height="96" rx="8" fill="#f9cb9c" stroke="#e69138" stroke-width="1.8"/>
  <text x="225.0" y="318" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7f4e00">State: useState (01, 03)</text>
  <text x="225.0" y="335" text-anchor="middle" font-size="9.5" fill="#333">const [balance, setBalance] = useState(100)</text>
  <text x="225.0" y="350" text-anchor="middle" font-size="9.5" fill="#333">initial value used on the first render only</text>
  <text x="225.0" y="365" text-anchor="middle" font-size="9.5" fill="#333">snapshot per render; updates are batched</text>
  <line x1="390" y1="148" x2="658" y2="148" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="524" y="140" text-anchor="middle" font-size="9.5" font-style="italic" fill="#555">returns JSX; React updates the DOM</text>
  <line x1="825" y1="196" x2="825" y2="298" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="833" y="250" font-size="9.5" font-style="italic" fill="#555">user clicks / types / submits</text>
  <line x1="660" y1="348" x2="392" y2="348" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="526" y="340" text-anchor="middle" font-size="9.5" font-style="italic" fill="#555">handler calls the setter: setBalance(b =&gt; b + 10)</text>
  <line x1="225" y1="300" x2="225" y2="198" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="233" y="250" font-size="9.5" font-style="italic" fill="#555">next render reads the new value</text>
  <rect x="60" y="480" width="400" height="110" rx="8" fill="#f9cb9c" stroke="#e69138" stroke-width="1.8"/>
  <text x="260.0" y="498" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7f4e00">Controlled input (04)</text>
  <text x="260.0" y="515" text-anchor="middle" font-size="9.5" fill="#333">&lt;input value={text} onChange={...}&gt;</text>
  <text x="260.0" y="530" text-anchor="middle" font-size="9.5" fill="#333">text is state; the input shows exactly that</text>
  <text x="260.0" y="545" text-anchor="middle" font-size="9.5" fill="#333">message = validateAmount(text) is derived,</text>
  <text x="260.0" y="560" text-anchor="middle" font-size="9.5" fill="#333">not stored (deposit form with validation)</text>
  <rect x="560" y="480" width="430" height="110" rx="8" fill="#d9ead3" stroke="#6aa84f" stroke-width="1.8"/>
  <text x="775.0" y="498" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#274e13">Objects and arrays (05)</text>
  <text x="775.0" y="515" text-anchor="middle" font-size="9.5" fill="#333">setAccounts(accounts.map / filter / [...spread])</text>
  <text x="775.0" y="530" text-anchor="middle" font-size="9.5" fill="#333">copy, never mutate: a new value makes React notice</text>
  <text x="775.0" y="545" text-anchor="middle" font-size="9.5" fill="#333">parent (Bank) owns accounts; AccountList and</text>
  <text x="775.0" y="560" text-anchor="middle" font-size="9.5" fill="#333">TotalBalance siblings get them as props</text>
  <line x1="225" y1="396" x2="225" y2="478" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="233" y="440" font-size="9.5" font-style="italic" fill="#555">a form field is just one more piece of state</text>
  <line x1="460" y1="535" x2="558" y2="535" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="509" y="527" text-anchor="middle" font-size="9.5" font-style="italic" fill="#555">bigger state</text>
  <line x1="775" y1="396" x2="775" y2="478" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="783" y="442" font-size="9.5" font-style="italic" fill="#555">handlers call setAccounts(a copy)</text>
  <text x="30" y="624" font-size="10.5" fill="#444"><tspan font-weight="bold">Lesson files: </tspan>01-UseState, 02-EventHandlers, 03-StateUpdates, 04-ControlledInputs, 05-ObjectsAndArrays (src/lessons/ReactState/).</text>
  <text x="30" y="642" font-size="10" font-style="italic" fill="#888">The picker (App.jsx) finds the files automatically; ReactState.test.jsx proves every claim made in the lessons.</text>
</svg>
