<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 396" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#555"/></marker>
  </defs>
  <rect x="0" y="0" width="1050" height="396" fill="#ffffff"/>
  <text x="525" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a237e">Controlled inputs — Memory: where the data lives</text>
  <text x="525" y="46" text-anchor="middle" font-size="12" fill="#666">Instant: the user typed "abc" and pressed Deposit (submitted is true). The balance stays 100 because the amount is not valid.</text>
  <g font-size="11" fill="#333"><rect x="60" y="60" width="14" height="14" rx="2" fill="#f9cb9c" stroke="#e69138"/><text x="80" y="71">State (kept by React)</text></g>
  <g font-size="11" fill="#333"><rect x="236" y="60" width="14" height="14" rx="2" fill="#b6d7a8" stroke="#6aa84f"/><text x="256" y="71">Props (read-only, from parent)</text></g>
  <g font-size="11" fill="#333"><rect x="466" y="60" width="14" height="14" rx="2" fill="#d5c9ea" stroke="#674ea7"/><text x="486" y="71">Derived / this-render values</text></g>
  <g font-size="11" fill="#333"><rect x="684" y="60" width="14" height="14" rx="2" fill="#f4f4f4" stroke="#888888" stroke-dasharray="4 3"/><text x="704" y="71">DOM / browser</text></g>
  <text x="125.0" y="96" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a5a10">STATE — owned by the component</text>
  <text x="385.0" y="96" text-anchor="middle" font-size="11" font-weight="bold" fill="#3f6b3f">PROPS — read-only, from the parent</text>
  <text x="645.0" y="96" text-anchor="middle" font-size="11" font-weight="bold" fill="#3d2a6b">DERIVED — worked out each render</text>
  <text x="915.0" y="96" text-anchor="middle" font-size="11" font-weight="bold" fill="#555">DOM — what the browser shows</text>
  <rect x="810" y="116" width="210" height="168" rx="10" fill="#f4f4f4" stroke="#888888" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="915.0" y="130" text-anchor="middle" font-size="10" font-weight="bold" fill="#555">DOM (browser)</text>
  <rect x="30" y="132" width="190" height="60" rx="8" fill="#f9cb9c" stroke="#e69138" stroke-width="1.5"/>
  <text x="38" y="148" font-size="10" font-weight="bold" fill="#7f4e00">text</text>
  <text x="38" y="163" font-size="10" fill="#7f4e00">text = "abc"</text>
  <text x="38" y="178" font-size="10" fill="#7f4e00">the input's value</text>
  <rect x="550" y="156" width="190" height="60" rx="8" fill="#d5c9ea" stroke="#674ea7" stroke-width="1.5"/>
  <text x="558" y="172" font-size="10" font-weight="bold" fill="#3d2a6b">message</text>
  <text x="558" y="187" font-size="10" fill="#3d2a6b">"Enter a number like</text>
  <text x="558" y="202" font-size="10" fill="#3d2a6b">25 or 25.50 ..."</text>
  <text x="820" y="152" font-size="10" fill="#333">&lt;input&gt; shows: abc</text>
  <text x="820" y="178" font-size="10" fill="#333">alert text:</text>
  <text x="820" y="192" font-size="10" fill="#333">Enter a number like</text>
  <text x="820" y="206" font-size="10" fill="#333">25 or 25.50 (at most</text>
  <text x="820" y="220" font-size="10" fill="#333">2 decimals).</text>
  <line x1="220" y1="148" x2="808" y2="148" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="514.0" y="143" text-anchor="middle" font-size="9" fill="#555">value={text}</text>
  <line x1="220" y1="186" x2="548" y2="186" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="384.0" y="181" text-anchor="middle" font-size="9" fill="#555">validateAmount(text)</text>
  <line x1="740" y1="186" x2="808" y2="186" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="774.0" y="181" text-anchor="middle" font-size="9" fill="#555">if submitted</text>
  <rect x="30" y="216" width="190" height="60" rx="8" fill="#f9cb9c" stroke="#e69138" stroke-width="1.5"/>
  <text x="38" y="232" font-size="10" font-weight="bold" fill="#7f4e00">balance</text>
  <text x="38" y="247" font-size="10" fill="#7f4e00">balanceCents = 10000</text>
  <text x="38" y="262" font-size="10" fill="#7f4e00">shown as 100.00; unchanged</text>
  <text x="820" y="238" font-size="10" fill="#333">Balance: 100.00</text>
  <line x1="220" y1="246.0" x2="808" y2="246.0" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="514.0" y="241.0" text-anchor="middle" font-size="9" fill="#555">shown as</text>
  <text x="30" y="318" font-size="10.5" fill="#444"><tspan font-weight="bold">message is not stored anywhere: </tspan>it is recomputed from text on every render, so it cannot disagree with the input.</text>
  <text x="30" y="336" font-size="10" font-style="italic" fill="#888">The input has no value of its own that React does not know about: what you see is state. A third state variable, submitted (true here), makes the message appear only after the first try.</text>
</svg>
