<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 480" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#555"/></marker>
  </defs>
  <rect x="0" y="0" width="1050" height="480" fill="#ffffff"/>
  <text x="525" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a237e">Event handlers — Memory: where the data lives</text>
  <text x="525" y="46" text-anchor="middle" font-size="12" fill="#666">Instant: right after Save note, having clicked the first button and typed "hello" key by key. Seven lines are in the log.</text>
  <g font-size="11" fill="#333"><rect x="60" y="60" width="14" height="14" rx="2" fill="#f9cb9c" stroke="#e69138"/><text x="80" y="71">State (kept by React)</text></g>
  <g font-size="11" fill="#333"><rect x="236" y="60" width="14" height="14" rx="2" fill="#b6d7a8" stroke="#6aa84f"/><text x="256" y="71">Props (read-only, from parent)</text></g>
  <g font-size="11" fill="#333"><rect x="466" y="60" width="14" height="14" rx="2" fill="#d5c9ea" stroke="#674ea7"/><text x="486" y="71">Derived / this-render values</text></g>
  <g font-size="11" fill="#333"><rect x="684" y="60" width="14" height="14" rx="2" fill="#f4f4f4" stroke="#888888" stroke-dasharray="4 3"/><text x="704" y="71">DOM / browser</text></g>
  <text x="125.0" y="96" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a5a10">STATE — owned by the component</text>
  <text x="385.0" y="96" text-anchor="middle" font-size="11" font-weight="bold" fill="#3f6b3f">PROPS — read-only, from the parent</text>
  <text x="645.0" y="96" text-anchor="middle" font-size="11" font-weight="bold" fill="#3d2a6b">DERIVED — worked out each render</text>
  <text x="915.0" y="96" text-anchor="middle" font-size="11" font-weight="bold" fill="#555">DOM — what the browser shows</text>
  <rect x="810" y="116" width="210" height="252" rx="10" fill="#f4f4f4" stroke="#888888" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="915.0" y="130" text-anchor="middle" font-size="10" font-weight="bold" fill="#555">DOM (browser)</text>
  <rect x="30" y="132" width="190" height="60" rx="8" fill="#f9cb9c" stroke="#e69138" stroke-width="1.5"/>
  <text x="38" y="148" font-size="10" font-weight="bold" fill="#7f4e00">note</text>
  <text x="38" y="163" font-size="10" fill="#7f4e00">note = "hello"</text>
  <text x="38" y="178" font-size="10" fill="#7f4e00">set by onChange</text>
  <text x="820" y="154" font-size="10" fill="#333">input shows: hello</text>
  <line x1="220" y1="162.0" x2="808" y2="162.0" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="514.0" y="157.0" text-anchor="middle" font-size="9" fill="#555">value={note}</text>
  <rect x="30" y="216" width="190" height="60" rx="8" fill="#f9cb9c" stroke="#e69138" stroke-width="1.5"/>
  <text x="38" y="232" font-size="10" font-weight="bold" fill="#7f4e00">log (array)</text>
  <text x="38" y="247" font-size="10" fill="#7f4e00">click, 5x change, submit</text>
  <text x="38" y="262" font-size="10" fill="#7f4e00">7 strings (h, he ... hello)</text>
  <text x="820" y="238" font-size="10" fill="#333">Event log:</text>
  <text x="820" y="253" font-size="10" fill="#333">7 list items</text>
  <line x1="220" y1="246.0" x2="808" y2="246.0" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="514.0" y="241.0" text-anchor="middle" font-size="9" fill="#555">shown as</text>
  <rect x="550" y="300" width="190" height="60" rx="8" fill="#d5c9ea" stroke="#674ea7" stroke-width="1.5"/>
  <text x="558" y="316" font-size="10" font-weight="bold" fill="#3d2a6b">event (from React)</text>
  <text x="558" y="331" font-size="10" fill="#3d2a6b">type = "submit"</text>
  <text x="558" y="346" font-size="10" fill="#3d2a6b">preventDefault() called</text>
  <text x="820" y="322" font-size="10" fill="#333">Save note button</text>
  <text x="820" y="337" font-size="10" fill="#333">(inside the form)</text>
  <line x1="810" y1="330.0" x2="742" y2="330.0" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="776.0" y="325.0" text-anchor="middle" font-size="9" fill="#555">submit event</text>
  <text x="30" y="402" font-size="10.5" fill="#444"><tspan font-weight="bold">Handlers read state and event; they change data only through the setters (setNote, setLog). </tspan>The event object is given to your function for that one event.</text>
  <text x="30" y="420" font-size="10" font-style="italic" fill="#888">Because handleSubmit called event.preventDefault(), the browser did not reload the page, so the state above was not lost.</text>
</svg>
