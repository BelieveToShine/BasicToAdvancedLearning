<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#333"/></marker>
  </defs>
  <rect x="0" y="0" width="1200" height="520" fill="#ffffff"/>
  <text x="600.0" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a237e">React Router: what the topic is made of</text>
  <text x="600.0" y="46" text-anchor="middle" font-size="12" fill="#666">One router, five lessons. Each lesson wraps its demo in its own MemoryRouter, so the lesson picker keeps working.</text>
  <g font-size="11" fill="#333"><rect x="245.0" y="60" width="14" height="14" rx="2" fill="#e8f4fb" stroke="#3d85c6"/><text x="265.0" y="71">1 Routes and Links</text></g>
  <g font-size="11" fill="#333"><rect x="393.0" y="60" width="14" height="14" rx="2" fill="#b6d7a8" stroke="#6aa84f"/><text x="413.0" y="71">2 Route params</text></g>
  <g font-size="11" fill="#333"><rect x="517.0" y="60" width="14" height="14" rx="2" fill="#f9cb9c" stroke="#e69138"/><text x="537.0" y="71">3 Nested + layouts</text></g>
  <g font-size="11" fill="#333"><rect x="665.0" y="60" width="14" height="14" rx="2" fill="#d5c9ea" stroke="#674ea7"/><text x="685.0" y="71">4 Navigate + query</text></g>
  <g font-size="11" fill="#333"><rect x="813.0" y="60" width="14" height="14" rx="2" fill="#fffbe8" stroke="#f1c232"/><text x="833.0" y="71">5 Protected route</text></g>
  <rect x="300" y="90" width="600" height="66" rx="8" fill="#e8f4fb" stroke="#3d85c6" stroke-width="1.5"/>
  <text x="600.0" y="107" text-anchor="middle" font-size="11" font-weight="bold" fill="#222">MemoryRouter (react-router-dom 7.18.4)</text>
  <text x="600.0" y="124" text-anchor="middle" font-size="10" fill="#333">keeps the current URL in memory and tells the components below it</text>
  <text x="600.0" y="139" text-anchor="middle" font-size="10" fill="#333">when it changes; BrowserRouter would use the real address bar instead</text>
  <polyline points="600,156 600,205" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="138.0" y1="205" x2="1082.0" y2="205" stroke="#333" stroke-width="1.6"/>
  <text x="930" y="199" text-anchor="middle" font-size="9.5" font-style="italic" fill="#444">gives each lesson its URL (location)</text>
  <polyline points="138.0,205 138.0,250" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="30" y="250" width="216" height="150" rx="8" fill="#e8f4fb" stroke="#3d85c6" stroke-width="1.5"/>
  <text x="138.0" y="267" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#222">1 RoutesAndLinks</text>
  <text x="138.0" y="284" text-anchor="middle" font-size="10" fill="#333">&lt;Routes&gt; / &lt;Route path&gt;</text>
  <text x="138.0" y="299" text-anchor="middle" font-size="10" fill="#333">&lt;Link to&gt;  vs plain &lt;a&gt;</text>
  <text x="138.0" y="314" text-anchor="middle" font-size="10" fill="#333">path="*" catch-all</text>
  <text x="138.0" y="329" text-anchor="middle" font-size="10" fill="#333">Test: Link cancels the</text>
  <text x="138.0" y="344" text-anchor="middle" font-size="10" fill="#333">browser load; state kept</text>
  <polyline points="374.0,205 374.0,250" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="266" y="250" width="216" height="150" rx="8" fill="#b6d7a8" stroke="#6aa84f" stroke-width="1.5"/>
  <text x="374.0" y="267" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#222">2 RouteParams</text>
  <text x="374.0" y="284" text-anchor="middle" font-size="10" fill="#333">path="/accounts/:id"</text>
  <text x="374.0" y="299" text-anchor="middle" font-size="10" fill="#333">useParams() -&gt; strings</text>
  <text x="374.0" y="314" text-anchor="middle" font-size="10" fill="#333">not found: no Route</text>
  <text x="374.0" y="329" text-anchor="middle" font-size="10" fill="#333">vs no data for the id</text>
  <text x="374.0" y="344" text-anchor="middle" font-size="10" fill="#333">Test: id is "2"</text>
  <polyline points="610.0,205 610.0,250" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="502" y="250" width="216" height="150" rx="8" fill="#f9cb9c" stroke="#e69138" stroke-width="1.5"/>
  <text x="610.0" y="267" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#222">3 NestedRoutesAndLayouts</text>
  <text x="610.0" y="284" text-anchor="middle" font-size="10" fill="#333">parent Route + child Routes</text>
  <text x="610.0" y="299" text-anchor="middle" font-size="10" fill="#333">index route</text>
  <text x="610.0" y="314" text-anchor="middle" font-size="10" fill="#333">&lt;Outlet /&gt; in a layout</text>
  <text x="610.0" y="329" text-anchor="middle" font-size="10" fill="#333">relative &lt;Link to="2"&gt;</text>
  <text x="610.0" y="344" text-anchor="middle" font-size="10" fill="#333">Test: layout state kept</text>
  <polyline points="846.0,205 846.0,250" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="738" y="250" width="216" height="150" rx="8" fill="#d5c9ea" stroke="#674ea7" stroke-width="1.5"/>
  <text x="846.0" y="267" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#222">4 NavigationAndSearchParams</text>
  <text x="846.0" y="284" text-anchor="middle" font-size="10" fill="#333">useNavigate(), navigate(-1)</text>
  <text x="846.0" y="299" text-anchor="middle" font-size="10" fill="#333">NavLink: class "active"</text>
  <text x="846.0" y="314" text-anchor="middle" font-size="10" fill="#333">useSearchParams()</text>
  <text x="846.0" y="329" text-anchor="middle" font-size="10" fill="#333">filter lives in the URL</text>
  <text x="846.0" y="344" text-anchor="middle" font-size="10" fill="#333">Test: URL ?type=Savings</text>
  <polyline points="1082.0,205 1082.0,250" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="974" y="250" width="216" height="150" rx="8" fill="#fffbe8" stroke="#f1c232" stroke-width="1.5"/>
  <text x="1082.0" y="267" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#222">5 ProtectedRoute-preview</text>
  <text x="1082.0" y="284" text-anchor="middle" font-size="10" fill="#333">guard component</text>
  <text x="1082.0" y="299" text-anchor="middle" font-size="10" fill="#333">&lt;Navigate replace state&gt;</text>
  <text x="1082.0" y="314" text-anchor="middle" font-size="10" fill="#333">useNavigationType()</text>
  <text x="1082.0" y="329" text-anchor="middle" font-size="10" fill="#333">UX only: the API must</text>
  <text x="1082.0" y="344" text-anchor="middle" font-size="10" fill="#333">check auth (not security)</text>
  <rect x="300" y="440" width="600" height="56" rx="8" fill="#ffffff" stroke="#888888" stroke-width="1.5"/>
  <text x="600.0" y="457" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#222">shared.jsx: ACCOUNTS (Asha Rao, Ben Carter, Chen Li), findAccount(id), UrlBar</text>
  <text x="600.0" y="474" text-anchor="middle" font-size="10" fill="#333">the bank data every lesson reads; UrlBar shows the router's current URL</text>
  <text x="492" y="422" text-anchor="middle" font-size="9.5" font-style="italic" fill="#444">imported by lessons 1-5</text>
  <line x1="138.0" y1="428" x2="1082.0" y2="428" stroke="#333" stroke-width="1.6"/>
  <polyline points="138.0,428 138.0,400" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <polyline points="374.0,428 374.0,400" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <polyline points="610.0,428 610.0,400" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <polyline points="846.0,428 846.0,400" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <polyline points="1082.0,428 1082.0,400" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="600" y1="440" x2="600" y2="428" stroke="#333" stroke-width="1.6"/>
</svg>
