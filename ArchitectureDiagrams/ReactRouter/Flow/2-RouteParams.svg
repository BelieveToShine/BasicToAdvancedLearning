<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 440" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#333"/></marker>
  </defs>
  <rect x="0" y="0" width="1080" height="440" fill="#ffffff"/>
  <text x="540.0" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a237e">Route params: Sub-level Flow: a switchboard operator</text>
  <text x="540.0" y="46" text-anchor="middle" font-size="12" fill="#666">One pattern route "/accounts/:id" serves every account. Three different outcomes are possible for a URL.</text>
  <g font-size="11" fill="#333"><rect x="235.0" y="60" width="14" height="14" rx="2" fill="#e8f4fb" stroke="#3d85c6"/><text x="255.0" y="71">browser / user</text></g>
  <g font-size="11" fill="#333"><rect x="359.0" y="60" width="14" height="14" rx="2" fill="#f9cb9c" stroke="#e69138"/><text x="379.0" y="71">router state</text></g>
  <g font-size="11" fill="#333"><rect x="471.0" y="60" width="14" height="14" rx="2" fill="#d5c9ea" stroke="#674ea7"/><text x="491.0" y="71">computed by the router</text></g>
  <g font-size="11" fill="#333"><rect x="643.0" y="60" width="14" height="14" rx="2" fill="#b6d7a8" stroke="#6aa84f"/><text x="663.0" y="71">your component / DOM output</text></g>
  <rect x="40" y="100" width="190" height="84" rx="8" fill="#e8f4fb" stroke="#3d85c6" stroke-width="1.5"/>
  <text x="135.0" y="117" text-anchor="middle" font-size="11" font-weight="bold" fill="#222">URL /accounts/2</text>
  <text x="135.0" y="134" text-anchor="middle" font-size="10" fill="#333">linked: &lt;Link to="/accounts/2"&gt;</text>
  <text x="135.0" y="149" text-anchor="middle" font-size="10" fill="#333">(or typed, in a real app)</text>
  <rect x="310" y="100" width="190" height="84" rx="8" fill="#d5c9ea" stroke="#674ea7" stroke-width="1.5"/>
  <text x="405.0" y="117" text-anchor="middle" font-size="11" font-weight="bold" fill="#222">&lt;Routes&gt; tries paths</text>
  <text x="405.0" y="134" text-anchor="middle" font-size="10" fill="#333">"/accounts" no (extra part)</text>
  <text x="405.0" y="149" text-anchor="middle" font-size="10" fill="#333">"/accounts/:id" yes</text>
  <rect x="580" y="100" width="190" height="84" rx="8" fill="#d5c9ea" stroke="#674ea7" stroke-width="1.5"/>
  <text x="675.0" y="117" text-anchor="middle" font-size="11" font-weight="bold" fill="#222">useParams()</text>
  <text x="675.0" y="134" text-anchor="middle" font-size="10" fill="#333">{ id: "2" }</text>
  <text x="675.0" y="149" text-anchor="middle" font-size="10" fill="#333">a string, not a number</text>
  <rect x="850" y="100" width="190" height="84" rx="8" fill="#d5c9ea" stroke="#674ea7" stroke-width="1.5"/>
  <text x="945.0" y="117" text-anchor="middle" font-size="11" font-weight="bold" fill="#222">ACCOUNTS.find(...)</text>
  <text x="945.0" y="134" text-anchor="middle" font-size="10" fill="#333">a.id === "2" -&gt; Ben Carter</text>
  <text x="945.0" y="149" text-anchor="middle" font-size="10" fill="#333">no match -&gt; undefined</text>
  <polyline points="230,142 310,142" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="270" y="134" text-anchor="middle" font-size="9.5" font-style="italic" fill="#444">URL goes to</text>
  <polyline points="500,142 580,142" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="540" y="134" text-anchor="middle" font-size="9.5" font-style="italic" fill="#444">pattern fills :id</text>
  <polyline points="770,142 850,142" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="810" y="134" text-anchor="middle" font-size="9.5" font-style="italic" fill="#444">id is looked up</text>
  <rect x="310" y="270" width="190" height="94" rx="8" fill="#f4f4f4" stroke="#999999" stroke-width="1.5"/>
  <text x="405.0" y="287" text-anchor="middle" font-size="11" font-weight="bold" fill="#222">No Route fits the URL</text>
  <text x="405.0" y="304" text-anchor="middle" font-size="10" fill="#333">e.g. /nonsense: path="*" shows</text>
  <text x="405.0" y="319" text-anchor="middle" font-size="10" fill="#333">"404: no page for this URL"</text>
  <polyline points="405.0,184 405.0,270" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="413.0" y="224" font-size="9.5" font-style="italic" fill="#444">no path matches</text>
  <rect x="580" y="270" width="190" height="94" rx="8" fill="#b6d7a8" stroke="#6aa84f" stroke-width="1.5"/>
  <text x="675.0" y="287" text-anchor="middle" font-size="11" font-weight="bold" fill="#222">Route fits, no data</text>
  <text x="675.0" y="304" text-anchor="middle" font-size="10" fill="#333">/accounts/99: find() gives</text>
  <text x="675.0" y="319" text-anchor="middle" font-size="10" fill="#333">undefined; component says so</text>
  <polyline points="890,184 890,226 675.0,226 675.0,270" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="735.0" y="244" font-size="9.5" font-style="italic" fill="#444">nothing found</text>
  <rect x="850" y="270" width="190" height="94" rx="8" fill="#b6d7a8" stroke="#6aa84f" stroke-width="1.5"/>
  <text x="945.0" y="287" text-anchor="middle" font-size="11" font-weight="bold" fill="#222">Route fits, data found</text>
  <text x="945.0" y="304" text-anchor="middle" font-size="10" fill="#333">&lt;h3&gt;Ben Carter&lt;/h3&gt;</text>
  <text x="945.0" y="319" text-anchor="middle" font-size="10" fill="#333">Current, balance 85.50</text>
  <polyline points="1000,184 1000,270" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="1008" y="250" font-size="9.5" font-style="italic" fill="#444">account found</text>
  <text x="40" y="385" font-size="10.5" font-style="italic" fill="#777">Two different "not found" cases: the router cannot know your data, so only your component can say "no account 99".</text>
  <text x="40" y="403" font-size="10.5" font-style="italic" fill="#777">Tests: id is the string "2"; /accounts/99 shows the in-component message; /nonsense reaches the path="*" route.</text>
</svg>
