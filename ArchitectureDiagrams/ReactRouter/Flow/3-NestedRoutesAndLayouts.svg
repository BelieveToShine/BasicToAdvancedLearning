<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 432" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#333"/></marker>
  </defs>
  <rect x="0" y="0" width="1080" height="432" fill="#ffffff"/>
  <text x="540.0" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a237e">Nested routes and layouts: Sub-level Flow: a picture frame</text>
  <text x="540.0" y="46" text-anchor="middle" font-size="12" fill="#666">The frame (layout) stays on the wall; only the picture in the &lt;Outlet /&gt; is swapped.</text>
  <g font-size="11" fill="#333"><rect x="235.0" y="60" width="14" height="14" rx="2" fill="#e8f4fb" stroke="#3d85c6"/><text x="255.0" y="71">browser / user</text></g>
  <g font-size="11" fill="#333"><rect x="359.0" y="60" width="14" height="14" rx="2" fill="#f9cb9c" stroke="#e69138"/><text x="379.0" y="71">router state</text></g>
  <g font-size="11" fill="#333"><rect x="471.0" y="60" width="14" height="14" rx="2" fill="#d5c9ea" stroke="#674ea7"/><text x="491.0" y="71">computed by the router</text></g>
  <g font-size="11" fill="#333"><rect x="643.0" y="60" width="14" height="14" rx="2" fill="#b6d7a8" stroke="#6aa84f"/><text x="663.0" y="71">your component / DOM output</text></g>
  <rect x="40" y="100" width="190" height="84" rx="8" fill="#e8f4fb" stroke="#3d85c6" stroke-width="1.5"/>
  <text x="135.0" y="117" text-anchor="middle" font-size="11" font-weight="bold" fill="#222">URL /accounts/1</text>
  <text x="135.0" y="134" text-anchor="middle" font-size="10" fill="#333">arrives from a Link</text>
  <text x="135.0" y="149" text-anchor="middle" font-size="10" fill="#333">(or the first render)</text>
  <rect x="310" y="100" width="190" height="84" rx="8" fill="#d5c9ea" stroke="#674ea7" stroke-width="1.5"/>
  <text x="405.0" y="117" text-anchor="middle" font-size="11" font-weight="bold" fill="#222">Parent + child Route</text>
  <text x="405.0" y="134" text-anchor="middle" font-size="10" fill="#333">"/accounts" (layout)</text>
  <text x="405.0" y="149" text-anchor="middle" font-size="10" fill="#333">then ":id" (child)</text>
  <rect x="580" y="100" width="190" height="84" rx="8" fill="#f9cb9c" stroke="#e69138" stroke-width="1.5"/>
  <text x="675.0" y="117" text-anchor="middle" font-size="11" font-weight="bold" fill="#222">&lt;AccountsLayout /&gt;</text>
  <text x="675.0" y="134" text-anchor="middle" font-size="10" fill="#333">draws the frame + the note</text>
  <text x="675.0" y="149" text-anchor="middle" font-size="10" fill="#333">input (its own state)</text>
  <rect x="850" y="100" width="190" height="84" rx="8" fill="#b6d7a8" stroke="#6aa84f" stroke-width="1.5"/>
  <text x="945.0" y="117" text-anchor="middle" font-size="11" font-weight="bold" fill="#222">&lt;Outlet /&gt; puts child</text>
  <text x="945.0" y="134" text-anchor="middle" font-size="10" fill="#333">&lt;AccountDetail /&gt; goes here</text>
  <text x="945.0" y="149" text-anchor="middle" font-size="10" fill="#333">Asha Rao, Balance 1200.00</text>
  <rect x="40" y="254" width="190" height="84" rx="8" fill="#e8f4fb" stroke="#3d85c6" stroke-width="1.5"/>
  <text x="135.0" y="271" text-anchor="middle" font-size="11" font-weight="bold" fill="#222">Click "Back to the list"</text>
  <text x="135.0" y="288" text-anchor="middle" font-size="10" fill="#333">&lt;Link to="/accounts"&gt;</text>
  <text x="135.0" y="303" text-anchor="middle" font-size="10" fill="#333">URL becomes /accounts</text>
  <rect x="310" y="254" width="190" height="84" rx="8" fill="#b6d7a8" stroke="#6aa84f" stroke-width="1.5"/>
  <text x="405.0" y="271" text-anchor="middle" font-size="11" font-weight="bold" fill="#222">Outlet swaps the child</text>
  <text x="405.0" y="288" text-anchor="middle" font-size="10" fill="#333">&lt;AccountList /&gt; replaces</text>
  <text x="405.0" y="303" text-anchor="middle" font-size="10" fill="#333">&lt;AccountDetail /&gt;</text>
  <rect x="580" y="254" width="190" height="84" rx="8" fill="#f9cb9c" stroke="#e69138" stroke-width="1.5"/>
  <text x="675.0" y="271" text-anchor="middle" font-size="11" font-weight="bold" fill="#222">Layout kept in place</text>
  <text x="675.0" y="288" text-anchor="middle" font-size="10" fill="#333">not re-created, so the note</text>
  <text x="675.0" y="303" text-anchor="middle" font-size="10" fill="#333">text "call Asha" is still there</text>
  <rect x="850" y="254" width="190" height="84" rx="8" fill="#e8f4fb" stroke="#3d85c6" stroke-width="1.5"/>
  <text x="945.0" y="271" text-anchor="middle" font-size="11" font-weight="bold" fill="#222">DOM: only the middle</text>
  <text x="945.0" y="288" text-anchor="middle" font-size="10" fill="#333">frame and input stay;</text>
  <text x="945.0" y="303" text-anchor="middle" font-size="10" fill="#333">list replaces the detail</text>
  <polyline points="230,142.0 310,142.0" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="270.0" y="134.0" text-anchor="middle" font-size="9.5" font-style="italic" fill="#444">matches</text>
  <polyline points="500,142.0 580,142.0" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="540.0" y="134.0" text-anchor="middle" font-size="9.5" font-style="italic" fill="#444">renders parent</text>
  <polyline points="770,142.0 850,142.0" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="810.0" y="134.0" text-anchor="middle" font-size="9.5" font-style="italic" fill="#444">at &lt;Outlet /&gt;</text>
  <polyline points="945.0,184 945.0,219.0 135.0,219.0 135.0,254" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <polyline points="230,296.0 310,296.0" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="270.0" y="276.0" text-anchor="middle" font-size="9.5" font-style="italic" fill="#444">index route</text>
  <text x="270.0" y="288.0" text-anchor="middle" font-size="9.5" font-style="italic" fill="#444">matches</text>
  <polyline points="500,296.0 580,296.0" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="540.0" y="276.0" text-anchor="middle" font-size="9.5" font-style="italic" fill="#444">layout is</text>
  <text x="540.0" y="288.0" text-anchor="middle" font-size="9.5" font-style="italic" fill="#444">the same</text>
  <polyline points="770,296.0 850,296.0" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="810.0" y="288.0" text-anchor="middle" font-size="9.5" font-style="italic" fill="#444">so</text>
  <text x="40" y="390" font-size="10.5" font-style="italic" fill="#777">Test: type a note, open an account, go back: the note is still in the input.</text>
  <text x="40" y="408" font-size="10.5" font-style="italic" fill="#777">A route outside the parent (the Home link) has no layout, so the frame disappears there.</text>
</svg>
