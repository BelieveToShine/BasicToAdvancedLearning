<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 432" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#333"/></marker>
  </defs>
  <rect x="0" y="0" width="1080" height="432" fill="#ffffff"/>
  <text x="540.0" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a237e">Protected route (preview): Sub-level Flow: a door with a sign</text>
  <text x="540.0" y="46" text-anchor="middle" font-size="12" fill="#666">The guard turns people away at the door of the screen. It is a courtesy, not a lock.</text>
  <g font-size="11" fill="#333"><rect x="235.0" y="60" width="14" height="14" rx="2" fill="#e8f4fb" stroke="#3d85c6"/><text x="255.0" y="71">browser / user</text></g>
  <g font-size="11" fill="#333"><rect x="359.0" y="60" width="14" height="14" rx="2" fill="#f9cb9c" stroke="#e69138"/><text x="379.0" y="71">router state</text></g>
  <g font-size="11" fill="#333"><rect x="471.0" y="60" width="14" height="14" rx="2" fill="#d5c9ea" stroke="#674ea7"/><text x="491.0" y="71">computed by the router</text></g>
  <g font-size="11" fill="#333"><rect x="643.0" y="60" width="14" height="14" rx="2" fill="#b6d7a8" stroke="#6aa84f"/><text x="663.0" y="71">your component / DOM output</text></g>
  <rect x="40" y="100" width="190" height="84" rx="8" fill="#e8f4fb" stroke="#3d85c6" stroke-width="1.5"/>
  <text x="135.0" y="117" text-anchor="middle" font-size="11" font-weight="bold" fill="#222">Click "My accounts"</text>
  <text x="135.0" y="134" text-anchor="middle" font-size="10" fill="#333">&lt;Link to="/my-accounts"&gt;</text>
  <text x="135.0" y="149" text-anchor="middle" font-size="10" fill="#333">isLoggedIn is false</text>
  <rect x="310" y="100" width="190" height="84" rx="8" fill="#f9cb9c" stroke="#e69138" stroke-width="1.5"/>
  <text x="405.0" y="117" text-anchor="middle" font-size="11" font-weight="bold" fill="#222">Router location</text>
  <text x="405.0" y="134" text-anchor="middle" font-size="10" fill="#333">pathname = "/my-accounts"</text>
  <rect x="580" y="100" width="190" height="84" rx="8" fill="#b6d7a8" stroke="#6aa84f" stroke-width="1.5"/>
  <text x="675.0" y="117" text-anchor="middle" font-size="11" font-weight="bold" fill="#222">&lt;ProtectedRoute&gt;</text>
  <text x="675.0" y="134" text-anchor="middle" font-size="10" fill="#333">gets isLoggedIn = false</text>
  <text x="675.0" y="149" text-anchor="middle" font-size="10" fill="#333">does not return the page</text>
  <rect x="850" y="100" width="190" height="84" rx="8" fill="#d5c9ea" stroke="#674ea7" stroke-width="1.5"/>
  <text x="945.0" y="117" text-anchor="middle" font-size="11" font-weight="bold" fill="#222">&lt;Navigate replace&gt;</text>
  <text x="945.0" y="134" text-anchor="middle" font-size="10" fill="#333">to="/login"</text>
  <text x="945.0" y="149" text-anchor="middle" font-size="10" fill="#333">state = { from: "/my-accounts" }</text>
  <rect x="40" y="254" width="190" height="84" rx="8" fill="#f9cb9c" stroke="#e69138" stroke-width="1.5"/>
  <text x="135.0" y="271" text-anchor="middle" font-size="11" font-weight="bold" fill="#222">Router location</text>
  <text x="135.0" y="288" text-anchor="middle" font-size="10" fill="#333">pathname = "/login"</text>
  <text x="135.0" y="303" text-anchor="middle" font-size="10" fill="#333">navigationType = "REPLACE"</text>
  <rect x="310" y="254" width="190" height="84" rx="8" fill="#f9cb9c" stroke="#e69138" stroke-width="1.5"/>
  <text x="405.0" y="271" text-anchor="middle" font-size="11" font-weight="bold" fill="#222">onLogin() + navigate</text>
  <text x="405.0" y="288" text-anchor="middle" font-size="10" fill="#333">isLoggedIn = true</text>
  <text x="405.0" y="303" text-anchor="middle" font-size="10" fill="#333">navigate(from, { replace: true })</text>
  <rect x="580" y="254" width="190" height="84" rx="8" fill="#b6d7a8" stroke="#6aa84f" stroke-width="1.5"/>
  <text x="675.0" y="271" text-anchor="middle" font-size="11" font-weight="bold" fill="#222">Guard lets it through</text>
  <text x="675.0" y="288" text-anchor="middle" font-size="10" fill="#333">&lt;ProtectedRoute&gt; returns</text>
  <text x="675.0" y="303" text-anchor="middle" font-size="10" fill="#333">its children</text>
  <rect x="850" y="254" width="190" height="84" rx="8" fill="#e8f4fb" stroke="#3d85c6" stroke-width="1.5"/>
  <text x="945.0" y="271" text-anchor="middle" font-size="11" font-weight="bold" fill="#222">My accounts page</text>
  <text x="945.0" y="288" text-anchor="middle" font-size="10" fill="#333">Asha Rao, Savings 1200.00</text>
  <polyline points="230,142.0 310,142.0" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="270.0" y="134.0" text-anchor="middle" font-size="9.5" font-style="italic" fill="#444">location</text>
  <polyline points="500,142.0 580,142.0" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="540.0" y="134.0" text-anchor="middle" font-size="9.5" font-style="italic" fill="#444">matches</text>
  <polyline points="770,142.0 850,142.0" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="810.0" y="134.0" text-anchor="middle" font-size="9.5" font-style="italic" fill="#444">returns</text>
  <polyline points="945.0,184 945.0,219.0 135.0,219.0 135.0,254" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="540.0" y="213.0" text-anchor="middle" font-size="9.5" font-style="italic" fill="#444">replaces entry</text>
  <polyline points="230,296.0 310,296.0" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="270.0" y="276.0" text-anchor="middle" font-size="9.5" font-style="italic" fill="#444">click "Pretend</text>
  <text x="270.0" y="288.0" text-anchor="middle" font-size="9.5" font-style="italic" fill="#444">to log in"</text>
  <polyline points="500,296.0 580,296.0" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="540.0" y="288.0" text-anchor="middle" font-size="9.5" font-style="italic" fill="#444">location again</text>
  <polyline points="770,296.0 850,296.0" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="810.0" y="288.0" text-anchor="middle" font-size="9.5" font-style="italic" fill="#444">shows</text>
  <text x="40" y="390" font-size="10.5" font-style="italic" fill="#777">UX only: this code runs in the user's browser. The API must check authentication on every request (JWT, Phase 4).</text>
  <text x="40" y="408" font-size="10.5" font-style="italic" fill="#777">Here "logged in" is a plain true/false: no password and no token. Replace with the real login later.</text>
</svg>
