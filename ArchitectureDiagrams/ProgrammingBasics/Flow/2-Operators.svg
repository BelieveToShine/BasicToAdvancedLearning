<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#555"/></marker>
  </defs>
  <rect x="0" y="0" width="700" height="300" fill="#ffffff"/>
  <text x="350" y="24" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a237e">Operators — Sub-level Flow</text>
  <text x="350" y="42" text-anchor="middle" font-size="11.5" fill="#666">No branching, no looping — four operator families evaluated in sequence, one print each.</text>

  <ellipse cx="350" cy="70" rx="130" ry="22" fill="#d9ead3" stroke="#38761d" stroke-width="1.5"/>
  <text x="350" y="75" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#274e13">Start: ExplainOperators()</text>
  <line x1="350" y1="92" x2="350" y2="108" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="180" y="110" width="340" height="70" rx="8" fill="#f3effb" stroke="#674ea7" stroke-width="1.5"/>
  <text x="350" y="132" text-anchor="middle" font-size="10.5" fill="#3d2a6b">Runs arithmetic, comparison, logical</text>
  <text x="350" y="148" text-anchor="middle" font-size="10.5" fill="#3d2a6b">and assignment operators, then prints</text>
  <text x="350" y="164" text-anchor="middle" font-size="10.5" fill="#3d2a6b">each result via Console.WriteLine</text>

  <line x1="350" y1="180" x2="350" y2="198" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
  <ellipse cx="350" cy="224" rx="130" ry="22" fill="#f4cccc" stroke="#cc0000" stroke-width="1.5"/>
  <text x="350" y="229" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#990000">End</text>

  <text x="30" y="270" font-size="10" font-style="italic" fill="#888">Same simple shape as Flow/1-VariablesAndDataTypes.svg — only the process step's content changes.</text>
</svg>
