<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 580" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#555"/></marker>
  </defs>
  <rect x="0" y="0" width="780" height="580" fill="#ffffff"/>
  <text x="390" y="24" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a237e">Input &amp; Output — Sub-level Flow</text>
  <text x="390" y="44" text-anchor="middle" font-size="12" fill="#666">The one real branch in Programming Basics: does the typed age text parse as a number?</text>

  <ellipse cx="280" cy="70" rx="130" ry="22" fill="#d9ead3" stroke="#38761d" stroke-width="1.5"/>
  <text x="280" y="75" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#274e13">Start: ExplainInputOutput()</text>
  <line x1="280" y1="92" x2="280" y2="108" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="140" y="110" width="280" height="46" rx="8" fill="#fdebd9" stroke="#e69138" stroke-width="1.5"/>
  <text x="280" y="137" text-anchor="middle" font-size="10" fill="#8a5a10">Console.Write + Console.ReadLine — name</text>
  <line x1="280" y1="156" x2="280" y2="174" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="140" y="176" width="280" height="46" rx="8" fill="#fdebd9" stroke="#e69138" stroke-width="1.5"/>
  <text x="280" y="203" text-anchor="middle" font-size="10" fill="#8a5a10">Console.Write + Console.ReadLine — age (text)</text>
  <line x1="280" y1="222" x2="280" y2="248" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>

  <polygon points="280,250 400,300 280,350 160,300" fill="#fce5cd" stroke="#e69138" stroke-width="1.5"/>
  <text x="280" y="294" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#7f4e00">int.TryParse(ageText, out age)</text>
  <text x="280" y="308" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#7f4e00">succeeds?</text>

  <line x1="400" y1="300" x2="460" y2="300" stroke="#555" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="430" y="290" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#274e13">Yes</text>
  <rect x="462" y="275" width="280" height="50" rx="8" fill="#cfe2f3" stroke="#3d85c6" stroke-width="1.5"/>
  <text x="602" y="304" text-anchor="middle" font-size="9.5" fill="#123">Print: "...next year you'll be N" message</text>

  <line x1="280" y1="350" x2="280" y2="380" stroke="#555" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="296" y="368" font-size="10.5" font-weight="bold" fill="#990000">No</text>
  <rect x="140" y="382" width="280" height="50" rx="8" fill="#cfe2f3" stroke="#3d85c6" stroke-width="1.5"/>
  <text x="280" y="411" text-anchor="middle" font-size="9.5" fill="#123">Print: "...not a valid number" message</text>

  <!-- Merges to End — orthogonal only -->
  <path d="M602,325 L602,450 L300,450 L300,468" fill="none" stroke="#555" stroke-width="1.3" marker-end="url(#a)"/>
  <line x1="280" y1="432" x2="280" y2="468" stroke="#555" stroke-width="1.4" marker-end="url(#a)"/>

  <ellipse cx="280" cy="494" rx="130" ry="22" fill="#f4cccc" stroke="#cc0000" stroke-width="1.5"/>
  <text x="280" y="499" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#990000">End</text>

  <text x="30" y="540" font-size="10.5" fill="#444"><tspan font-weight="bold">Exactly one</tspan> of the two Print branches runs. int.TryParse never throws — it returns true/false, which is why this can safely branch instead of crashing.</text>
</svg>
