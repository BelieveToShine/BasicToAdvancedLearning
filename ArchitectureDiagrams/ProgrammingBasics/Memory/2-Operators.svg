<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="1000" height="520" fill="#ffffff"/>
  <text x="500" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a237e">Programming Basics — Operators — Memory: Stack / Heap / Static</text>
  <text x="500" y="46" text-anchor="middle" font-size="12" fill="#666">Snapshot: ProgrammingBasicsDemo.ExplainOperators() is currently executing.</text>

  <g font-size="11" fill="#333">
    <rect x="200" y="60" width="14" height="14" rx="2" fill="#b6d7a8" stroke="#6aa84f"/><text x="220" y="71">Stack</text>
    <rect x="380" y="60" width="14" height="14" rx="2" fill="#f9cb9c" stroke="#e69138"/><text x="400" y="71">Heap</text>
    <rect x="560" y="60" width="14" height="14" rx="2" fill="#d5c9ea" stroke="#674ea7"/><text x="580" y="71">Static</text>
  </g>

  <text x="220" y="96" text-anchor="middle" font-size="12" font-weight="bold" fill="#3f6b3f">STACK — call frames (top = currently executing)</text>
  <text x="580" y="96" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a5a10">HEAP</text>
  <text x="855" y="96" text-anchor="middle" font-size="12" font-weight="bold" fill="#3d2a6b">STATIC</text>

  <rect x="30" y="108" width="380" height="336" rx="10" fill="none" stroke="#999" stroke-width="1" stroke-dasharray="5 4"/>

  <rect x="50" y="118" width="340" height="196" rx="8" fill="#b6d7a8" stroke="#6aa84f" stroke-width="2"/>
  <text x="220" y="136" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#274e13">ProgrammingBasicsDemo.ExplainOperators() — ACTIVE</text>
  <rect x="62" y="146" width="316" height="26" rx="4" fill="#ffffff" stroke="#8fbf8f"/><text x="70" y="163" font-size="10" fill="#1b3d1b">a = 10  (int)</text>
  <rect x="62" y="176" width="316" height="26" rx="4" fill="#ffffff" stroke="#8fbf8f"/><text x="70" y="193" font-size="10" fill="#1b3d1b">b = 3  (int)</text>
  <rect x="62" y="206" width="316" height="26" rx="4" fill="#ffffff" stroke="#8fbf8f"/><text x="70" y="223" font-size="10" fill="#1b3d1b">hasTicket = true  (bool)</text>
  <rect x="62" y="236" width="316" height="26" rx="4" fill="#ffffff" stroke="#8fbf8f"/><text x="70" y="253" font-size="10" fill="#1b3d1b">hasId = false  (bool)</text>
  <rect x="62" y="266" width="316" height="26" rx="4" fill="#ffffff" stroke="#8fbf8f"/><text x="70" y="283" font-size="10" fill="#1b3d1b">score = 8  (int, after += 3)</text>

  <rect x="50" y="324" width="340" height="50" rx="8" fill="#dcecdc" stroke="#6aa84f" stroke-width="1.5"/>
  <text x="220" y="344" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#4c6b4c">ProgrammingBasicsExample.Explain()</text>
  <text x="220" y="360" text-anchor="middle" font-size="9.5" fill="#6b8a6b">paused — waiting for the call above to return</text>

  <rect x="50" y="384" width="340" height="50" rx="8" fill="#dcecdc" stroke="#6aa84f" stroke-width="1.5"/>
  <text x="220" y="404" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#4c6b4c">Program.cs (Main)</text>
  <text x="220" y="420" text-anchor="middle" font-size="9.5" fill="#6b8a6b">paused — waiting for topic.Explain() to return</text>

  <rect x="440" y="118" width="280" height="140" rx="10" fill="#f9cb9c" fill-opacity="0.15" stroke="#e69138" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="580" y="148" text-anchor="middle" font-size="11" font-weight="bold" fill="#7f4e00">No Heap usage here</text>
  <text x="580" y="176" text-anchor="middle" font-size="10" fill="#a06a1f">Every operand and result is</text>
  <text x="580" y="192" text-anchor="middle" font-size="10" fill="#a06a1f">int/bool — entirely on the Stack.</text>

  <rect x="750" y="118" width="210" height="140" rx="10" fill="#d5c9ea" fill-opacity="0.25" stroke="#674ea7" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="855" y="148" text-anchor="middle" font-size="11" font-weight="bold" fill="#3d2a6b">Nothing here yet</text>
  <text x="855" y="176" text-anchor="middle" font-size="10" fill="#5b4a7a">No static fields/consts</text>
  <text x="855" y="192" text-anchor="middle" font-size="10" fill="#5b4a7a">in this topic yet.</text>

  <text x="40" y="470" font-size="10.5" fill="#444"><tspan font-weight="bold">Operators never allocate:</tspan> +, -, ==, &amp;&amp;, += all read and write values already sitting in these Stack slots — nothing new is created in memory.</text>
  <text x="40" y="490" font-size="10" font-style="italic" fill="#888">Compare with Memory/1-VariablesAndDataTypes.svg — same frame shape, different method active.</text>
</svg>
