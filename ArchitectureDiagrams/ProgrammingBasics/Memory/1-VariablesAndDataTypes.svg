<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#555"/></marker>
  </defs>
  <rect x="0" y="0" width="1100" height="620" fill="#ffffff"/>
  <text x="550" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a237e">Programming Basics — Memory: Stack / Heap / Static</text>
  <text x="550" y="46" text-anchor="middle" font-size="12" fill="#666">Snapshot: ExplainVariablesAndDataTypes() is currently executing. Same rule applies to every method in this topic.</text>

  <!-- Legend (locked colours — same on every topic's Memory diagram) -->
  <g font-size="11" fill="#333">
    <rect x="150" y="60" width="14" height="14" rx="2" fill="#b6d7a8" stroke="#6aa84f"/><text x="170" y="71">Stack</text>
    <rect x="330" y="60" width="14" height="14" rx="2" fill="#f9cb9c" stroke="#e69138"/><text x="350" y="71">Heap</text>
    <rect x="510" y="60" width="14" height="14" rx="2" fill="#d5c9ea" stroke="#674ea7"/><text x="530" y="71">Static</text>
  </g>

  <!-- Column headers -->
  <text x="230" y="98" text-anchor="middle" font-size="12" font-weight="bold" fill="#3f6b3f">STACK — call frames (top = currently executing)</text>
  <text x="620" y="98" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a5a10">HEAP — actual object data</text>
  <text x="930" y="98" text-anchor="middle" font-size="12" font-weight="bold" fill="#3d2a6b">STATIC — type-level data</text>

  <!-- Stack group outline -->
  <rect x="30" y="112" width="400" height="365" rx="10" fill="none" stroke="#999" stroke-width="1" stroke-dasharray="5 4"/>

  <!-- Frame 3 (active) -->
  <rect x="50" y="122" width="360" height="228" rx="8" fill="#b6d7a8" stroke="#6aa84f" stroke-width="2"/>
  <text x="230" y="140" text-anchor="middle" font-size="11" font-weight="bold" fill="#274e13">ProgrammingBasicsDemo.ExplainVariablesAndDataTypes() — ACTIVE</text>

  <g font-size="10.5" fill="#1b3d1b">
    <rect x="62" y="150" width="336" height="24" rx="4" fill="#ffffff" stroke="#8fbf8f"/><text x="70" y="166">age = 28  (int)</text>
    <rect x="62" y="176" width="336" height="24" rx="4" fill="#ffffff" stroke="#8fbf8f"/><text x="70" y="192">price = 499.99  (double)</text>
    <rect x="62" y="202" width="336" height="24" rx="4" fill="#ffffff" stroke="#8fbf8f"/><text x="70" y="218">salary = 55000.50m  (decimal)</text>
    <rect x="62" y="228" width="336" height="24" rx="4" fill="#ffffff" stroke="#8fbf8f"/><text x="70" y="244">isActive = true  (bool)</text>
    <rect x="62" y="254" width="336" height="24" rx="4" fill="#ffffff" stroke="#8fbf8f"/><text x="70" y="270">grade = 'A'  (char)</text>
    <rect x="62" y="280" width="336" height="24" rx="4" fill="#eaf6ea" stroke="#6aa84f"/><text x="70" y="296">name → (pointer to Heap)  (string)</text>
    <rect x="62" y="330" width="336" height="24" rx="4" fill="#eaf6ea" stroke="#6aa84f"/><text x="70" y="346">country → (pointer to Heap)  (string, var-inferred)</text>
  </g>

  <!-- Frame 2 (paused caller) -->
  <rect x="50" y="360" width="360" height="50" rx="8" fill="#dcecdc" stroke="#6aa84f" stroke-width="1.5"/>
  <text x="230" y="380" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#4c6b4c">ProgrammingBasicsExample.Explain()</text>
  <text x="230" y="396" text-anchor="middle" font-size="9.5" fill="#6b8a6b">paused — waiting for the call above to return</text>

  <!-- Frame 1 (paused, Main) -->
  <rect x="50" y="420" width="360" height="50" rx="8" fill="#dcecdc" stroke="#6aa84f" stroke-width="1.5"/>
  <text x="230" y="440" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#4c6b4c">Program.cs (Main)</text>
  <text x="230" y="456" text-anchor="middle" font-size="9.5" fill="#6b8a6b">paused — waiting for topic.Explain() to return</text>

  <!-- Heap group outline -->
  <rect x="470" y="270" width="300" height="150" rx="10" fill="none" stroke="#999" stroke-width="1" stroke-dasharray="5 4"/>

  <rect x="490" y="288" width="260" height="46" rx="6" fill="#f9cb9c" stroke="#e69138" stroke-width="1.5"/>
  <text x="620" y="306" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7f4e00">"Vivek"</text>
  <text x="620" y="322" text-anchor="middle" font-size="9" fill="#7f4e00">the actual string object name points to</text>

  <rect x="490" y="342" width="260" height="46" rx="6" fill="#f9cb9c" stroke="#e69138" stroke-width="1.5"/>
  <text x="620" y="360" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7f4e00">"India"</text>
  <text x="620" y="376" text-anchor="middle" font-size="9" fill="#7f4e00">the actual string object country points to</text>

  <!-- Stack -> Heap pointer arrows -->
  <line x1="398" y1="292" x2="488" y2="308" stroke="#555" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="398" y1="342" x2="488" y2="362" stroke="#555" stroke-width="1.4" marker-end="url(#a)"/>

  <!-- Static (empty for this topic) -->
  <rect x="830" y="122" width="220" height="200" rx="10" fill="#d5c9ea" fill-opacity="0.25" stroke="#674ea7" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="940" y="150" text-anchor="middle" font-size="11" font-weight="bold" fill="#3d2a6b">Nothing here yet</text>
  <text x="940" y="180" text-anchor="middle" font-size="10" fill="#5b4a7a">ProgrammingBasicsDemo has</text>
  <text x="940" y="196" text-anchor="middle" font-size="10" fill="#5b4a7a">no `static` fields or consts.</text>
  <text x="940" y="226" text-anchor="middle" font-size="9.5" font-style="italic" fill="#8a7ab0">First real static example</text>
  <text x="940" y="242" text-anchor="middle" font-size="9.5" font-style="italic" fill="#8a7ab0">arrives in the OOP topic.</text>

  <text x="30" y="500" font-size="10.5" fill="#444"><tspan font-weight="bold">Same rule for the other two methods:</tspan> a, b, score, hasTicket, hasId in ExplainOperators() are all Stack
value types, just like age/isActive above. enteredName/enteredAgeText in ExplainInputOutput() are Stack references
pointing to new Heap string objects, exactly like name/country here — every Console.ReadLine() call allocates a new
string on the Heap.</text>
  <text x="30" y="545" font-size="10.5" font-style="italic" fill="#888">Rule of thumb: value types (int, double, decimal, bool, char, structs) live inline on the Stack. Reference types
(string, arrays, class instances, List&lt;T&gt;) keep only a pointer on the Stack — the real data lives on the Heap.</text>
</svg>
