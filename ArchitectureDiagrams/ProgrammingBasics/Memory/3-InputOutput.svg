  <rect x="0" y="0" width="1000" height="490" fill="#ffffff"/>
  <text x="500" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a237e">Programming Basics — Input &amp; Output — Memory: Stack / Heap / Static</text>
  <text x="500" y="46" text-anchor="middle" font-size="12" fill="#666">Snapshot: ProgrammingBasicsDemo.ExplainInputOutput() is currently executing, after both ReadLine calls.</text>

  <g font-size="11" fill="#333">
