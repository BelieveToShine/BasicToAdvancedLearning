    <rect x="380" y="60" width="14" height="14" rx="2" fill="#f9cb9c" stroke="#e69138"/><text x="400" y="71">Heap</text>
    <rect x="560" y="60" width="14" height="14" rx="2" fill="#d5c9ea" stroke="#674ea7"/><text x="580" y="71">Static</text>
  </g>

  <text x="220" y="96" text-anchor="middle" font-size="12" font-weight="bold" fill="#3f6b3f">STACK — call frames (top = currently executing)</text>
  <text x="580" y="96" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a5a10">HEAP</text>
  <text x="855" y="96" text-anchor="middle" font-size="12" font-weight="bold" fill="#3d2a6b">STATIC</text>

  <rect x="30" y="108" width="380" height="280" rx="10" fill="none" stroke="#999" stroke-width="1" stroke-dasharray="5 4"/>

  <rect x="50" y="118" width="340" height="140" rx="8" fill="#b6d7a8" stroke="#6aa84f" stroke-width="2"/>
  <text x="220" y="136" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#274e13">ProgrammingBasicsDemo.ExplainInputOutput() — ACTIVE</text>
  <rect x="62" y="146" width="316" height="26" rx="4" fill="#eaf6ea" stroke="#6aa84f"/><text x="70" y="163" font-size="10" fill="#1b3d1b">enteredName → pointer  (string)</text>
  <rect x="62" y="176" width="316" height="26" rx="4" fill="#eaf6ea" stroke="#6aa84f"/><text x="70" y="193" font-size="10" fill="#1b3d1b">enteredAgeText → pointer  (string)</text>
  <rect x="62" y="206" width="316" height="26" rx="4" fill="#ffffff" stroke="#8fbf8f"/><text x="70" y="223" font-size="10" fill="#1b3d1b">enteredAge = 29  (int, out param)</text>

  <rect x="50" y="268" width="340" height="50" rx="8" fill="#dcecdc" stroke="#6aa84f" stroke-width="1.5"/>
  <text x="220" y="288" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#4c6b4c">ProgrammingBasicsExample.Explain()</text>
  <text x="220" y="304" text-anchor="middle" font-size="9.5" fill="#6b8a6b">paused — waiting for the call above to return</text>

  <rect x="50" y="328" width="340" height="50" rx="8" fill="#dcecdc" stroke="#6aa84f" stroke-width="1.5"/>
  <text x="220" y="348" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#4c6b4c">Program.cs (Main)</text>
  <text x="220" y="364" text-anchor="middle" font-size="9.5" fill="#6b8a6b">paused — waiting for topic.Explain() to return</text>

  <rect x="440" y="118" width="280" height="180" rx="10" fill="none" stroke="#999" stroke-width="1" stroke-dasharray="5 4"/>
  <rect x="456" y="130" width="248" height="60" rx="6" fill="#f9cb9c" stroke="#e69138" stroke-width="1.5"/>
  <text x="580" y="154" text-anchor="middle" font-size="11" font-weight="bold" fill="#7f4e00">"Vivek"</text>
  <text x="580" y="172" text-anchor="middle" font-size="9" fill="#7f4e00">what you actually typed for name</text>

  <rect x="456" y="210" width="248" height="60" rx="6" fill="#f9cb9c" stroke="#e69138" stroke-width="1.5"/>
  <text x="580" y="234" text-anchor="middle" font-size="11" font-weight="bold" fill="#7f4e00">"28"</text>
  <text x="580" y="252" text-anchor="middle" font-size="9" fill="#7f4e00">the RAW text typed for age — still a string</text>

  <line x1="392" y1="159" x2="454" y2="158" stroke="#555" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="392" y1="189" x2="454" y2="238" stroke="#555" stroke-width="1.4" marker-end="url(#a)"/>

  <rect x="750" y="118" width="210" height="180" rx="10" fill="#d5c9ea" fill-opacity="0.25" stroke="#674ea7" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="855" y="150" text-anchor="middle" font-size="11" font-weight="bold" fill="#3d2a6b">Nothing here yet</text>
  <text x="855" y="178" text-anchor="middle" font-size="10" fill="#5b4a7a">No static fields/consts</text>
  <text x="855" y="194" text-anchor="middle" font-size="10" fill="#5b4a7a">in this topic yet.</text>

  <text x="40" y="420" font-size="10.5" fill="#444"><tspan font-weight="bold">Console.ReadLine() always allocates a NEW string on the Heap</tspan> — enteredAgeText is still the raw text "28" here; int.TryParse reads it and writes the parsed number into enteredAge (a plain Stack int), it doesn't change enteredAgeText itself.</text>
  <text x="40" y="440" font-size="10" font-style="italic" fill="#888">Compare with Memory/1-VariablesAndDataTypes.svg's name/country — same "Stack pointer → Heap string" shape.</text>
