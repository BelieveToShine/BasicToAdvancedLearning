  <rect x="470" y="150" width="560" height="66" rx="6" fill="#fff3e6" stroke="#e69138" stroke-width="1.5"/>
  <text x="480.0" y="167" font-size="9" fill="#7f4e00">SELECT c.FullName, a.AccountNumber, a.AccountType</text>
  <text x="480.0" y="179" font-size="9" fill="#7f4e00">FROM Customers c</text>
  <text x="480.0" y="191" font-size="9" fill="#7f4e00">INNER JOIN Accounts a ON a.CustomerId = c.CustomerId</text>
  <text x="480.0" y="203" font-size="9" fill="#7f4e00">ORDER BY c.CustomerId, a.AccountId</text>
  <rect x="470" y="226" width="560" height="66" rx="6" fill="#fff3e6" stroke="#e69138" stroke-width="1.5"/>
  <text x="480.0" y="243" font-size="9" fill="#7f4e00">SELECT c.FullName, a.AccountNumber, a.AccountType</text>
  <text x="480.0" y="255" font-size="9" fill="#7f4e00">FROM Customers c</text>
  <text x="480.0" y="267" font-size="9" fill="#7f4e00">LEFT JOIN Accounts a ON a.CustomerId = c.CustomerId</text>
  <text x="480.0" y="279" font-size="9" fill="#7f4e00">ORDER BY c.CustomerId, a.AccountId</text>
  <rect x="470" y="302" width="560" height="66" rx="6" fill="#fff3e6" stroke="#e69138" stroke-width="1.5"/>
  <text x="480.0" y="319" font-size="9" fill="#7f4e00">SELECT c.FullName</text>
  <text x="480.0" y="331" font-size="9" fill="#7f4e00">FROM Customers c</text>
  <text x="480.0" y="343" font-size="9" fill="#7f4e00">LEFT JOIN Accounts a ON a.CustomerId = c.CustomerId</text>
  <text x="480.0" y="355" font-size="9" fill="#7f4e00">WHERE a.AccountId IS NULL</text>
