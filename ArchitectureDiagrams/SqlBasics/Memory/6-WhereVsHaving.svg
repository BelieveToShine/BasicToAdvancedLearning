<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 644" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#555"/></marker>
  </defs>
  <rect x="0" y="0" width="1180" height="644" fill="#ffffff"/>
  <text x="590.0" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a237e">WHERE vs HAVING — Memory: Stack / Heap / Static</text>
  <text x="590.0" y="46" text-anchor="middle" font-size="12" fill="#666">Snapshot: ExplainWhereVsHaving() is running, right after SQL Server refused the third query (aliasInWhere).</text>
  <g font-size="11" fill="#333"><rect x="200" y="60" width="14" height="14" rx="2" fill="#b6d7a8" stroke="#6aa84f"/><text x="220" y="71">Stack</text></g>
  <g font-size="11" fill="#333"><rect x="380" y="60" width="14" height="14" rx="2" fill="#f9cb9c" stroke="#e69138"/><text x="400" y="71">Heap</text></g>
  <g font-size="11" fill="#333"><rect x="560" y="60" width="14" height="14" rx="2" fill="#d5c9ea" stroke="#674ea7"/><text x="580" y="71">Static</text></g>
  <text x="220" y="96" text-anchor="middle" font-size="12" font-weight="bold" fill="#3f6b3f">STACK — call frames (top = currently executing)</text>
  <text x="750" y="96" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a5a10">HEAP</text>
  <text x="1125" y="96" text-anchor="middle" font-size="12" font-weight="bold" fill="#3d2a6b">STATIC</text>
  <rect x="30" y="108" width="380" height="278" rx="10" fill="none" stroke="#999" stroke-width="1" stroke-dasharray="5 4"/>
  <rect x="50" y="118" width="340" height="124" rx="8" fill="#b6d7a8" stroke="#6aa84f" stroke-width="2"/>
  <text x="220" y="136" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#274e13">SqlBasicsDemo.ExplainWhereVsHaving() — ACTIVE</text>
  <rect x="62" y="146" width="316" height="26" rx="4" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1"/>
  <text x="70" y="163" font-size="10" fill="#1b3d1b">filteredGroups → pointer  (string)</text>
  <rect x="62" y="176" width="316" height="26" rx="4" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1"/>
  <text x="70" y="193" font-size="10" fill="#1b3d1b">aggregateInWhere → pointer  (string)</text>
  <rect x="62" y="206" width="316" height="26" rx="4" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1"/>
  <text x="70" y="223" font-size="10" fill="#1b3d1b">aliasInWhere → pointer  (string)</text>
  <rect x="50" y="252" width="340" height="64" rx="8" fill="#dcecdc" stroke="#6aa84f" stroke-width="1.5"/>
  <text x="220" y="272" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#4c6b4c">SqlBasicsExample.Explain()</text>
  <text x="220" y="288" text-anchor="middle" font-size="9.5" fill="#6b8a6b">paused — waiting for the call above to return</text>
  <text x="220" y="306" text-anchor="middle" font-size="9.5" fill="#4c6b4c">local: sqlBasics → pointer (SqlBasicsDemo object, no fields)</text>
  <rect x="50" y="326" width="340" height="50" rx="8" fill="#dcecdc" stroke="#6aa84f" stroke-width="1.5"/>
  <text x="220" y="346" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#4c6b4c">Program.cs (Main)</text>
  <text x="220" y="362" text-anchor="middle" font-size="9.5" fill="#6b8a6b">paused — waiting for topic.Explain() to return</text>
  <rect x="470" y="150" width="560" height="90" rx="6" fill="#fff3e6" stroke="#e69138" stroke-width="1.5"/>
  <text x="480.0" y="167" font-size="9" fill="#7f4e00">SELECT AccountType, COUNT(*) AS Accounts, SUM(Balance) AS Total</text>
  <text x="480.0" y="179" font-size="9" fill="#7f4e00">FROM Accounts</text>
  <text x="480.0" y="191" font-size="9" fill="#7f4e00">WHERE Balance &gt; 0</text>
  <text x="480.0" y="203" font-size="9" fill="#7f4e00">GROUP BY AccountType</text>
  <text x="480.0" y="215" font-size="9" fill="#7f4e00">HAVING SUM(Balance) &gt; 2000</text>
  <text x="480.0" y="227" font-size="9" fill="#7f4e00">ORDER BY Total DESC</text>
  <rect x="470" y="250" width="560" height="66" rx="6" fill="#fff3e6" stroke="#e69138" stroke-width="1.5"/>
  <text x="480.0" y="267" font-size="9" fill="#7f4e00">SELECT AccountType</text>
  <text x="480.0" y="279" font-size="9" fill="#7f4e00">FROM Accounts</text>
  <text x="480.0" y="291" font-size="9" fill="#7f4e00">WHERE SUM(Balance) &gt; 2000</text>
  <text x="480.0" y="303" font-size="9" fill="#7f4e00">GROUP BY AccountType</text>
  <rect x="470" y="326" width="560" height="66" rx="6" fill="#fff3e6" stroke="#e69138" stroke-width="1.5"/>
  <text x="480.0" y="343" font-size="9" fill="#7f4e00">SELECT AccountType, SUM(Balance) AS Total</text>
  <text x="480.0" y="355" font-size="9" fill="#7f4e00">FROM Accounts</text>
  <text x="480.0" y="367" font-size="9" fill="#7f4e00">WHERE Total &gt; 2000</text>
  <text x="480.0" y="379" font-size="9" fill="#7f4e00">GROUP BY AccountType</text>
  <line x1="750.0" y1="392" x2="750.0" y2="426" stroke="#555" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="758.0" y="414" font-size="9" font-style="italic" fill="#555">this text went to SQL Server; it was refused (error 207), so no rows came back</text>
  <rect x="470" y="428" width="610" height="140" rx="10" fill="#f1f1f1" stroke="#777777" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="775.0" y="448" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#444444">OUTSIDE .NET — SQL Server: what the three queries produced</text>
  <text x="484" y="468" font-size="9" font-style="italic" fill="#555">filteredGroups returned</text>
  <rect x="484" y="474" width="73" height="16" rx="0" fill="#dfe7f0" stroke="#8aa0b8" stroke-width="1"/>
  <text x="490" y="485.5" font-size="9" font-weight="bold" fill="#1a3550">AccountType</text>
  <rect x="557" y="474" width="57" height="16" rx="0" fill="#dfe7f0" stroke="#8aa0b8" stroke-width="1"/>
  <text x="563" y="485.5" font-size="9" font-weight="bold" fill="#1a3550">Accounts</text>
  <rect x="614" y="474" width="49" height="16" rx="0" fill="#dfe7f0" stroke="#8aa0b8" stroke-width="1"/>
  <text x="620" y="485.5" font-size="9" font-weight="bold" fill="#1a3550">Total</text>
  <rect x="484" y="490" width="73" height="16" rx="0" fill="#ffffff" stroke="#b0b0b0" stroke-width="1"/>
  <text x="490" y="501.5" font-size="9" fill="#222">Savings</text>
  <rect x="557" y="490" width="57" height="16" rx="0" fill="#ffffff" stroke="#b0b0b0" stroke-width="1"/>
  <text x="563" y="501.5" font-size="9" fill="#222">2</text>
  <rect x="614" y="490" width="49" height="16" rx="0" fill="#ffffff" stroke="#b0b0b0" stroke-width="1"/>
  <text x="620" y="501.5" font-size="9" fill="#222">4700.00</text>
  <text x="687" y="468" font-size="9" font-style="italic" fill="#555">aggregateInWhere</text>
  <rect x="687" y="474" width="95" height="16" rx="0" fill="#dfe7f0" stroke="#8aa0b8" stroke-width="1"/>
  <text x="693" y="485.5" font-size="9" font-weight="bold" fill="#1a3550">error 147</text>
  <rect x="687" y="490" width="95" height="16" rx="0" fill="#ffffff" stroke="#b0b0b0" stroke-width="1"/>
  <text x="693" y="501.5" font-size="9" font-style="italic" fill="#777">no result set</text>
  <text x="806" y="468" font-size="9" font-style="italic" fill="#555">aliasInWhere</text>
  <rect x="806" y="474" width="95" height="16" rx="0" fill="#dfe7f0" stroke="#8aa0b8" stroke-width="1"/>
  <text x="812" y="485.5" font-size="9" font-weight="bold" fill="#1a3550">error 207</text>
  <rect x="806" y="490" width="95" height="16" rx="0" fill="#ffffff" stroke="#b0b0b0" stroke-width="1"/>
  <text x="812" y="501.5" font-size="9" font-style="italic" fill="#777">no result set</text>
  <text x="484" y="526" font-size="9.5" fill="#333">A refused query returns no rows: SQL Server reports an error number instead, and SqlLab.ShowError printed it.</text>
  <text x="484" y="542" font-size="9.5" fill="#333">Nothing was changed in any table.</text>
  <polyline points="378,159 458,159 458,167 468,167" fill="none" stroke="#555" stroke-width="1.4" marker-end="url(#a)"/>
  <polyline points="378,189 450,189 450,267 468,267" fill="none" stroke="#555" stroke-width="1.4" marker-end="url(#a)"/>
  <polyline points="378,219 442,219 442,343 468,343" fill="none" stroke="#555" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="1080" y="118" width="90" height="130" rx="10" fill="#d5c9ea" stroke="#674ea7" stroke-width="1.5" stroke-dasharray="6 4" fill-opacity="0.25"/>
  <text x="1125" y="150" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#3d2a6b">Nothing</text>
  <text x="1125" y="166" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#3d2a6b">here yet</text>
  <text x="40" y="592" font-size="10.5" fill="#444"><tspan font-weight="bold">Two of the three strings hold SQL that SQL Server refuses to run. </tspan>The text is still an ordinary string on the Heap — a bad query is only bad when it reaches the server.</text>
  <text x="40" y="610" font-size="10" font-style="italic" fill="#888">Error 147: an aggregate (SUM) is not allowed directly in WHERE (use HAVING). Error 207: invalid column name — the alias Total does not exist yet at the WHERE step.</text>
</svg>
