  <rect x="470" y="150" width="560" height="54" rx="6" fill="#fff3e6" stroke="#e69138" stroke-width="1.5"/>
  <text x="480.0" y="167" font-size="9" fill="#7f4e00">SELECT COUNT(*) AS Accounts, SUM(Balance) AS TotalBalance, AVG(Balance) AS AverageBalance,</text>
  <text x="512.2" y="179" font-size="9" fill="#7f4e00">MIN(Balance) AS Lowest, MAX(Balance) AS Highest</text>
  <text x="480.0" y="191" font-size="9" fill="#7f4e00">FROM Accounts</text>
  <rect x="470" y="214" width="560" height="66" rx="6" fill="#fff3e6" stroke="#e69138" stroke-width="1.5"/>
  <text x="480.0" y="231" font-size="9" fill="#7f4e00">SELECT AccountType, COUNT(*) AS Accounts, SUM(Balance) AS Total</text>
  <text x="480.0" y="243" font-size="9" fill="#7f4e00">FROM Accounts</text>
  <text x="480.0" y="255" font-size="9" fill="#7f4e00">GROUP BY AccountType</text>
  <text x="480.0" y="267" font-size="9" fill="#7f4e00">ORDER BY AccountType</text>
  <rect x="470" y="290" width="560" height="78" rx="6" fill="#fff3e6" stroke="#e69138" stroke-width="1.5"/>
  <text x="480.0" y="307" font-size="9" fill="#7f4e00">SELECT c.FullName, COUNT(*) AS JoinedRows, COUNT(a.AccountId) AS Accounts, SUM(a.Balance) AS Total</text>
  <text x="480.0" y="319" font-size="9" fill="#7f4e00">FROM Customers c</text>
  <text x="480.0" y="331" font-size="9" fill="#7f4e00">LEFT JOIN Accounts a ON a.CustomerId = c.CustomerId</text>
  <text x="480.0" y="343" font-size="9" fill="#7f4e00">GROUP BY c.CustomerId, c.FullName</text>
  <text x="480.0" y="355" font-size="9" fill="#7f4e00">ORDER BY c.CustomerId</text>
  <line x1="750.0" y1="368" x2="750.0" y2="402" stroke="#555" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="758.0" y="390" font-size="9" font-style="italic" fill="#555">this text went to SQL Server; rows came back and were printed</text>
