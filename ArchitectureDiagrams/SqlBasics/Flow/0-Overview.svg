  <text x="40" y="975" font-size="10.5" fill="#444"><tspan font-weight="bold">Where to where, in one line:</tspan> Explain() checks the server, rebuilds the bank tables, then calls the six lesson methods in order; each one sends SQL text and prints the rows that come back.</text>
  <text x="40" y="993" font-size="10" font-style="italic" fill="#888">SqlLab and BankSeed are .NET helper classes; they get no lifeline of their own because the work they trigger happens in SQL Server.</text>
  <text x="40" y="1009" font-size="10" font-style="italic" fill="#888">RunQuery and RunRejectedQuery are Demo's private helpers (the last method uses both).</text>
