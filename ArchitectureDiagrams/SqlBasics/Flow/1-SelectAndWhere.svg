<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 746" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#333"/></marker>
  </defs>
  <rect x="0" y="0" width="900" height="746" fill="#ffffff"/>
  <text x="450.0" y="20" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a237e">SELECT and WHERE — Sub-level Flow: a sieve over the Accounts table</text>
  <text x="450.0" y="38" text-anchor="middle" font-size="11" fill="#666">SELECT picks which columns you see; WHERE is a sieve that keeps only the rows whose test comes out TRUE.</text>
  <text x="210" y="50" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#274e13">START</text>
  <line x1="210" y1="54" x2="210" y2="92" stroke="#333" stroke-width="2"/>
  <polygon points="210,54 210,72 240,63" fill="#38761d"/>
  <line x1="210" y1="92" x2="210" y2="134" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="520" y="84" width="330" height="474" rx="10" fill="#f1f1f1" stroke="#777777" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="685" y="104" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#444">SQL Server — OUTSIDE .NET</text>
  <text x="685" y="120" text-anchor="middle" font-size="9" font-style="italic" fill="#666">table Accounts: 6 rows</text>
  <rect x="60" y="134" width="300" height="58" rx="8" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1.5"/>
  <text x="210" y="151" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#274e13">string allColumns = """…""";</text>
  <text x="210" y="167" text-anchor="middle" font-size="9" fill="#333">SELECT *  (every column)</text>
  <text x="210" y="183" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#1a4a73">RunQuery(allColumns);</text>
  <rect x="540" y="134" width="290" height="58" rx="8" fill="#ffffff" stroke="#999999" stroke-width="1.2"/>
  <polygon points="550,151 574,151 566,167 558,167" fill="#e8f4fb" stroke="#3d85c6" stroke-width="1.5"/>
  <rect x="560" y="167" width="4" height="8" fill="#3d85c6"/>
  <circle cx="558" cy="157" r="1.5" fill="#3d85c6"/>
  <circle cx="564" cy="157" r="1.5" fill="#3d85c6"/>
  <circle cx="570" cy="157" r="1.5" fill="#3d85c6"/>
  <text x="690" y="158" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#333">shows ALL 5 columns</text>
  <text x="690" y="175" text-anchor="middle" font-size="9" fill="#555">no sieve: every row stays</text>
  <line x1="360" y1="156" x2="538" y2="156" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="449" y="148" text-anchor="middle" font-size="9" fill="#555">sends the SQL text</text>
  <line x1="540" y1="176" x2="362" y2="176" stroke="#333" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="449" y="188" text-anchor="middle" font-size="9" fill="#555">6 rows back</text>
  <line x1="210" y1="192" x2="210" y2="222" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="60" y="222" width="300" height="58" rx="8" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1.5"/>
  <text x="210" y="239" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#274e13">string twoColumns = """…""";</text>
  <text x="210" y="255" text-anchor="middle" font-size="9" fill="#333">SELECT AccountNumber, Balance</text>
  <text x="210" y="271" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#1a4a73">RunQuery(twoColumns);</text>
  <rect x="540" y="222" width="290" height="58" rx="8" fill="#ffffff" stroke="#999999" stroke-width="1.2"/>
  <polygon points="550,239 574,239 566,255 558,255" fill="#e8f4fb" stroke="#3d85c6" stroke-width="1.5"/>
  <rect x="560" y="255" width="4" height="8" fill="#3d85c6"/>
  <circle cx="558" cy="245" r="1.5" fill="#3d85c6"/>
  <circle cx="564" cy="245" r="1.5" fill="#3d85c6"/>
  <circle cx="570" cy="245" r="1.5" fill="#3d85c6"/>
  <text x="690" y="246" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#333">shows only 2 columns</text>
  <text x="690" y="263" text-anchor="middle" font-size="9" fill="#555">no sieve: every row stays</text>
  <line x1="360" y1="244" x2="538" y2="244" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="449" y="236" text-anchor="middle" font-size="9" fill="#555">sends the SQL text</text>
  <line x1="540" y1="264" x2="362" y2="264" stroke="#333" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="449" y="276" text-anchor="middle" font-size="9" fill="#555">6 rows back</text>
  <line x1="210" y1="280" x2="210" y2="310" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="60" y="310" width="300" height="58" rx="8" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1.5"/>
  <text x="210" y="327" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#274e13">string savings = """…""";</text>
  <text x="210" y="343" text-anchor="middle" font-size="9" fill="#333">WHERE AccountType = 'Savings'</text>
  <text x="210" y="359" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#1a4a73">RunQuery(savings);</text>
  <rect x="540" y="310" width="290" height="58" rx="8" fill="#ffffff" stroke="#999999" stroke-width="1.2"/>
  <polygon points="550,327 574,327 566,343 558,343" fill="#e8f4fb" stroke="#3d85c6" stroke-width="1.5"/>
  <rect x="560" y="343" width="4" height="8" fill="#3d85c6"/>
  <circle cx="558" cy="333" r="1.5" fill="#3d85c6"/>
  <circle cx="564" cy="333" r="1.5" fill="#3d85c6"/>
  <circle cx="570" cy="333" r="1.5" fill="#3d85c6"/>
  <text x="690" y="334" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#333">sieve keeps AccountType = 'Savings'</text>
  <text x="690" y="351" text-anchor="middle" font-size="9" fill="#555">ACC-1001, ACC-2001, ACC-3002</text>
  <line x1="360" y1="332" x2="538" y2="332" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="449" y="324" text-anchor="middle" font-size="9" fill="#555">sends the SQL text</text>
  <line x1="540" y1="352" x2="362" y2="352" stroke="#333" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="449" y="364" text-anchor="middle" font-size="9" fill="#555">3 rows back</text>
  <line x1="210" y1="368" x2="210" y2="398" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="60" y="398" width="300" height="58" rx="8" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1.5"/>
  <text x="210" y="415" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#274e13">string bigCurrent = """…""";</text>
  <text x="210" y="431" text-anchor="middle" font-size="9" fill="#333">WHERE AccountType &lt;&gt; 'Savings' AND Balance &gt; 100</text>
  <text x="210" y="447" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#1a4a73">RunQuery(bigCurrent);</text>
  <rect x="540" y="398" width="290" height="58" rx="8" fill="#ffffff" stroke="#999999" stroke-width="1.2"/>
  <polygon points="550,415 574,415 566,431 558,431" fill="#e8f4fb" stroke="#3d85c6" stroke-width="1.5"/>
  <rect x="560" y="431" width="4" height="8" fill="#3d85c6"/>
  <circle cx="558" cy="421" r="1.5" fill="#3d85c6"/>
  <circle cx="564" cy="421" r="1.5" fill="#3d85c6"/>
  <circle cx="570" cy="421" r="1.5" fill="#3d85c6"/>
  <text x="690" y="422" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#333">AND: both tests must be TRUE</text>
  <text x="690" y="439" text-anchor="middle" font-size="9" fill="#555">ACC-1002, ACC-3001</text>
  <line x1="360" y1="420" x2="538" y2="420" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="449" y="412" text-anchor="middle" font-size="9" fill="#555">sends the SQL text</text>
  <line x1="540" y1="440" x2="362" y2="440" stroke="#333" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="449" y="452" text-anchor="middle" font-size="9" fill="#555">2 rows back</text>
  <line x1="210" y1="456" x2="210" y2="486" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="60" y="486" width="300" height="58" rx="8" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1.5"/>
  <text x="210" y="503" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#274e13">string emptyOrHuge = """…""";</text>
  <text x="210" y="519" text-anchor="middle" font-size="9" fill="#333">WHERE Balance = 0 OR Balance &gt; 3000</text>
  <text x="210" y="535" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#1a4a73">RunQuery(emptyOrHuge);</text>
  <rect x="540" y="486" width="290" height="58" rx="8" fill="#ffffff" stroke="#999999" stroke-width="1.2"/>
  <polygon points="550,503 574,503 566,519 558,519" fill="#e8f4fb" stroke="#3d85c6" stroke-width="1.5"/>
  <rect x="560" y="519" width="4" height="8" fill="#3d85c6"/>
  <circle cx="558" cy="509" r="1.5" fill="#3d85c6"/>
  <circle cx="564" cy="509" r="1.5" fill="#3d85c6"/>
  <circle cx="570" cy="509" r="1.5" fill="#3d85c6"/>
  <text x="690" y="510" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#333">OR: one TRUE test is enough</text>
  <text x="690" y="527" text-anchor="middle" font-size="9" fill="#555">ACC-2001, ACC-2002, ACC-3002</text>
  <line x1="360" y1="508" x2="538" y2="508" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="449" y="500" text-anchor="middle" font-size="9" fill="#555">sends the SQL text</text>
  <line x1="540" y1="528" x2="362" y2="528" stroke="#333" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="449" y="540" text-anchor="middle" font-size="9" fill="#555">3 rows back</text>
  <line x1="210" y1="544" x2="210" y2="574" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="210" y="588" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#990000">END</text>
  <line x1="210" y1="596" x2="210" y2="636" stroke="#333" stroke-width="2"/>
  <polygon points="210,596 210,614 240,605" fill="#cc0000"/>
  <text x="30" y="670" font-size="10.5" fill="#444"><tspan font-weight="bold">Columns first, rows second:</tspan> SELECT chooses what each row shows, WHERE chooses which rows get through the sieve.</text>
  <text x="30" y="688" font-size="10" font-style="italic" fill="#888">RunQuery prints "SQL:", the query lines and "Result:" with Console.WriteLine; SqlLab.Show then prints the grid and the row count.</text>
  <text x="30" y="706" font-size="10" font-style="italic" fill="#888">Five queries, so five SQL: / Result: blocks in the output. The ORDER BY AccountId in each only makes the printed order fixed.</text>
  <text x="30" y="724" font-size="10" font-style="italic" fill="#888">Each method also opens with PrintHeading(): four more Console.WriteLine calls for the title banner (not drawn).</text>
</svg>
