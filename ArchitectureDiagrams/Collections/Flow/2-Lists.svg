<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#333"/></marker>
  </defs>
  <rect x="0" y="0" width="900" height="580" fill="#ffffff"/>
  <text x="450" y="20" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a237e">List&lt;T&gt; — Sub-level Flow: a filmstrip of a growing/shrinking list</text>
  <text x="450" y="38" text-anchor="middle" font-size="11" fill="#666">Each frame is the SAME list, a moment later — watch its shape change after every call.</text>

  <text x="450" y="52" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#274e13">START</text>
  <line x1="450" y1="56" x2="450" y2="96" stroke="#333" stroke-width="2"/>
  <polygon points="450,56 450,74 480,65" fill="#38761d"/>

  <line x1="450" y1="96" x2="450" y2="116" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- Frame 0: empty -->
  <rect x="380" y="118" width="140" height="50" rx="8" fill="#f4f4f4" stroke="#bbb" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="450" y="148" text-anchor="middle" font-size="10" font-style="italic" fill="#888">new List&lt;string&gt;() — empty</text>

  <line x1="450" y1="168" x2="450" y2="196" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="470" y="186" font-size="10" font-weight="bold" fill="#333">Add(...) three times</text>

  <!-- Frame 1: 3 items -->
  <rect x="170" y="198" width="180" height="50" rx="8" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1.5"/>
  <text x="260" y="228" text-anchor="middle" font-size="10" fill="#274e13">Buy groceries</text>
  <rect x="360" y="198" width="180" height="50" rx="8" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1.5"/>
  <text x="450" y="228" text-anchor="middle" font-size="10" fill="#274e13">Finish homework</text>
  <rect x="550" y="198" width="180" height="50" rx="8" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1.5"/>
  <text x="640" y="228" text-anchor="middle" font-size="10" fill="#274e13">Call mom</text>

  <line x1="450" y1="248" x2="450" y2="276" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="470" y="266" font-size="10" font-weight="bold" fill="#333">Insert(1, "Walk the dog")</text>

  <!-- Frame 2: 4 items, one inserted, one marked for removal -->
  <rect x="175" y="278" width="130" height="50" rx="8" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1.5"/>
  <text x="240" y="308" text-anchor="middle" font-size="9.5" fill="#274e13">Buy groceries</text>
  <rect x="315" y="278" width="130" height="50" rx="8" fill="#d9ead3" stroke="#38761d" stroke-width="2.5"/>
  <text x="380" y="308" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#274e13">Walk the dog</text>
  <rect x="455" y="278" width="130" height="50" rx="8" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1.5"/>
  <text x="520" y="308" text-anchor="middle" font-size="9.5" fill="#274e13">Finish homework</text>
  <circle cx="580" cy="284" r="12" fill="#ffffff" stroke="#cc0000" stroke-width="2"/>
  <text x="580" y="288" text-anchor="middle" font-size="11" font-weight="bold" fill="#cc0000">✕</text>
  <rect x="595" y="278" width="130" height="50" rx="8" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1.5"/>
  <text x="660" y="308" text-anchor="middle" font-size="9.5" fill="#274e13">Call mom</text>

  <line x1="450" y1="328" x2="450" y2="356" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="470" y="346" font-size="10" font-weight="bold" fill="#333">Remove("Finish homework")</text>

  <!-- Frame 3: 3 items, final -->
  <rect x="215" y="358" width="150" height="50" rx="8" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1.5"/>
  <text x="290" y="388" text-anchor="middle" font-size="10" fill="#274e13">Buy groceries</text>
  <rect x="375" y="358" width="150" height="50" rx="8" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1.5"/>
  <text x="450" y="388" text-anchor="middle" font-size="10" fill="#274e13">Walk the dog</text>
  <rect x="535" y="358" width="150" height="50" rx="8" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1.5"/>
  <text x="610" y="388" text-anchor="middle" font-size="10" fill="#274e13">Call mom</text>

  <line x1="450" y1="408" x2="450" y2="436" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>

  <text x="450" y="452" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#990000">END</text>
  <line x1="450" y1="456" x2="450" y2="496" stroke="#333" stroke-width="2"/>
  <polygon points="450,456 450,474 480,465" fill="#cc0000"/>

  <text x="30" y="540" font-size="10.5" fill="#444"><tspan font-weight="bold">4 frames, one List.</tspan> Unlike the array's fixed 5 lockers, this shelf itself changed size three times — that's the entire point of List&lt;T&gt;.</text>
</svg>
