<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 650" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#333"/></marker>
  </defs>
  <rect x="0" y="0" width="800" height="650" fill="#ffffff"/>
  <text x="400" y="20" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a237e">Collection Safety — Sub-level Flow: two security checkpoints</text>
  <text x="400" y="38" text-anchor="middle" font-size="11" fill="#666">Check before you access — array gate first, then dictionary gate. Grey notes show the outcome that didn't happen here.</text>

  <text x="300" y="52" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#274e13">START</text>
  <line x1="300" y1="56" x2="300" y2="92" stroke="#333" stroke-width="2"/>
  <polygon points="300,56 300,74 330,65" fill="#38761d"/>

  <line x1="300" y1="92" x2="300" y2="128" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- Gate 1: Array bounds check -->
  <polygon points="300,130 400,166 300,202 200,166" fill="#e8f4fb" stroke="#3d85c6" stroke-width="1.5"/>
  <text x="300" y="162" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#1a4a73">0 &lt;= 10 &lt;</text>
  <text x="300" y="174" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#1a4a73">Length (5)?</text>

  <line x1="400" y1="166" x2="413" y2="167" stroke="#999" stroke-width="1.2"/>
  <rect x="415" y="146" width="170" height="42" rx="6" fill="#f2f2f2" stroke="#bbb" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="500" y="163" text-anchor="middle" font-size="8.5" fill="#777">if TRUE (didn't happen):</text>
  <text x="500" y="178" text-anchor="middle" font-size="8.5" fill="#777">would print the score</text>

  <line x1="300" y1="202" x2="300" y2="228" stroke="#cc0000" stroke-width="2" marker-end="url(#a)"/>
  <text x="316" y="218" font-size="9" font-weight="bold" fill="#990000">false (actual)</text>

  <rect x="200" y="230" width="200" height="55" rx="8" fill="#f4cccc" stroke="#cc0000" stroke-width="1.5"/>
  <text x="300" y="252" text-anchor="middle" font-size="10" font-weight="bold" fill="#990000">ACCESS DENIED</text>
  <text x="300" y="270" text-anchor="middle" font-size="8.5" fill="#7a2213">"Index 10 out of range..."</text>

  <line x1="300" y1="285" x2="300" y2="320" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="316" y="308" font-size="9" fill="#333">then the second gate</text>

  <!-- Gate 2: Dictionary TryGetValue -->
  <polygon points="300,322 400,358 300,394 200,358" fill="#e8f4fb" stroke="#3d85c6" stroke-width="1.5"/>
  <text x="300" y="354" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#1a4a73">TryGetValue</text>
  <text x="300" y="366" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#1a4a73">("Rahul")?</text>

  <line x1="400" y1="358" x2="413" y2="359" stroke="#999" stroke-width="1.2"/>
  <rect x="415" y="338" width="170" height="42" rx="6" fill="#f2f2f2" stroke="#bbb" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="500" y="355" text-anchor="middle" font-size="8.5" fill="#777">if TRUE (didn't happen):</text>
  <text x="500" y="370" text-anchor="middle" font-size="8.5" fill="#777">would print rahulNumber</text>

  <line x1="300" y1="394" x2="300" y2="420" stroke="#cc0000" stroke-width="2" marker-end="url(#a)"/>
  <text x="316" y="410" font-size="9" font-weight="bold" fill="#990000">false (actual)</text>

  <rect x="200" y="422" width="200" height="55" rx="8" fill="#f4cccc" stroke="#cc0000" stroke-width="1.5"/>
  <text x="300" y="444" text-anchor="middle" font-size="10" font-weight="bold" fill="#990000">ACCESS DENIED</text>
  <text x="300" y="462" text-anchor="middle" font-size="8.5" fill="#7a2213">"Rahul isn't in the phone book."</text>

  <line x1="300" y1="477" x2="300" y2="505" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>

  <text x="300" y="525" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#990000">END</text>
  <line x1="300" y1="533" x2="300" y2="573" stroke="#333" stroke-width="2"/>
  <polygon points="300,533 300,551 330,542" fill="#cc0000"/>

  <text x="30" y="595" font-size="10.5" fill="#444"><tspan x="30" dy="0"><tspan font-weight="bold">Neither gate crashed the program.</tspan> Both checks failed gracefully — index 10 is past the last valid index (4), and "Rahul" was never added</tspan><tspan x="30" dy="15.8">— because each check ran BEFORE the access, not after.</tspan></text>
</svg>
