<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 480" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#333"/></marker>
  </defs>
  <rect x="0" y="0" width="1150" height="480" fill="#ffffff"/>
  <text x="575" y="20" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a237e">Collection Safety — Sub-level Flow: two security checkpoints</text>
  <text x="575" y="38" text-anchor="middle" font-size="11" fill="#666">Check before you access — the grey note beside each gate shows the other outcome, the one that didn't happen here.</text>

  <text x="550" y="52" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#274e13">START</text>
  <line x1="550" y1="56" x2="550" y2="92" stroke="#333" stroke-width="2"/>
  <polygon points="550,56 550,74 580,65" fill="#38761d"/>

  <line x1="550" y1="92" x2="550" y2="110" stroke="#333" stroke-width="1.6"/>
  <line x1="250" y1="110" x2="850" y2="110" stroke="#333" stroke-width="1.6"/>
  <line x1="250" y1="110" x2="250" y2="128" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="850" y1="110" x2="850" y2="128" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- Gate 1: Array bounds check -->
  <polygon points="250,130 350,166 250,202 150,166" fill="#e8f4fb" stroke="#3d85c6" stroke-width="1.5"/>
  <text x="250" y="162" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#1a4a73">0 &lt;= 10 &lt;</text>
  <text x="250" y="174" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#1a4a73">Length (5)?</text>

  <line x1="350" y1="166" x2="363" y2="167" stroke="#999" stroke-width="1.2"/>
  <rect x="365" y="146" width="170" height="42" rx="6" fill="#f2f2f2" stroke="#bbb" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="450" y="163" text-anchor="middle" font-size="8.5" fill="#777">if TRUE (didn't happen):</text>
  <text x="450" y="178" text-anchor="middle" font-size="8.5" fill="#777">would print the score</text>

  <line x1="250" y1="202" x2="250" y2="228" stroke="#cc0000" stroke-width="2" marker-end="url(#a)"/>
  <text x="266" y="218" font-size="9" font-weight="bold" fill="#990000">false (actual)</text>

  <rect x="150" y="230" width="200" height="55" rx="8" fill="#f4cccc" stroke="#cc0000" stroke-width="1.5"/>
  <text x="250" y="252" text-anchor="middle" font-size="10" font-weight="bold" fill="#990000">ACCESS DENIED</text>
  <text x="250" y="270" text-anchor="middle" font-size="8.5" fill="#7a2213">"Index 10 out of range..."</text>

  <!-- Gate 2: Dictionary TryGetValue -->
  <polygon points="850,130 950,166 850,202 750,166" fill="#e8f4fb" stroke="#3d85c6" stroke-width="1.5"/>
  <text x="850" y="162" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#1a4a73">TryGetValue</text>
  <text x="850" y="174" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#1a4a73">("Rahul")?</text>

  <line x1="950" y1="166" x2="963" y2="167" stroke="#999" stroke-width="1.2"/>
  <rect x="965" y="146" width="170" height="42" rx="6" fill="#f2f2f2" stroke="#bbb" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="1050" y="163" text-anchor="middle" font-size="8.5" fill="#777">if TRUE (didn't happen):</text>
  <text x="1050" y="178" text-anchor="middle" font-size="8.5" fill="#777">would print rahulNumber</text>

  <line x1="850" y1="202" x2="850" y2="228" stroke="#cc0000" stroke-width="2" marker-end="url(#a)"/>
  <text x="866" y="218" font-size="9" font-weight="bold" fill="#990000">false (actual)</text>

  <rect x="750" y="230" width="200" height="55" rx="8" fill="#f4cccc" stroke="#cc0000" stroke-width="1.5"/>
  <text x="850" y="252" text-anchor="middle" font-size="10" font-weight="bold" fill="#990000">ACCESS DENIED</text>
  <text x="850" y="270" text-anchor="middle" font-size="8.5" fill="#7a2213">"Rahul isn't in the phone book."</text>

  <!-- Merges to End -->
  <path d="M250,285 L250,320 L530,320 L530,356" fill="none" stroke="#555" stroke-width="1.3" marker-end="url(#a)"/>
  <path d="M850,285 L850,335 L570,335 L570,356" fill="none" stroke="#555" stroke-width="1.3" marker-end="url(#a)"/>

  <text x="550" y="376" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#990000">END</text>
  <line x1="550" y1="384" x2="550" y2="424" stroke="#333" stroke-width="2"/>
  <polygon points="550,384 550,402 580,393" fill="#cc0000"/>

  <text x="30" y="440" font-size="10.5" fill="#444"><tspan font-weight="bold">Neither gate crashed the program.</tspan> Both checks failed gracefully — an index 5 slots too far, and a name never pinned to the board — because the check ran BEFORE the access, not after.</text>
</svg>
