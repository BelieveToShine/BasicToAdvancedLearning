<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#555"/></marker>
  </defs>
  <rect x="0" y="0" width="1100" height="500" fill="#ffffff"/>
  <text x="550" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a237e">Dictionary&lt;TKey, TValue&gt; — Memory: Stack / Heap / Static</text>
  <text x="550" y="46" text-anchor="middle" font-size="12" fill="#666">Snapshot: ExplainDictionaries() is currently executing, after 2 entries were pinned.</text>

  <g font-size="11" fill="#333">
    <rect x="200" y="60" width="14" height="14" rx="2" fill="#b6d7a8" stroke="#6aa84f"/><text x="220" y="71">Stack</text>
    <rect x="380" y="60" width="14" height="14" rx="2" fill="#f9cb9c" stroke="#e69138"/><text x="400" y="71">Heap</text>
    <rect x="560" y="60" width="14" height="14" rx="2" fill="#d5c9ea" stroke="#674ea7"/><text x="580" y="71">Static</text>
  </g>

  <text x="220" y="96" text-anchor="middle" font-size="12" font-weight="bold" fill="#3f6b3f">STACK</text>
  <text x="660" y="96" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a5a10">HEAP — each entry is TWO references, key and value</text>
  <text x="1000" y="96" text-anchor="middle" font-size="12" font-weight="bold" fill="#3d2a6b">STATIC</text>

  <rect x="30" y="108" width="380" height="280" rx="10" fill="none" stroke="#999" stroke-width="1" stroke-dasharray="5 4"/>

  <rect x="50" y="118" width="340" height="70" rx="8" fill="#b6d7a8" stroke="#6aa84f" stroke-width="2"/>
  <text x="220" y="136" text-anchor="middle" font-size="10" font-weight="bold" fill="#274e13">CollectionsDemo.ExplainDictionaries() — ACTIVE</text>
  <rect x="62" y="146" width="316" height="26" rx="4" fill="#eaf6ea" stroke="#6aa84f"/><text x="70" y="163" font-size="10" fill="#1b3d1b">phoneBook → pointer  (Dictionary&lt;string,string&gt;)</text>

  <rect x="50" y="198" width="340" height="50" rx="8" fill="#dcecdc" stroke="#6aa84f" stroke-width="1.5"/>
  <text x="220" y="218" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#4c6b4c">CollectionsExample.Explain()</text>
  <text x="220" y="234" text-anchor="middle" font-size="9.5" fill="#6b8a6b">paused — waiting for the call above to return</text>

  <rect x="50" y="258" width="340" height="50" rx="8" fill="#dcecdc" stroke="#6aa84f" stroke-width="1.5"/>
  <text x="220" y="278" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#4c6b4c">Program.cs (Main)</text>
  <text x="220" y="294" text-anchor="middle" font-size="9.5" fill="#6b8a6b">paused — waiting for topic.Explain() to return</text>

  <!-- Heap: the Dictionary object -->
  <rect x="440" y="118" width="480" height="110" rx="10" fill="#f9cb9c" stroke="#e69138" stroke-width="1.5"/>
  <text x="680" y="138" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7f4e00">Dictionary&lt;string,string&gt; — the dictionary object (Count = 2)</text>
  <rect x="456" y="150" width="220" height="60" rx="4" fill="#fff3e6" stroke="#e69138"/>
  <text x="566" y="170" text-anchor="middle" font-size="9.5" fill="#7f4e00">entry 1: key → ref, value → ref</text>
  <text x="566" y="188" text-anchor="middle" font-size="8" fill="#a06a1f">(hashed for fast lookup)</text>
  <rect x="686" y="150" width="220" height="60" rx="4" fill="#fff3e6" stroke="#e69138"/>
  <text x="796" y="170" text-anchor="middle" font-size="9.5" fill="#7f4e00">entry 2: key → ref, value → ref</text>
  <text x="796" y="188" text-anchor="middle" font-size="8" fill="#a06a1f">(hashed for fast lookup)</text>

  <!-- Heap: the 4 string objects (keys + values) -->
  <rect x="456" y="270" width="105" height="44" rx="6" fill="#f9cb9c" stroke="#e69138" stroke-width="1.5"/><text x="508" y="296" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#7f4e00">"Vivek"</text>
  <rect x="571" y="270" width="105" height="44" rx="6" fill="#f9cb9c" stroke="#e69138" stroke-width="1.5"/><text x="623" y="296" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#7f4e00">"9876543210"</text>
  <rect x="686" y="270" width="105" height="44" rx="6" fill="#f9cb9c" stroke="#e69138" stroke-width="1.5"/><text x="738" y="296" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#7f4e00">"Anita"</text>
  <rect x="801" y="270" width="105" height="44" rx="6" fill="#f9cb9c" stroke="#e69138" stroke-width="1.5"/><text x="853" y="296" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#7f4e00">"9123456789"</text>

  <line x1="508" y1="210" x2="508" y2="268" stroke="#555" stroke-width="1.1" marker-end="url(#a)"/>
  <line x1="623" y1="210" x2="623" y2="268" stroke="#555" stroke-width="1.1" marker-end="url(#a)"/>
  <line x1="738" y1="210" x2="738" y2="268" stroke="#555" stroke-width="1.1" marker-end="url(#a)"/>
  <line x1="853" y1="210" x2="853" y2="268" stroke="#555" stroke-width="1.1" marker-end="url(#a)"/>

  <line x1="392" y1="159" x2="454" y2="170" stroke="#555" stroke-width="1.4" marker-end="url(#a)"/>

  <rect x="960" y="118" width="120" height="110" rx="10" fill="#d5c9ea" fill-opacity="0.25" stroke="#674ea7" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="1020" y="150" text-anchor="middle" font-size="10" font-weight="bold" fill="#3d2a6b">Nothing here yet</text>

  <text x="40" y="400" font-size="10.5" fill="#444"><tspan font-weight="bold">The key is stored too, not just the value:</tspan> phoneBook.ContainsKey("Rahul") works by hashing "Rahul" and checking for a matching key string — there's no separate list of names sitting anywhere else.</text>
  <text x="40" y="418" font-size="10" font-style="italic" fill="#888">This is why Dictionary lookups don't slow down as more entries are added — the hash jumps almost straight to the right entry, unlike scanning a List from the start.</text>
</svg>
