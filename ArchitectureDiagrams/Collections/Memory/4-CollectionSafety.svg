<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 520" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#555"/></marker>
  </defs>
  <rect x="0" y="0" width="1050" height="520" fill="#ffffff"/>
  <text x="525" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a237e">Collection Safety — Memory: Stack / Heap / Static</text>
  <text x="525" y="46" text-anchor="middle" font-size="12" fill="#666">Snapshot: ExplainCollectionSafety() is currently executing, right after both checks failed.</text>

  <g font-size="11" fill="#333">
    <rect x="200" y="60" width="14" height="14" rx="2" fill="#b6d7a8" stroke="#6aa84f"/><text x="220" y="71">Stack</text>
    <rect x="380" y="60" width="14" height="14" rx="2" fill="#f9cb9c" stroke="#e69138"/><text x="400" y="71">Heap</text>
    <rect x="560" y="60" width="14" height="14" rx="2" fill="#d5c9ea" stroke="#674ea7"/><text x="580" y="71">Static</text>
  </g>

  <text x="220" y="96" text-anchor="middle" font-size="12" font-weight="bold" fill="#3f6b3f">STACK — call frames (top = currently executing)</text>
  <text x="650" y="96" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a5a10">HEAP</text>
  <text x="930" y="96" text-anchor="middle" font-size="12" font-weight="bold" fill="#3d2a6b">STATIC</text>

  <rect x="30" y="108" width="380" height="340" rx="10" fill="none" stroke="#999" stroke-width="1" stroke-dasharray="5 4"/>

  <rect x="50" y="118" width="340" height="160" rx="8" fill="#b6d7a8" stroke="#6aa84f" stroke-width="2"/>
  <text x="220" y="136" text-anchor="middle" font-size="10" font-weight="bold" fill="#274e13">ExplainCollectionSafety() — ACTIVE</text>
  <rect x="62" y="146" width="316" height="26" rx="4" fill="#eaf6ea" stroke="#6aa84f"/><text x="70" y="163" font-size="10" fill="#1b3d1b">examScores → pointer  (int[])</text>
  <rect x="62" y="176" width="316" height="26" rx="4" fill="#ffffff" stroke="#8fbf8f"/><text x="70" y="193" font-size="10" fill="#1b3d1b">indexToCheck = 10  (int)</text>
  <rect x="62" y="206" width="316" height="26" rx="4" fill="#eaf6ea" stroke="#6aa84f"/><text x="70" y="223" font-size="10" fill="#1b3d1b">phoneBook → pointer  (Dictionary)</text>
  <rect x="62" y="236" width="316" height="26" rx="4" fill="#f4f4f4" stroke="#bbb" stroke-dasharray="3 3"/><text x="70" y="253" font-size="10" fill="#555">rahulNumber → null  (string?, out param)</text>

  <rect x="50" y="288" width="340" height="50" rx="8" fill="#dcecdc" stroke="#6aa84f" stroke-width="1.5"/>
  <text x="220" y="308" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#4c6b4c">CollectionsExample.Explain()</text>
  <text x="220" y="324" text-anchor="middle" font-size="9.5" fill="#6b8a6b">paused — waiting for the call above to return</text>

  <rect x="50" y="348" width="340" height="50" rx="8" fill="#dcecdc" stroke="#6aa84f" stroke-width="1.5"/>
  <text x="220" y="368" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#4c6b4c">Program.cs (Main)</text>
  <text x="220" y="384" text-anchor="middle" font-size="9.5" fill="#6b8a6b">paused — waiting for topic.Explain() to return</text>

  <!-- Heap: the two collections, reused from methods 1 & 3 -->
  <rect x="460" y="146" width="340" height="60" rx="8" fill="#f9cb9c" stroke="#e69138" stroke-width="1.5"/>
  <text x="630" y="168" text-anchor="middle" font-size="10" font-weight="bold" fill="#7f4e00">int[5] examScores — same object as Memory/1</text>
  <text x="630" y="186" text-anchor="middle" font-size="9" fill="#a06a1f">only 5 valid indexes: 0 to 4</text>

  <rect x="460" y="216" width="340" height="60" rx="8" fill="#f9cb9c" stroke="#e69138" stroke-width="1.5"/>
  <text x="630" y="238" text-anchor="middle" font-size="10" font-weight="bold" fill="#7f4e00">Dictionary phoneBook — same object as Memory/3</text>
  <text x="630" y="256" text-anchor="middle" font-size="9" fill="#a06a1f">only "Vivek" and "Anita" are pinned</text>

  <line x1="392" y1="159" x2="458" y2="174" stroke="#555" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="392" y1="219" x2="458" y2="244" stroke="#555" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="630" y="304" text-anchor="middle" font-size="9" font-style="italic" fill="#888">rahulNumber points nowhere — there was no third box to draw an arrow to</text>

  <rect x="930" y="118" width="90" height="212" rx="10" fill="#d5c9ea" fill-opacity="0.25" stroke="#674ea7" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="975" y="150" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#3d2a6b">Nothing</text>
  <text x="975" y="166" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#3d2a6b">here yet</text>

  <text x="40" y="470" font-size="10.5" fill="#444"><tspan font-weight="bold">Neither failed check touched the Heap at all.</tspan> No new array cell, no new dictionary entry was read — the check happened entirely on the Stack, before either collection was ever asked for something it didn't have.</text>
  <text x="40" y="488" font-size="10" font-style="italic" fill="#888">Compare the dashed "rahulNumber → null" row above with Memory/3-Dictionaries.svg's real entries — this is what an out parameter looks like when nothing was found.</text>
</svg>
