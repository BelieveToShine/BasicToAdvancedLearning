<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 460" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#555"/></marker>
  </defs>
  <rect x="0" y="0" width="1050" height="460" fill="#ffffff"/>
  <text x="525" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a237e">Arrays — Memory: Stack / Heap / Static</text>
  <text x="525" y="46" text-anchor="middle" font-size="12" fill="#666">Snapshot: ExplainArrays() is currently executing, after examScores[2] was updated to 80.</text>

  <g font-size="11" fill="#333">
    <rect x="200" y="60" width="14" height="14" rx="2" fill="#b6d7a8" stroke="#6aa84f"/><text x="220" y="71">Stack</text>
    <rect x="380" y="60" width="14" height="14" rx="2" fill="#f9cb9c" stroke="#e69138"/><text x="400" y="71">Heap</text>
    <rect x="560" y="60" width="14" height="14" rx="2" fill="#d5c9ea" stroke="#674ea7"/><text x="580" y="71">Static</text>
  </g>

  <text x="220" y="96" text-anchor="middle" font-size="12" font-weight="bold" fill="#3f6b3f">STACK — call frames (top = currently executing)</text>
  <text x="650" y="96" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a5a10">HEAP</text>
  <text x="930" y="96" text-anchor="middle" font-size="12" font-weight="bold" fill="#3d2a6b">STATIC</text>

  <rect x="30" y="108" width="380" height="280" rx="10" fill="none" stroke="#999" stroke-width="1" stroke-dasharray="5 4"/>

  <rect x="50" y="118" width="340" height="70" rx="8" fill="#b6d7a8" stroke="#6aa84f" stroke-width="2"/>
  <text x="220" y="136" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#274e13">CollectionsDemo.ExplainArrays() — ACTIVE</text>
  <rect x="62" y="146" width="316" height="26" rx="4" fill="#eaf6ea" stroke="#6aa84f"/><text x="70" y="163" font-size="10" fill="#1b3d1b">examScores → pointer  (int[])</text>

  <rect x="50" y="198" width="340" height="50" rx="8" fill="#dcecdc" stroke="#6aa84f" stroke-width="1.5"/>
  <text x="220" y="218" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#4c6b4c">CollectionsExample.Explain()</text>
  <text x="220" y="234" text-anchor="middle" font-size="9.5" fill="#6b8a6b">paused — waiting for the call above to return</text>

  <rect x="50" y="258" width="340" height="50" rx="8" fill="#dcecdc" stroke="#6aa84f" stroke-width="1.5"/>
  <text x="220" y="278" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#4c6b4c">Program.cs (Main)</text>
  <text x="220" y="294" text-anchor="middle" font-size="9.5" fill="#6b8a6b">paused — waiting for topic.Explain() to return</text>

  <!-- Heap: the array object -->
  <rect x="460" y="118" width="440" height="130" rx="10" fill="#f9cb9c" stroke="#e69138" stroke-width="1.5"/>
  <text x="680" y="140" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7f4e00">int[5] — the array object itself</text>
  <rect x="476" y="152" width="80" height="70" rx="4" fill="#fff3e6" stroke="#e69138"/><text x="516" y="174" text-anchor="middle" font-size="9" fill="#a06a1f">[0]</text><text x="516" y="196" text-anchor="middle" font-size="14" font-weight="bold" fill="#7f4e00">85</text>
  <rect x="562" y="152" width="80" height="70" rx="4" fill="#fff3e6" stroke="#e69138"/><text x="602" y="174" text-anchor="middle" font-size="9" fill="#a06a1f">[1]</text><text x="602" y="196" text-anchor="middle" font-size="14" font-weight="bold" fill="#7f4e00">92</text>
  <rect x="648" y="152" width="80" height="70" rx="4" fill="#ffe0c2" stroke="#cc0000" stroke-width="2"/><text x="688" y="174" text-anchor="middle" font-size="9" fill="#a06a1f">[2]</text><text x="688" y="196" text-anchor="middle" font-size="14" font-weight="bold" fill="#7f4e00">80</text>
  <rect x="734" y="152" width="80" height="70" rx="4" fill="#fff3e6" stroke="#e69138"/><text x="774" y="174" text-anchor="middle" font-size="9" fill="#a06a1f">[3]</text><text x="774" y="196" text-anchor="middle" font-size="14" font-weight="bold" fill="#7f4e00">60</text>
  <rect x="820" y="152" width="80" height="70" rx="4" fill="#fff3e6" stroke="#e69138"/><text x="860" y="174" text-anchor="middle" font-size="9" fill="#a06a1f">[4]</text><text x="860" y="196" text-anchor="middle" font-size="14" font-weight="bold" fill="#7f4e00">95</text>
  <text x="680" y="238" text-anchor="middle" font-size="8.5" fill="#a06a1f">[2] was overwritten in place — the box didn't move or resize</text>

  <line x1="392" y1="159" x2="458" y2="180" stroke="#555" stroke-width="1.4" marker-end="url(#a)"/>

  <rect x="930" y="118" width="90" height="130" rx="10" fill="#d5c9ea" fill-opacity="0.25" stroke="#674ea7" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="975" y="150" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#3d2a6b">Nothing</text>
  <text x="975" y="166" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#3d2a6b">here yet</text>

  <text x="40" y="410" font-size="10.5" fill="#444"><tspan font-weight="bold">The int values sit INLINE in the array's own Heap box</tspan> — unlike a string[], there's no second hop here, because int is a value type. Only the array object as a whole is on the Heap.</text>
  <text x="40" y="428" font-size="10" font-style="italic" fill="#888">The array's size (5) is baked into this Heap object when it's created — that's the real reason it can never grow.</text>
</svg>
