<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 460" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#555"/></marker>
  </defs>
  <rect x="0" y="0" width="1100" height="460" fill="#ffffff"/>
  <text x="550" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a237e">Collections — Memory: Stack / Heap / Static (high level)</text>
  <text x="550" y="46" text-anchor="middle" font-size="12" fill="#666">The opposite lesson from every topic so far: this time the Heap is the RULE, not the exception.</text>

  <g font-size="11" fill="#333">
    <rect x="150" y="60" width="14" height="14" rx="2" fill="#b6d7a8" stroke="#6aa84f"/><text x="170" y="71">Stack</text>
    <rect x="330" y="60" width="14" height="14" rx="2" fill="#f9cb9c" stroke="#e69138"/><text x="350" y="71">Heap</text>
    <rect x="510" y="60" width="14" height="14" rx="2" fill="#d5c9ea" stroke="#674ea7"/><text x="530" y="71">Static</text>
  </g>

  <text x="230" y="98" text-anchor="middle" font-size="12" font-weight="bold" fill="#3f6b3f">STACK — just three pointers</text>
  <text x="620" y="98" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a5a10">HEAP — every collection actually lives here</text>
  <text x="930" y="98" text-anchor="middle" font-size="12" font-weight="bold" fill="#3d2a6b">STATIC</text>

  <rect x="40" y="112" width="360" height="230" rx="10" fill="#b6d7a8" stroke="#6aa84f" stroke-width="2"/>
  <text x="220" y="134" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#274e13">One pointer per collection variable</text>
  <g font-size="10" fill="#1b3d1b">
    <rect x="56" y="146" width="328" height="40" rx="4" fill="#eaf6ea" stroke="#6aa84f"/>
    <text x="66" y="164" font-weight="bold">examScores → pointer</text><text x="66" y="180" font-size="8.5" fill="#3f6b3f">ExplainArrays()</text>

    <rect x="56" y="194" width="328" height="40" rx="4" fill="#eaf6ea" stroke="#6aa84f"/>
    <text x="66" y="212" font-weight="bold">todoList → pointer</text><text x="66" y="228" font-size="8.5" fill="#3f6b3f">ExplainLists()</text>

    <rect x="56" y="242" width="328" height="40" rx="4" fill="#eaf6ea" stroke="#6aa84f"/>
    <text x="66" y="260" font-weight="bold">phoneBook → pointer</text><text x="66" y="276" font-size="8.5" fill="#3f6b3f">ExplainDictionaries()</text>
  </g>
  <text x="220" y="330" text-anchor="middle" font-size="9.5" fill="#274e13">Small, fixed-size pointer, no matter how</text>
  <text x="220" y="346" text-anchor="middle" font-size="9.5" fill="#274e13">big the collection behind it grows.</text>

  <rect x="440" y="112" width="380" height="230" rx="10" fill="#f9cb9c" stroke="#e69138" stroke-width="1.5"/>
  <text x="630" y="134" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7f4e00">The real objects — this is where the data is</text>
  <rect x="456" y="146" width="348" height="55" rx="6" fill="#ffffff" stroke="#f0c07a"/>
  <text x="630" y="166" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#7f4e00">int[5] — 5 int cells, inline</text>
  <text x="630" y="182" text-anchor="middle" font-size="8.5" fill="#a06a1f">→ Memory/1-Arrays.svg</text>

  <rect x="456" y="208" width="348" height="55" rx="6" fill="#ffffff" stroke="#f0c07a"/>
  <text x="630" y="228" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#7f4e00">List&lt;string&gt; — resizable, 3 string refs inside</text>
  <text x="630" y="244" text-anchor="middle" font-size="8.5" fill="#a06a1f">→ Memory/2-Lists.svg</text>

  <rect x="456" y="270" width="348" height="55" rx="6" fill="#ffffff" stroke="#f0c07a"/>
  <text x="630" y="290" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#7f4e00">Dictionary&lt;string,string&gt; — key/value pairs, 2 entries</text>
  <text x="630" y="306" text-anchor="middle" font-size="8.5" fill="#a06a1f">→ Memory/3-Dictionaries.svg</text>

  <rect x="850" y="112" width="200" height="230" rx="10" fill="#d5c9ea" fill-opacity="0.25" stroke="#674ea7" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="950" y="145" text-anchor="middle" font-size="11" font-weight="bold" fill="#3d2a6b">Nothing here yet</text>
  <text x="950" y="172" text-anchor="middle" font-size="10" fill="#5b4a7a">No `static` fields or</text>
  <text x="950" y="188" text-anchor="middle" font-size="10" fill="#5b4a7a">consts in this topic.</text>

  <text x="40" y="380" font-size="10.5" fill="#444"><tspan font-weight="bold">Every collection is a reference type.</tspan> An int or a bool sits right in its Stack slot — but an array, a List, or a Dictionary never does. The variable is always just a signpost to the Heap.</text>
  <text x="40" y="400" font-size="10" font-style="italic" fill="#888">That's WHY List&lt;T&gt; can grow: the Stack slot never changes size — it's the Heap object it points to that gets replaced/resized behind the scenes.</text>
</svg>
