<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#333"/></marker>
  </defs>
  <rect x="0" y="0" width="900" height="700" fill="#ffffff"/>
  <text x="450.0" y="20" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a237e">Write and read text — Sub-level Flow: a filing-cabinet drawer</text>
  <text x="450.0" y="38" text-anchor="middle" font-size="11" fill="#666">One call files a whole sheet of text away; one call fetches a copy back. The cabinet is the disk, not program memory.</text>
  <text x="210" y="50" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#274e13">START</text>
  <line x1="210" y1="54" x2="210" y2="92" stroke="#333" stroke-width="2"/>
  <polygon points="210,54 210,72 240,63" fill="#38761d"/>
  <line x1="210" y1="92" x2="210" y2="100" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="60" y="100" width="300" height="40" rx="8" fill="#e8f4fb" stroke="#3d85c6" stroke-width="1.5"/>
  <text x="210" y="125" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a4a73">string summary = "Anita: balance 500";</text>
  <line x1="210" y1="140" x2="210" y2="180" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="60" y="180" width="300" height="50" rx="8" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1.5"/>
  <text x="210" y="202" text-anchor="middle" font-size="10" font-weight="bold" fill="#274e13">try:  File.WriteAllText(path, summary);</text>
  <text x="210" y="219" text-anchor="middle" font-size="9.5" fill="#555">creates the file, or replaces it</text>
  <line x1="360" y1="205" x2="520" y2="205" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="440" y="197" text-anchor="middle" font-size="9.5" fill="#555">files the sheet</text>
  <text x="218" y="256" font-size="9" font-style="italic" fill="#555">Console.WriteLine: "Wrote 18 characters…"</text>
  <line x1="210" y1="230" x2="210" y2="290" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="60" y="290" width="300" height="50" rx="8" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1.5"/>
  <text x="210" y="312" text-anchor="middle" font-size="10" font-weight="bold" fill="#274e13">string readBack = File.ReadAllText(path);</text>
  <text x="210" y="329" text-anchor="middle" font-size="9.5" fill="#555">opens, copies everything out, closes</text>
  <line x1="520" y1="315" x2="362" y2="315" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="440" y="307" text-anchor="middle" font-size="9.5" fill="#555">hands back a copy</text>
  <text x="218" y="366" font-size="9" font-style="italic" fill="#555">Console.WriteLine: "Read back: Anita: balance 500"</text>
  <line x1="210" y1="340" x2="210" y2="440" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="60" y="440" width="300" height="50" rx="8" fill="#fffbe8" stroke="#f1c232" stroke-width="1.5"/>
  <text x="210" y="462" text-anchor="middle" font-size="10" font-weight="bold" fill="#7f6000">finally:  File.Delete(path);</text>
  <text x="210" y="479" text-anchor="middle" font-size="9.5" fill="#555">clean-up, even if something threw</text>
  <line x1="360" y1="465" x2="520" y2="465" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="440" y="457" text-anchor="middle" font-size="9.5" fill="#555">empties the drawer</text>
  <rect x="520" y="150" width="300" height="380" rx="10" fill="#f1f1f1" stroke="#777777" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="670" y="172" text-anchor="middle" font-size="11" font-weight="bold" fill="#444">the filing cabinet = the DISK</text>
  <text x="670" y="188" text-anchor="middle" font-size="9.5" font-style="italic" fill="#777">outside the program's memory</text>
  <rect x="540" y="200" width="260" height="60" rx="8" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
  <text x="670" y="222" text-anchor="middle" font-size="9.5" fill="#555">after WriteAllText:</text>
  <text x="670" y="240" text-anchor="middle" font-size="9" font-weight="bold" fill="#333">bta-statement.txt — Anita: balance 500</text>
  <rect x="540" y="290" width="260" height="50" rx="8" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
  <text x="670" y="312" text-anchor="middle" font-size="9.5" fill="#555">during ReadAllText:</text>
  <text x="670" y="328" text-anchor="middle" font-size="9" font-weight="bold" fill="#333">the sheet stays; a copy goes out</text>
  <rect x="540" y="430" width="260" height="60" rx="8" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="670" y="452" text-anchor="middle" font-size="9.5" fill="#555">after Delete:</text>
  <text x="670" y="470" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#777">empty — no file any more</text>
  <line x1="210" y1="490" x2="210" y2="530" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="210" y="544" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#990000">END</text>
  <line x1="210" y1="552" x2="210" y2="592" stroke="#333" stroke-width="2"/>
  <polygon points="210,552 210,570 240,561" fill="#cc0000"/>
  <text x="30" y="640" font-size="10.5" fill="#444"><tspan font-weight="bold">Two calls, no cleaning up needed in between:</tspan> each File.* method opens and closes the file by itself.</text>
  <text x="30" y="658" font-size="10" font-style="italic" fill="#888">Console.WriteLine prints the "Wrote" line and the "Read back" line — two lines. The finally block runs File.Delete whether or not the lines above succeed.</text>
  <text x="30" y="676" font-size="10" font-style="italic" fill="#888">Each method also opens with PrintHeading(): four more Console.WriteLine calls for the title banner (not drawn).</text>
</svg>
