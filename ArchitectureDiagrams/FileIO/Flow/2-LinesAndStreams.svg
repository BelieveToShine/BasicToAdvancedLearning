<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#333"/></marker>
  </defs>
  <rect x="0" y="0" width="900" height="640" fill="#ffffff"/>
  <text x="450.0" y="20" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a237e">Streams — Sub-level Flow: a water pipe with a tap</text>
  <text x="450.0" y="38" text-anchor="middle" font-size="11" fill="#666">A stream keeps the pipe to the file open. `using` makes sure the tap is turned off at the closing brace, even after an error.</text>
  <text x="145" y="50" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#274e13">START</text>
  <line x1="145" y1="54" x2="145" y2="92" stroke="#333" stroke-width="2"/>
  <polygon points="145,54 145,72 175,63" fill="#38761d"/>
  <line x1="145" y1="92" x2="145" y2="110" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="40" y="110" width="210" height="66" rx="8" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1.5"/>
  <text x="145" y="130" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#274e13">using (StreamWriter writer =</text>
  <text x="145" y="145" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#274e13">new StreamWriter(path))</text>
  <text x="145" y="164" text-anchor="middle" font-size="9.5" font-style="italic" fill="#555">open the tap</text>
  <line x1="250" y1="143" x2="290" y2="143" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="290" y="110" width="250" height="66" rx="8" fill="#e8f4fb" stroke="#3d85c6" stroke-width="1.5"/>
  <text x="415" y="130" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a4a73">writer.WriteLine(…)  ×3</text>
  <text x="415" y="147" text-anchor="middle" font-size="9" fill="#333">"Deposit 200"</text>
  <text x="415" y="162" text-anchor="middle" font-size="9" fill="#333">"Withdraw 900 (refused)" · "Withdraw 100"</text>
  <line x1="540" y1="143" x2="580" y2="143" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="580" y="110" width="280" height="66" rx="8" fill="#fffbe8" stroke="#f1c232" stroke-width="1.5"/>
  <text x="720" y="130" text-anchor="middle" font-size="10" font-weight="bold" fill="#7f6000">}  — Dispose() runs here</text>
  <text x="720" y="148" text-anchor="middle" font-size="9.5" fill="#333">hands the text to the OS,</text>
  <text x="720" y="163" text-anchor="middle" font-size="9.5" fill="#333">then closes the file</text>
  <line x1="720" y1="176" x2="720" y2="226" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="580" y="228" width="280" height="56" rx="10" fill="#f1f1f1" stroke="#777777" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="720" y="250" text-anchor="middle" font-size="10" font-weight="bold" fill="#444">the file on DISK (outside .NET)</text>
  <text x="720" y="268" text-anchor="middle" font-size="9.5" fill="#333">bta-statement.txt — 3 lines</text>
  <line x1="720" y1="284" x2="720" y2="334" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="580" y="336" width="280" height="66" rx="8" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1.5"/>
  <text x="720" y="356" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#274e13">using (StreamReader reader =</text>
  <text x="720" y="371" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#274e13">new StreamReader(path))</text>
  <text x="720" y="390" text-anchor="middle" font-size="9.5" font-style="italic" fill="#555">open a tap on the same pipe</text>
  <line x1="580" y1="369" x2="540" y2="369" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="290" y="336" width="250" height="66" rx="8" fill="#e8f4fb" stroke="#3d85c6" stroke-width="1.5"/>
  <text x="415" y="356" text-anchor="middle" font-size="9" font-weight="bold" fill="#1a4a73">while ((line = reader.ReadLine()) != null)</text>
  <text x="415" y="373" text-anchor="middle" font-size="9" fill="#333">lineCount++;  Console.WriteLine(line N)</text>
  <text x="415" y="390" text-anchor="middle" font-size="9" font-style="italic" fill="#555">ReadLine() returns null at the end</text>
  <polyline points="340,402 340,432 490,432 490,404" fill="none" stroke="#3d85c6" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="415" y="448" text-anchor="middle" font-size="9.5" fill="#1a4a73">next line  (×3)</text>
  <circle r="4" fill="#e69138" cy="432"><animate attributeName="cx" values="340;490;340" dur="3s" repeatCount="indefinite"/></circle>
  <line x1="290" y1="369" x2="250" y2="369" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="40" y="336" width="210" height="66" rx="8" fill="#fffbe8" stroke="#f1c232" stroke-width="1.5"/>
  <text x="145" y="358" text-anchor="middle" font-size="10" font-weight="bold" fill="#7f6000">}  — Dispose() runs here</text>
  <text x="145" y="376" text-anchor="middle" font-size="9.5" fill="#333">releases the file again,</text>
  <text x="145" y="391" text-anchor="middle" font-size="9.5" fill="#333">then "Read 3 lines" prints</text>
  <line x1="145" y1="402" x2="145" y2="470" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="145" y="484" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#990000">END</text>
  <line x1="145" y1="492" x2="145" y2="532" stroke="#333" stroke-width="2"/>
  <polygon points="145,492 145,510 175,501" fill="#cc0000"/>
  <text x="30" y="560" font-size="10.5" fill="#444"><tspan font-weight="bold">The closing brace is the tap:</tspan> without `using`, a forgotten stream can lose its last buffered lines and, on Windows, keep the file locked.</text>
  <text x="30" y="578" font-size="10" font-style="italic" fill="#888">Console.WriteLine prints each line read ("line 1: …" to "line 3: …") and "Read 3 lines" — four lines. A finally block deletes the file afterwards (as in Flow/1).</text>
  <text x="30" y="596" font-size="10" font-style="italic" fill="#888">Each method also opens with PrintHeading(): four more Console.WriteLine calls for the title banner (not drawn).</text>
</svg>
