<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#555"/></marker>
  </defs>
  <rect x="0" y="0" width="1100" height="520" fill="#ffffff"/>
  <text x="550" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a237e">File I/O — Memory: Stack / Heap / Static (high level)</text>
  <text x="550" y="46" text-anchor="middle" font-size="12" fill="#666">The program's memory mainly holds strings and stream objects; the file itself lives outside .NET, on the disk.</text>
  <g font-size="11" fill="#333"><rect x="150" y="60" width="14" height="14" rx="2" fill="#b6d7a8" stroke="#6aa84f"/><text x="170" y="71">Stack</text></g>
  <g font-size="11" fill="#333"><rect x="330" y="60" width="14" height="14" rx="2" fill="#f9cb9c" stroke="#e69138"/><text x="350" y="71">Heap</text></g>
  <g font-size="11" fill="#333"><rect x="510" y="60" width="14" height="14" rx="2" fill="#d5c9ea" stroke="#674ea7"/><text x="530" y="71">Static</text></g>
  <text x="230" y="98" text-anchor="middle" font-size="12" font-weight="bold" fill="#3f6b3f">STACK — pointers, plus a few plain values</text>
  <text x="630" y="98" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a5a10">HEAP — strings and stream objects</text>
  <text x="950" y="98" text-anchor="middle" font-size="12" font-weight="bold" fill="#3d2a6b">STATIC</text>
  <rect x="40" y="112" width="380" height="222" rx="8" fill="#b6d7a8" stroke="#6aa84f" stroke-width="2"/>
  <text x="230" y="132" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#274e13">One slot per local, in each method's own frame</text>
  <rect x="56" y="144" width="348" height="38" rx="4" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1"/>
  <text x="66" y="161" font-size="10" font-weight="bold" fill="#1b3d1b">path, summary, readBack → 3 string pointers</text>
  <text x="66" y="175" font-size="8.5" fill="#3f6b3f">ExplainWriteAndReadText()</text>
  <rect x="56" y="188" width="348" height="38" rx="4" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1"/>
  <text x="66" y="205" font-size="10" font-weight="bold" fill="#1b3d1b">path, reader, line → pointers; lineCount inline</text>
  <text x="66" y="219" font-size="8.5" fill="#3f6b3f">ExplainLinesAndStreams()</text>
  <rect x="56" y="232" width="348" height="38" rx="4" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1"/>
  <text x="66" y="249" font-size="10" font-weight="bold" fill="#1b3d1b">folder, path → pointers; 3 bools inline</text>
  <text x="66" y="263" font-size="8.5" fill="#3f6b3f">ExplainPathsAndExistence()</text>
  <rect x="56" y="276" width="348" height="38" rx="4" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1"/>
  <text x="66" y="293" font-size="10" font-weight="bold" fill="#1b3d1b">missingPath, ex → pointers; canRead later</text>
  <text x="66" y="307" font-size="8.5" fill="#3f6b3f">ExplainFileErrors()</text>
  <rect x="450" y="112" width="380" height="222" rx="8" fill="#f9cb9c" stroke="#e69138" stroke-width="1.5"/>
  <text x="640" y="132" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7f4e00">The real .NET objects</text>
  <rect x="466" y="144" width="348" height="54" rx="6" fill="#ffffff" stroke="#f0c07a" stroke-width="1"/>
  <text x="640" y="166" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#7f4e00">Strings: paths, and text read back from disk</text>
  <text x="640" y="184" text-anchor="middle" font-size="8.5" fill="#a06a1f">ReadAllText / ReadLine build a NEW string each time</text>
  <rect x="466" y="206" width="348" height="54" rx="6" fill="#ffffff" stroke="#f0c07a" stroke-width="1"/>
  <text x="640" y="228" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#7f4e00">StreamReader → FileStream (Memory/2)</text>
  <text x="640" y="246" text-anchor="middle" font-size="8.5" fill="#a06a1f">objects that are only a doorway to the operating system</text>
  <rect x="466" y="268" width="348" height="54" rx="6" fill="#ffffff" stroke="#f0c07a" stroke-width="1"/>
  <text x="640" y="290" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#7f4e00">An exception object when a file is missing</text>
  <text x="640" y="308" text-anchor="middle" font-size="8.5" fill="#a06a1f">FileNotFoundException — see Memory/4 and Topic 7</text>
  <rect x="860" y="112" width="200" height="222" rx="10" fill="#d5c9ea" stroke="#674ea7" stroke-width="1.5" stroke-dasharray="6 4" fill-opacity="0.25"/>
  <text x="960" y="190" text-anchor="middle" font-size="11" font-weight="bold" fill="#3d2a6b">Nothing here yet</text>
  <text x="960" y="214" text-anchor="middle" font-size="10" fill="#5b4a7a">File and Path are static</text>
  <text x="960" y="230" text-anchor="middle" font-size="10" fill="#5b4a7a">classes, but they hold no</text>
  <text x="960" y="246" text-anchor="middle" font-size="10" fill="#5b4a7a">fields this topic uses.</text>
  <rect x="450" y="350" width="610" height="66" rx="10" fill="#f1f1f1" stroke="#777777" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="755" y="372" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#444">OUTSIDE .NET — the operating system and the disk</text>
  <text x="755" y="392" text-anchor="middle" font-size="9.5" fill="#333">open file handles and the file bta-statement.txt itself: never in the Stack, Heap or Static.</text>
  <text x="755" y="408" text-anchor="middle" font-size="9.5" font-style="italic" fill="#777">Every Memory diagram in this topic draws it as a dashed grey box under the Heap.</text>
  <text x="40" y="450" font-size="10.5" fill="#444"><tspan font-weight="bold">A stream is a doorway, not the file.</tspan> The StreamReader and FileStream objects are on the Heap; the handle and the data are not — so the stream must be closed (disposed).</text>
  <text x="40" y="470" font-size="10" font-style="italic" fill="#888">The extra dashed box is a recorded addition to the locked 3-column shape (see ROADMAP and verification.md); the Stack, Heap and Static columns themselves are unchanged.</text>
</svg>
