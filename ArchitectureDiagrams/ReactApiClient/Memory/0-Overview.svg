<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 880" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#555"/></marker>
  </defs>
  <rect x="0" y="0" width="1050" height="880" fill="#ffffff"/>
  <text x="525.0" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a237e">ReactApiClient — Memory overview: where each piece of data lives</text>
  <text x="525.0" y="46" text-anchor="middle" font-size="12" fill="#666">Green = props, orange = state, purple = derived, blue = module code, grey dashed = outside React. Values from the lessons and the real run.</text>
  <g font-size="11" fill="#333"><rect x="247" y="60" width="14" height="14" rx="2" fill="#b6d7a8" stroke="#6aa84f"/><text x="267" y="71">Props</text></g>
  <g font-size="11" fill="#333"><rect x="307" y="60" width="14" height="14" rx="2" fill="#f9cb9c" stroke="#e69138"/><text x="327" y="71">State</text></g>
  <g font-size="11" fill="#333"><rect x="367" y="60" width="14" height="14" rx="2" fill="#d5c9ea" stroke="#674ea7"/><text x="387" y="71">Derived</text></g>
  <g font-size="11" fill="#333"><rect x="438" y="60" width="14" height="14" rx="2" fill="#fff2cc" stroke="#bf9000"/><text x="458" y="71">Ref</text></g>
  <g font-size="11" fill="#333"><rect x="487" y="60" width="14" height="14" rx="2" fill="#cfe2f3" stroke="#3d85c6"/><text x="507" y="71">Effect / cleanup</text></g>
  <g font-size="11" fill="#333"><rect x="609" y="60" width="14" height="14" rx="2" fill="#f3f3f3" stroke="#888888" stroke-dasharray="4 3"/><text x="629" y="71">DOM / browser / outside React</text></g>
  <rect x="30" y="104" width="450" height="700" rx="10" fill="none" stroke="#999" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="255.0" y="98" text-anchor="middle" font-size="11" font-weight="bold" fill="#3f6b3f">YOUR REACT APP (in the browser tab)</text>
  <rect x="50" y="120" width="410" height="140" rx="10" fill="#cfe2f3" stroke="#3d85c6" stroke-width="1.6"/>
  <text x="255.0" y="140" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1c4587">api.js  (a module: one copy for the whole app)</text>
  <text x="255.0" y="156" text-anchor="middle" font-size="9" font-style="italic" fill="#1c4587">code, not state: nothing here changes per component</text>
  <rect x="60" y="166" width="390" height="26" rx="4" fill="#e8f1fb" stroke="#3d85c6" stroke-width="1"/>
  <text x="68" y="182.5" font-size="10" fill="#1c4587">BASE = '/api'</text>
  <rect x="60" y="196" width="390" height="26" rx="4" fill="#e8f1fb" stroke="#3d85c6" stroke-width="1"/>
  <text x="68" y="212.5" font-size="10" fill="#1c4587">request(), readBody(), class ApiError</text>
  <rect x="60" y="226" width="390" height="26" rx="4" fill="#e8f1fb" stroke="#3d85c6" stroke-width="1"/>
  <text x="68" y="242.5" font-size="10" fill="#1c4587">api.listAccounts(), api.createAccount(), ...</text>
  <rect x="50" y="290" width="410" height="110" rx="10" fill="#b6d7a8" stroke="#6aa84f" stroke-width="1.6"/>
  <text x="255.0" y="310" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#274e13">PROPS</text>
  <text x="255.0" y="326" text-anchor="middle" font-size="9" font-style="italic" fill="#274e13">read-only, owned by the parent</text>
  <rect x="60" y="336" width="390" height="26" rx="4" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1"/>
  <text x="68" y="352.5" font-size="10" fill="#274e13">onCreated = a function from AccountsPage (lesson 2)</text>
  <rect x="60" y="366" width="390" height="26" rx="4" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1"/>
  <text x="68" y="382.5" font-size="10" fill="#274e13">error = an ApiError object (ErrorView, lesson 4)</text>
  <rect x="50" y="430" width="410" height="170" rx="10" fill="#f9cb9c" stroke="#e69138" stroke-width="1.6"/>
  <text x="255.0" y="450" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7f4e00">STATE  (per component, survives renders)</text>
  <text x="255.0" y="466" text-anchor="middle" font-size="9" font-style="italic" fill="#7f4e00">changing it renders again</text>
  <rect x="60" y="476" width="390" height="26" rx="4" fill="#fff3e6" stroke="#e69138" stroke-width="1"/>
  <text x="68" y="492.5" font-size="10" fill="#7f4e00">status = 'success' data = [3 accounts]   (lesson 1)</text>
  <rect x="60" y="506" width="390" height="26" rx="4" fill="#fff3e6" stroke="#e69138" stroke-width="1"/>
  <text x="68" y="522.5" font-size="10" fill="#7f4e00">accounts, gets = 2   (lesson 2)</text>
  <rect x="60" y="536" width="390" height="26" rx="4" fill="#fff3e6" stroke="#e69138" stroke-width="1"/>
  <text x="68" y="552.5" font-size="10" fill="#7f4e00">result = { key: '422', entries: [...] }   (lesson 3)</text>
  <rect x="60" y="566" width="390" height="26" rx="4" fill="#fff3e6" stroke="#e69138" stroke-width="1"/>
  <text x="68" y="582.5" font-size="10" fill="#7f4e00">error = ApiError { kind: 'conflict', status: 409 }  (lesson 4)</text>
  <rect x="50" y="620" width="410" height="84" rx="10" fill="#d5c9ea" stroke="#674ea7" stroke-width="1.6"/>
  <text x="255.0" y="640" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#3d2a6b">DERIVED  (not stored)</text>
  <text x="255.0" y="656" text-anchor="middle" font-size="9" font-style="italic" fill="#3d2a6b">recalculated from state on every render</text>
  <rect x="60" y="666" width="390" height="26" rx="4" fill="#efe9f8" stroke="#674ea7" stroke-width="1"/>
  <text x="68" y="682.5" font-size="10" fill="#3d2a6b">the table rows, guideFor(422).ui, ErrorView's text</text>
  <rect x="560" y="104" width="460" height="700" rx="10" fill="none" stroke="#999" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="790.0" y="98" text-anchor="middle" font-size="11" font-weight="bold" fill="#3f6b3f">BROWSER, NETWORK, SERVER (outside React)</text>
  <rect x="580" y="150" width="420" height="140" rx="10" fill="#f3f3f3" stroke="#888888" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text x="790.0" y="170" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#444444">fetch RESPONSE (lives in the browser)</text>
  <text x="790.0" y="186" text-anchor="middle" font-size="9" font-style="italic" fill="#444444">one per request; its body can be read once</text>
  <rect x="590" y="196" width="400" height="26" rx="4" fill="#ffffff" stroke="#888888" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="598" y="212.5" font-size="10" fill="#444444">status = 201, ok = true</text>
  <rect x="590" y="226" width="400" height="26" rx="4" fill="#ffffff" stroke="#888888" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="598" y="242.5" font-size="10" fill="#444444">headers: Content-Type, Location</text>
  <rect x="590" y="256" width="400" height="26" rx="4" fill="#ffffff" stroke="#888888" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="598" y="272.5" font-size="10" fill="#444444">body: read once with json() or text()</text>
  <rect x="580" y="340" width="420" height="110" rx="10" fill="#f3f3f3" stroke="#888888" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text x="790.0" y="360" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#444444">VITE DEV SERVER  (page origin, e.g. :5173)</text>
  <text x="790.0" y="376" text-anchor="middle" font-size="9" font-style="italic" fill="#444444">same origin as the page</text>
  <rect x="590" y="386" width="400" height="26" rx="4" fill="#ffffff" stroke="#888888" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="598" y="402.5" font-size="10" fill="#444444">proxy: '/api' -&gt; API (server to server)</text>
  <rect x="590" y="416" width="400" height="26" rx="4" fill="#ffffff" stroke="#888888" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="598" y="432.5" font-size="10" fill="#444444">serves the page itself</text>
  <rect x="580" y="500" width="420" height="110" rx="10" fill="#f3f3f3" stroke="#888888" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text x="790.0" y="520" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#444444">BANK WEB API  (own origin, e.g. :5080)</text>
  <text x="790.0" y="536" text-anchor="middle" font-size="9" font-style="italic" fill="#444444">its own program</text>
  <rect x="590" y="546" width="400" height="26" rx="4" fill="#ffffff" stroke="#888888" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="598" y="562.5" font-size="10" fill="#444444">validates, applies business rules, answers JSON</text>
  <rect x="590" y="576" width="400" height="26" rx="4" fill="#ffffff" stroke="#888888" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="598" y="592.5" font-size="10" fill="#444444">no CORS headers: direct calls from the page are blocked</text>
  <rect x="580" y="650" width="420" height="76" rx="10" fill="#f3f3f3" stroke="#888888" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text x="790.0" y="670" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#444444">SQL SERVER</text>
  <rect x="590" y="682" width="400" height="26" rx="4" fill="#ffffff" stroke="#888888" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="598" y="698.5" font-size="10" fill="#444444">Customers, Accounts, Transactions rows</text>
  <line x1="460" y1="195" x2="578" y2="195" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="470" y="187" font-size="9.5" font-style="italic" fill="#444">api.js calls fetch</text>
  <line x1="578" y1="240" x2="462" y2="240" stroke="#555" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="470" y="232" font-size="9.5" font-style="italic" fill="#444">Response arrives</text>
  <line x1="790" y1="290" x2="790" y2="338" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="798" y="330" font-size="9.5" font-style="italic" fill="#444">relative URL</text>
  <line x1="790" y1="450" x2="790" y2="498" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="798" y="478.0" font-size="9.5" font-style="italic" fill="#444">proxy forwards</text>
  <line x1="790" y1="610" x2="790" y2="648" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="798" y="633.0" font-size="9.5" font-style="italic" fill="#444">reads / writes</text>
  <text x="40" y="836" font-size="10" font-style="italic" fill="#888">The React side holds only copies of what the API said (state), and the module that knows how to ask. The truth lives in SQL Server; every refresh is a new request.</text>
  <text x="40" y="854" font-size="10" font-style="italic" fill="#888">The Response object is outside React state: components copy the parts they need (status, data, error) into state, then it is no longer needed.</text>
</svg>
