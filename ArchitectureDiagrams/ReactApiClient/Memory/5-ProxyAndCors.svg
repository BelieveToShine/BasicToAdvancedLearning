<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 920" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#555"/></marker>
  </defs>
  <rect x="0" y="0" width="1050" height="920" fill="#ffffff"/>
  <text x="525.0" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a237e">Proxy and CORS — Memory: where the data lives</text>
  <text x="525.0" y="46" text-anchor="middle" font-size="12" fill="#666">Instant: lesson page after "Direct GET", "Direct POST" and the Location button (default ports: page :5173, API :5080; the author run used others).</text>
  <g font-size="11" fill="#333"><rect x="247" y="60" width="14" height="14" rx="2" fill="#b6d7a8" stroke="#6aa84f"/><text x="267" y="71">Props</text></g>
  <g font-size="11" fill="#333"><rect x="307" y="60" width="14" height="14" rx="2" fill="#f9cb9c" stroke="#e69138"/><text x="327" y="71">State</text></g>
  <g font-size="11" fill="#333"><rect x="367" y="60" width="14" height="14" rx="2" fill="#d5c9ea" stroke="#674ea7"/><text x="387" y="71">Derived</text></g>
  <g font-size="11" fill="#333"><rect x="438" y="60" width="14" height="14" rx="2" fill="#fff2cc" stroke="#bf9000"/><text x="458" y="71">Ref</text></g>
  <g font-size="11" fill="#333"><rect x="487" y="60" width="14" height="14" rx="2" fill="#cfe2f3" stroke="#3d85c6"/><text x="507" y="71">Effect / cleanup</text></g>
  <g font-size="11" fill="#333"><rect x="609" y="60" width="14" height="14" rx="2" fill="#f3f3f3" stroke="#888888" stroke-dasharray="4 3"/><text x="629" y="71">DOM / browser / outside React</text></g>
  <rect x="30" y="104" width="450" height="706" rx="10" fill="none" stroke="#999" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="255.0" y="98" text-anchor="middle" font-size="11" font-weight="bold" fill="#3f6b3f">Lesson page (React memory)</text>
  <rect x="560" y="104" width="460" height="706" rx="10" fill="none" stroke="#999" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="790.0" y="98" text-anchor="middle" font-size="11" font-weight="bold" fill="#3f6b3f">BROWSER, VITE, API (outside React)</text>
  <rect x="50" y="116" width="410" height="110" rx="10" fill="#f9cb9c" stroke="#e69138" stroke-width="1.6"/>
  <text x="255.0" y="136" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7f4e00">DirectToTheApi  STATE</text>
  <text x="255.0" y="152" text-anchor="middle" font-size="9" font-style="italic" fill="#7f4e00">the page only learns "TypeError": no status, no body</text>
  <rect x="60" y="162" width="390" height="26" rx="4" fill="#fff3e6" stroke="#e69138" stroke-width="1"/>
  <text x="68" y="178.5" font-size="10" fill="#7f4e00">base = 'http://localhost:5080'</text>
  <rect x="60" y="192" width="390" height="26" rx="4" fill="#fff3e6" stroke="#e69138" stroke-width="1"/>
  <text x="68" y="208.5" font-size="10" fill="#7f4e00">result = { label: 'POST', text: 'fetch rejected (TypeError). ...' }</text>
  <rect x="50" y="240" width="410" height="140" rx="10" fill="#f9cb9c" stroke="#e69138" stroke-width="1.6"/>
  <text x="255.0" y="260" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7f4e00">ThroughTheProxy  STATE</text>
  <text x="255.0" y="276" text-anchor="middle" font-size="9" font-style="italic" fill="#7f4e00">the relative call: allowed, readable</text>
  <rect x="60" y="286" width="390" height="26" rx="4" fill="#fff3e6" stroke="#e69138" stroke-width="1"/>
  <text x="68" y="302.5" font-size="10" fill="#7f4e00">result.text = 'Status 200, 7 accounts. The browser requested:</text>
  <rect x="60" y="316" width="390" height="26" rx="4" fill="#fff3e6" stroke="#e69138" stroke-width="1"/>
  <text x="68" y="332.5" font-size="10" fill="#7f4e00">   http://localhost:5173/api/accounts'</text>
  <rect x="50" y="396" width="410" height="178" rx="10" fill="#f9cb9c" stroke="#e69138" stroke-width="1.6"/>
  <text x="255.0" y="416" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7f4e00">LocationHeader  STATE</text>
  <text x="255.0" y="432" text-anchor="middle" font-size="9" font-style="italic" fill="#7f4e00">the two origins differ: do not fetch(location)</text>
  <rect x="60" y="442" width="390" height="28" rx="4" fill="#fff3e6" stroke="#e69138" stroke-width="1"/>
  <text x="68" y="459.5" font-size="10" fill="#7f4e00">result.location = 'http://localhost:5080/api/accounts/30'</text>
  <rect x="60" y="474" width="390" height="28" rx="4" fill="#fff3e6" stroke="#e69138" stroke-width="1"/>
  <text x="68" y="491.5" font-size="10" fill="#7f4e00">result.locationOrigin = 'http://localhost:5080'</text>
  <rect x="60" y="506" width="390" height="28" rx="4" fill="#fff3e6" stroke="#e69138" stroke-width="1"/>
  <text x="68" y="523.5" font-size="10" fill="#7f4e00">result.pageOrigin = 'http://localhost:5173'</text>
  <rect x="60" y="538" width="390" height="28" rx="4" fill="#fff3e6" stroke="#e69138" stroke-width="1"/>
  <text x="68" y="555.5" font-size="10" fill="#7f4e00">result.path = '/api/accounts/30'</text>
  <rect x="50" y="590" width="410" height="110" rx="10" fill="#d5c9ea" stroke="#674ea7" stroke-width="1.6"/>
  <text x="255.0" y="610" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#3d2a6b">DERIVED  (not stored)</text>
  <text x="255.0" y="626" text-anchor="middle" font-size="9" font-style="italic" fill="#3d2a6b">URL.origin = scheme + host + port</text>
  <rect x="60" y="636" width="390" height="26" rx="4" fill="#efe9f8" stroke="#674ea7" stroke-width="1"/>
  <text x="68" y="652.5" font-size="10" fill="#3d2a6b">resolved relative URL = 'http://localhost:5173/api/accounts'</text>
  <rect x="60" y="666" width="390" height="26" rx="4" fill="#efe9f8" stroke="#674ea7" stroke-width="1"/>
  <text x="68" y="682.5" font-size="10" fill="#3d2a6b">locationOrigin === pageOrigin  -&gt;  false</text>
  <rect x="580" y="116" width="420" height="150" rx="10" fill="#f3f3f3" stroke="#888888" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text x="790.0" y="136" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#444444">BROWSER  (enforces CORS)</text>
  <text x="790.0" y="152" text-anchor="middle" font-size="9" font-style="italic" fill="#444444">rule lives here, not in the API</text>
  <rect x="590" y="162" width="400" height="26" rx="4" fill="#ffffff" stroke="#888888" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="598" y="178.5" font-size="10" fill="#444444">page origin = http://localhost:5173</text>
  <rect x="590" y="192" width="400" height="26" rx="4" fill="#ffffff" stroke="#888888" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="598" y="208.5" font-size="10" fill="#444444">direct GET: answer 200 hidden (no Access-Control-Allow-Origin)</text>
  <rect x="590" y="222" width="400" height="26" rx="4" fill="#ffffff" stroke="#888888" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="598" y="238.5" font-size="10" fill="#444444">direct POST (JSON): preflight OPTIONS got 405, POST never sent</text>
  <rect x="580" y="306" width="420" height="100" rx="10" fill="#f3f3f3" stroke="#888888" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text x="790.0" y="326" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#444444">VITE SERVER  http://localhost:5173</text>
  <rect x="590" y="338" width="400" height="26" rx="4" fill="#ffffff" stroke="#888888" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="598" y="354.5" font-size="10" fill="#444444">GET /api/accounts -&gt; forwarded to :5080</text>
  <rect x="590" y="368" width="400" height="26" rx="4" fill="#ffffff" stroke="#888888" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="598" y="384.5" font-size="10" fill="#444444">the browser sees only :5173</text>
  <rect x="580" y="446" width="420" height="130" rx="10" fill="#f3f3f3" stroke="#888888" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text x="790.0" y="466" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#444444">BANK API  http://localhost:5080</text>
  <rect x="590" y="478" width="400" height="26" rx="4" fill="#ffffff" stroke="#888888" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="598" y="494.5" font-size="10" fill="#444444">its log: GET /api/accounts (200, direct call arrived)</text>
  <rect x="590" y="508" width="400" height="26" rx="4" fill="#ffffff" stroke="#888888" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="598" y="524.5" font-size="10" fill="#444444">OPTIONS /api/accounts (405)  -  no POST from the direct button</text>
  <rect x="590" y="538" width="400" height="26" rx="4" fill="#ffffff" stroke="#888888" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="598" y="554.5" font-size="10" fill="#444444">no CORS configuration at all</text>
  <line x1="578" y1="196" x2="462" y2="196" stroke="#555" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="470" y="188" font-size="9.5" font-style="italic" fill="#444">TypeError, nothing else</text>
  <line x1="578" y1="340" x2="462" y2="340" stroke="#555" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="470" y="332" font-size="9.5" font-style="italic" fill="#444">proxy answer: allowed</text>
  <line x1="790" y1="266" x2="790" y2="304" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="798" y="289.0" font-size="9.5" font-style="italic" fill="#444">same-origin call</text>
  <line x1="790" y1="406" x2="790" y2="444" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="798" y="429.0" font-size="9.5" font-style="italic" fill="#444">server to server</text>
  <line x1="578" y1="520" x2="462" y2="520" stroke="#555" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="470" y="512" font-size="9.5" font-style="italic" fill="#444">Location (via proxy)</text>
  <text x="40" y="846" font-size="10" font-style="italic" fill="#888">The page learns nothing about WHY a direct call failed; the browser console says "blocked by CORS policy". A CORS block and a stopped server are both a rejected fetch with a TypeError.</text>
  <text x="40" y="864" font-size="10" font-style="italic" fill="#888">Through the dev proxy the API saw its own address as Host (checked with a throw-away upstream), so Location holds the API origin and the path is what the page should reuse.</text>
</svg>
