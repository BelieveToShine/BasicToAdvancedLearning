<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 756" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#333"/></marker>
  </defs>
  <rect x="0" y="0" width="900" height="756" fill="#ffffff"/>
  <text x="450.0" y="20" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a237e">Transactions — Sub-level Flow: a shopping basket at the checkout</text>
  <text x="450.0" y="38" text-anchor="middle" font-size="11" fill="#666">BEGIN puts changes in the basket, COMMIT pays for all of them at once, ROLLBACK tips the whole basket back onto the shelf.</text>
  <text x="200" y="50" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#274e13">START</text>
  <line x1="200" y1="54" x2="200" y2="92" stroke="#333" stroke-width="2"/>
  <polygon points="200,54 200,72 230,63" fill="#38761d"/>
  <line x1="200" y1="92" x2="200" y2="110" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="550" y="82" width="340" height="496" rx="10" fill="#f1f1f1" stroke="#777777" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="720.0" y="100" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#444">the bank tables = SQL Server (outside .NET)</text>
  <rect x="40" y="112" width="320" height="64" rx="8" fill="#e8f4fb" stroke="#3d85c6" stroke-width="1.5"/>
  <text x="200.0" y="130" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a4a73">ShowBalances()</text>
  <text x="200.0" y="145" text-anchor="middle" font-size="9.5" fill="#333">look at the till before the transfer</text>
  <text x="200.0" y="166" text-anchor="middle" font-size="9" font-style="italic" fill="#555">Console.WriteLine intro; Show prints 500.00 / 0.00 / 0.00</text>
  <rect x="570" y="112" width="300" height="64" rx="8" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
  <text x="720.0" y="133.0" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#333">The till (Accounts)</text>
  <text x="720.0" y="147.0" text-anchor="middle" font-size="9.5" fill="#333">SAV-1001 500.00, CUR-2001 0.00,</text>
  <text x="720.0" y="161.0" text-anchor="middle" font-size="9.5" fill="#333">SAV-3001 0.00</text>
  <line x1="360" y1="134" x2="570" y2="134" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="465.0" y="127" text-anchor="middle" font-size="9" fill="#333">SELECT AccountNumber, Balance</text>
  <line x1="570" y1="154" x2="360" y2="154" stroke="#333" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="465.0" y="169" text-anchor="middle" font-size="9" font-style="italic" fill="#555">grid: 3 balances</text>
  <line x1="200" y1="176" x2="200" y2="202" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="40" y="202" width="320" height="88" rx="8" fill="#e8f4fb" stroke="#3d85c6" stroke-width="1.5"/>
  <text x="200.0" y="220" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a4a73">SqlLab.Run(BEGIN TRANSACTION … COMMIT)</text>
  <text x="200.0" y="235" text-anchor="middle" font-size="9.5" fill="#333">2 × UPDATE and 2 × INSERT in one transaction</text>
  <text x="200.0" y="280" text-anchor="middle" font-size="9" font-style="italic" fill="#555">no Console call in this step (the next one prints)</text>
  <rect x="570" y="202" width="300" height="88" rx="8" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
  <text x="720.0" y="228.0" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#333">Fill the basket, then pay once</text>
  <text x="720.0" y="242.0" text-anchor="middle" font-size="9.5" fill="#333">the four changes stay provisional until</text>
  <text x="720.0" y="256.0" text-anchor="middle" font-size="9.5" fill="#333">COMMIT TRANSACTION makes all four permanent</text>
  <text x="720.0" y="270.0" text-anchor="middle" font-size="9.5" fill="#333">at the same moment</text>
  <line x1="360" y1="224" x2="570" y2="224" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="465.0" y="217" text-anchor="middle" font-size="9" fill="#333">one batch: BEGIN … COMMIT</text>
  <line x1="570" y1="268" x2="360" y2="268" stroke="#333" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="465.0" y="283" text-anchor="middle" font-size="9" font-style="italic" fill="#555">done</text>
  <line x1="200" y1="290" x2="200" y2="316" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="40" y="316" width="320" height="64" rx="8" fill="#e8f4fb" stroke="#3d85c6" stroke-width="1.5"/>
  <text x="200.0" y="334" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a4a73">ShowBalances();  ShowLedger()</text>
  <text x="200.0" y="349" text-anchor="middle" font-size="9.5" fill="#333">look again: 300.00 / 200.00 and 3 ledger rows</text>
  <text x="200.0" y="370" text-anchor="middle" font-size="9" font-style="italic" fill="#555">Console.WriteLine intro; two grids printed</text>
  <rect x="570" y="316" width="300" height="64" rx="8" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
  <text x="720.0" y="337.0" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#333">The till and the receipt roll</text>
  <text x="720.0" y="351.0" text-anchor="middle" font-size="9.5" fill="#333">both balances moved; the ledger holds</text>
  <text x="720.0" y="365.0" text-anchor="middle" font-size="9.5" fill="#333">the Withdrawal and the Deposit</text>
  <line x1="360" y1="338" x2="570" y2="338" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="465.0" y="331" text-anchor="middle" font-size="9" fill="#333">SELECT …;  SELECT … JOIN …</text>
  <line x1="570" y1="358" x2="360" y2="358" stroke="#333" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="465.0" y="373" text-anchor="middle" font-size="9" font-style="italic" fill="#555">grids: balances, ledger</text>
  <line x1="200" y1="380" x2="200" y2="406" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="40" y="406" width="320" height="150" rx="8" fill="#e8f4fb" stroke="#3d85c6" stroke-width="1.5"/>
  <text x="200.0" y="424" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a4a73">SqlLab.Show(@Notes; BEGIN … IF … ROLLBACK)</text>
  <text x="200.0" y="439" text-anchor="middle" font-size="9.5" fill="#333">a 900.00 transfer: Asha only has 300.00</text>
  <text x="200.0" y="546" text-anchor="middle" font-size="9" font-style="italic" fill="#555">Console.WriteLine intro; Show prints the notebook (2 rows)</text>
  <rect x="570" y="406" width="300" height="150" rx="6" fill="#ffffff" stroke="#888888" stroke-width="1.2" stroke-dasharray="5 3"/>
  <text x="580" y="421" font-size="9.5" font-weight="bold" fill="#444">alt — IF balance after the debit &lt; 0</text>
  <rect x="578.0" y="432" width="137.0" height="116" rx="5" fill="#eaf6ea" stroke="#6aa84f" stroke-width="2"/>
  <text x="646.5" y="450" text-anchor="middle" font-size="9" font-weight="bold" fill="#274e13">yes (it is -600.00):</text>
  <text x="646.5" y="465" text-anchor="middle" font-size="9" fill="#274e13">ROLLBACK TRANSACTION</text>
  <text x="646.5" y="480" text-anchor="middle" font-size="9" fill="#274e13">basket tipped back</text>
  <text x="646.5" y="495" text-anchor="middle" font-size="9" font-weight="bold" fill="#274e13">taken in this run</text>
  <rect x="725.0" y="432" width="137.0" height="116" rx="5" fill="#ffffff" stroke="#bbbbbb" stroke-width="1"/>
  <text x="793.5" y="450" text-anchor="middle" font-size="9" font-weight="bold" fill="#555">no:</text>
  <text x="793.5" y="465" text-anchor="middle" font-size="9" fill="#555">COMMIT TRANSACTION</text>
  <text x="793.5" y="480" text-anchor="middle" font-size="9" fill="#555">keep the changes</text>
  <line x1="360" y1="428" x2="570" y2="428" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="465.0" y="421" text-anchor="middle" font-size="9" fill="#333">one batch with an IF</text>
  <line x1="570" y1="534" x2="360" y2="534" stroke="#333" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="465.0" y="549" text-anchor="middle" font-size="9" font-style="italic" fill="#555">grid: notebook, 2 rows</text>
  <line x1="200" y1="556" x2="200" y2="592" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="200" y="606" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#990000">END</text>
  <line x1="200" y1="614" x2="200" y2="654" stroke="#333" stroke-width="2"/>
  <polygon points="200,614 200,632 230,623" fill="#cc0000"/>
  <text x="30" y="676" font-size="10.5" fill="#444"><tspan font-weight="bold">All or nothing:</tspan> the COMMIT kept both balance changes AND both ledger rows; the ROLLBACK left Asha at 300.00 although she had been at -600.00 inside.</text>
  <text x="30" y="694" font-size="10" font-style="italic" fill="#888">Console.WriteLine prints the intro lines; SqlLab.Show prints the grids with Console.WriteLine as well. The IF is real T-SQL inside the batch, so only one outcome runs.</text>
  <text x="30" y="712" font-size="10" font-style="italic" fill="#888">Each method also opens with PrintHeading(): four more Console.WriteLine calls for the title banner (not drawn).</text>
</svg>
