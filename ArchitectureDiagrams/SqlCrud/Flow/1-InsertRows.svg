<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 706" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#333"/></marker>
  </defs>
  <rect x="0" y="0" width="900" height="706" fill="#ffffff"/>
  <text x="450.0" y="20" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a237e">INSERT — Sub-level Flow: a registration desk with a ticket machine</text>
  <text x="450.0" y="38" text-anchor="middle" font-size="11" fill="#666">Each INSERT hands a filled-in form to the desk; the ticket machine (IDENTITY) numbers the new row. The desk is SQL Server, outside .NET.</text>
  <text x="200" y="50" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#274e13">START</text>
  <line x1="200" y1="54" x2="200" y2="92" stroke="#333" stroke-width="2"/>
  <polygon points="200,54 200,72 230,63" fill="#38761d"/>
  <line x1="200" y1="92" x2="200" y2="110" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="550" y="82" width="340" height="446" rx="10" fill="#f1f1f1" stroke="#777777" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="720.0" y="100" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#444">the registration desk = SQL Server (outside .NET)</text>
  <rect x="40" y="112" width="320" height="76" rx="8" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1.5"/>
  <text x="200.0" y="130" text-anchor="middle" font-size="10" font-weight="bold" fill="#274e13">int oneRow = SqlLab.Run(INSERT one customer)</text>
  <text x="200.0" y="145" text-anchor="middle" font-size="9.5" fill="#333">column list (FullName, Email): Asha Rao</text>
  <text x="200.0" y="178" text-anchor="middle" font-size="9" font-style="italic" fill="#555">Console.WriteLine: "INSERT one row: 1 row affected"</text>
  <rect x="570" y="112" width="300" height="76" rx="8" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
  <text x="720.0" y="139.0" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#333">One form, one new row</text>
  <text x="720.0" y="153.0" text-anchor="middle" font-size="9.5" fill="#333">ticket machine stamps CustomerId 1;</text>
  <text x="720.0" y="167.0" text-anchor="middle" font-size="9.5" fill="#333">CreatedAt takes its DEFAULT</text>
  <line x1="360" y1="134" x2="570" y2="134" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="465.0" y="127" text-anchor="middle" font-size="9" fill="#333">INSERT … VALUES (1 row)</text>
  <line x1="570" y1="166" x2="360" y2="166" stroke="#333" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="465.0" y="181" text-anchor="middle" font-size="9" font-style="italic" fill="#555">rows affected: 1</text>
  <line x1="200" y1="188" x2="200" y2="214" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="40" y="214" width="320" height="76" rx="8" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1.5"/>
  <text x="200.0" y="232" text-anchor="middle" font-size="10" font-weight="bold" fill="#274e13">int twoRows = SqlLab.Run(INSERT two customers)</text>
  <text x="200.0" y="247" text-anchor="middle" font-size="9.5" fill="#333">one statement, two (…) lists: Ben and Chen</text>
  <text x="200.0" y="280" text-anchor="middle" font-size="9" font-style="italic" fill="#555">prints "2 rows affected", then Show lists all 3 customers</text>
  <rect x="570" y="214" width="300" height="76" rx="8" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
  <text x="720.0" y="241.0" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#333">Two forms at once</text>
  <text x="720.0" y="255.0" text-anchor="middle" font-size="9.5" fill="#333">stamped CustomerId 2 and 3; the whole</text>
  <text x="720.0" y="269.0" text-anchor="middle" font-size="9.5" fill="#333">statement succeeds or fails together</text>
  <line x1="360" y1="236" x2="570" y2="236" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="465.0" y="229" text-anchor="middle" font-size="9" fill="#333">INSERT … VALUES (…), (…)</text>
  <line x1="570" y1="268" x2="360" y2="268" stroke="#333" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="465.0" y="283" text-anchor="middle" font-size="9" font-style="italic" fill="#555">rows affected: 2</text>
  <line x1="200" y1="290" x2="200" y2="316" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="40" y="316" width="320" height="88" rx="8" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1.5"/>
  <text x="200.0" y="334" text-anchor="middle" font-size="10" font-weight="bold" fill="#274e13">SqlLab.Show(one batch: INSERT … SELECT)</text>
  <text x="200.0" y="349" text-anchor="middle" font-size="9.5" fill="#333">DECLARE @NewAccountId INT = SCOPE_IDENTITY();</text>
  <text x="200.0" y="394" text-anchor="middle" font-size="9" font-style="italic" fill="#555">Console.WriteLine: intro line, then Show prints the grid</text>
  <rect x="570" y="316" width="300" height="88" rx="8" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
  <text x="720.0" y="342.0" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#333">Asha's account is opened</text>
  <text x="720.0" y="356.0" text-anchor="middle" font-size="9.5" fill="#333">machine stamps AccountId 1; SCOPE_IDENTITY</text>
  <text x="720.0" y="370.0" text-anchor="middle" font-size="9.5" fill="#333">reads it back at once and it goes onto the</text>
  <text x="720.0" y="384.0" text-anchor="middle" font-size="9.5" fill="#333">deposit slip (a Transactions row)</text>
  <line x1="360" y1="338" x2="570" y2="338" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="465.0" y="331" text-anchor="middle" font-size="9" fill="#333">INSERT; INSERT; SELECT</text>
  <line x1="570" y1="382" x2="360" y2="382" stroke="#333" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="465.0" y="397" text-anchor="middle" font-size="9" font-style="italic" fill="#555">grid: NewAccountId = 1</text>
  <line x1="200" y1="404" x2="200" y2="430" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="40" y="430" width="320" height="76" rx="8" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1.5"/>
  <text x="200.0" y="448" text-anchor="middle" font-size="10" font-weight="bold" fill="#274e13">SqlLab.Show(INSERT … OUTPUT INSERTED …)</text>
  <text x="200.0" y="463" text-anchor="middle" font-size="9.5" fill="#333">two accounts at once, Balance = DEFAULT</text>
  <text x="200.0" y="496" text-anchor="middle" font-size="9" font-style="italic" fill="#555">Console.WriteLine: intro line, then Show prints the grid</text>
  <rect x="570" y="430" width="300" height="76" rx="8" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
  <text x="720.0" y="457.0" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#333">Two accounts opened together</text>
  <text x="720.0" y="471.0" text-anchor="middle" font-size="9.5" fill="#333">stamped AccountId 2 and 3; OUTPUT prints</text>
  <text x="720.0" y="485.0" text-anchor="middle" font-size="9.5" fill="#333">a receipt for each: id, number, balance 0.00</text>
  <line x1="360" y1="452" x2="570" y2="452" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="465.0" y="445" text-anchor="middle" font-size="9" fill="#333">INSERT … OUTPUT … (2 rows)</text>
  <line x1="570" y1="484" x2="360" y2="484" stroke="#333" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="465.0" y="499" text-anchor="middle" font-size="9" font-style="italic" fill="#555">grid: 2 receipts</text>
  <line x1="200" y1="506" x2="200" y2="542" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="200" y="556" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#990000">END</text>
  <line x1="200" y1="564" x2="200" y2="604" stroke="#333" stroke-width="2"/>
  <polygon points="200,564 200,582 230,573" fill="#cc0000"/>
  <text x="30" y="626" font-size="10.5" fill="#444"><tspan font-weight="bold">Four calls, one idea each:</tspan> a column list, several rows in one statement, SCOPE_IDENTITY for one new number, OUTPUT for many.</text>
  <text x="30" y="644" font-size="10" font-style="italic" fill="#888">Console.WriteLine prints the "rows affected" lines and the intro lines; SqlLab.Show prints every result grid with Console.WriteLine as well.</text>
  <text x="30" y="662" font-size="10" font-style="italic" fill="#888">Each method also opens with PrintHeading(): four more Console.WriteLine calls for the title banner (not drawn).</text>
</svg>
