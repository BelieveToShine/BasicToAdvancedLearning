<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 730" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#333"/></marker>
  </defs>
  <rect x="0" y="0" width="900" height="730" fill="#ffffff"/>
  <text x="450.0" y="20" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a237e">XACT_ABORT — Sub-level Flow: a train that arrives whole or goes back to the depot</text>
  <text x="450.0" y="38" text-anchor="middle" font-size="11" fill="#666">The same train (the same text) runs twice. With XACT_ABORT OFF the derailed carriage is dropped; with ON the whole train returns.</text>
  <text x="200" y="50" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#274e13">START</text>
  <line x1="200" y1="54" x2="200" y2="92" stroke="#333" stroke-width="2"/>
  <polygon points="200,54 200,72 230,63" fill="#38761d"/>
  <line x1="200" y1="92" x2="200" y2="110" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="550" y="82" width="340" height="470" rx="10" fill="#f1f1f1" stroke="#777777" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="720.0" y="100" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#444">the bank tables = SQL Server (outside .NET)</text>
  <rect x="40" y="112" width="320" height="76" rx="8" fill="#f0eaf7" stroke="#8e63ce" stroke-width="1.5"/>
  <text x="200.0" y="130" text-anchor="middle" font-size="10" font-weight="bold" fill="#4a2e73">string transfer = """BEGIN TRANSACTION; … """;</text>
  <text x="200.0" y="145" text-anchor="middle" font-size="9.5" fill="#333">the batch text: 4 steps, the 3rd has a typo (account 99)</text>
  <text x="200.0" y="178" text-anchor="middle" font-size="9" font-style="italic" fill="#555">nothing is sent yet; no Console call</text>
  <rect x="570" y="112" width="300" height="76" rx="8" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
  <text x="720.0" y="146.0" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#333">The timetable is written</text>
  <text x="720.0" y="160.0" text-anchor="middle" font-size="9.5" fill="#333">only text so far; nothing has run</text>
  <line x1="200" y1="188" x2="200" y2="214" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="40" y="214" width="320" height="100" rx="8" fill="#f0eaf7" stroke="#8e63ce" stroke-width="1.5"/>
  <text x="200.0" y="232" text-anchor="middle" font-size="10" font-weight="bold" fill="#4a2e73">SqlLab.ShowError("SET XACT_ABORT OFF;" + transfer)</text>
  <text x="200.0" y="247" text-anchor="middle" font-size="9.5" fill="#333">then ShowBalances() and ShowLedger()</text>
  <text x="200.0" y="304" text-anchor="middle" font-size="9" font-style="italic" fill="#555">prints the intro, the error line, then two grids</text>
  <rect x="570" y="214" width="300" height="100" rx="8" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
  <text x="720.0" y="246.0" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#333">XACT_ABORT OFF: the typo carriage derails;</text>
  <text x="720.0" y="260.0" text-anchor="middle" font-size="9.5" fill="#333">only that carriage is dropped, the train rolls</text>
  <text x="720.0" y="274.0" text-anchor="middle" font-size="9.5" fill="#333">on and COMMITs a half-done transfer:</text>
  <text x="720.0" y="288.0" text-anchor="middle" font-size="9.5" fill="#333">250.00 / 250.00, only the Withdrawal logged</text>
  <line x1="360" y1="236" x2="570" y2="236" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="465.0" y="229" text-anchor="middle" font-size="9" fill="#333">SET XACT_ABORT OFF; …</text>
  <line x1="570" y1="292" x2="360" y2="292" stroke="#333" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="465.0" y="307" text-anchor="middle" font-size="9" font-style="italic" fill="#555">error 547 (batch still ran on)</text>
  <line x1="200" y1="314" x2="200" y2="340" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="40" y="340" width="320" height="64" rx="8" fill="#f0eaf7" stroke="#8e63ce" stroke-width="1.5"/>
  <text x="200.0" y="358" text-anchor="middle" font-size="10" font-weight="bold" fill="#4a2e73">int repaired = SqlLab.Run(INSERT the missing row)</text>
  <text x="200.0" y="373" text-anchor="middle" font-size="9.5" fill="#333">a hand-made fix for the missing Deposit</text>
  <text x="200.0" y="394" text-anchor="middle" font-size="9" font-style="italic" fill="#555">prints "Repaired by hand: 1 ledger row added …"</text>
  <rect x="570" y="340" width="300" height="64" rx="8" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
  <text x="720.0" y="368.0" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#333">The repair crew</text>
  <text x="720.0" y="382.0" text-anchor="middle" font-size="9.5" fill="#333">adds the Deposit row that never arrived</text>
  <line x1="360" y1="362" x2="570" y2="362" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="465.0" y="355" text-anchor="middle" font-size="9" fill="#333">INSERT … Deposit 50</text>
  <line x1="570" y1="382" x2="360" y2="382" stroke="#333" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="465.0" y="397" text-anchor="middle" font-size="9" font-style="italic" fill="#555">rows affected: 1</text>
  <line x1="200" y1="404" x2="200" y2="430" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="40" y="430" width="320" height="100" rx="8" fill="#f0eaf7" stroke="#8e63ce" stroke-width="1.5"/>
  <text x="200.0" y="448" text-anchor="middle" font-size="10" font-weight="bold" fill="#4a2e73">SqlLab.ShowError("SET XACT_ABORT ON;" + transfer)</text>
  <text x="200.0" y="463" text-anchor="middle" font-size="9.5" fill="#333">then ShowBalances()</text>
  <text x="200.0" y="520" text-anchor="middle" font-size="9" font-style="italic" fill="#555">prints the intro, the error line, then the grid</text>
  <rect x="570" y="430" width="300" height="100" rx="8" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
  <text x="720.0" y="462.0" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#333">XACT_ABORT ON: the same derailment sends</text>
  <text x="720.0" y="476.0" text-anchor="middle" font-size="9.5" fill="#333">the WHOLE train back to the depot; the</text>
  <text x="720.0" y="490.0" text-anchor="middle" font-size="9.5" fill="#333">rollback is automatic, COMMIT is never reached;</text>
  <text x="720.0" y="504.0" text-anchor="middle" font-size="9.5" fill="#333">balances stay 250.00 / 250.00</text>
  <line x1="360" y1="452" x2="570" y2="452" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="465.0" y="445" text-anchor="middle" font-size="9" fill="#333">SET XACT_ABORT ON; …</text>
  <line x1="570" y1="508" x2="360" y2="508" stroke="#333" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="465.0" y="523" text-anchor="middle" font-size="9" font-style="italic" fill="#555">error 547</text>
  <line x1="200" y1="530" x2="200" y2="566" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="200" y="580" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#990000">END</text>
  <line x1="200" y1="588" x2="200" y2="628" stroke="#333" stroke-width="2"/>
  <polygon points="200,588 200,606 230,597" fill="#cc0000"/>
  <text x="30" y="650" font-size="10.5" fill="#444"><tspan font-weight="bold">One setting, two endings:</tspan> OFF keeps whatever succeeded (a half-done transfer to clean up by hand); ON undoes everything on the first run-time error.</text>
  <text x="30" y="668" font-size="10" font-style="italic" fill="#888">Console.WriteLine prints the intro lines and the "Repaired by hand" line; ShowError prints the error line and Show the grids, both with Console.WriteLine.</text>
  <text x="30" y="686" font-size="10" font-style="italic" fill="#888">Each method also opens with PrintHeading(): four more Console.WriteLine calls for the title banner (not drawn).</text>
</svg>
