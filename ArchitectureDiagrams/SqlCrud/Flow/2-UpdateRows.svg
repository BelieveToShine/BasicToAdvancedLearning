<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 784" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#333"/></marker>
  </defs>
  <rect x="0" y="0" width="900" height="784" fill="#ffffff"/>
  <text x="450.0" y="20" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a237e">UPDATE — Sub-level Flow: a highlighter pen (WHERE) and a pen that rewrites (SET)</text>
  <text x="450.0" y="38" text-anchor="middle" font-size="11" fill="#666">WHERE marks the rows, SET rewrites only the marked ones. Forget the highlighter and every row is rewritten — here on a photocopy.</text>
  <text x="200" y="50" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#274e13">START</text>
  <line x1="200" y1="54" x2="200" y2="92" stroke="#333" stroke-width="2"/>
  <polygon points="200,54 200,72 230,63" fill="#38761d"/>
  <line x1="200" y1="92" x2="200" y2="110" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="550" y="82" width="340" height="524" rx="10" fill="#f1f1f1" stroke="#777777" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="720.0" y="100" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#444">the bank pages = SQL Server (outside .NET)</text>
  <rect x="40" y="112" width="320" height="76" rx="8" fill="#fffbe8" stroke="#f1c232" stroke-width="1.5"/>
  <text x="200.0" y="130" text-anchor="middle" font-size="10" font-weight="bold" fill="#7f6000">int emailsChanged = SqlLab.Run(UPDATE … WHERE)</text>
  <text x="200.0" y="145" text-anchor="middle" font-size="9.5" fill="#333">SET Email = …  WHERE CustomerId = 1</text>
  <text x="200.0" y="178" text-anchor="middle" font-size="9" font-style="italic" fill="#555">prints "… 1 row affected", then Show prints row 1</text>
  <rect x="570" y="112" width="300" height="76" rx="8" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
  <text x="720.0" y="139.0" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#333">The highlighter marks one row</text>
  <text x="720.0" y="153.0" text-anchor="middle" font-size="9.5" fill="#333">WHERE CustomerId = 1 picks Asha;</text>
  <text x="720.0" y="167.0" text-anchor="middle" font-size="9.5" fill="#333">SET rewrites only her email</text>
  <line x1="360" y1="134" x2="570" y2="134" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="465.0" y="127" text-anchor="middle" font-size="9" fill="#333">UPDATE … WHERE CustomerId = 1</text>
  <line x1="570" y1="166" x2="360" y2="166" stroke="#333" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="465.0" y="181" text-anchor="middle" font-size="9" font-style="italic" fill="#555">rows affected: 1</text>
  <line x1="200" y1="188" x2="200" y2="214" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="40" y="214" width="320" height="76" rx="8" fill="#fffbe8" stroke="#f1c232" stroke-width="1.5"/>
  <text x="200.0" y="232" text-anchor="middle" font-size="10" font-weight="bold" fill="#7f6000">SqlLab.Show(UPDATE … 999; SELECT @@ROWCOUNT)</text>
  <text x="200.0" y="247" text-anchor="middle" font-size="9.5" fill="#333">a WHERE that matches no row</text>
  <text x="200.0" y="280" text-anchor="middle" font-size="9" font-style="italic" fill="#555">Console.WriteLine intro; Show prints RowsAffected = 0</text>
  <rect x="570" y="214" width="300" height="76" rx="8" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
  <text x="720.0" y="241.0" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#333">The pen finds nothing to mark</text>
  <text x="720.0" y="255.0" text-anchor="middle" font-size="9.5" fill="#333">so nothing is rewritten — and that is</text>
  <text x="720.0" y="269.0" text-anchor="middle" font-size="9.5" fill="#333">not an error: @@ROWCOUNT is 0</text>
  <line x1="360" y1="236" x2="570" y2="236" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="465.0" y="229" text-anchor="middle" font-size="9" fill="#333">UPDATE … 999; SELECT …</text>
  <line x1="570" y1="268" x2="360" y2="268" stroke="#333" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="465.0" y="283" text-anchor="middle" font-size="9" font-style="italic" fill="#555">grid: RowsAffected 0</text>
  <line x1="200" y1="290" x2="200" y2="316" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="40" y="316" width="320" height="76" rx="8" fill="#fffbe8" stroke="#f1c232" stroke-width="1.5"/>
  <text x="200.0" y="334" text-anchor="middle" font-size="10" font-weight="bold" fill="#7f6000">SqlLab.Run(SELECT … INTO AccountsScratch …)</text>
  <text x="200.0" y="349" text-anchor="middle" font-size="9.5" fill="#333">a throwaway copy of the accounts</text>
  <text x="200.0" y="382" text-anchor="middle" font-size="9" font-style="italic" fill="#555">Console.WriteLine intro; Show prints the 3 copied rows</text>
  <rect x="570" y="316" width="300" height="76" rx="8" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
  <text x="720.0" y="343.0" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#333">Photocopy the accounts page</text>
  <text x="720.0" y="357.0" text-anchor="middle" font-size="9.5" fill="#333">the copy (AccountsScratch) is the only</text>
  <text x="720.0" y="371.0" text-anchor="middle" font-size="9.5" fill="#333">page the pen touches, not the real one</text>
  <line x1="360" y1="338" x2="570" y2="338" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="465.0" y="331" text-anchor="middle" font-size="9" fill="#333">SELECT … INTO …</text>
  <line x1="570" y1="370" x2="360" y2="370" stroke="#333" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="465.0" y="385" text-anchor="middle" font-size="9" font-style="italic" fill="#555">copy made</text>
  <line x1="200" y1="392" x2="200" y2="418" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="40" y="418" width="320" height="76" rx="8" fill="#fffbe8" stroke="#f1c232" stroke-width="1.5"/>
  <text x="200.0" y="436" text-anchor="middle" font-size="10" font-weight="bold" fill="#7f6000">int everyRow = SqlLab.Run(UPDATE … no WHERE)</text>
  <text x="200.0" y="451" text-anchor="middle" font-size="9.5" fill="#333">SET Balance = Balance - 25;   (WHERE forgotten)</text>
  <text x="200.0" y="484" text-anchor="middle" font-size="9" font-style="italic" fill="#555">prints "… 3 rows affected (we meant 1)", then Show</text>
  <rect x="570" y="418" width="300" height="76" rx="8" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
  <text x="720.0" y="445.0" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#333">No highlighter used at all</text>
  <text x="720.0" y="459.0" text-anchor="middle" font-size="9.5" fill="#333">so EVERY row is rewritten:</text>
  <text x="720.0" y="473.0" text-anchor="middle" font-size="9.5" fill="#333">500.00 → 475.00, 0.00 → -25.00, 0.00 → -25.00</text>
  <line x1="360" y1="440" x2="570" y2="440" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="465.0" y="433" text-anchor="middle" font-size="9" fill="#333">UPDATE … (no WHERE)</text>
  <line x1="570" y1="472" x2="360" y2="472" stroke="#333" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="465.0" y="487" text-anchor="middle" font-size="9" font-style="italic" fill="#555">rows affected: 3  (we meant 1)</text>
  <line x1="200" y1="494" x2="200" y2="520" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="40" y="520" width="320" height="64" rx="8" fill="#fffbe8" stroke="#f1c232" stroke-width="1.5"/>
  <text x="200.0" y="538" text-anchor="middle" font-size="10" font-weight="bold" fill="#7f6000">SqlLab.Run(DROP TABLE AccountsScratch)</text>
  <text x="200.0" y="553" text-anchor="middle" font-size="9.5" fill="#333">tidy up the copy</text>
  <text x="200.0" y="574" text-anchor="middle" font-size="9" font-style="italic" fill="#555">no Console call in this step</text>
  <rect x="570" y="520" width="300" height="64" rx="8" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
  <text x="720.0" y="548.0" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#333">The photocopy is thrown away</text>
  <text x="720.0" y="562.0" text-anchor="middle" font-size="9.5" fill="#333">the real Accounts page was never changed</text>
  <line x1="360" y1="542" x2="570" y2="542" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="465.0" y="535" text-anchor="middle" font-size="9" fill="#333">DROP TABLE …</text>
  <line x1="570" y1="562" x2="360" y2="562" stroke="#333" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="465.0" y="577" text-anchor="middle" font-size="9" font-style="italic" fill="#555">done</text>
  <line x1="200" y1="584" x2="200" y2="620" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="200" y="634" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#990000">END</text>
  <line x1="200" y1="642" x2="200" y2="682" stroke="#333" stroke-width="2"/>
  <polygon points="200,642 200,660 230,651" fill="#cc0000"/>
  <text x="30" y="704" font-size="10.5" fill="#444"><tspan font-weight="bold">The highlighter is WHERE.</tspan> Without it UPDATE rewrites every row; the rows-affected number (3, expected 1) is how you notice.</text>
  <text x="30" y="722" font-size="10" font-style="italic" fill="#888">Console.WriteLine prints the "rows affected" lines; SqlLab.Show prints the grids. The first Show after SELECT … INTO lists the copy before the mistake.</text>
  <text x="30" y="740" font-size="10" font-style="italic" fill="#888">Each method also opens with PrintHeading(): four more Console.WriteLine calls for the title banner (not drawn).</text>
</svg>
