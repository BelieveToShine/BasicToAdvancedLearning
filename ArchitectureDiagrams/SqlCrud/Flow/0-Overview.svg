<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 892" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#333"/></marker>
  </defs>
  <rect x="0" y="0" width="1000" height="892" fill="#ffffff"/>
  <text x="500" y="24" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a237e">SQL CRUD — Functional Flow (high level: who calls whom, in what order)</text>
  <text x="500" y="44" text-anchor="middle" font-size="12" fill="#666">For the detail of any one method, zoom into its own Flow/&lt;N&gt;-&lt;Name&gt;.svg (named in each note below).</text>
  <g font-size="11" fill="#333"><line x1="380" y1="64" x2="416" y2="64" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/><text x="422" y="68">Call (→)</text><line x1="530" y1="64" x2="566" y2="64" stroke="#333" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a)"/><text x="572" y="68">Return (←)</text></g>
  <rect x="60" y="80" width="180" height="42" rx="8" fill="#eef2f7" stroke="#555" stroke-width="1.3"/>
  <text x="150" y="105" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">Program.cs (Main)</text>
  <rect x="400" y="80" width="220" height="42" rx="8" fill="#eef2f7" stroke="#555" stroke-width="1.3"/>
  <text x="510" y="97" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#222">SqlCrudExample</text>
  <text x="510" y="112" text-anchor="middle" font-size="9" fill="#666">(implements ILearningTopic)</text>
  <rect x="710" y="80" width="220" height="42" rx="8" fill="#eef2f7" stroke="#555" stroke-width="1.3"/>
  <text x="820" y="105" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">SqlCrudDemo</text>
  <line x1="150" y1="122" x2="150" y2="772" stroke="#999" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="510" y1="122" x2="510" y2="772" stroke="#999" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="820" y1="122" x2="820" y2="772" stroke="#999" stroke-width="1" stroke-dasharray="4 3"/>
  <rect x="146" y="140" width="8" height="628" rx="0" fill="#cfe2f3" stroke="#3d85c6" stroke-width="1"/>
  <rect x="506" y="160" width="8" height="584" rx="0" fill="#cfe2f3" stroke="#3d85c6" stroke-width="1"/>
  <text x="330" y="152" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#123">new SqlCrudExample();  topic.Explain()</text>
  <line x1="150" y1="160" x2="510" y2="160" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="330" y="176" text-anchor="middle" font-size="9" font-style="italic" fill="#555">then, before the first call: SqlLab.IsReady()</text>
  <text x="330" y="189" text-anchor="middle" font-size="9" font-style="italic" fill="#555">and SqlCrudSetup.CreateBankTables() (helpers)</text>
  <rect x="816" y="204" width="8" height="54" rx="0" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1"/>
  <text x="665" y="196" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#123">ExplainInsertRows()</text>
  <line x1="510" y1="204" x2="820" y2="204" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="665" y="221" text-anchor="middle" font-size="9.5" fill="#274e13">INSERT: column list, many rows, new ids</text>
  <text x="665" y="234" text-anchor="middle" font-size="9" fill="#555">Console.WriteLine · see Flow/1-InsertRows.svg</text>
  <text x="665" y="247" text-anchor="middle" font-size="9.5" fill="#555">returns</text>
  <line x1="820" y1="256" x2="510" y2="256" stroke="#333" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <rect x="816" y="296" width="8" height="54" rx="0" fill="#fffbe8" stroke="#f1c232" stroke-width="1"/>
  <text x="665" y="288" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#123">ExplainUpdateRows()</text>
  <line x1="510" y1="296" x2="820" y2="296" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="665" y="313" text-anchor="middle" font-size="9.5" fill="#7f6000">UPDATE: SET and WHERE; no WHERE hits all</text>
  <text x="665" y="326" text-anchor="middle" font-size="9" fill="#555">Console.WriteLine · see Flow/2-UpdateRows.svg</text>
  <text x="665" y="339" text-anchor="middle" font-size="9.5" fill="#555">returns</text>
  <line x1="820" y1="348" x2="510" y2="348" stroke="#333" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <rect x="816" y="388" width="8" height="54" rx="0" fill="#fdebd9" stroke="#e69138" stroke-width="1"/>
  <text x="665" y="380" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#123">ExplainDeleteRows()</text>
  <line x1="510" y1="388" x2="820" y2="388" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="665" y="405" text-anchor="middle" font-size="9.5" fill="#8a5a10">DELETE: children before parents (error 547)</text>
  <text x="665" y="418" text-anchor="middle" font-size="9" fill="#555">Console.WriteLine · see Flow/3-DeleteRows.svg</text>
  <text x="665" y="431" text-anchor="middle" font-size="9.5" fill="#555">returns</text>
  <line x1="820" y1="440" x2="510" y2="440" stroke="#333" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <rect x="816" y="480" width="8" height="54" rx="0" fill="#e8f4fb" stroke="#3d85c6" stroke-width="1"/>
  <text x="665" y="472" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#123">ExplainTransactions()</text>
  <line x1="510" y1="480" x2="820" y2="480" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="665" y="497" text-anchor="middle" font-size="9.5" fill="#1a4a73">COMMIT keeps it all; ROLLBACK undoes it all</text>
  <text x="665" y="510" text-anchor="middle" font-size="9" fill="#555">Console.WriteLine · see Flow/4-Transactions.svg</text>
  <text x="665" y="523" text-anchor="middle" font-size="9.5" fill="#555">returns</text>
  <line x1="820" y1="532" x2="510" y2="532" stroke="#333" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <rect x="816" y="572" width="8" height="54" rx="0" fill="#f0eaf7" stroke="#8e63ce" stroke-width="1"/>
  <text x="665" y="564" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#123">ExplainXactAbort()</text>
  <line x1="510" y1="572" x2="820" y2="572" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="665" y="589" text-anchor="middle" font-size="9.5" fill="#4a2e73">SET XACT_ABORT: one error undoes the lot</text>
  <text x="665" y="602" text-anchor="middle" font-size="9" fill="#555">Console.WriteLine · see Flow/5-XactAbort.svg</text>
  <text x="665" y="615" text-anchor="middle" font-size="9.5" fill="#555">returns</text>
  <line x1="820" y1="624" x2="510" y2="624" stroke="#333" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <rect x="816" y="664" width="8" height="54" rx="0" fill="#e8f4fb" stroke="#3d85c6" stroke-width="1"/>
  <text x="665" y="656" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#123">ExplainSafeHabits()</text>
  <line x1="510" y1="664" x2="820" y2="664" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="665" y="681" text-anchor="middle" font-size="9.5" fill="#1a4a73">Preview with SELECT, guard with @@ROWCOUNT</text>
  <text x="665" y="694" text-anchor="middle" font-size="9" fill="#555">Console.WriteLine · see Flow/6-SafeHabits.svg</text>
  <text x="665" y="707" text-anchor="middle" font-size="9.5" fill="#555">returns</text>
  <line x1="820" y1="716" x2="510" y2="716" stroke="#333" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="330" y="734" text-anchor="middle" font-size="10" fill="#555">Explain() returns — program ends</text>
  <line x1="510" y1="740" x2="150" y2="740" stroke="#333" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <circle cx="150" cy="760" r="6" fill="#cc0000"/>
  <text x="164" y="764" font-size="10.5" font-weight="bold" fill="#990000">End</text>
  <text x="40" y="812" font-size="10.5" fill="#444"><tspan font-weight="bold">Where to where, in one line:</tspan> Program.cs calls Explain() once; SqlCrudExample checks the server, rebuilds the empty tables, then calls all six SqlCrudDemo methods in turn.</text>
  <text x="40" y="832" font-size="10" font-style="italic" fill="#888">Each Demo method sends SQL text through SqlLab (Run or Show), which is SQL Server's side of the story, so SqlLab and SQL Server get no lifeline here — see each method's own Flow diagram.</text>
</svg>
