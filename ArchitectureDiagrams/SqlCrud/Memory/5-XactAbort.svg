  <text x="560" y="613.5" font-size="9" fill="#222">—</text>
  <text x="627" y="613.5" font-size="9" fill="#222">—</text>
  <text x="676" y="613.5" font-size="9" fill="#222">ON run: error 547, everything rolled back</text>
