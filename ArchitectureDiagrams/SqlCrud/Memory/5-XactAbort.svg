  <rect x="464" y="632" width="11" height="11" fill="#d9f0d0" stroke="#999" stroke-width="0.8"/><text x="480" y="641" font-size="9" fill="#555">new row / value</text>
  <rect x="584" y="632" width="11" height="11" fill="#fde9b8" stroke="#999" stroke-width="0.8"/><text x="600" y="641" font-size="9" fill="#555">changed</text>
  <rect x="704" y="632" width="11" height="11" fill="#f8d7d3" stroke="#999" stroke-width="0.8"/><text x="720" y="641" font-size="9" fill="#555">deleted</text>
  <polyline points="378,159 438,159 438,140 458,140" fill="none" stroke="#555" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="1150" y="118" width="90" height="130" rx="10" fill="#d5c9ea" stroke="#674ea7" stroke-width="1.5" stroke-dasharray="6 4" fill-opacity="0.25"/>
  <text x="1195" y="150" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#3d2a6b">Nothing</text>
  <text x="1195" y="166" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#3d2a6b">here yet</text>
  <text x="40" y="674" font-size="10.5" fill="#444"><tspan font-weight="bold">OFF: only the bad statement was cancelled, so the transfer was half done — Asha's withdrawal saved, Ben's deposit row missing. </tspan>ON: the same error rolled back the whole transaction, so nothing changed.</text>
  <text x="40" y="692" font-size="10" font-style="italic" fill="#888">The same string in `transfer` was sent both times; only the line SET XACT_ABORT OFF / ON in front of it differed. Balances 300/200 before; 250/250 after the OFF run and still 250/250 after the ON run.</text>
</svg>
