  <rect x="50" y="282" width="340" height="50" rx="8" fill="#dcecdc" stroke="#6aa84f" stroke-width="1.5"/>
  <text x="220" y="302" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#4c6b4c">Program.cs (Main)</text>
  <text x="220" y="318" text-anchor="middle" font-size="9.5" fill="#6b8a6b">paused — waiting for topic.Explain() to return</text>
  <rect x="460" y="118" width="420" height="216" rx="10" fill="#f9cb9c" stroke="#e69138" stroke-width="1.5"/>
  <text x="670.0" y="140" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7f4e00">string — transfer  (the T-SQL batch, shortened)</text>
  <rect x="472" y="150" width="396" height="26" rx="4" fill="#fff3e6" stroke="#e69138" stroke-width="1"/>
  <text x="480" y="167" font-size="10" fill="#7f4e00">BEGIN TRANSACTION;</text>
  <rect x="472" y="180" width="396" height="26" rx="4" fill="#fff3e6" stroke="#e69138" stroke-width="1"/>
  <text x="480" y="197" font-size="10" fill="#7f4e00">UPDATE Accounts … Balance - 50 … SAV-1001;</text>
  <rect x="472" y="210" width="396" height="26" rx="4" fill="#fff3e6" stroke="#e69138" stroke-width="1"/>
  <text x="480" y="227" font-size="10" fill="#7f4e00">INSERT ledger: Withdrawal 50 for SAV-1001;</text>
  <rect x="472" y="240" width="396" height="26" rx="4" fill="#fff3e6" stroke="#e69138" stroke-width="1"/>
  <text x="480" y="257" font-size="10" fill="#7f4e00">INSERT ledger: Deposit 50 for AccountId 99;  ← typo</text>
  <rect x="472" y="270" width="396" height="26" rx="4" fill="#fff3e6" stroke="#e69138" stroke-width="1"/>
  <text x="480" y="287" font-size="10" fill="#7f4e00">UPDATE Accounts … Balance + 50 … CUR-2001;</text>
  <rect x="472" y="300" width="396" height="26" rx="4" fill="#fff3e6" stroke="#e69138" stroke-width="1"/>
  <text x="480" y="317" font-size="10" fill="#7f4e00">COMMIT TRANSACTION;</text>
  <rect x="450" y="356" width="680" height="294" rx="10" fill="#f1f1f1" stroke="#777777" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="790.0" y="376" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#444">OUTSIDE .NET — SQL Server: table rows</text>
  <text x="790.0" y="391" text-anchor="middle" font-size="9" font-style="italic" fill="#666">These rows live in the database server, not in the program's memory. C# only sends text and gets a number back.</text>
  <text x="464" y="410" font-size="10" font-weight="bold" fill="#1a237e">Accounts.Balance and the ledger after each run</text>
  <rect x="464" y="418" width="357" height="92" rx="6" fill="#ffffff" stroke="#999999" stroke-width="1"/>
  <text x="471" y="432" font-size="9.5" font-weight="bold" fill="#333">Accounts</text>
  <rect x="465" y="440" width="355" height="16" fill="#ececec"/>
  <text x="471" y="451.5" font-size="9" font-weight="bold" fill="#444">AccountNumber</text>
