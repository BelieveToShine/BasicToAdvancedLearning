  <text x="721" y="467.5" font-size="9" fill="#222">250.00</text>
  <text x="471" y="483.5" font-size="9" fill="#222">CUR-2001</text>
  <text x="560" y="483.5" font-size="9" fill="#222">200.00</text>
  <rect x="603" y="472" width="111" height="16" fill="#fde9b8"/>
  <text x="609" y="483.5" font-size="9" font-weight="bold" fill="#222">250.00</text>
  <text x="721" y="483.5" font-size="9" fill="#222">250.00</text>
  <text x="471" y="499.5" font-size="9" fill="#222">SAV-3001</text>
  <text x="560" y="499.5" font-size="9" fill="#222">0.00</text>
  <text x="609" y="499.5" font-size="9" fill="#222">0.00</text>
  <text x="721" y="499.5" font-size="9" fill="#222">0.00</text>
  <line x1="464" y1="456" x2="821" y2="456" stroke="#bbb" stroke-width="1"/>
  <rect x="464" y="516" width="434" height="108" rx="6" fill="#ffffff" stroke="#999999" stroke-width="1"/>
  <text x="471" y="530" font-size="9.5" font-weight="bold" fill="#333">Ledger rows for the 50.00 transfers</text>
  <rect x="465" y="538" width="432" height="16" fill="#ececec"/>
  <text x="471" y="549.5" font-size="9" font-weight="bold" fill="#444">AccountNumber</text>
  <text x="560" y="549.5" font-size="9" font-weight="bold" fill="#444">Kind</text>
  <text x="627" y="549.5" font-size="9" font-weight="bold" fill="#444">Amount</text>
  <text x="676" y="549.5" font-size="9" font-weight="bold" fill="#444">what happened</text>
  <rect x="465" y="554" width="432" height="16" fill="#d9f0d0"/>
  <text x="471" y="565.5" font-size="9" fill="#222">SAV-1001</text>
  <text x="560" y="565.5" font-size="9" fill="#222">Withdrawal</text>
  <text x="627" y="565.5" font-size="9" fill="#222">50.00</text>
  <text x="676" y="565.5" font-size="9" fill="#222">OFF run: saved</text>
  <rect x="465" y="570" width="432" height="16" fill="#f4c2bc"/>
  <text x="471" y="581.5" font-size="9" text-decoration="line-through" fill="#000">CUR-2001</text>
  <text x="560" y="581.5" font-size="9" text-decoration="line-through" fill="#000">Deposit</text>
  <text x="627" y="581.5" font-size="9" text-decoration="line-through" fill="#000">50.00</text>
  <text x="676" y="581.5" font-size="9" text-decoration="line-through" fill="#000">OFF run: typo, rejected (error 547)</text>
