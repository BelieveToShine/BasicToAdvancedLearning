  <text x="40" y="614" font-size="10.5" fill="#444"><tspan font-weight="bold">C# sends text; SQL Server changes rows.</tspan> The ints on the Stack are only the "rows affected" numbers SqlLab.Run returned.</text>
  <text x="40" y="634" font-size="10" font-style="italic" fill="#888">The dashed grey box is the same recorded addition to the locked 3-column shape that Topic 8 uses for the disk. Customer 4, account 4 and their ledger row existed only inside method 3.</text>
</svg>
