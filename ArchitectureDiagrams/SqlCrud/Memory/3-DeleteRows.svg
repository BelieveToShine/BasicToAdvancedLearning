  <text x="760.0" y="140" text-anchor="middle" font-size="10" font-weight="bold" fill="#7f4e00">No Heap usage here — ledgerRows, accountRows and customerRows are ints (Stack).</text>
  <text x="760.0" y="158" text-anchor="middle" font-size="9" font-style="italic" fill="#a06a1f">Each holds a "rows deleted" count from SqlLab.Run.</text>
