  <text x="40" y="550" font-size="10.5" fill="#444"><tspan font-weight="bold">One row deleted per table, in the order SQL Server allows (children before parents): Transactions, then Accounts, then Customers. </tspan>The two attempts in the wrong order failed with error 547 and deleted nothing.</text>
