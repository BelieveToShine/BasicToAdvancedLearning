  <text x="760.0" y="140" text-anchor="middle" font-size="10" font-weight="bold" fill="#7f4e00">No Heap usage here — oneRow and twoRows are ints, entirely on the Stack.</text>
  <text x="760.0" y="158" text-anchor="middle" font-size="9" font-style="italic" fill="#a06a1f">The SQL text goes straight into SqlLab.Run / Show; no local points at it.</text>
