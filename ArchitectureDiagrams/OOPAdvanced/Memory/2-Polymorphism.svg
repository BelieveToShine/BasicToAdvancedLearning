  <text x="40" y="526" font-size="10.5" fill="#444"><tspan font-weight="bold">One variable type (Account), three different objects on the Heap. </tspan>accounts[0] is really a SavingsAccount and accounts[1] a CurrentAccount — the array only stores pointers, so it can mix them.</text>
  <text x="40" y="544" font-size="10" font-style="italic" fill="#888">account.MonthlyFee() follows the pointer to the real object, not the variable's type — that is polymorphism. Here account points at Meena's plain Account, so the base version runs (5).</text>
