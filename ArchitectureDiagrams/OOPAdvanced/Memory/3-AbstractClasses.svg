  <text x="40" y="508" font-size="10.5" fill="#444"><tspan font-weight="bold">Transaction itself never appears on the Heap — only its concrete children do. </tspan>batch is an array of pointers typed Transaction, each pointing at a Deposit- or WithdrawalTransaction object.</text>
