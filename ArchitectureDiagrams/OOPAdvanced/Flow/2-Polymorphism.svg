<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 710" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#333"/></marker>
  </defs>
  <rect x="0" y="0" width="900" height="710" fill="#ffffff"/>
  <text x="450.0" y="20" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a237e">Polymorphism — Sub-level Flow: one remote, three devices</text>
  <text x="450.0" y="38" text-anchor="middle" font-size="11" fill="#666">The loop presses the same button on every account; each real object answers in its own way.</text>
  <text x="140" y="60" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#274e13">START</text>
  <line x1="140" y1="64" x2="140" y2="102" stroke="#333" stroke-width="2"/>
  <polygon points="140,64 140,82 170,73" fill="#38761d"/>
  <line x1="140" y1="102" x2="140" y2="160" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="40" y="160" width="200" height="80" rx="8" fill="#e8f4fb" stroke="#3d85c6" stroke-width="1.5"/>
  <text x="140" y="182" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a4a73">foreach (Account account</text>
  <text x="140" y="197" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a4a73">in accounts)</text>
  <text x="140" y="220" text-anchor="middle" font-size="9.5" fill="#333">press: account.MonthlyFee()</text>
  <line x1="240" y1="200" x2="300" y2="200" stroke="#333" stroke-width="1.6"/>
  <line x1="300" y1="140" x2="300" y2="380" stroke="#333" stroke-width="1.6"/>
  <line x1="300" y1="140" x2="380" y2="140" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="380" y="100" width="240" height="80" rx="8" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1.5"/>
  <text x="500" y="130" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#274e13">accounts[0] → SavingsAccount</text>
  <text x="500" y="152" text-anchor="middle" font-size="9.5" fill="#333">override: no fee → returns 0</text>
  <line x1="300" y1="260" x2="380" y2="260" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="380" y="220" width="240" height="80" rx="8" fill="#fdebd9" stroke="#e69138" stroke-width="1.5"/>
  <text x="500" y="250" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#8a5a10">accounts[1] → CurrentAccount</text>
  <text x="500" y="272" text-anchor="middle" font-size="9.5" fill="#333">override: returns 10</text>
  <line x1="300" y1="380" x2="380" y2="380" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="380" y="340" width="240" height="80" rx="8" fill="#fffbe8" stroke="#f1c232" stroke-width="1.5"/>
  <text x="500" y="370" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7f6000">accounts[2] → Account</text>
  <text x="500" y="392" text-anchor="middle" font-size="9.5" fill="#333">no override: base version returns 5</text>
  <polyline points="620,140 660,140 660,490 622,490" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <polyline points="620,260 660,260 660,490" fill="none" stroke="#333" stroke-width="1.6"/>
  <polyline points="620,380 660,380 660,490" fill="none" stroke="#333" stroke-width="1.6"/>
  <rect x="380" y="460" width="240" height="60" rx="8" fill="#f0eaf7" stroke="#8e63ce" stroke-width="1.5"/>
  <text x="500" y="484" text-anchor="middle" font-size="10" font-weight="bold" fill="#4a2e73">totalFees += account.MonthlyFee()</text>
  <text x="500" y="502" text-anchor="middle" font-size="10" fill="#333">0 + 10 + 5 = 15</text>
  <line x1="500" y1="520" x2="500" y2="560" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="500" y="574" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#990000">END</text>
  <line x1="500" y1="582" x2="500" y2="622" stroke="#333" stroke-width="2"/>
  <polygon points="500,582 500,600 530,591" fill="#cc0000"/>
  <text x="30" y="650" font-size="10.5" fill="#444"><tspan font-weight="bold">One button, three answers:</tspan> account.MonthlyFee() picks the version belonging to the real object, not to the variable type.</text>
  <text x="30" y="668" font-size="10" font-style="italic" fill="#888">Console.WriteLine prints each Describe() with its fee, then the total — four lines. `virtual` allows the replacement, `override` provides it.</text>
  <text x="30" y="686" font-size="10" font-style="italic" fill="#888">Each method also opens with PrintHeading(): four more Console.WriteLine calls for the title banner (not drawn).</text>
</svg>
