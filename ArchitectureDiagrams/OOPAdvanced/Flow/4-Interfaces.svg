<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 740" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#333"/></marker>
  </defs>
  <rect x="0" y="0" width="900" height="740" fill="#ffffff"/>
  <text x="450.0" y="20" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a237e">Interfaces — Sub-level Flow: a wall socket and its plugs</text>
  <text x="450.0" y="38" text-anchor="middle" font-size="11" fill="#666">The interface is the socket shape. Any class with a matching plug fits — even classes from different families.</text>
  <text x="450" y="58" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#274e13">START</text>
  <line x1="450" y1="62" x2="450" y2="100" stroke="#333" stroke-width="2"/>
  <polygon points="450,62 450,80 480,71" fill="#38761d"/>
  <line x1="450" y1="100" x2="450" y2="106" stroke="#333" stroke-width="1.6"/>
  <polyline points="450,106 250,106 250,128" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <polyline points="450,106 650,106 650,128" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="100" y="130" width="300" height="84" rx="8" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1.5"/>
  <text x="250" y="152" text-anchor="middle" font-size="10" font-weight="bold" fill="#274e13">SavingsAccount : Account, IInterestBearing</text>
  <text x="250" y="172" text-anchor="middle" font-size="9.5" fill="#333">also an Account — inherits its public members</text>
  <text x="250" y="190" text-anchor="middle" font-size="9.5" fill="#555">new SavingsAccount("Anita", 1000m, 6m)</text>
  <rect x="500" y="130" width="300" height="84" rx="8" fill="#fdebd9" stroke="#e69138" stroke-width="1.5"/>
  <text x="650" y="152" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#8a5a10">FixedDeposit : IInterestBearing</text>
  <text x="650" y="172" text-anchor="middle" font-size="9.5" fill="#333">NOT an Account — only its own fields</text>
  <text x="650" y="190" text-anchor="middle" font-size="9.5" fill="#555">new FixedDeposit(6000m, 8m)</text>
  <line x1="250" y1="214" x2="250" y2="276" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="650" y1="214" x2="650" y2="276" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="242" y="250" text-anchor="end" font-size="10" fill="#555">plugs in</text>
  <text x="658" y="250" font-size="10" fill="#555">plugs in</text>
  <rect x="250" y="278" width="400" height="76" rx="8" fill="#f0eaf7" stroke="#8e63ce" stroke-width="2"/>
  <text x="450" y="302" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#4a2e73">interface IInterestBearing — the socket</text>
  <text x="450" y="322" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#333">decimal MonthlyInterest();</text>
  <text x="450" y="340" text-anchor="middle" font-size="9.5" font-style="italic" fill="#555">classic interface: no fields, no code (C# 8+ allows defaults)</text>
  <line x1="450" y1="354" x2="450" y2="400" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="250" y="402" width="400" height="62" rx="8" fill="#e8f4fb" stroke="#3d85c6" stroke-width="1.5"/>
  <text x="450" y="424" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a4a73">foreach (IInterestBearing earner in earners)</text>
  <text x="450" y="444" text-anchor="middle" font-size="9.5" fill="#333">earner.MonthlyInterest()  — works for either plug</text>
  <line x1="350" y1="464" x2="350" y2="504" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="550" y1="464" x2="550" y2="504" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="240" y="506" width="220" height="50" rx="8" fill="#fffbe8" stroke="#f1c232" stroke-width="1.5"/>
  <text x="350" y="528" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7f6000">SavingsAccount earns 5</text>
  <text x="350" y="544" text-anchor="middle" font-size="9" fill="#555">1000 × 6% ÷ 12</text>
  <rect x="540" y="506" width="220" height="50" rx="8" fill="#fffbe8" stroke="#f1c232" stroke-width="1.5"/>
  <text x="650" y="528" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7f6000">FixedDeposit earns 40</text>
  <text x="650" y="544" text-anchor="middle" font-size="9" fill="#555">6000 × 8% ÷ 12</text>
  <polyline points="350,556 350,580 450,580" fill="none" stroke="#333" stroke-width="1.6"/>
  <polyline points="650,556 650,580 450,580" fill="none" stroke="#333" stroke-width="1.6"/>
  <line x1="450" y1="580" x2="450" y2="598" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="450" y="612" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#990000">END</text>
  <line x1="450" y1="620" x2="450" y2="660" stroke="#333" stroke-width="2"/>
  <polygon points="450,620 450,638 480,629" fill="#cc0000"/>
  <text x="30" y="690" font-size="10.5" fill="#444"><tspan font-weight="bold">One socket, two unrelated plugs:</tspan> the loop only knows IInterestBearing, so adding a third kind later changes nothing here.</text>
  <text x="30" y="708" font-size="10" font-style="italic" fill="#888">Console.WriteLine prints one line per earner plus the total (45) — three lines. A class inherits one parent but may sign many interfaces.</text>
  <text x="30" y="726" font-size="10" font-style="italic" fill="#888">Each method also opens with PrintHeading(): four more Console.WriteLine calls for the title banner (not drawn).</text>
</svg>
