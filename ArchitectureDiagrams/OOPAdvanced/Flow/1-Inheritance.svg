<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#333"/></marker>
  </defs>
  <rect x="0" y="0" width="900" height="640" fill="#ffffff"/>
  <text x="450.0" y="20" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a237e">Inheritance — Sub-level Flow: a family tree</text>
  <text x="450.0" y="38" text-anchor="middle" font-size="11" fill="#666">A child inherits everything its parent has, then adds its own extras. `: base(...)` builds the parent part first.</text>
  <text x="450" y="58" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#274e13">START</text>
  <line x1="450" y1="62" x2="450" y2="100" stroke="#333" stroke-width="2"/>
  <polygon points="450,62 450,80 480,71" fill="#38761d"/>
  <line x1="450" y1="100" x2="450" y2="118" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="225" y="120" width="450" height="84" rx="8" fill="#e8f4fb" stroke="#3d85c6" stroke-width="1.5"/>
  <text x="450" y="142" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a4a73">Account — the parent (base class)</text>
  <text x="450" y="162" text-anchor="middle" font-size="10" fill="#333">fields: _ownerName, _balance (protected)</text>
  <text x="450" y="180" text-anchor="middle" font-size="10" fill="#333">methods: Deposit(), Withdraw(), MonthlyFee(), Describe()</text>
  <line x1="290" y1="204" x2="290" y2="256" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="610" y1="204" x2="610" y2="256" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="282" y="236" text-anchor="end" font-size="10" fill="#555">inherits  : Account</text>
  <text x="618" y="236" font-size="10" fill="#555">inherits  : Account</text>
  <rect x="140" y="258" width="300" height="96" rx="8" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1.5"/>
  <text x="290" y="280" text-anchor="middle" font-size="11" font-weight="bold" fill="#274e13">SavingsAccount : Account</text>
  <text x="290" y="300" text-anchor="middle" font-size="9.5" fill="#333">gets for free: Owner, Balance, Deposit()</text>
  <text x="290" y="318" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#274e13">adds its own: _interestRatePercent</text>
  <text x="290" y="336" text-anchor="middle" font-size="9.5" fill="#555">asks Account to build its part: : base(...)</text>
  <rect x="460" y="258" width="300" height="96" rx="8" fill="#fdebd9" stroke="#e69138" stroke-width="1.5"/>
  <text x="610" y="280" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a5a10">CurrentAccount : Account</text>
  <text x="610" y="300" text-anchor="middle" font-size="9.5" fill="#333">gets for free: Owner, Balance, Deposit()</text>
  <text x="610" y="318" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#8a5a10">adds its own: _overdraftLimit</text>
  <text x="610" y="336" text-anchor="middle" font-size="9.5" fill="#555">asks Account to build its part: : base(...)</text>
  <line x1="290" y1="354" x2="290" y2="404" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="610" y1="354" x2="610" y2="404" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="140" y="406" width="300" height="62" rx="8" fill="#fffbe8" stroke="#f1c232" stroke-width="1.5"/>
  <text x="290" y="428" text-anchor="middle" font-size="10" font-weight="bold" fill="#7f6000">new SavingsAccount("Anita", 1000m, 6m)</text>
  <text x="290" y="446" text-anchor="middle" font-size="9.5" fill="#333">→ savings.Deposit(500m): balance 1500</text>
  <rect x="460" y="406" width="300" height="62" rx="8" fill="#fffbe8" stroke="#f1c232" stroke-width="1.5"/>
  <text x="610" y="428" text-anchor="middle" font-size="10" font-weight="bold" fill="#7f6000">new CurrentAccount("Ravi", 300m, 200m)</text>
  <text x="610" y="446" text-anchor="middle" font-size="9.5" fill="#333">→ current: overdraft limit 200</text>
  <polyline points="290,468 290,494 450,494" fill="none" stroke="#333" stroke-width="1.6"/>
  <polyline points="610,468 610,494 450,494" fill="none" stroke="#333" stroke-width="1.6"/>
  <line x1="450" y1="494" x2="450" y2="512" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="450" y="526" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#990000">END</text>
  <line x1="450" y1="534" x2="450" y2="574" stroke="#333" stroke-width="2"/>
  <polygon points="450,534 450,552 480,543" fill="#cc0000"/>
  <text x="30" y="600" font-size="10.5" fill="#444"><tspan font-weight="bold">Write it once, reuse it twice:</tspan> Owner, Balance and Deposit() live only in Account, yet both children have them.</text>
  <text x="30" y="618" font-size="10" font-style="italic" fill="#888">Console.WriteLine prints the inherited balance, the added interest rate and the added overdraft limit — three lines. A child can have only ONE parent class.</text>
</svg>
