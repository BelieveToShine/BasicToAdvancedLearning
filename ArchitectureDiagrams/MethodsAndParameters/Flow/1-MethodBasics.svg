<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2c3e50"/></marker>
    <marker id="d" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#888"/></marker>
  </defs>
  <rect x="0" y="0" width="900" height="450" fill="#ffffff"/>
  <text x="450" y="24" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a237e">Method Basics — Sub-level Flow</text>
  <text x="450" y="42" text-anchor="middle" font-size="11.5" fill="#666">ExplainMethodBasics() travels this road, taking one off-ramp per call it makes.</text>

  <!-- Start flag -->
  <line x1="70" y1="150" x2="70" y2="205" stroke="#333" stroke-width="2"/>
  <polygon points="70,150 70,168 100,159" fill="#38761d"/>
  <text x="70" y="140" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#274e13">START</text>

  <!-- Road -->
  <line x1="70" y1="206" x2="830" y2="206" stroke="#2c3e50" stroke-width="10" stroke-linecap="round"/>
  <line x1="75" y1="206" x2="825" y2="206" stroke="#ecf0f1" stroke-width="2" stroke-dasharray="14 10"/>

  <!-- Call 1: AddNumbers -->
  <text x="250" y="188" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#333">call: AddNumbers(5, 3)</text>
  <line x1="250" y1="211" x2="250" y2="298" stroke="#2c3e50" stroke-width="2" marker-end="url(#a)"/>
  <rect x="150" y="300" width="200" height="58" rx="10" fill="#fffbe8" stroke="#f1c232" stroke-width="1.5"/>
  <text x="250" y="323" text-anchor="middle" font-size="10" font-weight="bold" fill="#7f6000">AddNumbers(a, b)</text>
  <text x="250" y="341" text-anchor="middle" font-size="9.5" fill="#7f6000">a=5, b=3 → return a + b</text>
  <path d="M250,358 L250,388 L330,388 L330,211" fill="none" stroke="#888" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#d)"/>
  <text x="290" y="378" text-anchor="middle" font-size="9.5" fill="#555">returns 8</text>

  <!-- Call 2: Greet -->
  <text x="550" y="188" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#333">call: Greet("Vivek")</text>
  <line x1="550" y1="211" x2="550" y2="298" stroke="#2c3e50" stroke-width="2" marker-end="url(#a)"/>
  <rect x="450" y="300" width="200" height="58" rx="10" fill="#fffbe8" stroke="#f1c232" stroke-width="1.5"/>
  <text x="550" y="323" text-anchor="middle" font-size="10" font-weight="bold" fill="#7f6000">Greet(name)</text>
  <text x="550" y="341" text-anchor="middle" font-size="9.5" fill="#7f6000">prints "Hello, Vivek!" inside</text>
  <path d="M550,358 L550,388 L630,388 L630,211" fill="none" stroke="#888" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#d)"/>
  <text x="590" y="378" text-anchor="middle" font-size="9.5" fill="#555">returns (void)</text>

  <!-- End flag -->
  <line x1="830" y1="150" x2="830" y2="205" stroke="#333" stroke-width="2"/>
  <polygon points="830,150 830,168 860,159" fill="#cc0000"/>
  <text x="830" y="140" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#990000">END</text>

  <text x="30" y="420" font-size="10.5" fill="#444"><tspan font-weight="bold">Every off-ramp always lands back on the road</tspan> — a method call never leaves the caller behind. AddNumbers hands back a value; Greet hands back nothing but control still returns.</text>
</svg>
