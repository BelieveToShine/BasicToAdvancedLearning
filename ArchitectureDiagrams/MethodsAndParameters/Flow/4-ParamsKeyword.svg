<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2c3e50"/></marker>
    <marker id="d" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#888"/></marker>
  </defs>
  <rect x="0" y="0" width="1000" height="450" fill="#ffffff"/>
  <text x="500" y="24" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a237e">The params Keyword — Sub-level Flow</text>
  <text x="500" y="42" text-anchor="middle" font-size="11.5" fill="#666">Same off-ramp, same method — the bubble's own "cargo" (the array size) changes each trip.</text>

  <line x1="70" y1="150" x2="70" y2="205" stroke="#333" stroke-width="2"/>
  <polygon points="70,150 70,168 100,159" fill="#38761d"/>
  <text x="70" y="140" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#274e13">START</text>

  <line x1="70" y1="206" x2="930" y2="206" stroke="#2c3e50" stroke-width="10" stroke-linecap="round"/>
  <line x1="75" y1="206" x2="925" y2="206" stroke="#ecf0f1" stroke-width="2" stroke-dasharray="14 10"/>

  <text x="220" y="188" text-anchor="middle" font-size="9" font-weight="bold" fill="#333">call: Sum()</text>
  <line x1="220" y1="211" x2="220" y2="298" stroke="#2c3e50" stroke-width="2" marker-end="url(#a)"/>
  <rect x="120" y="300" width="200" height="58" rx="10" fill="#e8f4fb" stroke="#3d85c6" stroke-width="1.5"/>
  <text x="220" y="323" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#1a4a73">numbers = int[0]</text>
  <text x="220" y="341" text-anchor="middle" font-size="9" fill="#1a4a73">empty array, still real</text>
  <path d="M220,358 L220,388 L300,388 L300,211" fill="none" stroke="#888" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#d)"/>
  <text x="260" y="378" text-anchor="middle" font-size="9" fill="#555">returns 0</text>

  <text x="470" y="188" text-anchor="middle" font-size="9" font-weight="bold" fill="#333">call: Sum(1, 2, 3)</text>
  <line x1="470" y1="211" x2="470" y2="298" stroke="#2c3e50" stroke-width="2" marker-end="url(#a)"/>
  <rect x="370" y="300" width="200" height="58" rx="10" fill="#e8f4fb" stroke="#3d85c6" stroke-width="1.5"/>
  <text x="470" y="323" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#1a4a73">numbers = int[3]</text>
  <text x="470" y="341" text-anchor="middle" font-size="9" fill="#1a4a73">{1, 2, 3} — a fresh Heap array</text>
  <path d="M470,358 L470,388 L550,388 L550,211" fill="none" stroke="#888" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#d)"/>
  <text x="510" y="378" text-anchor="middle" font-size="9" fill="#555">returns 6</text>

  <text x="720" y="188" text-anchor="middle" font-size="9" font-weight="bold" fill="#333">call: Sum(10, 20, 30, 40)</text>
  <line x1="720" y1="211" x2="720" y2="298" stroke="#2c3e50" stroke-width="2" marker-end="url(#a)"/>
  <rect x="620" y="300" width="200" height="58" rx="10" fill="#e8f4fb" stroke="#3d85c6" stroke-width="1.5"/>
  <text x="720" y="323" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#1a4a73">numbers = int[4]</text>
  <text x="720" y="341" text-anchor="middle" font-size="9" fill="#1a4a73">a DIFFERENT fresh Heap array</text>
  <path d="M720,358 L720,388 L800,388 L800,211" fill="none" stroke="#888" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#d)"/>
  <text x="760" y="378" text-anchor="middle" font-size="9" fill="#555">returns 100</text>

  <line x1="930" y1="150" x2="930" y2="205" stroke="#333" stroke-width="2"/>
  <polygon points="930,150 930,168 960,159" fill="#cc0000"/>
  <text x="930" y="140" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#990000">END</text>

  <text x="30" y="420" font-size="10.5" fill="#444"><tspan font-weight="bold">Three trips, three separate arrays</tspan> — none of them shared, none of them reused. See Memory/4-ParamsKeyword.svg for where each one actually lives.</text>
</svg>
