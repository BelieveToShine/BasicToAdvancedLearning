<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 722" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#333"/></marker>
  </defs>
  <rect x="0" y="0" width="900" height="722" fill="#ffffff"/>
  <text x="450.0" y="20" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a237e">Removing rows — Sub-level Flow: a door with a security guard</text>
  <text x="450.0" y="38" text-anchor="middle" font-size="11" fill="#666">Remove marks the object Deleted; SaveChanges sends the DELETE. The foreign key is the guard: refuse, or cascade.</text>
  <text x="225" y="52" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#274e13">START</text>
  <line x1="225" y1="56" x2="225" y2="94" stroke="#333" stroke-width="2"/>
  <polygon points="225,56 225,74 255,65" fill="#38761d"/>
  <line x1="225" y1="96" x2="225" y2="108" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="40" y="108" width="370" height="68" rx="8" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1.6"/>
  <text x="225.0" y="128" text-anchor="middle" font-size="10" font-weight="bold" fill="#274e13">Remove(chen);  SaveChanges();</text>
  <text x="225.0" y="144" text-anchor="middle" font-size="9.5" fill="#333">Chen has no accounts: no row refers to him</text>
  <text x="225.0" y="160" text-anchor="middle" font-size="9" font-style="italic" fill="#555">Console.WriteLine: "After Remove: state = Deleted", SQL, "wrote 1 row."</text>
  <rect x="520" y="108" width="340" height="68" rx="10" fill="#f1f1f1" stroke="#777777" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="690.0" y="125" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#444">SQL Server</text>
  <text x="690.0" y="141" text-anchor="middle" font-size="9" font-weight="bold" fill="#333">DELETE FROM [Customers] WHERE [CustomerId] = …</text>
  <text x="690.0" y="155" text-anchor="middle" font-size="9" fill="#333">the row is removed</text>
  <line x1="410" y1="132" x2="520" y2="132" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="465.0" y="127" text-anchor="middle" font-size="8.5" fill="#555">DELETE</text>
  <line x1="520" y1="154" x2="410" y2="154" stroke="#333" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="465.0" y="149" text-anchor="middle" font-size="8.5" fill="#555">1 row</text>
  <line x1="225.0" y1="176" x2="225.0" y2="206" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="40" y="206" width="370" height="68" rx="8" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1.6"/>
  <text x="225.0" y="226" text-anchor="middle" font-size="10" font-weight="bold" fill="#274e13">Remove(ben);  SaveChanges();</text>
  <text x="225.0" y="242" text-anchor="middle" font-size="9.5" fill="#333">Ben still has 2 accounts that refer to him</text>
  <text x="225.0" y="258" text-anchor="middle" font-size="9" font-style="italic" fill="#555">Console.WriteLine: the SQL (it was sent before the refusal)</text>
  <rect x="520" y="206" width="340" height="68" rx="10" fill="#fdecea" stroke="#cc0000" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="690.0" y="223" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#444">SQL Server — the foreign key says no</text>
  <text x="690.0" y="239" text-anchor="middle" font-size="9" font-weight="bold" fill="#333">DELETE FROM [Customers] … is REFUSED</text>
  <text x="690.0" y="253" text-anchor="middle" font-size="9" fill="#333">Accounts rows still refer to Ben; nothing changes</text>
  <line x1="410" y1="230" x2="520" y2="230" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="465.0" y="225" text-anchor="middle" font-size="8.5" fill="#555">DELETE</text>
  <line x1="520" y1="252" x2="410" y2="252" stroke="#cc0000" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="465.0" y="247" text-anchor="middle" font-size="8.5" fill="#cc0000">error 547</text>
  <line x1="225.0" y1="274" x2="225.0" y2="304" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="40" y="304" width="370" height="62" rx="8" fill="#fdecea" stroke="#cc0000" stroke-width="1.6"/>
  <text x="225.0" y="324" text-anchor="middle" font-size="10" font-weight="bold" fill="#990000">catch (DbUpdateException ex) when (… is SqlException sql)</text>
  <text x="225.0" y="340" text-anchor="middle" font-size="9.5" fill="#333">EF wraps the SQL Server error; sql.Number is 547</text>
  <text x="225.0" y="356" text-anchor="middle" font-size="9" font-style="italic" fill="#555">Console.WriteLine: "Removing Ben failed: … error number 547."</text>
  <line x1="225.0" y1="366" x2="225.0" y2="396" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="40" y="396" width="370" height="68" rx="8" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1.6"/>
  <text x="225.0" y="416" text-anchor="middle" font-size="10" font-weight="bold" fill="#274e13">RemoveRange(ben.Accounts);  Remove(ben);  SaveChanges();</text>
  <text x="225.0" y="432" text-anchor="middle" font-size="9.5" fill="#333">children and parent in one SaveChanges: accounts go first</text>
  <text x="225.0" y="448" text-anchor="middle" font-size="9" font-style="italic" fill="#555">Console.WriteLine: the SQL, "wrote 3 rows."</text>
  <rect x="520" y="396" width="340" height="68" rx="10" fill="#f1f1f1" stroke="#777777" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="690.0" y="413" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#444">SQL Server</text>
  <text x="690.0" y="429" text-anchor="middle" font-size="9" font-weight="bold" fill="#333">DELETE Accounts 2;  DELETE Accounts 3;</text>
  <text x="690.0" y="443" text-anchor="middle" font-size="9" font-weight="bold" fill="#333">DELETE Customers 2   (children first)</text>
  <line x1="410" y1="420" x2="520" y2="420" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="465.0" y="415" text-anchor="middle" font-size="8.5" fill="#555">3 DELETEs</text>
  <line x1="520" y1="442" x2="410" y2="442" stroke="#333" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="465.0" y="437" text-anchor="middle" font-size="8.5" fill="#555">3 rows</text>
  <line x1="225.0" y1="464" x2="225.0" y2="494" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="40" y="494" width="370" height="68" rx="8" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1.6"/>
  <text x="225.0" y="514" text-anchor="middle" font-size="10" font-weight="bold" fill="#274e13">Remove(account);  SaveChanges();   // ACC-1001</text>
  <text x="225.0" y="530" text-anchor="middle" font-size="9.5" fill="#333">EF sends ONE delete; the database cascades the rest</text>
  <text x="225.0" y="546" text-anchor="middle" font-size="9" font-style="italic" fill="#555">Console.WriteLine: SQL, "had 2 transactions … left in the table: 0."</text>
  <rect x="520" y="494" width="340" height="68" rx="10" fill="#f1f1f1" stroke="#777777" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="690.0" y="511" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#444">SQL Server — ON DELETE CASCADE</text>
  <text x="690.0" y="527" text-anchor="middle" font-size="9" font-weight="bold" fill="#333">DELETE FROM [Accounts] WHERE [AccountId] = …</text>
  <text x="690.0" y="541" text-anchor="middle" font-size="9" fill="#333">its 2 Transactions rows disappear too</text>
  <line x1="410" y1="518" x2="520" y2="518" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="465.0" y="513" text-anchor="middle" font-size="8.5" fill="#555">DELETE</text>
  <line x1="520" y1="540" x2="410" y2="540" stroke="#333" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="465.0" y="535" text-anchor="middle" font-size="8.5" fill="#555">1 row</text>
  <line x1="225" y1="562" x2="225" y2="584" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="225" y="602" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#990000">END</text>
  <line x1="225" y1="610" x2="225" y2="650" stroke="#333" stroke-width="2"/>
  <polygon points="225,610 225,628 255,619" fill="#cc0000"/>
  <text x="30" y="666" font-size="10.5" fill="#444"><tspan font-weight="bold">The guard is the foreign key's delete rule:</tspan> no action = refuse (error 547), cascade = delete the children. Here Accounts refuse and Transactions cascade.</text>
  <text x="30" y="684" font-size="10" font-style="italic" fill="#888">SaveChanges returned 1 for the account even though 3 rows left the database: it counts the rows EF itself asked to delete.</text>
  <text x="30" y="702" font-size="10" font-style="italic" fill="#888">Each method also opens with PrintHeading(): a blank line and a "=== title ===" line (two Console.WriteLine calls, not drawn).</text>
</svg>
