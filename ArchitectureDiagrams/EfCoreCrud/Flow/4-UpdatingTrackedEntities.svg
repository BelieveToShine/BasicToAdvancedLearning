<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 796" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#333"/></marker>
  </defs>
  <rect x="0" y="0" width="900" height="796" fill="#ffffff"/>
  <text x="450.0" y="20" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a237e">Updating tracked entities — Sub-level Flow: checking against a photocopy</text>
  <text x="450.0" y="38" text-anchor="middle" font-size="11" fill="#666">A tracked object has a photocopy (snapshot) on file. SaveChanges compares the two and writes only what differs.</text>
  <text x="450" y="58" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#274e13">START</text>
  <line x1="450" y1="62" x2="450" y2="100" stroke="#333" stroke-width="2"/>
  <polygon points="450,62 450,80 480,71" fill="#38761d"/>
  <polyline points="450,100 230,100 230,116" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <polyline points="450,100 670,100 670,116" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="140" y="88" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a4a73">tracked: a normal query</text>
  <text x="760" y="88" text-anchor="middle" font-size="10" font-weight="bold" fill="#990000">untracked: AsNoTracking</text>
  <rect x="40" y="116" width="380" height="66" rx="8" fill="#e8f4fb" stroke="#3d85c6" stroke-width="1.6"/>
  <text x="230.0" y="136" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a4a73">account = context.Accounts.Single(…ACC-2001);</text>
  <text x="230.0" y="152" text-anchor="middle" font-size="9.5" fill="#333">the tracker keeps the object AND a snapshot copy</text>
  <text x="230.0" y="168" text-anchor="middle" font-size="9" font-style="italic" fill="#555">Console.WriteLine: "Loaded ACC-2001 … state = Unchanged"</text>
  <line x1="230" y1="182" x2="230" y2="210" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="40" y="210" width="380" height="66" rx="8" fill="#e8f4fb" stroke="#3d85c6" stroke-width="1.6"/>
  <text x="230.0" y="230" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a4a73">account.Balance += 100m;</text>
  <text x="230.0" y="246" text-anchor="middle" font-size="9.5" fill="#333">at the next check the tracker sees Balance differs</text>
  <text x="230.0" y="262" text-anchor="middle" font-size="9" font-style="italic" fill="#555">Console.WriteLine: "state = Modified, Balance modified? True"</text>
  <line x1="230" y1="276" x2="230" y2="304" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="40" y="304" width="380" height="70" rx="8" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1.6"/>
  <text x="230.0" y="324" text-anchor="middle" font-size="10" font-weight="bold" fill="#274e13">int rows = SaveChanges();</text>
  <text x="230.0" y="340" text-anchor="middle" font-size="9.5" fill="#333">UPDATE … SET [Balance] only. A 2nd SaveChanges does nothing</text>
  <text x="230.0" y="356" text-anchor="middle" font-size="9" font-style="italic" fill="#555">Console.WriteLine: SQL, "wrote 1 row", "wrote 0 rows, SQL commands: 0"</text>
  <rect x="480" y="116" width="380" height="66" rx="8" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1.6"/>
  <text x="670.0" y="136" text-anchor="middle" font-size="10" font-weight="bold" fill="#274e13">detached = context.Accounts.AsNoTracking().Single(…);</text>
  <text x="670.0" y="152" text-anchor="middle" font-size="9.5" fill="#333">EF hands over the object but keeps no snapshot</text>
  <text x="670.0" y="168" text-anchor="middle" font-size="9" font-style="italic" fill="#555">Console.WriteLine (after the edit): "state = Detached"</text>
  <line x1="670" y1="182" x2="670" y2="210" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="480" y="210" width="380" height="66" rx="8" fill="#e8f4fb" stroke="#3d85c6" stroke-width="1.6"/>
  <text x="670.0" y="230" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a4a73">detached.Balance += 50m;</text>
  <text x="670.0" y="246" text-anchor="middle" font-size="9.5" fill="#333">just a C# property change: nothing is watching</text>
  <text x="670.0" y="262" text-anchor="middle" font-size="9" font-style="italic" fill="#555">Console.WriteLine: "AsNoTracking object edited to 400.00 …"</text>
  <line x1="670" y1="276" x2="670" y2="304" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="480" y="304" width="380" height="70" rx="8" fill="#fdecea" stroke="#cc0000" stroke-width="1.6"/>
  <text x="670.0" y="324" text-anchor="middle" font-size="10" font-weight="bold" fill="#990000">int rows = context.SaveChanges();</text>
  <text x="670.0" y="340" text-anchor="middle" font-size="9.5" fill="#333">nothing is tracked, so there is nothing to send</text>
  <text x="670.0" y="356" text-anchor="middle" font-size="9" font-style="italic" fill="#555">Console.WriteLine: "wrote 0 rows using 0 SQL commands — … not saved."</text>
  <text x="770" y="388" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#cc0000">X  no SQL sent</text>
  <line x1="670" y1="394" x2="670" y2="414" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="480" y="414" width="380" height="70" rx="8" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1.6"/>
  <text x="670.0" y="434" text-anchor="middle" font-size="10" font-weight="bold" fill="#274e13">context.Update(detached);  SaveChanges();</text>
  <text x="670.0" y="450" text-anchor="middle" font-size="9.5" fill="#333">a NEW context: Update starts tracking it as Modified</text>
  <text x="670.0" y="466" text-anchor="middle" font-size="9" font-style="italic" fill="#555">Console.WriteLine: "Balance in the database: 350.00", state, SQL, "1 row"</text>
  <rect x="40" y="540" width="820" height="96" rx="10" fill="#f1f1f1" stroke="#777777" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="450" y="557" text-anchor="middle" font-size="10" font-weight="bold" fill="#444">SQL Server — Accounts table, AccountId 2 (ACC-2001)</text>
  <line x1="450" y1="568" x2="450" y2="630" stroke="#aaa" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="245" y="584" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#333">UPDATE [Accounts] SET [Balance] = @p0 …</text>
  <text x="245" y="602" text-anchor="middle" font-size="9" fill="#333">only Balance is in the SET list: 250.00 → 350.00</text>
  <text x="655" y="584" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#333">UPDATE … SET [AccountNumber], [AccountType], …</text>
  <text x="655" y="602" text-anchor="middle" font-size="9" fill="#333">every column is sent: Balance 350.00 → 400.00</text>
  <line x1="190" y1="374" x2="190" y2="540" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="198" y="396" font-size="8.5" fill="#555">UPDATE</text>
  <line x1="270" y1="540" x2="270" y2="374" stroke="#333" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="278" y="396" font-size="8.5" fill="#555">1 row</text>
  <line x1="630" y1="484" x2="630" y2="540" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="638" y="506" font-size="8.5" fill="#555">UPDATE</text>
  <line x1="710" y1="540" x2="710" y2="484" stroke="#333" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="718" y="506" font-size="8.5" fill="#555">1 row</text>
  <line x1="450" y1="636" x2="450" y2="658" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="450" y="676" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#990000">END</text>
  <line x1="450" y1="684" x2="450" y2="724" stroke="#333" stroke-width="2"/>
  <polygon points="450,684 450,702 480,693" fill="#cc0000"/>
  <text x="30" y="740" font-size="10.5" fill="#444"><tspan font-weight="bold">Tracking is what makes "change a property, call SaveChanges" work:</tspan> without a snapshot, EF has nothing to compare, so the edit is silently not saved.</text>
  <text x="30" y="758" font-size="10" font-style="italic" fill="#888">Update() is the fix for an object you already hold, but it marks EVERY column as changed, so the UPDATE is bigger than needed.</text>
  <text x="30" y="776" font-size="10" font-style="italic" fill="#888">Each method also opens with PrintHeading(): a blank line and a "=== title ===" line (two Console.WriteLine calls, not drawn).</text>
</svg>
