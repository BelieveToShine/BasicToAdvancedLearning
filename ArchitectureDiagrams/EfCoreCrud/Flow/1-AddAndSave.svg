<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 944" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#333"/></marker>
  </defs>
  <rect x="0" y="0" width="900" height="944" fill="#ffffff"/>
  <text x="450.0" y="20" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a237e">Add and SaveChanges — Sub-level Flow: a parcel and a courier</text>
  <text x="450.0" y="38" text-anchor="middle" font-size="11" fill="#666">Add only puts the parcel on the tray (the tracker). SaveChanges is the courier trip to SQL Server and back.</text>
  <text x="225" y="48" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#274e13">START</text>
  <line x1="225" y1="52" x2="225" y2="90" stroke="#333" stroke-width="2"/>
  <polygon points="225,52 225,70 255,61" fill="#38761d"/>
  <line x1="225" y1="92" x2="225" y2="104" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="40" y="104" width="370" height="82" rx="8" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1.6"/>
  <text x="225.0" y="124" text-anchor="middle" font-size="10" font-weight="bold" fill="#274e13">EnsureDeleted();  EnsureCreated();</text>
  <text x="225.0" y="140" text-anchor="middle" font-size="9.5" fill="#333">drop this lesson's scratch database, rebuild empty tables</text>
  <text x="225.0" y="156" text-anchor="middle" font-size="9" font-style="italic" fill="#555">Console.WriteLine: "Database dropped and recreated (…)"</text>
  <rect x="520" y="104" width="340" height="82" rx="10" fill="#f1f1f1" stroke="#777777" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="690.0" y="121" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#444">SQL Server</text>
  <text x="690.0" y="137" text-anchor="middle" font-size="9" fill="#333">database dropped and created:</text>
  <text x="690.0" y="151" text-anchor="middle" font-size="9" font-weight="bold" fill="#333">Customers · Accounts · Transactions</text>
  <text x="690.0" y="165" text-anchor="middle" font-size="9" fill="#333">all three tables are empty</text>
  <line x1="410" y1="128" x2="520" y2="128" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="465.0" y="123" text-anchor="middle" font-size="8.5" fill="#555">DROP / CREATE</text>
  <line x1="520" y1="150" x2="410" y2="150" stroke="#333" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="465.0" y="145" text-anchor="middle" font-size="8.5" fill="#555">tables ready</text>
  <line x1="225.0" y1="186" x2="225.0" y2="216" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="40" y="216" width="370" height="62" rx="8" fill="#e8f4fb" stroke="#3d85c6" stroke-width="1.6"/>
  <text x="225.0" y="236" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a4a73">var asha = new Customer { FullName, Email };</text>
  <text x="225.0" y="252" text-anchor="middle" font-size="9.5" fill="#333">a plain C# object: CustomerId is still 0</text>
  <text x="225.0" y="268" text-anchor="middle" font-size="9" font-style="italic" fill="#555">Console.WriteLine: "New object: CustomerId = 0 …"</text>
  <line x1="225.0" y1="278" x2="225.0" y2="308" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="40" y="308" width="370" height="62" rx="8" fill="#e8f4fb" stroke="#3d85c6" stroke-width="1.6"/>
  <text x="225.0" y="328" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a4a73">context.Customers.Add(asha);</text>
  <text x="225.0" y="344" text-anchor="middle" font-size="9.5" fill="#333">the tracker now lists asha as Added</text>
  <text x="225.0" y="360" text-anchor="middle" font-size="9" font-style="italic" fill="#555">no SQL yet — Console.WriteLine shows state = Added</text>
  <line x1="225.0" y1="370" x2="225.0" y2="400" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="40" y="400" width="370" height="82" rx="8" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1.6"/>
  <text x="225.0" y="420" text-anchor="middle" font-size="10" font-weight="bold" fill="#274e13">int rowsWritten = context.SaveChanges();</text>
  <text x="225.0" y="436" text-anchor="middle" font-size="9.5" fill="#333">EF turns the Added object into one INSERT</text>
  <text x="225.0" y="452" text-anchor="middle" font-size="9" font-style="italic" fill="#555">Console.WriteLine: the SQL (via SqlSpy), "wrote 1 row(s)"</text>
  <rect x="520" y="400" width="340" height="82" rx="10" fill="#f1f1f1" stroke="#777777" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="690.0" y="417" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#444">SQL Server</text>
  <text x="690.0" y="433" text-anchor="middle" font-size="9" fill="#333">Customers gets row 1:</text>
  <text x="690.0" y="447" text-anchor="middle" font-size="9" font-weight="bold" fill="#333">Asha Rao · asha@example.com</text>
  <text x="690.0" y="461" text-anchor="middle" font-size="9" fill="#333">CustomerId and CreatedAt made here</text>
  <line x1="410" y1="424" x2="520" y2="424" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="465.0" y="419" text-anchor="middle" font-size="8.5" fill="#555">INSERT … OUTPUT</text>
  <line x1="520" y1="446" x2="410" y2="446" stroke="#333" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="465.0" y="441" text-anchor="middle" font-size="8.5" fill="#555">CustomerId, CreatedAt</text>
  <line x1="225.0" y1="482" x2="225.0" y2="512" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="40" y="512" width="370" height="62" rx="8" fill="#e8f4fb" stroke="#3d85c6" stroke-width="1.6"/>
  <text x="225.0" y="532" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a4a73">asha is now Unchanged, with CustomerId = 1</text>
  <text x="225.0" y="548" text-anchor="middle" font-size="9.5" fill="#333">EF copied the database-made values into the object</text>
  <text x="225.0" y="564" text-anchor="middle" font-size="9" font-style="italic" fill="#555">Console.WriteLine: "After save: CustomerId = 1 …"</text>
  <line x1="225.0" y1="574" x2="225.0" y2="604" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="40" y="604" width="370" height="82" rx="8" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1.6"/>
  <text x="225.0" y="624" text-anchor="middle" font-size="10" font-weight="bold" fill="#274e13">AddRange(ben, chen);  Accounts.Add(ashaAccount);</text>
  <text x="225.0" y="640" text-anchor="middle" font-size="9.5" fill="#333">SaveChanges(): one call, three objects with children</text>
  <text x="225.0" y="656" text-anchor="middle" font-size="9" font-style="italic" fill="#555">Console.WriteLine: "wrote 5 rows … ids 2 and 3 …"</text>
  <rect x="520" y="604" width="340" height="82" rx="10" fill="#f1f1f1" stroke="#777777" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="690.0" y="621" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#444">SQL Server</text>
  <text x="690.0" y="637" text-anchor="middle" font-size="9" font-weight="bold" fill="#333">+ 2 customers, + 3 accounts</text>
  <text x="690.0" y="651" text-anchor="middle" font-size="9" fill="#333">foreign keys point at the new customer ids</text>
  <text x="690.0" y="665" text-anchor="middle" font-size="9" fill="#333">EF batches the INSERTs together</text>
  <line x1="410" y1="628" x2="520" y2="628" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="465.0" y="623" text-anchor="middle" font-size="8.5" fill="#555">INSERTs</text>
  <line x1="520" y1="650" x2="410" y2="650" stroke="#333" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="465.0" y="645" text-anchor="middle" font-size="8.5" fill="#555">new ids</text>
  <line x1="225.0" y1="686" x2="225.0" y2="716" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="40" y="716" width="370" height="68" rx="8" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1.6"/>
  <text x="225.0" y="736" text-anchor="middle" font-size="10" font-weight="bold" fill="#274e13">ashaAccount.Transactions.Add(…) ×2;  SaveChanges();</text>
  <text x="225.0" y="752" text-anchor="middle" font-size="9.5" fill="#333">two deposits hang off the account object</text>
  <text x="225.0" y="768" text-anchor="middle" font-size="9" font-style="italic" fill="#555">Console.WriteLine: "Third SaveChanges wrote 2 rows"</text>
  <rect x="520" y="716" width="340" height="68" rx="10" fill="#f1f1f1" stroke="#777777" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="690.0" y="733" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#444">SQL Server</text>
  <text x="690.0" y="749" text-anchor="middle" font-size="9" fill="#333">Transactions gets rows 1 and 2:</text>
  <text x="690.0" y="763" text-anchor="middle" font-size="9" font-weight="bold" fill="#333">300.00 Deposit · 200.00 Deposit</text>
  <line x1="410" y1="740" x2="520" y2="740" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="465.0" y="735" text-anchor="middle" font-size="8.5" fill="#555">INSERT</text>
  <line x1="520" y1="762" x2="410" y2="762" stroke="#333" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="465.0" y="757" text-anchor="middle" font-size="8.5" fill="#555">TransactionIds</text>
  <line x1="225" y1="784" x2="225" y2="806" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="225" y="824" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#990000">END</text>
  <line x1="225" y1="832" x2="225" y2="872" stroke="#333" stroke-width="2"/>
  <polygon points="225,832 225,850 255,841" fill="#cc0000"/>
  <text x="30" y="888" font-size="10.5" fill="#444"><tspan font-weight="bold">Add is cheap and local; SaveChanges is the expensive trip:</tspan> nothing reaches SQL Server until it runs, and it returns how many rows it wrote.</text>
  <text x="30" y="906" font-size="10" font-style="italic" fill="#888">Dashed arrows are what comes back: the identity numbers and defaults SQL Server made, copied into your objects.</text>
  <text x="30" y="924" font-size="10" font-style="italic" fill="#888">Each method also opens with PrintHeading(): a blank line and a "=== title ===" line (two Console.WriteLine calls, not drawn).</text>
</svg>
