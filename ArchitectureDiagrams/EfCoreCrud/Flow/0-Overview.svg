  <line x1="886" y1="222" x2="364" y2="222" stroke="#333" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="625.0" y="264" text-anchor="middle" font-size="9" font-style="italic" fill="#888">Console.WriteLine only on the skip path</text>
  <rect x="636" y="288" width="8" height="62" rx="0" fill="#e8f4fb" stroke="#3d85c6" stroke-width="1"/>
