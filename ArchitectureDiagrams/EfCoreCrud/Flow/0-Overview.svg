  <text x="500.0" y="782" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#123">ExplainSaveChangesIsAllOrNothing()</text>
  <line x1="364" y1="788" x2="636" y2="788" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="501.0" y="805" text-anchor="middle" font-size="9" fill="#4a2e73">all or nothing (a transaction wraps the save)</text>
  <text x="501.0" y="818" text-anchor="middle" font-size="9" fill="#555">Console.WriteLine + SQL via SqlSpy</text>
  <text x="501.0" y="831" text-anchor="middle" font-size="8.5" fill="#555">see Flow/6-SaveChangesIsAllOrNothing.svg</text>
  <text x="501.0" y="845" text-anchor="middle" font-size="9.5" fill="#555">returns</text>
  <line x1="636" y1="854" x2="364" y2="854" stroke="#333" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="230.0" y="864" text-anchor="middle" font-size="10" fill="#555">Explain() returns — program ends</text>
  <line x1="356" y1="870" x2="104" y2="870" stroke="#333" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <circle cx="100" cy="892" r="6" fill="#cc0000"/>
  <text x="114" y="896" font-size="10.5" font-weight="bold" fill="#990000">End</text>
  <text x="40" y="935" font-size="10.5" fill="#444"><tspan font-weight="bold">Where to where, in one line:</tspan> Program.cs calls Explain() once; EfCoreCrudExample checks SqlLab, then calls the six EfCoreCrudDemo methods one after another.</text>
  <text x="40" y="953" font-size="10" font-style="italic" fill="#888">BankContext, the entity classes and SqlSpy are helpers that EfCoreCrudDemo uses; SQL Server itself is outside .NET and appears in the per-method flows.</text>
</svg>
