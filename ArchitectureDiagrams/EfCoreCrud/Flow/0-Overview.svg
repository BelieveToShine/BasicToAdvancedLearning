  <text x="501.0" y="531" text-anchor="middle" font-size="8.5" fill="#555">see Flow/3-RelatedData.svg</text>
  <text x="501.0" y="545" text-anchor="middle" font-size="9.5" fill="#555">returns</text>
  <line x1="636" y1="554" x2="364" y2="554" stroke="#333" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <rect x="636" y="588" width="8" height="62" rx="0" fill="#fffbe8" stroke="#f1c232" stroke-width="1"/>
  <text x="500.0" y="582" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#123">ExplainUpdatingTrackedEntities()</text>
  <line x1="364" y1="588" x2="636" y2="588" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="501.0" y="605" text-anchor="middle" font-size="9" fill="#7f6000">the tracker spots changes; UPDATE sets them</text>
  <text x="501.0" y="618" text-anchor="middle" font-size="9" fill="#555">Console.WriteLine + SQL via SqlSpy</text>
  <text x="501.0" y="631" text-anchor="middle" font-size="8.5" fill="#555">see Flow/4-UpdatingTrackedEntities.svg</text>
  <text x="501.0" y="645" text-anchor="middle" font-size="9.5" fill="#555">returns</text>
  <line x1="636" y1="654" x2="364" y2="654" stroke="#333" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <rect x="636" y="688" width="8" height="62" rx="0" fill="#fdecea" stroke="#cc0000" stroke-width="1"/>
  <text x="500.0" y="682" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#123">ExplainRemovingRows()</text>
  <line x1="364" y1="688" x2="636" y2="688" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="501.0" y="705" text-anchor="middle" font-size="9" fill="#990000">Remove + DELETE; the foreign key decides</text>
  <text x="501.0" y="718" text-anchor="middle" font-size="9" fill="#555">Console.WriteLine + SQL via SqlSpy</text>
  <text x="501.0" y="731" text-anchor="middle" font-size="8.5" fill="#555">see Flow/5-RemovingRows.svg</text>
