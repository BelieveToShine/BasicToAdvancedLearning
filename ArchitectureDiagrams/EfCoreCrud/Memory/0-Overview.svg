<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#555"/></marker>
  </defs>
  <rect x="0" y="0" width="1200" height="560" fill="#ffffff"/>
  <text x="600" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a237e">EF Core CRUD — Memory: Stack / Heap / Static (high level)</text>
  <text x="600" y="46" text-anchor="middle" font-size="12" fill="#666">Entity objects and the DbContext live on the Heap; the rows live in SQL Server, outside .NET. Static stays empty.</text>
  <g font-size="11" fill="#333"><rect x="150" y="60" width="14" height="14" rx="2" fill="#b6d7a8" stroke="#6aa84f"/><text x="170" y="71">Stack</text></g>
  <g font-size="11" fill="#333"><rect x="330" y="60" width="14" height="14" rx="2" fill="#f9cb9c" stroke="#e69138"/><text x="350" y="71">Heap</text></g>
  <g font-size="11" fill="#333"><rect x="510" y="60" width="14" height="14" rx="2" fill="#d5c9ea" stroke="#674ea7"/><text x="530" y="71">Static</text></g>
  <text x="230" y="98" text-anchor="middle" font-size="12" font-weight="bold" fill="#3f6b3f">STACK — pointers, plus a few plain values</text>
  <text x="660" y="98" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a5a10">HEAP — the context and the entity objects</text>
  <text x="1130" y="98" text-anchor="middle" font-size="12" font-weight="bold" fill="#3d2a6b">STATIC</text>
  <rect x="40" y="112" width="380" height="300" rx="8" fill="#b6d7a8" stroke="#6aa84f" stroke-width="2"/>
  <text x="230" y="132" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#274e13">One slot per local, in each method's own frame</text>
  <rect x="56" y="144" width="348" height="38" rx="4" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1"/>
  <text x="66" y="161" font-size="9.5" font-weight="bold" fill="#1b3d1b">spy, context → pointers; asha, ben, chen, ashaAccount …</text>
  <text x="66" y="175" font-size="8.5" fill="#3f6b3f">ExplainAddAndSave()</text>
  <rect x="56" y="188" width="348" height="38" rx="4" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1"/>
  <text x="66" y="205" font-size="9.5" font-weight="bold" fill="#1b3d1b">spy, context, query, customers, names … → pointers</text>
  <text x="66" y="219" font-size="8.5" fill="#3f6b3f">ExplainQueryingWithLinq()</text>
  <rect x="56" y="232" width="348" height="38" rx="4" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1"/>
  <text x="66" y="249" font-size="9.5" font-weight="bold" fill="#1b3d1b">plain, withAccounts, summaries → pointers; counts inline</text>
  <text x="66" y="263" font-size="8.5" fill="#3f6b3f">ExplainRelatedData()</text>
  <rect x="56" y="276" width="348" height="38" rx="4" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1"/>
  <text x="66" y="293" font-size="9.5" font-weight="bold" fill="#1b3d1b">detached, context → pointers; stored = 350.00 inline</text>
  <text x="66" y="307" font-size="8.5" fill="#3f6b3f">ExplainUpdatingTrackedEntities()</text>
  <rect x="56" y="320" width="348" height="38" rx="4" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1"/>
  <text x="66" y="337" font-size="9.5" font-weight="bold" fill="#1b3d1b">account, context → pointers; before, rows, after inline</text>
  <text x="66" y="351" font-size="8.5" fill="#3f6b3f">ExplainRemovingRows()</text>
  <rect x="56" y="364" width="348" height="38" rx="4" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1"/>
  <text x="66" y="381" font-size="9.5" font-weight="bold" fill="#1b3d1b">asha, context, fresh → pointers</text>
  <text x="66" y="395" font-size="8.5" fill="#3f6b3f">ExplainSaveChangesIsAllOrNothing()</text>
  <rect x="450" y="112" width="620" height="300" rx="8" fill="#f9cb9c" stroke="#e69138" stroke-width="1.5"/>
  <text x="760" y="132" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7f4e00">The real objects — this is where the data in memory is</text>
  <rect x="466" y="144" width="588" height="58" rx="6" fill="#ffffff" stroke="#f0c07a" stroke-width="1"/>
  <text x="760" y="164" text-anchor="middle" font-size="10" font-weight="bold" fill="#7f4e00">BankContext — the DbContext</text>
  <text x="760" y="181" text-anchor="middle" font-size="9" fill="#7f4e00">the change tracker lives inside: a list of pointers to entities, each with a state</text>
  <text x="760" y="195" text-anchor="middle" font-size="8.5" font-style="italic" fill="#a06a1f">→ Memory/1 to 6</text>
  <rect x="466" y="210" width="588" height="58" rx="6" fill="#ffffff" stroke="#f0c07a" stroke-width="1"/>
  <text x="760" y="230" text-anchor="middle" font-size="10" font-weight="bold" fill="#7f4e00">Customer / Account / BankTransaction objects</text>
  <text x="760" y="247" text-anchor="middle" font-size="9" fill="#7f4e00">plain objects: a field per column, plus navigation lists</text>
  <text x="760" y="261" text-anchor="middle" font-size="8.5" font-style="italic" fill="#a06a1f">→ Memory/1, 2, 4, 6</text>
  <rect x="466" y="276" width="588" height="58" rx="6" fill="#ffffff" stroke="#f0c07a" stroke-width="1"/>
  <text x="760" y="296" text-anchor="middle" font-size="10" font-weight="bold" fill="#7f4e00">List&lt;…&gt; and the query object</text>
  <text x="760" y="313" text-anchor="middle" font-size="9" fill="#7f4e00">results of ToList, and the IQueryable that is only a plan</text>
  <text x="760" y="327" text-anchor="middle" font-size="8.5" font-style="italic" fill="#a06a1f">→ Memory/2 and 3</text>
  <rect x="466" y="342" width="588" height="58" rx="6" fill="#ffffff" stroke="#f0c07a" stroke-width="1"/>
  <text x="760" y="362" text-anchor="middle" font-size="10" font-weight="bold" fill="#7f4e00">SqlSpy — the small helper</text>
  <text x="760" y="379" text-anchor="middle" font-size="9" fill="#7f4e00">Count and Print fields; EF calls it before each SQL command</text>
  <text x="760" y="393" text-anchor="middle" font-size="8.5" font-style="italic" fill="#a06a1f">→ every Memory diagram</text>
  <rect x="1100" y="118" width="90" height="130" rx="10" fill="#d5c9ea" stroke="#674ea7" stroke-width="1.5" stroke-dasharray="6 4" fill-opacity="0.25"/>
  <text x="1145" y="150" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#3d2a6b">Nothing</text>
  <text x="1145" y="166" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#3d2a6b">here yet</text>
  <rect x="450" y="430" width="620" height="66" rx="10" fill="#f1f1f1" stroke="#777777" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="760" y="450" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#444">OUTSIDE .NET — SQL Server: the tables Customers, Accounts, Transactions</text>
  <text x="760" y="468" text-anchor="middle" font-size="9.5" fill="#333">The rows live here, not in the program's memory. Every method's Memory diagram shows the rows</text>
  <text x="760" y="482" text-anchor="middle" font-size="9.5" fill="#333">as they stand at that moment, so you can compare the objects with the stored data.</text>
  <text x="40" y="526" font-size="10.5" fill="#444"><tspan font-weight="bold">An entity object is never the row.</tspan> It is a copy in memory; the tracker remembers what it looked like when loaded. Edits stay in memory until SaveChanges.</text>
  <text x="40" y="546" font-size="10" font-style="italic" fill="#888">Static is empty in all six methods: the lesson keeps no static fields, so each method's objects belong to its own context.</text>
</svg>
