  <text x="40" y="512" font-size="10.5" fill="#444"><tspan font-weight="bold">The Heap and SQL Server disagree on purpose: asha says "Asha R. Rao", the row still says "Asha Rao". </tspan>The rename was rolled back with the failed insert.</text>
  <text x="40" y="530" font-size="10" font-style="italic" fill="#888">fresh is a brand-new context, so it loaded its own object for row 1 (right). The old context still holds its two pending changes; the usual fix is to dispose it and start again.</text>
