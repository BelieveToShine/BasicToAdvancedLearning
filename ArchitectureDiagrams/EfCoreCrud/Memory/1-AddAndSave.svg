  <text x="40" y="883" font-size="10.5" fill="#444"><tspan font-weight="bold">Entity objects live on the Heap, and the DbContext's change tracker holds pointers to them. </tspan>After each SaveChanges, every tracked object is back to Unchanged.</text>
  <text x="40" y="901" font-size="10" font-style="italic" fill="#888">The SQL Server box is a different program: the database made CustomerId, AccountId and CreatedAt, and EF copied them back into these objects. Strings are drawn inside their boxes to save space.</text>
