  <text x="550" y="24" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a237e">Relational Concepts — Functional Flow (high level: who calls whom, in what order)</text>
  <text x="550" y="44" text-anchor="middle" font-size="12" fill="#666">For the detail of any one method, zoom into its own Flow/&lt;N&gt;-&lt;Name&gt;.svg (named in each note below).</text>
  <g font-size="11" fill="#333"><line x1="400" y1="64" x2="436" y2="64" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/><text x="442" y="68">Call (→)</text><line x1="550" y1="64" x2="586" y2="64" stroke="#333" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a)"/><text x="592" y="68">Return (←)</text></g>
  <rect x="25.0" y="80" width="170" height="42" rx="8" fill="#eef2f7" stroke="#555" stroke-width="1.3"/>
  <text x="110" y="105" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">Program.cs (Main)</text>
