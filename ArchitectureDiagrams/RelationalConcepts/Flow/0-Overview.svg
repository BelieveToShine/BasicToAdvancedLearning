  <text x="540" y="288" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#123">ExplainTablesRowsColumns()</text>
  <line x1="380" y1="296" x2="700" y2="296" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="540" y="311" text-anchor="middle" font-size="9.5" fill="#1a4a73">a table is a grid: CREATE, INSERT, SELECT</text>
