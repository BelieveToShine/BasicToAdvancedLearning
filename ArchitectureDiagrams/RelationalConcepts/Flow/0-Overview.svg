  <rect x="875.0" y="80" width="170" height="42" rx="8" fill="#eef2f7" stroke="#555" stroke-width="1.3"/>
  <text x="960" y="97" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#222">SqlLab</text>
  <text x="960" y="112" text-anchor="middle" font-size="9" fill="#666">(Interfaces/SqlLab.cs)</text>
  <line x1="960" y1="122" x2="960" y2="780" stroke="#999" stroke-width="1" stroke-dasharray="4 3"/>
  <rect x="106" y="170" width="8" height="600" rx="0" fill="#cfe2f3" stroke="#3d85c6" stroke-width="1"/>
  <rect x="376" y="190" width="8" height="560" rx="0" fill="#cfe2f3" stroke="#3d85c6" stroke-width="1"/>
  <text x="245" y="170" text-anchor="middle" font-size="10" fill="#123">new RelationalConceptsExample();</text>
  <text x="245" y="183" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#123">topic.Explain()</text>
  <line x1="110" y1="190" x2="380" y2="190" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="956" y="215" width="8" height="38" rx="0" fill="#e6e6e6" stroke="#777" stroke-width="1"/>
  <text x="540" y="209" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#123">SqlLab.IsReady()</text>
  <line x1="380" y1="215" x2="960" y2="215" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="540" y="232" text-anchor="middle" font-size="9.5" fill="#555">connection string set? server reachable?</text>
  <text x="540" y="245" text-anchor="middle" font-size="9" fill="#555">Console.WriteLine only to print a skip message</text>
  <line x1="960" y1="253" x2="380" y2="253" stroke="#333" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="540" y="266" text-anchor="middle" font-size="9.5" fill="#555">returns true  (if false: Explain() returns early)</text>
