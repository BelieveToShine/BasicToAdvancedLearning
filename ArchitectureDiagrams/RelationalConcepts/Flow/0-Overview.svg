  <text x="540" y="337" text-anchor="middle" font-size="9.5" fill="#555">returns</text>
  <line x1="700" y1="348" x2="380" y2="348" stroke="#333" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <rect x="696" y="386" width="8" height="54" rx="0" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1"/>
  <text x="540" y="378" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#123">ExplainPrimaryKeys()</text>
  <line x1="380" y1="386" x2="700" y2="386" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="540" y="401" text-anchor="middle" font-size="9.5" fill="#274e13">IDENTITY numbers rows; duplicate key = error 2627</text>
  <text x="540" y="414" text-anchor="middle" font-size="9" fill="#555">Console.WriteLine · T-SQL via SqlLab · Flow/2</text>
  <text x="540" y="427" text-anchor="middle" font-size="9.5" fill="#555">returns</text>
  <line x1="700" y1="438" x2="380" y2="438" stroke="#333" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <rect x="696" y="476" width="8" height="54" rx="0" fill="#fdebd9" stroke="#e69138" stroke-width="1"/>
  <text x="540" y="468" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#123">ExplainForeignKeys()</text>
  <line x1="380" y1="476" x2="700" y2="476" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="540" y="491" text-anchor="middle" font-size="9.5" fill="#8a5a10">Accounts -&gt; Customers; broken link = error 547</text>
  <text x="540" y="504" text-anchor="middle" font-size="9" fill="#555">Console.WriteLine · T-SQL via SqlLab · Flow/3</text>
  <text x="540" y="517" text-anchor="middle" font-size="9.5" fill="#555">returns</text>
  <line x1="700" y1="528" x2="380" y2="528" stroke="#333" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <rect x="696" y="566" width="8" height="54" rx="0" fill="#fffbe8" stroke="#f1c232" stroke-width="1"/>
  <text x="540" y="558" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#123">ExplainConstraintsAndNulls()</text>
  <line x1="380" y1="566" x2="700" y2="566" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="540" y="581" text-anchor="middle" font-size="9.5" fill="#7f6000">NOT NULL, UNIQUE, CHECK, DEFAULT; what NULL means</text>
  <text x="540" y="594" text-anchor="middle" font-size="9" fill="#555">Console.WriteLine · T-SQL via SqlLab · Flow/4</text>
  <text x="540" y="607" text-anchor="middle" font-size="9.5" fill="#555">returns</text>
  <line x1="700" y1="618" x2="380" y2="618" stroke="#333" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <rect x="696" y="656" width="8" height="54" rx="0" fill="#f0eaf7" stroke="#8e63ce" stroke-width="1"/>
  <text x="540" y="648" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#123">ExplainNormalization()</text>
  <line x1="380" y1="656" x2="700" y2="656" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="540" y="671" text-anchor="middle" font-size="9.5" fill="#4a2e73">flat table with repeats, split into three tables</text>
  <text x="540" y="684" text-anchor="middle" font-size="9" fill="#555">Console.WriteLine · T-SQL via SqlLab · Flow/5</text>
  <text x="540" y="697" text-anchor="middle" font-size="9.5" fill="#555">returns</text>
  <line x1="700" y1="708" x2="380" y2="708" stroke="#333" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="245" y="756" text-anchor="middle" font-size="10" fill="#555">Explain() returns — program ends</text>
  <line x1="380" y1="762" x2="110" y2="762" stroke="#333" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <circle cx="110" cy="772" r="6" fill="#cc0000"/>
  <text x="124" y="776" font-size="10.5" font-weight="bold" fill="#990000">End</text>
  <text x="40" y="806" font-size="10.5" fill="#444"><tspan font-weight="bold">Where to where, in one line:</tspan> Program.cs calls Explain() once; the Example checks SqlLab.IsReady(), then calls all five Demo methods in order, waiting for each to return.</text>
  <text x="40" y="826" font-size="10" font-style="italic" fill="#888">Every Demo method sends T-SQL to SQL Server through SqlLab (Run, Show, ShowError); those inner calls are drawn in each method's own Flow file, not here.</text>
</svg>
