<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 734" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#333"/></marker>
  </defs>
  <rect x="0" y="0" width="900" height="734" fill="#ffffff"/>
  <text x="450.0" y="20" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a237e">Primary keys — Sub-level Flow: a numbered-ticket dispenser</text>
  <text x="450.0" y="38" text-anchor="middle" font-size="11" fill="#666">SQL Server hands every new row the next ticket number, and a guard refuses any ticket that is already in use.</text>
  <text x="210" y="50" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#274e13">START</text>
  <line x1="210" y1="54" x2="210" y2="92" stroke="#333" stroke-width="2"/>
  <polygon points="210,54 210,72 240,63" fill="#38761d"/>
  <line x1="210" y1="92" x2="210" y2="104" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="520" y="52" width="340" height="530" rx="10" fill="#f1f1f1" stroke="#777777" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="690" y="70" text-anchor="middle" font-size="11" font-weight="bold" fill="#444">SQL Server (outside .NET) — the Customers table</text>
  <text x="690" y="84" text-anchor="middle" font-size="9.5" font-style="italic" fill="#777">the dispenser and the guard at work</text>
  <rect x="60" y="104" width="300" height="58" rx="8" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1.5"/>
  <text x="210" y="126" text-anchor="middle" font-size="10" font-weight="bold" fill="#274e13">DropAllTables();</text>
  <text x="210" y="143" text-anchor="middle" font-size="9.5" fill="#555">start fresh</text>
  <line x1="210" y1="162" x2="210" y2="204" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="218" y="186" font-size="9" font-style="italic" fill="#555">Console.WriteLine: "(Starting fresh: ...)"</text>
  <rect x="540" y="104" width="300" height="58" rx="8" fill="#f1f1f1" stroke="#777777" stroke-width="1.5"/>
  <text x="690" y="137.0" text-anchor="middle" font-size="9.5" fill="#333">no Customers table yet</text>
  <line x1="360" y1="124" x2="538" y2="124" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="449" y="118" text-anchor="middle" font-size="9.5" fill="#555">drops old tables</text>
  <rect x="60" y="204" width="300" height="58" rx="8" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1.5"/>
  <text x="210" y="226" text-anchor="middle" font-size="10" font-weight="bold" fill="#274e13">Execute(createCustomers);</text>
  <text x="210" y="243" text-anchor="middle" font-size="9.5" fill="#555">CustomerId INT IDENTITY ... PRIMARY KEY</text>
  <line x1="210" y1="262" x2="210" y2="304" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="218" y="286" font-size="9" font-style="italic" fill="#555">Console.WriteLine: the SQL text</text>
  <rect x="540" y="204" width="300" height="58" rx="8" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1.5"/>
  <text x="690" y="223" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#274e13">ticket dispenser: IDENTITY(1,1)</text>
  <text x="690" y="239" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#274e13">guard on the door: PK_Customers</text>
  <text x="690" y="255" text-anchor="middle" font-size="9.5" fill="#333">unique, never NULL</text>
  <line x1="360" y1="224" x2="538" y2="224" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="449" y="218" text-anchor="middle" font-size="9.5" fill="#555">installs the dispenser</text>
  <line x1="538" y1="250" x2="362" y2="250" stroke="#333" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="449" y="246" text-anchor="middle" font-size="9.5" fill="#555">-1</text>
  <rect x="60" y="304" width="300" height="58" rx="8" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1.5"/>
  <text x="210" y="326" text-anchor="middle" font-size="10" font-weight="bold" fill="#274e13">Execute(INSERT 3 rows);  Query(...);</text>
  <text x="210" y="343" text-anchor="middle" font-size="9.5" fill="#555">no id typed: the server numbers the rows</text>
  <line x1="210" y1="362" x2="210" y2="404" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="218" y="386" font-size="9" font-style="italic" fill="#555">Console.WriteLine: SQL text and grid, twice</text>
  <rect x="540" y="304" width="300" height="58" rx="8" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
  <text x="690" y="323" text-anchor="middle" font-size="9.5" fill="#333">1 | Asha Rao</text>
  <text x="690" y="339" text-anchor="middle" font-size="9.5" fill="#333">2 | Ben Carter</text>
  <text x="690" y="355" text-anchor="middle" font-size="9.5" fill="#333">3 | Chen Li</text>
  <line x1="360" y1="324" x2="538" y2="324" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="449" y="318" text-anchor="middle" font-size="9.5" fill="#555">3 rows, no ids given</text>
  <line x1="538" y1="350" x2="362" y2="350" stroke="#333" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="449" y="346" text-anchor="middle" font-size="9.5" fill="#555">ids 1, 2, 3</text>
  <rect x="60" y="404" width="300" height="58" rx="8" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1.5"/>
  <text x="210" y="426" text-anchor="middle" font-size="10" font-weight="bold" fill="#274e13">Execute(second Asha Rao);  Query(...);</text>
  <text x="210" y="443" text-anchor="middle" font-size="9.5" fill="#555">same NAME, different person: allowed</text>
  <line x1="210" y1="462" x2="210" y2="504" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="218" y="486" font-size="9" font-style="italic" fill="#555">Console.WriteLine: SQL text and grid, twice</text>
  <rect x="540" y="404" width="300" height="58" rx="8" fill="#e8f4fb" stroke="#3d85c6" stroke-width="1.5"/>
  <text x="690" y="423" text-anchor="middle" font-size="9.5" fill="#333">1 | Asha Rao | asha@example.com</text>
  <text x="690" y="439" text-anchor="middle" font-size="9.5" fill="#333">4 | Asha Rao | asha.rao@other.example</text>
  <text x="690" y="455" text-anchor="middle" font-size="9.5" fill="#333">names may repeat; ids may not</text>
  <line x1="360" y1="424" x2="538" y2="424" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="449" y="418" text-anchor="middle" font-size="9.5" fill="#555">another Asha Rao</text>
  <line x1="538" y1="450" x2="362" y2="450" stroke="#333" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="449" y="446" text-anchor="middle" font-size="9.5" fill="#555">she gets ticket 4</text>
  <rect x="60" y="504" width="300" height="58" rx="8" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1.5"/>
  <text x="210" y="526" text-anchor="middle" font-size="10" font-weight="bold" fill="#274e13">Refused(forceDuplicateId);</text>
  <text x="210" y="543" text-anchor="middle" font-size="9.5" fill="#555">IDENTITY_INSERT ON, then try id 1 again</text>
  <text x="218" y="586" font-size="9" font-style="italic" fill="#555">Console.WriteLine: message, SQL text, error line (2627)</text>
  <rect x="540" y="504" width="300" height="58" rx="8" fill="#fdeaea" stroke="#cc0000" stroke-width="1.5"/>
  <text x="690" y="523" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#990000">guard says NO: id 1 is taken</text>
  <text x="690" y="539" text-anchor="middle" font-size="9.5" fill="#333">the row "Impostor" is not stored</text>
  <text x="690" y="555" text-anchor="middle" font-size="9.5" fill="#333">table still has 4 customers</text>
  <line x1="360" y1="524" x2="538" y2="524" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="449" y="518" text-anchor="middle" font-size="9.5" fill="#555">forces id 1 in</text>
  <line x1="538" y1="550" x2="362" y2="550" stroke="#333" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="449" y="546" text-anchor="middle" font-size="9.5" fill="#555">error number 2627</text>
  <line x1="210" y1="562" x2="210" y2="602" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="210" y="614" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#990000">END</text>
  <line x1="210" y1="622" x2="210" y2="662" stroke="#333" stroke-width="2"/>
  <polygon points="210,622 210,640 240,631" fill="#cc0000"/>
  <text x="30" y="684" font-size="10.5" fill="#444"><tspan font-weight="bold">The PRIMARY KEY is the guard: </tspan>the same CustomerId can never appear on two rows, and a name cannot do that job.</text>
  <text x="30" y="702" font-size="10" font-style="italic" fill="#888">Execute / Query / Refused print the SQL first, one Console.WriteLine per line ("sql&gt; ..."); Query then prints a grid, Refused an error line.</text>
  <text x="30" y="720" font-size="10" font-style="italic" fill="#888">Each method also opens with PrintHeading() (a blank line and a title: 2 Console.WriteLine calls, not drawn).</text>
</svg>
