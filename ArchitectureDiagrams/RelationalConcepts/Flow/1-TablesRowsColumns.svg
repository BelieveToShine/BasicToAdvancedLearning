<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 834" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#333"/></marker>
  </defs>
  <rect x="0" y="0" width="900" height="834" fill="#ffffff"/>
  <text x="450.0" y="20" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a237e">Tables, rows and columns — Sub-level Flow: a ledger book</text>
  <text x="450.0" y="38" text-anchor="middle" font-size="11" fill="#666">First the page is ruled into columns, then rows are written in, then we read the page back.</text>
  <text x="210" y="50" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#274e13">START</text>
  <line x1="210" y1="54" x2="210" y2="92" stroke="#333" stroke-width="2"/>
  <polygon points="210,54 210,72 240,63" fill="#38761d"/>
  <line x1="210" y1="92" x2="210" y2="104" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="520" y="52" width="340" height="630" rx="10" fill="#f1f1f1" stroke="#777777" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="690" y="70" text-anchor="middle" font-size="11" font-weight="bold" fill="#444">SQL Server (outside .NET) — the Customers table</text>
  <text x="690" y="84" text-anchor="middle" font-size="9.5" font-style="italic" fill="#777">what the table holds after each step</text>
  <rect x="60" y="104" width="300" height="58" rx="8" fill="#e8f4fb" stroke="#3d85c6" stroke-width="1.5"/>
  <text x="210" y="126" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a4a73">DropAllTables();</text>
  <text x="210" y="143" text-anchor="middle" font-size="9.5" fill="#555">start fresh: drop old lesson tables</text>
  <line x1="210" y1="162" x2="210" y2="204" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="218" y="186" font-size="9" font-style="italic" fill="#555">Console.WriteLine: "(Starting fresh: ...)"</text>
  <rect x="540" y="104" width="300" height="58" rx="8" fill="#f1f1f1" stroke="#777777" stroke-width="1.5"/>
  <text x="690" y="123" text-anchor="middle" font-size="9.5" fill="#333">no Customers table yet</text>
  <text x="690" y="139" text-anchor="middle" font-size="9.5" fill="#333">(a clean shelf)</text>
  <line x1="360" y1="124" x2="538" y2="124" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="449" y="118" text-anchor="middle" font-size="9.5" fill="#555">drops old tables</text>
  <rect x="60" y="204" width="300" height="58" rx="8" fill="#e8f4fb" stroke="#3d85c6" stroke-width="1.5"/>
  <text x="210" y="226" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a4a73">Execute(createCustomers);</text>
  <text x="210" y="243" text-anchor="middle" font-size="9.5" fill="#555">CREATE TABLE: 3 columns, 3 types</text>
  <line x1="210" y1="262" x2="210" y2="304" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="218" y="286" font-size="9" font-style="italic" fill="#555">Console.WriteLine: the SQL text</text>
  <rect x="540" y="204" width="300" height="58" rx="8" fill="#e8f4fb" stroke="#3d85c6" stroke-width="1.5"/>
  <text x="690" y="223" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#1a4a73">page ruled: CustomerId INT |</text>
  <text x="690" y="239" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#1a4a73">FullName NVARCHAR(100) | Email NVARCHAR(200)</text>
  <text x="690" y="255" text-anchor="middle" font-size="9.5" fill="#333">0 rows</text>
  <line x1="360" y1="224" x2="538" y2="224" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="449" y="218" text-anchor="middle" font-size="9.5" fill="#555">sends CREATE TABLE</text>
  <line x1="538" y1="250" x2="362" y2="250" stroke="#333" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="449" y="246" text-anchor="middle" font-size="9.5" fill="#555">-1 (no rows involved)</text>
  <rect x="60" y="304" width="300" height="58" rx="8" fill="#e8f4fb" stroke="#3d85c6" stroke-width="1.5"/>
  <text x="210" y="326" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a4a73">Execute(insertCustomers);</text>
  <text x="210" y="343" text-anchor="middle" font-size="9.5" fill="#555">INSERT: three rows in one statement</text>
  <line x1="210" y1="362" x2="210" y2="404" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="218" y="386" font-size="9" font-style="italic" fill="#555">Console.WriteLine: the SQL text</text>
  <rect x="540" y="304" width="300" height="58" rx="8" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1.5"/>
  <text x="690" y="323" text-anchor="middle" font-size="9.5" fill="#333">1 | Asha Rao | asha@example.com</text>
  <text x="690" y="339" text-anchor="middle" font-size="9.5" fill="#333">2 | Ben Carter | ben@example.com</text>
  <text x="690" y="355" text-anchor="middle" font-size="9.5" fill="#333">3 | Chen Li | chen@example.com</text>
  <line x1="360" y1="324" x2="538" y2="324" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="449" y="318" text-anchor="middle" font-size="9.5" fill="#555">sends INSERT</text>
  <line x1="538" y1="350" x2="362" y2="350" stroke="#333" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="449" y="346" text-anchor="middle" font-size="9.5" fill="#555">3 (rows added)</text>
  <rect x="60" y="404" width="300" height="58" rx="8" fill="#e8f4fb" stroke="#3d85c6" stroke-width="1.5"/>
  <text x="210" y="426" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a4a73">Query("SELECT ... ORDER BY CustomerId");</text>
  <text x="210" y="443" text-anchor="middle" font-size="9.5" fill="#555">read the rows back, in a stated order</text>
  <line x1="210" y1="462" x2="210" y2="504" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="218" y="486" font-size="9" font-style="italic" fill="#555">Console.WriteLine: SQL text, grid, "(3 rows)"</text>
  <rect x="540" y="404" width="300" height="58" rx="8" fill="#fffbe8" stroke="#f1c232" stroke-width="1.5"/>
  <text x="690" y="423" text-anchor="middle" font-size="9.5" fill="#333">SELECT only reads: the table</text>
  <text x="690" y="439" text-anchor="middle" font-size="9.5" fill="#333">is unchanged (still 3 rows)</text>
  <line x1="360" y1="424" x2="538" y2="424" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="449" y="418" text-anchor="middle" font-size="9.5" fill="#555">sends SELECT</text>
  <line x1="538" y1="450" x2="362" y2="450" stroke="#333" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="449" y="446" text-anchor="middle" font-size="9.5" fill="#555">a grid: 3 rows</text>
  <rect x="60" y="504" width="300" height="58" rx="8" fill="#e8f4fb" stroke="#3d85c6" stroke-width="1.5"/>
  <text x="210" y="526" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a4a73">Query(INFORMATION_SCHEMA.COLUMNS ...);</text>
  <text x="210" y="543" text-anchor="middle" font-size="9.5" fill="#555">ask the server to describe the columns</text>
  <line x1="210" y1="562" x2="210" y2="604" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="218" y="586" font-size="9" font-style="italic" fill="#555">Console.WriteLine: heading line, SQL text, grid</text>
  <rect x="540" y="504" width="300" height="58" rx="8" fill="#f0eaf7" stroke="#8e63ce" stroke-width="1.5"/>
  <text x="690" y="523" text-anchor="middle" font-size="9.5" fill="#333">CustomerId: int | FullName: nvarchar(100)</text>
  <text x="690" y="539" text-anchor="middle" font-size="9.5" fill="#333">Email: nvarchar(200)</text>
  <line x1="360" y1="524" x2="538" y2="524" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="449" y="518" text-anchor="middle" font-size="9.5" fill="#555">asks about the columns</text>
  <line x1="538" y1="550" x2="362" y2="550" stroke="#333" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="449" y="546" text-anchor="middle" font-size="9.5" fill="#555">3 rows: name, type, size</text>
  <rect x="60" y="604" width="300" height="58" rx="8" fill="#e8f4fb" stroke="#3d85c6" stroke-width="1.5"/>
  <text x="210" y="626" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a4a73">Execute(duplicateAsha);  Query(...);</text>
  <text x="210" y="643" text-anchor="middle" font-size="9.5" fill="#555">customer 1 added a second time</text>
  <text x="218" y="686" font-size="9" font-style="italic" fill="#555">Console.WriteLine: message, SQL text, grid, closing message</text>
  <rect x="540" y="604" width="300" height="58" rx="8" fill="#fdeaea" stroke="#cc0000" stroke-width="1.5"/>
  <text x="690" y="623" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#990000">customer 1 now appears twice</text>
  <text x="690" y="639" text-anchor="middle" font-size="9.5" fill="#333">4 rows; no rule said "no"</text>
  <line x1="360" y1="624" x2="538" y2="624" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="449" y="618" text-anchor="middle" font-size="9.5" fill="#555">sends a duplicate INSERT</text>
  <line x1="538" y1="650" x2="362" y2="650" stroke="#333" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="449" y="646" text-anchor="middle" font-size="9.5" fill="#555">accepted: no error</text>
  <line x1="210" y1="662" x2="210" y2="702" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="210" y="714" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#990000">END</text>
  <line x1="210" y1="722" x2="210" y2="762" stroke="#333" stroke-width="2"/>
  <polygon points="210,722 210,740 240,731" fill="#cc0000"/>
  <text x="30" y="784" font-size="10.5" fill="#444"><tspan font-weight="bold">Nothing in this table forbids two rows with CustomerId 1: </tspan>that gap is what primary keys (next method) close.</text>
  <text x="30" y="802" font-size="10" font-style="italic" fill="#888">Execute / Query / Refused print the SQL first, one Console.WriteLine per line ("sql&gt; ..."); Query then prints a grid, Refused an error line.</text>
  <text x="30" y="820" font-size="10" font-style="italic" fill="#888">Each method also opens with PrintHeading() (a blank line and a title: 2 Console.WriteLine calls, not drawn).</text>
</svg>
