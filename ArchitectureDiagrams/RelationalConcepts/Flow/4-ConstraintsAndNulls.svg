<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 934" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#333"/></marker>
  </defs>
  <rect x="0" y="0" width="900" height="934" fill="#ffffff"/>
  <text x="450.0" y="20" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a237e">Constraints and NULL — Sub-level Flow: a form checker with rule stamps</text>
  <text x="450.0" y="38" text-anchor="middle" font-size="11" fill="#666">Every row is checked against the table's rules before it is stored; a value left empty is NULL, which is not the same as 0 or "".</text>
  <text x="210" y="50" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#274e13">START</text>
  <line x1="210" y1="54" x2="210" y2="92" stroke="#333" stroke-width="2"/>
  <polygon points="210,54 210,72 240,63" fill="#38761d"/>
  <line x1="210" y1="92" x2="210" y2="104" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="520" y="52" width="340" height="730" rx="10" fill="#f1f1f1" stroke="#777777" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="690" y="70" text-anchor="middle" font-size="11" font-weight="bold" fill="#444">SQL Server (outside .NET) — the rule checker</text>
  <text x="690" y="84" text-anchor="middle" font-size="9.5" font-style="italic" fill="#777">what each rule did to the row it was shown</text>
  <rect x="60" y="104" width="300" height="58" rx="8" fill="#fffbe8" stroke="#f1c232" stroke-width="1.5"/>
  <text x="210" y="126" text-anchor="middle" font-size="10" font-weight="bold" fill="#7f6000">DropAllTables(); Execute(create x 2);</text>
  <text x="210" y="143" text-anchor="middle" font-size="9.5" fill="#555">Customers and Accounts, with all their rules</text>
  <line x1="210" y1="162" x2="210" y2="204" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="218" y="186" font-size="9" font-style="italic" fill="#555">Console.WriteLine: "(Starting fresh...)", SQL text</text>
  <rect x="540" y="104" width="300" height="58" rx="8" fill="#fffbe8" stroke="#f1c232" stroke-width="1.5"/>
  <text x="690" y="123" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#7f6000">NOT NULL · UNIQUE · CHECK · DEFAULT</text>
  <text x="690" y="139" text-anchor="middle" font-size="9.5" fill="#333">stamped onto the columns</text>
  <text x="690" y="155" text-anchor="middle" font-size="9.5" fill="#333">FOREIGN KEY (as in method 3) is declared again</text>
  <line x1="360" y1="124" x2="538" y2="124" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="449" y="118" text-anchor="middle" font-size="9.5" fill="#555">sets up the rule stamps</text>
  <line x1="538" y1="150" x2="362" y2="150" stroke="#333" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="449" y="146" text-anchor="middle" font-size="9.5" fill="#555">-1, -1</text>
  <rect x="60" y="204" width="300" height="58" rx="8" fill="#fffbe8" stroke="#f1c232" stroke-width="1.5"/>
  <text x="210" y="226" text-anchor="middle" font-size="10" font-weight="bold" fill="#7f6000">Execute(Asha);  Execute(account);  Query(...);</text>
  <text x="210" y="243" text-anchor="middle" font-size="9.5" fill="#555">CreatedAt and Balance left out of the INSERTs</text>
  <line x1="210" y1="262" x2="210" y2="304" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="218" y="286" font-size="9" font-style="italic" fill="#555">Console.WriteLine: SQL text and grid</text>
  <rect x="540" y="204" width="300" height="58" rx="8" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1.5"/>
  <text x="690" y="223" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#274e13">DEFAULT filled the gaps:</text>
  <text x="690" y="239" text-anchor="middle" font-size="9.5" fill="#333">Balance 0.00</text>
  <text x="690" y="255" text-anchor="middle" font-size="9.5" fill="#333">CreatedAt got the current time</text>
  <line x1="360" y1="224" x2="538" y2="224" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="449" y="218" text-anchor="middle" font-size="9.5" fill="#555">columns left out</text>
  <line x1="538" y1="250" x2="362" y2="250" stroke="#333" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="449" y="246" text-anchor="middle" font-size="9.5" fill="#555">row stored; grid back</text>
  <rect x="60" y="304" width="300" height="58" rx="8" fill="#fffbe8" stroke="#f1c232" stroke-width="1.5"/>
  <text x="210" y="326" text-anchor="middle" font-size="10" font-weight="bold" fill="#7f6000">Refused(second Asha, same email);</text>
  <text x="210" y="343" text-anchor="middle" font-size="9.5" fill="#555">UNIQUE: no two customers share an email</text>
  <line x1="210" y1="362" x2="210" y2="404" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="218" y="386" font-size="9" font-style="italic" fill="#555">Console.WriteLine: message, SQL text, error line (2627)</text>
  <rect x="540" y="304" width="300" height="58" rx="8" fill="#fdeaea" stroke="#cc0000" stroke-width="1.5"/>
  <text x="690" y="323" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#990000">UNIQUE stamp says NO</text>
  <text x="690" y="339" text-anchor="middle" font-size="9.5" fill="#333">nothing stored</text>
  <line x1="360" y1="324" x2="538" y2="324" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="449" y="318" text-anchor="middle" font-size="9.5" fill="#555">duplicate email</text>
  <line x1="538" y1="350" x2="362" y2="350" stroke="#333" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="449" y="346" text-anchor="middle" font-size="9.5" fill="#555">error number 2627</text>
  <rect x="60" y="404" width="300" height="58" rx="8" fill="#fffbe8" stroke="#f1c232" stroke-width="1.5"/>
  <text x="210" y="426" text-anchor="middle" font-size="10" font-weight="bold" fill="#7f6000">Refused(customer with NULL name);</text>
  <text x="210" y="443" text-anchor="middle" font-size="9.5" fill="#555">NOT NULL: a name is required</text>
  <line x1="210" y1="462" x2="210" y2="504" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="218" y="486" font-size="9" font-style="italic" fill="#555">Console.WriteLine: message, SQL text, error line (515)</text>
  <rect x="540" y="404" width="300" height="58" rx="8" fill="#fdeaea" stroke="#cc0000" stroke-width="1.5"/>
  <text x="690" y="423" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#990000">NOT NULL stamp says NO</text>
  <text x="690" y="439" text-anchor="middle" font-size="9.5" fill="#333">nothing stored</text>
  <line x1="360" y1="424" x2="538" y2="424" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="449" y="418" text-anchor="middle" font-size="9.5" fill="#555">FullName left as NULL</text>
  <line x1="538" y1="450" x2="362" y2="450" stroke="#333" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="449" y="446" text-anchor="middle" font-size="9.5" fill="#555">error number 515</text>
  <rect x="60" y="504" width="300" height="58" rx="8" fill="#fffbe8" stroke="#f1c232" stroke-width="1.5"/>
  <text x="210" y="526" text-anchor="middle" font-size="10" font-weight="bold" fill="#7f6000">Refused(account type 'Gold');</text>
  <text x="210" y="543" text-anchor="middle" font-size="9.5" fill="#555">CHECK: only Savings or Current</text>
  <line x1="210" y1="562" x2="210" y2="604" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="218" y="586" font-size="9" font-style="italic" fill="#555">Console.WriteLine: message, SQL text, error line (547)</text>
  <rect x="540" y="504" width="300" height="58" rx="8" fill="#fdeaea" stroke="#cc0000" stroke-width="1.5"/>
  <text x="690" y="523" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#990000">CHECK stamp says NO</text>
  <text x="690" y="539" text-anchor="middle" font-size="9.5" fill="#333">nothing stored</text>
  <line x1="360" y1="524" x2="538" y2="524" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="449" y="518" text-anchor="middle" font-size="9.5" fill="#555">AccountType = 'Gold'</text>
  <line x1="538" y1="550" x2="362" y2="550" stroke="#333" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="449" y="546" text-anchor="middle" font-size="9.5" fill="#555">error number 547</text>
  <rect x="60" y="604" width="300" height="58" rx="8" fill="#fffbe8" stroke="#f1c232" stroke-width="1.5"/>
  <text x="210" y="626" text-anchor="middle" font-size="10" font-weight="bold" fill="#7f6000">ShowWhatNullMeans();  (part 1)</text>
  <text x="210" y="643" text-anchor="middle" font-size="9.5" fill="#555">ALTER ADD Phone (optional); 3 customers</text>
  <line x1="210" y1="662" x2="210" y2="704" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="218" y="686" font-size="9" font-style="italic" fill="#555">Console.WriteLine: message, SQL text, grid</text>
  <rect x="540" y="604" width="300" height="58" rx="8" fill="#e8f4fb" stroke="#3d85c6" stroke-width="1.5"/>
  <text x="690" y="623" text-anchor="middle" font-size="9.5" fill="#333">Asha: 555-0101 (a value)</text>
  <text x="690" y="639" text-anchor="middle" font-size="9.5" fill="#333">Ben: NULL (no value at all)</text>
  <text x="690" y="655" text-anchor="middle" font-size="9.5" fill="#333">Chen: "" (empty text, length 0)</text>
  <line x1="360" y1="624" x2="538" y2="624" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="449" y="618" text-anchor="middle" font-size="9.5" fill="#555">Phone: value, NULL, empty text</text>
  <line x1="538" y1="650" x2="362" y2="650" stroke="#333" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="449" y="646" text-anchor="middle" font-size="9.5" fill="#555">grid: 3 rows</text>
  <rect x="60" y="704" width="300" height="58" rx="8" fill="#fffbe8" stroke="#f1c232" stroke-width="1.5"/>
  <text x="210" y="726" text-anchor="middle" font-size="10" font-weight="bold" fill="#7f6000">ShowWhatNullMeans();  (part 2)</text>
  <text x="210" y="743" text-anchor="middle" font-size="9.5" fill="#555">= NULL, IS NULL and = ''</text>
  <text x="218" y="786" font-size="9" font-style="italic" fill="#555">Console.WriteLine: three messages, SQL text, 3 grids</text>
  <rect x="540" y="704" width="300" height="58" rx="8" fill="#f0eaf7" stroke="#8e63ce" stroke-width="1.5"/>
  <text x="690" y="723" text-anchor="middle" font-size="9.5" fill="#333">= NULL  -&gt;  nobody</text>
  <text x="690" y="739" text-anchor="middle" font-size="9.5" fill="#333">IS NULL  -&gt;  Ben Carter</text>
  <text x="690" y="755" text-anchor="middle" font-size="9.5" fill="#333">= ''  -&gt;  Chen Li</text>
  <line x1="360" y1="724" x2="538" y2="724" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="449" y="718" text-anchor="middle" font-size="9.5" fill="#555">three WHERE tests</text>
  <line x1="538" y1="750" x2="362" y2="750" stroke="#333" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="449" y="746" text-anchor="middle" font-size="9.5" fill="#555">0 rows, Ben, Chen</text>
  <line x1="210" y1="762" x2="210" y2="802" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="210" y="814" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#990000">END</text>
  <line x1="210" y1="822" x2="210" y2="862" stroke="#333" stroke-width="2"/>
  <polygon points="210,822 210,840 240,831" fill="#cc0000"/>
  <text x="30" y="884" font-size="10.5" fill="#444"><tspan font-weight="bold">Constraints live in the database, so every program that writes to it obeys them: </tspan>errors 2627, 515 and 547 are SQL Server's own numbers.</text>
  <text x="30" y="902" font-size="10" font-style="italic" fill="#888">Execute / Query / Refused print the SQL first, one Console.WriteLine per line ("sql&gt; ..."); Query then prints a grid, Refused an error line.</text>
  <text x="30" y="920" font-size="10" font-style="italic" fill="#888">Each method also opens with PrintHeading() (a blank line and a title: 2 Console.WriteLine calls, not drawn).</text>
</svg>
