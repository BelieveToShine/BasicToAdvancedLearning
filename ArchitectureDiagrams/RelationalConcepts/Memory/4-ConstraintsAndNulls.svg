  <text x="676" y="302" font-size="9.5" fill="#333333">ben@example.com</text>
  <text x="816" y="302" font-size="9.5" fill="#333333">NULL  (no value)</text>
  <text x="476" y="318" font-size="9.5" fill="#333333">3</text>
  <text x="566" y="318" font-size="9.5" fill="#333333">Chen Li</text>
  <text x="676" y="318" font-size="9.5" fill="#333333">chen@example.com</text>
