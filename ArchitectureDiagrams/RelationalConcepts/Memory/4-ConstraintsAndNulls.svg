  <text x="1064" y="342" text-anchor="end" font-size="9" font-style="italic" fill="#777777">Balance came from DEFAULT 0</text>
  <text x="476" y="359" font-size="9.5" font-weight="bold" fill="#555555">AccountId</text>
  <text x="546" y="359" font-size="9.5" font-weight="bold" fill="#555555">CustomerId</text>
  <text x="626" y="359" font-size="9.5" font-weight="bold" fill="#555555">AccountNumber</text>
