  <text x="476" y="376" font-size="9.5" fill="#333333">1</text>
  <text x="546" y="376" font-size="9.5" fill="#333333">1</text>
  <text x="626" y="376" font-size="9.5" fill="#333333">ACC-1001</text>
  <text x="726" y="376" font-size="9.5" fill="#333333">Savings</text>
  <text x="826" y="376" font-size="9.5" fill="#333333">0.00</text>
  <text x="476" y="400" font-size="9.5" font-weight="bold" fill="#cc0000">Refused, never stored:  duplicate email (2627) · NULL FullName (515) · AccountType 'Gold' (547).</text>
  <rect x="1100" y="118" width="90" height="130" rx="10" fill="#d5c9ea" stroke="#674ea7" stroke-width="1.5" stroke-dasharray="6 4" fill-opacity="0.25"/>
  <text x="1145" y="150" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#3d2a6b">Nothing</text>
  <text x="1145" y="166" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#3d2a6b">here yet</text>
  <text x="40" y="432" font-size="10.5" fill="#444"><tspan font-weight="bold">Every rule is checked inside SQL Server, so this method needs no variables: </tspan>each SQL string is passed straight to a helper, and only text, row counts and error numbers cross back into .NET.</text>
  <text x="40" y="450" font-size="10" font-style="italic" fill="#888">NULL is a missing value, empty text is a value of length 0, and neither is the number 0. Ben has NULL (never given), Chen has empty text.</text>
</svg>
