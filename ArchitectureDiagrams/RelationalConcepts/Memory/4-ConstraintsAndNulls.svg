  <text x="220" y="272" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#4c6b4c">Program.cs (Main)</text>
  <text x="220" y="288" text-anchor="middle" font-size="9.5" fill="#6b8a6b">paused — waiting for topic.Explain() to return</text>
  <rect x="460" y="144" width="440" height="46" rx="8" fill="none" stroke="#e69138" stroke-width="1.5" stroke-dasharray="6 4" fill-opacity="0"/>
  <text x="680.0" y="164" text-anchor="middle" font-size="10" font-weight="bold" fill="#8a5a10">No local variable points into the Heap —</text>
  <text x="680.0" y="179" text-anchor="middle" font-size="9.5" font-style="italic" fill="#8a5a10">this method declares no local variables.</text>
  <rect x="460" y="210" width="620" height="198" rx="10" fill="#f1f1f1" stroke="#777777" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="770.0" y="230" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#444444">OUTSIDE .NET — SQL Server: Customers (with an optional Phone) and Accounts</text>
  <text x="476" y="252" font-size="10" font-weight="bold" fill="#333333">Customers</text>
  <text x="1064" y="252" text-anchor="end" font-size="9" font-style="italic" fill="#777777">CreatedAt (not shown): filled in by DEFAULT on every row</text>
  <text x="476" y="269" font-size="9.5" font-weight="bold" fill="#555555">CustomerId</text>
  <text x="566" y="269" font-size="9.5" font-weight="bold" fill="#555555">FullName</text>
  <text x="676" y="269" font-size="9.5" font-weight="bold" fill="#555555">Email</text>
  <text x="816" y="269" font-size="9.5" font-weight="bold" fill="#555555">Phone</text>
