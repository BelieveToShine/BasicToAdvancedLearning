  <text x="40" y="448" font-size="10.5" fill="#444"><tspan font-weight="bold">deleted is a plain int on the Stack: </tspan>the number of rows SQL Server reported for the DELETE of Chen. The link between tables is not a pointer in .NET memory.</text>
  <text x="40" y="466" font-size="10" font-style="italic" fill="#888">The link is a stored number: Accounts.CustomerId holds a CustomerId, and SQL Server checks it. One customer (Asha, id 1) is the parent of two account rows.</text>
