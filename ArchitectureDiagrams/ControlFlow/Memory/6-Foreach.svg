<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 460" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#555"/></marker>
  </defs>
  <rect x="0" y="0" width="1120" height="460" fill="#ffffff"/>
  <text x="560" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a237e">Control Flow — Foreach — Memory: Stack / Heap / Static</text>
  <text x="560" y="46" text-anchor="middle" font-size="12" fill="#666">Snapshot: ControlFlowDemo.ExplainForeach() is currently executing (mid-loop, at element 1 — "Banana").</text>

  <g font-size="11" fill="#333">
    <rect x="220" y="60" width="14" height="14" rx="2" fill="#b6d7a8" stroke="#6aa84f"/><text x="240" y="71">Stack</text>
    <rect x="400" y="60" width="14" height="14" rx="2" fill="#f9cb9c" stroke="#e69138"/><text x="420" y="71">Heap</text>
    <rect x="580" y="60" width="14" height="14" rx="2" fill="#d5c9ea" stroke="#674ea7"/><text x="600" y="71">Static</text>
  </g>

  <text x="220" y="96" text-anchor="middle" font-size="12" font-weight="bold" fill="#3f6b3f">STACK</text>
  <text x="675" y="96" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a5a10">HEAP — two hops from the Stack</text>
  <text x="1025" y="96" text-anchor="middle" font-size="12" font-weight="bold" fill="#3d2a6b">STATIC</text>

  <rect x="30" y="108" width="380" height="240" rx="10" fill="none" stroke="#999" stroke-width="1" stroke-dasharray="5 4"/>

  <rect x="50" y="118" width="340" height="100" rx="8" fill="#b6d7a8" stroke="#6aa84f" stroke-width="2"/>
  <text x="220" y="136" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#274e13">ControlFlowDemo.ExplainForeach() — ACTIVE</text>
  <rect x="62" y="146" width="316" height="26" rx="4" fill="#ffffff" stroke="#8fbf8f"/>
  <text x="70" y="163" font-size="10" fill="#1b3d1b">fruits → pointer  (string[])</text>
  <rect x="62" y="176" width="316" height="26" rx="4" fill="#ffffff" stroke="#8fbf8f"/>
  <text x="70" y="193" font-size="10" fill="#1b3d1b">fruit → pointer, refreshed each lap  (string)</text>

  <rect x="50" y="228" width="340" height="50" rx="8" fill="#dcecdc" stroke="#6aa84f" stroke-width="1.5"/>
  <text x="220" y="248" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#4c6b4c">ControlFlowExample.Explain()</text>
  <text x="220" y="264" text-anchor="middle" font-size="9.5" fill="#6b8a6b">paused — waiting for the call above to return</text>

  <rect x="50" y="288" width="340" height="50" rx="8" fill="#dcecdc" stroke="#6aa84f" stroke-width="1.5"/>
  <text x="220" y="308" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#4c6b4c">Program.cs (Main)</text>
  <text x="220" y="324" text-anchor="middle" font-size="9.5" fill="#6b8a6b">paused — waiting for topic.Explain() to return</text>

  <!-- Heap group -->
  <rect x="430" y="108" width="490" height="240" rx="10" fill="none" stroke="#999" stroke-width="1" stroke-dasharray="5 4"/>

  <line x1="392" y1="159" x2="448" y2="150" stroke="#555" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="450" y="122" width="450" height="110" rx="8" fill="#f9cb9c" stroke="#e69138" stroke-width="1.5"/>
  <text x="675" y="142" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7f4e00">string[] fruits — the array object</text>
  <rect x="535" y="152" width="80" height="60" rx="4" fill="#fff3e6" stroke="#e69138"/><text x="575" y="186" text-anchor="middle" font-size="10" fill="#7f4e00">[0]</text>
  <rect x="635" y="152" width="80" height="60" rx="4" fill="#fff3e6" stroke="#e69138"/><text x="675" y="186" text-anchor="middle" font-size="10" fill="#7f4e00">[1]</text>
  <rect x="735" y="152" width="80" height="60" rx="4" fill="#fff3e6" stroke="#e69138"/><text x="775" y="186" text-anchor="middle" font-size="10" fill="#7f4e00">[2]</text>
  <text x="675" y="224" text-anchor="middle" font-size="8.5" fill="#a06a1f">each [ ] cell holds a POINTER, not the text itself</text>

  <line x1="575" y1="212" x2="575" y2="240" stroke="#555" stroke-width="1.2" marker-end="url(#a)"/>
  <line x1="675" y1="212" x2="675" y2="240" stroke="#555" stroke-width="1.2" marker-end="url(#a)"/>
  <line x1="775" y1="212" x2="775" y2="240" stroke="#555" stroke-width="1.2" marker-end="url(#a)"/>

  <rect x="535" y="242" width="80" height="54" rx="6" fill="#f9cb9c" stroke="#e69138" stroke-width="1.5"/><text x="575" y="273" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7f4e00">"Apple"</text>
  <rect x="635" y="242" width="80" height="54" rx="6" fill="#fdebc4" stroke="#7f4e00" stroke-width="3"/><text x="675" y="273" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7f4e00">"Banana"</text>
  <rect x="735" y="242" width="80" height="54" rx="6" fill="#f9cb9c" stroke="#e69138" stroke-width="1.5"/><text x="775" y="273" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7f4e00">"Cherry"</text>
  <text x="675" y="316" text-anchor="middle" font-size="9.5" fill="#7f4e00">↑ fruit points HERE right now (bold border = current)</text>

  <line x1="392" y1="192" x2="633" y2="264" stroke="#674ea7" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#a)"/>

  <!-- Static -->
  <rect x="950" y="122" width="150" height="110" rx="10" fill="#d5c9ea" fill-opacity="0.25" stroke="#674ea7" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="1025" y="150" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#3d2a6b">Nothing here yet</text>
  <text x="1025" y="176" text-anchor="middle" font-size="9.5" fill="#5b4a7a">No static fields</text>
  <text x="1025" y="192" text-anchor="middle" font-size="9.5" fill="#5b4a7a">in this topic yet.</text>

  <text x="40" y="380" font-size="10.5" fill="#444"><tspan font-weight="bold">Two hops, not one:</tspan> fruits (Stack) → the array object (Heap) → the actual string object for the current element (also Heap). Array cells holding a reference type are pointers, never the data itself.</text>
  <text x="40" y="400" font-size="10" font-style="italic" fill="#888">fruit is a FRESH binding each lap (unlike the for-loop's i, which reuses one slot — see Memory/3-ForLoop.svg) — matters if you ever capture it in a lambda.</text>
</svg>
