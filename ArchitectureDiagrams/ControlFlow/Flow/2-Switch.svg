<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 600" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#555"/></marker>
  </defs>
  <rect x="0" y="0" width="950" height="600" fill="#ffffff"/>
  <text x="475" y="22" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a237e">Switch — Sub-level Flow</text>
  <text x="475" y="42" text-anchor="middle" font-size="12" fill="#666">A multi-way jump, not a chain of checks — it goes straight to the matching case and runs ONLY that one.</text>

  <ellipse cx="475" cy="90" rx="130" ry="24" fill="#d9ead3" stroke="#38761d" stroke-width="1.5"/>
  <text x="475" y="95" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#274e13">Start: ExplainSwitch()</text>
  <line x1="475" y1="114" x2="475" y2="138" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="325" y="140" width="300" height="60" rx="10" fill="#fdebd9" stroke="#e69138" stroke-width="1.5"/>
  <text x="475" y="165" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a5a10">switch (dayNumber)</text>
  <text x="475" y="182" text-anchor="middle" font-size="10" fill="#8a5a10">dayNumber = 3</text>

  <!-- Distribution bus — straight lines only, one drop per case -->
  <line x1="475" y1="200" x2="475" y2="224" stroke="#555" stroke-width="1.4"/>
  <line x1="115" y1="224" x2="795" y2="224" stroke="#555" stroke-width="1.4"/>
  <line x1="115" y1="224" x2="115" y2="256" stroke="#999" stroke-width="1.2" marker-end="url(#a)"/>
  <line x1="285" y1="224" x2="285" y2="256" stroke="#999" stroke-width="1.2" marker-end="url(#a)"/>
  <line x1="455" y1="224" x2="455" y2="256" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
  <line x1="625" y1="224" x2="625" y2="256" stroke="#999" stroke-width="1.2" marker-end="url(#a)"/>
  <line x1="795" y1="224" x2="795" y2="256" stroke="#999" stroke-width="1.2" marker-end="url(#a)"/>

  <rect x="40" y="258" width="150" height="90" rx="8" fill="#f2f2f2" stroke="#bbb" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="115" y="280" text-anchor="middle" font-size="10" font-weight="bold" fill="#777">case 1:</text>
  <text x="115" y="296" text-anchor="middle" font-size="10" fill="#777">Monday</text>
  <text x="115" y="332" text-anchor="middle" font-size="9" font-style="italic" fill="#999">(skipped)</text>

  <rect x="210" y="258" width="150" height="90" rx="8" fill="#f2f2f2" stroke="#bbb" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="285" y="280" text-anchor="middle" font-size="10" font-weight="bold" fill="#777">case 2:</text>
  <text x="285" y="296" text-anchor="middle" font-size="10" fill="#777">Tuesday</text>
  <text x="285" y="332" text-anchor="middle" font-size="9" font-style="italic" fill="#999">(skipped)</text>

  <rect x="380" y="258" width="150" height="90" rx="8" fill="#cfe2f3" stroke="#3d85c6" stroke-width="2.2"/>
  <text x="455" y="280" text-anchor="middle" font-size="10" font-weight="bold" fill="#123">case 3:</text>
  <text x="455" y="296" text-anchor="middle" font-size="10" font-weight="bold" fill="#123">Wednesday</text>
  <text x="455" y="332" text-anchor="middle" font-size="9" font-weight="bold" fill="#0b5cab">← MATCHES, prints this</text>

  <rect x="550" y="258" width="150" height="90" rx="8" fill="#f2f2f2" stroke="#bbb" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="625" y="280" text-anchor="middle" font-size="10" font-weight="bold" fill="#777">case 6 or 7:</text>
  <text x="625" y="296" text-anchor="middle" font-size="10" fill="#777">Weekend</text>
  <text x="625" y="332" text-anchor="middle" font-size="9" font-style="italic" fill="#999">(skipped)</text>

  <rect x="720" y="258" width="150" height="90" rx="8" fill="#f2f2f2" stroke="#bbb" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="795" y="280" text-anchor="middle" font-size="10" font-weight="bold" fill="#777">default:</text>
  <text x="795" y="296" text-anchor="middle" font-size="10" fill="#777">Not a valid day</text>
  <text x="795" y="332" text-anchor="middle" font-size="9" font-style="italic" fill="#999">(skipped)</text>

  <text x="455" y="410" text-anchor="middle" font-size="10" fill="#333">break; (exits the switch — control does not fall into case 6/7 or default)</text>
  <line x1="455" y1="348" x2="455" y2="434" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>

  <ellipse cx="475" cy="460" rx="130" ry="24" fill="#f4cccc" stroke="#cc0000" stroke-width="1.5"/>
  <text x="475" y="465" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#990000">End</text>

  <text x="40" y="525" font-size="10.5" fill="#444"><tspan font-weight="bold">Only ONE case body runs</tspan> — every other case is skipped entirely, not just its print. Unlike C/Java, C# never falls through automatically: every case must break/return/throw (or share a label, like case 6/7 above).</text>
</svg>
