<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 580" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#555"/></marker>
  </defs>
  <rect x="0" y="0" width="780" height="580" fill="#ffffff"/>
  <text x="390" y="24" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a237e">While Loop — Sub-level Flow (animated)</text>
  <text x="390" y="44" text-anchor="middle" font-size="12" fill="#666">Condition is checked BEFORE every lap, including the first — a false start means the body never runs.</text>

  <ellipse cx="280" cy="90" rx="120" ry="24" fill="#d9ead3" stroke="#38761d" stroke-width="1.5"/>
  <text x="280" y="95" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#274e13">Start: ExplainWhileLoop()</text>
  <line x1="280" y1="114" x2="280" y2="128" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="180" y="130" width="200" height="44" rx="8" fill="#e8f4fb" stroke="#3d85c6" stroke-width="1.5"/>
  <text x="280" y="156" text-anchor="middle" font-size="10.5" fill="#1a4a73">int countdown = 3;</text>
  <line x1="280" y1="174" x2="280" y2="188" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>

  <polygon points="280,190 400,230 280,270 160,230" fill="#fce5cd" stroke="#e69138" stroke-width="1.5"/>
  <text x="280" y="234" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7f4e00">countdown &gt; 0 ?</text>

  <line x1="400" y1="230" x2="458" y2="230" stroke="#555" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="429" y="220" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#274e13">Yes</text>
  <rect x="460" y="200" width="240" height="65" rx="8" fill="#cfe2f3" stroke="#3d85c6" stroke-width="1.5"/>
  <text x="580" y="225" text-anchor="middle" font-size="10" fill="#123">Console.WriteLine($"{countdown}...");</text>
  <text x="580" y="243" text-anchor="middle" font-size="10" fill="#123">countdown--;</text>

  <!-- Animated loop-back path -->
  <path d="M700,232 L720,232 L720,120 L280,120 L280,188" fill="none" stroke="#8e63ce" stroke-width="2.2" stroke-dasharray="10 6" marker-end="url(#a)">
    <animate attributeName="stroke-dashoffset" values="16;0" dur="0.6s" repeatCount="indefinite"/>
  </path>
  <text x="500" y="112" text-anchor="middle" font-size="9.5" font-style="italic" fill="#5b3d8a">loop back — re-check "countdown &gt; 0 ?"</text>

  <line x1="280" y1="270" x2="280" y2="300" stroke="#555" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="296" y="290" font-size="10.5" font-weight="bold" fill="#990000">No</text>

  <rect x="180" y="302" width="200" height="44" rx="8" fill="#e8f4fb" stroke="#3d85c6" stroke-width="1.5"/>
  <text x="280" y="328" text-anchor="middle" font-size="10" fill="#1a4a73">Console.WriteLine("Liftoff!");</text>
  <line x1="280" y1="346" x2="280" y2="362" stroke="#555" stroke-width="1.4" marker-end="url(#a)"/>

  <text x="280" y="370" text-anchor="middle" font-size="10" fill="#333">countdown walks through — same Stack slot each lap:</text>

  <g>
    <rect x="195" y="380" width="50" height="50" rx="6" fill="#ffffff" stroke="#ccc"/><text x="220" y="410" text-anchor="middle" font-size="13" fill="#666">3</text>
    <rect x="255" y="380" width="50" height="50" rx="6" fill="#ffffff" stroke="#ccc"/><text x="280" y="410" text-anchor="middle" font-size="13" fill="#666">2</text>
    <rect x="315" y="380" width="50" height="50" rx="6" fill="#ffffff" stroke="#ccc"/><text x="340" y="410" text-anchor="middle" font-size="13" fill="#666">1</text>
    <rect y="380" width="50" height="50" rx="6" fill="none" stroke="#3d85c6" stroke-width="3">
      <animate attributeName="x" values="195;255;315;195" keyTimes="0;0.333;0.667;1" calcMode="discrete" dur="1.8s" repeatCount="indefinite"/>
    </rect>
  </g>

  <line x1="280" y1="430" x2="280" y2="464" stroke="#555" stroke-width="1.4" marker-end="url(#a)"/>
  <ellipse cx="280" cy="490" rx="120" ry="24" fill="#f4cccc" stroke="#cc0000" stroke-width="1.5"/>
  <text x="280" y="495" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#990000">End</text>

  <text x="40" y="530" font-size="10.5" fill="#444"><tspan font-weight="bold">Same shape as a for loop, minus the separate init/increment boxes</tspan> — the decrement lives inside the body here instead.</text>
  <text x="40" y="548" font-size="10" font-style="italic" fill="#888">If countdown started at 0, the body would never run — the check happens before the very first lap too.</text>
</svg>
