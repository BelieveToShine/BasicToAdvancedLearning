<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 740" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#555"/></marker>
  </defs>
  <rect x="0" y="0" width="900" height="740" fill="#ffffff"/>
  <text x="450" y="22" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a237e">If / Else If / Else — Sub-level Flow</text>
  <text x="450" y="42" text-anchor="middle" font-size="12" fill="#666">Conditions are checked top to bottom. The first TRUE one wins; everything after it is skipped.</text>

  <ellipse cx="250" cy="100" rx="130" ry="24" fill="#d9ead3" stroke="#38761d" stroke-width="1.5"/>
  <text x="250" y="105" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#274e13">Start: ExplainIfElse()</text>
  <line x1="250" y1="124" x2="250" y2="140" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Diamond 1 -->
  <polygon points="250,142 370,192 250,242 130,192" fill="#fce5cd" stroke="#e69138" stroke-width="1.5"/>
  <text x="250" y="188" text-anchor="middle" font-size="10" font-weight="bold" fill="#7f4e00">temperature</text>
  <text x="250" y="202" text-anchor="middle" font-size="10" font-weight="bold" fill="#7f4e00">&gt; 35 ?</text>

  <line x1="370" y1="192" x2="458" y2="192" stroke="#555" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="410" y="182" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#274e13">Yes</text>
  <rect x="460" y="167" width="300" height="55" rx="8" fill="#cfe2f3" stroke="#3d85c6" stroke-width="1.5"/>
  <text x="610" y="200" text-anchor="middle" font-size="10.5" fill="#123">Print: "...hot outside."</text>

  <line x1="250" y1="242" x2="250" y2="280" stroke="#555" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="266" y="267" font-size="10.5" font-weight="bold" fill="#990000">No</text>

  <!-- Diamond 2 -->
  <polygon points="250,284 370,334 250,384 130,334" fill="#fce5cd" stroke="#e69138" stroke-width="1.5"/>
  <text x="250" y="330" text-anchor="middle" font-size="10" font-weight="bold" fill="#7f4e00">temperature</text>
  <text x="250" y="344" text-anchor="middle" font-size="10" font-weight="bold" fill="#7f4e00">&gt; 20 ?</text>

  <line x1="370" y1="334" x2="458" y2="334" stroke="#555" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="410" y="324" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#274e13">Yes</text>
  <rect x="460" y="309" width="300" height="55" rx="8" fill="#cfe2f3" stroke="#3d85c6" stroke-width="1.5"/>
  <text x="610" y="342" text-anchor="middle" font-size="10.5" fill="#123">Print: "...pleasant day."</text>

  <line x1="250" y1="384" x2="250" y2="422" stroke="#555" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="266" y="409" font-size="10.5" font-weight="bold" fill="#990000">No (the "else")</text>

  <rect x="100" y="424" width="300" height="55" rx="8" fill="#cfe2f3" stroke="#3d85c6" stroke-width="1.5"/>
  <text x="250" y="457" text-anchor="middle" font-size="10.5" fill="#123">Print: "...cold outside."</text>

  <!-- Merges to End — orthogonal only, routed around every box via side buses -->
  <path d="M610,222 L610,250 L800,250 L800,600 L210,600 L210,624" fill="none" stroke="#555" stroke-width="1.3" marker-end="url(#a)"/>
  <path d="M610,364 L610,390 L830,390 L830,608 L290,608 L290,624" fill="none" stroke="#555" stroke-width="1.3" marker-end="url(#a)"/>
  <line x1="250" y1="479" x2="250" y2="624" stroke="#555" stroke-width="1.4" marker-end="url(#a)"/>

  <ellipse cx="250" cy="650" rx="140" ry="26" fill="#f4cccc" stroke="#cc0000" stroke-width="1.5"/>
  <text x="250" y="655" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#990000">End</text>

  <text x="40" y="700" font-size="10.5" fill="#444"><tspan font-weight="bold">Exactly one</tspan> of the three Print branches runs — never zero, never more than one. No loop, no repetition here.</text>
</svg>
