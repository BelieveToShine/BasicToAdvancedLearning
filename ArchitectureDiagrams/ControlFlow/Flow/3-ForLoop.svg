<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 520" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#555"/></marker>
  </defs>
  <rect x="0" y="0" width="780" height="520" fill="#ffffff"/>
  <text x="390" y="24" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a237e">For Loop — Sub-level Flow (animated)</text>
  <text x="390" y="44" text-anchor="middle" font-size="12" fill="#666">init runs ONCE, then check → body → increment → back to check, repeating until the check fails.</text>

  <ellipse cx="280" cy="90" rx="120" ry="24" fill="#d9ead3" stroke="#38761d" stroke-width="1.5"/>
  <text x="280" y="95" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#274e13">Start: ExplainForLoop()</text>
  <line x1="280" y1="114" x2="280" y2="128" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="180" y="130" width="200" height="44" rx="8" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1.5"/>
  <text x="280" y="156" text-anchor="middle" font-size="10.5" fill="#274e13">int i = 1;  (runs once)</text>
  <line x1="280" y1="174" x2="280" y2="188" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>

  <polygon points="280,190 400,230 280,270 160,230" fill="#fce5cd" stroke="#e69138" stroke-width="1.5"/>
  <text x="280" y="234" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7f4e00">i &lt;= 5 ?</text>

  <line x1="400" y1="230" x2="458" y2="230" stroke="#555" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="429" y="220" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#274e13">Yes</text>
  <rect x="460" y="205" width="200" height="50" rx="8" fill="#cfe2f3" stroke="#3d85c6" stroke-width="1.5"/>
  <text x="560" y="234" text-anchor="middle" font-size="10.5" fill="#123">Console.WriteLine(i);</text>

  <line x1="560" y1="255" x2="560" y2="298" stroke="#555" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="460" y="300" width="200" height="44" rx="8" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1.5"/>
  <text x="560" y="326" text-anchor="middle" font-size="10.5" fill="#274e13">i++;</text>

  <!-- Animated loop-back path -->
  <path d="M660,322 L680,322 L680,120 L280,120 L280,188" fill="none" stroke="#8e63ce" stroke-width="2.2" stroke-dasharray="10 6" marker-end="url(#a)">
    <animate attributeName="stroke-dashoffset" values="16;0" dur="0.6s" repeatCount="indefinite"/>
  </path>
  <text x="480" y="112" text-anchor="middle" font-size="9.5" font-style="italic" fill="#5b3d8a">loop back — re-check "i &lt;= 5 ?"</text>

  <line x1="280" y1="270" x2="280" y2="300" stroke="#555" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="296" y="290" font-size="10.5" font-weight="bold" fill="#990000">No</text>

  <text x="280" y="308" text-anchor="middle" font-size="10" fill="#333">i walks through — one Stack slot, reused every lap:</text>

  <g>
    <rect x="135" y="320" width="50" height="50" rx="6" fill="#ffffff" stroke="#ccc"/><text x="160" y="350" text-anchor="middle" font-size="13" fill="#666">1</text>
    <rect x="195" y="320" width="50" height="50" rx="6" fill="#ffffff" stroke="#ccc"/><text x="220" y="350" text-anchor="middle" font-size="13" fill="#666">2</text>
    <rect x="255" y="320" width="50" height="50" rx="6" fill="#ffffff" stroke="#ccc"/><text x="280" y="350" text-anchor="middle" font-size="13" fill="#666">3</text>
    <rect x="315" y="320" width="50" height="50" rx="6" fill="#ffffff" stroke="#ccc"/><text x="340" y="350" text-anchor="middle" font-size="13" fill="#666">4</text>
    <rect x="375" y="320" width="50" height="50" rx="6" fill="#ffffff" stroke="#ccc"/><text x="400" y="350" text-anchor="middle" font-size="13" fill="#666">5</text>
    <rect y="320" width="50" height="50" rx="6" fill="none" stroke="#e69138" stroke-width="3">
      <animate attributeName="x" values="135;195;255;315;375;135" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="2.5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <line x1="280" y1="370" x2="280" y2="404" stroke="#555" stroke-width="1.4" marker-end="url(#a)"/>
  <ellipse cx="280" cy="430" rx="120" ry="24" fill="#f4cccc" stroke="#cc0000" stroke-width="1.5"/>
  <text x="280" y="435" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#990000">End</text>

  <text x="40" y="470" font-size="10.5" fill="#444"><tspan font-weight="bold">The orange square above shows i's current value.</tspan> The purple dashed arrow shows the actual repeated path — init runs only once, everything inside the loop repeats.</text>
  <text x="40" y="488" font-size="10" font-style="italic" fill="#888">The Stack frame does not grow each lap — see Memory/3-ForLoop.svg for why.</text>
</svg>
