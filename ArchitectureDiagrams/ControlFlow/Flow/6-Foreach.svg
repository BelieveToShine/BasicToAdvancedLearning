<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 520" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#555"/></marker>
  </defs>
  <rect x="0" y="0" width="820" height="520" fill="#ffffff"/>
  <text x="410" y="24" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a237e">Foreach Loop — Sub-level Flow (animated)</text>
  <text x="410" y="44" text-anchor="middle" font-size="12" fill="#666">You never write the condition — the compiler drives it via the collection's enumerator, one element at a time.</text>

  <ellipse cx="280" cy="90" rx="120" ry="24" fill="#d9ead3" stroke="#38761d" stroke-width="1.5"/>
  <text x="280" y="95" text-anchor="middle" font-size="11" font-weight="bold" fill="#274e13">Start: ExplainForeach()</text>
  <line x1="280" y1="114" x2="280" y2="128" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="150" y="130" width="260" height="44" rx="8" fill="#f0eaf7" stroke="#8e63ce" stroke-width="1.5"/>
  <text x="280" y="156" text-anchor="middle" font-size="9.5" fill="#4a2e73">string[] fruits = { "Apple", "Banana", "Cherry" };</text>
  <line x1="280" y1="174" x2="280" y2="188" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>

  <polygon points="280,190 400,230 280,270 160,230" fill="#fce5cd" stroke="#e69138" stroke-width="1.5"/>
  <text x="280" y="224" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#7f4e00">enumerator.MoveNext()</text>
  <text x="280" y="238" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#7f4e00">→ more elements?</text>

  <line x1="400" y1="230" x2="458" y2="230" stroke="#555" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="429" y="220" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#274e13">Yes</text>
  <rect x="460" y="195" width="260" height="70" rx="8" fill="#cfe2f3" stroke="#3d85c6" stroke-width="1.5"/>
  <text x="590" y="222" text-anchor="middle" font-size="10" fill="#123">fruit = enumerator.Current;</text>
  <text x="590" y="240" text-anchor="middle" font-size="10" fill="#123">Console.WriteLine(fruit);</text>

  <!-- Animated loop-back path -->
  <path d="M720,230 L740,230 L740,120 L280,120 L280,188" fill="none" stroke="#8e63ce" stroke-width="2.2" stroke-dasharray="10 6" marker-end="url(#a)">
    <animate attributeName="stroke-dashoffset" values="16;0" dur="0.6s" repeatCount="indefinite"/>
  </path>
  <text x="510" y="112" text-anchor="middle" font-size="9.5" font-style="italic" fill="#5b3d8a">loop back — move to the next element</text>

  <line x1="280" y1="270" x2="280" y2="300" stroke="#555" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="296" y="290" font-size="10.5" font-weight="bold" fill="#990000">No</text>

  <text x="280" y="308" text-anchor="middle" font-size="10" fill="#333">fruit walks through — a fresh variable each lap:</text>

  <g>
    <rect x="135" y="320" width="90" height="50" rx="6" fill="#ffffff" stroke="#ccc"/><text x="180" y="350" text-anchor="middle" font-size="11" fill="#666">"Apple"</text>
    <rect x="235" y="320" width="90" height="50" rx="6" fill="#ffffff" stroke="#ccc"/><text x="280" y="350" text-anchor="middle" font-size="11" fill="#666">"Banana"</text>
    <rect x="335" y="320" width="90" height="50" rx="6" fill="#ffffff" stroke="#ccc"/><text x="380" y="350" text-anchor="middle" font-size="11" fill="#666">"Cherry"</text>
    <rect y="320" width="90" height="50" rx="6" fill="none" stroke="#8e63ce" stroke-width="3">
      <animate attributeName="x" values="135;235;335;135" keyTimes="0;0.333;0.667;1" calcMode="discrete" dur="1.8s" repeatCount="indefinite"/>
    </rect>
  </g>

  <line x1="280" y1="370" x2="280" y2="404" stroke="#555" stroke-width="1.4" marker-end="url(#a)"/>
  <ellipse cx="280" cy="430" rx="120" ry="24" fill="#f4cccc" stroke="#cc0000" stroke-width="1.5"/>
  <text x="280" y="435" text-anchor="middle" font-size="11" font-weight="bold" fill="#990000">End</text>

  <text x="40" y="470" font-size="10.5" fill="#444"><tspan font-weight="bold">Unlike the for-loop's i</tspan>, each foreach lap gets its OWN fresh fruit variable — matters if you ever capture it in a lambda. See Memory/6-Foreach.svg.</text>
  <text x="40" y="488" font-size="10" font-style="italic" fill="#888">You cannot assign to fruit or change the array's length while this loop is running — the enumerator would throw.</text>
</svg>
