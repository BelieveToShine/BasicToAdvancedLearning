<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 504" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#555"/></marker>
  </defs>
  <rect x="0" y="0" width="1200" height="504" fill="#ffffff"/>
  <text x="600.0" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a237e">Migrations — Memory: Stack / Heap / Static</text>
  <text x="600.0" y="46" text-anchor="middle" font-size="12" fill="#666">Snapshot: ExplainMigrations() is running, inside the using block, after the first Migrate() and the "Applied" / "Pending" lines.</text>
  <g font-size="11" fill="#333"><rect x="200" y="60" width="14" height="14" rx="2" fill="#b6d7a8" stroke="#6aa84f"/><text x="220" y="71">Stack</text></g>
  <g font-size="11" fill="#333"><rect x="380" y="60" width="14" height="14" rx="2" fill="#f9cb9c" stroke="#e69138"/><text x="400" y="71">Heap</text></g>
  <g font-size="11" fill="#333"><rect x="560" y="60" width="14" height="14" rx="2" fill="#d5c9ea" stroke="#674ea7"/><text x="580" y="71">Static</text></g>
  <text x="220" y="96" text-anchor="middle" font-size="12" font-weight="bold" fill="#3f6b3f">STACK — call frames (top = currently executing)</text>
  <text x="700" y="96" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a5a10">HEAP</text>
  <text x="1145" y="96" text-anchor="middle" font-size="12" font-weight="bold" fill="#3d2a6b">STATIC</text>
  <rect x="30" y="108" width="380" height="204" rx="10" fill="none" stroke="#999" stroke-width="1" stroke-dasharray="5 4"/>
  <rect x="50" y="118" width="340" height="64" rx="8" fill="#b6d7a8" stroke="#6aa84f" stroke-width="2"/>
  <text x="220" y="136" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#274e13">EfCoreBasicsDemo.ExplainMigrations() — ACTIVE</text>
  <rect x="62" y="146" width="316" height="26" rx="4" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1"/>
  <text x="70" y="163" font-size="10" fill="#1b3d1b">context → pointer  (BankContext)</text>
  <rect x="50" y="192" width="340" height="50" rx="8" fill="#dcecdc" stroke="#6aa84f" stroke-width="1.5"/>
  <text x="220" y="212" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#4c6b4c">EfCoreBasicsExample.Explain()</text>
  <text x="220" y="228" text-anchor="middle" font-size="9.5" fill="#6b8a6b">paused — waiting for the call above to return</text>
  <rect x="50" y="252" width="340" height="50" rx="8" fill="#dcecdc" stroke="#6aa84f" stroke-width="1.5"/>
  <text x="220" y="272" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#4c6b4c">Program.cs (Main)</text>
  <text x="220" y="288" text-anchor="middle" font-size="9.5" fill="#6b8a6b">paused — waiting for topic.Explain() to return</text>
  <rect x="470" y="144" width="420" height="52" rx="10" fill="#f9cb9c" stroke="#e69138" stroke-width="1.5"/>
  <text x="680.0" y="166" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7f4e00">BankContext — context</text>
  <text x="484" y="187" font-size="8.5" font-style="italic" fill="#a06a1f">(DbSet properties, model and settings inside — simplified)</text>
  <rect x="470" y="244" width="640" height="184" rx="10" fill="#f1f1f1" stroke="#777777" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="790.0" y="264" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#444444">OUTSIDE .NET — SQL Server — what Migrate() built</text>
  <text x="484" y="284" font-size="9.5" font-weight="bold" fill="#333333">Customers  (0 rows)</text>
  <text x="484" y="300" font-size="9.5" fill="#333333">  CustomerId int PK IDENTITY · FullName nvarchar(100) · Email nvarchar(200) unique · CreatedAt datetime2</text>
  <text x="484" y="316" font-size="9.5" font-weight="bold" fill="#333333">Accounts  (0 rows)</text>
  <text x="484" y="332" font-size="9.5" fill="#333333">  AccountId int PK IDENTITY · CustomerId int FK → Customers, NO ACTION · AccountNumber nvarchar(20) unique</text>
  <text x="484" y="348" font-size="9.5" fill="#333333">  AccountType nvarchar(20) · Balance decimal(18,2)</text>
  <text x="484" y="364" font-size="9.5" font-weight="bold" fill="#333333">__EFMigrationsHistory  (1 row)</text>
  <text x="484" y="380" font-size="9.5" fill="#333333">  MigrationId = 20261012172636_InitialCreate</text>
  <text x="484" y="396" font-size="9.5" fill="#333333">Migrate() ran InitialCreate.Up() and then recorded its name in the history table.</text>
  <polyline points="378,159 440,159 440,166 468,166" fill="none" stroke="#555" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="1100" y="118" width="90" height="130" rx="10" fill="#d5c9ea" stroke="#674ea7" stroke-width="1.5" stroke-dasharray="6 4" fill-opacity="0.25"/>
  <text x="1145" y="150" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#3d2a6b">Nothing</text>
  <text x="1145" y="166" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#3d2a6b">here yet</text>
  <text x="40" y="452" font-size="10.5" fill="#444"><tspan font-weight="bold">Almost nothing is on the Heap: the real change happened OUTSIDE .NET, in SQL Server. </tspan>The migration's history row is how EF Core knows next time that nothing is pending.</text>
  <text x="40" y="470" font-size="10" font-style="italic" fill="#888">The tables are empty: a migration changes the structure, not the data. The second Migrate() call, which finds nothing pending, runs after this instant and changes nothing.</text>
</svg>
