<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 794" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#555"/></marker>
  </defs>
  <rect x="0" y="0" width="1160" height="794" fill="#ffffff"/>
  <text x="580.0" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a237e">Model classes — Memory: Stack / Heap / Static</text>
  <text x="580.0" y="46" text-anchor="middle" font-size="12" fill="#666">Snapshot: ExplainModelClasses() is running, after the objects were linked and printed. Two plain objects, no database.</text>
  <g font-size="11" fill="#333"><rect x="200" y="60" width="14" height="14" rx="2" fill="#b6d7a8" stroke="#6aa84f"/><text x="220" y="71">Stack</text></g>
  <g font-size="11" fill="#333"><rect x="380" y="60" width="14" height="14" rx="2" fill="#f9cb9c" stroke="#e69138"/><text x="400" y="71">Heap</text></g>
  <g font-size="11" fill="#333"><rect x="560" y="60" width="14" height="14" rx="2" fill="#d5c9ea" stroke="#674ea7"/><text x="580" y="71">Static</text></g>
  <text x="220" y="96" text-anchor="middle" font-size="12" font-weight="bold" fill="#3f6b3f">STACK — call frames (top = currently executing)</text>
  <text x="760" y="96" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a5a10">HEAP</text>
  <text x="1105" y="96" text-anchor="middle" font-size="12" font-weight="bold" fill="#3d2a6b">STATIC</text>
  <rect x="30" y="108" width="380" height="234" rx="10" fill="none" stroke="#999" stroke-width="1" stroke-dasharray="5 4"/>
  <rect x="50" y="118" width="340" height="94" rx="8" fill="#b6d7a8" stroke="#6aa84f" stroke-width="2"/>
  <text x="220" y="136" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#274e13">EfCoreBasicsDemo.ExplainModelClasses() — ACTIVE</text>
  <rect x="62" y="146" width="316" height="26" rx="4" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1"/>
  <text x="70" y="163" font-size="10" fill="#1b3d1b">asha → pointer  (Customer)</text>
  <rect x="62" y="176" width="316" height="26" rx="4" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1"/>
  <text x="70" y="193" font-size="10" fill="#1b3d1b">savings → pointer  (Account)</text>
  <rect x="50" y="222" width="340" height="50" rx="8" fill="#dcecdc" stroke="#6aa84f" stroke-width="1.5"/>
  <text x="220" y="242" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#4c6b4c">EfCoreBasicsExample.Explain()</text>
  <text x="220" y="258" text-anchor="middle" font-size="9.5" fill="#6b8a6b">paused — waiting for the call above to return</text>
  <rect x="50" y="282" width="340" height="50" rx="8" fill="#dcecdc" stroke="#6aa84f" stroke-width="1.5"/>
  <text x="220" y="302" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#4c6b4c">Program.cs (Main)</text>
  <text x="220" y="318" text-anchor="middle" font-size="9.5" fill="#6b8a6b">paused — waiting for topic.Explain() to return</text>
  <rect x="470" y="144" width="280" height="186" rx="10" fill="#f9cb9c" stroke="#e69138" stroke-width="1.5"/>
  <text x="610.0" y="166" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7f4e00">Customer — asha</text>
  <rect x="482" y="176" width="256" height="26" rx="4" fill="#fff3e6" stroke="#e69138" stroke-width="1"/>
  <text x="490" y="193" font-size="10" fill="#7f4e00">CustomerId = 0</text>
  <rect x="482" y="206" width="256" height="26" rx="4" fill="#fff3e6" stroke="#e69138" stroke-width="1"/>
  <text x="490" y="223" font-size="10" fill="#7f4e00">FullName = "Asha Rao"</text>
  <rect x="482" y="236" width="256" height="26" rx="4" fill="#fff3e6" stroke="#e69138" stroke-width="1"/>
  <text x="490" y="253" font-size="10" fill="#7f4e00">Email = "asha@example.com"</text>
  <rect x="482" y="266" width="256" height="26" rx="4" fill="#fff3e6" stroke="#e69138" stroke-width="1"/>
  <text x="490" y="283" font-size="10" fill="#7f4e00">CreatedAt = 0001-01-01 (default)</text>
  <rect x="482" y="296" width="256" height="26" rx="4" fill="#fff3e6" stroke="#e69138" stroke-width="1"/>
  <text x="490" y="313" font-size="10" fill="#7f4e00">Accounts → pointer (List&lt;Account&gt;)</text>
  <rect x="810" y="264" width="230" height="82" rx="10" fill="#f9cb9c" stroke="#e69138" stroke-width="1.5"/>
  <text x="925.0" y="286" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7f4e00">List&lt;Account&gt;</text>
  <rect x="822" y="296" width="206" height="26" rx="4" fill="#fff3e6" stroke="#e69138" stroke-width="1"/>
  <text x="830" y="313" font-size="10" fill="#7f4e00">[0] → pointer (Account)</text>
  <text x="824" y="337" font-size="8.5" font-style="italic" fill="#a06a1f">(the list's inner array is simplified away)</text>
  <rect x="470" y="400" width="280" height="216" rx="10" fill="#f9cb9c" stroke="#e69138" stroke-width="1.5"/>
  <text x="610.0" y="422" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7f4e00">Account — savings</text>
  <rect x="482" y="432" width="256" height="26" rx="4" fill="#fff3e6" stroke="#e69138" stroke-width="1"/>
  <text x="490" y="449" font-size="10" fill="#7f4e00">AccountId = 0</text>
  <rect x="482" y="462" width="256" height="26" rx="4" fill="#fff3e6" stroke="#e69138" stroke-width="1"/>
  <text x="490" y="479" font-size="10" fill="#7f4e00">CustomerId = 0</text>
  <rect x="482" y="492" width="256" height="26" rx="4" fill="#fff3e6" stroke="#e69138" stroke-width="1"/>
  <text x="490" y="509" font-size="10" fill="#7f4e00">AccountNumber = "ACC-1001"</text>
  <rect x="482" y="522" width="256" height="26" rx="4" fill="#fff3e6" stroke="#e69138" stroke-width="1"/>
  <text x="490" y="539" font-size="10" fill="#7f4e00">AccountType = "Savings"</text>
  <rect x="482" y="552" width="256" height="26" rx="4" fill="#fff3e6" stroke="#e69138" stroke-width="1"/>
  <text x="490" y="569" font-size="10" fill="#7f4e00">Balance = 500</text>
  <rect x="482" y="582" width="256" height="26" rx="4" fill="#fff3e6" stroke="#e69138" stroke-width="1"/>
  <text x="490" y="599" font-size="10" fill="#7f4e00">Customer → pointer (Customer)</text>
  <line x1="750" y1="309" x2="808" y2="309" stroke="#555" stroke-width="1.4" marker-end="url(#a)"/>
  <polyline points="1040,309 1070,309 1070,422 750,422" fill="none" stroke="#555" stroke-width="1.4" marker-end="url(#a)"/>
  <polyline points="750,595 790,595 790,360 610,360 610,332" fill="none" stroke="#555" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="470" y="640" width="600" height="78" rx="10" fill="#f1f1f1" stroke="#777777" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="770.0" y="660" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#444444">OUTSIDE .NET — SQL Server — not used in this method</text>
  <text x="484" y="680" font-size="9.5" font-weight="bold" fill="#333333">No table, no row: asha and savings exist only in program memory.</text>
  <text x="484" y="696" font-size="9.5" fill="#333333">The 0s in CustomerId / AccountId say "no row has been saved yet".</text>
  <polyline points="378,159 450,159 450,166 468,166" fill="none" stroke="#555" stroke-width="1.4" marker-end="url(#a)"/>
  <polyline points="378,189 430,189 430,422 468,422" fill="none" stroke="#555" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="1060" y="118" width="90" height="130" rx="10" fill="#d5c9ea" stroke="#674ea7" stroke-width="1.5" stroke-dasharray="6 4" fill-opacity="0.25"/>
  <text x="1105" y="150" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#3d2a6b">Nothing</text>
  <text x="1105" y="166" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#3d2a6b">here yet</text>
  <text x="40" y="742" font-size="10.5" fill="#444"><tspan font-weight="bold">Each entity is just an object on the Heap — rows only appear when EF Core saves them (Topic 15). </tspan>The two navigation properties are ordinary pointers: Accounts points to a List, and Customer points back.</text>
  <text x="40" y="760" font-size="10" font-style="italic" fill="#888">Strings are pointers to string objects on the Heap too; the fields are written inline here to keep the picture readable.</text>
</svg>
