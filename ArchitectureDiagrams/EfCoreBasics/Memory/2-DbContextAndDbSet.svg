<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 624" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#555"/></marker>
  </defs>
  <rect x="0" y="0" width="1260" height="624" fill="#ffffff"/>
  <text x="630.0" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a237e">DbContext and DbSet — Memory: Stack / Heap / Static</text>
  <text x="630.0" y="46" text-anchor="middle" font-size="12" fill="#666">Snapshot: ExplainDbContextAndDbSet() is running, inside the using block, right after the script was printed.</text>
  <g font-size="11" fill="#333"><rect x="200" y="60" width="14" height="14" rx="2" fill="#b6d7a8" stroke="#6aa84f"/><text x="220" y="71">Stack</text></g>
  <g font-size="11" fill="#333"><rect x="380" y="60" width="14" height="14" rx="2" fill="#f9cb9c" stroke="#e69138"/><text x="400" y="71">Heap</text></g>
  <g font-size="11" fill="#333"><rect x="560" y="60" width="14" height="14" rx="2" fill="#d5c9ea" stroke="#674ea7"/><text x="580" y="71">Static</text></g>
  <text x="220" y="96" text-anchor="middle" font-size="12" font-weight="bold" fill="#3f6b3f">STACK — call frames (top = currently executing)</text>
  <text x="760" y="96" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a5a10">HEAP</text>
  <text x="1205" y="96" text-anchor="middle" font-size="12" font-weight="bold" fill="#3d2a6b">STATIC</text>
  <rect x="30" y="108" width="380" height="234" rx="10" fill="none" stroke="#999" stroke-width="1" stroke-dasharray="5 4"/>
  <rect x="50" y="118" width="340" height="94" rx="8" fill="#b6d7a8" stroke="#6aa84f" stroke-width="2"/>
  <text x="220" y="136" text-anchor="middle" font-size="10.3" font-weight="bold" fill="#274e13">EfCoreBasicsDemo.ExplainDbContextAndDbSet() — ACTIVE</text>
  <rect x="62" y="146" width="316" height="26" rx="4" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1"/>
  <text x="70" y="163" font-size="10" fill="#1b3d1b">context → pointer  (PlainBankContext)</text>
  <rect x="62" y="176" width="316" height="26" rx="4" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1"/>
  <text x="70" y="193" font-size="10" fill="#1b3d1b">script → pointer  (string)</text>
  <rect x="50" y="222" width="340" height="50" rx="8" fill="#dcecdc" stroke="#6aa84f" stroke-width="1.5"/>
  <text x="220" y="242" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#4c6b4c">EfCoreBasicsExample.Explain()</text>
  <text x="220" y="258" text-anchor="middle" font-size="9.5" fill="#6b8a6b">paused — waiting for the call above to return</text>
  <rect x="50" y="282" width="340" height="50" rx="8" fill="#dcecdc" stroke="#6aa84f" stroke-width="1.5"/>
  <text x="220" y="302" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#4c6b4c">Program.cs (Main)</text>
  <text x="220" y="318" text-anchor="middle" font-size="9.5" fill="#6b8a6b">paused — waiting for topic.Explain() to return</text>
  <rect x="470" y="144" width="300" height="112" rx="10" fill="#f9cb9c" stroke="#e69138" stroke-width="1.5"/>
  <text x="620.0" y="166" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7f4e00">PlainBankContext — context</text>
  <rect x="482" y="176" width="276" height="26" rx="4" fill="#fff3e6" stroke="#e69138" stroke-width="1"/>
  <text x="490" y="193" font-size="10" fill="#7f4e00">Customers → pointer (DbSet)</text>
  <rect x="482" y="206" width="276" height="26" rx="4" fill="#fff3e6" stroke="#e69138" stroke-width="1"/>
  <text x="490" y="223" font-size="10" fill="#7f4e00">Accounts → pointer (DbSet)</text>
  <text x="484" y="247" font-size="8.5" font-style="italic" fill="#a06a1f">(model and connection settings inside — simplified)</text>
  <rect x="850" y="144" width="220" height="66" rx="10" fill="#f9cb9c" stroke="#e69138" stroke-width="1.5"/>
  <text x="960.0" y="166" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7f4e00">DbSet&lt;Customer&gt;</text>
  <rect x="862" y="176" width="196" height="26" rx="4" fill="#fff3e6" stroke="#e69138" stroke-width="1"/>
  <text x="870" y="193" font-size="10" fill="#7f4e00">door to table Customers</text>
  <rect x="850" y="234" width="220" height="66" rx="10" fill="#f9cb9c" stroke="#e69138" stroke-width="1.5"/>
  <text x="960.0" y="256" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7f4e00">DbSet&lt;Account&gt;</text>
  <rect x="862" y="266" width="196" height="26" rx="4" fill="#fff3e6" stroke="#e69138" stroke-width="1"/>
  <text x="870" y="283" font-size="10" fill="#7f4e00">door to table Accounts</text>
  <line x1="770" y1="189" x2="848" y2="189" stroke="#555" stroke-width="1.4" marker-end="url(#a)"/>
  <polyline points="770,219 830,219 830,279 848,279" fill="none" stroke="#555" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="470" y="330" width="420" height="112" rx="10" fill="#f9cb9c" stroke="#e69138" stroke-width="1.5"/>
  <text x="680.0" y="352" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7f4e00">string — script</text>
  <rect x="482" y="362" width="396" height="26" rx="4" fill="#fff3e6" stroke="#e69138" stroke-width="1"/>
  <text x="490" y="379" font-size="10" fill="#7f4e00">"CREATE TABLE [Customers] ( … ); GO"</text>
  <rect x="482" y="392" width="396" height="26" rx="4" fill="#fff3e6" stroke="#e69138" stroke-width="1"/>
  <text x="490" y="409" font-size="10" fill="#7f4e00">"… CREATE INDEX [IX_Accounts_CustomerId] …"</text>
  <text x="484" y="433" font-size="8.5" font-style="italic" fill="#a06a1f">(text only — nothing has been run)</text>
  <rect x="470" y="470" width="600" height="78" rx="10" fill="#f1f1f1" stroke="#777777" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="770.0" y="490" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#444444">OUTSIDE .NET — SQL Server — not contacted</text>
  <text x="484" y="510" font-size="9.5" font-weight="bold" fill="#333333">GenerateCreateScript() only RETURNS text; it sends nothing to SQL Server.</text>
  <text x="484" y="526" font-size="9.5" fill="#333333">Tables from an earlier run, if any, are neither read nor changed here.</text>
  <polyline points="378,159 440,159 440,166 468,166" fill="none" stroke="#555" stroke-width="1.4" marker-end="url(#a)"/>
  <polyline points="378,189 420,189 420,352 468,352" fill="none" stroke="#555" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="1160" y="118" width="90" height="130" rx="10" fill="#d5c9ea" stroke="#674ea7" stroke-width="1.5" stroke-dasharray="6 4" fill-opacity="0.25"/>
  <text x="1205" y="150" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#3d2a6b">Nothing</text>
  <text x="1205" y="166" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#3d2a6b">here yet</text>
  <text x="40" y="572" font-size="10.5" fill="#444"><tspan font-weight="bold">The DbContext is an ordinary Heap object; each DbSet property points at a "door" to one table. </tspan>The create script is just a string that EF Core built from the model.</text>
  <text x="40" y="590" font-size="10" font-style="italic" fill="#888">At the closing brace of using, Dispose() runs and `context` can no longer be used. The model and connection settings are simplified inside the context box.</text>
</svg>
