  <text x="70" y="253" font-size="10" fill="#1b3d1b">after → pointer  (string)</text>
  <rect x="50" y="282" width="340" height="50" rx="8" fill="#dcecdc" stroke="#6aa84f" stroke-width="1.5"/>
  <text x="220" y="302" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#4c6b4c">EfCoreBasicsExample.Explain()</text>
  <text x="220" y="318" text-anchor="middle" font-size="9.5" fill="#6b8a6b">paused — waiting for the call above to return</text>
  <rect x="50" y="342" width="340" height="50" rx="8" fill="#dcecdc" stroke="#6aa84f" stroke-width="1.5"/>
  <text x="220" y="362" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#4c6b4c">Program.cs (Main)</text>
  <text x="220" y="378" text-anchor="middle" font-size="9.5" fill="#6b8a6b">paused — waiting for topic.Explain() to return</text>
  <rect x="470" y="144" width="420" height="126" rx="10" fill="#f9cb9c" stroke="#e69138" stroke-width="1.5"/>
  <text x="680.0" y="166" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7f4e00">string — before  (PlainBankContext script)</text>
  <rect x="482" y="176" width="396" height="26" rx="4" fill="#fff3e6" stroke="#e69138" stroke-width="1"/>
  <text x="490" y="193" font-size="10" fill="#7f4e00">[FullName] nvarchar(max) NOT NULL</text>
  <rect x="482" y="206" width="396" height="26" rx="4" fill="#fff3e6" stroke="#e69138" stroke-width="1"/>
  <text x="490" y="223" font-size="10" fill="#7f4e00">… ON DELETE CASCADE</text>
  <rect x="482" y="236" width="396" height="26" rx="4" fill="#fff3e6" stroke="#e69138" stroke-width="1"/>
  <text x="490" y="253" font-size="10" fill="#7f4e00">no UNIQUE indexes</text>
  <rect x="470" y="366" width="420" height="126" rx="10" fill="#f9cb9c" stroke="#e69138" stroke-width="1.5"/>
  <text x="680.0" y="388" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7f4e00">string — after  (BankContext script)</text>
  <rect x="482" y="398" width="396" height="26" rx="4" fill="#fff3e6" stroke="#e69138" stroke-width="1"/>
  <text x="490" y="415" font-size="10" fill="#7f4e00">[FullName] nvarchar(100) NOT NULL</text>
  <rect x="482" y="428" width="396" height="26" rx="4" fill="#fff3e6" stroke="#e69138" stroke-width="1"/>
  <text x="490" y="445" font-size="10" fill="#7f4e00">… ON DELETE NO ACTION</text>
  <rect x="482" y="458" width="396" height="26" rx="4" fill="#fff3e6" stroke="#e69138" stroke-width="1"/>
  <text x="490" y="475" font-size="10" fill="#7f4e00">2 × CREATE UNIQUE INDEX</text>
  <rect x="470" y="292" width="420" height="52" rx="10" fill="#f9cb9c" stroke="#e69138" stroke-width="1.5"/>
  <text x="680.0" y="314" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7f4e00">BankContext — configured</text>
  <text x="484" y="335" font-size="8.5" font-style="italic" fill="#a06a1f">(DbSet properties, the model built by OnModelCreating and the settings — simplified)</text>
