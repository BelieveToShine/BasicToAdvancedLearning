  <text x="680.0" y="538" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#9a6a2a">PlainBankContext object — plain (disposed)</text>
  <text x="484" y="560" font-size="9" font-style="italic" fill="#a06a1f">No pointer reaches it any more; the garbage collector may free it later.</text>
  <rect x="470" y="610" width="600" height="78" rx="10" fill="#f1f1f1" stroke="#777777" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="770.0" y="630" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#444444">OUTSIDE .NET — SQL Server — not contacted</text>
  <text x="484" y="650" font-size="9.5" font-weight="bold" fill="#333333">Both scripts were only generated as text; nothing was sent to SQL Server.</text>
  <text x="484" y="666" font-size="9.5" fill="#333333">Comparing them is a plain string comparison done in C# memory.</text>
  <polyline points="378,159 430,159 430,166 468,166" fill="none" stroke="#555" stroke-width="1.4" marker-end="url(#a)"/>
  <polyline points="378,219 440,219 440,314 468,314" fill="none" stroke="#555" stroke-width="1.4" marker-end="url(#a)"/>
  <polyline points="378,249 452,249 452,388 468,388" fill="none" stroke="#555" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="1060" y="118" width="90" height="130" rx="10" fill="#d5c9ea" stroke="#674ea7" stroke-width="1.5" stroke-dasharray="6 4" fill-opacity="0.25"/>
  <text x="1105" y="150" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#3d2a6b">Nothing</text>
  <text x="1105" y="166" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#3d2a6b">here yet</text>
  <text x="40" y="712" font-size="10.5" fill="#444"><tspan font-weight="bold">Two scripts, two strings: the only difference is what OnModelCreating changed. </tspan>The "-" / "+" lines of the lesson output are the lines found in one string but not the other.</text>
  <text x="40" y="730" font-size="10" font-style="italic" fill="#888">The three boxes on the Heap hold only a few lines each here; the real scripts are longer (see the lesson output). `plain` is gone from the Stack but its object is still on the Heap until the garbage collector runs.</text>
</svg>
