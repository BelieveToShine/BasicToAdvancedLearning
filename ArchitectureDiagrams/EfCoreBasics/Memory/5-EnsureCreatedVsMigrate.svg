<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 564" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#555"/></marker>
  </defs>
  <rect x="0" y="0" width="1200" height="564" fill="#ffffff"/>
  <text x="600.0" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a237e">EnsureCreated vs Migrate — Memory: Stack / Heap / Static</text>
  <text x="600.0" y="46" text-anchor="middle" font-size="12" fill="#666">Snapshot: ExplainEnsureCreatedVsMigrate() is running, in order A, inside the catch block just after Migrate() was refused.</text>
  <g font-size="11" fill="#333"><rect x="200" y="60" width="14" height="14" rx="2" fill="#b6d7a8" stroke="#6aa84f"/><text x="220" y="71">Stack</text></g>
  <g font-size="11" fill="#333"><rect x="380" y="60" width="14" height="14" rx="2" fill="#f9cb9c" stroke="#e69138"/><text x="400" y="71">Heap</text></g>
  <g font-size="11" fill="#333"><rect x="560" y="60" width="14" height="14" rx="2" fill="#d5c9ea" stroke="#674ea7"/><text x="580" y="71">Static</text></g>
  <text x="220" y="96" text-anchor="middle" font-size="12" font-weight="bold" fill="#3f6b3f">STACK — call frames (top = currently executing)</text>
  <text x="700" y="96" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a5a10">HEAP</text>
  <text x="1145" y="96" text-anchor="middle" font-size="12" font-weight="bold" fill="#3d2a6b">STATIC</text>
  <rect x="30" y="108" width="380" height="264" rx="10" fill="none" stroke="#999" stroke-width="1" stroke-dasharray="5 4"/>
  <rect x="50" y="118" width="340" height="124" rx="8" fill="#b6d7a8" stroke="#6aa84f" stroke-width="2"/>
  <text x="220" y="136" text-anchor="middle" font-size="9.4" font-weight="bold" fill="#274e13">EfCoreBasicsDemo.ExplainEnsureCreatedVsMigrate() — ACTIVE</text>
  <rect x="62" y="146" width="316" height="26" rx="4" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1"/>
  <text x="70" y="163" font-size="10" fill="#1b3d1b">context → pointer  (BankContext)</text>
  <rect x="62" y="176" width="316" height="26" rx="4" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1"/>
  <text x="70" y="193" font-size="10" fill="#1b3d1b">ex → pointer  (SqlException)</text>
  <rect x="62" y="206" width="316" height="26" rx="4" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1"/>
  <text x="70" y="223" font-size="10" fill="#1b3d1b">created — not in scope here (other using blocks)</text>
  <rect x="50" y="252" width="340" height="50" rx="8" fill="#dcecdc" stroke="#6aa84f" stroke-width="1.5"/>
  <text x="220" y="272" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#4c6b4c">EfCoreBasicsExample.Explain()</text>
  <text x="220" y="288" text-anchor="middle" font-size="9.5" fill="#6b8a6b">paused — waiting for the call above to return</text>
  <rect x="50" y="312" width="340" height="50" rx="8" fill="#dcecdc" stroke="#6aa84f" stroke-width="1.5"/>
  <text x="220" y="332" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#4c6b4c">Program.cs (Main)</text>
  <text x="220" y="348" text-anchor="middle" font-size="9.5" fill="#6b8a6b">paused — waiting for topic.Explain() to return</text>
  <rect x="470" y="144" width="380" height="52" rx="10" fill="#f9cb9c" stroke="#e69138" stroke-width="1.5"/>
  <text x="660.0" y="166" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7f4e00">BankContext — context</text>
  <text x="484" y="187" font-size="8.5" font-style="italic" fill="#a06a1f">(DbSet properties, model and settings inside — simplified)</text>
  <rect x="470" y="220" width="380" height="112" rx="10" fill="#f9cb9c" stroke="#e69138" stroke-width="1.5"/>
  <text x="660.0" y="242" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7f4e00">SqlException — ex</text>
  <rect x="482" y="252" width="356" height="26" rx="4" fill="#fff3e6" stroke="#e69138" stroke-width="1"/>
  <text x="490" y="269" font-size="10" fill="#7f4e00">Number = 2714</text>
  <rect x="482" y="282" width="356" height="26" rx="4" fill="#fff3e6" stroke="#e69138" stroke-width="1"/>
  <text x="490" y="299" font-size="10" fill="#7f4e00">Message → pointer (string)</text>
  <text x="484" y="323" font-size="8.5" font-style="italic" fill="#a06a1f">(more fields not shown)</text>
  <rect x="900" y="280" width="230" height="30" rx="6" fill="#fff3e6" stroke="#e69138" stroke-width="1.5"/>
  <text x="1015.0" y="299.0" text-anchor="middle" font-size="10" fill="#7f4e00">"(message text from SQL Server)"</text>
  <line x1="850" y1="295" x2="898" y2="295.0" stroke="#555" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="470" y="370" width="660" height="118" rx="10" fill="#f1f1f1" stroke="#777777" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="800.0" y="390" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#444444">OUTSIDE .NET — SQL Server — at this instant</text>
  <text x="484" y="410" font-size="9.5" font-weight="bold" fill="#333333">Customers  (0 rows) and Accounts  (0 rows): created by EnsureCreated()</text>
  <text x="484" y="426" font-size="9.5" font-weight="bold" fill="#333333">__EFMigrationsHistory  (0 rows): created by Migrate() before it failed</text>
  <text x="484" y="442" font-size="9.5" fill="#333333">InitialCreate was NOT recorded: its CREATE TABLE was refused</text>
  <text x="484" y="458" font-size="9.5" fill="#333333">(error 2714: an object with that name already exists).</text>
  <polyline points="378,159 440,159 440,166 468,166" fill="none" stroke="#555" stroke-width="1.4" marker-end="url(#a)"/>
  <polyline points="378,189 420,189 420,242 468,242" fill="none" stroke="#555" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="1100" y="118" width="90" height="130" rx="10" fill="#d5c9ea" stroke="#674ea7" stroke-width="1.5" stroke-dasharray="6 4" fill-opacity="0.25"/>
  <text x="1145" y="150" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#3d2a6b">Nothing</text>
  <text x="1145" y="166" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#3d2a6b">here yet</text>
  <text x="40" y="512" font-size="10.5" fill="#444"><tspan font-weight="bold">The two database facts that matter are in SQL Server, not in any variable: </tspan>the tables exist, yet the history table has no row — so Migrate() thought InitialCreate still had to run.</text>
  <text x="40" y="530" font-size="10" font-style="italic" fill="#888">The exception object is ordinary Heap data; its Message wording belongs to SQL Server, so it is not quoted. After this, order B drops the tables and runs Migrate() first.</text>
</svg>
