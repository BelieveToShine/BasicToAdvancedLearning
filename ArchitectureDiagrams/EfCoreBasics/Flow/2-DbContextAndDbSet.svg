<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 930" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#333"/></marker>
  </defs>
  <rect x="0" y="0" width="940" height="930" fill="#ffffff"/>
  <text x="470.0" y="20" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a237e">DbContext and DbSet — Sub-level Flow: a work-order desk</text>
  <text x="470.0" y="38" text-anchor="middle" font-size="11" fill="#666">The clerk (the DbContext) writes out the SQL work order from the model, builds nothing, and stops serving once the desk is closed.</text>
  <text x="210" y="50" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#274e13">START</text>
  <line x1="210" y1="54" x2="210" y2="92" stroke="#333" stroke-width="2"/>
  <polygon points="210,54 210,72 240,63" fill="#38761d"/>
  <line x1="210" y1="92" x2="210" y2="110" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="60" y="110" width="300" height="56" rx="8" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1.5"/>
  <text x="210.0" y="134.0" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#274e13">using (context = new PlainBankContext())</text>
  <text x="210.0" y="149.0" text-anchor="middle" font-size="9" fill="#555">open the desk for one small job</text>
  <line x1="360" y1="138" x2="520" y2="138" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="440" y="130" text-anchor="middle" font-size="9.5" fill="#555">creates</text>
  <rect x="520" y="110" width="340" height="250" rx="8" fill="#e8f4fb" stroke="#3d85c6" stroke-width="1.5"/>
  <text x="690" y="132" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a4a73">the clerk = PlainBankContext object (Heap)</text>
  <text x="690" y="152" text-anchor="middle" font-size="9.5" fill="#333">Customers → door to table Customers</text>
  <text x="690" y="168" text-anchor="middle" font-size="9.5" fill="#333">Accounts → door to table Accounts</text>
  <text x="690" y="188" text-anchor="middle" font-size="9" font-style="italic" fill="#555">knows the model; follows the conventions</text>
  <text x="690" y="214" text-anchor="middle" font-size="9.5" fill="#333">model: Customer and Account</text>
  <text x="690" y="230" text-anchor="middle" font-size="9" fill="#333">settings: SQL Server, connection string from BTAL_SQLSERVER</text>
  <text x="690" y="246" text-anchor="middle" font-size="9" font-style="italic" fill="#555">nothing is connected yet</text>
  <line x1="210" y1="166" x2="210" y2="290" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="60" y="290" width="300" height="56" rx="8" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1.5"/>
  <text x="210.0" y="306.5" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#274e13">string script = context.Database</text>
  <text x="210.0" y="321.5" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#274e13">.GenerateCreateScript();</text>
  <text x="210.0" y="336.5" text-anchor="middle" font-size="9" fill="#555">ask for the work order</text>
  <line x1="360" y1="305" x2="520" y2="305" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="440" y="297" text-anchor="middle" font-size="9.5" fill="#555">asks for the SQL</text>
  <line x1="520" y1="332" x2="362" y2="332" stroke="#333" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="440" y="346" text-anchor="middle" font-size="9.5" fill="#555">returns text only</text>
  <line x1="210" y1="346" x2="210" y2="400" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="60" y="400" width="300" height="50" rx="8" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1.5"/>
  <text x="210.0" y="421.0" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#274e13">Console.WriteLine(script.TrimEnd());</text>
  <text x="210.0" y="436.0" text-anchor="middle" font-size="9" fill="#555">prints the CREATE TABLE … GO text</text>
  <line x1="210" y1="450" x2="210" y2="500" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="60" y="500" width="300" height="50" rx="8" fill="#fffbe8" stroke="#f1c232" stroke-width="1.5"/>
  <text x="210.0" y="521.0" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#7f6000">}  — Dispose() runs here</text>
  <text x="210.0" y="536.0" text-anchor="middle" font-size="9" fill="#555">close the desk</text>
  <rect x="520" y="500" width="340" height="150" rx="8" fill="#fdebd9" stroke="#e69138" stroke-width="1.5"/>
  <text x="690" y="522" text-anchor="middle" font-size="10" font-weight="bold" fill="#8a5a10">the same clerk, after Dispose: a closed desk</text>
  <text x="690" y="540" text-anchor="middle" font-size="9" fill="#555">the object is still there but cannot be used again</text>
  <text x="690" y="570" text-anchor="middle" font-size="9.5" fill="#333">any further call on it</text>
  <text x="690" y="586" text-anchor="middle" font-size="9.5" fill="#333">is refused with an exception</text>
  <line x1="360" y1="525" x2="520" y2="525" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="440" y="517" text-anchor="middle" font-size="9.5" fill="#555">releases it</text>
  <line x1="210" y1="550" x2="210" y2="600" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="60" y="600" width="300" height="50" rx="8" fill="#fdebd9" stroke="#e69138" stroke-width="1.5"/>
  <text x="210.0" y="621.0" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#8a5a10">try: context.Database.GenerateCreateScript()</text>
  <text x="210.0" y="636.0" text-anchor="middle" font-size="9" fill="#555">ask the closed desk again</text>
  <line x1="360" y1="625" x2="520" y2="625" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="440" y="617" text-anchor="middle" font-size="9.5" fill="#555">uses it after Dispose</text>
  <polyline points="780,650 780,710 362,710" fill="none" stroke="#333" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="570" y="702" text-anchor="middle" font-size="9.5" fill="#990000">throws ObjectDisposedException</text>
  <line x1="210" y1="650" x2="210" y2="700" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="60" y="700" width="300" height="50" rx="8" fill="#f0eaf7" stroke="#8e63ce" stroke-width="1.5"/>
  <text x="210.0" y="721.0" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#4a2e73">catch (ObjectDisposedException)</text>
  <text x="210.0" y="736.0" text-anchor="middle" font-size="9" fill="#555">Console.WriteLine("The disposed context refuses…")</text>
  <rect x="520" y="770" width="340" height="56" rx="8" fill="#f1f1f1" stroke="#777777" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="690.0" y="794.0" text-anchor="middle" font-size="9" font-weight="bold" fill="#333">SQL Server (outside .NET): not contacted</text>
  <text x="690.0" y="809.0" text-anchor="middle" font-size="9" fill="#333">the script is only text; nothing is run</text>
  <line x1="210" y1="750" x2="210" y2="778" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="210" y="792" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#990000">END</text>
  <line x1="210" y1="800" x2="210" y2="840" stroke="#333" stroke-width="2"/>
  <polygon points="210,800 210,818 240,809" fill="#cc0000"/>
  <text x="30" y="880" font-size="10.5" fill="#444"><tspan font-weight="bold">One DbContext per small job, disposed with using:</tspan> it is a short-lived helper, not something to keep for the whole program.</text>
  <text x="30" y="898" font-size="10" font-style="italic" fill="#888">Console.WriteLine prints the whole script (one string, many lines) and then the catch message.</text>
  <text x="30" y="916" font-size="10" font-style="italic" fill="#888">Each method also opens with PrintHeading(): four more Console.WriteLine calls for the title banner (not drawn).</text>
</svg>
