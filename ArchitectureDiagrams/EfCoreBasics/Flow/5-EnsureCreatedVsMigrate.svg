<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1130" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#333"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="1130" fill="#ffffff"/>
  <text x="480.0" y="20" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a237e">EnsureCreated vs Migrate — Sub-level Flow: two builders, one site</text>
  <text x="480.0" y="38" text-anchor="middle" font-size="11" fill="#666">The quick-build builder leaves no paperwork; the by-the-book builder files every work order. They cannot share one site.</text>
  <text x="270" y="106" font-size="11" font-weight="bold" fill="#1a237e">Order A: quick-build first</text>
  <text x="210" y="90" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#274e13">START</text>
  <line x1="210" y1="94" x2="210" y2="132" stroke="#333" stroke-width="2"/>
  <polygon points="210,94 210,112 240,103" fill="#38761d"/>
  <line x1="210" y1="132" x2="210" y2="150" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="60" y="150" width="300" height="56" rx="8" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1.5"/>
  <text x="210.0" y="174.0" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#274e13">ResetTables();</text>
  <text x="210.0" y="189.0" text-anchor="middle" font-size="9" fill="#555">clear the site</text>
  <line x1="360" y1="178" x2="520" y2="178" stroke="#777" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <rect x="520" y="146" width="320" height="64" rx="8" fill="#f1f1f1" stroke="#777777" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="680.0" y="174.0" text-anchor="middle" font-size="9" font-weight="bold" fill="#333">SQL Server (outside .NET)</text>
  <text x="680.0" y="189.0" text-anchor="middle" font-size="9" fill="#333">no tables, no register</text>
  <line x1="210" y1="206" x2="210" y2="240" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="60" y="240" width="300" height="56" rx="8" fill="#fffbe8" stroke="#f1c232" stroke-width="1.5"/>
  <text x="210.0" y="264.0" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#7f6000">context.Database.EnsureCreated()</text>
  <text x="210.0" y="279.0" text-anchor="middle" font-size="9" fill="#555">Console.WriteLine: "Order A: … True"</text>
  <line x1="360" y1="268" x2="520" y2="268" stroke="#777" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <rect x="520" y="236" width="320" height="64" rx="8" fill="#f1f1f1" stroke="#777777" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="680.0" y="256.5" text-anchor="middle" font-size="9" font-weight="bold" fill="#333">SQL Server (outside .NET)</text>
  <text x="680.0" y="271.5" text-anchor="middle" font-size="9" fill="#333">builds Customers + Accounts</text>
  <text x="680.0" y="286.5" text-anchor="middle" font-size="9" fill="#333">writes no register table</text>
  <line x1="210" y1="296" x2="210" y2="330" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="60" y="330" width="300" height="56" rx="8" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1.5"/>
  <text x="210.0" y="354.0" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#274e13">ShowTableNames();</text>
  <text x="210.0" y="369.0" text-anchor="middle" font-size="9" fill="#555">Console.WriteLine + SqlLab.Show</text>
  <line x1="360" y1="358" x2="520" y2="358" stroke="#777" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <rect x="520" y="326" width="320" height="64" rx="8" fill="#f1f1f1" stroke="#777777" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="680.0" y="346.5" text-anchor="middle" font-size="9" font-weight="bold" fill="#333">SQL Server (outside .NET)</text>
  <text x="680.0" y="361.5" text-anchor="middle" font-size="9" fill="#333">lists 2 tables:</text>
  <text x="680.0" y="376.5" text-anchor="middle" font-size="9" fill="#333">Accounts, Customers</text>
  <line x1="210" y1="386" x2="210" y2="420" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="60" y="420" width="300" height="56" rx="8" fill="#fdebd9" stroke="#e69138" stroke-width="1.5"/>
  <text x="210.0" y="444.0" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#8a5a10">try: context.Database.Migrate();</text>
  <text x="210.0" y="459.0" text-anchor="middle" font-size="9" fill="#555">BankContext, tables already exist</text>
  <line x1="360" y1="448" x2="520" y2="448" stroke="#777" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <rect x="520" y="416" width="320" height="64" rx="8" fill="#f1f1f1" stroke="#777777" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="680.0" y="436.5" text-anchor="middle" font-size="9" font-weight="bold" fill="#333">SQL Server (outside .NET)</text>
  <text x="680.0" y="451.5" text-anchor="middle" font-size="9" fill="#333">creates the register table, then</text>
  <text x="680.0" y="466.5" text-anchor="middle" font-size="9" fill="#333">refuses CREATE TABLE (error 2714)</text>
  <line x1="210" y1="476" x2="210" y2="520" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="222" y="502" font-size="9" fill="#990000">throws SqlException</text>
  <rect x="60" y="520" width="300" height="62" rx="8" fill="#f0eaf7" stroke="#8e63ce" stroke-width="1.5"/>
  <text x="210" y="540" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#4a2e73">catch (SqlException ex)</text>
  <text x="210" y="556" text-anchor="middle" font-size="9" fill="#555">Console.WriteLine: "Migrate() failed (error 2714)"</text>
  <text x="210" y="572" text-anchor="middle" font-size="9" font-style="italic" fill="#999">the other branch, "Migrate() worked", is not taken</text>
  <line x1="210" y1="582" x2="210" y2="620" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="60" y="620" width="300" height="56" rx="8" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1.5"/>
  <text x="210.0" y="644.0" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#274e13">ShowTableNames(); SqlLab.Show(COUNT)</text>
  <text x="210.0" y="659.0" text-anchor="middle" font-size="9" fill="#555">Console.WriteLine + two grids</text>
  <line x1="360" y1="648" x2="520" y2="648" stroke="#777" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <rect x="520" y="616" width="320" height="64" rx="8" fill="#f1f1f1" stroke="#777777" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="680.0" y="636.5" text-anchor="middle" font-size="9" font-weight="bold" fill="#333">SQL Server (outside .NET)</text>
  <text x="680.0" y="651.5" text-anchor="middle" font-size="9" fill="#333">3 tables; the register has 0 rows</text>
  <text x="680.0" y="666.5" text-anchor="middle" font-size="9" fill="#333">InitialCreate was never ticked</text>
  <line x1="210" y1="676" x2="210" y2="730" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="232" y="722" font-size="11" font-weight="bold" fill="#1a237e">Order B: by-the-book first</text>
  <line x1="210" y1="730" x2="210" y2="750" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="60" y="750" width="300" height="56" rx="8" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1.5"/>
  <text x="210.0" y="774.0" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#274e13">ResetTables();</text>
  <text x="210.0" y="789.0" text-anchor="middle" font-size="9" fill="#555">clear the site again</text>
  <line x1="360" y1="778" x2="520" y2="778" stroke="#777" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <rect x="520" y="746" width="320" height="64" rx="8" fill="#f1f1f1" stroke="#777777" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="680.0" y="774.0" text-anchor="middle" font-size="9" font-weight="bold" fill="#333">SQL Server (outside .NET)</text>
  <text x="680.0" y="789.0" text-anchor="middle" font-size="9" fill="#333">no tables, no register</text>
  <line x1="210" y1="806" x2="210" y2="840" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="60" y="840" width="300" height="56" rx="8" fill="#fffbe8" stroke="#f1c232" stroke-width="1.5"/>
  <text x="210.0" y="864.0" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#7f6000">context.Database.Migrate();</text>
  <text x="210.0" y="879.0" text-anchor="middle" font-size="9" fill="#555">runs InitialCreate.Up()</text>
  <line x1="360" y1="868" x2="520" y2="868" stroke="#777" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <rect x="520" y="836" width="320" height="64" rx="8" fill="#f1f1f1" stroke="#777777" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="680.0" y="864.0" text-anchor="middle" font-size="9" font-weight="bold" fill="#333">SQL Server (outside .NET)</text>
  <text x="680.0" y="879.0" text-anchor="middle" font-size="9" fill="#333">tables + register, 1 row ticked</text>
  <line x1="210" y1="896" x2="210" y2="930" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="60" y="930" width="300" height="56" rx="8" fill="#fdebd9" stroke="#e69138" stroke-width="1.5"/>
  <text x="210.0" y="954.0" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#8a5a10">context.Database.EnsureCreated()</text>
  <text x="210.0" y="969.0" text-anchor="middle" font-size="9" fill="#555">Console.WriteLine: "Order B: … False"</text>
  <line x1="360" y1="958" x2="520" y2="958" stroke="#777" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <rect x="520" y="926" width="320" height="64" rx="8" fill="#f1f1f1" stroke="#777777" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="680.0" y="946.5" text-anchor="middle" font-size="9" font-weight="bold" fill="#333">SQL Server (outside .NET)</text>
  <text x="680.0" y="961.5" text-anchor="middle" font-size="9" fill="#333">tables already exist, so it</text>
  <text x="680.0" y="976.5" text-anchor="middle" font-size="9" fill="#333">does nothing and returns False</text>
  <line x1="210" y1="986" x2="210" y2="1000" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="210" y="1012" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#990000">END</text>
  <line x1="210" y1="1020" x2="210" y2="1060" stroke="#333" stroke-width="2"/>
  <polygon points="210,1020 210,1038 240,1029" fill="#cc0000"/>
  <text x="30" y="1090" font-size="10.5" fill="#444"><tspan font-weight="bold">Pick one per database:</tspan> migrations for a database that will keep changing, EnsureCreated only for a throwaway one.</text>
  <text x="30" y="1108" font-size="10" font-style="italic" fill="#888">Each method also opens with PrintHeading() — four Console.WriteLine calls for the banner (not drawn).</text>
</svg>
