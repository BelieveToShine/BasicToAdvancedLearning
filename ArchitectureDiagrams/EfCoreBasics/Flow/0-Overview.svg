<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 880" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#333"/></marker>
  </defs>
  <rect x="0" y="0" width="1000" height="880" fill="#ffffff"/>
  <text x="500" y="24" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a237e">EF Core basics — Functional Flow (high level: who calls whom, in what order)</text>
  <text x="500" y="44" text-anchor="middle" font-size="12" fill="#666">For the detail of any one method, zoom into its own Flow/&lt;N&gt;-&lt;Name&gt;.svg (named in each note below).</text>
  <g font-size="11" fill="#333"><line x1="380" y1="64" x2="416" y2="64" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/><text x="422" y="68">Call (→)</text><line x1="530" y1="64" x2="566" y2="64" stroke="#333" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a)"/><text x="572" y="68">Return (←)</text></g>
  <rect x="60" y="80" width="180" height="42" rx="8" fill="#eef2f7" stroke="#555" stroke-width="1.3"/>
  <text x="150" y="105" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">Program.cs (Main)</text>
  <rect x="400" y="80" width="220" height="42" rx="8" fill="#eef2f7" stroke="#555" stroke-width="1.3"/>
  <text x="510" y="97" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#222">EfCoreBasicsExample</text>
  <text x="510" y="112" text-anchor="middle" font-size="9" fill="#666">(implements ILearningTopic)</text>
  <rect x="710" y="80" width="220" height="42" rx="8" fill="#eef2f7" stroke="#555" stroke-width="1.3"/>
  <text x="820" y="105" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">EfCoreBasicsDemo</text>
  <line x1="150" y1="122" x2="150" y2="780" stroke="#999" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="510" y1="122" x2="510" y2="780" stroke="#999" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="820" y1="122" x2="820" y2="780" stroke="#999" stroke-width="1" stroke-dasharray="4 3"/>
  <rect x="146" y="170" width="8" height="600" rx="0" fill="#cfe2f3" stroke="#3d85c6" stroke-width="1"/>
  <rect x="506" y="190" width="8" height="560" rx="0" fill="#cfe2f3" stroke="#3d85c6" stroke-width="1"/>
  <text x="330" y="182" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#123">new EfCoreBasicsExample();  topic.Explain()</text>
  <line x1="150" y1="190" x2="510" y2="190" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="330" y="208" text-anchor="middle" font-size="9" font-style="italic" fill="#777">first: SqlLab.IsReady() — if it says false,</text>
  <text x="330" y="220" text-anchor="middle" font-size="9" font-style="italic" fill="#777">Explain() returns and no method below runs</text>
  <rect x="816" y="250" width="8" height="68" rx="0" fill="#fffbe8" stroke="#f1c232" stroke-width="1"/>
  <text x="665" y="242" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#123">ExplainModelClasses()</text>
  <line x1="510" y1="250" x2="820" y2="250" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="665" y="267" text-anchor="middle" font-size="9.5" fill="#7f6000">Plain C# classes become rows</text>
  <text x="665" y="280" text-anchor="middle" font-size="9" fill="#555">Console.WriteLine</text>
  <text x="665" y="293" text-anchor="middle" font-size="9" fill="#555">see Flow/1-ModelClasses.svg</text>
  <line x1="820" y1="318" x2="510" y2="318" stroke="#333" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="665" y="312" text-anchor="middle" font-size="9" fill="#555">returns</text>
  <rect x="816" y="350" width="8" height="68" rx="0" fill="#e8f4fb" stroke="#3d85c6" stroke-width="1"/>
  <text x="665" y="342" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#123">ExplainDbContextAndDbSet()</text>
  <line x1="510" y1="350" x2="820" y2="350" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="665" y="367" text-anchor="middle" font-size="9.5" fill="#1a4a73">The DbContext and its generated script</text>
  <text x="665" y="380" text-anchor="middle" font-size="9" fill="#555">Console.WriteLine</text>
  <text x="665" y="393" text-anchor="middle" font-size="9" fill="#555">see Flow/2-DbContextAndDbSet.svg</text>
  <line x1="820" y1="418" x2="510" y2="418" stroke="#333" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="665" y="412" text-anchor="middle" font-size="9" fill="#555">returns</text>
  <rect x="816" y="450" width="8" height="68" rx="0" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1"/>
  <text x="665" y="442" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#123">ExplainFluentApiConfiguration()</text>
  <line x1="510" y1="450" x2="820" y2="450" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="665" y="467" text-anchor="middle" font-size="9.5" fill="#274e13">OnModelCreating refines the script</text>
  <text x="665" y="480" text-anchor="middle" font-size="9" fill="#555">Console.WriteLine</text>
  <text x="665" y="493" text-anchor="middle" font-size="9" fill="#555">see Flow/3-FluentApiConfiguration.svg</text>
  <line x1="820" y1="518" x2="510" y2="518" stroke="#333" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="665" y="512" text-anchor="middle" font-size="9" fill="#555">returns</text>
  <rect x="816" y="550" width="8" height="68" rx="0" fill="#fdebd9" stroke="#e69138" stroke-width="1"/>
  <text x="665" y="542" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#123">ExplainMigrations()</text>
  <line x1="510" y1="550" x2="820" y2="550" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="665" y="567" text-anchor="middle" font-size="9.5" fill="#8a5a10">Migrate() applies InitialCreate</text>
  <text x="665" y="580" text-anchor="middle" font-size="9" fill="#555">Console.WriteLine · SqlLab.Run / Show</text>
  <text x="665" y="593" text-anchor="middle" font-size="9" fill="#555">see Flow/4-Migrations.svg</text>
  <line x1="820" y1="618" x2="510" y2="618" stroke="#333" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="665" y="612" text-anchor="middle" font-size="9" fill="#555">returns</text>
  <rect x="816" y="650" width="8" height="68" rx="0" fill="#f0eaf7" stroke="#8e63ce" stroke-width="1"/>
  <text x="665" y="642" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#123">ExplainEnsureCreatedVsMigrate()</text>
  <line x1="510" y1="650" x2="820" y2="650" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="665" y="667" text-anchor="middle" font-size="9.5" fill="#4a2e73">Two ways to build; pick one</text>
  <text x="665" y="680" text-anchor="middle" font-size="9" fill="#555">Console.WriteLine · SqlLab.Run / Show</text>
  <text x="665" y="693" text-anchor="middle" font-size="9" fill="#555">see Flow/5-EnsureCreatedVsMigrate.svg</text>
  <line x1="820" y1="718" x2="510" y2="718" stroke="#333" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="665" y="712" text-anchor="middle" font-size="9" fill="#555">returns</text>
  <text x="330" y="770" text-anchor="middle" font-size="10" fill="#555">Explain() returns — program ends</text>
  <line x1="510" y1="776" x2="150" y2="776" stroke="#333" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <circle cx="150" cy="796" r="6" fill="#cc0000"/>
  <text x="164" y="800" font-size="10.5" font-weight="bold" fill="#990000">End</text>
  <text x="40" y="830" font-size="10.5" fill="#444"><tspan font-weight="bold">Where to where, in one line:</tspan> Program.cs calls Explain() once; EfCoreBasicsExample checks SQL Server is reachable, then calls all five methods in order.</text>
  <text x="40" y="850" font-size="10" font-style="italic" fill="#888">The entity and context classes and SQL Server join in along the way, but EfCoreBasicsDemo calls them, so they get no lifeline. Methods 4 and 5 use the migration files in Migrations/.</text>
</svg>
