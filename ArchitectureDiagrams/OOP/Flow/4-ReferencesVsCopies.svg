<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 610" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#333"/></marker>
  </defs>
  <rect x="0" y="0" width="900" height="610" fill="#ffffff"/>
  <text x="450.0" y="20" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a237e">References vs Copies — Sub-level Flow: keys and houses</text>
  <text x="450.0" y="38" text-anchor="middle" font-size="11" fill="#666">A variable holds a KEY to an object. `=` copies the key, so two variables can open the same house.</text>
  <text x="140" y="58" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#274e13">START</text>
  <line x1="140" y1="62" x2="140" y2="100" stroke="#333" stroke-width="2"/>
  <polygon points="140,62 140,80 170,71" fill="#38761d"/>
  <line x1="140" y1="100" x2="140" y2="108" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="185" y="82" font-size="10" fill="#333">1 · BankAccount accountA = new BankAccount("Anita", 500m);</text>
  <rect x="60" y="110" width="160" height="44" rx="8" fill="#fffbe8" stroke="#f1c232" stroke-width="1.5"/>
  <text x="140" y="129" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7f6000">accountA</text>
  <text x="140" y="145" text-anchor="middle" font-size="9" fill="#555">a pointer — the key</text>
  <rect x="360" y="110" width="160" height="44" rx="8" fill="#fffbe8" stroke="#f1c232" stroke-width="1.5"/>
  <text x="440" y="129" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7f6000">accountB</text>
  <text x="440" y="145" text-anchor="middle" font-size="9" fill="#555">a pointer — the key</text>
  <rect x="640" y="110" width="160" height="44" rx="8" fill="#fffbe8" stroke="#f1c232" stroke-width="1.5"/>
  <text x="720" y="129" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7f6000">accountC</text>
  <text x="720" y="145" text-anchor="middle" font-size="9" fill="#555">a pointer — the key</text>
  <text x="640" y="100" font-size="9.5" fill="#333">4 · accountC = new BankAccount("Anita", 500m)</text>
  <line x1="220" y1="132" x2="360" y2="132" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="290" y="124" text-anchor="middle" font-size="9.5" fill="#333">2 · accountB = accountA</text>
  <text x="290" y="148" text-anchor="middle" font-size="9" font-style="italic" fill="#555">copies the KEY</text>
  <rect x="100" y="240" width="380" height="96" rx="8" fill="#fff3e6" stroke="#e69138" stroke-width="1.5"/>
  <text x="290" y="262" text-anchor="middle" font-size="11" font-weight="bold" fill="#7f4e00">object #1 (on the Heap)</text>
  <text x="290" y="282" text-anchor="middle" font-size="10" fill="#333">_ownerName = "Anita"</text>
  <text x="290" y="300" text-anchor="middle" font-size="10" font-weight="bold" fill="#cc0000">_balance = 500 → 600</text>
  <text x="290" y="320" text-anchor="middle" font-size="9" fill="#555">(the Deposit(100m) was made through accountB)</text>
  <rect x="600" y="240" width="240" height="96" rx="8" fill="#fff3e6" stroke="#e69138" stroke-width="1.5"/>
  <text x="720" y="262" text-anchor="middle" font-size="11" font-weight="bold" fill="#7f4e00">object #2 (on the Heap)</text>
  <text x="720" y="282" text-anchor="middle" font-size="10" fill="#333">_ownerName = "Anita"</text>
  <text x="720" y="300" text-anchor="middle" font-size="10" fill="#333">_balance = 500</text>
  <text x="720" y="320" text-anchor="middle" font-size="9" fill="#555">(a separate object — its own fields)</text>
  <line x1="140" y1="154" x2="140" y2="240" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="440" y1="154" x2="440" y2="240" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="720" y1="154" x2="720" y2="240" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="448" y="196" font-size="9.5" fill="#333">3 · accountB.Deposit(100m)</text>
  <text x="290" y="205" text-anchor="middle" font-size="10" font-weight="bold" fill="#cc0000">both keys open the SAME house<animate attributeName="opacity" values="1;0.3;1" dur="3s" repeatCount="indefinite"/></text>
  <rect x="100" y="390" width="380" height="44" rx="8" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1.5"/>
  <text x="290" y="417" text-anchor="middle" font-size="10" font-weight="bold" fill="#274e13">ReferenceEquals(accountA, accountB)  →  True</text>
  <rect x="560" y="390" width="300" height="44" rx="8" fill="#fdebd9" stroke="#e69138" stroke-width="1.5"/>
  <text x="710" y="417" text-anchor="middle" font-size="10" font-weight="bold" fill="#8a5a10">ReferenceEquals(accountA, accountC)  →  False</text>
  <line x1="290" y1="336" x2="290" y2="390" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="710" y1="336" x2="710" y2="390" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <polyline points="290,434 290,456 450,456" fill="none" stroke="#333" stroke-width="1.6"/>
  <polyline points="710,434 710,456 450,456" fill="none" stroke="#333" stroke-width="1.6"/>
  <line x1="450" y1="456" x2="450" y2="474" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="450" y="488" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#990000">END</text>
  <line x1="450" y1="496" x2="450" y2="536" stroke="#333" stroke-width="2"/>
  <polygon points="450,496 450,514 480,505" fill="#cc0000"/>
  <text x="30" y="560" font-size="10.5" fill="#444"><tspan font-weight="bold">Copying a variable copies the key, never the house.</tspan> Only `new` builds another house.</text>
  <text x="30" y="578" font-size="10" font-style="italic" fill="#888">Console.WriteLine prints each Describe() and each ReferenceEquals result. Compare int in Topic 1, where = really did copy the value: a class is a reference type.</text>
</svg>
