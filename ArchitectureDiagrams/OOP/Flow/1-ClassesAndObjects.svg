<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 570" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#333"/></marker>
  </defs>
  <rect x="0" y="0" width="900" height="570" fill="#ffffff"/>
  <text x="450.0" y="20" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a237e">Classes &amp; Objects — Sub-level Flow: one blueprint, two stamped objects</text>
  <text x="450.0" y="38" text-anchor="middle" font-size="11" fill="#666">A class is a blueprint; each `new` stamps out a separate object with its own fields.</text>
  <text x="450" y="70" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#274e13">START</text>
  <line x1="450" y1="74" x2="450" y2="112" stroke="#333" stroke-width="2"/>
  <polygon points="450,74 450,92 480,83" fill="#38761d"/>
  <line x1="450" y1="112" x2="450" y2="128" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="200" y="130" width="500" height="74" rx="8" fill="#e8f4fb" stroke="#3d85c6" stroke-width="1.5"/>
  <text x="450" y="152" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a4a73">class BankAccount — the blueprint</text>
  <text x="450" y="171" text-anchor="middle" font-size="10" fill="#333">fields: _ownerName, _balance</text>
  <text x="450" y="188" text-anchor="middle" font-size="10" fill="#333">methods: Deposit(), Withdraw(), Describe()</text>
  <line x1="290" y1="204" x2="290" y2="290" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="610" y1="204" x2="610" y2="290" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="282" y="250" text-anchor="end" font-size="10" fill="#333">new BankAccount("Anita", 500m)</text>
  <text x="618" y="250" font-size="10" fill="#333">new BankAccount("Ravi", 1200m)</text>
  <rect x="170" y="292" width="240" height="116" rx="8" fill="#fffbe8" stroke="#f1c232" stroke-width="1.5"/>
  <text x="290" y="313" text-anchor="middle" font-size="11" font-weight="bold" fill="#7f6000">anitaAccount → object #1</text>
  <text x="290" y="335" text-anchor="middle" font-size="10" fill="#333">_ownerName = "Anita"</text>
  <text x="290" y="353" text-anchor="middle" font-size="10" fill="#333">_balance = 500</text>
  <text x="290" y="382" text-anchor="middle" font-size="10" font-weight="bold" fill="#cc0000">Deposit(250m) → _balance = 750<animate attributeName="opacity" values="1;0.3;1" dur="3s" repeatCount="indefinite"/></text>
  <rect x="490" y="292" width="240" height="116" rx="8" fill="#fffbe8" stroke="#f1c232" stroke-width="1.5"/>
  <text x="610" y="313" text-anchor="middle" font-size="11" font-weight="bold" fill="#7f6000">raviAccount → object #2</text>
  <text x="610" y="335" text-anchor="middle" font-size="10" fill="#333">_ownerName = "Ravi"</text>
  <text x="610" y="353" text-anchor="middle" font-size="10" fill="#333">_balance = 1200</text>
  <text x="610" y="382" text-anchor="middle" font-size="10" font-weight="bold" fill="#274e13">untouched — still 1200</text>
  <polyline points="290,408 290,430 450,430" fill="none" stroke="#333" stroke-width="1.6"/>
  <polyline points="610,408 610,430 450,430" fill="none" stroke="#333" stroke-width="1.6"/>
  <line x1="450" y1="430" x2="450" y2="446" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="450" y="460" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#990000">END</text>
  <line x1="450" y1="468" x2="450" y2="508" stroke="#333" stroke-width="2"/>
  <polygon points="450,468 450,486 480,477" fill="#cc0000"/>
  <text x="30" y="530" font-size="10.5" fill="#444"><tspan font-weight="bold">Notice:</tspan> the blueprint is drawn ONCE, the objects twice — and they never share a _balance.</text>
  <text x="30" y="548" font-size="10" font-style="italic" fill="#888">Console.WriteLine(...Describe()) prints each object's own data: 4 lines in all. How `new` sets the fields up is the next page (Constructors).</text>
</svg>
