<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 610" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#333"/></marker>
  </defs>
  <rect x="0" y="0" width="900" height="610" fill="#ffffff"/>
  <text x="450.0" y="20" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a237e">Constructors — Sub-level Flow: an assembly line</text>
  <text x="450.0" y="38" text-anchor="middle" font-size="11" fill="#666">Each `new` rolls a ticket through a constructor station, and a finished object comes out the other end.</text>
  <text x="130" y="58" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#274e13">START</text>
  <line x1="130" y1="62" x2="130" y2="100" stroke="#333" stroke-width="2"/>
  <polygon points="130,62 130,80 160,71" fill="#38761d"/>
  <line x1="130" y1="100" x2="130" y2="110" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="30" y="110" width="200" height="60" rx="8" fill="#e8f4fb" stroke="#3d85c6" stroke-width="1.5"/>
  <text x="130" y="136" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a4a73">new BankAccount("Anita", 500m)</text>
  <text x="130" y="154" text-anchor="middle" font-size="9" fill="#555">→ fullAccount</text>
  <rect x="640" y="110" width="230" height="60" rx="8" fill="#fffbe8" stroke="#f1c232" stroke-width="1.5"/>
  <text x="755" y="136" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7f6000">fullAccount → object</text>
  <text x="755" y="154" text-anchor="middle" font-size="9.5" fill="#333">Anita · _balance = 500</text>
  <line x1="230" y1="140" x2="290" y2="140" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="580" y1="140" x2="640" y2="140" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <circle cx="236" cy="140" r="4" fill="#e69138"><animate attributeName="cx" values="236;284" dur="2.5s" repeatCount="indefinite"/></circle>
  <rect x="30" y="230" width="200" height="60" rx="8" fill="#e8f4fb" stroke="#3d85c6" stroke-width="1.5"/>
  <text x="130" y="256" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a4a73">new BankAccount("Ravi")</text>
  <text x="130" y="274" text-anchor="middle" font-size="9" fill="#555">→ emptyAccount</text>
  <rect x="640" y="230" width="230" height="60" rx="8" fill="#fffbe8" stroke="#f1c232" stroke-width="1.5"/>
  <text x="755" y="256" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7f6000">emptyAccount → object</text>
  <text x="755" y="274" text-anchor="middle" font-size="9.5" fill="#333">Ravi · _balance = 0</text>
  <line x1="230" y1="260" x2="290" y2="260" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="580" y1="260" x2="640" y2="260" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <circle cx="236" cy="260" r="4" fill="#e69138"><animate attributeName="cx" values="236;284" dur="2.5s" repeatCount="indefinite"/></circle>
  <rect x="30" y="380" width="200" height="60" rx="8" fill="#e8f4fb" stroke="#3d85c6" stroke-width="1.5"/>
  <text x="130" y="406" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a4a73">new BankAccount("Meena", -50m)</text>
  <text x="130" y="424" text-anchor="middle" font-size="9" fill="#555">→ clampedAccount</text>
  <rect x="640" y="380" width="230" height="60" rx="8" fill="#fffbe8" stroke="#f1c232" stroke-width="1.5"/>
  <text x="755" y="406" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7f6000">clampedAccount → object</text>
  <text x="755" y="424" text-anchor="middle" font-size="9.5" fill="#333">Meena · _balance = 0 (clamped)</text>
  <line x1="230" y1="410" x2="290" y2="410" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="580" y1="410" x2="640" y2="410" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <circle cx="236" cy="410" r="4" fill="#e69138"><animate attributeName="cx" values="236;284" dur="2.5s" repeatCount="indefinite"/></circle>
  <rect x="290" y="100" width="290" height="80" rx="8" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1.5"/>
  <text x="435" y="122" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#274e13">BankAccount(ownerName, openingBalance)</text>
  <text x="435" y="143" text-anchor="middle" font-size="10" fill="#333">_ownerName = ownerName;</text>
  <text x="435" y="161" text-anchor="middle" font-size="9.5" fill="#333">_balance = openingBalance, floored at NoMoney</text>
  <rect x="290" y="210" width="290" height="120" rx="8" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1.5"/>
  <rect x="306" y="220" width="258" height="40" rx="6" fill="#ffffff" stroke="#6aa84f" stroke-width="1"/>
  <text x="435" y="238" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#274e13">BankAccount(ownerName)</text>
  <text x="435" y="253" text-anchor="middle" font-size="9" fill="#555">the one-argument overload</text>
  <line x1="435" y1="260" x2="435" y2="282" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="445" y="275" font-size="9" fill="#274e13">this(ownerName, NoMoney)</text>
  <rect x="306" y="282" width="258" height="38" rx="6" fill="#ffffff" stroke="#6aa84f" stroke-width="1"/>
  <text x="435" y="298" text-anchor="middle" font-size="10" font-weight="bold" fill="#274e13">BankAccount(ownerName, openingBalance)</text>
  <text x="435" y="312" text-anchor="middle" font-size="9" fill="#555">the main constructor does the real work</text>
  <rect x="290" y="370" width="290" height="80" rx="8" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1.5"/>
  <text x="435" y="392" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#274e13">BankAccount(ownerName, openingBalance)</text>
  <text x="435" y="413" text-anchor="middle" font-size="9.5" fill="#333">-50 is below NoMoney, so _balance = 0</text>
  <text x="435" y="431" text-anchor="middle" font-size="10" fill="#333">_ownerName = ownerName;</text>
  <line x1="130" y1="170" x2="130" y2="230" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="130" y1="290" x2="130" y2="380" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="130" y1="440" x2="130" y2="470" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="130" y="486" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#990000">END</text>
  <line x1="130" y1="494" x2="130" y2="534" stroke="#333" stroke-width="2"/>
  <polygon points="130,494 130,512 160,503" fill="#cc0000"/>
  <text x="30" y="560" font-size="10.5" fill="#444"><tspan font-weight="bold">Overloads share one rulebook:</tspan> the one-argument constructor delegates with : this(...), so the clamping rule lives in exactly one place.</text>
  <text x="30" y="578" font-size="10" font-style="italic" fill="#888">Console.WriteLine(x.Describe()) then prints each tray — three lines. The constructor frames are gone the moment `new` returns the finished object.</text>
</svg>
