<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 570" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#333"/></marker>
  </defs>
  <rect x="0" y="0" width="900" height="570" fill="#ffffff"/>
  <text x="450.0" y="20" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a237e">Static Members — Sub-level Flow: a town noticeboard</text>
  <text x="450.0" y="38" text-anchor="middle" font-size="11" fill="#666">The noticeboard (static) exists once. Every house (object) has its own fields, but all of them share the board.</text>
  <text x="440" y="50" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#274e13">START</text>
  <line x1="440" y1="54" x2="440" y2="92" stroke="#333" stroke-width="2"/>
  <polygon points="440,54 440,72 470,63" fill="#38761d"/>
  <line x1="440" y1="92" x2="440" y2="165" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="482" y="72" font-size="9.5" fill="#333">first (not drawn): Bank.Name is read straight off the board</text>
  <rect x="30" y="100" width="190" height="370" rx="8" fill="#f0eaf7" stroke="#8e63ce" stroke-width="1.5"/>
  <text x="125" y="120" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a2e73">Bank (static)</text>
  <text x="125" y="136" text-anchor="middle" font-size="9" font-style="italic" fill="#8a72ab">ONE copy, whole program</text>
  <rect x="42" y="168" width="166" height="44" rx="6" fill="#ffffff" stroke="#8e63ce" stroke-width="1.5"><animate attributeName="stroke-width" values="1;3.5;1" dur="3s" repeatCount="indefinite"/></rect>
  <text x="125" y="184" text-anchor="middle" font-size="9.5" fill="#4a2e73">_accountsOpened</text>
  <text x="125" y="203" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a2e73">0 → 1</text>
  <rect x="42" y="258" width="166" height="44" rx="6" fill="#ffffff" stroke="#8e63ce" stroke-width="1.5"><animate attributeName="stroke-width" values="1;3.5;1" dur="3s" repeatCount="indefinite"/></rect>
  <text x="125" y="274" text-anchor="middle" font-size="9.5" fill="#4a2e73">_accountsOpened</text>
  <text x="125" y="293" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a2e73">1 → 2</text>
  <rect x="42" y="348" width="166" height="44" rx="6" fill="#ffffff" stroke="#8e63ce" stroke-width="1.5"><animate attributeName="stroke-width" values="1;3.5;1" dur="3s" repeatCount="indefinite"/></rect>
  <text x="125" y="364" text-anchor="middle" font-size="9.5" fill="#4a2e73">AccountsOpened  (read)</text>
  <text x="125" y="383" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a2e73">value is 2</text>
  <rect x="42" y="414" width="166" height="44" rx="6" fill="#ffffff" stroke="#8e63ce" stroke-width="1.5"/>
  <text x="125" y="430" text-anchor="middle" font-size="10" font-weight="bold" fill="#4a2e73">Name = "KeyBank"</text>
  <text x="125" y="447" text-anchor="middle" font-size="9" fill="#8a72ab">static readonly</text>
  <rect x="320" y="165" width="240" height="50" rx="8" fill="#e8f4fb" stroke="#3d85c6" stroke-width="1.5"/>
  <text x="440" y="186" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a4a73">Bank.OpenAccount("Anita", 500m)</text>
  <text x="440" y="202" text-anchor="middle" font-size="9" fill="#555">→ anitaAccount</text>
  <rect x="320" y="255" width="240" height="50" rx="8" fill="#e8f4fb" stroke="#3d85c6" stroke-width="1.5"/>
  <text x="440" y="276" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a4a73">Bank.OpenAccount("Ravi", 1200m)</text>
  <text x="440" y="292" text-anchor="middle" font-size="9" fill="#555">→ raviAccount</text>
  <rect x="320" y="345" width="240" height="50" rx="8" fill="#e8f4fb" stroke="#3d85c6" stroke-width="1.5"/>
  <text x="440" y="366" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a4a73">int openedCount = Bank.AccountsOpened;</text>
  <text x="440" y="382" text-anchor="middle" font-size="9" fill="#555">→ a COPY of the counter</text>
  <line x1="320" y1="180" x2="222" y2="180" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="270" y="171" text-anchor="middle" font-size="9" fill="#333">_accountsOpened++</text>
  <line x1="560" y1="180" x2="680" y2="180" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="620" y="171" text-anchor="middle" font-size="9" fill="#333">new BankAccount</text>
  <line x1="680" y1="202" x2="560" y2="202" stroke="#333" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="620" y="216" text-anchor="middle" font-size="9" fill="#555">returns the object</text>
  <rect x="680" y="158" width="190" height="64" rx="8" fill="#fffbe8" stroke="#f1c232" stroke-width="1.5"/>
  <line x1="320" y1="270" x2="222" y2="270" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="270" y="261" text-anchor="middle" font-size="9" fill="#333">_accountsOpened++</text>
  <line x1="560" y1="270" x2="680" y2="270" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="620" y="261" text-anchor="middle" font-size="9" fill="#333">new BankAccount</text>
  <line x1="680" y1="292" x2="560" y2="292" stroke="#333" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="620" y="306" text-anchor="middle" font-size="9" fill="#555">returns the object</text>
  <rect x="680" y="248" width="190" height="64" rx="8" fill="#fffbe8" stroke="#f1c232" stroke-width="1.5"/>
  <text x="775" y="178" text-anchor="middle" font-size="10" font-weight="bold" fill="#7f6000">anitaAccount → object</text>
  <text x="775" y="196" text-anchor="middle" font-size="9.5" fill="#333">Anita · _balance = 500</text>
  <text x="775" y="268" text-anchor="middle" font-size="10" font-weight="bold" fill="#7f6000">raviAccount → object</text>
  <text x="775" y="286" text-anchor="middle" font-size="9.5" fill="#333">Ravi · _balance = 1200</text>
  <line x1="222" y1="360" x2="320" y2="360" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="271" y="351" text-anchor="middle" font-size="9" fill="#333">copies 2</text>
  <line x1="440" y1="215" x2="440" y2="255" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="440" y1="305" x2="440" y2="345" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="440" y1="395" x2="440" y2="428" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="440" y="442" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#990000">END</text>
  <line x1="440" y1="450" x2="440" y2="490" stroke="#333" stroke-width="2"/>
  <polygon points="440,450 440,468 470,459" fill="#cc0000"/>
  <text x="30" y="510" font-size="10.5" fill="#444"><tspan font-weight="bold">Houses have their own _balance; the noticeboard exists once.</tspan> Both OpenAccount calls ticked the SAME counter: 0 → 1 → 2.</text>
  <text x="30" y="528" font-size="10" font-style="italic" fill="#888">Console.WriteLine prints Bank.Name, each Describe() and the count. You reach static members through the TYPE (Bank.), never through an account object.</text>
</svg>
