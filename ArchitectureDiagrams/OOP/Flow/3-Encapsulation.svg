<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 570" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#333"/></marker>
  </defs>
  <rect x="0" y="0" width="900" height="570" fill="#ffffff"/>
  <text x="450.0" y="20" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a237e">Encapsulation — Sub-level Flow: a teller window in front of a vault</text>
  <text x="450.0" y="38" text-anchor="middle" font-size="11" fill="#666">Callers never touch _balance. Every request goes through a public method that checks the rules first.</text>
  <text x="130" y="50" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#274e13">START</text>
  <line x1="130" y1="54" x2="130" y2="92" stroke="#333" stroke-width="2"/>
  <polygon points="130,54 130,72 160,63" fill="#38761d"/>
  <line x1="130" y1="90" x2="130" y2="115" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="310" y="108" width="580" height="340" rx="10" fill="none" stroke="#888" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="600" y="102" text-anchor="middle" font-size="10" font-weight="bold" fill="#555">inside class BankAccount — the private zone</text>
  <rect x="680" y="130" width="190" height="290" rx="8" fill="#fdebd9" stroke="#e69138" stroke-width="1.5"/>
  <text x="775" y="152" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a5a10">_balance  [private]</text>
  <text x="775" y="168" text-anchor="middle" font-size="9.5" font-style="italic" fill="#b9803f">the vault</text>
  <text x="775" y="192" text-anchor="middle" font-size="10" fill="#333">starts at 500</text>
  <text x="775" y="222" text-anchor="middle" font-size="10" fill="#274e13">Deposit(-20m) and Withdraw(900m):</text>
  <text x="775" y="237" text-anchor="middle" font-size="10" fill="#274e13">refused, still 500, untouched</text>
  <text x="775" y="330" text-anchor="middle" font-size="16" font-weight="bold" fill="#cc0000">500 → 300</text>
  <text x="775" y="348" text-anchor="middle" font-size="9" fill="#555">after Withdraw(200m)</text>
  <rect x="30" y="115" width="200" height="50" rx="8" fill="#e8f4fb" stroke="#3d85c6" stroke-width="1.5"/>
  <text x="130" y="136" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1a4a73">account.Deposit(-20m)</text>
  <text x="130" y="152" text-anchor="middle" font-size="9" fill="#555">→ depositAccepted</text>
  <rect x="330" y="115" width="250" height="50" rx="8" fill="#fffbe8" stroke="#f1c232" stroke-width="1.5"/>
  <text x="455" y="134" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7f6000">Deposit(decimal amount)</text>
  <text x="455" y="151" text-anchor="middle" font-size="9" fill="#333">if (amount &lt;= NoMoney) return false;</text>
  <line x1="230" y1="130" x2="330" y2="130" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="330" y1="152" x2="230" y2="152" stroke="#333" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="280" y="167" text-anchor="middle" font-size="9" fill="#555">returns false</text>
  <rect x="30" y="195" width="200" height="50" rx="8" fill="#e8f4fb" stroke="#3d85c6" stroke-width="1.5"/>
  <text x="130" y="216" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1a4a73">account.Withdraw(900m)</text>
  <text x="130" y="232" text-anchor="middle" font-size="9" fill="#555">→ overdrawAccepted</text>
  <rect x="330" y="195" width="250" height="50" rx="8" fill="#fffbe8" stroke="#f1c232" stroke-width="1.5"/>
  <text x="455" y="214" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7f6000">Withdraw(decimal amount)</text>
  <text x="455" y="231" text-anchor="middle" font-size="9" fill="#333">if (amount &lt;= NoMoney || amount &gt; _balance)</text>
  <line x1="230" y1="210" x2="330" y2="210" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="330" y1="232" x2="230" y2="232" stroke="#333" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="280" y="247" text-anchor="middle" font-size="9" fill="#555">returns false</text>
  <rect x="30" y="275" width="200" height="50" rx="8" fill="#e8f4fb" stroke="#3d85c6" stroke-width="1.5"/>
  <text x="130" y="296" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1a4a73">account.Withdraw(200m)</text>
  <text x="130" y="312" text-anchor="middle" font-size="9" fill="#555">→ withdrawAccepted</text>
  <rect x="330" y="275" width="250" height="50" rx="8" fill="#fffbe8" stroke="#f1c232" stroke-width="1.5"/>
  <text x="455" y="294" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7f6000">Withdraw(decimal amount)</text>
  <text x="455" y="311" text-anchor="middle" font-size="9" fill="#333">both checks pass → _balance -= amount;</text>
  <line x1="230" y1="290" x2="330" y2="290" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="330" y1="312" x2="230" y2="312" stroke="#333" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="280" y="327" text-anchor="middle" font-size="9" fill="#555">returns true</text>
  <line x1="580" y1="300" x2="680" y2="300" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="630" y="292" text-anchor="middle" font-size="9" fill="#333">_balance -= amount</text>
  <text x="630" y="150" text-anchor="middle" font-size="9" font-style="italic" fill="#cc0000">stops here</text>
  <text x="630" y="230" text-anchor="middle" font-size="9" font-style="italic" fill="#cc0000">stops here</text>
  <rect x="30" y="365" width="200" height="50" rx="8" fill="#ffffff" stroke="#cc0000" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="130" y="386" text-anchor="middle" font-size="10" font-weight="bold" fill="#990000">account._balance = 1_000_000m;</text>
  <text x="130" y="402" text-anchor="middle" font-size="9" fill="#990000">compile error: it is private</text>
  <line x1="230" y1="390" x2="306" y2="390" stroke="#cc0000" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <circle cx="320" cy="390" r="10" fill="#ffffff" stroke="#cc0000" stroke-width="2"/>
  <text x="320" y="394" text-anchor="middle" font-size="11" font-weight="bold" fill="#cc0000">X</text>
  <text x="340" y="394" font-size="10" font-weight="bold" fill="#cc0000">private — the compiler refuses it</text>
  <line x1="130" y1="165" x2="130" y2="195" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="130" y1="245" x2="130" y2="275" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="130" y1="325" x2="130" y2="365" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="130" y1="415" x2="130" y2="438" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="130" y="452" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#990000">END</text>
  <line x1="130" y1="460" x2="130" y2="500" stroke="#333" stroke-width="2"/>
  <polygon points="130,460 130,478 160,469" fill="#cc0000"/>
  <text x="30" y="530" font-size="10.5" fill="#444"><tspan font-weight="bold">Why bother?</tspan> Every change to _balance goes through ONE door, so the rules (positive amounts, no overdraft) can never be skipped.</text>
  <text x="30" y="548" font-size="10" font-style="italic" fill="#888">Console.WriteLine prints each result and the balance, read through the read-only Balance property. A property reads like a field but cannot be assigned from outside.</text>
</svg>
