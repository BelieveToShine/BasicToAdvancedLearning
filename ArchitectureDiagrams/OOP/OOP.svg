<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 600" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#333"/></marker>
  </defs>
  <rect x="0" y="0" width="1280" height="600" fill="#ffffff"/>
  <text x="640" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a237e">C# OOP — Classes, Constructors, Encapsulation, References, Static</text>
  <text x="640" y="48" text-anchor="middle" font-size="12" fill="#666">OOPDemo.cs holds the logic; BankAccount.cs and Bank.cs are the running example. Each box below is one Explain*() method — see Flow/0-Overview.svg for call order.</text>
  <g font-size="10" fill="#333"><rect x="60" y="62" width="12" height="12" rx="2" fill="#e8f4fb" stroke="#3d85c6"/><text x="76" y="72">Classes &amp; Objects</text></g>
  <g font-size="10" fill="#333"><rect x="220" y="62" width="12" height="12" rx="2" fill="#eaf6ea" stroke="#6aa84f"/><text x="236" y="72">Constructors</text></g>
  <g font-size="10" fill="#333"><rect x="340" y="62" width="12" height="12" rx="2" fill="#fdebd9" stroke="#e69138"/><text x="356" y="72">Encapsulation</text></g>
  <g font-size="10" fill="#333"><rect x="470" y="62" width="12" height="12" rx="2" fill="#fffbe8" stroke="#f1c232"/><text x="486" y="72">References vs Copies</text></g>
  <g font-size="10" fill="#333"><rect x="640" y="62" width="12" height="12" rx="2" fill="#f0eaf7" stroke="#8e63ce"/><text x="656" y="72">Static Members</text></g>
  <rect x="40" y="100" width="360" height="190" rx="10" fill="#e8f4fb" stroke="#3d85c6" stroke-width="1.5"/>
  <text x="220" y="122" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a4a73">1 · Classes &amp; Objects</text>
  <text x="220" y="138" text-anchor="middle" font-size="9.5" font-style="italic" fill="#5a86ab">ExplainClassesAndObjects()</text>
  <rect x="56" y="148" width="328" height="70" rx="6" fill="#ffffff" stroke="#b8d9ef" stroke-width="1"/>
  <text x="66" y="166" font-size="9.5" fill="#333">BankAccount anitaAccount = new BankAccount("Anita", 500m);</text>
  <text x="66" y="184" font-size="9.5" fill="#333">anitaAccount.Deposit(250m);  // raviAccount unaffected</text>
  <text x="220" y="242" text-anchor="middle" font-size="9.5" fill="#1a4a73">A class is the blueprint; `new` stamps</text>
  <text x="220" y="256" text-anchor="middle" font-size="9.5" fill="#1a4a73">out separate objects with their own fields.</text>
  <rect x="460" y="100" width="360" height="190" rx="10" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1.5"/>
  <text x="640" y="122" text-anchor="middle" font-size="12" font-weight="bold" fill="#274e13">2 · Constructors</text>
  <text x="640" y="138" text-anchor="middle" font-size="9.5" font-style="italic" fill="#5a8a4a">ExplainConstructors()</text>
  <rect x="476" y="148" width="328" height="70" rx="6" fill="#ffffff" stroke="#bfe0b0" stroke-width="1"/>
  <text x="486" y="166" font-size="9.5" fill="#333">new BankAccount("Ravi")  →  balance 0</text>
  <text x="486" y="184" font-size="9.5" fill="#333">new BankAccount("Meena", -50m)  →  clamped to 0</text>
  <text x="640" y="242" text-anchor="middle" font-size="9.5" fill="#274e13">Runs at `new` to set the object up;</text>
  <text x="640" y="256" text-anchor="middle" font-size="9.5" fill="#274e13">overloads hand off with : this(...).</text>
  <rect x="880" y="100" width="360" height="190" rx="10" fill="#fdebd9" stroke="#e69138" stroke-width="1.5"/>
  <text x="1060" y="122" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a5a10">3 · Encapsulation</text>
  <text x="1060" y="138" text-anchor="middle" font-size="9.5" font-style="italic" fill="#b9803f">ExplainEncapsulation()</text>
  <rect x="896" y="148" width="328" height="70" rx="6" fill="#ffffff" stroke="#f3d3ac" stroke-width="1"/>
  <text x="906" y="166" font-size="9.5" fill="#333">account.Deposit(-20m)  →  false (refused)</text>
  <text x="906" y="184" font-size="9.5" fill="#333">account.Withdraw(200m)  →  true  (balance 300)</text>
  <text x="1060" y="242" text-anchor="middle" font-size="9.5" fill="#8a5a10">Private fields, public methods: the object</text>
  <text x="1060" y="256" text-anchor="middle" font-size="9.5" fill="#8a5a10">enforces its own rules.</text>
  <rect x="240" y="320" width="360" height="190" rx="10" fill="#fffbe8" stroke="#f1c232" stroke-width="1.5"/>
  <text x="420" y="342" text-anchor="middle" font-size="12" font-weight="bold" fill="#7f6000">4 · References vs Copies</text>
  <text x="420" y="358" text-anchor="middle" font-size="9.5" font-style="italic" fill="#a08321">ExplainReferencesVsCopies()</text>
  <rect x="256" y="368" width="328" height="70" rx="6" fill="#ffffff" stroke="#f0dfa0" stroke-width="1"/>
  <text x="266" y="386" font-size="9.5" fill="#333">BankAccount accountB = accountA;</text>
  <text x="266" y="404" font-size="9.5" fill="#333">ReferenceEquals(accountA, accountB)  →  True</text>
  <text x="420" y="462" text-anchor="middle" font-size="9.5" fill="#7f6000">A variable holds a pointer, so = copies</text>
  <text x="420" y="476" text-anchor="middle" font-size="9.5" fill="#7f6000">the key — not the house.</text>
  <rect x="680" y="320" width="360" height="190" rx="10" fill="#f0eaf7" stroke="#8e63ce" stroke-width="1.5"/>
  <text x="860" y="342" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a2e73">5 · Static Members</text>
  <text x="860" y="358" text-anchor="middle" font-size="9.5" font-style="italic" fill="#8a72ab">ExplainStaticMembers()</text>
  <rect x="696" y="368" width="328" height="70" rx="6" fill="#ffffff" stroke="#dccbef" stroke-width="1"/>
  <text x="706" y="386" font-size="9.5" fill="#333">Bank.OpenAccount("Anita", 500m)</text>
  <text x="706" y="404" font-size="9.5" fill="#333">int openedCount = Bank.AccountsOpened;</text>
  <text x="860" y="462" text-anchor="middle" font-size="9.5" fill="#4a2e73">One shared copy per type, reached through</text>
  <text x="860" y="476" text-anchor="middle" font-size="9.5" fill="#4a2e73">the type name — not through an object.</text>
  <text x="40" y="545" font-size="11" fill="#444"><tspan font-weight="bold">Program.cs → ILearningTopic → OOPExample.Explain()</tspan> calls all five methods above, in this order — see Flow/0-Overview.svg for the exact call/return trace.</text>
  <text x="40" y="565" font-size="10.5" font-style="italic" fill="#888">Every method (1–5) gets its own Flow/&lt;N&gt;-&lt;Name&gt;.svg AND Memory/&lt;N&gt;-&lt;Name&gt;.svg — same numbering, so the two folders line up.</text>
</svg>
