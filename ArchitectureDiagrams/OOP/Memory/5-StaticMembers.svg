  <line x1="830" y1="230" x2="792" y2="230" stroke="#555" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="930.0" y="200" text-anchor="middle" font-size="9" font-style="italic" fill="#5b4a7a">one copy, whole program</text>
  <text x="40" y="396" font-size="10.5" fill="#444"><tspan font-weight="bold">Bank's two static members exist ONCE, in the Static region </tspan>— not inside either account. Both OpenAccount calls bumped the same _accountsOpened, so it reads 2.</text>
  <text x="40" y="414" font-size="10" font-style="italic" fill="#888">openedCount = 2 is a plain int COPY on the Stack: it will not change if more accounts open later. (const members are not stored here at all — the compiler pastes their value in.)</text>
</svg>
