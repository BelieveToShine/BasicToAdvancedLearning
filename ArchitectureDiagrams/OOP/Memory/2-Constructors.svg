  <text x="40" y="486" font-size="10.5" fill="#444"><tspan font-weight="bold">Three constructor calls, three objects, three starting states. </tspan>clampedAccount asked for -50 but the constructor stored 0 — the object never exists in an invalid state.</text>
  <text x="40" y="504" font-size="10" font-style="italic" fill="#888">emptyAccount used the one-argument constructor, which handed off to the main one with this(ownerName, NoMoney). Those constructor frames are already gone: only the finished objects remain.</text>
