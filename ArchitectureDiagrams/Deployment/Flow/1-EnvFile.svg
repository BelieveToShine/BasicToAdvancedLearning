<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 400" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#555"/></marker>
  </defs>
  <rect x="0" y="0" width="1050" height="400" fill="#ffffff"/>
  <text x="525.0" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a237e">Deployment — Step 1: Configuration and secrets — Flow</text>
  <text x="525.0" y="46" text-anchor="middle" font-size="12" fill="#666">.env.example is copied to .env; compose turns its values into environment variables; the API reads one of them.</text>
  <g font-size="11" fill="#333"><rect x="131" y="60" width="14" height="14" rx="2" fill="#b6d7a8" stroke="#6aa84f"/><text x="151" y="71">files / source</text></g>
  <g font-size="11" fill="#333"><rect x="270" y="60" width="14" height="14" rx="2" fill="#d5c9ea" stroke="#674ea7"/><text x="290" y="71">image (built, read-only)</text></g>
  <g font-size="11" fill="#333"><rect x="471" y="60" width="14" height="14" rx="2" fill="#f9cb9c" stroke="#e69138"/><text x="491" y="71">running container</text></g>
  <g font-size="11" fill="#333"><rect x="628" y="60" width="14" height="14" rx="2" fill="#cfe2f3" stroke="#3d85c6"/><text x="648" y="71">volume (data)</text></g>
  <g font-size="11" fill="#333"><rect x="762" y="60" width="14" height="14" rx="2" fill="#f1f1f1" stroke="#777777"/><text x="782" y="71">process / command</text></g>
  <rect x="15" y="100" width="140" height="100" rx="9" fill="#b6d7a8" stroke="#6aa84f" stroke-width="1.5"/>
  <text x="85.0" y="118" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#274e13">.env.example</text>
  <text x="85.0" y="135" text-anchor="middle" font-size="9.5" fill="#274e13">committed to git</text>
  <text x="85.0" y="149" text-anchor="middle" font-size="9.5" fill="#274e13">placeholders only:</text>
  <text x="85.0" y="163" text-anchor="middle" font-size="9.5" fill="#274e13">CHANGE_ME_...</text>
  <rect x="235" y="100" width="140" height="100" rx="9" fill="#b6d7a8" stroke="#6aa84f" stroke-width="1.5"/>
  <text x="305.0" y="118" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#274e13">.env</text>
  <text x="305.0" y="135" text-anchor="middle" font-size="9.5" fill="#274e13">git-ignored (it is in</text>
  <text x="305.0" y="149" text-anchor="middle" font-size="9.5" fill="#274e13">.gitignore): your real</text>
  <text x="305.0" y="163" text-anchor="middle" font-size="9.5" fill="#274e13">passwords + WEB_PORT</text>
  <rect x="455" y="100" width="140" height="100" rx="9" fill="#f1f1f1" stroke="#777777" stroke-width="1.5"/>
  <text x="525.0" y="118" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#444444">docker-compose.yml</text>
  <text x="525.0" y="135" text-anchor="middle" font-size="9.5" fill="#444444">${MSSQL_SA_PASSWORD:?..}</text>
  <text x="525.0" y="149" text-anchor="middle" font-size="9.5" fill="#444444">${APP_DB_PASSWORD:?}</text>
  <text x="525.0" y="163" text-anchor="middle" font-size="9.5" fill="#444444">filled in from .env</text>
  <rect x="675" y="100" width="140" height="100" rx="9" fill="#f9cb9c" stroke="#e69138" stroke-width="1.5"/>
  <text x="745.0" y="118" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7f4e00">running containers</text>
  <text x="745.0" y="135" text-anchor="middle" font-size="9.5" fill="#7f4e00">db: MSSQL_SA_PASSWORD</text>
  <text x="745.0" y="149" text-anchor="middle" font-size="9.5" fill="#7f4e00">api: BTAL_SQLSERVER</text>
  <text x="745.0" y="163" text-anchor="middle" font-size="9.5" fill="#7f4e00">db-init: APP_DB_*</text>
  <rect x="895" y="100" width="140" height="100" rx="9" fill="#f1f1f1" stroke="#777777" stroke-width="1.5"/>
  <text x="965.0" y="118" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#444444">API code</text>
  <text x="965.0" y="135" text-anchor="middle" font-size="9.5" fill="#444444">BankDatabase.cs reads</text>
  <text x="965.0" y="149" text-anchor="middle" font-size="9.5" fill="#444444">Environment variable</text>
  <text x="965.0" y="163" text-anchor="middle" font-size="9.5" fill="#444444">BTAL_SQLSERVER</text>
  <line x1="155" y1="150.0" x2="233" y2="150.0" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="195.0" y="122.0" text-anchor="middle" font-size="9" fill="#333">cp</text>
  <text x="195.0" y="133.0" text-anchor="middle" font-size="9" fill="#333">.env.example</text>
  <text x="195.0" y="144.0" text-anchor="middle" font-size="9" fill="#333">.env</text>
  <line x1="375" y1="150.0" x2="453" y2="150.0" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="415.0" y="122.0" text-anchor="middle" font-size="9" fill="#333">docker</text>
  <text x="415.0" y="133.0" text-anchor="middle" font-size="9" fill="#333">compose</text>
  <text x="415.0" y="144.0" text-anchor="middle" font-size="9" fill="#333">reads it</text>
  <line x1="595" y1="150.0" x2="673" y2="150.0" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="635.0" y="122.0" text-anchor="middle" font-size="9" fill="#333">docker</text>
  <text x="635.0" y="133.0" text-anchor="middle" font-size="9" fill="#333">compose</text>
  <text x="635.0" y="144.0" text-anchor="middle" font-size="9" fill="#333">up</text>
  <line x1="815" y1="150.0" x2="893" y2="150.0" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="855.0" y="133.0" text-anchor="middle" font-size="9" fill="#333">program</text>
  <text x="855.0" y="144.0" text-anchor="middle" font-size="9" fill="#333">reads it</text>
  <rect x="455" y="250" width="140" height="80" rx="9" fill="#f1f1f1" stroke="#777777" stroke-width="1.5"/>
  <text x="525.0" y="268" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#444444">compose stops</text>
  <text x="525.0" y="285" text-anchor="middle" font-size="9.5" fill="#444444">a required ${VAR:?msg}</text>
  <text x="525.0" y="299" text-anchor="middle" font-size="9.5" fill="#444444">has no value: error,</text>
  <text x="525.0" y="313" text-anchor="middle" font-size="9.5" fill="#444444">nothing is started</text>
  <line x1="525.0" y1="200" x2="525.0" y2="248" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="533.0" y="228" text-anchor="start" font-size="9" fill="#333">value missing</text>
  <text x="40" y="372" font-size="10.5" fill="#444"><tspan font-weight="bold">The password never appears in a Dockerfile, an image or git: </tspan>only .env (your machine) and the running containers have it.</text>
  <text x="40" y="390" font-size="10" font-style="italic" fill="#888">Verified: docker image inspect on the API image shows only ASPNETCORE_*/DOTNET_* variables; BTAL_SQLSERVER appears only on the running container.</text>
</svg>
