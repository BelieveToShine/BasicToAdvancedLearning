<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 470" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#555"/></marker>
  </defs>
  <rect x="0" y="0" width="1050" height="470" fill="#ffffff"/>
  <text x="525.0" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a237e">Deployment — Flow overview: source → build → image → container → request</text>
  <text x="525.0" y="46" text-anchor="middle" font-size="12" fill="#666">One picture of the whole guide: each box is one stage; the numbers say which guide step (README) covers it.</text>
  <g font-size="11" fill="#333"><rect x="131" y="60" width="14" height="14" rx="2" fill="#b6d7a8" stroke="#6aa84f"/><text x="151" y="71">files / source</text></g>
  <g font-size="11" fill="#333"><rect x="270" y="60" width="14" height="14" rx="2" fill="#d5c9ea" stroke="#674ea7"/><text x="290" y="71">image (built, read-only)</text></g>
  <g font-size="11" fill="#333"><rect x="471" y="60" width="14" height="14" rx="2" fill="#f9cb9c" stroke="#e69138"/><text x="491" y="71">running container</text></g>
  <g font-size="11" fill="#333"><rect x="628" y="60" width="14" height="14" rx="2" fill="#cfe2f3" stroke="#3d85c6"/><text x="648" y="71">volume (data)</text></g>
  <g font-size="11" fill="#333"><rect x="762" y="60" width="14" height="14" rx="2" fill="#f1f1f1" stroke="#777777"/><text x="782" y="71">process / command</text></g>
  <rect x="15" y="100" width="140" height="120" rx="9" fill="#b6d7a8" stroke="#6aa84f" stroke-width="1.5"/>
  <text x="85.0" y="118" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#274e13">SOURCE</text>
  <text x="85.0" y="135" text-anchor="middle" font-size="9.5" fill="#274e13">Api/*.cs, *.csproj</text>
  <text x="85.0" y="149" text-anchor="middle" font-size="9.5" fill="#274e13">frontend/src, npm files</text>
  <text x="85.0" y="163" text-anchor="middle" font-size="9.5" fill="#274e13">Dockerfile.api / .web</text>
  <text x="85.0" y="177" text-anchor="middle" font-size="9.5" fill="#274e13">nginx.conf, db/*.sql</text>
  <rect x="235" y="100" width="140" height="120" rx="9" fill="#f1f1f1" stroke="#777777" stroke-width="1.5"/>
  <text x="305.0" y="118" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#444444">BUILD</text>
  <text x="305.0" y="135" text-anchor="middle" font-size="9.5" fill="#444444">runs the Dockerfile</text>
  <text x="305.0" y="149" text-anchor="middle" font-size="9.5" fill="#444444">steps: restore, publish,</text>
  <text x="305.0" y="163" text-anchor="middle" font-size="9.5" fill="#444444">npm ci, npm run build</text>
  <text x="305.0" y="177" text-anchor="middle" font-size="9.5" fill="#444444">(steps 2 and 3)</text>
  <rect x="455" y="100" width="140" height="120" rx="9" fill="#d5c9ea" stroke="#674ea7" stroke-width="1.5"/>
  <text x="525.0" y="118" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#3d2a6b">IMAGE</text>
  <text x="525.0" y="135" text-anchor="middle" font-size="9.5" fill="#3d2a6b">api image: ~350 MB</text>
  <text x="525.0" y="149" text-anchor="middle" font-size="9.5" fill="#3d2a6b">web image: ~94 MB</text>
  <text x="525.0" y="163" text-anchor="middle" font-size="9.5" fill="#3d2a6b">read-only; no secrets</text>
  <text x="525.0" y="177" text-anchor="middle" font-size="9.5" fill="#3d2a6b">inside (step 2)</text>
  <rect x="675" y="100" width="140" height="120" rx="9" fill="#f9cb9c" stroke="#e69138" stroke-width="1.5"/>
  <text x="745.0" y="118" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7f4e00">CONTAINER</text>
  <text x="745.0" y="135" text-anchor="middle" font-size="9.5" fill="#7f4e00">db, db-init, api, web</text>
  <text x="745.0" y="149" text-anchor="middle" font-size="9.5" fill="#7f4e00">image + settings from</text>
  <text x="745.0" y="163" text-anchor="middle" font-size="9.5" fill="#7f4e00">.env (step 1) + volume</text>
  <text x="745.0" y="177" text-anchor="middle" font-size="9.5" fill="#7f4e00">(step 4)</text>
  <rect x="895" y="100" width="140" height="120" rx="9" fill="#f1f1f1" stroke="#777777" stroke-width="1.5"/>
  <text x="965.0" y="118" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#444444">REQUEST</text>
  <text x="965.0" y="135" text-anchor="middle" font-size="9.5" fill="#444444">GET localhost:8080/api/</text>
  <text x="965.0" y="149" text-anchor="middle" font-size="9.5" fill="#444444">accounts reaches nginx,</text>
  <text x="965.0" y="163" text-anchor="middle" font-size="9.5" fill="#444444">then api, then SQL</text>
  <text x="965.0" y="177" text-anchor="middle" font-size="9.5" fill="#444444">(step 5)</text>
  <line x1="155" y1="160.0" x2="233" y2="160.0" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="195.0" y="132.0" text-anchor="middle" font-size="9" fill="#333">docker</text>
  <text x="195.0" y="143.0" text-anchor="middle" font-size="9" fill="#333">compose</text>
  <text x="195.0" y="154.0" text-anchor="middle" font-size="9" fill="#333">build</text>
  <line x1="375" y1="160.0" x2="453" y2="160.0" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="415.0" y="154.0" text-anchor="middle" font-size="9" fill="#333">creates</text>
  <line x1="595" y1="160.0" x2="673" y2="160.0" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="635.0" y="132.0" text-anchor="middle" font-size="9" fill="#333">docker</text>
  <text x="635.0" y="143.0" text-anchor="middle" font-size="9" fill="#333">compose</text>
  <text x="635.0" y="154.0" text-anchor="middle" font-size="9" fill="#333">up</text>
  <line x1="815" y1="160.0" x2="893" y2="160.0" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="855.0" y="143.0" text-anchor="middle" font-size="9" fill="#333">browser</text>
  <text x="855.0" y="154.0" text-anchor="middle" font-size="9" fill="#333">or curl</text>
  <rect x="15" y="320" width="300" height="78" rx="9" fill="#b6d7a8" stroke="#6aa84f" stroke-width="1.5"/>
  <text x="25" y="338" font-size="10.5" font-weight="bold" fill="#274e13">Configuration is NOT in the source or image</text>
  <text x="25" y="355" font-size="9.5" fill="#274e13">.env (git-ignored) holds the passwords;</text>
  <text x="25" y="369" font-size="9.5" fill="#274e13">compose hands them to the containers</text>
  <text x="25" y="383" font-size="9.5" fill="#274e13">as environment variables when they start</text>
  <rect x="375" y="320" width="300" height="78" rx="9" fill="#cfe2f3" stroke="#3d85c6" stroke-width="1.5"/>
  <text x="385" y="338" font-size="10.5" font-weight="bold" fill="#1c4587">Data is NOT in the image or the container</text>
  <text x="385" y="355" font-size="9.5" fill="#1c4587">SQL Server writes its files to the volume</text>
  <text x="385" y="369" font-size="9.5" fill="#1c4587">"sqldata": they survive `down`,</text>
  <text x="385" y="383" font-size="9.5" fill="#1c4587">and are deleted only by `down -v`</text>
  <rect x="735" y="320" width="300" height="78" rx="9" fill="#f1f1f1" stroke="#777777" stroke-width="1.5"/>
  <text x="745" y="338" font-size="10.5" font-weight="bold" fill="#444444">Dev vs production</text>
  <text x="745" y="355" font-size="9.5" fill="#444444">Development: the API creates/migrates the DB.</text>
  <text x="745" y="369" font-size="9.5" fill="#444444">This stack runs Production: a separate</text>
  <text x="745" y="383" font-size="9.5" fill="#444444">db-init step does it (step 4).</text>
  <polyline points="165,320 165,270 720,270 720,222" fill="none" stroke="#888" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <polyline points="525,320 525,295 790,295 790,222" fill="none" stroke="#888" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="180" y="264" text-anchor="start" font-size="9" fill="#666">passwords reach the containers here, when they start</text>
  <text x="540" y="289" text-anchor="start" font-size="9" fill="#666">database files go to the volume</text>
  <text x="40" y="428" font-size="10.5" fill="#444"><tspan font-weight="bold">Read left to right. </tspan>Each arrow is a command you type: docker compose build, then docker compose up, then a browser or curl.</text>
  <text x="40" y="446" font-size="10" font-style="italic" fill="#888">The same image can be started on any machine that has Docker; only the settings (.env) differ.</text>
</svg>
