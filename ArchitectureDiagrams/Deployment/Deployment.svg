<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 650" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#555"/></marker>
  </defs>
  <rect x="0" y="0" width="1050" height="650" fill="#ffffff"/>
  <text x="525.0" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a237e">Deployment — Architecture: containers, ports and volumes</text>
  <text x="525.0" y="46" text-anchor="middle" font-size="12" fill="#666">What `docker compose up` creates on one machine. Only the web port is open to your computer; step numbers refer to the guide (README).</text>
  <g font-size="11" fill="#333"><rect x="216" y="60" width="14" height="14" rx="2" fill="#b6d7a8" stroke="#6aa84f"/><text x="236" y="71">your files / host</text></g>
  <g font-size="11" fill="#333"><rect x="373" y="60" width="14" height="14" rx="2" fill="#f9cb9c" stroke="#e69138"/><text x="393" y="71">running container</text></g>
  <g font-size="11" fill="#333"><rect x="531" y="60" width="14" height="14" rx="2" fill="#cfe2f3" stroke="#3d85c6"/><text x="551" y="71">volume (data)</text></g>
  <g font-size="11" fill="#333"><rect x="664" y="60" width="14" height="14" rx="2" fill="#f1f1f1" stroke="#777777"/><text x="684" y="71">tool / one-shot job</text></g>
  <rect x="15" y="92" width="245" height="470" rx="10" fill="#fbfbfb" stroke="#999" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="137" y="112" text-anchor="middle" font-size="11" font-weight="bold" fill="#555">YOUR COMPUTER (the host)</text>
  <rect x="282" y="92" width="753" height="470" rx="10" fill="#fbfbfb" stroke="#999" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="658" y="112" text-anchor="middle" font-size="11" font-weight="bold" fill="#555">DOCKER — private network "fullstackbank_default": containers find each other by name</text>
  <rect x="35" y="150" width="205" height="80" rx="9" fill="#f1f1f1" stroke="#777777" stroke-width="1.5"/>
  <text x="45" y="168" font-size="10.5" font-weight="bold" fill="#444444">Browser or curl</text>
  <text x="45" y="185" font-size="9.5" fill="#444444">http://localhost:8080</text>
  <text x="45" y="199" font-size="9.5" fill="#444444">(WEB_PORT in .env)</text>
  <rect x="35" y="470" width="205" height="80" rx="9" fill="#b6d7a8" stroke="#cc0000" stroke-width="2"/>
  <text x="45" y="488" font-size="10.5" font-weight="bold" fill="#274e13">.env  (step 1)</text>
  <text x="45" y="505" font-size="9.5" fill="#274e13">git-ignored: real passwords</text>
  <text x="45" y="519" font-size="9.5" fill="#274e13">and WEB_PORT; .env.example</text>
  <text x="45" y="533" font-size="9.5" fill="#274e13">is the committed template</text>
  <rect x="310" y="140" width="185" height="150" rx="9" fill="#f9cb9c" stroke="#e69138" stroke-width="1.5"/>
  <text x="320" y="158" font-size="10.5" font-weight="bold" fill="#7f4e00">web  (step 3)</text>
  <text x="320" y="175" font-size="9.5" fill="#7f4e00">nginx:alpine</text>
  <text x="320" y="189" font-size="9.5" fill="#7f4e00">listens on port 80</text>
  <text x="320" y="203" font-size="9.5" fill="#7f4e00">serves the React files</text>
  <text x="320" y="217" font-size="9.5" fill="#7f4e00">forwards /api/ to api:8080</text>
  <text x="320" y="231" font-size="9.5" fill="#7f4e00">health: wget 127.0.0.1/</text>
  <rect x="580" y="140" width="185" height="150" rx="9" fill="#f9cb9c" stroke="#e69138" stroke-width="1.5"/>
  <text x="590" y="158" font-size="10.5" font-weight="bold" fill="#7f4e00">api  (step 2)</text>
  <text x="590" y="175" font-size="9.5" fill="#7f4e00">ASP.NET Core 9, Production</text>
  <text x="590" y="189" font-size="9.5" fill="#7f4e00">listens on port 8080</text>
  <text x="590" y="203" font-size="9.5" fill="#7f4e00">runs as user "app" (not root)</text>
  <text x="590" y="217" font-size="9.5" fill="#7f4e00">BTAL_SQLSERVER from .env</text>
  <text x="590" y="231" font-size="9.5" fill="#7f4e00">health: GET /health -&gt; 200</text>
  <rect x="850" y="140" width="170" height="150" rx="9" fill="#f9cb9c" stroke="#e69138" stroke-width="1.5"/>
  <text x="860" y="158" font-size="10.5" font-weight="bold" fill="#7f4e00">db  (step 4)</text>
  <text x="860" y="175" font-size="9.5" fill="#7f4e00">SQL Server 2022</text>
  <text x="860" y="189" font-size="9.5" fill="#7f4e00">listens on port 1433</text>
  <text x="860" y="203" font-size="9.5" fill="#7f4e00">MSSQL_SA_PASSWORD</text>
  <text x="860" y="217" font-size="9.5" fill="#7f4e00">from .env</text>
  <text x="860" y="231" font-size="9.5" fill="#7f4e00">health: SELECT 1</text>
  <rect x="580" y="360" width="185" height="100" rx="9" fill="#f1f1f1" stroke="#777777" stroke-width="1.5"/>
  <text x="590" y="378" font-size="10.5" font-weight="bold" fill="#444444">db-init  (step 4)</text>
  <text x="590" y="395" font-size="9.5" fill="#444444">runs once, then exits 0:</text>
  <text x="590" y="409" font-size="9.5" fill="#444444">create DB, schema, login,</text>
  <text x="590" y="423" font-size="9.5" fill="#444444">demo data (init.sh)</text>
  <rect x="850" y="360" width="170" height="100" rx="9" fill="#cfe2f3" stroke="#3d85c6" stroke-width="1.5"/>
  <text x="860" y="378" font-size="10.5" font-weight="bold" fill="#1c4587">volume "sqldata"</text>
  <text x="860" y="395" font-size="9.5" fill="#1c4587">mounted at</text>
  <text x="860" y="409" font-size="9.5" fill="#1c4587">/var/opt/mssql: the</text>
  <text x="860" y="423" font-size="9.5" fill="#1c4587">database files</text>
  <rect x="310" y="490" width="710" height="60" rx="9" fill="#f1f1f1" stroke="#777777" stroke-width="1.5"/>
  <text x="320" y="508" font-size="10.5" font-weight="bold" fill="#444444">docker compose up  (steps 4 and 5)</text>
  <text x="320" y="525" font-size="9.5" fill="#444444">reads docker-compose.yml + .env; creates network, volume, containers; starts db, db-init, api, web in that order</text>
  <line x1="240" y1="190" x2="308" y2="190" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="274" y="172" text-anchor="middle" font-size="9" fill="#333">host port</text>
  <text x="274" y="183" text-anchor="middle" font-size="9" fill="#333">8080 -&gt; 80</text>
  <line x1="495" y1="190" x2="578" y2="190" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="537" y="172" text-anchor="middle" font-size="9" fill="#333">/api/ is</text>
  <text x="537" y="183" text-anchor="middle" font-size="9" fill="#333">forwarded</text>
  <line x1="765" y1="190" x2="848" y2="190" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="806" y="172" text-anchor="middle" font-size="9" fill="#333">SQL as</text>
  <text x="806" y="183" text-anchor="middle" font-size="9" fill="#333">bank_app</text>
  <polyline points="765,410 805,410 805,262 848,262" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="800" y="340" text-anchor="end" font-size="9" fill="#333">runs the SQL</text>
  <text x="800" y="351" text-anchor="end" font-size="9" fill="#333">scripts as sa</text>
  <line x1="935" y1="290" x2="935" y2="358" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="943" y="328" text-anchor="start" font-size="9" fill="#333">reads / writes files</text>
  <line x1="240" y1="520" x2="308" y2="520" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="274" y="502" text-anchor="middle" font-size="9" fill="#333">read at</text>
  <text x="274" y="513" text-anchor="middle" font-size="9" fill="#333">start</text>
  <text x="40" y="590" font-size="10.5" fill="#444"><tspan font-weight="bold">Only web is published to the host: </tspan>api and db have no "ports:" entry, so nothing outside the compose network can reach them (the browser reaches the API only through nginx).</text>
  <text x="40" y="608" font-size="10" font-style="italic" fill="#888">Secrets: only .env and the running containers hold passwords; the images do not. Data: only the volume; `docker compose down` keeps it, `down -v` deletes it.</text>
</svg>
