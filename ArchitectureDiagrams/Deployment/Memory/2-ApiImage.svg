<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 550" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#555"/></marker>
  </defs>
  <rect x="0" y="0" width="1050" height="550" fill="#ffffff"/>
  <text x="525.0" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a237e">Deployment — Step 2: Build the API image — Memory: where configuration and data live</text>
  <text x="525.0" y="46" text-anchor="middle" font-size="12" fill="#666">Snapshot after `docker compose build api`: the SDK stage is discarded, only the published files reach the final image.</text>
  <g font-size="11" fill="#333"><rect x="88" y="60" width="14" height="14" rx="2" fill="#b6d7a8" stroke="#6aa84f"/><text x="108" y="71">FILES on your computer</text></g>
  <g font-size="11" fill="#333"><rect x="276" y="60" width="14" height="14" rx="2" fill="#d5c9ea" stroke="#674ea7"/><text x="296" y="71">IMAGE layers (read-only)</text></g>
  <g font-size="11" fill="#333"><rect x="476" y="60" width="14" height="14" rx="2" fill="#f9cb9c" stroke="#e69138"/><text x="496" y="71">ENVIRONMENT of a running container</text></g>
  <g font-size="11" fill="#333"><rect x="738" y="60" width="14" height="14" rx="2" fill="#cfe2f3" stroke="#3d85c6"/><text x="758" y="71">VOLUME (outlives containers)</text></g>
  <rect x="15" y="92" width="132" height="78" rx="8" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="81" y="119.0" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#274e13">FILES</text>
  <text x="81" y="133.0" text-anchor="middle" font-size="9.5" fill="#274e13">on your computer</text>
  <text x="81" y="147.0" text-anchor="middle" font-size="9.5" fill="#274e13">(the repository)</text>
  <rect x="15" y="210" width="132" height="148" rx="8" fill="#efe9f8" stroke="#674ea7" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="81" y="272.0" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#3d2a6b">IMAGE LAYERS</text>
  <text x="81" y="286.0" text-anchor="middle" font-size="9.5" fill="#3d2a6b">built once,</text>
  <text x="81" y="300.0" text-anchor="middle" font-size="9.5" fill="#3d2a6b">read-only</text>
  <rect x="15" y="398" width="132" height="92" rx="8" fill="#fff3e6" stroke="#e69138" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="81" y="432.0" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7f4e00">ENVIRONMENT</text>
  <text x="81" y="446.0" text-anchor="middle" font-size="9.5" fill="#7f4e00">of the running</text>
  <text x="81" y="460.0" text-anchor="middle" font-size="9.5" fill="#7f4e00">containers</text>
  <rect x="160" y="96" width="190" height="70" rx="9" fill="#b6d7a8" stroke="#6aa84f" stroke-width="1.5"/>
  <text x="170" y="114" font-size="10.5" font-weight="bold" fill="#274e13">Api/ source code</text>
  <text x="170" y="131" font-size="9" fill="#274e13">FullStackBank.Api.csproj, *.cs</text>
  <text x="170" y="145" font-size="9" fill="#274e13">(build context = the Api folder)</text>
  <rect x="386" y="96" width="190" height="70" rx="9" fill="#b6d7a8" stroke="#6aa84f" stroke-width="1.5"/>
  <text x="396" y="114" font-size="10.5" font-weight="bold" fill="#274e13">Dockerfile.api</text>
  <text x="396" y="131" font-size="9" fill="#274e13">FROM sdk AS build ...</text>
  <text x="396" y="145" font-size="9" fill="#274e13">FROM aspnet AS runtime ...</text>
  <rect x="612" y="96" width="190" height="70" rx="9" fill="#b6d7a8" stroke="#6aa84f" stroke-width="1.5"/>
  <text x="622" y="114" font-size="10.5" font-weight="bold" fill="#274e13">Dockerfile.api.dockerignore</text>
  <text x="622" y="131" font-size="9" fill="#274e13">bin/ and obj/ of your own</text>
  <text x="622" y="145" font-size="9" fill="#274e13">machine are not sent to the build</text>
  <rect x="160" y="214" width="190" height="140" rx="9" fill="#d5c9ea" stroke="#674ea7" stroke-width="1.5"/>
  <text x="170" y="232" font-size="10.5" font-weight="bold" fill="#3d2a6b">stage 1 "build" (sdk:9.0)</text>
  <text x="170" y="249" font-size="9" fill="#3d2a6b">restore layer (cached)</text>
  <text x="170" y="263" font-size="9" fill="#3d2a6b">publish layer: /out</text>
  <text x="170" y="277" font-size="9" fill="#3d2a6b">DISCARDED after the build</text>
  <rect x="386" y="214" width="190" height="140" rx="9" fill="#d5c9ea" stroke="#674ea7" stroke-width="1.5"/>
  <text x="396" y="232" font-size="10.5" font-weight="bold" fill="#3d2a6b">API image = stage 2</text>
  <text x="396" y="249" font-size="9" fill="#3d2a6b">aspnet:9.0 runtime base layers</text>
  <text x="396" y="263" font-size="9" fill="#3d2a6b">COPY --from=build /out /app</text>
  <text x="396" y="277" font-size="9" fill="#3d2a6b">ENV ASPNETCORE_ENVIRONMENT=</text>
  <text x="396" y="291" font-size="9" fill="#3d2a6b">Production</text>
  <text x="396" y="305" font-size="9" fill="#3d2a6b">ENV ASPNETCORE_URLS=</text>
  <text x="396" y="319" font-size="9" fill="#3d2a6b">http://+:8080</text>
  <text x="396" y="333" font-size="9" fill="#3d2a6b">USER $APP_UID (app, not root)</text>
  <rect x="386" y="402" width="190" height="84" rx="9" fill="#f9cb9c" stroke="#cc0000" stroke-width="2"/>
  <text x="396" y="420" font-size="10.5" font-weight="bold" fill="#7f4e00">api container (at run time)</text>
  <text x="396" y="437" font-size="9" fill="#7f4e00">from the image: ASPNETCORE_URLS ...</text>
  <text x="396" y="451" font-size="9" fill="#7f4e00">from compose: BTAL_SQLSERVER</text>
  <text x="396" y="465" font-size="9" fill="#7f4e00">(never baked into the image)</text>
  <line x1="260" y1="166" x2="260" y2="212" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="268" y="193.0" text-anchor="start" font-size="9" fill="#333">COPY</text>
  <line x1="486" y1="166" x2="486" y2="212" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="494" y="193.0" text-anchor="start" font-size="9" fill="#333">instructions</text>
  <line x1="350" y1="284.0" x2="384" y2="284.0" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="368.0" y="278.0" text-anchor="middle" font-size="8.5" fill="#333">/out</text>
  <line x1="486" y1="354" x2="486" y2="400" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="494" y="381.0" text-anchor="start" font-size="9" fill="#333">docker compose up</text>
  <text x="40" y="512" font-size="10.5" fill="#444"><tspan font-weight="bold">Layers are cached: </tspan>the .csproj is restored before the source is copied, so a C#-only change reuses the package layer (an unchanged rebuild was all CACHED).</text>
  <text x="40" y="530" font-size="10" font-style="italic" fill="#888">The final image is about 350 MB; the SDK image used only for stage 1 is about 1.25 GB.</text>
</svg>
