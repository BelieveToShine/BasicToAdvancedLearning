<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 466" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#555"/></marker>
  </defs>
  <rect x="0" y="0" width="1050" height="466" fill="#ffffff"/>
  <text x="525.0" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a237e">Deployment — Step 5: Check it, then tear down — Memory: where configuration and data live</text>
  <text x="525.0" y="46" text-anchor="middle" font-size="12" fill="#666">Snapshot after a deposit of 100.50 into account 1: only the volume holds data; images never change; containers hold none.</text>
  <g font-size="11" fill="#333"><rect x="88" y="60" width="14" height="14" rx="2" fill="#b6d7a8" stroke="#6aa84f"/><text x="108" y="71">FILES on your computer</text></g>
  <g font-size="11" fill="#333"><rect x="276" y="60" width="14" height="14" rx="2" fill="#d5c9ea" stroke="#674ea7"/><text x="296" y="71">IMAGE layers (read-only)</text></g>
  <g font-size="11" fill="#333"><rect x="476" y="60" width="14" height="14" rx="2" fill="#f9cb9c" stroke="#e69138"/><text x="496" y="71">ENVIRONMENT of a running container</text></g>
  <g font-size="11" fill="#333"><rect x="738" y="60" width="14" height="14" rx="2" fill="#cfe2f3" stroke="#3d85c6"/><text x="758" y="71">VOLUME (outlives containers)</text></g>
  <rect x="15" y="92" width="132" height="64" rx="8" fill="#efe9f8" stroke="#674ea7" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="81" y="112.0" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#3d2a6b">IMAGE LAYERS</text>
  <text x="81" y="126.0" text-anchor="middle" font-size="9.5" fill="#3d2a6b">built once,</text>
  <text x="81" y="140.0" text-anchor="middle" font-size="9.5" fill="#3d2a6b">read-only</text>
  <rect x="15" y="196" width="132" height="78" rx="8" fill="#fff3e6" stroke="#e69138" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="81" y="223.0" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7f4e00">ENVIRONMENT</text>
  <text x="81" y="237.0" text-anchor="middle" font-size="9.5" fill="#7f4e00">of the running</text>
  <text x="81" y="251.0" text-anchor="middle" font-size="9.5" fill="#7f4e00">containers</text>
  <rect x="15" y="314" width="132" height="92" rx="8" fill="#eaf3fb" stroke="#3d85c6" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="81" y="348.0" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1c4587">VOLUME</text>
  <text x="81" y="362.0" text-anchor="middle" font-size="9.5" fill="#1c4587">data that outlives</text>
  <text x="81" y="376.0" text-anchor="middle" font-size="9.5" fill="#1c4587">the containers</text>
  <rect x="160" y="96" width="190" height="56" rx="9" fill="#d5c9ea" stroke="#674ea7" stroke-width="1.5"/>
  <text x="170" y="114" font-size="10.5" font-weight="bold" fill="#3d2a6b">API image</text>
  <text x="170" y="131" font-size="9" fill="#3d2a6b">unchanged by requests</text>
  <rect x="386" y="96" width="190" height="56" rx="9" fill="#d5c9ea" stroke="#674ea7" stroke-width="1.5"/>
  <text x="396" y="114" font-size="10.5" font-weight="bold" fill="#3d2a6b">Web image</text>
  <text x="396" y="131" font-size="9" fill="#3d2a6b">unchanged by requests</text>
  <rect x="612" y="96" width="190" height="56" rx="9" fill="#d5c9ea" stroke="#674ea7" stroke-width="1.5"/>
  <text x="622" y="114" font-size="10.5" font-weight="bold" fill="#3d2a6b">SQL Server image</text>
  <text x="622" y="131" font-size="9" fill="#3d2a6b">unchanged by requests</text>
  <rect x="160" y="200" width="190" height="70" rx="9" fill="#f9cb9c" stroke="#e69138" stroke-width="1.5"/>
  <text x="170" y="218" font-size="10.5" font-weight="bold" fill="#7f4e00">api container</text>
  <text x="170" y="235" font-size="9" fill="#7f4e00">holds no data: it asks SQL Server</text>
  <text x="170" y="249" font-size="9" fill="#7f4e00">and returns the rows as JSON</text>
  <rect x="386" y="200" width="190" height="70" rx="9" fill="#f9cb9c" stroke="#e69138" stroke-width="1.5"/>
  <text x="396" y="218" font-size="10.5" font-weight="bold" fill="#7f4e00">web container</text>
  <text x="396" y="235" font-size="9" fill="#7f4e00">holds no data: it forwards</text>
  <text x="396" y="249" font-size="9" fill="#7f4e00">/api/ requests to the api</text>
  <rect x="612" y="200" width="190" height="70" rx="9" fill="#f9cb9c" stroke="#e69138" stroke-width="1.5"/>
  <text x="622" y="218" font-size="10.5" font-weight="bold" fill="#7f4e00">db container</text>
  <text x="622" y="235" font-size="9" fill="#7f4e00">the SQL Server process:</text>
  <text x="622" y="249" font-size="9" fill="#7f4e00">reads and writes the volume</text>
  <rect x="386" y="318" width="190" height="84" rx="9" fill="#cfe2f3" stroke="#3d85c6" stroke-width="1.5"/>
  <text x="396" y="336" font-size="10.5" font-weight="bold" fill="#1c4587">sqldata after `down`</text>
  <text x="396" y="353" font-size="9" fill="#1c4587">still there: 3 accounts,</text>
  <text x="396" y="367" font-size="9" fill="#1c4587">ACC-1001 balance 5100.50</text>
  <rect x="612" y="318" width="190" height="84" rx="9" fill="#cfe2f3" stroke="#cc0000" stroke-width="2"/>
  <text x="622" y="336" font-size="10.5" font-weight="bold" fill="#1c4587">sqldata now</text>
  <text x="622" y="353" font-size="9" fill="#1c4587">ACC-1001 Savings 5100.50</text>
  <text x="622" y="367" font-size="9" fill="#1c4587">ACC-1002 Current 1200.50</text>
  <text x="622" y="381" font-size="9" fill="#1c4587">ACC-1003 Savings 300.00</text>
  <rect x="838" y="318" width="190" height="84" rx="9" fill="#cfe2f3" stroke="#3d85c6" stroke-width="1.5"/>
  <text x="848" y="336" font-size="10.5" font-weight="bold" fill="#1c4587">sqldata after `down -v`</text>
  <text x="848" y="353" font-size="9" fill="#1c4587">deleted: the database</text>
  <text x="848" y="367" font-size="9" fill="#1c4587">is gone with the volume</text>
  <line x1="712" y1="270" x2="712" y2="316" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="720" y="297.0" text-anchor="start" font-size="9" fill="#333">reads / writes rows</text>
  <line x1="612" y1="360.0" x2="578" y2="360.0" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="594.0" y="354.0" text-anchor="middle" font-size="8.5" fill="#333">down</text>
  <line x1="802" y1="360.0" x2="836" y2="360.0" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="820.0" y="354.0" text-anchor="middle" font-size="8.5" fill="#333">down -v</text>
  <text x="40" y="428" font-size="10.5" fill="#444"><tspan font-weight="bold">Containers are disposable, the volume is not: </tspan>`docker compose down` removes the containers and network but keeps sqldata; `down -v` deletes it too.</text>
  <text x="40" y="446" font-size="10" font-style="italic" fill="#888">Checked by running it: the deposit was still there after down + up, and the demo rows were not inserted twice.</text>
</svg>
