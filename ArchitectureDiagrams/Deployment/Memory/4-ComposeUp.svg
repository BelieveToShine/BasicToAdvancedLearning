<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 612" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#555"/></marker>
  </defs>
  <rect x="0" y="0" width="1050" height="612" fill="#ffffff"/>
  <text x="525.0" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a237e">Deployment — Step 4: Start the stack — Memory: where configuration and data live</text>
  <text x="525.0" y="46" text-anchor="middle" font-size="12" fill="#666">Snapshot after `docker compose up`: four containers, each created from an image and given its environment; one volume holds the data.</text>
  <g font-size="11" fill="#333"><rect x="88" y="60" width="14" height="14" rx="2" fill="#b6d7a8" stroke="#6aa84f"/><text x="108" y="71">FILES on your computer</text></g>
  <g font-size="11" fill="#333"><rect x="276" y="60" width="14" height="14" rx="2" fill="#d5c9ea" stroke="#674ea7"/><text x="296" y="71">IMAGE layers (read-only)</text></g>
  <g font-size="11" fill="#333"><rect x="476" y="60" width="14" height="14" rx="2" fill="#f9cb9c" stroke="#e69138"/><text x="496" y="71">ENVIRONMENT of a running container</text></g>
  <g font-size="11" fill="#333"><rect x="738" y="60" width="14" height="14" rx="2" fill="#cfe2f3" stroke="#3d85c6"/><text x="758" y="71">VOLUME (outlives containers)</text></g>
  <rect x="15" y="92" width="132" height="78" rx="8" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="81" y="119.0" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#274e13">FILES</text>
  <text x="81" y="133.0" text-anchor="middle" font-size="9.5" fill="#274e13">on your computer</text>
  <text x="81" y="147.0" text-anchor="middle" font-size="9.5" fill="#274e13">(the repository)</text>
  <rect x="15" y="210" width="132" height="78" rx="8" fill="#efe9f8" stroke="#674ea7" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="81" y="237.0" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#3d2a6b">IMAGE LAYERS</text>
  <text x="81" y="251.0" text-anchor="middle" font-size="9.5" fill="#3d2a6b">built once,</text>
  <text x="81" y="265.0" text-anchor="middle" font-size="9.5" fill="#3d2a6b">read-only</text>
  <rect x="15" y="328" width="132" height="92" rx="8" fill="#fff3e6" stroke="#e69138" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="81" y="362.0" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7f4e00">ENVIRONMENT</text>
  <text x="81" y="376.0" text-anchor="middle" font-size="9.5" fill="#7f4e00">of the running</text>
  <text x="81" y="390.0" text-anchor="middle" font-size="9.5" fill="#7f4e00">containers</text>
  <rect x="15" y="460" width="132" height="92" rx="8" fill="#eaf3fb" stroke="#3d85c6" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="81" y="494.0" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1c4587">VOLUME</text>
  <text x="81" y="508.0" text-anchor="middle" font-size="9.5" fill="#1c4587">data that outlives</text>
  <text x="81" y="522.0" text-anchor="middle" font-size="9.5" fill="#1c4587">the containers</text>
  <rect x="160" y="96" width="190" height="70" rx="9" fill="#b6d7a8" stroke="#6aa84f" stroke-width="1.5"/>
  <text x="170" y="114" font-size="10.5" font-weight="bold" fill="#274e13">docker-compose.yml</text>
  <text x="170" y="131" font-size="9" fill="#274e13">4 services, depends_on,</text>
  <text x="170" y="145" font-size="9" fill="#274e13">health checks, ports, volume</text>
  <rect x="386" y="96" width="190" height="70" rx="9" fill="#b6d7a8" stroke="#6aa84f" stroke-width="1.5"/>
  <text x="396" y="114" font-size="10.5" font-weight="bold" fill="#274e13">db/ scripts</text>
  <text x="396" y="131" font-size="9" fill="#274e13">00-create-database.sql ... init.sh</text>
  <text x="396" y="145" font-size="9" fill="#274e13">mounted read-only at /db</text>
  <rect x="838" y="96" width="190" height="70" rx="9" fill="#b6d7a8" stroke="#cc0000" stroke-width="2"/>
  <text x="848" y="114" font-size="10.5" font-weight="bold" fill="#274e13">.env</text>
  <text x="848" y="131" font-size="9" fill="#274e13">git-ignored: the real passwords</text>
  <text x="848" y="145" font-size="9" fill="#274e13">and WEB_PORT</text>
  <rect x="160" y="214" width="190" height="70" rx="9" fill="#d5c9ea" stroke="#674ea7" stroke-width="1.5"/>
  <text x="170" y="232" font-size="10.5" font-weight="bold" fill="#3d2a6b">API image</text>
  <text x="170" y="249" font-size="9" fill="#3d2a6b">built from Dockerfile.api</text>
  <rect x="386" y="214" width="190" height="70" rx="9" fill="#d5c9ea" stroke="#674ea7" stroke-width="1.5"/>
  <text x="396" y="232" font-size="10.5" font-weight="bold" fill="#3d2a6b">Web image</text>
  <text x="396" y="249" font-size="9" fill="#3d2a6b">built from Dockerfile.web</text>
  <rect x="612" y="214" width="190" height="70" rx="9" fill="#d5c9ea" stroke="#674ea7" stroke-width="1.5"/>
  <text x="622" y="232" font-size="10.5" font-weight="bold" fill="#3d2a6b">SQL Server image</text>
  <text x="622" y="249" font-size="9" fill="#3d2a6b">mssql/server:2022-latest</text>
  <text x="622" y="263" font-size="9" fill="#3d2a6b">also used for db-init (sqlcmd)</text>
  <rect x="160" y="332" width="190" height="84" rx="9" fill="#f9cb9c" stroke="#e69138" stroke-width="1.5"/>
  <text x="170" y="350" font-size="10.5" font-weight="bold" fill="#7f4e00">api container</text>
  <text x="170" y="367" font-size="9" fill="#7f4e00">BTAL_SQLSERVER (from .env)</text>
  <text x="170" y="381" font-size="9" fill="#7f4e00">health: GET /health -&gt; 200</text>
  <text x="170" y="395" font-size="9" fill="#7f4e00">no published port</text>
  <rect x="386" y="332" width="190" height="84" rx="9" fill="#f9cb9c" stroke="#e69138" stroke-width="1.5"/>
  <text x="396" y="350" font-size="10.5" font-weight="bold" fill="#7f4e00">db-init container</text>
  <text x="396" y="367" font-size="9" fill="#7f4e00">APP_DB_*, DB_NAME, SA password</text>
  <text x="396" y="381" font-size="9" fill="#7f4e00">runs init.sh, then exits 0</text>
  <text x="396" y="395" font-size="9" fill="#7f4e00">(then api may start)</text>
  <rect x="612" y="332" width="190" height="84" rx="9" fill="#f9cb9c" stroke="#e69138" stroke-width="1.5"/>
  <text x="622" y="350" font-size="10.5" font-weight="bold" fill="#7f4e00">db container</text>
  <text x="622" y="367" font-size="9" fill="#7f4e00">MSSQL_SA_PASSWORD</text>
  <text x="622" y="381" font-size="9" fill="#7f4e00">health: SELECT 1</text>
  <text x="622" y="395" font-size="9" fill="#7f4e00">no published port</text>
  <rect x="838" y="332" width="190" height="84" rx="9" fill="#f9cb9c" stroke="#e69138" stroke-width="1.5"/>
  <text x="848" y="350" font-size="10.5" font-weight="bold" fill="#7f4e00">web container</text>
  <text x="848" y="367" font-size="9" fill="#7f4e00">WEB_PORT is published -&gt; 80</text>
  <text x="848" y="381" font-size="9" fill="#7f4e00">health: wget 127.0.0.1/</text>
  <text x="848" y="395" font-size="9" fill="#7f4e00">the only open door</text>
  <rect x="612" y="464" width="190" height="84" rx="9" fill="#cfe2f3" stroke="#3d85c6" stroke-width="1.5"/>
  <text x="622" y="482" font-size="10.5" font-weight="bold" fill="#1c4587">sqldata</text>
  <text x="622" y="499" font-size="9" fill="#1c4587">mounted at /var/opt/mssql</text>
  <text x="622" y="513" font-size="9" fill="#1c4587">Bank_FullStackBank: Customers,</text>
  <text x="622" y="527" font-size="9" fill="#1c4587">Accounts, Transactions</text>
  <line x1="712" y1="416" x2="712" y2="462" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="720" y="443.0" text-anchor="start" font-size="9" fill="#333">db writes its files</text>
  <polyline points="938,166 938,308.0" fill="none" stroke="#555" stroke-width="1.6"/>
  <polyline points="250,308.0 938,308.0" fill="none" stroke="#555" stroke-width="1.6"/>
  <line x1="250" y1="308.0" x2="250" y2="330" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="476" y1="308.0" x2="476" y2="330" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="702" y1="308.0" x2="702" y2="330" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="928" y1="308.0" x2="928" y2="330" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="256" y="303.0" text-anchor="start" font-size="9" fill="#333">compose reads .env: container environments, and the published port of web</text>
  <text x="40" y="574" font-size="10.5" fill="#444"><tspan font-weight="bold">db-init is a one-shot job: </tspan>it creates the database, runs the idempotent schema script, creates the bank_app login (read/write rows only) and optionally the demo rows.</text>
  <text x="40" y="592" font-size="10" font-style="italic" fill="#888">The API runs in Production, so it does not create or migrate the database itself (Program.cs does that only in Development).</text>
</svg>
