<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 640" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#555"/></marker>
  </defs>
  <rect x="0" y="0" width="1050" height="640" fill="#ffffff"/>
  <text x="525.0" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a237e">Deployment — Overview — Memory: where configuration and data live</text>
  <text x="525.0" y="46" text-anchor="middle" font-size="12" fill="#666">The five kinds of place a setting or a piece of data can live; the arrows show how it gets from one place to the next.</text>
  <g font-size="11" fill="#333"><rect x="88" y="60" width="14" height="14" rx="2" fill="#b6d7a8" stroke="#6aa84f"/><text x="108" y="71">FILES on your computer</text></g>
  <g font-size="11" fill="#333"><rect x="276" y="60" width="14" height="14" rx="2" fill="#d5c9ea" stroke="#674ea7"/><text x="296" y="71">IMAGE layers (read-only)</text></g>
  <g font-size="11" fill="#333"><rect x="476" y="60" width="14" height="14" rx="2" fill="#f9cb9c" stroke="#e69138"/><text x="496" y="71">ENVIRONMENT of a running container</text></g>
  <g font-size="11" fill="#333"><rect x="738" y="60" width="14" height="14" rx="2" fill="#cfe2f3" stroke="#3d85c6"/><text x="758" y="71">VOLUME (outlives containers)</text></g>
  <rect x="15" y="92" width="132" height="78" rx="8" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="81" y="119.0" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#274e13">FILES</text>
  <text x="81" y="133.0" text-anchor="middle" font-size="9.5" fill="#274e13">on your computer</text>
  <text x="81" y="147.0" text-anchor="middle" font-size="9.5" fill="#274e13">(the repository)</text>
  <rect x="15" y="210" width="132" height="92" rx="8" fill="#efe9f8" stroke="#674ea7" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="81" y="244.0" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#3d2a6b">IMAGE LAYERS</text>
  <text x="81" y="258.0" text-anchor="middle" font-size="9.5" fill="#3d2a6b">built once,</text>
  <text x="81" y="272.0" text-anchor="middle" font-size="9.5" fill="#3d2a6b">read-only</text>
  <rect x="15" y="342" width="132" height="92" rx="8" fill="#fff3e6" stroke="#e69138" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="81" y="376.0" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7f4e00">ENVIRONMENT</text>
  <text x="81" y="390.0" text-anchor="middle" font-size="9.5" fill="#7f4e00">of the running</text>
  <text x="81" y="404.0" text-anchor="middle" font-size="9.5" fill="#7f4e00">containers</text>
  <rect x="15" y="474" width="132" height="106" rx="8" fill="#eaf3fb" stroke="#3d85c6" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="81" y="515.0" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1c4587">VOLUME</text>
  <text x="81" y="529.0" text-anchor="middle" font-size="9.5" fill="#1c4587">data that outlives</text>
  <text x="81" y="543.0" text-anchor="middle" font-size="9.5" fill="#1c4587">the containers</text>
  <rect x="160" y="96" width="190" height="70" rx="9" fill="#b6d7a8" stroke="#6aa84f" stroke-width="1.5"/>
  <text x="170" y="114" font-size="10.5" font-weight="bold" fill="#274e13">Dockerfile.api</text>
  <text x="170" y="131" font-size="9" fill="#274e13">+ Api/ source code</text>
  <text x="170" y="145" font-size="9" fill="#274e13">recipe for the API image</text>
  <rect x="386" y="96" width="190" height="70" rx="9" fill="#b6d7a8" stroke="#6aa84f" stroke-width="1.5"/>
  <text x="396" y="114" font-size="10.5" font-weight="bold" fill="#274e13">Dockerfile.web + nginx.conf</text>
  <text x="396" y="131" font-size="9" fill="#274e13">+ frontend/ source code</text>
  <text x="396" y="145" font-size="9" fill="#274e13">recipe and proxy settings</text>
  <rect x="612" y="96" width="190" height="70" rx="9" fill="#b6d7a8" stroke="#6aa84f" stroke-width="1.5"/>
  <text x="622" y="114" font-size="10.5" font-weight="bold" fill="#274e13">db/ scripts</text>
  <text x="622" y="131" font-size="9" fill="#274e13">01-schema.sql ... init.sh</text>
  <text x="622" y="145" font-size="9" fill="#274e13">mounted into db-init, not baked in</text>
  <rect x="838" y="96" width="190" height="70" rx="9" fill="#b6d7a8" stroke="#cc0000" stroke-width="2"/>
  <text x="848" y="114" font-size="10.5" font-weight="bold" fill="#274e13">.env</text>
  <text x="848" y="131" font-size="9" fill="#274e13">git-ignored: the real passwords</text>
  <text x="848" y="145" font-size="9" fill="#274e13">(.env.example: placeholders only)</text>
  <rect x="160" y="214" width="190" height="84" rx="9" fill="#d5c9ea" stroke="#674ea7" stroke-width="1.5"/>
  <text x="170" y="232" font-size="10.5" font-weight="bold" fill="#3d2a6b">API image (~350 MB)</text>
  <text x="170" y="249" font-size="9" fill="#3d2a6b">aspnet:9.0 + the published API</text>
  <text x="170" y="263" font-size="9" fill="#3d2a6b">ENV ASPNETCORE_URLS=http://+:8080</text>
  <text x="170" y="277" font-size="9" fill="#3d2a6b">USER app; NO secrets inside</text>
  <rect x="386" y="214" width="190" height="84" rx="9" fill="#d5c9ea" stroke="#674ea7" stroke-width="1.5"/>
  <text x="396" y="232" font-size="10.5" font-weight="bold" fill="#3d2a6b">Web image (~94 MB)</text>
  <text x="396" y="249" font-size="9" fill="#3d2a6b">nginx:alpine + built React files</text>
  <text x="396" y="263" font-size="9" fill="#3d2a6b">conf.d/default.conf = nginx.conf</text>
  <text x="396" y="277" font-size="9" fill="#3d2a6b">NO secrets inside</text>
  <rect x="612" y="214" width="190" height="84" rx="9" fill="#d5c9ea" stroke="#674ea7" stroke-width="1.5"/>
  <text x="622" y="232" font-size="10.5" font-weight="bold" fill="#3d2a6b">SQL Server image</text>
  <text x="622" y="249" font-size="9" fill="#3d2a6b">pulled from mcr.microsoft.com,</text>
  <text x="622" y="263" font-size="9" fill="#3d2a6b">not built here; it runs as the</text>
  <text x="622" y="277" font-size="9" fill="#3d2a6b">db and db-init containers</text>
  <rect x="160" y="346" width="190" height="84" rx="9" fill="#f9cb9c" stroke="#e69138" stroke-width="1.5"/>
  <text x="170" y="364" font-size="10.5" font-weight="bold" fill="#7f4e00">api container</text>
  <text x="170" y="381" font-size="9" fill="#7f4e00">BTAL_SQLSERVER = connection string</text>
  <text x="170" y="395" font-size="9" fill="#7f4e00">with the bank_app password</text>
  <text x="170" y="409" font-size="9" fill="#7f4e00">(set at start, not in the image)</text>
  <rect x="386" y="346" width="190" height="84" rx="9" fill="#f9cb9c" stroke="#e69138" stroke-width="1.5"/>
  <text x="396" y="364" font-size="10.5" font-weight="bold" fill="#7f4e00">web container</text>
  <text x="396" y="381" font-size="9" fill="#7f4e00">no secrets needed</text>
  <text x="396" y="395" font-size="9" fill="#7f4e00">proxy target api:8080 is written</text>
  <text x="396" y="409" font-size="9" fill="#7f4e00">in nginx.conf, inside the image</text>
  <rect x="612" y="346" width="190" height="84" rx="9" fill="#f9cb9c" stroke="#e69138" stroke-width="1.5"/>
  <text x="622" y="364" font-size="10.5" font-weight="bold" fill="#7f4e00">db + db-init containers</text>
  <text x="622" y="381" font-size="9" fill="#7f4e00">MSSQL_SA_PASSWORD, EULA flag</text>
  <text x="622" y="395" font-size="9" fill="#7f4e00">db-init: APP_DB_USER/PASSWORD,</text>
  <text x="622" y="409" font-size="9" fill="#7f4e00">DB_NAME, SEED_DEMO_DATA</text>
  <rect x="612" y="478" width="190" height="98" rx="9" fill="#cfe2f3" stroke="#3d85c6" stroke-width="1.5"/>
  <text x="622" y="496" font-size="10.5" font-weight="bold" fill="#1c4587">sqldata</text>
  <text x="622" y="513" font-size="9" fill="#1c4587">/var/opt/mssql of the db container</text>
  <text x="622" y="527" font-size="9" fill="#1c4587">the database files live here</text>
  <text x="622" y="541" font-size="9" fill="#1c4587">removed by `down -v`</text>
  <text x="622" y="555" font-size="9" fill="#1c4587">(or docker volume rm)</text>
  <line x1="260" y1="166" x2="260" y2="212" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="268" y="193.0" text-anchor="start" font-size="9" fill="#333">docker build</text>
  <line x1="486" y1="166" x2="486" y2="212" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="494" y="193.0" text-anchor="start" font-size="9" fill="#333">docker build</text>
  <line x1="712" y1="430" x2="712" y2="476" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="720" y="457.0" text-anchor="start" font-size="9" fill="#333">db writes its files</text>
  <polyline points="938,166 938,322.0" fill="none" stroke="#555" stroke-width="1.6"/>
  <polyline points="310,322.0 938,322.0" fill="none" stroke="#555" stroke-width="1.6"/>
  <line x1="310" y1="322.0" x2="310" y2="344" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="762" y1="322.0" x2="762" y2="344" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="316" y="317.0" text-anchor="start" font-size="9" fill="#333">compose fills ${...} from .env and passes them as environment variables to api, db and db-init at start</text>
  <text x="40" y="602" font-size="10.5" fill="#444"><tspan font-weight="bold">Rule of thumb: </tspan>code and images are the same on every machine; passwords come from .env at start; data lives in the volume.</text>
  <text x="40" y="620" font-size="10" font-style="italic" fill="#888">The three layers/env columns line up: the API image becomes the api container, the web image the web container, the SQL Server image db and db-init.</text>
</svg>
