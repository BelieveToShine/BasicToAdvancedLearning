<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 690" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#333"/></marker>
  </defs>
  <rect x="0" y="0" width="900" height="690" fill="#ffffff"/>
  <text x="450.0" y="20" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a237e">FieldErrorsFromProblemDetails — Flow: from a 400 body to a message under the right input</text>
  <text x="450.0" y="38" text-anchor="middle" font-size="11" fill="#666">Metaphor: a marked-up exam paper. The API returns a note per question; the form pins each note next to its question.</text>
  <g font-size="10.5" fill="#333"><rect x="40" y="50" width="14" height="14" rx="2" fill="#d5c9ea" stroke="#674ea7"/><text x="60" y="61">A check or rule runs</text></g>
  <g font-size="10.5" fill="#333"><rect x="186.0" y="50" width="14" height="14" rx="2" fill="#fff2cc" stroke="#f1c232"/><text x="206.0" y="61">Request / user action</text></g>
  <g font-size="10.5" fill="#333"><rect x="337.6" y="50" width="14" height="14" rx="2" fill="#f9cb9c" stroke="#e69138"/><text x="357.6" y="61">Stored / decided value</text></g>
  <g font-size="10.5" fill="#333"><rect x="494.8" y="50" width="14" height="14" rx="2" fill="#f4cccc" stroke="#cc0000"/><text x="514.8" y="61">Refusal (error answer)</text></g>
  <g font-size="10.5" fill="#333"><rect x="652.0" y="50" width="14" height="14" rx="2" fill="#d9ead3" stroke="#6aa84f"/><text x="672.0" y="61">Allowed</text></g>
  <g font-size="10.5" fill="#333"><rect x="725.2" y="50" width="14" height="14" rx="2" fill="#f4f4f4" stroke="#888888" stroke-dasharray="6 4"/><text x="745.2" y="61">Screen</text></g>
  <rect x="150" y="84" width="600" height="62" rx="8" fill="#fff2cc" stroke="#f1c232" stroke-width="1.8"/>
  <text x="450.0" y="102" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7f6000">User presses "Open account"</text>
  <text x="450.0" y="119" text-anchor="middle" font-size="9.5" fill="#333">handleSubmit builds the body from the three inputs</text>
  <text x="450.0" y="134" text-anchor="middle" font-size="9.5" fill="#333">customerId blank: left out of the JSON</text>
  <line x1="450.0" y1="146" x2="450.0" y2="180" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="458.0" y="166.0" font-size="9" font-style="italic" fill="#555">callApi("POST", "/api/accounts", body)</text>
  <rect x="150" y="180" width="600" height="62" rx="8" fill="#f4cccc" stroke="#cc0000" stroke-width="1.8"/>
  <text x="450.0" y="198" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7a0000">API answers 400 problem+json</text>
  <text x="450.0" y="215" text-anchor="middle" font-size="9.5" fill="#333">errors: { accountNumber: [msg], accountType: [msg] }</text>
  <text x="450.0" y="230" text-anchor="middle" font-size="9.5" fill="#333">key = camelCase field name, value = array of messages</text>
  <line x1="450.0" y1="242" x2="450.0" y2="276" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="458.0" y="262.0" font-size="9" font-style="italic" fill="#555">result = {status 400, problem}</text>
  <rect x="150" y="276" width="600" height="62" rx="8" fill="#d5c9ea" stroke="#674ea7" stroke-width="1.8"/>
  <text x="450.0" y="294" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#3d2a6b">classify(result) = "field"</text>
  <text x="450.0" y="311" text-anchor="middle" font-size="9.5" fill="#333">status 400 and problem.errors is an object</text>
  <line x1="450.0" y1="338" x2="450.0" y2="372" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="458.0" y="358.0" font-size="9" font-style="italic" fill="#555">splitProblemErrors(problem, FIELDS)</text>
  <rect x="150" y="372" width="600" height="62" rx="8" fill="#f9cb9c" stroke="#e69138" stroke-width="1.8"/>
  <text x="450.0" y="390" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7f4e00">byField and general (derived each render)</text>
  <text x="450.0" y="407" text-anchor="middle" font-size="9.5" fill="#333">byField: accountNumber, accountType -&gt; messages</text>
  <text x="450.0" y="422" text-anchor="middle" font-size="9.5" fill="#333">general: keys that are not form fields ($.x, body)</text>
  <line x1="450.0" y1="434" x2="450.0" y2="468" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="458.0" y="454.0" font-size="9" font-style="italic" fill="#555">render reads them</text>
  <rect x="150" y="468" width="600" height="62" rx="8" fill="#d5c9ea" stroke="#674ea7" stroke-width="1.8"/>
  <text x="450.0" y="486" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#3d2a6b">Field draws input + FieldError</text>
  <text x="450.0" y="503" text-anchor="middle" font-size="9.5" fill="#333">aria-invalid="true", aria-describedby="accountNumber-error"</text>
  <text x="450.0" y="518" text-anchor="middle" font-size="9.5" fill="#333">general messages go to one box above the result</text>
  <line x1="450.0" y1="530" x2="450.0" y2="564" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="458.0" y="550.0" font-size="9" font-style="italic" fill="#555">React updates the DOM</text>
  <rect x="150" y="564" width="600" height="62" rx="8" fill="#f4f4f4" stroke="#888888" stroke-width="1.8" stroke-dasharray="6 4"/>
  <text x="450.0" y="582" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#444">Screen: red border + message under each bad input</text>
  <text x="450.0" y="599" text-anchor="middle" font-size="9.5" fill="#333">and the raw ProblemDetails shown below the form</text>
  <text x="30" y="660" font-size="10.5" fill="#444"><tspan font-weight="bold">Not here: </tspan>a 400 whose key is "$.customerId" or "body" is not an input of the form, so it goes to the general box.</text>
</svg>
