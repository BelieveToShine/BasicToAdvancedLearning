<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#333"/></marker>
  </defs>
  <rect x="0" y="0" width="900" height="600" fill="#ffffff"/>
  <text x="450.0" y="20" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a237e">CrossLayerValidation — Flow overview: one bad input, three checkers, one message on screen</text>
  <text x="450.0" y="38" text-anchor="middle" font-size="11" fill="#666">Metaphor: airport security. The gate agent (browser) is quick but can be walked around; the checkpoint (API) sees everyone; the vault door (database) is the last lock.</text>
  <g font-size="10.5" fill="#333"><rect x="40" y="50" width="14" height="14" rx="2" fill="#d5c9ea" stroke="#674ea7"/><text x="60" y="61">A check or rule runs</text></g>
  <g font-size="10.5" fill="#333"><rect x="186.0" y="50" width="14" height="14" rx="2" fill="#fff2cc" stroke="#f1c232"/><text x="206.0" y="61">Request / user action</text></g>
  <g font-size="10.5" fill="#333"><rect x="337.6" y="50" width="14" height="14" rx="2" fill="#f9cb9c" stroke="#e69138"/><text x="357.6" y="61">Stored / decided value</text></g>
  <g font-size="10.5" fill="#333"><rect x="494.8" y="50" width="14" height="14" rx="2" fill="#f4cccc" stroke="#cc0000"/><text x="514.8" y="61">Refusal (error answer)</text></g>
  <g font-size="10.5" fill="#333"><rect x="652.0" y="50" width="14" height="14" rx="2" fill="#d9ead3" stroke="#6aa84f"/><text x="672.0" y="61">Allowed</text></g>
  <g font-size="10.5" fill="#333"><rect x="725.2" y="50" width="14" height="14" rx="2" fill="#f4f4f4" stroke="#888888" stroke-dasharray="6 4"/><text x="745.2" y="61">Screen</text></g>
  <rect x="40" y="90" width="250" height="84" rx="8" fill="#d5c9ea" stroke="#674ea7" stroke-width="1.8"/>
  <text x="165.0" y="108" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#3d2a6b">1. BROWSER check</text>
  <text x="165.0" y="125" text-anchor="middle" font-size="9.5" fill="#333">plain JavaScript on the page</text>
  <text x="165.0" y="140" text-anchor="middle" font-size="9.5" fill="#333">fast, no network trip</text>
  <text x="165.0" y="155" text-anchor="middle" font-size="9.5" fill="#333">the user controls it (lesson 01)</text>
  <rect x="325" y="90" width="250" height="84" rx="8" fill="#d5c9ea" stroke="#674ea7" stroke-width="1.8"/>
  <text x="450.0" y="108" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#3d2a6b">2. API validation</text>
  <text x="450.0" y="125" text-anchor="middle" font-size="9.5" fill="#333">[ApiController] checks the body</text>
  <text x="450.0" y="140" text-anchor="middle" font-size="9.5" fill="#333">before the action runs</text>
  <text x="450.0" y="155" text-anchor="middle" font-size="9.5" fill="#333">source of truth (lessons 01-03)</text>
  <rect x="610" y="90" width="250" height="84" rx="8" fill="#d5c9ea" stroke="#674ea7" stroke-width="1.8"/>
  <text x="735.0" y="108" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#3d2a6b">3. DATABASE constraints</text>
  <text x="735.0" y="125" text-anchor="middle" font-size="9.5" fill="#333">UNIQUE, CHECK, FOREIGN KEY</text>
  <text x="735.0" y="140" text-anchor="middle" font-size="9.5" fill="#333">last line of defence</text>
  <text x="735.0" y="155" text-anchor="middle" font-size="9.5" fill="#333">(lesson 01)</text>
  <line x1="290" y1="132" x2="323" y2="132" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="307" y="124" text-anchor="middle" font-size="9" font-style="italic" fill="#555">fetch</text>
  <line x1="575" y1="132" x2="608" y2="132" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="592" y="124" text-anchor="middle" font-size="9" font-style="italic" fill="#555">SQL</text>
  <rect x="40" y="244" width="250" height="70" rx="8" fill="#f4cccc" stroke="#cc0000" stroke-width="1.8"/>
  <text x="165.0" y="262" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7a0000">Message, no request sent</text>
  <text x="165.0" y="279" text-anchor="middle" font-size="9.5" fill="#333">the form shows it at once</text>
  <text x="165.0" y="294" text-anchor="middle" font-size="9.5" fill="#333">a raw fetch skips this step</text>
  <rect x="325" y="244" width="250" height="70" rx="8" fill="#f4cccc" stroke="#cc0000" stroke-width="1.8"/>
  <text x="450.0" y="262" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7a0000">400 / 422 / 409 / 404 / 500</text>
  <text x="450.0" y="279" text-anchor="middle" font-size="9.5" fill="#333">application/problem+json</text>
  <text x="450.0" y="294" text-anchor="middle" font-size="9.5" fill="#333">with title, detail, traceId</text>
  <rect x="610" y="244" width="250" height="70" rx="8" fill="#f4cccc" stroke="#cc0000" stroke-width="1.8"/>
  <text x="735.0" y="262" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7a0000">SQL error 547 or 2601</text>
  <text x="735.0" y="279" text-anchor="middle" font-size="9.5" fill="#333">the API maps it to 409</text>
  <text x="735.0" y="294" text-anchor="middle" font-size="9.5" fill="#333">(anything else becomes 500)</text>
  <line x1="165" y1="174" x2="165" y2="242" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="173" y="212" font-size="9" font-style="italic" fill="#555">says no</text>
  <line x1="450" y1="174" x2="450" y2="242" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="458" y="212" font-size="9" font-style="italic" fill="#555">says no</text>
  <line x1="735" y1="174" x2="735" y2="242" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="743" y="212" font-size="9" font-style="italic" fill="#555">says no</text>
  <rect x="40" y="384" width="250" height="84" rx="8" fill="#f4f4f4" stroke="#888888" stroke-width="1.8" stroke-dasharray="6 4"/>
  <text x="165.0" y="402" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#444">Next to the input</text>
  <text x="165.0" y="419" text-anchor="middle" font-size="9.5" fill="#333">400 with errors{field: [...]}</text>
  <text x="165.0" y="434" text-anchor="middle" font-size="9.5" fill="#333">(lesson 02)</text>
  <rect x="325" y="384" width="250" height="84" rx="8" fill="#f4f4f4" stroke="#888888" stroke-width="1.8" stroke-dasharray="6 4"/>
  <text x="450.0" y="402" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#444">One message for the whole form</text>
  <text x="450.0" y="419" text-anchor="middle" font-size="9.5" fill="#333">422 business rule, 409 conflict</text>
  <text x="450.0" y="434" text-anchor="middle" font-size="9.5" fill="#333">(lesson 03)</text>
  <rect x="610" y="384" width="250" height="84" rx="8" fill="#f4f4f4" stroke="#888888" stroke-width="1.8" stroke-dasharray="6 4"/>
  <text x="735.0" y="402" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#444">Generic message + Try again</text>
  <text x="735.0" y="419" text-anchor="middle" font-size="9.5" fill="#333">500, 502, network down</text>
  <text x="735.0" y="434" text-anchor="middle" font-size="9.5" fill="#333">error boundary for render errors</text>
  <text x="735.0" y="449" text-anchor="middle" font-size="9.5" fill="#333">(lessons 04, 05)</text>
  <line x1="165" y1="314" x2="165" y2="382" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="173" y="352" font-size="9" font-style="italic" fill="#555">field messages</text>
  <line x1="450" y1="314" x2="450" y2="382" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="458" y="352" font-size="9" font-style="italic" fill="#555">status decides</text>
  <line x1="735" y1="314" x2="735" y2="382" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="743" y="352" font-size="9" font-style="italic" fill="#555">no detail shown</text>
  <text x="30" y="520" font-size="10.5" fill="#444"><tspan font-weight="bold">Where to where: </tspan>input, browser check, API validation, database constraint; the first one to say no produces the message the screen shows.</text>
  <text x="30" y="538" font-size="10" font-style="italic" fill="#888">The database is reached only if the API lets the request through; a duplicate account number is such a case (lesson 01).</text>
  <text x="30" y="556" font-size="10" font-style="italic" fill="#888">Which box the message lands in is decided by the HTTP status, never by reading the English text.</text>
</svg>
