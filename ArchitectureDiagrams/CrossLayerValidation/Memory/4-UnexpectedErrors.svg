<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 564" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#555"/></marker>
  </defs>
  <rect x="0" y="0" width="1050" height="564" fill="#ffffff"/>
  <text x="525" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a237e">UnexpectedErrors — Memory: where the data lives</text>
  <text x="525" y="46" text-anchor="middle" font-size="12" fill="#666">Instant: after the 500 button, and after "Give the list the error object instead of an array" and the three uncatchable errors.</text>
  <g font-size="11" fill="#333"><rect x="60" y="60" width="14" height="14" rx="2" fill="#f9cb9c" stroke="#e69138"/><text x="80" y="71">State (kept by React)</text></g>
  <g font-size="11" fill="#333"><rect x="236" y="60" width="14" height="14" rx="2" fill="#b6d7a8" stroke="#6aa84f"/><text x="256" y="71">Props (read-only, from parent)</text></g>
  <g font-size="11" fill="#333"><rect x="466" y="60" width="14" height="14" rx="2" fill="#d5c9ea" stroke="#674ea7"/><text x="486" y="71">Derived / this-render values</text></g>
  <g font-size="11" fill="#333"><rect x="684" y="60" width="14" height="14" rx="2" fill="#f4f4f4" stroke="#888888" stroke-dasharray="4 3"/><text x="704" y="71">DOM / browser</text></g>
  <text x="125.0" y="96" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a5a10">STATE — owned by the component</text>
  <text x="385.0" y="96" text-anchor="middle" font-size="11" font-weight="bold" fill="#3f6b3f">PROPS — read-only, from the parent</text>
  <text x="645.0" y="96" text-anchor="middle" font-size="11" font-weight="bold" fill="#3d2a6b">DERIVED — worked out each render</text>
  <text x="915.0" y="96" text-anchor="middle" font-size="11" font-weight="bold" fill="#555">DOM — what the browser shows</text>
  <rect x="810" y="116" width="210" height="336" rx="10" fill="#f4f4f4" stroke="#888888" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="915.0" y="130" text-anchor="middle" font-size="10" font-weight="bold" fill="#555">DOM / outside React</text>
  <rect x="30" y="132" width="190" height="60" rx="8" fill="#f9cb9c" stroke="#e69138" stroke-width="1.5"/>
  <text x="38" y="148" font-size="10" font-weight="bold" fill="#7f4e00">shown (failure demo)</text>
  <text x="38" y="163" font-size="10" fill="#7f4e00">status 500, body kept</text>
  <text x="38" y="178" font-size="10" fill="#7f4e00">traceId 00-ca44...</text>
  <rect x="550" y="132" width="190" height="60" rx="8" fill="#d5c9ea" stroke="#674ea7" stroke-width="1.5"/>
  <text x="558" y="148" font-size="10" font-weight="bold" fill="#3d2a6b">classify = "server"</text>
  <text x="558" y="163" font-size="10" fill="#3d2a6b">generic sentence +</text>
  <text x="558" y="178" font-size="10" fill="#3d2a6b">the traceId</text>
  <text x="820" y="154" font-size="10" fill="#333">"Something went wrong</text>
  <text x="820" y="169" font-size="10" fill="#333">on our side..." + ref</text>
  <line x1="220" y1="162.0" x2="548" y2="162.0" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="384.0" y="157.0" text-anchor="middle" font-size="9" fill="#555">friendlyMessage</text>
  <line x1="740" y1="162.0" x2="808" y2="162.0" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="774.0" y="157.0" text-anchor="middle" font-size="9" fill="#555">alert</text>
  <rect x="30" y="216" width="190" height="60" rx="8" fill="#f9cb9c" stroke="#e69138" stroke-width="1.5"/>
  <text x="38" y="232" font-size="10" font-weight="bold" fill="#7f4e00">accounts (RenderCrashDemo)</text>
  <text x="38" y="247" font-size="10" fill="#7f4e00">= the 500 error object</text>
  <text x="38" y="262" font-size="10" fill="#7f4e00">NOT an array</text>
  <rect x="550" y="216" width="190" height="60" rx="8" fill="#d5c9ea" stroke="#674ea7" stroke-width="1.5"/>
  <text x="558" y="232" font-size="10" font-weight="bold" fill="#3d2a6b">AccountsView render:</text>
  <text x="558" y="247" font-size="10" fill="#3d2a6b">accounts.map throws</text>
  <text x="558" y="262" font-size="10" fill="#3d2a6b">TypeError</text>
  <text x="820" y="238" font-size="10" fill="#333">(nothing: render</text>
  <text x="820" y="253" font-size="10" fill="#333">did not finish)</text>
  <line x1="220" y1="246.0" x2="548" y2="246.0" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="384.0" y="241.0" text-anchor="middle" font-size="9" fill="#555">render</text>
  <rect x="30" y="300" width="190" height="60" rx="8" fill="#f9cb9c" stroke="#e69138" stroke-width="1.5"/>
  <text x="38" y="316" font-size="10" font-weight="bold" fill="#7f4e00">ErrorBoundary.state</text>
  <text x="38" y="331" font-size="10" fill="#7f4e00">error = TypeError</text>
  <text x="38" y="346" font-size="10" fill="#7f4e00">set by getDerived...</text>
  <rect x="550" y="300" width="190" height="60" rx="8" fill="#d5c9ea" stroke="#674ea7" stroke-width="1.5"/>
  <text x="558" y="316" font-size="10" font-weight="bold" fill="#3d2a6b">fallback(error, reset)</text>
  <text x="558" y="331" font-size="10" fill="#3d2a6b">"Try again" -&gt; reset</text>
  <text x="820" y="322" font-size="10" fill="#333">fallback box;</text>
  <text x="820" y="337" font-size="10" fill="#333">rest of page works</text>
  <line x1="220" y1="330.0" x2="548" y2="330.0" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="384.0" y="325.0" text-anchor="middle" font-size="9" fill="#555">render fallback</text>
  <line x1="740" y1="330.0" x2="808" y2="330.0" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="774.0" y="325.0" text-anchor="middle" font-size="9" fill="#555">shown</text>
  <rect x="30" y="384" width="190" height="60" rx="8" fill="#f9cb9c" stroke="#e69138" stroke-width="1.5"/>
  <text x="38" y="400" font-size="10" font-weight="bold" fill="#7f4e00">events (NotCaughtDemo)</text>
  <text x="38" y="415" font-size="10" fill="#7f4e00">3 strings; boundary</text>
  <text x="38" y="430" font-size="10" fill="#7f4e00">message "nothing yet"</text>
  <rect x="550" y="384" width="190" height="60" rx="8" fill="#d5c9ea" stroke="#674ea7" stroke-width="1.5"/>
  <text x="558" y="400" font-size="10" font-weight="bold" fill="#3d2a6b">window events:</text>
  <text x="558" y="415" font-size="10" fill="#3d2a6b">"error" x2,</text>
  <text x="558" y="430" font-size="10" fill="#3d2a6b">"unhandledrejection"</text>
  <text x="820" y="406" font-size="10" fill="#333">list of the 3 events;</text>
  <text x="820" y="421" font-size="10" fill="#333">Boundary: nothing yet</text>
  <line x1="550" y1="414.0" x2="222" y2="414.0" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="386.0" y="409.0" text-anchor="middle" font-size="9" fill="#555">listener: setEvents</text>
  <text x="30" y="486" font-size="10.5" fill="#444"><tspan font-weight="bold">The boundary keeps its own state (the caught error); it only sees errors thrown while rendering its children. </tspan>Window-level events reach state only because our listener copies them there.</text>
  <text x="30" y="504" font-size="10" font-style="italic" fill="#888">The recorded 500 body is a copy of a real answer; the 502 and the closed-port fetch are shown the same way.</text>
</svg>
