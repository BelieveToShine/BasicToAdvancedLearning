<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#333"/></marker>
  </defs>
  <rect x="0" y="0" width="900" height="700" fill="#ffffff"/>
  <text x="450.0" y="20" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a237e">finally — Sub-level Flow: a toll booth every lane must pass</text>
  <text x="450.0" y="38" text-anchor="middle" font-size="11" fill="#666">Whether the try succeeded or threw, the finally block runs before the code moves on.</text>
  <text x="450" y="50" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#274e13">START</text>
  <line x1="450" y1="54" x2="450" y2="92" stroke="#333" stroke-width="2"/>
  <polygon points="450,54 450,72 480,63" fill="#38761d"/>
  <line x1="450" y1="92" x2="450" y2="100" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="300" y="100" width="300" height="50" rx="8" fill="#e8f4fb" stroke="#3d85c6" stroke-width="1.5"/>
  <text x="450" y="122" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a4a73">foreach (decimal attempt in attempts)</text>
  <text x="450" y="140" text-anchor="middle" font-size="9.5" fill="#555">two laps: 100m, then 900m</text>
  <polyline points="380,150 380,175 190,175 190,205" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <polyline points="520,150 520,175 710,175 710,205" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="70" y="205" width="240" height="60" rx="8" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1.5"/>
  <text x="190" y="225" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#274e13">lap 1 · attempt = 100m</text>
  <text x="190" y="241" text-anchor="middle" font-size="9.5" fill="#333">try: account.Withdraw(attempt)</text>
  <text x="190" y="257" text-anchor="middle" font-size="9.5" fill="#274e13">succeeds — nothing thrown</text>
  <rect x="590" y="205" width="240" height="60" rx="8" fill="#fdebd9" stroke="#e69138" stroke-width="1.5"/>
  <text x="710" y="225" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#8a5a10">lap 2 · attempt = 900m</text>
  <text x="710" y="241" text-anchor="middle" font-size="9.5" fill="#333">try: account.Withdraw(attempt)</text>
  <text x="710" y="257" text-anchor="middle" font-size="9.5" fill="#cc0000">throws InsufficientFundsException</text>
  <line x1="190" y1="265" x2="190" y2="305" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="198" y="290" font-size="9" fill="#555">no exception</text>
  <line x1="710" y1="265" x2="710" y2="305" stroke="#cc0000" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="718" y="290" font-size="9" fill="#cc0000">throws</text>
  <rect x="70" y="305" width="240" height="50" rx="8" fill="#e8f4fb" stroke="#3d85c6" stroke-width="1.5"/>
  <text x="190" y="327" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a4a73">Console.WriteLine("Withdrew 100")</text>
  <text x="190" y="344" text-anchor="middle" font-size="9.5" fill="#555">balance 500 → 400</text>
  <rect x="590" y="305" width="240" height="70" rx="8" fill="#fff4f4" stroke="#cc0000" stroke-width="1.5" stroke-dasharray="6 3"/>
  <text x="710" y="325" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#990000">catch (InsufficientFundsException ex)</text>
  <text x="710" y="343" text-anchor="middle" font-size="9.5" fill="#333">Console.WriteLine("Refused 900: …")</text>
  <text x="710" y="361" text-anchor="middle" font-size="9.5" fill="#555">balance stays 400</text>
  <polyline points="190,355 190,405 380,405 380,428" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <polyline points="710,375 710,405 520,405 520,428" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="250" y="430" width="400" height="70" rx="8" fill="#fffbe8" stroke="#f1c232" stroke-width="2"/>
  <rect x="250" y="430" width="400" height="70" rx="8" fill="none" stroke="#e69138" stroke-width="2"><animate attributeName="stroke-width" values="1;4;1" dur="3s" repeatCount="indefinite"/></rect>
  <text x="450" y="452" text-anchor="middle" font-size="11" font-weight="bold" fill="#7f6000">finally — runs on BOTH lanes</text>
  <text x="450" y="472" text-anchor="middle" font-size="10" fill="#333">sessionsClosed++;</text>
  <text x="450" y="490" text-anchor="middle" font-size="9.5" fill="#333">Console.WriteLine($"Session {sessionsClosed} closed");</text>
  <line x1="450" y1="500" x2="450" y2="528" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="450" y="542" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#990000">END</text>
  <line x1="450" y1="550" x2="450" y2="590" stroke="#333" stroke-width="2"/>
  <polygon points="450,550 450,568 480,559" fill="#cc0000"/>
  <text x="30" y="626" font-size="10.5" fill="#444"><tspan font-weight="bold">One booth, every lane:</tspan> the success lane and the failure lane both pass finally, so sessionsClosed ends at 2.</text>
  <text x="30" y="644" font-size="10" font-style="italic" fill="#888">Lap 1 prints "Withdrew 100" then "Session 1 closed"; lap 2 prints "Refused 900: …" then "Session 2 closed" — four Console.WriteLine lines (the lanes are drawn side by side).</text>
  <text x="30" y="662" font-size="10" font-style="italic" fill="#888">Each method also opens with PrintHeading(): four more Console.WriteLine calls for the title banner (not drawn).</text>
  <text x="30" y="680" font-size="10" font-style="italic" fill="#888">finally runs whether the try succeeds or throws. It does not run if the process itself ends first (a crash, a kill, Environment.Exit).</text>
</svg>
