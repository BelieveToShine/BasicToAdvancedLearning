<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#333"/></marker>
  </defs>
  <rect x="0" y="0" width="900" height="650" fill="#ffffff"/>
  <text x="450.0" y="20" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a237e">try / catch — Sub-level Flow: a safety net under the high wire</text>
  <text x="450.0" y="38" text-anchor="middle" font-size="11" fill="#666">Risky code runs inside try. If it throws, execution jumps to the matching catch and the program carries on.</text>
  <text x="350" y="50" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#274e13">START</text>
  <line x1="350" y1="54" x2="350" y2="92" stroke="#333" stroke-width="2"/>
  <polygon points="350,54 350,72 380,63" fill="#38761d"/>
  <line x1="350" y1="92" x2="350" y2="100" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="200" y="100" width="300" height="44" rx="8" fill="#e8f4fb" stroke="#3d85c6" stroke-width="1.5"/>
  <text x="350" y="127" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1a4a73">string typedAmount = "abc";</text>
  <line x1="350" y1="144" x2="350" y2="176" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="200" y="176" width="300" height="54" rx="8" fill="#eaf6ea" stroke="#6aa84f" stroke-width="2"/>
  <text x="350" y="196" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#274e13">try:</text>
  <text x="350" y="215" text-anchor="middle" font-size="10" fill="#333">decimal amount = decimal.Parse(typedAmount);</text>
  <line x1="500" y1="203" x2="580" y2="203" stroke="#999" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="540" y="196" text-anchor="middle" font-size="9" fill="#777">if it worked</text>
  <rect x="580" y="176" width="260" height="54" rx="8" fill="#f4f4f4" stroke="#aaaaaa" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="710" y="196" text-anchor="middle" font-size="9.5" fill="#777">Console.WriteLine($"Parsed {amount}")</text>
  <text x="710" y="214" text-anchor="middle" font-size="9.5" font-weight="bold" font-style="italic" fill="#cc0000">SKIPPED — never reached</text>
  <line x1="350" y1="230" x2="350" y2="290" stroke="#cc0000" stroke-width="2" marker-end="url(#a)"/>
  <text x="360" y="264" font-size="10" font-weight="bold" fill="#cc0000">throws FormatException<animate attributeName="opacity" values="1;0.3;1" dur="3s" repeatCount="indefinite"/></text>
  <rect x="200" y="292" width="300" height="76" rx="10" fill="#fff4f4" stroke="#cc0000" stroke-width="2" stroke-dasharray="7 4"/>
  <text x="350" y="314" text-anchor="middle" font-size="11" font-weight="bold" fill="#990000">catch (FormatException ex)</text>
  <text x="350" y="334" text-anchor="middle" font-size="9.5" fill="#333">ex → the exception object that was thrown</text>
  <text x="350" y="352" text-anchor="middle" font-size="9.5" fill="#333">Console.WriteLine($"Caught a {ex.GetType().Name}…")</text>
  <line x1="350" y1="368" x2="350" y2="408" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="200" y="410" width="300" height="44" rx="8" fill="#e8f4fb" stroke="#3d85c6" stroke-width="1.5"/>
  <text x="350" y="436" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#1a4a73">Console.WriteLine("The program carried on…")</text>
  <line x1="350" y1="454" x2="350" y2="482" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="350" y="496" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#990000">END</text>
  <line x1="350" y1="504" x2="350" y2="544" stroke="#333" stroke-width="2"/>
  <polygon points="350,504 350,522 380,513" fill="#cc0000"/>
  <text x="30" y="580" font-size="10.5" fill="#444"><tspan font-weight="bold">The net only catches what it is built for:</tspan> catch (FormatException) handles a FormatException — anything else would still crash the program.</text>
  <text x="30" y="598" font-size="10" font-style="italic" fill="#888">Console.WriteLine prints the caught type and message, then the "carried on" line — two lines. The "Parsed" line is skipped because the Parse line above it threw.</text>
  <text x="30" y="616" font-size="10" font-style="italic" fill="#888">Each method also opens with PrintHeading(): four more Console.WriteLine calls for the title banner (not drawn).</text>
</svg>
