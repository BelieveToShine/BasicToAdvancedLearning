<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#555"/></marker>
  </defs>
  <rect x="0" y="0" width="1200" height="540" fill="#ffffff"/>
  <text x="600.0" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a237e">Custom Exceptions — Memory: Stack / Heap / Static</text>
  <text x="600.0" y="46" text-anchor="middle" font-size="12" fill="#666">Snapshot: the instant `throw new InsufficientFundsException(...)` runs inside Withdraw — before any catch.</text>
  <g font-size="11" fill="#333"><rect x="200" y="60" width="14" height="14" rx="2" fill="#b6d7a8" stroke="#6aa84f"/><text x="220" y="71">Stack</text></g>
  <g font-size="11" fill="#333"><rect x="380" y="60" width="14" height="14" rx="2" fill="#f9cb9c" stroke="#e69138"/><text x="400" y="71">Heap</text></g>
  <g font-size="11" fill="#333"><rect x="560" y="60" width="14" height="14" rx="2" fill="#d5c9ea" stroke="#674ea7"/><text x="580" y="71">Static</text></g>
  <text x="220" y="96" text-anchor="middle" font-size="12" font-weight="bold" fill="#3f6b3f">STACK — call frames (top = currently executing)</text>
  <text x="700" y="96" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a5a10">HEAP</text>
  <text x="1145" y="96" text-anchor="middle" font-size="12" font-weight="bold" fill="#3d2a6b">STATIC</text>
  <rect x="30" y="108" width="380" height="338" rx="10" fill="none" stroke="#999" stroke-width="1" stroke-dasharray="5 4"/>
  <rect x="50" y="118" width="340" height="94" rx="8" fill="#b6d7a8" stroke="#6aa84f" stroke-width="2"/>
  <text x="220" y="136" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#274e13">SafeAccount.Withdraw(decimal amount) — ACTIVE</text>
  <rect x="62" y="146" width="316" height="26" rx="4" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1"/>
  <text x="70" y="163" font-size="10" fill="#1b3d1b">this → pointer  (SafeAccount)</text>
  <rect x="62" y="176" width="316" height="26" rx="4" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1"/>
  <text x="70" y="193" font-size="10" fill="#1b3d1b">amount = 900</text>
  <rect x="50" y="222" width="340" height="94" rx="8" fill="#dcecdc" stroke="#6aa84f" stroke-width="1.5"/>
  <text x="220" y="240" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#4c6b4c">ExplainCustomExceptions() — paused</text>
  <rect x="62" y="250" width="316" height="26" rx="4" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1"/>
  <text x="70" y="267" font-size="10" fill="#1b3d1b">account → pointer  (SafeAccount)</text>
  <text x="70" y="297" font-size="9.5" font-style="italic" fill="#6b8a6b">ex, shortfall — not created yet (catch has not run)</text>
  <rect x="50" y="326" width="340" height="50" rx="8" fill="#dcecdc" stroke="#6aa84f" stroke-width="1.5"/>
  <text x="220" y="346" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#4c6b4c">ExceptionHandlingExample.Explain()</text>
  <text x="220" y="362" text-anchor="middle" font-size="9.5" fill="#6b8a6b">paused — waiting for the call above to return</text>
  <rect x="50" y="386" width="340" height="50" rx="8" fill="#dcecdc" stroke="#6aa84f" stroke-width="1.5"/>
  <text x="220" y="406" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#4c6b4c">Program.cs (Main)</text>
  <text x="220" y="422" text-anchor="middle" font-size="9.5" fill="#6b8a6b">paused — waiting for topic.Explain() to return</text>
  <rect x="460" y="118" width="250" height="96" rx="10" fill="#f9cb9c" stroke="#e69138" stroke-width="1.5"/>
  <text x="585.0" y="140" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7f4e00">SafeAccount — account</text>
  <rect x="472" y="150" width="226" height="26" rx="4" fill="#fff3e6" stroke="#e69138" stroke-width="1"/>
  <text x="480" y="167" font-size="10" fill="#7f4e00">_ownerName → pointer (string)</text>
  <rect x="472" y="180" width="226" height="26" rx="4" fill="#fff3e6" stroke="#e69138" stroke-width="1"/>
  <text x="480" y="197" font-size="10" fill="#7f4e00">_balance = 500</text>
  <rect x="740" y="148" width="100" height="30" rx="6" fill="#fff3e6" stroke="#e69138" stroke-width="1.5"/>
  <text x="790.0" y="167" text-anchor="middle" font-size="10" fill="#7f4e00">"Anita"</text>
  <line x1="710" y1="163" x2="738" y2="163" stroke="#555" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="460" y="262" width="300" height="112" rx="10" fill="#f9cb9c" stroke="#cc0000" stroke-width="2"/>
  <text x="610.0" y="284" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7f4e00">InsufficientFundsException — thrown</text>
  <rect x="472" y="294" width="276" height="26" rx="4" fill="#fff3e6" stroke="#e69138" stroke-width="1"/>
  <text x="480" y="311" font-size="10" fill="#7f4e00">Message → pointer (string)</text>
  <rect x="472" y="324" width="276" height="26" rx="4" fill="#fff3e6" stroke="#e69138" stroke-width="1"/>
  <text x="480" y="341" font-size="10" fill="#7f4e00">_shortfall = 400</text>
  <text x="474" y="365" font-size="8.5" font-style="italic" fill="#a06a1f">no variable holds it yet — the runtime carries it</text>
  <rect x="790" y="292" width="250" height="30" rx="6" fill="#fff3e6" stroke="#e69138" stroke-width="1.5"/>
  <text x="915.0" y="311" text-anchor="middle" font-size="10" fill="#7f4e00">"Not enough money: short by 400"</text>
  <line x1="760" y1="307" x2="788" y2="307" stroke="#555" stroke-width="1.4" marker-end="url(#a)"/>
  <polyline points="378,159 444,159 444,140 458,140" fill="none" stroke="#555" stroke-width="1.4" marker-end="url(#a)"/>
  <polyline points="378,263 432,263 432,170 458,170" fill="none" stroke="#555" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="1100" y="118" width="90" height="130" rx="10" fill="#d5c9ea" stroke="#674ea7" stroke-width="1.5" stroke-dasharray="6 4" fill-opacity="0.25"/>
  <text x="1145" y="150" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#3d2a6b">Nothing</text>
  <text x="1145" y="166" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#3d2a6b">here yet</text>
  <text x="40" y="470" font-size="10.5" fill="#444"><tspan font-weight="bold">Locked-shape exception — 4 frames, not 3: </tspan>Withdraw is still on the Stack, above the method that called it, because the throw has not unwound anything yet.</text>
  <text x="40" y="488" font-size="10" font-style="italic" fill="#888">The exception object is already built on the Heap, but no variable points at it: the runtime carries it up. It searches the callers for a matching catch, unwinds to it (popping Withdraw), and only then do `ex` and `shortfall` = 400 exist.</text>
  <text x="40" y="506" font-size="10" font-style="italic" fill="#888">account, in the paused frame, is the caller's own pointer to the very object `this` points at.</text>
</svg>
