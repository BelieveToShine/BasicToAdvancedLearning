<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 470" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#555"/></marker>
  </defs>
  <rect x="0" y="0" width="1100" height="470" fill="#ffffff"/>
  <text x="550" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a237e">Exception Handling — Memory: Stack / Heap / Static (high level)</text>
  <text x="550" y="46" text-anchor="middle" font-size="12" fill="#666">An exception is just another object on the Heap; a catch variable is just another pointer on the Stack.</text>
  <g font-size="11" fill="#333"><rect x="150" y="60" width="14" height="14" rx="2" fill="#b6d7a8" stroke="#6aa84f"/><text x="170" y="71">Stack</text></g>
  <g font-size="11" fill="#333"><rect x="330" y="60" width="14" height="14" rx="2" fill="#f9cb9c" stroke="#e69138"/><text x="350" y="71">Heap</text></g>
  <g font-size="11" fill="#333"><rect x="510" y="60" width="14" height="14" rx="2" fill="#d5c9ea" stroke="#674ea7"/><text x="530" y="71">Static</text></g>
  <text x="230" y="98" text-anchor="middle" font-size="12" font-weight="bold" fill="#3f6b3f">STACK — pointers, plus a few plain values</text>
  <text x="630" y="98" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a5a10">HEAP — the account and any exception object</text>
  <text x="950" y="98" text-anchor="middle" font-size="12" font-weight="bold" fill="#3d2a6b">STATIC</text>
  <rect x="40" y="112" width="380" height="222" rx="8" fill="#b6d7a8" stroke="#6aa84f" stroke-width="2"/>
  <text x="230" y="132" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#274e13">One slot per local, in each method's own frame</text>
  <rect x="56" y="144" width="348" height="38" rx="4" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1"/>
  <text x="66" y="161" font-size="10" font-weight="bold" fill="#1b3d1b">typedAmount, ex → pointers; amount unassigned</text>
  <text x="66" y="175" font-size="8.5" fill="#3f6b3f">ExplainTryCatch()</text>
  <rect x="56" y="188" width="348" height="38" rx="4" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1"/>
  <text x="66" y="205" font-size="10" font-weight="bold" fill="#1b3d1b">account, requests, ex → pointers; request inline</text>
  <text x="66" y="219" font-size="8.5" fill="#3f6b3f">ExplainCatchOrder()</text>
  <rect x="56" y="232" width="348" height="38" rx="4" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1"/>
  <text x="66" y="249" font-size="10" font-weight="bold" fill="#1b3d1b">account, attempts → pointers; 2 values inline</text>
  <text x="66" y="263" font-size="8.5" fill="#3f6b3f">ExplainFinally()</text>
  <rect x="56" y="276" width="348" height="38" rx="4" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1"/>
  <text x="66" y="293" font-size="10" font-weight="bold" fill="#1b3d1b">Withdraw + caller frames: 4 frames at the throw</text>
  <text x="66" y="307" font-size="8.5" fill="#3f6b3f">ExplainCustomExceptions() — see Memory/4</text>
  <rect x="450" y="112" width="380" height="222" rx="8" fill="#f9cb9c" stroke="#e69138" stroke-width="1.5"/>
  <text x="640" y="132" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7f4e00">The real objects — this is where the data is</text>
  <rect x="466" y="144" width="348" height="54" rx="6" fill="#ffffff" stroke="#f0c07a" stroke-width="1"/>
  <text x="640" y="166" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#7f4e00">An exception = an ordinary object with a Message</text>
  <text x="640" y="184" text-anchor="middle" font-size="8.5" fill="#a06a1f">→ Memory/1 (FormatException) and Memory/2 (custom type)</text>
  <rect x="466" y="206" width="348" height="54" rx="6" fill="#ffffff" stroke="#f0c07a" stroke-width="1"/>
  <text x="640" y="228" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#7f4e00">A custom exception can carry extra data</text>
  <text x="640" y="246" text-anchor="middle" font-size="8.5" fill="#a06a1f">→ _shortfall = 400 in Memory/2 and Memory/4</text>
  <rect x="466" y="268" width="348" height="54" rx="6" fill="#ffffff" stroke="#f0c07a" stroke-width="1"/>
  <text x="640" y="290" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#7f4e00">The throw builds it BEFORE anything unwinds</text>
  <text x="640" y="308" text-anchor="middle" font-size="8.5" fill="#a06a1f">→ Memory/4: on the Heap, held by no variable yet</text>
  <rect x="860" y="112" width="200" height="222" rx="10" fill="#d5c9ea" stroke="#674ea7" stroke-width="1.5" stroke-dasharray="6 4" fill-opacity="0.25"/>
  <text x="960" y="190" text-anchor="middle" font-size="11" font-weight="bold" fill="#3d2a6b">Nothing here yet</text>
  <text x="960" y="214" text-anchor="middle" font-size="10" fill="#5b4a7a">No static members in</text>
  <text x="960" y="230" text-anchor="middle" font-size="10" fill="#5b4a7a">this topic (see Topic 5</text>
  <text x="960" y="246" text-anchor="middle" font-size="10" fill="#5b4a7a">for the Static column).</text>
  <text x="40" y="374" font-size="10.5" fill="#444"><tspan font-weight="bold">Catching an exception does not copy it.</tspan> `ex` is a pointer to the very object the throw created; when the catch block ends, `ex` disappears and the object is left for garbage collection.</text>
  <text x="40" y="394" font-size="10" font-style="italic" fill="#888">Memory/4 is the one locked-shape exception in this topic: it shows 4 stack frames, because at the instant of the throw the failing method has not been unwound yet.</text>
</svg>
