<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 600" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#555"/></marker>
  </defs>
  <rect x="0" y="0" width="1150" height="600" fill="#ffffff"/>
  <text x="575.0" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a237e">Catch order — Memory: Stack / Heap / Static</text>
  <text x="575.0" y="46" text-anchor="middle" font-size="12" fill="#666">Snapshot: ExplainCatchOrder() is running, in the second lap, inside catch (InsufficientFundsException ex).</text>
  <g font-size="11" fill="#333"><rect x="200" y="60" width="14" height="14" rx="2" fill="#b6d7a8" stroke="#6aa84f"/><text x="220" y="71">Stack</text></g>
  <g font-size="11" fill="#333"><rect x="380" y="60" width="14" height="14" rx="2" fill="#f9cb9c" stroke="#e69138"/><text x="400" y="71">Heap</text></g>
  <g font-size="11" fill="#333"><rect x="560" y="60" width="14" height="14" rx="2" fill="#d5c9ea" stroke="#674ea7"/><text x="580" y="71">Static</text></g>
  <text x="220" y="96" text-anchor="middle" font-size="12" font-weight="bold" fill="#3f6b3f">STACK — call frames (top = currently executing)</text>
  <text x="700" y="96" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a5a10">HEAP</text>
  <text x="1095" y="96" text-anchor="middle" font-size="12" font-weight="bold" fill="#3d2a6b">STATIC</text>
  <rect x="30" y="108" width="380" height="294" rx="10" fill="none" stroke="#999" stroke-width="1" stroke-dasharray="5 4"/>
  <rect x="50" y="118" width="340" height="154" rx="8" fill="#b6d7a8" stroke="#6aa84f" stroke-width="2"/>
  <text x="220" y="136" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#274e13">ExceptionHandlingDemo.ExplainCatchOrder() — ACTIVE</text>
  <rect x="62" y="146" width="316" height="26" rx="4" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1"/>
  <text x="70" y="163" font-size="10" fill="#1b3d1b">account → pointer  (SafeAccount)</text>
  <rect x="62" y="176" width="316" height="26" rx="4" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1"/>
  <text x="70" y="193" font-size="10" fill="#1b3d1b">requests → pointer  (decimal[])</text>
  <rect x="62" y="206" width="316" height="26" rx="4" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1"/>
  <text x="70" y="223" font-size="10" fill="#1b3d1b">request = 900</text>
  <rect x="62" y="236" width="316" height="26" rx="4" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1"/>
  <text x="70" y="253" font-size="10" fill="#1b3d1b">ex → pointer  (InsufficientFundsException)</text>
  <rect x="50" y="282" width="340" height="50" rx="8" fill="#dcecdc" stroke="#6aa84f" stroke-width="1.5"/>
  <text x="220" y="302" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#4c6b4c">ExceptionHandlingExample.Explain()</text>
  <text x="220" y="318" text-anchor="middle" font-size="9.5" fill="#6b8a6b">paused — waiting for the call above to return</text>
  <rect x="50" y="342" width="340" height="50" rx="8" fill="#dcecdc" stroke="#6aa84f" stroke-width="1.5"/>
  <text x="220" y="362" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#4c6b4c">Program.cs (Main)</text>
  <text x="220" y="378" text-anchor="middle" font-size="9.5" fill="#6b8a6b">paused — waiting for topic.Explain() to return</text>
  <rect x="460" y="118" width="250" height="96" rx="10" fill="#f9cb9c" stroke="#e69138" stroke-width="1.5"/>
  <text x="585.0" y="140" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7f4e00">SafeAccount — account</text>
  <rect x="472" y="150" width="226" height="26" rx="4" fill="#fff3e6" stroke="#e69138" stroke-width="1"/>
  <text x="480" y="167" font-size="10" fill="#7f4e00">_ownerName → pointer (string)</text>
  <rect x="472" y="180" width="226" height="26" rx="4" fill="#fff3e6" stroke="#e69138" stroke-width="1"/>
  <text x="480" y="197" font-size="10" fill="#7f4e00">_balance = 500</text>
  <rect x="740" y="148" width="100" height="30" rx="6" fill="#fff3e6" stroke="#e69138" stroke-width="1.5"/>
  <text x="790.0" y="167" text-anchor="middle" font-size="10" fill="#7f4e00">"Anita"</text>
  <line x1="710" y1="163" x2="738" y2="163" stroke="#555" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="460" y="250" width="200" height="126" rx="10" fill="#f9cb9c" stroke="#e69138" stroke-width="1.5"/>
  <text x="560.0" y="272" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7f4e00">decimal[3]</text>
  <rect x="472" y="282" width="176" height="26" rx="4" fill="#fff3e6" stroke="#e69138" stroke-width="1"/>
  <text x="480" y="299" font-size="10" fill="#7f4e00">[0] = -5</text>
  <rect x="472" y="312" width="176" height="26" rx="4" fill="#fff3e6" stroke="#e69138" stroke-width="1"/>
  <text x="480" y="329" font-size="10" fill="#7f4e00">[1] = 900</text>
  <rect x="472" y="342" width="176" height="26" rx="4" fill="#fff3e6" stroke="#e69138" stroke-width="1"/>
  <text x="480" y="359" font-size="10" fill="#7f4e00">[2] = 100</text>
  <rect x="460" y="412" width="260" height="112" rx="10" fill="#f9cb9c" stroke="#e69138" stroke-width="1.5"/>
  <text x="590.0" y="434" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7f4e00">InsufficientFundsException — ex</text>
  <rect x="472" y="444" width="236" height="26" rx="4" fill="#fff3e6" stroke="#e69138" stroke-width="1"/>
  <text x="480" y="461" font-size="10" fill="#7f4e00">Message → pointer (string)</text>
  <rect x="472" y="474" width="236" height="26" rx="4" fill="#fff3e6" stroke="#e69138" stroke-width="1"/>
  <text x="480" y="491" font-size="10" fill="#7f4e00">_shortfall = 400</text>
  <text x="474" y="515" font-size="8.5" font-style="italic" fill="#a06a1f">(a few more internal fields not shown)</text>
  <rect x="760" y="442" width="230" height="30" rx="6" fill="#fff3e6" stroke="#e69138" stroke-width="1.5"/>
  <text x="875.0" y="461" text-anchor="middle" font-size="10" fill="#7f4e00">"Not enough money: short by 400"</text>
  <line x1="720" y1="457" x2="758" y2="457" stroke="#555" stroke-width="1.4" marker-end="url(#a)"/>
  <polyline points="378,159 444,159 444,140 458,140" fill="none" stroke="#555" stroke-width="1.4" marker-end="url(#a)"/>
  <polyline points="378,189 432,189 432,272 458,272" fill="none" stroke="#555" stroke-width="1.4" marker-end="url(#a)"/>
  <polyline points="378,249 420,249 420,434 458,434" fill="none" stroke="#555" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="1050" y="118" width="90" height="130" rx="10" fill="#d5c9ea" stroke="#674ea7" stroke-width="1.5" stroke-dasharray="6 4" fill-opacity="0.25"/>
  <text x="1095" y="150" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#3d2a6b">Nothing</text>
  <text x="1095" y="166" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#3d2a6b">here yet</text>
  <text x="40" y="548" font-size="10.5" fill="#444"><tspan font-weight="bold">The clause that matched is catch (InsufficientFundsException ex): </tspan>`ex` points at the exception object, which carries _shortfall = 400 (900 asked, 500 available).</text>
  <text x="40" y="566" font-size="10" font-style="italic" fill="#888">Clauses are tried top to bottom and the first that fits wins; plain Exception must be LAST (the compiler rejects any clause after it). The -5 lap is done; the 100 lap comes next.</text>
</svg>
