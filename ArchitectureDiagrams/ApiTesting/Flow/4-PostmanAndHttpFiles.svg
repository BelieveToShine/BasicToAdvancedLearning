<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#333"/></marker>
  </defs>
  <rect x="0" y="0" width="900" height="900" fill="#ffffff"/>
  <text x="450.0" y="20" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a237e">Postman collection and .http file — Sub-level Flow: an assembly line that replays saved requests</text>
  <text x="450.0" y="38" text-anchor="middle" font-size="11" fill="#666">Each saved request goes through four stations: fill in variables, read the expected status, send it, compare.</text>
  <text x="210" y="50" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#274e13">START</text>
  <line x1="210" y1="54" x2="210" y2="92" stroke="#333" stroke-width="2"/>
  <polygon points="210,54 210,72 240,63" fill="#38761d"/>
  <line x1="210" y1="92" x2="210" y2="100" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="60" y="100" width="300" height="70" rx="8" fill="#e8f4fb" stroke="#3d85c6" stroke-width="1.5"/>
  <text x="210.0" y="125.0" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a4a73">FindShippedFile(name)  →  File.ReadAllText</text>
  <text x="210.0" y="139.0" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a4a73">the .postman_collection.json file</text>
  <text x="210.0" y="153.0" text-anchor="middle" font-size="9.5" fill="#555">or the embedded copy if the file is not found</text>
  <rect x="520" y="100" width="320" height="70" rx="10" fill="#f1f1f1" stroke="#777777" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="680" y="122" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#444">DISK (outside .NET)</text>
  <text x="680" y="142" text-anchor="middle" font-size="9" fill="#333">ApiTesting/bank-api.postman_collection.json</text>
  <text x="680" y="158" text-anchor="middle" font-size="9" fill="#333">a text file holding 8 saved requests</text>
  <line x1="360" y1="120" x2="520" y2="120" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="440" y="112" text-anchor="middle" font-size="9.5" fill="#555">reads the file</text>
  <line x1="520" y1="154" x2="362" y2="154" stroke="#333" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="440" y="146" text-anchor="middle" font-size="9.5" fill="#555">text → collectionText</text>
  <text x="218" y="192" font-size="9" font-style="italic" fill="#555">Console.WriteLine ×3: note, "Loaded…", "matches…"</text>
  <line x1="210" y1="170" x2="210" y2="210" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="60" y="210" width="300" height="56" rx="8" fill="#e8f4fb" stroke="#3d85c6" stroke-width="1.5"/>
  <text x="210.0" y="235.0" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a4a73">JsonDocument.Parse(collectionText)</text>
  <text x="210.0" y="250.0" text-anchor="middle" font-size="9.5" fill="#555">read the recipe card as data</text>
  <text x="218" y="288" font-size="9" font-style="italic" fill="#555">Console.WriteLine: collection name, "8 requests"</text>
  <line x1="210" y1="266" x2="210" y2="310" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="60" y="310" width="300" height="50" rx="8" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1.5"/>
  <text x="210.0" y="332.0" text-anchor="middle" font-size="10" font-weight="bold" fill="#274e13">using RunningServer server = BankApi.Start();</text>
  <text x="210.0" y="347.0" text-anchor="middle" font-size="9.5" fill="#555">open the API</text>
  <rect x="460" y="300" width="290" height="64" rx="10" fill="#f4f4f4" stroke="#555555" stroke-width="1.5"/>
  <text x="605.0" y="322" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">the API server</text>
  <text x="605.0" y="338" text-anchor="middle" font-size="9.5" font-style="italic" fill="#777">(in this process)</text>
  <line x1="360" y1="335" x2="460" y2="335" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="410" y="327" text-anchor="middle" font-size="9.5" fill="#555">starts it</text>
  <text x="450" y="408" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#8a5a10">foreach item in the collection   (×8)</text>
  <rect x="40" y="420" width="190" height="90" rx="8" fill="#fdebd9" stroke="#e69138" stroke-width="1.5"/>
  <text x="135.0" y="455.0" text-anchor="middle" font-size="10" font-weight="bold" fill="#8a5a10">1  ResolveVariables</text>
  <text x="135.0" y="469.0" text-anchor="middle" font-size="10" font-weight="bold" fill="#8a5a10">{{baseUrl}} → live address</text>
  <text x="135.0" y="483.0" text-anchor="middle" font-size="9.5" fill="#555">{{accountId}}, {{newAccountId}}</text>
  <line x1="230" y1="465" x2="260" y2="465" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="260" y="420" width="190" height="90" rx="8" fill="#fdebd9" stroke="#e69138" stroke-width="1.5"/>
  <text x="355.0" y="455.0" text-anchor="middle" font-size="10" font-weight="bold" fill="#8a5a10">2  ExpectedStatus</text>
  <text x="355.0" y="469.0" text-anchor="middle" font-size="10" font-weight="bold" fill="#8a5a10">reads the number N in the</text>
  <text x="355.0" y="483.0" text-anchor="middle" font-size="9.5" fill="#555">script  have.status(N)</text>
  <line x1="450" y1="465" x2="480" y2="465" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="480" y="420" width="190" height="90" rx="8" fill="#fdebd9" stroke="#e69138" stroke-width="1.5"/>
  <text x="575.0" y="455.0" text-anchor="middle" font-size="10" font-weight="bold" fill="#8a5a10">3  SendCollectionRequest</text>
  <text x="575.0" y="469.0" text-anchor="middle" font-size="10" font-weight="bold" fill="#8a5a10">method + URL + headers</text>
  <text x="575.0" y="483.0" text-anchor="middle" font-size="9.5" fill="#555">+ body → HTTP request</text>
  <line x1="670" y1="465" x2="700" y2="465" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="700" y="420" width="190" height="90" rx="8" fill="#fdebd9" stroke="#e69138" stroke-width="1.5"/>
  <text x="795.0" y="455.0" text-anchor="middle" font-size="10" font-weight="bold" fill="#8a5a10">4  compare</text>
  <text x="795.0" y="469.0" text-anchor="middle" font-size="10" font-weight="bold" fill="#8a5a10">actual == expected ?</text>
  <text x="795.0" y="483.0" text-anchor="middle" font-size="9.5" fill="#555">Console.WriteLine: match</text>
  <line x1="570" y1="420" x2="570" y2="366" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="578" y="396" text-anchor="start" font-size="9.5" fill="#555">HTTP request</text>
  <line x1="680" y1="366" x2="680" y2="418" stroke="#333" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="688" y="396" text-anchor="start" font-size="9.5" fill="#555">reply</text>
  <polyline points="795,510 795,545 135,545 135,512" fill="none" stroke="#e69138" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="465" y="538" text-anchor="middle" font-size="9.5" fill="#555">next request</text>
  <line x1="135" y1="545" x2="135" y2="590" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="143" y="575" text-anchor="start" font-size="9.5" fill="#555">all 8 done</text>
  <rect x="60" y="590" width="300" height="70" rx="8" fill="#e8f4fb" stroke="#3d85c6" stroke-width="1.5"/>
  <text x="210.0" y="615.0" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a4a73">PrintHttpFileComparison(items)</text>
  <text x="210.0" y="629.0" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a4a73">compares METHOD + URL lines</text>
  <text x="210.0" y="643.0" text-anchor="middle" font-size="9.5" fill="#555">reads bank-api.http (or its embedded copy)</text>
  <rect x="520" y="590" width="320" height="70" rx="10" fill="#f1f1f1" stroke="#777777" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="680" y="612" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#444">DISK (outside .NET)</text>
  <text x="680" y="632" text-anchor="middle" font-size="9.5" fill="#333">ApiTesting/bank-api.http</text>
  <text x="680" y="648" text-anchor="middle" font-size="9" fill="#333">the same 8 requests as plain text</text>
  <line x1="360" y1="610" x2="520" y2="610" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="440" y="602" text-anchor="middle" font-size="9.5" fill="#555">reads the file</text>
  <line x1="520" y1="644" x2="362" y2="644" stroke="#333" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="440" y="636" text-anchor="middle" font-size="9.5" fill="#555">text</text>
  <text x="218" y="682" font-size="9" font-style="italic" fill="#555">Console.WriteLine ×3: "Loaded…", "matches…", "…True"</text>
  <line x1="210" y1="660" x2="210" y2="700" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="210" y="722" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#990000">END</text>
  <line x1="210" y1="730" x2="210" y2="770" stroke="#333" stroke-width="2"/>
  <polygon points="210,730 210,748 240,739" fill="#cc0000"/>
  <text x="30" y="800" font-size="10.5" fill="#444"><tspan font-weight="bold">These files are for an API you run as its own program; this lesson has no such program, so it replays the same requests against the in-process copy.</tspan></text>
  <text x="30" y="818" font-size="10" font-style="italic" fill="#888">The replay prints "expected N, actual M" per request; it does not run Postman's JavaScript, it only reads the status number and the new account id from it.</text>
  <text x="30" y="836" font-size="10" font-style="italic" fill="#888">The collection follows Postman's v2.1 format, so Postman can import it; the .http file opens in VS Code (REST Client) or Visual Studio.</text>
  <text x="30" y="854" font-size="10" font-style="italic" fill="#888">Console.WriteLine in station 4 prints one "METHOD path expected, actual" line per request.</text>
</svg>
