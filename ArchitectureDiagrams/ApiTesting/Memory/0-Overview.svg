<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 470" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#555"/></marker>
  </defs>
  <rect x="0" y="0" width="1100" height="470" fill="#ffffff"/>
  <text x="550" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a237e">ApiTesting — Memory: Stack / Heap / Static (high level)</text>
  <text x="550" y="46" text-anchor="middle" font-size="12" fill="#666">Every method opens its own in-process API; replies come back over the network and are copied into small ApiReply objects on the Heap.</text>
  <g font-size="11" fill="#333"><rect x="150" y="60" width="14" height="14" rx="2" fill="#b6d7a8" stroke="#6aa84f"/><text x="170" y="71">Stack</text></g>
  <g font-size="11" fill="#333"><rect x="330" y="60" width="14" height="14" rx="2" fill="#f9cb9c" stroke="#e69138"/><text x="350" y="71">Heap</text></g>
  <g font-size="11" fill="#333"><rect x="510" y="60" width="14" height="14" rx="2" fill="#d5c9ea" stroke="#674ea7"/><text x="530" y="71">Static</text></g>
  <text x="230" y="98" text-anchor="middle" font-size="12" font-weight="bold" fill="#3f6b3f">STACK — pointers, ints and small structs</text>
  <text x="630" y="98" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a5a10">HEAP — the objects the pointers lead to</text>
  <text x="960" y="98" text-anchor="middle" font-size="12" font-weight="bold" fill="#3d2a6b">STATIC — nothing used</text>
  <rect x="40" y="112" width="380" height="262" rx="8" fill="#b6d7a8" stroke="#6aa84f" stroke-width="2"/>
  <text x="230" y="132" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#274e13">One slot per local, in each method's own frame</text>
  <rect x="56" y="144" width="348" height="38" rx="4" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1"/>
  <text x="66" y="161" font-size="10" font-weight="bold" fill="#1b3d1b">server, reply, document + JsonElement structs</text>
  <text x="66" y="175" font-size="8.5" fill="#3f6b3f">ExplainWhatIsOpenApi()</text>
  <rect x="56" y="188" width="348" height="38" rx="4" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1"/>
  <text x="66" y="205" font-size="10" font-weight="bold" fill="#1b3d1b">server, page, script, noRedirect, redirect</text>
  <text x="66" y="219" font-size="8.5" fill="#3f6b3f">ExplainSwaggerUi()</text>
  <rect x="56" y="232" width="348" height="38" rx="4" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1"/>
  <text x="66" y="249" font-size="10" font-weight="bold" fill="#1b3d1b">server, reply, document, deleted, deletedAgain, bad</text>
  <text x="66" y="263" font-size="8.5" fill="#3f6b3f">ExplainDocumentingEndpoints()</text>
  <rect x="56" y="276" width="348" height="38" rx="4" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1"/>
  <text x="66" y="293" font-size="10" font-weight="bold" fill="#1b3d1b">collection, item, actual, expected = 204</text>
  <text x="66" y="307" font-size="8.5" fill="#3f6b3f">ExplainPostmanAndHttpFiles()</text>
  <rect x="56" y="320" width="348" height="38" rx="4" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1"/>
  <text x="66" y="337" font-size="10" font-weight="bold" fill="#1b3d1b">server, client, passed = 5, failed = 1, 4 replies</text>
  <text x="66" y="351" font-size="8.5" fill="#3f6b3f">ExplainManualVsAutomatedTests()</text>
  <rect x="450" y="112" width="380" height="262" rx="8" fill="#f9cb9c" stroke="#e69138" stroke-width="1.5"/>
  <text x="640" y="132" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7f4e00">The real objects — this is where the data is</text>
  <rect x="466" y="144" width="348" height="62" rx="6" fill="#ffffff" stroke="#f0c07a" stroke-width="1"/>
  <text x="640" y="170" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#7f4e00">RunningServer + HttpClient</text>
  <text x="640" y="188" text-anchor="middle" font-size="8.5" fill="#a06a1f">the address and the client that sends requests</text>
  <rect x="466" y="216" width="348" height="62" rx="6" fill="#ffffff" stroke="#f0c07a" stroke-width="1"/>
  <text x="640" y="242" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#7f4e00">ApiReply: Status, Body, ContentType, Location</text>
  <text x="640" y="260" text-anchor="middle" font-size="8.5" fill="#a06a1f">one small object per reply (the Body text is a string)</text>
  <rect x="466" y="288" width="348" height="62" rx="6" fill="#ffffff" stroke="#f0c07a" stroke-width="1"/>
  <text x="640" y="314" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#7f4e00">JsonDocument</text>
  <text x="640" y="332" text-anchor="middle" font-size="8.5" fill="#a06a1f">the parsed copy of a JSON text (OpenAPI or Postman collection)</text>
  <rect x="860" y="112" width="200" height="262" rx="10" fill="#d5c9ea" stroke="#674ea7" stroke-width="1.5" stroke-dasharray="6 4" fill-opacity="0.25"/>
  <text x="960" y="180" text-anchor="middle" font-size="10" font-weight="bold" fill="#3d2a6b">Nothing here yet</text>
  <text x="960" y="208" text-anchor="middle" font-size="9.5" fill="#5b4a7a">No method of this lesson</text>
  <text x="960" y="224" text-anchor="middle" font-size="9.5" fill="#5b4a7a">declares a static member.</text>
  <rect x="450" y="388" width="610" height="50" rx="10" fill="#f1f1f1" stroke="#777777" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="755" y="408" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#444">OUTSIDE .NET — the network (loopback) and the disk</text>
  <text x="755" y="426" text-anchor="middle" font-size="9.5" fill="#333">request/reply bytes and the shipped .json / .http files; their text is copied into strings on the Heap</text>
  <text x="40" y="458" font-size="10.5" fill="#444"><tspan font-weight="bold">A reply is never the variable: </tspan>reply holds only a pointer; the Status and the Body text sit in the ApiReply and string objects it leads to.</text>
</svg>
