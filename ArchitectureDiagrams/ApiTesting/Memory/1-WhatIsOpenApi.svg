  <rect x="50" y="118" width="340" height="304" rx="8" fill="#b6d7a8" stroke="#6aa84f" stroke-width="2"/>
  <text x="220" y="136" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#274e13">ApiTestingDemo.ExplainWhatIsOpenApi() — ACTIVE</text>
  <rect x="62" y="146" width="316" height="26" rx="4" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1"/>
  <text x="70" y="163" font-size="10" fill="#1b3d1b">server → pointer  (RunningServer)</text>
  <rect x="62" y="176" width="316" height="26" rx="4" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1"/>
  <text x="70" y="193" font-size="10" fill="#1b3d1b">reply → pointer  (ApiReply)</text>
  <rect x="62" y="206" width="316" height="26" rx="4" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1"/>
  <text x="70" y="223" font-size="10" fill="#1b3d1b">document → pointer  (JsonDocument)</text>
  <rect x="62" y="236" width="316" height="26" rx="4" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1"/>
  <text x="70" y="253" font-size="10" fill="#1b3d1b">root = JsonElement (struct: a view into document)</text>
  <rect x="62" y="266" width="316" height="26" rx="4" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1"/>
  <text x="70" y="283" font-size="10" fill="#1b3d1b">operationCount = 4</text>
  <rect x="62" y="296" width="316" height="26" rx="4" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1"/>
  <text x="70" y="313" font-size="10" fill="#1b3d1b">path = JsonProperty (struct): "/api/accounts/{id}"</text>
  <rect x="62" y="326" width="316" height="26" rx="4" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1"/>
  <text x="70" y="343" font-size="10" fill="#1b3d1b">verb = JsonProperty (struct): "delete"</text>
  <rect x="62" y="356" width="316" height="26" rx="4" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1"/>
  <text x="70" y="373" font-size="10" fill="#1b3d1b">summary → pointer  (string)</text>
  <rect x="62" y="386" width="316" height="26" rx="4" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1"/>
  <text x="70" y="403" font-size="10" fill="#1b3d1b">s = JsonElement (out variable): empty, no summary</text>
  <rect x="50" y="432" width="340" height="50" rx="8" fill="#dcecdc" stroke="#6aa84f" stroke-width="1.5"/>
  <text x="220" y="452" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#4c6b4c">ApiTestingExample.Explain()</text>
  <text x="220" y="468" text-anchor="middle" font-size="9.5" fill="#6b8a6b">paused — waiting for the call above to return</text>
  <rect x="50" y="492" width="340" height="50" rx="8" fill="#dcecdc" stroke="#6aa84f" stroke-width="1.5"/>
  <text x="220" y="512" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#4c6b4c">Program.cs (Main)</text>
  <text x="220" y="528" text-anchor="middle" font-size="9.5" fill="#6b8a6b">paused — waiting for topic.Explain() to return</text>
  <rect x="460" y="120" width="300" height="96" rx="10" fill="#f9cb9c" stroke="#e69138" stroke-width="1.5"/>
  <text x="610.0" y="142" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7f4e00">RunningServer — server</text>
  <rect x="472" y="152" width="276" height="26" rx="4" fill="#fff3e6" stroke="#e69138" stroke-width="1"/>
  <text x="480" y="169" font-size="10" fill="#7f4e00">BaseAddress = "http://127.0.0.1:&lt;port&gt;"</text>
  <rect x="472" y="182" width="276" height="26" rx="4" fill="#fff3e6" stroke="#e69138" stroke-width="1"/>
  <text x="480" y="199" font-size="10" fill="#7f4e00">Client → pointer (HttpClient)</text>
  <rect x="820" y="120" width="290" height="82" rx="10" fill="#f9cb9c" stroke="#e69138" stroke-width="1.5"/>
  <text x="965.0" y="142" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7f4e00">HttpClient (server.Client)</text>
  <rect x="832" y="152" width="266" height="26" rx="4" fill="#fff3e6" stroke="#e69138" stroke-width="1"/>
  <text x="840" y="169" font-size="10" fill="#7f4e00">BaseAddress = the same address</text>
  <text x="834" y="193" font-size="8.5" font-style="italic" fill="#a06a1f">(internals not shown)</text>
  <polyline points="760,195 790,195 790,142 818,142" fill="none" stroke="#555" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="460" y="240" width="300" height="112" rx="10" fill="#f9cb9c" stroke="#e69138" stroke-width="1.5"/>
  <text x="610.0" y="262" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7f4e00">ApiReply — reply</text>
  <rect x="472" y="272" width="276" height="26" rx="4" fill="#fff3e6" stroke="#e69138" stroke-width="1"/>
  <text x="480" y="289" font-size="10" fill="#7f4e00">Status = 200</text>
  <rect x="472" y="302" width="276" height="26" rx="4" fill="#fff3e6" stroke="#e69138" stroke-width="1"/>
  <text x="480" y="319" font-size="10" fill="#7f4e00">Body → pointer (string)</text>
  <text x="474" y="343" font-size="8.5" font-style="italic" fill="#a06a1f">(ContentType and Location: strings, not drawn)</text>
  <rect x="820" y="300" width="300" height="30" rx="6" fill="#fff3e6" stroke="#e69138" stroke-width="1.5"/>
  <text x="970.0" y="319.0" text-anchor="middle" font-size="10" fill="#7f4e00">"{ "openapi": "3.0.4", … }"</text>
  <line x1="760" y1="315" x2="818" y2="315.0" stroke="#555" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="460" y="380" width="300" height="82" rx="10" fill="#f9cb9c" stroke="#e69138" stroke-width="1.5"/>
  <text x="610.0" y="402" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7f4e00">JsonDocument — document</text>
  <rect x="472" y="412" width="276" height="26" rx="4" fill="#fff3e6" stroke="#e69138" stroke-width="1"/>
  <text x="480" y="429" font-size="10" fill="#7f4e00">a parsed copy of reply.Body</text>
  <text x="474" y="453" font-size="8.5" font-style="italic" fill="#a06a1f">(.NET's internal storage, simplified)</text>
  <rect x="460" y="480" width="300" height="30" rx="6" fill="#fff3e6" stroke="#e69138" stroke-width="1.5"/>
  <text x="610.0" y="499.0" text-anchor="middle" font-size="10" fill="#7f4e00">"(no summary)"</text>
  <rect x="460" y="535" width="650" height="76" rx="10" fill="#f1f1f1" stroke="#777777" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="785.0" y="555" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#444444">OUTSIDE .NET — the network (loopback)</text>
  <text x="474" y="575" font-size="9.5" font-weight="bold" fill="#333333">request bytes going out:  GET /swagger/v1/swagger.json</text>
  <text x="474" y="591" font-size="9.5" fill="#333333">reply bytes coming back:  200 + the OpenAPI JSON text, copied into reply.Body</text>
  <polyline points="378,159 416,159 416,142 458,142" fill="none" stroke="#555" stroke-width="1.4" marker-end="url(#a)"/>
  <polyline points="378,189 437,189 437,262 458,262" fill="none" stroke="#555" stroke-width="1.4" marker-end="url(#a)"/>
  <polyline points="378,219 430,219 430,402 458,402" fill="none" stroke="#555" stroke-width="1.4" marker-end="url(#a)"/>
  <polyline points="378,369 423,369 423,495.0 458,495.0" fill="none" stroke="#555" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="1160" y="118" width="90" height="130" rx="10" fill="#d5c9ea" stroke="#674ea7" stroke-width="1.5" stroke-dasharray="6 4" fill-opacity="0.25"/>
  <text x="1205" y="150" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#3d2a6b">Nothing</text>
  <text x="1205" y="166" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#3d2a6b">here yet</text>
  <text x="40" y="635" font-size="10.5" fill="#444"><tspan font-weight="bold">The OpenAPI document is just text: reply.Body holds the JSON, and `document` is a parsed copy you can walk. </tspan>The bytes came over the network (outside .NET) and were copied into a string.</text>
  <text x="40" y="653" font-size="10" font-style="italic" fill="#888">JsonElement and JsonProperty are structs: small values that point into `document`'s storage, so they sit inline on the Stack. `using` will dispose `document` and `server` when the method ends.</text>
  <text x="40" y="671" font-size="10" font-style="italic" fill="#888">The server runs in this same process (hosted by WebLab) - its own objects are not drawn; the picture shows only what THIS method declares.</text>
</svg>
