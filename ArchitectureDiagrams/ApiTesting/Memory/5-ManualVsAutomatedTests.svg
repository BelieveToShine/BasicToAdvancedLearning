  <text x="1205" y="150" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#3d2a6b">Nothing</text>
  <text x="1205" y="166" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#3d2a6b">here yet</text>
  <text x="40" y="812" font-size="10.5" fill="#444"><tspan font-weight="bold">client and server.Client are two pointers to ONE HttpClient (red outline). </tspan>passed and failed are plain ints on the Stack; each Report(...) call added 1 to one of them through `ref`.</text>
  <text x="40" y="830" font-size="10" font-style="italic" fill="#888">Every check is the same shape: a request goes out over the network (outside .NET), a reply is copied into an ApiReply, and an == compares it with what we expected.</text>
  <text x="40" y="848" font-size="10" font-style="italic" fill="#888">The last check expected 200 on purpose; the server answered 404, so failed = 1.</text>
</svg>
