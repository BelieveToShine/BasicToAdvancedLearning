  <text x="834" y="406" font-size="9.5" font-weight="bold" fill="#333333">POST /api/accounts  -&gt;  201</text>
  <text x="834" y="422" font-size="9.5" font-weight="bold" fill="#333333">POST /api/accounts/1/deposit  -&gt;  200</text>
  <text x="834" y="438" font-size="9.5" font-weight="bold" fill="#333333">GET /api/accounts/999  -&gt;  404</text>
  <text x="834" y="454" font-size="9.5" fill="#333333">Each reply is copied into an ApiReply.</text>
