  <text x="834" y="328" font-size="9.5" font-weight="bold" fill="#333333">POST /api/accounts (accountType "Gold")  -&gt;  400</text>
  <text x="834" y="344" font-size="9.5" fill="#333333">Each reply is copied into an ApiReply.</text>
