  <text x="40" y="836" font-size="10.5" fill="#444"><tspan font-weight="bold">The JSON (reply, document) says what the author DESCRIBED; the three small ApiReply objects hold what the server really did. </tspan>They can differ: the JSON lists only 200 for DELETE.</text>
  <text x="40" y="854" font-size="10" font-style="italic" fill="#888">The loop variables route, verb and codes lived only inside their foreach blocks, so no slot is left for them. paths, getOne and createSchema are structs pointing into `document`.</text>
  <text x="40" y="872" font-size="10" font-style="italic" fill="#888">The account list the DELETE changed lives inside the server (same process) and is not a variable of this method, so it is not drawn.</text>
