  <text x="1205" y="150" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#3d2a6b">Nothing</text>
  <text x="1205" y="166" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#3d2a6b">here yet</text>
  <text x="40" y="754" font-size="10.5" fill="#444"><tspan font-weight="bold">Three requests, three ApiReply objects. </tspan>The HTML page lists no endpoints; index.js names the OpenAPI document, which the browser fetches.</text>
  <text x="40" y="772" font-size="10" font-style="italic" fill="#888">noRedirect is a second HttpClient built to NOT follow redirects, so the 301 can be seen. It reuses the server address, not the server.</text>
  <text x="40" y="790" font-size="10" font-style="italic" fill="#888">Clicking "Try it out" happens in a browser, not in this program, so no variable here belongs to it.</text>
</svg>
