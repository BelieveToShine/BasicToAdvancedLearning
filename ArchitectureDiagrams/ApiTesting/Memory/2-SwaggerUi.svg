  <text x="834" y="296" font-size="9.5" font-weight="bold" fill="#333333">GET /swagger/index.js  -&gt;  200</text>
  <text x="834" y="312" font-size="9.5" font-weight="bold" fill="#333333">GET /swagger  -&gt;  301 (not followed)</text>
  <text x="834" y="328" font-size="9.5" fill="#333333">Each reply is copied into an ApiReply.</text>
  <polyline points="378,159 416,159 416,142 458,142" fill="none" stroke="#555" stroke-width="1.4" marker-end="url(#a)"/>
  <polyline points="378,189 444,189 444,262 458,262" fill="none" stroke="#555" stroke-width="1.4" marker-end="url(#a)"/>
