<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 752" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#333"/></marker>
  </defs>
  <rect x="0" y="0" width="900" height="752" fill="#ffffff"/>
  <text x="450.0" y="20" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a237e">Model binding — Sub-level Flow: three envelopes, one set of parameters</text>
  <text x="450.0" y="38" text-anchor="middle" font-size="11" fill="#666">The binder reads the route, the query string and the JSON body and fills the action's parameters; bad input stops at the door.</text>
  <text x="40" y="48" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#274e13">START</text>
  <line x1="40" y1="52" x2="40" y2="90" stroke="#333" stroke-width="2"/>
  <polygon points="40,52 40,70 70,61" fill="#38761d"/>
  <rect x="90" y="52" width="560" height="44" rx="8" fill="#f1f1f1" stroke="#777777" stroke-width="1.5"/>
  <text x="370.0" y="70" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#444444">ExplainModelBinding() starts a server with BindingController and PlainBindingController</text>
  <text x="370.0" y="86" text-anchor="middle" font-size="9.5" fill="#333">then sends eight requests, one Call() each.</text>
  <text x="160.0" y="138" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1a237e">Request</text>
  <text x="480.0" y="138" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1a237e">The model binder</text>
  <text x="770.0" y="138" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1a237e">Answer</text>
  <rect x="20" y="150" width="280" height="44" rx="8" fill="#e8f4fb" stroke="#3d85c6" stroke-width="1.5"/>
  <text x="160.0" y="168" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#1a4a73">GET /api/accounts/3/statement?last=2</text>
  <rect x="340" y="150" width="280" height="44" rx="8" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1.5"/>
  <text x="480.0" y="168" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#274e13">id = 3 from the ROUTE</text>
  <text x="480.0" y="184" text-anchor="middle" font-size="9.5" fill="#333">last = 2 from the QUERY STRING</text>
  <rect x="660" y="150" width="220" height="44" rx="8" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1.5"/>
  <text x="770.0" y="168" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#274e13">Statement(3, 2) runs</text>
  <text x="770.0" y="184" text-anchor="middle" font-size="9.5" fill="#333">200  "…last 2 transactions"</text>
  <line x1="300" y1="172.0" x2="340" y2="172.0" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="620" y1="172.0" x2="660" y2="172.0" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="20" y="208" width="280" height="44" rx="8" fill="#e8f4fb" stroke="#3d85c6" stroke-width="1.5"/>
  <text x="160.0" y="226" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#1a4a73">GET /api/accounts/3/statement</text>
  <rect x="340" y="208" width="280" height="44" rx="8" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1.5"/>
  <text x="480.0" y="226" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#274e13">id = 3 from the route</text>
  <text x="480.0" y="242" text-anchor="middle" font-size="9.5" fill="#333">no ?last: the default 5 is used</text>
  <rect x="660" y="208" width="220" height="44" rx="8" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1.5"/>
  <text x="770.0" y="226" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#274e13">Statement(3, 5) runs</text>
  <text x="770.0" y="242" text-anchor="middle" font-size="9.5" fill="#333">200  "…last 5 transactions"</text>
  <line x1="300" y1="230.0" x2="340" y2="230.0" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="620" y1="230.0" x2="660" y2="230.0" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="20" y="266" width="280" height="44" rx="8" fill="#e8f4fb" stroke="#3d85c6" stroke-width="1.5"/>
  <text x="160.0" y="284" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#1a4a73">POST /api/accounts/3/deposits</text>
  <text x="160.0" y="300" text-anchor="middle" font-size="9.5" fill="#333">{"amount": 250.50}</text>
  <rect x="340" y="266" width="280" height="44" rx="8" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1.5"/>
  <text x="480.0" y="284" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#274e13">id = 3 from the route</text>
  <text x="480.0" y="300" text-anchor="middle" font-size="9.5" fill="#333">JSON body → DepositRequest.Amount</text>
  <rect x="660" y="266" width="220" height="44" rx="8" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1.5"/>
  <text x="770.0" y="284" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#274e13">Deposit(3, request) runs</text>
  <text x="770.0" y="300" text-anchor="middle" font-size="9.5" fill="#333">200  "deposit 250.50 …"</text>
  <line x1="300" y1="288.0" x2="340" y2="288.0" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="620" y1="288.0" x2="660" y2="288.0" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="20" y="324" width="280" height="44" rx="8" fill="#e8f4fb" stroke="#3d85c6" stroke-width="1.5"/>
  <text x="160.0" y="342" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#1a4a73">GET …/3/statement?last=abc</text>
  <rect x="340" y="324" width="280" height="44" rx="8" fill="#fde8e8" stroke="#cc0000" stroke-width="1.5"/>
  <text x="480.0" y="342" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#990000">"abc" cannot become an int</text>
  <text x="480.0" y="358" text-anchor="middle" font-size="9.5" fill="#333">[ApiController] stops the request</text>
  <rect x="660" y="324" width="220" height="44" rx="8" fill="#fde8e8" stroke="#cc0000" stroke-width="1.5"/>
  <text x="770.0" y="342" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#990000">action never runs</text>
  <text x="770.0" y="358" text-anchor="middle" font-size="9.5" fill="#333">400 ProblemDetails with errors</text>
  <line x1="300" y1="346.0" x2="340" y2="346.0" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="620" y1="346.0" x2="660" y2="346.0" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="20" y="382" width="280" height="44" rx="8" fill="#e8f4fb" stroke="#3d85c6" stroke-width="1.5"/>
  <text x="160.0" y="400" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#1a4a73">POST …/3/deposits</text>
  <text x="160.0" y="416" text-anchor="middle" font-size="9.5" fill="#333">body: {"amount":   (broken JSON)</text>
  <rect x="340" y="382" width="280" height="44" rx="8" fill="#fde8e8" stroke="#cc0000" stroke-width="1.5"/>
  <text x="480.0" y="400" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#990000">the body cannot be read as JSON</text>
  <text x="480.0" y="416" text-anchor="middle" font-size="9.5" fill="#333">[ApiController] stops the request</text>
  <rect x="660" y="382" width="220" height="44" rx="8" fill="#fde8e8" stroke="#cc0000" stroke-width="1.5"/>
  <text x="770.0" y="400" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#990000">action never runs</text>
  <text x="770.0" y="416" text-anchor="middle" font-size="9.5" fill="#333">400 ProblemDetails with errors</text>
  <line x1="300" y1="404.0" x2="340" y2="404.0" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="620" y1="404.0" x2="660" y2="404.0" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="20" y="440" width="280" height="44" rx="8" fill="#e8f4fb" stroke="#3d85c6" stroke-width="1.5"/>
  <text x="160.0" y="458" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#1a4a73">POST …/3/deposits</text>
  <text x="160.0" y="474" text-anchor="middle" font-size="9.5" fill="#333">{"amount": -5}</text>
  <rect x="340" y="440" width="280" height="44" rx="8" fill="#fde8e8" stroke="#cc0000" stroke-width="1.5"/>
  <text x="480.0" y="458" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#990000">JSON is fine, but the [Range]</text>
  <text x="480.0" y="474" text-anchor="middle" font-size="9.5" fill="#333">rule (0.01 to 1000000) is broken</text>
  <rect x="660" y="440" width="220" height="44" rx="8" fill="#fde8e8" stroke="#cc0000" stroke-width="1.5"/>
  <text x="770.0" y="458" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#990000">action never runs</text>
  <text x="770.0" y="474" text-anchor="middle" font-size="9.5" fill="#333">400 ProblemDetails with errors</text>
  <line x1="300" y1="462.0" x2="340" y2="462.0" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="620" y1="462.0" x2="660" y2="462.0" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="20" y="498" width="280" height="44" rx="8" fill="#e8f4fb" stroke="#3d85c6" stroke-width="1.5"/>
  <text x="160.0" y="516" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#1a4a73">GET /api/plain/3/statement?last=abc</text>
  <text x="160.0" y="532" text-anchor="middle" font-size="9.5" fill="#333">(no [ApiController])</text>
  <rect x="340" y="498" width="280" height="44" rx="8" fill="#fffbe8" stroke="#f1c232" stroke-width="1.5"/>
  <text x="480.0" y="516" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#7f6000">"abc" cannot become an int,</text>
  <text x="480.0" y="532" text-anchor="middle" font-size="9.5" fill="#333">but nothing rejects it: default 5</text>
  <rect x="660" y="498" width="220" height="44" rx="8" fill="#fffbe8" stroke="#f1c232" stroke-width="1.5"/>
  <text x="770.0" y="516" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#7f6000">Statement(3, 5) runs</text>
  <text x="770.0" y="532" text-anchor="middle" font-size="9.5" fill="#333">200  "…last 5 transactions"</text>
  <line x1="300" y1="520.0" x2="340" y2="520.0" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="620" y1="520.0" x2="660" y2="520.0" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="20" y="556" width="280" height="44" rx="8" fill="#e8f4fb" stroke="#3d85c6" stroke-width="1.5"/>
  <text x="160.0" y="574" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#1a4a73">POST /api/plain/3/deposits</text>
  <text x="160.0" y="590" text-anchor="middle" font-size="9.5" fill="#333">{"amount": 250.50}  (no [ApiController])</text>
  <rect x="340" y="556" width="280" height="44" rx="8" fill="#fffbe8" stroke="#f1c232" stroke-width="1.5"/>
  <text x="480.0" y="574" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#7f6000">the body is not read for a</text>
  <text x="480.0" y="590" text-anchor="middle" font-size="9.5" fill="#333">class-type parameter: Amount stays 0</text>
  <rect x="660" y="556" width="220" height="44" rx="8" fill="#fffbe8" stroke="#f1c232" stroke-width="1.5"/>
  <text x="770.0" y="574" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#7f6000">Deposit(3, request) runs</text>
  <text x="770.0" y="590" text-anchor="middle" font-size="9.5" fill="#333">200  "deposit 0 into account 3"</text>
  <line x1="300" y1="578.0" x2="340" y2="578.0" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="620" y1="578.0" x2="660" y2="578.0" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="40" y="620" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#990000">END</text>
  <line x1="40" y1="628" x2="40" y2="668" stroke="#333" stroke-width="2"/>
  <polygon points="40,628 40,646 70,637" fill="#cc0000"/>
  <text x="30" y="686" font-size="10.5" fill="#444"><tspan font-weight="bold">The attribute is the safety net:</tspan> lanes 4-6 are stopped by [ApiController]; lanes 7-8 show the same kind of input without it.</text>
  <text x="30" y="704" font-size="10" font-style="italic" fill="#888">Console.WriteLine prints one line per request (eight lines). The 400 bodies are summarised: key names, wording and trace id inside "errors" can differ between ASP.NET Core versions.</text>
  <text x="30" y="722" font-size="10" font-style="italic" fill="#888">Each method also opens with PrintHeading(): two Console.WriteLine calls (a blank line and the title).</text>
</svg>
