<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 636" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#333"/></marker>
  </defs>
  <rect x="0" y="0" width="900" height="636" fill="#ffffff"/>
  <text x="450.0" y="20" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a237e">Routing — Sub-level Flow: sorting lanes at the post office</text>
  <text x="450.0" y="38" text-anchor="middle" font-size="11" fill="#666">Each request takes its own lane: the router tries the route table, and the letter lands in an action bin — or in the 404 bin.</text>
  <text x="40" y="48" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#274e13">START</text>
  <line x1="40" y1="52" x2="40" y2="90" stroke="#333" stroke-width="2"/>
  <polygon points="40,52 40,70 70,61" fill="#38761d"/>
  <rect x="90" y="52" width="560" height="44" rx="8" fill="#f1f1f1" stroke="#777777" stroke-width="1.5"/>
  <text x="370.0" y="70" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#444444">ExplainRouting() starts a server with RoutedAccountsController</text>
  <text x="370.0" y="86" text-anchor="middle" font-size="9.5" fill="#333">then sends the six requests below, one Call() each (lane 6 uses the helper ShowRouteClash()).</text>
  <text x="160.0" y="138" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1a237e">Request</text>
  <text x="480.0" y="138" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1a237e">The router checks the route table</text>
  <text x="770.0" y="138" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1a237e">Answer</text>
  <rect x="20" y="150" width="280" height="44" rx="8" fill="#e8f4fb" stroke="#3d85c6" stroke-width="1.5"/>
  <text x="160.0" y="168" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#1a4a73">GET /api/accounts/7</text>
  <rect x="340" y="150" width="280" height="44" rx="8" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1.5"/>
  <text x="480.0" y="168" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#274e13">matches api/accounts/{id:int:min(1)}</text>
  <text x="480.0" y="184" text-anchor="middle" font-size="9.5" fill="#333">7 is an int and at least 1: id = 7</text>
  <rect x="660" y="150" width="220" height="44" rx="8" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1.5"/>
  <text x="770.0" y="168" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#274e13">GetById(7) runs</text>
  <text x="770.0" y="184" text-anchor="middle" font-size="9.5" fill="#333">200  text: account 7</text>
  <line x1="300" y1="172.0" x2="340" y2="172.0" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="620" y1="172.0" x2="660" y2="172.0" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="20" y="208" width="280" height="44" rx="8" fill="#e8f4fb" stroke="#3d85c6" stroke-width="1.5"/>
  <text x="160.0" y="226" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#1a4a73">GET /api/accounts/by-number/AC-1001</text>
  <rect x="340" y="208" width="280" height="44" rx="8" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1.5"/>
  <text x="480.0" y="226" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#274e13">matches by-number/{number}</text>
  <text x="480.0" y="242" text-anchor="middle" font-size="9.5" fill="#333">number = "AC-1001" (no constraint)</text>
  <rect x="660" y="208" width="220" height="44" rx="8" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1.5"/>
  <text x="770.0" y="226" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#274e13">GetByNumber runs</text>
  <text x="770.0" y="242" text-anchor="middle" font-size="9.5" fill="#333">200  text: account number AC-1001</text>
  <line x1="300" y1="230.0" x2="340" y2="230.0" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="620" y1="230.0" x2="660" y2="230.0" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="20" y="266" width="280" height="44" rx="8" fill="#e8f4fb" stroke="#3d85c6" stroke-width="1.5"/>
  <text x="160.0" y="284" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#1a4a73">GET /api/accounts/abc</text>
  <rect x="340" y="266" width="280" height="44" rx="8" fill="#fde8e8" stroke="#cc0000" stroke-width="1.5"/>
  <text x="480.0" y="284" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#990000">{id:int:min(1)}: "abc" is not an int</text>
  <text x="480.0" y="300" text-anchor="middle" font-size="9.5" fill="#333">by-number/{number}: no "by-number" word</text>
  <rect x="660" y="266" width="220" height="44" rx="8" fill="#fde8e8" stroke="#cc0000" stroke-width="1.5"/>
  <text x="770.0" y="284" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#990000">no route matches</text>
  <text x="770.0" y="300" text-anchor="middle" font-size="9.5" fill="#333">404, empty body</text>
  <line x1="300" y1="288.0" x2="340" y2="288.0" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="620" y1="288.0" x2="660" y2="288.0" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="20" y="324" width="280" height="44" rx="8" fill="#e8f4fb" stroke="#3d85c6" stroke-width="1.5"/>
  <text x="160.0" y="342" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#1a4a73">GET /api/accounts/0</text>
  <rect x="340" y="324" width="280" height="44" rx="8" fill="#fde8e8" stroke="#cc0000" stroke-width="1.5"/>
  <text x="480.0" y="342" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#990000">{id:int:min(1)}: 0 is below the minimum</text>
  <text x="480.0" y="358" text-anchor="middle" font-size="9.5" fill="#333">no other route fits</text>
  <rect x="660" y="324" width="220" height="44" rx="8" fill="#fde8e8" stroke="#cc0000" stroke-width="1.5"/>
  <text x="770.0" y="342" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#990000">no route matches</text>
  <text x="770.0" y="358" text-anchor="middle" font-size="9.5" fill="#333">404, empty body</text>
  <line x1="300" y1="346.0" x2="340" y2="346.0" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="620" y1="346.0" x2="660" y2="346.0" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="20" y="382" width="280" height="44" rx="8" fill="#e8f4fb" stroke="#3d85c6" stroke-width="1.5"/>
  <text x="160.0" y="400" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#1a4a73">GET /api/customers</text>
  <rect x="340" y="382" width="280" height="44" rx="8" fill="#fde8e8" stroke="#cc0000" stroke-width="1.5"/>
  <text x="480.0" y="400" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#990000">no route starts with api/customers</text>
  <rect x="660" y="382" width="220" height="44" rx="8" fill="#fde8e8" stroke="#cc0000" stroke-width="1.5"/>
  <text x="770.0" y="400" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#990000">no route matches</text>
  <text x="770.0" y="416" text-anchor="middle" font-size="9.5" fill="#333">404, empty body</text>
  <line x1="300" y1="404.0" x2="340" y2="404.0" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="620" y1="404.0" x2="660" y2="404.0" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="20" y="440" width="280" height="44" rx="8" fill="#e8f4fb" stroke="#3d85c6" stroke-width="1.5"/>
  <text x="160.0" y="458" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#1a4a73">GET /api/clash  (a second server)</text>
  <rect x="340" y="440" width="280" height="44" rx="8" fill="#fdebd9" stroke="#e69138" stroke-width="1.5"/>
  <text x="480.0" y="458" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#8a5a10">ClashController: First() and Second()</text>
  <text x="480.0" y="474" text-anchor="middle" font-size="9.5" fill="#333">have the SAME route and method</text>
  <rect x="660" y="440" width="220" height="44" rx="8" fill="#fdebd9" stroke="#e69138" stroke-width="1.5"/>
  <text x="770.0" y="458" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#8a5a10">cannot choose between two</text>
  <text x="770.0" y="474" text-anchor="middle" font-size="9.5" fill="#333">500  AmbiguousMatchException</text>
  <line x1="300" y1="462.0" x2="340" y2="462.0" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="620" y1="462.0" x2="660" y2="462.0" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="40" y="504" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#990000">END</text>
  <line x1="40" y1="512" x2="40" y2="552" stroke="#333" stroke-width="2"/>
  <polygon points="40,512 40,530 70,521" fill="#cc0000"/>
  <text x="30" y="570" font-size="10.5" fill="#444"><tspan font-weight="bold">One URL + method, one action:</tspan> lanes 1-2 find exactly one; lanes 3-5 find none (404); lane 6 finds two (error).</text>
  <text x="30" y="588" font-size="10" font-style="italic" fill="#888">Console.WriteLine prints one line per request (six lines); the 500 line shows only the exception's type name. </text>
  <text x="30" y="606" font-size="10" font-style="italic" fill="#888">Each method also opens with PrintHeading(): two Console.WriteLine calls (a blank line and the title).</text>
</svg>
