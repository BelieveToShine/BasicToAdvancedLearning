<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 694" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#333"/></marker>
  </defs>
  <rect x="0" y="0" width="900" height="694" fill="#ffffff"/>
  <text x="450.0" y="20" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a237e">Service lifetimes — Sub-level Flow: three kinds of lending</text>
  <text x="450.0" y="38" text-anchor="middle" font-size="11" fill="#666">Singleton = one statue in the square; Scoped = one tray per visit; Transient = a fresh paper cup every time someone asks.</text>
  <text x="450" y="48" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#274e13">START</text>
  <line x1="450" y1="52" x2="450" y2="90" stroke="#333" stroke-width="2"/>
  <polygon points="450,52 450,70 480,61" fill="#38761d"/>
  <line x1="450" y1="90" x2="450" y2="98" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="120" y="100" width="660" height="76" rx="8" fill="#fffbe8" stroke="#f1c232" stroke-width="1.5"/>
  <text x="450.0" y="118" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#7f6000">Probe.ResetCounter();  then register the services</text>
  <text x="450.0" y="134" text-anchor="middle" font-size="9.5" fill="#333">AddSingleton&lt;SingletonProbe&gt;()      AddScoped&lt;ScopedProbe&gt;()</text>
  <text x="450.0" y="150" text-anchor="middle" font-size="9.5" fill="#333">AddTransient&lt;TransientProbe&gt;()      AddTransient&lt;ProbeReporter&gt;()</text>
  <text x="450.0" y="166" text-anchor="middle" font-size="9.5" fill="#333">both the controller and the ProbeReporter ask for all three probes</text>
  <rect x="40" y="226" width="380" height="44" rx="8" fill="#e8f4fb" stroke="#3d85c6" stroke-width="1.5"/>
  <text x="230.0" y="244" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#1a4a73">Request 1:  GET /api/lifetimes</text>
  <text x="230.0" y="260" text-anchor="middle" font-size="9.5" fill="#333">the first time anyone asks</text>
  <rect x="480" y="226" width="380" height="44" rx="8" fill="#e8f4fb" stroke="#3d85c6" stroke-width="1.5"/>
  <text x="670.0" y="244" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#1a4a73">Request 2:  GET /api/lifetimes</text>
  <text x="670.0" y="260" text-anchor="middle" font-size="9.5" fill="#333">a new request, same server</text>
  <line x1="230.0" y1="176" x2="230.0" y2="226" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="420" y1="248.0" x2="480" y2="248.0" stroke="#333" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="450" y="240.0" text-anchor="middle" font-size="9" font-style="italic" fill="#555">then</text>
  <line x1="230.0" y1="270" x2="230.0" y2="300" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="40" y="300" width="380" height="44" rx="8" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1.5"/>
  <text x="230.0" y="318" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#274e13">SingletonProbe  #1</text>
  <text x="230.0" y="334" text-anchor="middle" font-size="9.5" fill="#333">created now, for the first time</text>
  <rect x="40" y="358" width="380" height="44" rx="8" fill="#fffbe8" stroke="#f1c232" stroke-width="1.5"/>
  <text x="230.0" y="376" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#7f6000">ScopedProbe  #2</text>
  <text x="230.0" y="392" text-anchor="middle" font-size="9.5" fill="#333">made for this request; controller AND reporter share it</text>
  <rect x="40" y="416" width="380" height="44" rx="8" fill="#fdebd9" stroke="#e69138" stroke-width="1.5"/>
  <text x="230.0" y="434" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#8a5a10">TransientProbe in the controller  #3</text>
  <text x="230.0" y="450" text-anchor="middle" font-size="9.5" fill="#333">a fresh one for this asker</text>
  <rect x="40" y="474" width="380" height="44" rx="8" fill="#fdebd9" stroke="#e69138" stroke-width="1.5"/>
  <text x="230.0" y="492" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#8a5a10">TransientProbe in the reporter  #4</text>
  <text x="230.0" y="508" text-anchor="middle" font-size="9.5" fill="#333">another fresh one: a different object</text>
  <line x1="670.0" y1="270" x2="670.0" y2="300" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="480" y="300" width="380" height="44" rx="8" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1.5"/>
  <text x="670.0" y="318" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#274e13">SingletonProbe  #1</text>
  <text x="670.0" y="334" text-anchor="middle" font-size="9.5" fill="#333">the SAME object as in request 1</text>
  <rect x="480" y="358" width="380" height="44" rx="8" fill="#fffbe8" stroke="#f1c232" stroke-width="1.5"/>
  <text x="670.0" y="376" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#7f6000">ScopedProbe  #5</text>
  <text x="670.0" y="392" text-anchor="middle" font-size="9.5" fill="#333">new for this request; controller and reporter share it</text>
  <rect x="480" y="416" width="380" height="44" rx="8" fill="#fdebd9" stroke="#e69138" stroke-width="1.5"/>
  <text x="670.0" y="434" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#8a5a10">TransientProbe in the controller  #6</text>
  <text x="670.0" y="450" text-anchor="middle" font-size="9.5" fill="#333">fresh again</text>
  <rect x="480" y="474" width="380" height="44" rx="8" fill="#fdebd9" stroke="#e69138" stroke-width="1.5"/>
  <text x="670.0" y="492" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#8a5a10">TransientProbe in the reporter  #7</text>
  <text x="670.0" y="508" text-anchor="middle" font-size="9.5" fill="#333">fresh again, different from #6</text>
  <line x1="670.0" y1="518" x2="670.0" y2="552" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="670.0" y="566" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#990000">END</text>
  <line x1="670.0" y1="574" x2="670.0" y2="614" stroke="#333" stroke-width="2"/>
  <polygon points="670.0,574 670.0,592 700.0,583" fill="#cc0000"/>
  <text x="30" y="638" font-size="10.5" fill="#444"><tspan font-weight="bold">Read the numbers:</tspan> #1 repeats (Singleton); #2/#2 and #5/#5 repeat inside a request (Scoped); #3/#4 and #6/#7 never repeat (Transient).</text>
  <text x="30" y="656" font-size="10" font-style="italic" fill="#888">Console.WriteLine prints one line per request: "controller got: … | reporter got: …". The numbers come from one shared counter, so they show creation order.</text>
  <text x="30" y="674" font-size="10" font-style="italic" fill="#888">Each method also opens with PrintHeading(): two Console.WriteLine calls (a blank line and the title).</text>
</svg>
