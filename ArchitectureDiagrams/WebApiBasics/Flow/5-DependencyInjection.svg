<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 674" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#333"/></marker>
  </defs>
  <rect x="0" y="0" width="900" height="674" fill="#ffffff"/>
  <text x="450.0" y="20" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a237e">Dependency injection — Sub-level Flow: the order desk</text>
  <text x="450.0" y="38" text-anchor="middle" font-size="11" fill="#666">The controller only says WHAT it needs (an IAccountStore); the container decides what to hand over — and how often to make a new one.</text>
  <text x="240" y="48" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#274e13">START</text>
  <line x1="240" y1="52" x2="240" y2="90" stroke="#333" stroke-width="2"/>
  <polygon points="240,52 240,70 270,61" fill="#38761d"/>
  <line x1="240" y1="90" x2="240" y2="98" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="40" y="100" width="400" height="60" rx="8" fill="#fffbe8" stroke="#f1c232" stroke-width="1.5"/>
  <text x="240.0" y="118" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#7f6000">builder.Services.AddSingleton&lt;</text>
  <text x="240.0" y="134" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#7f6000">IAccountStore, InMemoryAccountStore&gt;()</text>
  <text x="240.0" y="150" text-anchor="middle" font-size="9.5" fill="#333">one store for the whole life of the app</text>
  <rect x="480" y="100" width="380" height="60" rx="8" fill="#fffbe8" stroke="#f1c232" stroke-width="1.5"/>
  <text x="670.0" y="118" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#7f6000">ShowScopedStore():  AddScoped&lt;</text>
  <text x="670.0" y="134" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#7f6000">IAccountStore, InMemoryAccountStore&gt;()</text>
  <text x="670.0" y="150" text-anchor="middle" font-size="9.5" fill="#333">one store per request</text>
  <line x1="440" y1="130.0" x2="480" y2="130.0" stroke="#333" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="460" y="122.0" text-anchor="middle" font-size="9" font-style="italic" fill="#555">then</text>
  <text x="450" y="184" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a237e">GET /api/accounts</text>
  <line x1="240.0" y1="160" x2="240.0" y2="190" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="40" y="190" width="400" height="76" rx="8" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1.5"/>
  <text x="240.0" y="208" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#274e13">container makes the store, then the controller</text>
  <text x="240.0" y="224" text-anchor="middle" font-size="9.5" fill="#333">"[server] a new InMemoryAccountStore…"</text>
  <text x="240.0" y="240" text-anchor="middle" font-size="9.5" fill="#333">"[server] a new StoreAccountsController…"</text>
  <text x="240.0" y="256" text-anchor="middle" font-size="9.5" fill="#333">→ 200, 2 accounts</text>
  <line x1="670.0" y1="160" x2="670.0" y2="190" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="480" y="190" width="380" height="76" rx="8" fill="#fdebd9" stroke="#e69138" stroke-width="1.5"/>
  <text x="670.0" y="208" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#8a5a10">container makes a store AND a controller</text>
  <text x="670.0" y="224" text-anchor="middle" font-size="9.5" fill="#333">"[server] a new InMemoryAccountStore…"</text>
  <text x="670.0" y="240" text-anchor="middle" font-size="9.5" fill="#333">"[server] a new StoreAccountsController…"</text>
  <text x="670.0" y="256" text-anchor="middle" font-size="9.5" fill="#333">→ 200, 2 accounts</text>
  <text x="450" y="300" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a237e">POST /api/accounts</text>
  <line x1="240.0" y1="266" x2="240.0" y2="306" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="40" y="306" width="400" height="76" rx="8" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1.5"/>
  <text x="240.0" y="324" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#274e13">a new controller, the SAME store</text>
  <text x="240.0" y="340" text-anchor="middle" font-size="9.5" fill="#333">"[server] a new StoreAccountsController…"</text>
  <text x="240.0" y="356" text-anchor="middle" font-size="9.5" fill="#333">only the controller line: no new store</text>
  <text x="240.0" y="372" text-anchor="middle" font-size="9.5" fill="#333">→ 201 Created, store now holds 3</text>
  <line x1="670.0" y1="266" x2="670.0" y2="306" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="480" y="306" width="380" height="76" rx="8" fill="#fdebd9" stroke="#e69138" stroke-width="1.5"/>
  <text x="670.0" y="324" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#8a5a10">a new store AND a new controller</text>
  <text x="670.0" y="340" text-anchor="middle" font-size="9.5" fill="#333">"[server] a new InMemoryAccountStore…"</text>
  <text x="670.0" y="356" text-anchor="middle" font-size="9.5" fill="#333">"[server] a new StoreAccountsController…"</text>
  <text x="670.0" y="372" text-anchor="middle" font-size="9.5" fill="#333">→ 201 Created, but only for this request</text>
  <text x="450" y="416" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a237e">GET /api/accounts</text>
  <line x1="240.0" y1="382" x2="240.0" y2="422" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="40" y="422" width="400" height="76" rx="8" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1.5"/>
  <text x="240.0" y="440" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#274e13">a new controller, the SAME store</text>
  <text x="240.0" y="456" text-anchor="middle" font-size="9.5" fill="#333">"[server] a new StoreAccountsController…"</text>
  <text x="240.0" y="472" text-anchor="middle" font-size="9.5" fill="#333">the store still has the new account</text>
  <text x="240.0" y="488" text-anchor="middle" font-size="9.5" fill="#333">→ 200, 3 accounts</text>
  <line x1="670.0" y1="382" x2="670.0" y2="422" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="480" y="422" width="380" height="76" rx="8" fill="#fdebd9" stroke="#e69138" stroke-width="1.5"/>
  <text x="670.0" y="440" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#8a5a10">a new store AND a new controller</text>
  <text x="670.0" y="456" text-anchor="middle" font-size="9.5" fill="#333">two "[server] a new …" lines again</text>
  <text x="670.0" y="472" text-anchor="middle" font-size="9.5" fill="#333">the new store has only the 2 starting accounts</text>
  <text x="670.0" y="488" text-anchor="middle" font-size="9.5" fill="#333">→ 200, 2 accounts (the POST is lost)</text>
  <line x1="240.0" y1="498" x2="240.0" y2="526" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="40" y="528" width="400" height="44" rx="8" fill="#f1f1f1" stroke="#777777" stroke-width="1.5"/>
  <text x="240.0" y="546" text-anchor="middle" font-size="9.5" fill="#333">then ExplainDependencyInjection() calls ShowScopedStore()</text>
  <text x="240.0" y="562" text-anchor="middle" font-size="9.5" fill="#333">(the right-hand column)</text>
  <line x1="670.0" y1="498" x2="670.0" y2="526" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="670.0" y="540" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#990000">END</text>
  <line x1="670.0" y1="548" x2="670.0" y2="588" stroke="#333" stroke-width="2"/>
  <polygon points="670.0,548 670.0,566 700.0,557" fill="#cc0000"/>
  <text x="30" y="618" font-size="10.5" fill="#444"><tspan font-weight="bold">Same controller, same code, different registration:</tspan> only the lifetime changed, so the data survives (Singleton) or vanishes (Scoped).</text>
  <text x="30" y="636" font-size="10" font-style="italic" fill="#888">The "[server]" lines are Console.WriteLine calls inside the constructors, so they show WHEN the container creates each object. Call() prints one line per request.</text>
  <text x="30" y="654" font-size="10" font-style="italic" fill="#888">Also printed: "Registered with AddSingleton:" and "Registered with AddScoped (one store per request):" (two Console.WriteLine calls). Each method also opens with a heading.</text>
</svg>
