  <line x1="820" y1="645" x2="510" y2="645" stroke="#333" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <rect x="816" y="685" width="8" height="56" rx="0" fill="#fde8e8" stroke="#cc0000" stroke-width="1"/>
  <text x="665" y="677" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#123">ExplainServiceLifetimes()</text>
  <line x1="510" y1="685" x2="820" y2="685" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="665" y="701" text-anchor="middle" font-size="9" fill="#990000">Singleton / Scoped / Transient told apart by numbers</text>
  <text x="665" y="715" text-anchor="middle" font-size="8.5" fill="#555">starts a server · Flow/6-ServiceLifetimes.svg</text>
  <text x="665" y="729" text-anchor="middle" font-size="8.5" fill="#555">Console.WriteLine: one line per request</text>
  <text x="665" y="755" text-anchor="middle" font-size="9.5" fill="#555">returns</text>
  <line x1="820" y1="741" x2="510" y2="741" stroke="#333" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="330" y="790" text-anchor="middle" font-size="10" fill="#555">Explain() returns — program ends</text>
  <line x1="510" y1="780" x2="150" y2="780" stroke="#333" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <circle cx="150" cy="804" r="6" fill="#cc0000"/>
  <text x="164" y="808" font-size="10.5" font-weight="bold" fill="#990000">End</text>
  <text x="40" y="836" font-size="10.5" fill="#444"><tspan font-weight="bold">Where to where, in one line:</tspan> Program.cs calls Explain() once; WebApiBasicsExample calls all six WebApiBasicsDemo methods one after another, waiting for each to return.</text>
  <text x="40" y="854" font-size="10" font-style="italic" fill="#888">Inside each method the demo also talks to a short-lived web server over HTTP; that conversation is drawn in the method's own Flow file, not here.</text>
</svg>
