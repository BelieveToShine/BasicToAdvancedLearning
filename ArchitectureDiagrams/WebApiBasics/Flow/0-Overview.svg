  <rect x="816" y="589" width="8" height="56" rx="0" fill="#f0eaf7" stroke="#8e63ce" stroke-width="1"/>
  <text x="665" y="581" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#123">ExplainDependencyInjection()</text>
