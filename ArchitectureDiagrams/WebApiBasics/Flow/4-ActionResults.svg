<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 636" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#333"/></marker>
  </defs>
  <rect x="0" y="0" width="900" height="636" fill="#ffffff"/>
  <text x="450.0" y="20" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a237e">Action results — Sub-level Flow: the stamp desk</text>
  <text x="450.0" y="38" text-anchor="middle" font-size="11" fill="#666">The action does not write the status line itself: what it RETURNS picks the stamp (200, 201, 204, 400, 404).</text>
  <text x="40" y="48" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#274e13">START</text>
  <line x1="40" y1="52" x2="40" y2="90" stroke="#333" stroke-width="2"/>
  <polygon points="40,52 40,70 70,61" fill="#38761d"/>
  <rect x="90" y="52" width="560" height="44" rx="8" fill="#f1f1f1" stroke="#777777" stroke-width="1.5"/>
  <text x="370.0" y="70" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#444444">ExplainActionResults() resets the data, starts a server with ActionResultsController</text>
  <text x="370.0" y="86" text-anchor="middle" font-size="9.5" fill="#333">then sends six requests, one Call() each.</text>
  <text x="160.0" y="138" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1a237e">Request</text>
  <text x="480.0" y="138" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1a237e">What the action returns</text>
  <text x="770.0" y="138" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1a237e">The answer that is stamped</text>
  <rect x="20" y="150" width="280" height="44" rx="8" fill="#e8f4fb" stroke="#3d85c6" stroke-width="1.5"/>
  <text x="160.0" y="168" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#1a4a73">GET /api/accounts/1</text>
  <rect x="340" y="150" width="280" height="44" rx="8" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1.5"/>
  <text x="480.0" y="168" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#274e13">GetById finds the account</text>
  <text x="480.0" y="184" text-anchor="middle" font-size="9.5" fill="#333">return account;  (ActionResult&lt;Account&gt;)</text>
  <rect x="660" y="150" width="220" height="44" rx="8" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1.5"/>
  <text x="770.0" y="168" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#274e13">200 OK</text>
  <text x="770.0" y="184" text-anchor="middle" font-size="9.5" fill="#333">JSON of the account</text>
  <line x1="300" y1="172.0" x2="340" y2="172.0" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="620" y1="172.0" x2="660" y2="172.0" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="20" y="208" width="280" height="44" rx="8" fill="#e8f4fb" stroke="#3d85c6" stroke-width="1.5"/>
  <text x="160.0" y="226" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#1a4a73">GET /api/accounts/99</text>
  <rect x="340" y="208" width="280" height="44" rx="8" fill="#fde8e8" stroke="#cc0000" stroke-width="1.5"/>
  <text x="480.0" y="226" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#990000">no such account</text>
  <text x="480.0" y="242" text-anchor="middle" font-size="9.5" fill="#333">return NotFound();</text>
  <rect x="660" y="208" width="220" height="44" rx="8" fill="#fde8e8" stroke="#cc0000" stroke-width="1.5"/>
  <text x="770.0" y="226" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#990000">404 Not Found</text>
  <text x="770.0" y="242" text-anchor="middle" font-size="9.5" fill="#333">ProblemDetails body</text>
  <line x1="300" y1="230.0" x2="340" y2="230.0" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="620" y1="230.0" x2="660" y2="230.0" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="20" y="266" width="280" height="44" rx="8" fill="#e8f4fb" stroke="#3d85c6" stroke-width="1.5"/>
  <text x="160.0" y="284" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#1a4a73">POST /api/accounts</text>
  <text x="160.0" y="300" text-anchor="middle" font-size="9.5" fill="#333">{AC-1003, Savings}</text>
  <rect x="340" y="266" width="280" height="44" rx="8" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1.5"/>
  <text x="480.0" y="284" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#274e13">Create adds the account</text>
  <text x="480.0" y="300" text-anchor="middle" font-size="9.5" fill="#333">return CreatedAtAction(nameof(GetById), …)</text>
  <rect x="660" y="266" width="220" height="44" rx="8" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1.5"/>
  <text x="770.0" y="284" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#274e13">201 Created</text>
  <text x="770.0" y="300" text-anchor="middle" font-size="9.5" fill="#333">Location: …/api/accounts/3 + JSON</text>
  <line x1="300" y1="288.0" x2="340" y2="288.0" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="620" y1="288.0" x2="660" y2="288.0" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="20" y="324" width="280" height="44" rx="8" fill="#e8f4fb" stroke="#3d85c6" stroke-width="1.5"/>
  <text x="160.0" y="342" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#1a4a73">POST /api/accounts</text>
  <text x="160.0" y="358" text-anchor="middle" font-size="9.5" fill="#333">{AC-1004, Gold}</text>
  <rect x="340" y="324" width="280" height="44" rx="8" fill="#fde8e8" stroke="#cc0000" stroke-width="1.5"/>
  <text x="480.0" y="342" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#990000">"Gold" is not a valid type</text>
  <text x="480.0" y="358" text-anchor="middle" font-size="9.5" fill="#333">return BadRequest("AccountType …");</text>
  <rect x="660" y="324" width="220" height="44" rx="8" fill="#fde8e8" stroke="#cc0000" stroke-width="1.5"/>
  <text x="770.0" y="342" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#990000">400 Bad Request</text>
  <text x="770.0" y="358" text-anchor="middle" font-size="9.5" fill="#333">the text we wrote</text>
  <line x1="300" y1="346.0" x2="340" y2="346.0" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="620" y1="346.0" x2="660" y2="346.0" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="20" y="382" width="280" height="44" rx="8" fill="#e8f4fb" stroke="#3d85c6" stroke-width="1.5"/>
  <text x="160.0" y="400" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#1a4a73">DELETE /api/accounts/3</text>
  <rect x="340" y="382" width="280" height="44" rx="8" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1.5"/>
  <text x="480.0" y="400" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#274e13">Delete removes the account</text>
  <text x="480.0" y="416" text-anchor="middle" font-size="9.5" fill="#333">return NoContent();</text>
  <rect x="660" y="382" width="220" height="44" rx="8" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1.5"/>
  <text x="770.0" y="400" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#274e13">204 No Content</text>
  <text x="770.0" y="416" text-anchor="middle" font-size="9.5" fill="#333">empty body</text>
  <line x1="300" y1="404.0" x2="340" y2="404.0" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="620" y1="404.0" x2="660" y2="404.0" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="20" y="440" width="280" height="44" rx="8" fill="#e8f4fb" stroke="#3d85c6" stroke-width="1.5"/>
  <text x="160.0" y="458" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#1a4a73">GET /api/accounts/3</text>
  <rect x="340" y="440" width="280" height="44" rx="8" fill="#fde8e8" stroke="#cc0000" stroke-width="1.5"/>
  <text x="480.0" y="458" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#990000">it was just deleted</text>
  <text x="480.0" y="474" text-anchor="middle" font-size="9.5" fill="#333">return NotFound();</text>
  <rect x="660" y="440" width="220" height="44" rx="8" fill="#fde8e8" stroke="#cc0000" stroke-width="1.5"/>
  <text x="770.0" y="458" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#990000">404 Not Found</text>
  <text x="770.0" y="474" text-anchor="middle" font-size="9.5" fill="#333">ProblemDetails body</text>
  <line x1="300" y1="462.0" x2="340" y2="462.0" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="620" y1="462.0" x2="660" y2="462.0" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="40" y="504" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#990000">END</text>
  <line x1="40" y1="512" x2="40" y2="552" stroke="#333" stroke-width="2"/>
  <polygon points="40,512 40,530 70,521" fill="#cc0000"/>
  <text x="30" y="570" font-size="10.5" fill="#444"><tspan font-weight="bold">Object or result?</tspan> returning the plain object gives 200; ActionResult&lt;T&gt; or IActionResult lets the action choose any status.</text>
  <text x="30" y="588" font-size="10" font-style="italic" fill="#888">Console.WriteLine prints one line per request (six lines). Account 3 is created in lane 3 and removed in lane 5, so lane 6 finds nothing.</text>
  <text x="30" y="606" font-size="10" font-style="italic" fill="#888">Each method also opens with PrintHeading(): two Console.WriteLine calls (a blank line and the title).</text>
</svg>
