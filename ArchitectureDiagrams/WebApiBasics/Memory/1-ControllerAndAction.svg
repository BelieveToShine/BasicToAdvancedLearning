<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1380 815" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#555"/></marker>
  </defs>
  <rect x="0" y="0" width="1380" height="815" fill="#ffffff"/>
  <text x="690.0" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a237e">Controller and action — Memory: Stack / Heap / Static</text>
  <text x="690.0" y="46" text-anchor="middle" font-size="12" fill="#666">Snapshot: ExplainControllerAndAction() is running, just after the first response came back and was printed.</text>
  <g font-size="11" fill="#333"><rect x="200" y="60" width="14" height="14" rx="2" fill="#b6d7a8" stroke="#6aa84f"/><text x="220" y="71">Stack</text></g>
  <g font-size="11" fill="#333"><rect x="380" y="60" width="14" height="14" rx="2" fill="#f9cb9c" stroke="#e69138"/><text x="400" y="71">Heap</text></g>
  <g font-size="11" fill="#333"><rect x="560" y="60" width="14" height="14" rx="2" fill="#d5c9ea" stroke="#674ea7"/><text x="580" y="71">Static</text></g>
  <text x="220" y="96" text-anchor="middle" font-size="12" font-weight="bold" fill="#3f6b3f">STACK — call frames (top = currently executing)</text>
  <text x="790" y="96" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a5a10">HEAP</text>
  <text x="1325.0" y="96" text-anchor="middle" font-size="12" font-weight="bold" fill="#3d2a6b">STATIC</text>
  <rect x="30" y="108" width="380" height="354" rx="10" fill="none" stroke="#999" stroke-width="1" stroke-dasharray="5 4"/>
  <rect x="50" y="118" width="340" height="214" rx="8" fill="#b6d7a8" stroke="#6aa84f" stroke-width="2"/>
  <text x="220" y="136" text-anchor="middle" font-size="9.9" font-weight="bold" fill="#274e13">WebApiBasicsDemo.ExplainControllerAndAction() — ACTIVE</text>
  <rect x="62" y="146" width="316" height="26" rx="4" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1"/>
  <text x="70" y="163" font-size="10" fill="#1b3d1b">builder → pointer  (WebApplicationBuilder)</text>
  <rect x="62" y="176" width="316" height="26" rx="4" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1"/>
  <text x="70" y="193" font-size="10" fill="#1b3d1b">app → pointer  (WebApplication)</text>
  <rect x="62" y="206" width="316" height="26" rx="4" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1"/>
  <text x="70" y="223" font-size="10" fill="#1b3d1b">server → pointer  (RunningServer)</text>
  <rect x="62" y="236" width="316" height="26" rx="4" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1"/>
  <text x="70" y="253" font-size="10" fill="#1b3d1b">request → pointer  (HttpRequestMessage)</text>
  <rect x="62" y="266" width="316" height="26" rx="4" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1"/>
  <text x="70" y="283" font-size="10" fill="#1b3d1b">response → pointer  (HttpResponseMessage)</text>
  <rect x="62" y="296" width="316" height="26" rx="4" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1"/>
  <text x="70" y="313" font-size="10" fill="#1b3d1b">body → pointer  (string)</text>
  <rect x="50" y="342" width="340" height="50" rx="8" fill="#dcecdc" stroke="#6aa84f" stroke-width="1.5"/>
  <text x="220" y="362" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#4c6b4c">WebApiBasicsExample.Explain()</text>
  <text x="220" y="378" text-anchor="middle" font-size="9.5" fill="#6b8a6b">paused — waiting for the call above to return</text>
  <rect x="50" y="402" width="340" height="50" rx="8" fill="#dcecdc" stroke="#6aa84f" stroke-width="1.5"/>
  <text x="220" y="422" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#4c6b4c">Program.cs (Main)</text>
  <text x="220" y="438" text-anchor="middle" font-size="9.5" fill="#6b8a6b">paused — waiting for topic.Explain() to return</text>
  <rect x="460" y="137" width="290" height="82" rx="10" fill="#f9cb9c" stroke="#e69138" stroke-width="1.5"/>
  <text x="605.0" y="159" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7f4e00">WebApplicationBuilder — builder</text>
  <rect x="472" y="169" width="266" height="26" rx="4" fill="#fff3e6" stroke="#e69138" stroke-width="1"/>
  <text x="480" y="186" font-size="10" fill="#7f4e00">Services → AccountsController registered</text>
  <text x="474" y="210" font-size="8.5" font-style="italic" fill="#a06a1f">(configuration, logging … not shown)</text>
  <rect x="460" y="233" width="290" height="96" rx="10" fill="#f9cb9c" stroke="#e69138" stroke-width="1.5"/>
  <text x="605.0" y="255" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7f4e00">WebApplication — app</text>
  <rect x="472" y="265" width="266" height="26" rx="4" fill="#fff3e6" stroke="#e69138" stroke-width="1"/>
  <text x="480" y="282" font-size="10" fill="#7f4e00">listens on 127.0.0.1:&lt;free port&gt;</text>
  <rect x="472" y="295" width="266" height="26" rx="4" fill="#fff3e6" stroke="#e69138" stroke-width="1"/>
  <text x="480" y="312" font-size="10" fill="#7f4e00">endpoints → pointer (route table)</text>
  <rect x="790" y="286" width="330" height="66" rx="10" fill="#f9cb9c" stroke="#e69138" stroke-width="1.5"/>
  <text x="955.0" y="308" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7f4e00">Route table (built by MapControllers())</text>
  <rect x="802" y="318" width="306" height="26" rx="4" fill="#fff3e6" stroke="#e69138" stroke-width="1"/>
  <text x="810" y="335" font-size="10" fill="#7f4e00">GET api/Accounts → GetAccountNumbers()</text>
  <line x1="750" y1="308" x2="788" y2="308" stroke="#555" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="460" y="343" width="290" height="96" rx="10" fill="#f9cb9c" stroke="#e69138" stroke-width="1.5"/>
  <text x="605.0" y="365" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7f4e00">RunningServer — server</text>
  <rect x="472" y="375" width="266" height="26" rx="4" fill="#fff3e6" stroke="#e69138" stroke-width="1"/>
  <text x="480" y="392" font-size="10" fill="#7f4e00">BaseAddress → "http://127.0.0.1:&lt;port&gt;"</text>
  <rect x="472" y="405" width="266" height="26" rx="4" fill="#fff3e6" stroke="#e69138" stroke-width="1"/>
  <text x="480" y="422" font-size="10" fill="#7f4e00">Client → pointer (HttpClient)</text>
  <rect x="790" y="396" width="330" height="82" rx="10" fill="#f9cb9c" stroke="#e69138" stroke-width="1.5"/>
  <text x="955.0" y="418" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7f4e00">HttpClient</text>
  <rect x="802" y="428" width="306" height="26" rx="4" fill="#fff3e6" stroke="#e69138" stroke-width="1"/>
  <text x="810" y="445" font-size="10" fill="#7f4e00">BaseAddress = the same address</text>
  <text x="804" y="469" font-size="8.5" font-style="italic" fill="#a06a1f">(handler and timeouts not shown)</text>
  <line x1="750" y1="418" x2="788" y2="418" stroke="#555" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="460" y="453" width="290" height="96" rx="10" fill="#f9cb9c" stroke="#e69138" stroke-width="1.5"/>
  <text x="605.0" y="475" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7f4e00">HttpRequestMessage — request</text>
  <rect x="472" y="485" width="266" height="26" rx="4" fill="#fff3e6" stroke="#e69138" stroke-width="1"/>
  <text x="480" y="502" font-size="10" fill="#7f4e00">Method = GET</text>
  <rect x="472" y="515" width="266" height="26" rx="4" fill="#fff3e6" stroke="#e69138" stroke-width="1"/>
  <text x="480" y="532" font-size="10" fill="#7f4e00">RequestUri = /api/accounts</text>
  <rect x="460" y="563" width="290" height="96" rx="10" fill="#f9cb9c" stroke="#e69138" stroke-width="1.5"/>
  <text x="605.0" y="585" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7f4e00">HttpResponseMessage — response</text>
  <rect x="472" y="595" width="266" height="26" rx="4" fill="#fff3e6" stroke="#e69138" stroke-width="1"/>
  <text x="480" y="612" font-size="10" fill="#7f4e00">StatusCode = 200 (OK)</text>
  <rect x="472" y="625" width="266" height="26" rx="4" fill="#fff3e6" stroke="#e69138" stroke-width="1"/>
  <text x="480" y="642" font-size="10" fill="#7f4e00">Content → HttpContent (response bytes)</text>
  <rect x="460" y="673" width="290" height="66" rx="10" fill="#f9cb9c" stroke="#e69138" stroke-width="1.5"/>
  <text x="605.0" y="695" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7f4e00">string — body (decoded copy of the bytes)</text>
  <rect x="472" y="705" width="266" height="26" rx="4" fill="#fff3e6" stroke="#e69138" stroke-width="1"/>
  <text x="480" y="722" font-size="10" fill="#7f4e00">["AC-1001","AC-1002"]</text>
  <rect x="790" y="518" width="470" height="96" rx="10" fill="#f1f1f1" stroke="#777777" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="1025.0" y="538" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#444444">OUTSIDE .NET — the network (loopback)</text>
  <text x="804" y="558" font-size="9.5" font-weight="bold" fill="#333333">Request bytes sent:   GET /api/accounts HTTP/1.1</text>
  <text x="804" y="574" font-size="9.5" font-weight="bold" fill="#333333">Response bytes back:  200, body ["AC-1001","AC-1002"]</text>
  <text x="804" y="590" font-size="9.5" fill="#333333">Only bytes cross the network; no C# object does.</text>
  <line x1="378" y1="159" x2="458" y2="159" stroke="#555" stroke-width="1.4" marker-end="url(#a)"/>
  <polyline points="378,189 440,189 440,255 458,255" fill="none" stroke="#555" stroke-width="1.4" marker-end="url(#a)"/>
  <polyline points="378,219 434,219 434,365 458,365" fill="none" stroke="#555" stroke-width="1.4" marker-end="url(#a)"/>
  <polyline points="378,249 428,249 428,475 458,475" fill="none" stroke="#555" stroke-width="1.4" marker-end="url(#a)"/>
  <polyline points="378,279 422,279 422,585 458,585" fill="none" stroke="#555" stroke-width="1.4" marker-end="url(#a)"/>
  <polyline points="378,309 416,309 416,695 458,695" fill="none" stroke="#555" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="1280" y="118" width="90" height="130" rx="10" fill="#d5c9ea" stroke="#674ea7" stroke-width="1.5" stroke-dasharray="6 4" fill-opacity="0.25"/>
  <text x="1325" y="150" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#3d2a6b">Nothing</text>
  <text x="1325" y="166" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#3d2a6b">here yet</text>
  <text x="40" y="763" font-size="10.5" fill="#444"><tspan font-weight="bold">The server and the client are both just objects on the Heap here; only the request and response travel outside, as bytes. </tspan>The Stack holds six pointers and no plain values.</text>
  <text x="40" y="781" font-size="10" font-style="italic" fill="#888">The AccountsController object is not in the picture: ASP.NET Core created it for this one request, called GetAccountNumbers(), and no variable refers to it any more.</text>
</svg>
