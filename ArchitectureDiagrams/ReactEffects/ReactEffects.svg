<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 850" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#555"/></marker>
  </defs>
  <rect x="0" y="0" width="1100" height="850" fill="#ffffff"/>
  <text x="550.0" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a237e">ReactEffects — Architecture: side effects and data fetching (useEffect)</text>
  <text x="550.0" y="46" text-anchor="middle" font-size="12" fill="#666">Five lessons, each one exists because the previous one hit a limit. Right: the three moments of one React update.</text>
  <g font-size="11" fill="#333"><rect x="314" y="60" width="14" height="14" rx="2" fill="#d5c9ea" stroke="#674ea7"/><text x="334" y="71">Render / calculated values</text></g>
  <g font-size="11" fill="#333"><rect x="492" y="60" width="14" height="14" rx="2" fill="#f3f3f3" stroke="#888888" stroke-dasharray="4 3"/><text x="512" y="71">Commit (DOM updated)</text></g>
  <g font-size="11" fill="#333"><rect x="636" y="60" width="14" height="14" rx="2" fill="#cfe2f3" stroke="#3d85c6"/><text x="656" y="71">Effect (outside work)</text></g>
  <rect x="30" y="92" width="660" height="96" rx="10" fill="#cfe2f3" stroke="#3d85c6" stroke-width="1.6"/>
  <text x="360.0" y="112" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1c4587">Lesson 1 — 01-WhatIsAnEffect.jsx: What is an effect?</text>
  <rect x="40" y="124" width="640" height="26" rx="4" fill="#e8f1fb" stroke="#3d85c6" stroke-width="1"/>
  <text x="48" y="140.5" font-size="10" fill="#1c4587">useEffect(() =&gt; { document.title = label; }, [label]);</text>
  <rect x="40" y="154" width="640" height="26" rx="4" fill="#e8f1fb" stroke="#3d85c6" stroke-width="1"/>
  <text x="48" y="170.5" font-size="10" fill="#1c4587">const fee = balance * 0.01;   // calculated in render: NO effect needed</text>
  <rect x="30" y="228" width="660" height="96" rx="10" fill="#cfe2f3" stroke="#3d85c6" stroke-width="1.6"/>
  <text x="360.0" y="248" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1c4587">Lesson 2 — 02-Dependencies.jsx: the dependency array</text>
  <rect x="40" y="260" width="640" height="26" rx="4" fill="#e8f1fb" stroke="#3d85c6" stroke-width="1"/>
  <text x="48" y="276.5" font-size="10" fill="#1c4587">useEffect(fn) = every render  |  useEffect(fn, []) = once  |  useEffect(fn, [owner]) = when owner changes</text>
  <rect x="40" y="290" width="640" height="26" rx="4" fill="#e8f1fb" stroke="#3d85c6" stroke-width="1"/>
  <text x="48" y="306.5" font-size="10" fill="#1c4587">setCount(c =&gt; c + 1)   // not setCount(count + 1) inside a [] effect: stale value</text>
  <rect x="30" y="364" width="660" height="96" rx="10" fill="#cfe2f3" stroke="#3d85c6" stroke-width="1.6"/>
  <text x="360.0" y="384" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1c4587">Lesson 3 — 03-Cleanup.jsx: cleanup</text>
  <rect x="40" y="396" width="640" height="26" rx="4" fill="#e8f1fb" stroke="#3d85c6" stroke-width="1"/>
  <text x="48" y="412.5" font-size="10" fill="#1c4587">useEffect(() =&gt; { const stop = feed.subscribe(...); return () =&gt; stop(); }, [accountId]);</text>
  <rect x="40" y="426" width="640" height="26" rx="4" fill="#e8f1fb" stroke="#3d85c6" stroke-width="1"/>
  <text x="48" y="442.5" font-size="10" fill="#1c4587">StrictMode (development): setup, cleanup, setup again — exposes a missing cleanup</text>
  <rect x="30" y="500" width="660" height="96" rx="10" fill="#cfe2f3" stroke="#3d85c6" stroke-width="1.6"/>
  <text x="360.0" y="520" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1c4587">Lesson 4 — 04-FetchingData.jsx: fetching data</text>
  <rect x="40" y="532" width="640" height="26" rx="4" fill="#e8f1fb" stroke="#3d85c6" stroke-width="1"/>
  <text x="48" y="548.5" font-size="10" fill="#1c4587">let ignore = false;  async function load() { ... await fetch('/api/accounts') ... }  load();</text>
  <rect x="40" y="562" width="640" height="26" rx="4" fill="#e8f1fb" stroke="#3d85c6" stroke-width="1"/>
  <text x="48" y="578.5" font-size="10" fill="#1c4587">return () =&gt; { ignore = true };   // a late answer from an old run is thrown away</text>
  <rect x="30" y="636" width="660" height="96" rx="10" fill="#cfe2f3" stroke="#3d85c6" stroke-width="1.6"/>
  <text x="360.0" y="656" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1c4587">Lesson 5 — 05-CustomHooks.jsx: custom hooks</text>
  <rect x="40" y="668" width="640" height="26" rx="4" fill="#e8f1fb" stroke="#3d85c6" stroke-width="1"/>
  <text x="48" y="684.5" font-size="10" fill="#1c4587">function useFetch(url) { state + useEffect ...; return { status, data, error, reload }; }</text>
  <rect x="40" y="698" width="640" height="26" rx="4" fill="#e8f1fb" stroke="#3d85c6" stroke-width="1"/>
  <text x="48" y="714.5" font-size="10" fill="#1c4587">const useAccounts = () =&gt; useFetch('/api/accounts');   // each caller gets its own state</text>
  <line x1="360" y1="188" x2="360" y2="226" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="372" y="212" font-size="9.5" font-style="italic" fill="#444">the effect must re-run sometimes: when, exactly?</text>
  <line x1="360" y1="324" x2="360" y2="362" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="372" y="348" font-size="9.5" font-style="italic" fill="#444">a re-run starts a second timer: who stops the first?</text>
  <line x1="360" y1="460" x2="360" y2="498" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="372" y="484" font-size="9.5" font-style="italic" fill="#444">an old request can answer late: cleanup lets us ignore it</text>
  <line x1="360" y1="596" x2="360" y2="634" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="372" y="620" font-size="9.5" font-style="italic" fill="#444">every component would copy it: extract a hook</text>
  <rect x="740" y="92" width="280" height="150" rx="10" fill="#d5c9ea" stroke="#674ea7" stroke-width="1.6"/>
  <text x="880.0" y="112" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#3d2a6b">1  RENDER</text>
  <text x="880.0" y="128" text-anchor="middle" font-size="9" font-style="italic" fill="#3d2a6b">your component function runs</text>
  <rect x="750" y="138" width="260" height="26" rx="4" fill="#efe9f8" stroke="#674ea7" stroke-width="1"/>
  <text x="758" y="154.5" font-size="10" fill="#3d2a6b">reads props + state</text>
  <rect x="750" y="168" width="260" height="26" rx="4" fill="#efe9f8" stroke="#674ea7" stroke-width="1"/>
  <text x="758" y="184.5" font-size="10" fill="#3d2a6b">returns JSX (a description)</text>
  <rect x="750" y="198" width="260" height="26" rx="4" fill="#efe9f8" stroke="#674ea7" stroke-width="1"/>
  <text x="758" y="214.5" font-size="10" fill="#3d2a6b">must only calculate</text>
  <rect x="740" y="282" width="280" height="120" rx="10" fill="#f3f3f3" stroke="#888888" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text x="880.0" y="302" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#444444">2  COMMIT</text>
  <text x="880.0" y="318" text-anchor="middle" font-size="9" font-style="italic" fill="#444444">the DOM changes</text>
  <rect x="750" y="328" width="260" height="26" rx="4" fill="#ffffff" stroke="#888888" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="758" y="344.5" font-size="10" fill="#444444">only what changed is updated</text>
  <rect x="750" y="358" width="260" height="26" rx="4" fill="#ffffff" stroke="#888888" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="758" y="374.5" font-size="10" fill="#444444">the DOM shows the new output</text>
  <rect x="740" y="452" width="280" height="120" rx="10" fill="#cfe2f3" stroke="#3d85c6" stroke-width="1.6"/>
  <text x="880.0" y="472" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1c4587">3  EFFECTS RUN</text>
  <text x="880.0" y="488" text-anchor="middle" font-size="9" font-style="italic" fill="#1c4587">AFTER the DOM is updated</text>
  <rect x="750" y="498" width="260" height="26" rx="4" fill="#e8f1fb" stroke="#3d85c6" stroke-width="1"/>
  <text x="758" y="514.5" font-size="10" fill="#1c4587">cleanup of the previous run</text>
  <rect x="750" y="528" width="260" height="26" rx="4" fill="#e8f1fb" stroke="#3d85c6" stroke-width="1"/>
  <text x="758" y="544.5" font-size="10" fill="#1c4587">then your useEffect function</text>
  <line x1="880.0" y1="242" x2="880.0" y2="280" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="890.0" y="266" font-size="9.5" font-style="italic" fill="#444">React updates the DOM</text>
  <line x1="880.0" y1="402" x2="880.0" y2="450" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="890.0" y="426" font-size="9.5" font-style="italic" fill="#444">then the effects run</text>
  <polyline points="1020,512.0 1028,512.0 1028,167.0 1021,167.0" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="1034" y="207.0" font-size="9.5" font-style="italic" fill="#444">setState</text>
  <text x="1034" y="219.0" font-size="9.5" font-style="italic" fill="#444">in an effect</text>
  <text x="1034" y="231.0" font-size="9.5" font-style="italic" fill="#444">renders again</text>
  <text x="40" y="772" font-size="10.5" fill="#444"><tspan font-weight="bold">Lessons 1-3 are about WHEN an effect runs and how it is undone; </tspan>lesson 4 uses that for the network; lesson 5 packages it.</text>
  <text x="40" y="790" font-size="10" font-style="italic" fill="#888">An effect is for work OUTSIDE React (tab title, timers, subscriptions, network). What you can calculate from props and state belongs in the render.</text>
  <text x="40" y="808" font-size="10" font-style="italic" fill="#888">The browser has usually, but not always, painted the new DOM when effects run; useLayoutEffect is for work that must happen before paint.</text>
  <text x="40" y="826" font-size="10" font-style="italic" fill="#888">Every claim is proved in frontend/src/lessons/ReactEffects/ReactEffects.test.jsx.</text>
</svg>
