<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 674" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#555"/></marker>
  </defs>
  <rect x="0" y="0" width="900" height="674" fill="#ffffff"/>
  <text x="450.0" y="20" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a237e">Cleanup — Flow: the old run is undone BEFORE the new run starts</text>
  <text x="450.0" y="38" text-anchor="middle" font-size="11" fill="#666">Metaphor: before the clerk takes a new phone line, the old line is hung up. Feed = a made-up balance feed outside React.</text>
  <rect x="30" y="80" width="220" height="82" rx="10" fill="#d5c9ea" stroke="#674ea7" stroke-width="1.6"/>
  <circle cx="44" cy="94" r="9" fill="#674ea7"/><text x="44" y="98" text-anchor="middle" font-size="10" font-weight="bold" fill="#fff">1</text>
  <text x="148.0" y="98" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#3d2a6b">RENDER</text>
  <text x="140.0" y="114" text-anchor="middle" font-size="9.5" fill="#3d2a6b">BalanceWatcher with</text>
  <text x="140.0" y="128" text-anchor="middle" font-size="9.5" fill="#3d2a6b">accountId = 'ACC-1001'</text>
  <rect x="340" y="80" width="220" height="82" rx="10" fill="#cfe2f3" stroke="#3d85c6" stroke-width="1.6"/>
  <circle cx="354" cy="94" r="9" fill="#3d85c6"/><text x="354" y="98" text-anchor="middle" font-size="10" font-weight="bold" fill="#fff">2</text>
  <text x="458.0" y="98" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1c4587">EFFECT runs</text>
  <text x="450.0" y="114" text-anchor="middle" font-size="9.5" fill="#1c4587">feed.subscribe(ACC-1001)</text>
  <text x="450.0" y="128" text-anchor="middle" font-size="9.5" fill="#1c4587">listeners: 1</text>
  <rect x="650" y="80" width="220" height="82" rx="10" fill="#d5c9ea" stroke="#674ea7" stroke-width="1.6"/>
  <circle cx="664" cy="94" r="9" fill="#674ea7"/><text x="664" y="98" text-anchor="middle" font-size="10" font-weight="bold" fill="#fff">3</text>
  <text x="768.0" y="98" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#3d2a6b">You pick ACC-1002</text>
  <text x="760.0" y="114" text-anchor="middle" font-size="9.5" fill="#3d2a6b">accountId changes</text>
  <text x="760.0" y="128" text-anchor="middle" font-size="9.5" fill="#3d2a6b">render again</text>
  <line x1="250" y1="121" x2="338" y2="121" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="295" y="113" text-anchor="middle" font-size="9.5" font-style="italic" fill="#444">after commit</text>
  <line x1="560" y1="121" x2="648" y2="121" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="605" y="113" text-anchor="middle" font-size="9.5" font-style="italic" fill="#444">user acts</text>
  <rect x="650" y="220" width="220" height="82" rx="10" fill="#cfe2f3" stroke="#3d85c6" stroke-width="1.6"/>
  <circle cx="664" cy="234" r="9" fill="#3d85c6"/><text x="664" y="238" text-anchor="middle" font-size="10" font-weight="bold" fill="#fff">4</text>
  <text x="768.0" y="238" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1c4587">CLEANUP of the OLD run</text>
  <text x="760.0" y="254" text-anchor="middle" font-size="9.5" fill="#1c4587">feed.unsubscribe(ACC-1001)</text>
  <text x="760.0" y="268" text-anchor="middle" font-size="9.5" fill="#1c4587">listeners: 0</text>
  <line x1="760.0" y1="162" x2="760.0" y2="218" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="768.0" y="198" font-size="9.5" font-style="italic" fill="#444">deps changed: undo first</text>
  <rect x="340" y="220" width="220" height="82" rx="10" fill="#cfe2f3" stroke="#3d85c6" stroke-width="1.6"/>
  <circle cx="354" cy="234" r="9" fill="#3d85c6"/><text x="354" y="238" text-anchor="middle" font-size="10" font-weight="bold" fill="#fff">5</text>
  <text x="458.0" y="238" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1c4587">NEW effect runs</text>
  <text x="450.0" y="254" text-anchor="middle" font-size="9.5" fill="#1c4587">feed.subscribe(ACC-1002)</text>
  <text x="450.0" y="268" text-anchor="middle" font-size="9.5" fill="#1c4587">listeners: 1</text>
  <line x1="650" y1="261" x2="562" y2="261" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="605" y="253" text-anchor="middle" font-size="9.5" font-style="italic" fill="#444">then</text>
  <rect x="30" y="220" width="220" height="82" rx="10" fill="#f3f3f3" stroke="#888888" stroke-width="1.6" stroke-dasharray="5 4"/>
  <circle cx="44" cy="234" r="9" fill="#888888"/><text x="44" y="238" text-anchor="middle" font-size="10" font-weight="bold" fill="#fff">6</text>
  <text x="148.0" y="238" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#444444">Component removed</text>
  <text x="140.0" y="254" text-anchor="middle" font-size="9.5" fill="#444444">(unmount)</text>
  <text x="140.0" y="268" text-anchor="middle" font-size="9.5" fill="#444444">React runs the last cleanup</text>
  <line x1="340" y1="261" x2="252" y2="261" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="295" y="253" text-anchor="middle" font-size="9.5" font-style="italic" fill="#444">user removes it</text>
  <rect x="30" y="360" width="220" height="82" rx="10" fill="#cfe2f3" stroke="#3d85c6" stroke-width="1.6"/>
  <circle cx="44" cy="374" r="9" fill="#3d85c6"/><text x="44" y="378" text-anchor="middle" font-size="10" font-weight="bold" fill="#fff">7</text>
  <text x="148.0" y="378" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1c4587">CLEANUP runs</text>
  <text x="140.0" y="394" text-anchor="middle" font-size="9.5" fill="#1c4587">feed.unsubscribe(ACC-1002)</text>
  <text x="140.0" y="408" text-anchor="middle" font-size="9.5" fill="#1c4587">listeners: 0</text>
  <line x1="140.0" y1="302" x2="140.0" y2="358" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="148.0" y="340" font-size="9.5" font-style="italic" fill="#444">last cleanup</text>
  <rect x="30" y="470" width="840" height="130" rx="8" fill="#fafafa" stroke="#bbb" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="450" y="490" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">StrictMode (development only): on mount React runs setup, cleanup, setup</text>
  <rect x="50" y="506" width="220" height="78" rx="10" fill="#cfe2f3" stroke="#3d85c6" stroke-width="1.6"/>
  <circle cx="64" cy="520" r="9" fill="#3d85c6"/><text x="64" y="524" text-anchor="middle" font-size="10" font-weight="bold" fill="#fff">a</text>
  <text x="168.0" y="524" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1c4587">subscribe</text>
  <text x="160.0" y="540" text-anchor="middle" font-size="9.5" fill="#1c4587">good watcher listeners: 1</text>
  <text x="160.0" y="554" text-anchor="middle" font-size="9.5" fill="#1c4587">leaky watcher listeners: 1</text>
  <rect x="320" y="506" width="220" height="78" rx="10" fill="#cfe2f3" stroke="#3d85c6" stroke-width="1.6"/>
  <circle cx="334" cy="520" r="9" fill="#3d85c6"/><text x="334" y="524" text-anchor="middle" font-size="10" font-weight="bold" fill="#fff">b</text>
  <text x="438.0" y="524" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1c4587">cleanup</text>
  <text x="430.0" y="540" text-anchor="middle" font-size="9.5" fill="#1c4587">good watcher listeners: 0</text>
  <text x="430.0" y="554" text-anchor="middle" font-size="9.5" fill="#1c4587">leaky watcher: no cleanup, still 1</text>
  <rect x="590" y="506" width="220" height="78" rx="10" fill="#cfe2f3" stroke="#3d85c6" stroke-width="1.6"/>
  <circle cx="604" cy="520" r="9" fill="#3d85c6"/><text x="604" y="524" text-anchor="middle" font-size="10" font-weight="bold" fill="#fff">c</text>
  <text x="708.0" y="524" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1c4587">subscribe again</text>
  <text x="700.0" y="540" text-anchor="middle" font-size="9.5" fill="#1c4587">good watcher listeners: 1</text>
  <text x="700.0" y="554" text-anchor="middle" font-size="9.5" fill="#1c4587">leaky watcher listeners: 2 (exposed!)</text>
  <line x1="270" y1="545" x2="318" y2="545" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="295" y="538" text-anchor="middle" font-size="9.5" font-style="italic" fill="#444">React</text>
  <line x1="540" y1="545" x2="588" y2="545" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="565" y="538" text-anchor="middle" font-size="9.5" font-style="italic" fill="#444">React</text>
  <text x="40" y="625" font-size="10" font-style="italic" fill="#888">Proved in the tests: events read "subscribe 1001, unsubscribe 1001, subscribe 1002" and, under StrictMode, a leaky watcher ends with 2 listeners.</text>
  <text x="40" y="643" font-size="10" font-style="italic" fill="#888">Colours: purple = render / calculated values, orange = state, blue = effect or cleanup, grey dashed = DOM / browser / outside React.</text>
</svg>
