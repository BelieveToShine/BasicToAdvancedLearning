<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 754" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#555"/></marker>
  </defs>
  <rect x="0" y="0" width="900" height="754" fill="#ffffff"/>
  <text x="450.0" y="20" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a237e">Dependencies — Flow: three effects, three renders, who runs?</text>
  <text x="450.0" y="38" text-anchor="middle" font-size="11" fill="#666">After every render React compares each effect's dependency list with the previous render's (Object.is) and runs only the effects that differ.</text>
  <line x1="270" y1="82" x2="860" y2="82" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="565" y="76" text-anchor="middle" font-size="9.5" font-style="italic" fill="#444">time: one render after another</text>
  <rect x="270" y="96" width="170" height="62" rx="10" fill="#d5c9ea" stroke="#674ea7" stroke-width="1.6"/>
  <text x="355.0" y="116" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#3d2a6b">Render 1</text>
  <text x="355.0" y="130" text-anchor="middle" font-size="9.5" fill="#3d2a6b">mount</text>
  <text x="355.0" y="146" text-anchor="middle" font-size="9.5" fill="#3d2a6b">owner = Asha Rao</text>
  <rect x="480" y="96" width="170" height="62" rx="10" fill="#d5c9ea" stroke="#674ea7" stroke-width="1.6"/>
  <text x="565.0" y="116" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#3d2a6b">Render 2</text>
  <text x="565.0" y="130" text-anchor="middle" font-size="9.5" fill="#3d2a6b">click "Add a transaction"</text>
  <text x="565.0" y="146" text-anchor="middle" font-size="9.5" fill="#3d2a6b">transactions 0 → 1</text>
  <rect x="690" y="96" width="170" height="62" rx="10" fill="#d5c9ea" stroke="#674ea7" stroke-width="1.6"/>
  <text x="775.0" y="116" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#3d2a6b">Render 3</text>
  <text x="775.0" y="130" text-anchor="middle" font-size="9.5" fill="#3d2a6b">select Ben Carter</text>
  <text x="775.0" y="146" text-anchor="middle" font-size="9.5" fill="#3d2a6b">owner Asha → Ben</text>
  <rect x="270" y="186" width="590" height="36" rx="10" fill="#ffffff" stroke="#999999" stroke-width="1.6"/>
  <text x="565.0" y="206" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#333333"></text>
  <text x="565" y="203" text-anchor="middle" font-size="10" font-weight="bold" fill="#333">React compares each effect's dependencies with last render's</text>
  <line x1="355.0" y1="158" x2="355.0" y2="184" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="565.0" y1="158" x2="565.0" y2="184" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="775.0" y1="158" x2="775.0" y2="184" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="361.0" y="175" font-size="9.5" font-style="italic" fill="#444">new render</text>
  <text x="571.0" y="175" font-size="9.5" font-style="italic" fill="#444">new render</text>
  <text x="781.0" y="175" font-size="9.5" font-style="italic" fill="#444">new render</text>
  <rect x="30" y="232" width="220" height="62" rx="10" fill="#cfe2f3" stroke="#3d85c6" stroke-width="1.6"/>
  <text x="140.0" y="252" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1c4587">useEffect(fn)</text>
  <text x="140.0" y="268" text-anchor="middle" font-size="9" font-style="italic" fill="#1c4587">no array: every render</text>
  <rect x="270" y="232" width="170" height="62" rx="10" fill="#cfe2f3" stroke="#3d85c6" stroke-width="1.6"/>
  <text x="355.0" y="252" text-anchor="middle" font-size="10" font-weight="bold" fill="#1c4587">RAN (1st time)</text>
  <rect x="480" y="232" width="170" height="62" rx="10" fill="#cfe2f3" stroke="#3d85c6" stroke-width="1.6"/>
  <text x="565.0" y="252" text-anchor="middle" font-size="10" font-weight="bold" fill="#1c4587">RAN (2nd time)</text>
  <rect x="690" y="232" width="170" height="62" rx="10" fill="#cfe2f3" stroke="#3d85c6" stroke-width="1.6"/>
  <text x="775.0" y="252" text-anchor="middle" font-size="10" font-weight="bold" fill="#1c4587">RAN (3rd time)</text>
  <rect x="30" y="310" width="220" height="62" rx="10" fill="#cfe2f3" stroke="#3d85c6" stroke-width="1.6"/>
  <text x="140.0" y="330" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1c4587">useEffect(fn, [])</text>
  <text x="140.0" y="346" text-anchor="middle" font-size="9" font-style="italic" fill="#1c4587">empty array: once</text>
  <rect x="270" y="310" width="170" height="62" rx="10" fill="#cfe2f3" stroke="#3d85c6" stroke-width="1.6"/>
  <text x="355.0" y="330" text-anchor="middle" font-size="10" font-weight="bold" fill="#1c4587">RAN (1st time)</text>
  <rect x="480" y="310" width="170" height="62" rx="10" fill="#ffffff" stroke="#999999" stroke-width="1.6"/>
  <text x="565.0" y="330" text-anchor="middle" font-size="10" font-weight="bold" fill="#333333">SKIPPED: [] never differs</text>
  <rect x="690" y="310" width="170" height="62" rx="10" fill="#ffffff" stroke="#999999" stroke-width="1.6"/>
  <text x="775.0" y="330" text-anchor="middle" font-size="10" font-weight="bold" fill="#333333">SKIPPED: [] never differs</text>
  <rect x="30" y="388" width="220" height="62" rx="10" fill="#cfe2f3" stroke="#3d85c6" stroke-width="1.6"/>
  <text x="140.0" y="408" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1c4587">useEffect(fn, [owner])</text>
  <text x="140.0" y="424" text-anchor="middle" font-size="9" font-style="italic" fill="#1c4587">runs when owner changes</text>
  <rect x="270" y="388" width="170" height="62" rx="10" fill="#cfe2f3" stroke="#3d85c6" stroke-width="1.6"/>
  <text x="355.0" y="408" text-anchor="middle" font-size="10" font-weight="bold" fill="#1c4587">RAN (1st time)</text>
  <rect x="480" y="388" width="170" height="62" rx="10" fill="#ffffff" stroke="#999999" stroke-width="1.6"/>
  <text x="565.0" y="408" text-anchor="middle" font-size="10" font-weight="bold" fill="#333333">SKIPPED: still Asha Rao</text>
  <rect x="690" y="388" width="170" height="62" rx="10" fill="#cfe2f3" stroke="#3d85c6" stroke-width="1.6"/>
  <text x="775.0" y="408" text-anchor="middle" font-size="10" font-weight="bold" fill="#1c4587">RAN: owner changed</text>
  <text x="40" y="482" font-size="10" fill="#333">Reading the table: the dependency array only decides WHEN. It does not change what the effect does when it runs.</text>
  <rect x="15" y="508" width="870" height="168" rx="8" fill="#fafafa" stroke="#bbb" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="450" y="528" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">The stale value pitfall: StaleTicker reads count inside an effect with []</text>
  <rect x="30" y="544" width="160" height="84" rx="10" fill="#d5c9ea" stroke="#674ea7" stroke-width="1.6"/>
  <circle cx="44" cy="558" r="9" fill="#674ea7"/><text x="44" y="562" text-anchor="middle" font-size="10" font-weight="bold" fill="#fff">1</text>
  <text x="118.0" y="562" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#3d2a6b">Render 1</text>
  <text x="110.0" y="578" text-anchor="middle" font-size="9.5" fill="#3d2a6b">count = 0</text>
  <rect x="260" y="544" width="160" height="84" rx="10" fill="#cfe2f3" stroke="#3d85c6" stroke-width="1.6"/>
  <circle cx="274" cy="558" r="9" fill="#3d85c6"/><text x="274" y="562" text-anchor="middle" font-size="10" font-weight="bold" fill="#fff">2</text>
  <text x="348.0" y="562" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1c4587">Effect runs once</text>
  <text x="340.0" y="578" text-anchor="middle" font-size="9.5" fill="#1c4587">closure remembers</text>
  <text x="340.0" y="592" text-anchor="middle" font-size="9.5" fill="#1c4587">count = 0</text>
  <rect x="490" y="544" width="160" height="84" rx="10" fill="#cfe2f3" stroke="#3d85c6" stroke-width="1.6"/>
  <circle cx="504" cy="558" r="9" fill="#3d85c6"/><text x="504" y="562" text-anchor="middle" font-size="10" font-weight="bold" fill="#fff">3</text>
  <text x="578.0" y="562" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1c4587">Tick (1 second)</text>
  <text x="570.0" y="578" text-anchor="middle" font-size="9.5" fill="#1c4587">setCount(0 + 1)</text>
  <text x="570.0" y="592" text-anchor="middle" font-size="9.5" fill="#1c4587">count becomes 1</text>
  <rect x="720" y="544" width="160" height="84" rx="10" fill="#cfe2f3" stroke="#3d85c6" stroke-width="1.6"/>
  <circle cx="734" cy="558" r="9" fill="#3d85c6"/><text x="734" y="562" text-anchor="middle" font-size="10" font-weight="bold" fill="#fff">4</text>
  <text x="808.0" y="562" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1c4587">Render 2, next tick</text>
  <text x="800.0" y="578" text-anchor="middle" font-size="9.5" fill="#1c4587">effect NOT re-run</text>
  <text x="800.0" y="592" text-anchor="middle" font-size="9.5" fill="#1c4587">setCount(0 + 1) again</text>
  <line x1="190" y1="586" x2="258" y2="586" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="225" y="578" text-anchor="middle" font-size="9" font-style="italic" fill="#444">after commit</text>
  <line x1="420" y1="586" x2="488" y2="586" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="455" y="578" text-anchor="middle" font-size="9" font-style="italic" fill="#444">timer fires</text>
  <line x1="650" y1="586" x2="718" y2="586" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="685" y="578" text-anchor="middle" font-size="9" font-style="italic" fill="#444">render, then</text>
  <text x="450" y="650" text-anchor="middle" font-size="10" fill="#333">Stuck at 1. FixedTicker uses setCount(c =&gt; c + 1): React adds 1 to the LATEST count, so it shows 1, 2, 3 (proved with fake timers).</text>
  <text x="40" y="698" font-size="10" font-style="italic" fill="#888">The "Show the run counts" button of the lesson page re-renders the component too, so it adds one to the every-render count each time you click it.</text>
  <text x="40" y="716" font-size="10" font-style="italic" fill="#888">In the development page, StrictMode runs ALL THREE effects twice on mount (setup, cleanup, setup): counts there are one higher (3, 2, 2).</text>
  <text x="40" y="734" font-size="10" font-style="italic" fill="#888">Colours: purple = render / calculated values, orange = state, blue = effect or cleanup, grey dashed = DOM / browser / outside React.</text>
</svg>
