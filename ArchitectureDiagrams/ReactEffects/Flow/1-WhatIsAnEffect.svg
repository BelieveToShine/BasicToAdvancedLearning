<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 794" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#555"/></marker>
  </defs>
  <rect x="0" y="0" width="900" height="794" fill="#ffffff"/>
  <text x="450.0" y="20" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a237e">What is an effect — Flow: a deposit, then the effect that follows the DOM update</text>
  <text x="450.0" y="38" text-anchor="middle" font-size="11" fill="#666">Metaphor: the clerk writes the statement (render), pins it to the board (commit), THEN phones the outside world (effect).</text>
  <rect x="30" y="48" width="260" height="22" rx="6" fill="#eef1f6" stroke="#999" stroke-width="1.2"/>
  <text x="160.0" y="63" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#333333">Your component</text>
  <rect x="320" y="48" width="260" height="22" rx="6" fill="#eef1f6" stroke="#999" stroke-width="1.2"/>
  <text x="450.0" y="63" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#333333">React</text>
  <rect x="610" y="48" width="260" height="22" rx="6" fill="#eef1f6" stroke="#999" stroke-width="1.2"/>
  <text x="740.0" y="63" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#333333">Browser</text>
  <rect x="610" y="90" width="260" height="62" rx="10" fill="#f3f3f3" stroke="#888888" stroke-width="1.6" stroke-dasharray="5 4"/>
  <circle cx="624" cy="104" r="9" fill="#888888"/><text x="624" y="108" text-anchor="middle" font-size="10" font-weight="bold" fill="#fff">1</text>
  <text x="748.0" y="108" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#444444">You click "Deposit 50"</text>
  <text x="740.0" y="124" text-anchor="middle" font-size="9.5" fill="#444444">onClick → setBalance(b =&gt; b + 50)</text>
  <rect x="320" y="180" width="260" height="62" rx="10" fill="#f9cb9c" stroke="#e69138" stroke-width="1.6"/>
  <circle cx="334" cy="194" r="9" fill="#e69138"/><text x="334" y="198" text-anchor="middle" font-size="10" font-weight="bold" fill="#fff">2</text>
  <text x="458.0" y="198" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7f4e00">React schedules a render</text>
  <text x="450.0" y="214" text-anchor="middle" font-size="9.5" fill="#7f4e00">state balance: 100 → 150</text>
  <polyline points="740,152 740,211 582,211" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="748" y="175" font-size="9.5" font-style="italic" fill="#444">state changed</text>
  <rect x="30" y="280" width="260" height="76" rx="10" fill="#d5c9ea" stroke="#674ea7" stroke-width="1.6"/>
  <circle cx="44" cy="294" r="9" fill="#674ea7"/><text x="44" y="298" text-anchor="middle" font-size="10" font-weight="bold" fill="#fff">3</text>
  <text x="168.0" y="298" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#3d2a6b">RENDER</text>
  <text x="160.0" y="314" text-anchor="middle" font-size="9.5" fill="#3d2a6b">BalanceTitle() runs again</text>
  <text x="160.0" y="328" text-anchor="middle" font-size="9.5" fill="#3d2a6b">label = 'Balance: 150'</text>
  <text x="160.0" y="342" text-anchor="middle" font-size="9.5" fill="#3d2a6b">calculated here, no effect needed</text>
  <polyline points="320,211 160,211 160,278" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="168" y="262" font-size="9.5" font-style="italic" fill="#444">calls your component</text>
  <rect x="320" y="390" width="230" height="62" rx="10" fill="#f3f3f3" stroke="#888888" stroke-width="1.6" stroke-dasharray="5 4"/>
  <circle cx="334" cy="404" r="9" fill="#888888"/><text x="334" y="408" text-anchor="middle" font-size="10" font-weight="bold" fill="#fff">4</text>
  <text x="443.0" y="408" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#444444">COMMIT</text>
  <text x="435.0" y="424" text-anchor="middle" font-size="9.5" fill="#444444">React updates the DOM text</text>
  <polyline points="290,318 435,318 435,388" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="443" y="372" font-size="9.5" font-style="italic" fill="#444">returns JSX</text>
  <rect x="610" y="390" width="260" height="62" rx="10" fill="#f3f3f3" stroke="#888888" stroke-width="1.6" stroke-dasharray="5 4"/>
  <circle cx="624" cy="404" r="9" fill="#888888"/><text x="624" y="408" text-anchor="middle" font-size="10" font-weight="bold" fill="#fff">5</text>
  <text x="748.0" y="408" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#444444">DOM now says "Balance: 150"</text>
  <text x="740.0" y="424" text-anchor="middle" font-size="9.5" fill="#444444">(the old text is already gone)</text>
  <line x1="550" y1="421" x2="608" y2="421" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="580" y="413" text-anchor="middle" font-size="9.5" font-style="italic" fill="#444">writes</text>
  <rect x="30" y="500" width="260" height="90" rx="10" fill="#cfe2f3" stroke="#3d85c6" stroke-width="1.6"/>
  <circle cx="44" cy="514" r="9" fill="#3d85c6"/><text x="44" y="518" text-anchor="middle" font-size="10" font-weight="bold" fill="#fff">6</text>
  <text x="168.0" y="518" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1c4587">EFFECT runs (label changed)</text>
  <text x="160.0" y="534" text-anchor="middle" font-size="9.5" fill="#1c4587">document.title = label</text>
  <text x="160.0" y="548" text-anchor="middle" font-size="9.5" fill="#1c4587">setSeenByEffect(DOM text)</text>
  <text x="160.0" y="562" text-anchor="middle" font-size="9.5" fill="#1c4587">the DOM text it reads: 'Balance: 150'</text>
  <polyline points="320,430 160,430 160,498" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="168" y="470" font-size="9.5" font-style="italic" fill="#444">AFTER the commit</text>
  <rect x="610" y="500" width="260" height="62" rx="10" fill="#f3f3f3" stroke="#888888" stroke-width="1.6" stroke-dasharray="5 4"/>
  <circle cx="624" cy="514" r="9" fill="#888888"/><text x="624" y="518" text-anchor="middle" font-size="10" font-weight="bold" fill="#fff">7</text>
  <text x="748.0" y="518" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#444444">Tab title = "Balance: 150"</text>
  <text x="740.0" y="534" text-anchor="middle" font-size="9.5" fill="#444444">document.title lives outside React</text>
  <line x1="290" y1="531" x2="608" y2="531" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="450" y="523" text-anchor="middle" font-size="9.5" font-style="italic" fill="#444">sets document.title</text>
  <rect x="30" y="640" width="260" height="76" rx="10" fill="#f9cb9c" stroke="#e69138" stroke-width="1.6"/>
  <circle cx="44" cy="654" r="9" fill="#e69138"/><text x="44" y="658" text-anchor="middle" font-size="10" font-weight="bold" fill="#fff">8</text>
  <text x="168.0" y="658" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7f4e00">Render again</text>
  <text x="160.0" y="674" text-anchor="middle" font-size="9.5" fill="#7f4e00">seenByEffect changed; label did not</text>
  <text x="160.0" y="688" text-anchor="middle" font-size="9.5" fill="#7f4e00">so the [label] effect is skipped</text>
  <line x1="160" y1="590" x2="160" y2="638" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="168" y="622" font-size="9.5" font-style="italic" fill="#444">setSeenByEffect</text>
  <text x="40" y="730" font-size="10" font-style="italic" fill="#888">Compare: FeeWrong would do the same trip for a value that could be calculated in step 3 — it costs a whole extra render (proved with Profiler in the tests).</text>
  <text x="40" y="748" font-size="10" font-style="italic" fill="#888">Colours: purple = render / calculated values, orange = state, blue = effect or cleanup, grey dashed = DOM / browser / outside React.</text>
</svg>
