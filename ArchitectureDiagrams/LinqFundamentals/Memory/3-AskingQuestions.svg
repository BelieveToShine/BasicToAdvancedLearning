<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 508" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#555"/></marker>
  </defs>
  <rect x="0" y="0" width="1200" height="508" fill="#ffffff"/>
  <text x="600.0" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a237e">Asking questions — Memory: Stack / Heap / Static</text>
  <text x="600.0" y="46" text-anchor="middle" font-size="12" fill="#666">Snapshot: ExplainAskingQuestions() is running, after all four questions were answered.</text>
  <g font-size="11" fill="#333"><rect x="200" y="60" width="14" height="14" rx="2" fill="#b6d7a8" stroke="#6aa84f"/><text x="220" y="71">Stack</text></g>
  <g font-size="11" fill="#333"><rect x="380" y="60" width="14" height="14" rx="2" fill="#f9cb9c" stroke="#e69138"/><text x="400" y="71">Heap</text></g>
  <g font-size="11" fill="#333"><rect x="560" y="60" width="14" height="14" rx="2" fill="#d5c9ea" stroke="#674ea7"/><text x="580" y="71">Static</text></g>
  <text x="220" y="96" text-anchor="middle" font-size="12" font-weight="bold" fill="#3f6b3f">STACK — call frames (top = currently executing)</text>
  <text x="700" y="96" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a5a10">HEAP</text>
  <text x="1145" y="96" text-anchor="middle" font-size="12" font-weight="bold" fill="#3d2a6b">STATIC</text>
  <rect x="30" y="108" width="380" height="324" rx="10" fill="none" stroke="#999" stroke-width="1" stroke-dasharray="5 4"/>
  <rect x="50" y="118" width="340" height="184" rx="8" fill="#b6d7a8" stroke="#6aa84f" stroke-width="2"/>
  <text x="220" y="136" text-anchor="middle" font-size="9.9" font-weight="bold" fill="#274e13">LinqFundamentalsDemo.ExplainAskingQuestions() — ACTIVE</text>
  <rect x="62" y="146" width="316" height="26" rx="4" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1"/>
  <text x="70" y="163" font-size="10" fill="#1b3d1b">amounts → pointer  (List&lt;decimal&gt;)</text>
  <rect x="62" y="176" width="316" height="26" rx="4" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1"/>
  <text x="70" y="193" font-size="10" fill="#1b3d1b">anyWithdrawal = true</text>
  <rect x="62" y="206" width="316" height="26" rx="4" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1"/>
  <text x="70" y="223" font-size="10" fill="#1b3d1b">allDeposits = false</text>
  <rect x="62" y="236" width="316" height="26" rx="4" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1"/>
  <text x="70" y="253" font-size="10" fill="#1b3d1b">firstLarge = 1200</text>
  <rect x="62" y="266" width="316" height="26" rx="4" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1"/>
  <text x="70" y="283" font-size="10" fill="#1b3d1b">noMatch = 0</text>
  <rect x="50" y="312" width="340" height="50" rx="8" fill="#dcecdc" stroke="#6aa84f" stroke-width="1.5"/>
  <text x="220" y="332" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#4c6b4c">LinqFundamentalsExample.Explain()</text>
  <text x="220" y="348" text-anchor="middle" font-size="9.5" fill="#6b8a6b">paused — waiting for the call above to return</text>
  <rect x="50" y="372" width="340" height="50" rx="8" fill="#dcecdc" stroke="#6aa84f" stroke-width="1.5"/>
  <text x="220" y="392" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#4c6b4c">Program.cs (Main)</text>
  <text x="220" y="408" text-anchor="middle" font-size="9.5" fill="#6b8a6b">paused — waiting for topic.Explain() to return</text>
  <rect x="460" y="118" width="250" height="202" rx="10" fill="#f9cb9c" stroke="#e69138" stroke-width="1.5"/>
  <text x="585.0" y="140" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7f4e00">List&lt;decimal&gt; — amounts (Count = 5)</text>
  <rect x="472" y="150" width="226" height="26" rx="4" fill="#fff3e6" stroke="#e69138" stroke-width="1"/>
  <text x="480" y="167" font-size="10" fill="#7f4e00">[0] = 200</text>
  <rect x="472" y="180" width="226" height="26" rx="4" fill="#fff3e6" stroke="#e69138" stroke-width="1"/>
  <text x="480" y="197" font-size="10" fill="#7f4e00">[1] = -900</text>
  <rect x="472" y="210" width="226" height="26" rx="4" fill="#fff3e6" stroke="#e69138" stroke-width="1"/>
  <text x="480" y="227" font-size="10" fill="#7f4e00">[2] = 50</text>
  <rect x="472" y="240" width="226" height="26" rx="4" fill="#fff3e6" stroke="#e69138" stroke-width="1"/>
  <text x="480" y="257" font-size="10" fill="#7f4e00">[3] = 1200</text>
  <rect x="472" y="270" width="226" height="26" rx="4" fill="#fff3e6" stroke="#e69138" stroke-width="1"/>
  <text x="480" y="287" font-size="10" fill="#7f4e00">[4] = -75</text>
  <text x="474" y="311" font-size="8.5" font-style="italic" fill="#a06a1f">(an internal array holds these cells)</text>
  <polyline points="378,159 444,159 444,140 458,140" fill="none" stroke="#555" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="1100" y="118" width="90" height="130" rx="10" fill="#d5c9ea" stroke="#674ea7" stroke-width="1.5" stroke-dasharray="6 4" fill-opacity="0.25"/>
  <text x="1145" y="150" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#3d2a6b">Nothing</text>
  <text x="1145" y="166" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#3d2a6b">here yet</text>
  <text x="40" y="456" font-size="10.5" fill="#444"><tspan font-weight="bold">Any, All, First and FirstOrDefault return single answers — no new list is built on the Heap. </tspan>Every answer is a plain value on the Stack.</text>
  <text x="40" y="474" font-size="10" font-style="italic" fill="#888">noMatch is 0, the default for a decimal: FirstOrDefault found nothing over 5000. Plain First would have thrown an InvalidOperationException there (Topic 7).</text>
</svg>
