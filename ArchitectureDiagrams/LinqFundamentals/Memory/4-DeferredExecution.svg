  <text x="480" y="287" font-size="10" fill="#7f4e00">[4] = 75</text>
  <text x="474" y="311" font-size="8.5" font-style="italic" fill="#a06a1f">(an internal array holds these cells)</text>
  <rect x="460" y="340" width="250" height="112" rx="10" fill="#f9cb9c" stroke="#e69138" stroke-width="1.5"/>
  <text x="585.0" y="362" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7f4e00">Where iterator — deposits</text>
  <rect x="472" y="372" width="226" height="26" rx="4" fill="#fff3e6" stroke="#e69138" stroke-width="1"/>
  <text x="480" y="389" font-size="10" fill="#7f4e00">_source → pointer (the list)</text>
