  <rect x="1100" y="118" width="90" height="130" rx="10" fill="#d5c9ea" stroke="#674ea7" stroke-width="1.5" stroke-dasharray="6 4" fill-opacity="0.25"/>
  <text x="1145" y="150" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#3d2a6b">Nothing</text>
  <text x="1145" y="166" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#3d2a6b">here yet</text>
  <text x="40" y="666" font-size="10.5" fill="#444"><tspan font-weight="bold">`deposits` is not a list of results — it is a small iterator holding a pointer to the source list and a pointer to the lambda. </tspan>Nothing is stored in it.</text>
  <text x="40" y="684" font-size="10" font-style="italic" fill="#888">Every enumeration walks the CURRENT amounts: snapshot was filled when amounts held 4 items (3 deposits) and never changes; liveCount re-ran the query after 75 was added (4 deposits).</text>
  <text x="40" y="702" font-size="10" font-style="italic" fill="#888">The compiler also caches this non-capturing lambda in a hidden static field — an implementation detail the lesson's own code never touches, so it is not drawn.</text>
</svg>
