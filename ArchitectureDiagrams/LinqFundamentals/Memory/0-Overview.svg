<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 470" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#555"/></marker>
  </defs>
  <rect x="0" y="0" width="1100" height="470" fill="#ffffff"/>
  <text x="550" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a237e">LINQ Fundamentals — Memory: Stack / Heap / Static (high level)</text>
  <text x="550" y="46" text-anchor="middle" font-size="12" fill="#666">Results are ordinary lists on the Heap; a query you have not run yet is just a tiny iterator object plus a lambda object.</text>
  <g font-size="11" fill="#333"><rect x="150" y="60" width="14" height="14" rx="2" fill="#b6d7a8" stroke="#6aa84f"/><text x="170" y="71">Stack</text></g>
  <g font-size="11" fill="#333"><rect x="330" y="60" width="14" height="14" rx="2" fill="#f9cb9c" stroke="#e69138"/><text x="350" y="71">Heap</text></g>
  <g font-size="11" fill="#333"><rect x="510" y="60" width="14" height="14" rx="2" fill="#d5c9ea" stroke="#674ea7"/><text x="530" y="71">Static</text></g>
  <text x="230" y="98" text-anchor="middle" font-size="12" font-weight="bold" fill="#3f6b3f">STACK — pointers, plus single answers</text>
  <text x="630" y="98" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a5a10">HEAP — lists, strings, iterator, lambda</text>
  <text x="950" y="98" text-anchor="middle" font-size="12" font-weight="bold" fill="#3d2a6b">STATIC</text>
  <rect x="40" y="112" width="380" height="222" rx="8" fill="#b6d7a8" stroke="#6aa84f" stroke-width="2"/>
  <text x="230" y="132" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#274e13">One slot per local, in each method's own frame</text>
  <rect x="56" y="144" width="348" height="38" rx="4" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1"/>
  <text x="66" y="161" font-size="10" font-weight="bold" fill="#1b3d1b">amounts, deposits, labels → 3 list pointers</text>
  <text x="66" y="175" font-size="8.5" fill="#3f6b3f">ExplainWhereAndSelect()</text>
  <rect x="56" y="188" width="348" height="38" rx="4" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1"/>
  <text x="66" y="205" font-size="10" font-weight="bold" fill="#1b3d1b">amounts, ordered → pointers; 3 numbers inline</text>
  <text x="66" y="219" font-size="8.5" fill="#3f6b3f">ExplainOrderingAndAggregates()</text>
  <rect x="56" y="232" width="348" height="38" rx="4" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1"/>
  <text x="66" y="249" font-size="10" font-weight="bold" fill="#1b3d1b">amounts → pointer; 2 bools + 2 numbers inline</text>
  <text x="66" y="263" font-size="8.5" fill="#3f6b3f">ExplainAskingQuestions()</text>
  <rect x="56" y="276" width="348" height="38" rx="4" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1"/>
  <text x="66" y="293" font-size="10" font-weight="bold" fill="#1b3d1b">amounts, deposits, snapshot → pointers; 2 ints</text>
  <text x="66" y="307" font-size="8.5" fill="#3f6b3f">ExplainDeferredExecution()</text>
  <rect x="450" y="112" width="380" height="222" rx="8" fill="#f9cb9c" stroke="#e69138" stroke-width="1.5"/>
  <text x="640" y="132" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7f4e00">The real objects — this is where the data is</text>
  <rect x="466" y="144" width="348" height="54" rx="6" fill="#ffffff" stroke="#f0c07a" stroke-width="1"/>
  <text x="640" y="166" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#7f4e00">Lists: the source and every ToList() result</text>
  <text x="640" y="184" text-anchor="middle" font-size="8.5" fill="#a06a1f">one Heap object each; Where/Select/OrderBy never edit the source</text>
  <rect x="466" y="206" width="348" height="54" rx="6" fill="#ffffff" stroke="#f0c07a" stroke-width="1"/>
  <text x="640" y="228" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#7f4e00">Iterator + lambda: what an unrun query IS</text>
  <text x="640" y="246" text-anchor="middle" font-size="8.5" fill="#a06a1f">a pointer to the list and a pointer to the rule — see Memory/4</text>
  <rect x="466" y="268" width="348" height="54" rx="6" fill="#ffffff" stroke="#f0c07a" stroke-width="1"/>
  <text x="640" y="290" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#7f4e00">Single answers (Sum, Any, First…)</text>
  <text x="640" y="308" text-anchor="middle" font-size="8.5" fill="#a06a1f">plain values on the Stack — nothing new on the Heap</text>
  <rect x="860" y="112" width="200" height="222" rx="10" fill="#d5c9ea" stroke="#674ea7" stroke-width="1.5" stroke-dasharray="6 4" fill-opacity="0.25"/>
  <text x="960" y="190" text-anchor="middle" font-size="11" font-weight="bold" fill="#3d2a6b">Nothing here yet</text>
  <text x="960" y="214" text-anchor="middle" font-size="10" fill="#5b4a7a">The lesson declares no</text>
  <text x="960" y="230" text-anchor="middle" font-size="10" fill="#5b4a7a">static members. (The compiler</text>
  <text x="960" y="246" text-anchor="middle" font-size="10" fill="#5b4a7a">caches lambdas in hidden ones.)</text>
  <text x="40" y="374" font-size="10.5" fill="#444"><tspan font-weight="bold">A query you have not enumerated holds no results.</tspan> `deposits` in Memory/4 is an iterator that remembers WHERE to look (the list) and WHAT to look for (the lambda).</text>
  <text x="40" y="394" font-size="10" font-style="italic" fill="#888">ToList() is the moment that plan runs and a separate copy is built — which is why snapshot and deposits can disagree afterwards.</text>
</svg>
