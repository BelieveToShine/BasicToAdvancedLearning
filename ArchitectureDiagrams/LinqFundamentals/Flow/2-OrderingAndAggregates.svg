<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#333"/></marker>
  </defs>
  <rect x="0" y="0" width="900" height="520" fill="#ffffff"/>
  <text x="450.0" y="20" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a237e">Ordering and aggregates — Sub-level Flow: a scoreboard</text>
  <text x="450.0" y="38" text-anchor="middle" font-size="11" fill="#666">The same five amounts go to four judges. OrderBy sorts (ToList() keeps the result); Sum, Max and Count each announce one number.</text>
  <text x="450" y="50" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#274e13">START</text>
  <line x1="450" y1="54" x2="450" y2="92" stroke="#333" stroke-width="2"/>
  <polygon points="450,54 450,72 480,63" fill="#38761d"/>
  <line x1="450" y1="92" x2="450" y2="100" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="250" y="100" width="400" height="50" rx="8" fill="#e8f4fb" stroke="#3d85c6" stroke-width="1.5"/>
  <text x="450" y="122" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1a4a73">amounts  =  200 · -900 · 50 · 1200 · -75</text>
  <text x="450" y="140" text-anchor="middle" font-size="9.5" fill="#555">the same list goes to all four judges</text>
  <line x1="450" y1="150" x2="450" y2="176" stroke="#333" stroke-width="1.6"/>
  <polyline points="450,176 135,176 135,212" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <polyline points="450,176 345,176 345,212" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <polyline points="450,176 555,176 555,212" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <polyline points="450,176 765,176 765,212" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="40" y="214" width="190" height="96" rx="8" fill="#eaf6ea" stroke="#6aa84f" stroke-width="1.5"/>
  <text x="135" y="236" text-anchor="middle" font-size="9" font-weight="bold" fill="#274e13">OrderBy(amount =&gt; amount)</text>
  <text x="135" y="254" text-anchor="middle" font-size="9.5" fill="#333">plans the sorted order;</text>
  <text x="135" y="268" text-anchor="middle" font-size="9.5" fill="#333">.ToList() builds a NEW list</text>
  <text x="135" y="292" text-anchor="middle" font-size="10" font-weight="bold" fill="#274e13">-900 · -75 · 50 · 200 · 1200</text>
  <rect x="250" y="214" width="190" height="96" rx="8" fill="#fffbe8" stroke="#f1c232" stroke-width="1.5"/>
  <text x="345" y="236" text-anchor="middle" font-size="9" font-weight="bold" fill="#7f6000">Sum()</text>
  <text x="345" y="258" text-anchor="middle" font-size="9.5" fill="#333">adds every amount</text>
  <text x="345" y="286" text-anchor="middle" font-size="10" font-weight="bold" fill="#7f6000">= 475</text>
  <rect x="460" y="214" width="190" height="96" rx="8" fill="#fdebd9" stroke="#e69138" stroke-width="1.5"/>
  <text x="555" y="236" text-anchor="middle" font-size="9" font-weight="bold" fill="#8a5a10">Max()</text>
  <text x="555" y="258" text-anchor="middle" font-size="9.5" fill="#333">picks the biggest</text>
  <text x="555" y="286" text-anchor="middle" font-size="10" font-weight="bold" fill="#8a5a10">= 1200</text>
  <rect x="670" y="214" width="190" height="96" rx="8" fill="#f0eaf7" stroke="#8e63ce" stroke-width="1.5"/>
  <text x="765" y="236" text-anchor="middle" font-size="9" font-weight="bold" fill="#4a2e73">Count(amount =&gt; amount &lt; NoMoney)</text>
  <text x="765" y="258" text-anchor="middle" font-size="9.5" fill="#333">counts the withdrawals</text>
  <text x="765" y="286" text-anchor="middle" font-size="10" font-weight="bold" fill="#4a2e73">= 2</text>
  <polyline points="135,310 135,340 450,340" fill="none" stroke="#333" stroke-width="1.6"/>
  <polyline points="345,310 345,340 450,340" fill="none" stroke="#333" stroke-width="1.6"/>
  <polyline points="555,310 555,340 450,340" fill="none" stroke="#333" stroke-width="1.6"/>
  <polyline points="765,310 765,340 450,340" fill="none" stroke="#333" stroke-width="1.6"/>
  <line x1="450" y1="340" x2="450" y2="356" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="450" y="370" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#990000">END</text>
  <line x1="450" y1="378" x2="450" y2="418" stroke="#333" stroke-width="2"/>
  <polygon points="450,378 450,396 480,387" fill="#cc0000"/>
  <text x="30" y="450" font-size="10.5" fill="#444"><tspan font-weight="bold">Sorting and counting leave the list alone:</tspan> OrderBy(…).ToList() builds a new sorted list; the aggregates only read amounts and hand back one number each.</text>
  <text x="30" y="468" font-size="10" font-style="italic" fill="#888">Console.WriteLine prints the sorted list, the untouched original, and one line with Sum, largest and withdrawals — three lines.</text>
  <text x="30" y="486" font-size="10" font-style="italic" fill="#888">Each method also opens with PrintHeading(): four more Console.WriteLine calls for the title banner (not drawn).</text>
  <text x="30" y="504" font-size="10" font-style="italic" fill="#888">Edge case: on an EMPTY list Max() throws InvalidOperationException, while Sum() simply returns 0.</text>
</svg>
